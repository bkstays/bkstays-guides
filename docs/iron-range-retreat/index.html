e, 0.8-mile loop<\/li><li><strong>Northface Trail<\/strong>: Difficult, 1.1 miles one way<\/li><li><strong>Birches Trail<\/strong>: Moderate, 2.2-mile loop<\/li><li><strong>Sleeping Giant Trail<\/strong>: Difficult, 1.3 miles one way<\/li><li><strong>Narrows Trail<\/strong>: Easy, 0.8-mile loop<\/li><li><strong>Mesabi Trail<\/strong>: Paved multi-use trail for hiking, biking, and walking, accessible just outside the ski chalet (spring through fall)<\/li><\/ul><p>Whether you want a short stroll or a challenging hike, Giants Ridge has a trail for you.<\/p><p>Hiking map: <a href=\"https://www.giantsridge.com/wp-content/uploads/2025/05/Giants-Ridge-HIKING-map-68209-L-scaled.jpg\">Giants Ridge Hiking Trail Map<\/a><br/>More info: <a href=\"https://www.giantsridge.com/hiking/\">giantsridge.com/hiking<\/a><\/p>", "photo": "4283519679566f0f95cc5999f9422cc8.jpg", "id": "hiking-trails"}, {"title": "Mountain Biking", "html": "<p><strong>Mountain Biking at Giants Ridge<\/strong><\/p><p>Giants Ridge offers over 9 miles of purpose-built cross-country trails through the Superior National Forest, ideal for all levels of riders. For more thrill, ride the Sarajevo Express chairlift to 12 gravity trails featuring berms, jumps, and rugged terrain&mdash;from beginner-friendly green to double black diamond.<\/p><p>A valid pass is required. Full-face helmets are highly recommended on all gravity trails.<\/p><p><strong>Season:<\/strong> Lift-served biking runs late May through mid-October; the 2026 bike park season is over and 2027 dates have not been announced.<br/><strong>Last posted day tickets (gravity):<\/strong> Adult (13+) $42 online / $47 in person; Child (7&ndash;12) $32 online / $35 in person. XC-only day pass $6.<\/p><p>More info and trail map: <a href=\"https://www.giantsridge.com/mountain-biking/\">giantsridge.com/mountain-biking<\/a><\/p>", "photo": "54d4d73834cd101128f300d83328ba6f.jpg", "id": "mountain-biking"}, {"title": "Scenic Chairlift Rides", "html": "<p>Take in stunning views of the Superior National Forest with a relaxing ride on the <em>Sarajevo Express<\/em>, Giants Ridge&rsquo;s high-speed quad chairlift. At the top, enjoy breathtaking vistas of the Iron Range&mdash;an unforgettable way to experience the beauty of the mountain, especially during fall colors.<\/p><p><strong>Season:<\/strong> Summer and fall weekends (2026 fall rides ran Fri&ndash;Sun in September and Sat&ndash;Sun in October, 10 AM &ndash; 5/6 PM; last ride up one hour before close). Closed for the 2026 season.<br/><strong>Last posted rates:<\/strong> Adult $10, Child $5.<\/p><p>More info: <a href=\"https://www.giantsridge.com/scenic-chairlift-rides/\">giantsridge.com/scenic-chairlift-rides<\/a><\/p>", "photo": "98f7d2eda98452f5ca11e24e6cf94398.jpg", "id": "scenic-chairlift-rides"}, {"title": "Summer Equipment Rentals", "html": "<p>Explore the outdoors with easy gear rentals available right at Giants Ridge during the summer season.<\/p><p><strong>Hours:<\/strong> Open seven days a week in season, with two rental periods each day: 10 AM &ndash; 2 PM and 2 PM &ndash; 6 PM.<\/p><p><strong>Available rentals (prices previously posted; confirm current rates when booking):<\/strong><\/p><ul><li>Full-suspension enduro mountain bike (incl. full-face helmet): $75<\/li><li>Kids&rsquo; mountain bike: $45<\/li><li>Road bikes: Adult $28 | Kids $20<\/li><li>Full-face helmet only: $30<\/li><li>Disc golf discs: $5<\/li><\/ul><p>Book and learn more: <a href=\"https://www.giantsridge.com/summer-equipment-rentals/\">giantsridge.com/summer-equipment-rentals<\/a><\/p>", "photo": "961a88603c2a81abc9a8d6ba9c24512e.jpg", "id": "summer-equipment-rentals"}]}, {"title": "Winter & Snow", "items": [{"title": "Fat Tire Biking", "html": "<p>Giants Ridge is a pioneer in Minnesota&rsquo;s fat tire biking scene. Ride groomed winter trails including the North XC Loop, Norway, Miner&rsquo;s Mile, and designated Nordic trails, or take on lift-served fat biking on gravity trails like Tadpole, Ribbits, Leapfrog, and Kitty Cat.<\/p><p>With routes winding through the scenic Superior National Forest, this is winter biking at its best. Use purpose-built fat bikes only (tires 3.7&Prime; or wider, 10 psi or less), yield to skiers, and stay out of classic ski tracks.<\/p><p><strong>Last posted rates:<\/strong> Lift &amp; trail pass $32 (lift-served passes sold online only); trail pass only $18; fat bike rental $40 per session (9 AM &ndash; 12 PM or 1 &ndash; 4 PM, limited to 8 riders).<\/p><p>More info: <a href=\"https://www.giantsridge.com/fat-tire-biking/\">giantsridge.com/fat-tire-biking<\/a><\/p>", "photo": "66e3ee47de09265e46b132b297799a73.jpg", "id": "fat-tire-biking"}, {"title": "Giants Ridge Winter Trail Map", "html": "<p>Explore Giants Ridge with ease using the winter trail map. It shows 35 alpine runs served by five chairlifts (Sarajevo Express, Calgary, Helsinki, Chamonix, and Rocky Top) plus conveyor and tow lifts, along with the snow tubing park, Nordic and snowshoe trails, fat-bike routes, and resort buildings including the Pool &amp; Sauna Haus.<\/p><p>Trail &amp; ski map: <a href=\"https://www.giantsridge.com/wp-content/uploads/2025/03/2024-Alpine-Map-FInal-scaled.jpg\">Giants Ridge Alpine Trail Map<\/a><br/>Snowshoe map: <a href=\"https://www.giantsridge.com/wp-content/uploads/2025/01/Giants-Ridge-Snowshoe-map-67100.pdf\">Snowshoe Trail Map (PDF)<\/a><\/p>", "photo": "719e70cf9b267b7fbe4d5537b0304d26.jpg", "id": "giants-ridge-winter-trail-map"}, {"title": "Nordic Skiing", "html": "<p>Giants Ridge is a premier Nordic skiing destination with a rich history&mdash;its trail system once served as a training ground for the U.S. Ski Team. Today, skiers of all ages and skill levels can explore miles of scenic trails through the Superior National Forest, with options ranging from green to black, including the lighted Northern Light trail (lights off at 8 PM).<\/p><p>Whether you're out for a peaceful glide or a serious workout, you&rsquo;ll find the perfect trail here.<\/p><p><strong>Trail passes (2025&ndash;26 rates; 2026&ndash;27 not yet posted):<\/strong> Full day $18 adult / $10 child; night $11 adult / $10 child. Waxless rental package $18 adult / $12 child.<\/p><p>More info: <a href=\"https://www.giantsridge.com/cross-country-skiing/\">giantsridge.com/cross-country-skiing<\/a><\/p>", "photo": "f7dab522f43da879db143a8df73adb55.jpg", "id": "nordic-skiing"}, {"title": "Skiing & Snowboarding", "html": "<p>Hit the slopes at Giants Ridge for an unforgettable winter adventure. With 35 well-groomed runs for all skill levels, top-quality ski and snowboard rentals, and affordable daily tickets and season passes, it&rsquo;s the perfect spot for beginners and seasoned pros alike.<\/p><p>Everything you need for a great day on the mountain is right here.<\/p><p><strong>Season:<\/strong> Winter opening day is announced as Nov. 27, 2026 (weather permitting); closing date depends on conditions.<\/p><p><strong>2026&ndash;27 highlights:<\/strong><\/p><ul><li>Kids 12 and under ski and ride free all season (proof of age required; kids get a media card on their first visit)<\/li><li>Thursday Night Lights: free skiing 4&ndash;8 PM on Thursdays, starting Dec. 31<\/li><\/ul><p>Buy lift tickets and rentals online in advance. Daily lift ticket prices are listed on the Giants Ridge online shop.<\/p><p>More info: <a href=\"https://www.giantsridge.com/skiing-snowboarding/\">giantsridge.com/skiing-snowboarding<\/a><br/>Lift tickets &amp; season passes: <a href=\"https://www.giantsridge.com/winter-season-passes/\">giantsridge.com/winter-season-passes<\/a><\/p>", "photo": "5dd731b69f52bdf75bb768548108ce3e.jpg", "id": "skiing-snowboarding"}, {"title": "Snow Tubing", "html": "<p>Snow tubing is a must-try winter activity that's fun for all ages&mdash;no experience needed! Glide down one of three tubing lanes, then ride the handle tow back up for more. It&rsquo;s an easy, exciting way to enjoy the snow with family and friends.<\/p><p><strong>Hours (2025&ndash;26 schedule):<\/strong> Saturdays, 10:00 AM &ndash; 4:45 PM. Check the website for the 2026&ndash;27 schedule.<br/>Riders must be at least 5 years old and 42 inches tall. Snow boots required (no ski boots). Tickets must be bought online in advance.<\/p><p>More info: <a href=\"https://www.giantsridge.com/snow-tubing/\">giantsridge.com/snow-tubing<\/a><\/p>", "photo": "cfc29f4f5c02938036cfe3f79558d5f4.jpg", "id": "snow-tubing"}, {"title": "Snowshoeing", "html": "<p>Explore the quiet beauty of winter on about 3.6 miles of scenic snowshoe trails. Wander through peaceful Northwoods landscapes along the Sleeping Giant (1.1 mi), North Face (1.2 mi), and Narrows (1.3 mi) trails&mdash;some even wrapping around Wynne Lake.<\/p><p>A great way to enjoy the outdoors at a slower pace, surrounded by the natural beauty of the Superior National Forest. Snowshoe rentals are $14 per day at the rental shop.<\/p><p>Snowshoe map: <a href=\"https://www.giantsridge.com/wp-content/uploads/2025/01/Giants-Ridge-Snowshoe-map-67100.pdf\">Snowshoe Trail Map (PDF)<\/a><br/>More info: <a href=\"https://www.giantsridge.com/snowshoeing/\">giantsridge.com/snowshoeing<\/a><\/p>", "photo": "4a693c14dced01065063a33efee2a032.jpg", "id": "snowshoeing"}, {"title": "Winter Equipment Rentals", "html": "<p>Rent everything you need for a day on the slopes—from skis and snowboards to snowshoes and fat tire bikes. All downhill packages include a helmet and are fitted by certified rental technicians.<\/p> <p><strong>Rental Options Include:<\/strong><\/p> <ul> <li> <p><strong>Alpine &amp; Snowboard Gear<\/strong><\/p> <\/li> <li> <p><strong>Nordic Ski Equipment<\/strong><\/p> <\/li> <li> <p><strong>Snowshoes<\/strong><\/p> <\/li> <li> <p><strong>Fat Tire Bikes<\/strong><\/p> <\/li> <\/ul> <p><strong>Ski &amp; Snowboard Rental Pricing:<\/strong><br/><em>Includes skis/snowboard, boots, poles, and helmet<\/em><\/p> <ul> <li> <p><strong>Adult (13+):<\/strong> $39<\/p> <\/li> <li> <p><strong>Youth (7–12):<\/strong> $29<\/p> <\/li> <li> <p><strong>Child (6 &amp; under):<\/strong> $14<\/p> <\/li> <li> <p><em>High-performance package: $53 (Adult)<\/em><\/p> <\/li> <\/ul> <p><strong>Add-Ons &amp; A La Carte Options:<\/strong><\/p> <ul> <li> <p>Skis/Board only: $32 (Adult), $21 (Youth)<\/p> <\/li> <li> <p>Boots: $18 (Adult), $14 (Youth), $12 (Child)<\/p> <\/li> <li> <p>Poles: $6<\/p> <\/li> <li> <p>Helmet: $8<\/p> <\/li> <li> <p>High-performance gear available (extra fees apply)<\/p> <\/li> <\/ul> <p><strong>Booking Info:<\/strong><br/>Please <strong>purchase rentals and lift tickets online<\/strong> in advance. After checkout, waivers will be sent to your email—complete them before your visit. Pick up lift tickets at the desk before heading to rentals.<\/p> <p><strong>Other rentals:<\/strong> Nordic waxless package $18 (Adult) / $12 (Child); snowshoes $14/day; fat tire bikes $40 per session (9 AM&ndash;12 PM or 1&ndash;4 PM).<\/p> <p>Note: Rentals are first come, first served and subject to availability. Winter opening day is announced as Nov. 27, 2026 (weather permitting).<\/p> <p>More info: <a href=\"https://www.giantsridge.com/equipment-rentals/\">https://www.giantsridge.com/equipment-rentals/<\/a><br/>Questions? Call the Rental Shop at <strong>218-865-8024<\/strong><\/p>", "photo": "662017ed0eedcc7c850d145e8fdc9a7d.jpg", "id": "winter-equipment-rentals"}]}]}}, "signinUrl": "https://script.google.com/macros/s/AKfycbyH0rEgRqprQRh7Kf4lDv1QUssPA7z4Jn7Od_cEGJWa8_TH9UwK0W4EjdJCiB6EX5DlMg/exec"}</script>
