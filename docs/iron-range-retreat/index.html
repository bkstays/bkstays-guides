<script type="application/json" id="guide-data">{"slug": "iron-range-retreat", "name": "Iron Range Retreat", "shortName": "Iron Range Retreat", "welcome": "Welcome!", "hostedBy": "Hosted By Brandon & Katharina", "address": "5935 Voyageurs Trail, Biwabik, MN 55708", "location": [47.548429, -92.274243], "cover": "iron-range-retreat-view.jpg", "coverDesktop": "iron-range-retreat-view.jpg", "background": "iron-range-retreat-view.jpg", "contact": {"phone": "404-358-1552", "sms": "404-358-1552", "email": ""}, "gate": true, "oldLinks": ["/guest/bMSKv5OUNYgyb/"], "layout": [{"heading": "Your Stay", "sections": ["add-to-phone", "welcome", "check-in-arrival", "check-out-departure", "rules", "cancellation-policy", "about-us", "contact-us"]}, {"heading": "The Home", "sections": ["sauna", "bbq-grill", "outdoor-games-fun", "fireplace-firepit", "hot-tub", "indoor-games-fun", "kitchen", "laundry", "playground", "thermostat", "trash", "tv-streaming", "voyageurs-retreat", "wifi"]}, {"heading": "Explore the Area", "sections": ["dining", "emergency", "giants-ridge", "golf", "grocery", "shopping", "weather"]}], "sections": {"add-to-phone": {"id": "add-to-phone", "title": "Add This Guide To Your Phone", "icon": "smartphone", "groups": [{"title": "", "items": [{"title": "Add This Guide To Your Phone", "html": "<p>When you first access this guidebook on your phone, you'll notice a prompt to add it to your home screen. <strong>This is highly recommended<\/strong> because it makes the guide faster and easier to access. And it remains accessible offline. <\/p><p>Following the prompt will add an app icon to your phone. It's just like any other app, but without you needing to download anything or sign in! <\/p><p>Doing this means that every time you want to access the guide, you just need to tap the app instead of searching for the link in your inbox - much easier! <\/p><h2><strong>Adding the app if you’re an Apple user<\/strong><\/h2><p>If you have an Apple device, the \"Add to Home Screen\" option won’t appear for you unless you’re using Safari browser. Don’t worry, this is really simple to solve - just copy the guidebook link and paste it into Safari. From there, you can follow the prompts to add the guidebook to your home screen.<\/p><h2><strong>Always get the latest version of the guidebook <\/strong><\/h2><p>Our guidebook is regularly updated with information designed to help you get the most out of your stay. To avoid missing out on any of these updates, the app automatically updates every 24 hours. If you want to get the updates sooner, just refresh the screen every time you open the guidebook from your home screen - this way you’ll always get the latest version. To refresh the app, swipe the app closed, and tap the app icon again to fully reload. <\/p><h2><strong>Share your guide with your group<\/strong><\/h2><p>You can send the link to this guidebook to everyone who’s travelling with you. That way, everyone has access to all the information they’ll need (which means less hassle for the trip organizer!). <\/p>", "photoHidden": "eb62c72e322ed4e278d8a01199f7aad2.jpg", "id": "add-this-guide-to-your-phone"}]}]}, "welcome": {"id": "welcome", "title": "Welcome", "icon": "cloud-sun", "groups": [{"title": "", "items": [{"title": "Welcome to Iron Range Retreat!", "html": "<p><strong>Welcome to the Iron Range Retreat!<\/strong><\/p> <p>Here is everything you need for your stay with us, from planning your time prior to departure to the Giants Ridge area, all the way through checkout. In this easy-to-navigate link, you will find information about the cabin, ideas of things to do in the area, our Wi-Fi login credentials, and so much more.<\/p> <p>In order to best enjoy your time in our home, we encourage you to add this \"app\" to your phone. All of the content will even be accessible when your phone is offline.<\/p> <p>* It's not really an \"app\", but more a tool for easy access on your home screen <\/p> <ul> <li>For iPhone: <ul> <li>Tap the square with arrow pointing up at the bottom of your screen<\/li> <li>Select \"Add to Home Screen\"<\/li> <\/ul> <\/li> <li>For Android: <ul> <li>Tap \"Add to Home Screen\" where prompted when first accessing the site<\/li> <\/ul> <\/li> <\/ul> <p><strong>Print or Save a PDF<\/strong><br/>If you would like to print certain pages ahead of traveling, or if you'd like to save a PDF to your device, just tap the print button above. It won't print right away, but will create a PDF which you can save or print.<\/p> <p><strong>Contacting Us<\/strong><br/>We pride ourselves on swiftly meeting guest needs. We can be reached as follows:<\/p> <ul> <li>Preferred: Airbnb or VRBO message<\/li> <li>Phone: 404-358-1552 (emergencies)<\/li> <li>Instagram: @<a href=\"https://www.instagram.com/bk_stays/\">Bk_stays<\/a><\/li> <li>Facebook: <a href=\"https://www.facebook.com/profile.php?id=61551815370553\">BK Stays<\/a><\/li> <\/ul> <p><strong>What Next?<\/strong><br/>Please relax, unwind, have fun, and enjoy your stay!<\/p>", "photo": "abcb847cae6e6d8d41aa65f0688e170e.jpg", "id": "welcome-to-iron-range-retreat"}, {"title": "Video Tour - Iron Range Retreat", "html": "<p>Welcome to The Iron Range Retreat! <br><br>This massive 6,000 sqft home has 6 bedrooms, 5 bathrooms, sleeps 20 guests, and is loaded with amenities! It is centrally located near Giants Ridge Ski Resort, The Quarry &amp; Legend Golf Courses, and has public boat and lake access in Voyageurs Retreat. Enjoy a barrel sauna, jacuzzi, game room, outdoor playground, firepit, both lake and ski slope views. This is the ultimate Minnesota escape up north for large groups of family and friends, all year long!<\/p> <p><iframe src=\"https://www.loom.com/embed/ae9577919c37413297fc13323b112b77?sid=fb782ac9-4ff0-4e1d-b226-8c5c9c027096\"><\/iframe><\/p>", "photo": "e26882150776b7f46e04cbbdb11777da.jpg", "id": "video-tour-iron-range-retreat"}, {"title": "Thank You", "html": "", "video": "https://www.loom.com/embed/b28bdc96ce854c8380b64e6ebe4f1cb7", "id": "thank-you"}]}]}, "check-in-arrival": {"id": "check-in-arrival", "title": "Check In + Arrival", "icon": "key-round", "groups": [{"title": "", "items": [{"title": "Driving Directions", "html": "<p>We could post turn-by-turn directions here.<\/p> <p>OR - you could just use <strong>Waze or Google Maps<\/strong>.<\/p> <p>Either option will get you to the home ;)<\/p> <p><strong>Address: 5935 Voyageurs Trail, Biwabik, MN 55708<\/strong><\/p>", "photo": "086591e685171217b89de3694e2b3326.jpg", "id": "driving-directions"}, {"title": "Access Codes / Instructions", "html": "<p>The Access Code for the front door is<\/p> <p>1552<\/p> <p>To lock the door, simply press the lock button. Please make sure all external doors are locked whenever you leave.<\/p> <p>* If for some reason the code doesn't work please call me at <a href=\"tel:404-358-1552\">404-358-1552<\/a>. I will get you the lockbox code for the spare key!<\/p>", "photo": "730742e2babb8d2cedbe0a30eac61d46.jpg", "id": "access-codes-instructions"}, {"title": "4:00 PM Check-in", "html": "<p>If you would like an early check-in, please see our <a href=\"#/info/check-in-arrival/early-check-in-half-day-stay-option\">Early Check In (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 4:00 PM is a strict check-in time. If you are arriving early, take a look at the Explore the Area section. We've listed a few things to do around the area while we prepare the home!<\/p>", "photo": "11e339c716ed8af07a28c05e286c2caa.jpg", "id": "4-00-pm-check-in"}, {"title": "Early Check In (Half Day Stay Option)", "html": "<p>Want to get here early? Add a <strong>Half Day Stay<\/strong> and you can arrive as early as <strong>8:00 AM<\/strong> on your arrival day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer early check-in because of our tight cleaning and maintenance schedule.<\/p>", "photo": "6db9b8952aaf5792e4af093537545794.jpg", "id": "early-check-in-half-day-stay-option"}]}]}, "check-out-departure": {"id": "check-out-departure", "title": "Check Out + Departure", "icon": "hand", "groups": [{"title": "", "items": [{"title": "10:00 AM Check-out", "html": "<p>If you would like a late check-out, please see our <a href=\"#/info/check-out-departure/late-check-out-half-day-stay-option\">Late Check Out (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 10:00 AM is a strict check-out time. <\/p>", "photoHidden": "ea9c00f35f36edb8d89dcc92e7f562cc.jpg", "id": "10-00-am-check-out"}, {"title": "Late Check Out (Half Day Stay Option)", "html": "<p>Not ready to leave? Add a <strong>Half Day Stay<\/strong> and you won't need to check out until <strong>8:00 PM<\/strong> on your departure day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer late check-out because of our tight cleaning and maintenance schedule.<\/p>", "photoHidden": "6db9b8952aaf5792e4af093537545794.jpg", "id": "late-check-out-half-day-stay-option"}, {"title": "Extended Stay?", "html": "<p>Would you like to add another night? If we have availability the day before or after your reservation, we would love to offer you that extra night at a great discount. We'll even cover the taxes and fees! Just let us know if your travel plans are flexible and we will make sure to accommodate the changes!<\/p>", "photoHidden": "585cb6b5ac72b31289b8dae13c068a03.jpg", "id": "extended-stay"}, {"title": "Check-out Process", "html": "<p>Standard check-out is at 10:00 AM on your departure date (Unless you've paid for a late check-out). <\/p> <p>When you've finished your stay, technically, you can just leave no questions asked lol :) But, if you really wanted to give our cleaning team some love, we would appreciate it if you would take care of a few simple things:<\/p> <ul> <li>Dishwasher - Load and start the dishwasher<\/li> <li>Grill - Please clean it if used<\/li> <li>Jacuzzi - Close and latch the lid <\/li> <li>Sauna - Close the door.<\/li> <li>Towels - Place all used towels in the shower.<\/li> <li>Trash - This is critical! Please review our trash section <a href=\"#/info/trash\">here<\/a>.<\/li> <li>Lock Up - Lock all doors<\/li> <\/ul> <p>We hope you guys had an amazing stay! Thank you again and safe travels back home.<\/p>", "id": "check-out-process"}, {"title": "Lost and Found", "html": "<p>Please triple-check the home before departing to ensure you have not left anything behind. Common items left behind include phone chargers, computer cords, passports/licenses, clothes, electronics, eyeglasses, toiletries/makeup, documents, and toys.<\/p><p>Please send a message the moment you realize you've left something behind. <br><br>We completely understand that things can get left behind — and we’re more than happy to help get your items back to you! We’ll gladly ship your lost item using the postal service or carrier of your choice (standard, express, or overnight). <br><br>We kindly ask for the shipping cost, plus a $20 service fee to cover the time and materials for packaging and handling. Be certain to include:<\/p><ul><li>Item description<\/li><li>Where you think you may have left the item<\/li><li>The name on the reservation<\/li><\/ul><p>Just let us know how you’d like it sent, and we’ll take care of the rest!<\/p>", "photoHidden": "8da278ec14e085d81ebe06c22b24af10.jpg", "id": "lost-and-found"}]}]}, "rules": {"id": "rules", "title": "Rules and Regulations", "icon": "book-open", "groups": [{"title": "", "items": [{"title": "Age Requirement", "html": "<p>The minimum age requirement to book is 25 years of age. The home is child friendly, but not childproof, and may not be suitable for infants or children without adult supervision.<\/p>", "id": "age-requirement"}, {"title": "Confetti / Glitter", "html": "<p><strong>No Confetti or Glitter<\/strong><br>We understand that special occasions call for celebration - and sometimes decorations! However, confetti and glitter are extremely difficult to clean and can cause damage to furniture and floors. Any evidence of confetti or glitter left behind will incur additional cleaning fees. Please celebrate responsibly and help us keep the home in great condition - no confetti or glitter, please.<\/p>", "id": "confetti-glitter"}, {"title": "Damages", "html": "<p>Guests are financially responsible for any damage, theft, missing items, or violations of house rules during their stay. You could be charged for: Property damage or theft; Unauthorized pets; Excessive cleaning or evidence of smoking; Exceeding occupancy or parking limits; Any other violations outlined in this agreement. You will be notified in writing if any damage is found. Major damage that delays the next check-in may result in additional charges for guest relocation or compensation. Please report any existing damage at check-in, and notify us right away if anything breaks or is damaged during your stay, even if it’s small. We understand accidents happen and can often replace or repair items quickly if we're informed. Guests are responsible for damage caused by misuse or negligence.<\/p>", "id": "damages"}, {"title": "Fire Safety and Prevention", "html": "<p>Guest agrees to comply with all local, county, and state fire restrictions, including any active burn bans or official fire safety regulations. Guest is responsible for helping maintain a fire-safe environment throughout their stay. This includes, but is not limited to; Ensuring that all outdoor fires (e.g., bonfires or fire pits) are fully extinguished after use, before going to bed, and before vacating the property; Never leaving open flames or burning embers unattended; Using only designated fire areas and keeping all fires small, controlled, and manageable; Ensuring fire extinguishers located in the home are accessible at all times and used in case of fire emergencies.<\/p><p>Additionally, Guest(s) acknowledges that outdoor grills must be cleaned and properly maintained after each use to prevent fire hazards. Guest agrees to: Clean the grill thoroughly after each use; Remove all grease and dispose of it safely in the trash (never on the ground or around the property); Ensure the grill is turned off, left in safe, clean, and operable condition, and covered if applicable; Keep a fire extinguisher nearby when using the grill.<\/p><p>Failure to follow fire safety guidelines may result in fines, eviction, or financial liability for any resulting damages.<\/p>", "id": "fire-safety-and-prevention"}, {"title": "Jacuzzi", "html": "<p>Never Add Any Foreign Substance To The Jacuzzi (No Bubbles or Soaps)!<\/p> <p>Always Put The Cover Back On When Not In Use!<\/p> <p>Do Not Raise The Temp Above 102°F<\/p> <p>The jacuzzi is thoroughly inspected after each guest. Failure to adhere will cause additional maintenance and cleaning measures, or worse, damage to the unit. Fines will be imposed if evidence of foreign substance or damage is found during inspection.&nbsp;<br><br><strong>Please refer to the &ldquo;Hot Tub/Jacuzzi&rdquo; section in the guide for full details and usage instructions.<br><iframe src=\"https://www.loom.com/embed/869ce97a675a4131b1d26d88691f3c89?sid=27a0c5a0-7ead-4947-8d57-641364f2c877\"><\/iframe><\/strong><\/p>", "photoHidden": "864611f47f3e9d662b42f905bc72800a.jpg", "id": "jacuzzi"}, {"title": "No Commercial Use", "html": "<p>This home is for private stays only. No commercial use of any kind is allowed. That means no retreats, workshops, classes, shoots or paid events, no charging admission, no selling or renting rooms, and no using our photos or property name to promote anything.<\/p><p>Planning something special? Ask us before you arrive. Events require our written approval and a signed agreement.<\/p><p>Violations will result in <strong>immediate eviction without refund<\/strong>, <strong>loss of your security deposit<\/strong>, a report to the platform you booked through, and possible legal action to recover damages.<\/p>", "id": "no-commercial-use"}, {"title": "Occupancy - Max 20 Person(s)", "html": "<p>This home has a maximum occupancy of <strong>20 person(s)<\/strong>, and no more than 20 people may be on the property at any time. Occupancy is set by square footage, bedroom count and septic capacity under Minnesota Department of Health regulations.<\/p><p>Please contact us before arrival if you'd like to request additional guests. Unapproved guests or exceeding the occupancy limit <strong>will result in the loss of your security deposit<\/strong> and may lead to immediate eviction without refund.<\/p>", "id": "occupancy-max-20-person-s"}, {"title": "Parking Rules - HOA Regulated", "html": "<p>Parking is limited to <strong>eight (8) vehicles<\/strong>: two (2) in the garage (if needed) and six (6) in the driveway. Parking on the grass is not allowed and may result in fines or damage charges.<\/p><p>Commercial vehicles, buses and inoperative or unlicensed vehicles or recreational equipment of any type may not be kept, parked or stored anywhere on the Property except within a Dwelling&rsquo;s garage.<\/p> <p>No operable passenger vehicles, lawn tractors, trailers, motorcycles, golf carts, snowmobiles, watercraft or other recreational equipment may be parked, kept or stored on the Property (i) within 30 feet from the right of way of the common roadway or within 10 feet from the property line of any Unit, or (ii) for more than fourteen (14) consecutive days, unless parked, kept or stored within a garage or otherwise screened in a manner such that the items are not visible from another Unit, any community association common element, the lake, or the common roadway. Such vehicle/equipment shall be kept and maintained in a clean and orderly condition.<\/p> <p>Parking and storage upon the streets serving the Property is prohibited except in those areas designated by appropriate signage as permitting parking.<\/p>", "photo": "55cf97cc813b430cc35652a9ba374ff3.jpg", "id": "parking-rules-hoa-regulated"}, {"title": "Pet Policy - Max 2 Dogs (with approval)", "html": "<p>This home is pet-friendly, so you can bring your furry friend from home! <strong>Max 2 dogs allowed<\/strong> per stay, with approval. Hypoallergenic breeds are preferred.<\/p><p>All pets must be on your reservation. Please let us know beforehand so we can take the proper cleaning measures. A <strong>$150 pet fee<\/strong> will be added to your reservation for any approved pet before arrival.<\/p><p>If you bring a pet without notifying your hosts, you will be charged <strong>double<\/strong> for any unapproved pet.<\/p>", "id": "pet-policy-max-2-dogs-with-approval"}, {"title": "Quiet Hours", "html": "<p>Quiet hours are <strong>10:00 PM to 8:00 AM<\/strong>. During this time, please keep outdoor music, loud conversations and any other disruptive noise to a minimum out of respect for our neighbors and HOA rules.<\/p>", "id": "quiet-hours"}, {"title": "Reservation Adjustments", "html": "<p>If you need to make any change in your stay, for example, regarding the number of guests, bringing a service animal or anything at all, please let us know ahead of time so we can accommodate you. However, if you do not disclose any changes, like an animal or extra guests (above max occupancy) you could be subject to a reservation cancellation without refund. <\/p>", "id": "reservation-adjustments"}, {"title": "Security Camera", "html": "<p>Guests acknowledge and accept there are cameras located on the exterior of the property. Guests hereby acknowledge that the cameras location records video directly in front of the front entrance door and leading to the parking area, and this constitutes a public area. Guests understand that video may be captured, and no conversations located within this area may be deemed confidential. The intent of this camera is not to infringe on the privacy of Guests, but to serve as a safety and security measure.<\/p>", "id": "security-camera"}, {"title": "Septic and Plumbing", "html": "<p>Please <strong>only put toilet paper<\/strong> in the toilet and throw the remaining in the trash!<\/p><p>Tampons, baby wipes, paper towels, or anything other than toilet paper in the toilet will clog the drain/tank. This can result in clogged toilets, and septic damage and will result in damage fees.<\/p>", "id": "septic-and-plumbing"}, {"title": "Smoking", "html": "<p>Smoking of any kind (cigarettes, cigars, pipes, vaping, e-cigarettes, marijuana or other drugs) is not allowed anywhere on the property, indoors or outdoors, unless you have our written permission in advance.<\/p><p>Evidence of smoking, including smoke odor, ash, butts, paraphernalia or related trash left inside or outside the home, <strong>will result in the loss of your security deposit<\/strong>, plus the cost of odor removal and cleaning, and may result in eviction without refund.<\/p>", "id": "smoking"}, {"title": "Trash", "html": "<p>Please check the <a href=\"#/info/trash\">\"Trash\"<\/a> section in the guide for full instructions on where and how to dispose of your garbage.<\/p>", "photo": "7af01a3ccf3e47a8c389e6a8ad3a0564.jpg", "id": "trash"}]}]}, "cancellation-policy": {"id": "cancellation-policy", "title": "Cancellation Policy", "icon": "circle-x", "groups": [{"title": "", "items": [{"title": "Cancellation Policy", "html": "<p>Our cancellation policy varies by platform (Airbnb, VRBO, Direct, etc.) and will have been clearly stated at the time of booking under one of the following categories: strict, firm, moderate, or flexible.<\/p><p>We strongly recommend purchasing travel insurance to protect your investment. If you purchased travel insurance, please contact your provider for help with cancellations or disruptions.<\/p><p><strong>State of Emergency / Evacuations<\/strong><\/p><p>If travel insurance was not purchased, cancellations are handled per the terms of your reservation. Exceptions may be made only when <strong>both<\/strong> of the following apply:<\/p><ul><li>A <strong>Governor-issued State of Emergency<\/strong> has been declared for <strong>St. Louis County, Minnesota<\/strong> (the county where the home is located), <strong>and<\/strong><\/li><li>A <strong>mandatory evacuation order or travel restriction<\/strong> is actively in effect for the property's address during your reservation dates.<\/li><\/ul><p>General weather advisories or conditions affecting other areas do not qualify.<\/p><p><strong>If the Home Becomes Unavailable<\/strong><\/p><p>In the event the property becomes unavailable due to circumstances beyond the host's control, including but not limited to fire, flood, structural damage, utility failure, or a government-declared emergency, the host reserves the right to cancel a confirmed reservation. In such circumstances, guests will receive a full refund of all amounts paid and the host's liability shall be limited solely to that refund.<\/p>", "id": "cancellation-policy"}]}]}, "about-us": {"id": "about-us", "title": "About Us", "icon": "users", "groups": [{"title": "", "items": [{"title": "About Your Hosts", "html": "<p>Our first trip to North Georgia was way back in the summer of 2021 and we undeniably fell in love. The mountain vibes left such a good impression, that we decided as a family to find a home away from home. The surrounding area has so much to offer for families, friends, and couples during every season of the year. We have had the chance to experience so much that Blue Ridge, Ellijay, and the North Georgia Mountains have to offer, but we still have a long bucket list waiting for our next adventure. We have a 6-year-old daughter and a 3-year-old son and love traveling and spending time exploring new places as a family.<\/p>", "photo": "about-us-family-collage.jpg", "photoFit": "full", "id": "about-your-hosts"}]}]}, "contact-us": {"id": "contact-us", "title": "Contact Us / Book Again", "icon": "phone", "groups": [{"title": "", "items": [{"title": "Thank You For Staying With Us", "html": "<p><strong>Thank you for staying with us, and we hope you enjoyed your stay.<\/strong> If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time. <\/p><p><strong>We love online reviews!<\/strong><\/p><p>Vrbo and Airbnb automatically sends you a review request. All you need to do is click the \"leave a review\" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. Was it the comfy beds; the local information and recommendations; or perhaps the location and all the fun activities to do at the home?<\/p><p><br><strong>Thank you!<\/strong><\/p><p>Brandon and Katharina <\/p>", "photoHidden": "4d239b49ed0744691981d3decf88b377.jpg", "id": "thank-you-for-staying-with-us"}, {"title": "Returning Guests", "html": "<p>We would love to have you stay again! In fact, please take advantage of booking directly with us at <a href=\"https://www.bkstays.com/about-us\">bkstays.com <\/a>- please reach out to us on Instagram, Facebook, or directly to Brandon at 404 - 358 - 1552. <\/p>", "photoHidden": "5e53f078d45d701f01a19dcba10f0cc7.jpg", "id": "returning-guests"}, {"title": "Follow Us On Social Media", "html": "<p>Let's Be Social! Follow Us On Social Media Below<\/p><p>Facebook: BK Stays<\/p><p>Instagram: @bk_stays<\/p>", "photoHidden": "067e96592ab64bb41d8e0f51c9754500.jpg", "id": "follow-us-on-social-media"}, {"title": "How To Contact Us", "html": "<p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.  We can be reached at the contact info below:<\/p><ul><li>Message: through Airbnb / VRBO (simple assistance)<\/li><li>Phone: 1-404-358-1552 (emergencies)<\/li><li>Instagram or Facebook @ bk_stays<\/li><\/ul>", "photoHidden": "4f717eaaf0303b1fec1a0ee821f299a1.jpg", "id": "how-to-contact-us"}]}]}, "wifi": {"id": "wifi", "title": "WiFi / Internet Details", "icon": "wifi", "groups": [{"title": "", "items": [{"title": "Wi-Fi / Internet Details", "html": "<p>There is free Wi-Fi for your use. The details are: <br><br>Wi-Fi Name: Iron Range Retreat<\/p> <p>Wi-Fi Password: IronRangeRetreat<\/p> <p>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us.<\/p>", "photo": "5ed7c444a9811d008c50a348f27c69d5.jpg", "id": "wi-fi-internet-details"}]}]}, "sauna": {"id": "sauna", "title": "Barrel Sauna", "icon": "heater", "groups": [{"title": "", "items": [{"title": "Barrel Sauna", "html": "<p><strong>Please Watch and Read Before Use.<\/strong><\/p><p>The left dial is the temperature - Min to Max etc. Leave the dial just slightly under max - don't crank it to full max.<\/p><p>The right dial is the timer. Each number is for 1 hour, 2 hours, 3 hours, 4 hours etc.<\/p><p><strong>Do Not Turn Past The \"First\" 1<\/strong><\/p><p>If you turn it past the first 1 (to the second 1, 2, 3 or more), that's a delayed-start setting, and the heater won't turn on until 1–3 hours later.<\/p><p>Simply turn the dial to the first (1) and the heater will run on max for (1) Hour.<\/p><p>Put the Left Dial just under max, and Select 1 Hour on the Right Dial.<\/p><p>Keep it Simple :)<\/p>", "video": "https://www.loom.com/embed/cfff570eb09344dc8efbf9701171bf8d", "photo": "0293303cde6b68c98044f02b4fcaa56d.jpg", "id": "barrel-sauna"}]}]}, "bbq-grill": {"id": "bbq-grill", "title": "BBQ Grill + Propane", "icon": "flame", "groups": [{"title": "", "items": [{"title": "Propane Grill", "html": "<p>There is a propane grill for your personal use on the back patio. Please follow the grill instructions carefully when using propane, and don't forget to close the valve when you're done!<\/p><p><strong>Please clean the grill after each use.<\/strong> Dump all grease into a sealed, tied trash bag and throw it away. Never pour grease on the ground or anywhere on the property.<\/p><p><strong>Propane tanks:<\/strong> We try to keep a full propane tank (and an extra) at the home. Most of the time we swap them out before check-in, but that's not always possible. If you run low, we can try to have a new tank delivered, though it may not be immediate. If you need one quickly, feel free to exchange the empty tank at a local store and we'll happily reimburse you for the tank and your trouble. Just let us know!<\/p>", "photo": "42fb95ab6ed02128e28184f6c5ffa06a.jpg", "id": "propane-grill"}]}]}, "fireplace-firepit": {"id": "fireplace-firepit", "title": "Fireplace + Firepit", "icon": "flame-kindling", "groups": [{"title": "", "items": [{"title": "Firepit / Firewood", "html": "<p>Due to insurance/safety reasons, we are not able to currently provide any firewood - but you are more than welcome to drop by any local convenience store or big box store and purchase as much as you'd like.<\/p><p>Never leave the fire unattended, and make sure to extinguish it before going to bed.<\/p><p>Please Be Safe! <\/p>", "photo": "cb3e3c6d829b2b4d31be41906f650aa2.jpg", "id": "firepit-firewood"}, {"title": "Fireplace", "html": "<p>The fireplace button is on the wall to the right and it operates similarly to a \"thermostat\" - Gently slide the dial to the right to increase the heat/flame size, and back to the left to lower it, or turn it off. The pilot light should already be lit upon your arrival, so you shouldn't need to touch anything on the actual fireplace itself.<\/p>", "photo": "f18cbaffb016ce26b3f724b690735ad6.jpg", "id": "fireplace"}]}]}, "hot-tub": {"id": "hot-tub", "title": "Hot Tub / Jacuzzi", "icon": "bath", "groups": [{"title": "", "items": [{"title": "Hot Tub / Jacuzzi", "html": "<p>Please Watch the Jacuzzi Video Below for Directions<\/p> <p>Shower Before Entering<\/p> <p>No Lotions, Soaps, Oils, Bubble Products (they cause damage)<\/p> <p>If a Foreign Substance is Found, a Damage Fee Will Be Assessed<\/p> <p>Do Not Add Any Outside Chemicals to the Spa<\/p> <p>No Glass In/Around the Jacuzzi (Plastic Only)<\/p> <p>Children Under 16 Require Adult Supervision At All Times<\/p> <p>Pregnant Individuals Should Consult a Physician Before Use<\/p> <p>Always Cover the Jacuzzi When Not in Use<\/p> <p>Unclip All Four Safety Clips Before Opening the Lid<\/p> <p>Connect All Four Safety Clips When Covering<\/p> <p>Turn Off All Jets When Not in Use<\/p> <p>Do Not Press the &ldquo;Menu&rdquo; Button<\/p> <p>Use Only Temp Up, Down, Jets 1/2, and Light<\/p> ", "video": "https://www.loom.com/embed/869ce97a675a4131b1d26d88691f3c89", "photo": "864611f47f3e9d662b42f905bc72800a.jpg", "id": "hot-tub-jacuzzi"}]}]}, "indoor-games-fun": {"id": "indoor-games-fun", "title": "Indoor Games + Fun", "icon": "gamepad-2", "groups": [{"title": "", "items": [{"title": "Game Room Fun!", "html": "<p>This house is packed with indoor fun, including Pool, Ping Pong, Shuffleboard, Foosball, Air Hockey, Darts, and a full set of poker chips with a playing table. If anything is missing or broken, please let us know right away so we can order any replacements.<\/p>", "photo": "4ff528e7861ceb58eb83b40b13bffde0.jpg", "id": "game-room-fun"}, {"title": "Cards, Games + More", "html": "<p>We try to keep a great selection of puzzles, books, board games, and card games for the whole family. Feel free to help yourself!<\/p><p>If something is missing or broken, please let us know so we can order a replacement.<\/p><p>Please keep everything neat and tidy for the next guests. Missing puzzle pieces or half a set of chess pieces isn't fun for anyone :)<\/p>", "photo": "generic-chess-board.jpg", "id": "cards-games-more"}]}]}, "kitchen": {"id": "kitchen", "title": "Kitchen, Supplies + Appliances", "icon": "cooking-pot", "groups": [{"title": "", "items": [{"title": "Kitchen + Supplies + Appliances", "html": "<p>We have a fully stocked kitchen with a stainless steel appliance package. We try to provide everything you may need, but we're not perfect. If you have any suggestions for small appliances, dishware, flatware, glassware, or even dry goods that would be beneficial - let us know! We would be happy to see if it's possible to place an Amazon/Walmart/Grocery delivery order for you during your stay :)<\/p>", "id": "kitchen-supplies-appliances"}]}]}, "laundry": {"id": "laundry", "title": "Laundry", "icon": "washing-machine", "groups": [{"title": "", "items": [{"title": "Laundry", "html": "<p>We do have a private washer and dryer located in the home. There should be a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in, close the door, and hit start. <\/p>", "photo": "794607d57a2c8fc964701bb9c7a73b7a.jpg", "id": "laundry"}]}]}, "outdoor-games-fun": {"id": "outdoor-games-fun", "title": "Cornhole / Bags", "icon": "target", "groups": [{"title": "", "items": [{"title": "Cornhole / Bags", "html": "<p>Nothing beats a little friendly competition in the fresh Northwoods air! Grab the cornhole boards and bags, set them up outside, and enjoy the views while you play. Whether it's a quick game before dinner or a full-on family tournament, it's a great way to spend time outdoors together.<\/p><p>There should be a set of all-weather cornhole boards somewhere on the patio. If you notice anything is broken or missing, please let us know right away so we can order replacements. It would be very helpful if you would return them to a covered area after each day so they don't wander off or get ruined in the weather :)<\/p>", "photo": "9df12f8c833b036dda9b1e92c15acd40.jpg", "id": "cornhole-bags"}]}]}, "playground": {"id": "playground", "title": "Playground", "icon": "castle", "groups": [{"title": "", "items": [{"title": "Playground", "html": "<p>Children 12 and under!<\/p> <p>Probably our favorite playground in the area. No need to leave the home for the kids to burn off some energy! It&rsquo;s a safe and fun space for endless playtime. Please ensure an adult is always present and never leave children unattended.<\/p>", "photo": "8fee4c1d51fe8b474d3ac66fa1f5a52e.jpg", "id": "playground"}]}]}, "trash": {"id": "trash", "title": "Trash", "icon": "trash-2", "groups": [{"title": "", "items": [{"title": "Trash", "html": "<p>Please Remove All Trash Each Night or at Checkout<\/p> <p>HOA Dumpsters are located 1.7 miles north on Voyageurs Trail -&nbsp;<\/p> <p>Directly Across From Sunset Road (map below)<\/p> <p>All trash must be Bagged and Secured/Tied before placing it in the HOA dumpsters.<\/p> <p>No Loose Trash Allowed In Dumpsters<\/p> <p>3 Trash Cans in Garage For Temporary Storage Only.<\/p><p><img src=\"../img/d605103901fba299481901b9dffa7470.jpg\" alt=\"\"><\/p>", "photo": "7af01a3ccf3e47a8c389e6a8ad3a0564.jpg", "id": "trash"}]}]}, "tv-streaming": {"id": "tv-streaming", "title": "TVs + Streaming", "icon": "tv", "groups": [{"title": "", "items": [{"title": "TVs + Streaming", "html": "<p>We have high-speed Wi-Fi for all of your streaming needs!<\/p><p>There are Smart TVs throughout the entire home.<\/p><p>Go to the TV Home Screen<\/p><p>Search For (or Download) The Channel App You Want To Watch &amp; Login to your TV Provider.<\/p><p>Please don't hesitate to reach out if you need provider login assistance!<\/p>", "photo": "729ecb38918b0e99bc0a0ec5fa74c6d2.jpg", "id": "tvs-streaming"}]}]}, "thermostat": {"id": "thermostat", "title": "Thermostat", "icon": "thermometer", "groups": [{"title": "", "items": [{"title": "Heating / Cooling", "html": "<p>There are (3) Ecobee Thermostats on the wall. The first (1st) is on the main level in the Great Room / Hallway, the second (2nd) is upstairs in Bedroom 4, and the third (3rd) is downstairs on the wall near the stairs in the game room.&nbsp;<\/p> <p>If you're running the air conditioning or heating - please keep all windows and outside doors closed to ensure they operate at maximum efficiency. We recommend a setting of about 72°F which we find keeps the place at a comfortable temperature.<\/p>", "photo": "0e0d8f67a1daad47f9505a1e6b070b6d.jpg", "id": "heating-cooling"}]}]}, "voyageurs-retreat": {"id": "voyageurs-retreat", "title": "Voyageurs Retreat (HOA)", "icon": "trees", "groups": [{"title": "", "items": [{"title": "Hiking, Biking and Water Access", "html": "<p><strong>Location<\/strong><\/p> <p>Our home is located on the southernmost point of Wynne Lake within the HOA.<\/p> <p><strong>Biking Trails<\/strong><\/p> <p>Look for <strong>green dashed lines<\/strong> on the HOA map(s) &mdash; these indicate 8&ndash;10 ft wide aggregate bike paths that run along the entire east side of the HOA.&nbsp;These trails connect directly to the <strong>Mesabi Trail<\/strong>&nbsp;farther north (where the line turns <strong>solid red<\/strong> on the map).<\/p> <p><strong>Hiking Trails<\/strong><\/p> <p>Marked with <strong>orange dashed lines<\/strong> on the map. These trails begin <strong>right near our home<\/strong>, continuing north alongside both lakes and extending all the way to<strong> <\/strong>Sabin Lake near the Embarrass River.<\/p> <p><strong>Parks, Picnic Areas &amp; Lake Access<\/strong><\/p> <p>Located along the <strong>east sides of Wynne Lake and Sabin Lake<\/strong>, you&rsquo;ll find numerous HOA access points for:<\/p> <p>Picnic areas, Benches, Canoe/kayak launches, Swimming spots, Day-use docks - etc.<\/p> <p>Refer to your map for icons identifying each amenity.<\/p> <p><strong>Recommended Swimming Area<\/strong><\/p> <p>We recommend guests visit <strong>Red Pine Beach Park, <\/strong>located about 1 mile&nbsp;up the road.<\/p> <p><strong>Boat Access<\/strong><\/p> <p><strong>Wynne Lake Boat Launch<\/strong><\/p> <p>- located on the <strong>northwest side of Wynne Lake<\/strong>, near Giants Ridge ski area.<\/p> <p><strong>Sabin Lake Boat Launch<\/strong><\/p> <ul> <li>located on the <strong>west side of Sabin Lake<\/strong>, near The Legend Golf Course.<\/li> <\/ul>  <p><em>Note: Wynne Lake and Sabin Lake are not navigable between each other by motorboat.&nbsp;<\/em><\/p>", "photo": "bbdcdcddeefeaf05355e40791cb4f683.jpg", "id": "hiking-biking-and-water-access"}, {"title": "Sabin Lake Map", "html": "<p><img src=\"../img/d325e75679c05552440a615d8c0fa490.jpg\" alt=\"\"><\/p>", "photo": "602f204cb05acdb03232057891cd2670.jpg", "id": "sabin-lake-map"}, {"title": "Wynne Lake Map", "html": "<p><img src=\"../img/ee37673bf93576f8e23c475de2c41806.jpg\" alt=\"\"><\/p>", "photo": "986d39b03a3699da14519cb072d6ce80.jpg", "id": "wynne-lake-map"}]}]}, "dining": {"id": "dining", "title": "Dining Out", "icon": "utensils", "groups": [{"title": "Breakfast, Brunch, + Coffee Recommendations", "items": [{"title": "Megan’s Family Restaurant", "html": "<p>Facebook: <a href=\"https://www.facebook.com/p/Megans-Family-Restaurant-100056595738782\">Megan’s Family Restaurant<\/a><\/p> <p>Phone: (218) 229-3418<br/>Address: 114 N Main Street, Aurora, MN 55705<\/p> <p>A cozy, hometown diner in downtown Aurora serving American comfort classics in a low-key, family-style setting. Perfect for an early breakfast (try the Hungry Man platter or biscuits &amp; gravy) or a casual lunch: burgers, sandwiches, homemade soups and classic entrees. Friendly staff, affordable prices, and a true Iron Range atmosphere. Opens at 7 AM; closed Mondays; open later on Fridays for the fish fry. Check Facebook or call for current hours. Ideal for fueling up before exploring the parks!<\/p>", "photo": "013926368d099d9ebf3edfc8bd1687d1.jpg", "loc": [47.528751, -92.236544], "pin": "restaurants", "id": "megans-family-restaurant"}, {"title": "Wacootah Grille", "html": "<p>Website: <a href=\"https://www.giantsridge.com/wacootah-grille/\">giantsridge.com/wacootah-grille<\/a><\/p> <p>Phone: (218) 865-8045<br/>Address: 5893 Giants Ridge Road, Biwabik (at The Quarry golf course)<\/p> <p>A cozy clubhouse restaurant with breathtaking views of the Quarry golf course and cliff-edged lakes. Open daily from sunrise to sunset during the golf season (roughly late spring through mid-fall), it serves full-service breakfast, lunch, dinner, and a full bar. Ideal for a scenic morning pancake/brunch, afternoon bite, or relaxed evening meal after your outdoor adventures. Closed in winter; check the website for opening dates.<\/p>", "photo": "064510bc126e9a1f86a027eec7abac8c.jpg", "loc": [47.53832, -92.30727], "pin": "restaurants", "photoHidden": true, "id": "wacootah-grille"}]}, {"title": "Dinner + Drinks Recommendations", "items": [{"title": "The Alibi Bar – Gilbert", "html": "<p>Facebook: <a href=\"https://www.facebook.com/gilbertalibi\">The Alibi Bar<\/a><\/p> <p>Phone: (218) 741-9633<br/>Address: 115 Broadway, Gilbert, MN<\/p> <p>A cozy, friendly neighborhood pub in Gilbert serving a full bar, light snacks, and casual games like pool or darts. It’s a laid-back evening spot with TVs, local patrons, and a warm vibe. Check Facebook for current hours. A great local experience after hiking, skiing, or biking.<\/p>", "photo": "be5215479693ba855ac5ebe29e55e049.jpg", "loc": [47.488458, -92.46505], "pin": "bars_and_nightlife", "id": "the-alibi-bar-gilbert"}, {"title": "Copper Nickel Public House – Aurora", "html": "<p>Facebook: <a href=\"https://www.facebook.com/CopperNickelAuroraMN\">Copper Nickel Public House<\/a><\/p> <p>Phone: (218) 306-6149<br/>Address: 111 Main Street N, Aurora, MN 55705<\/p> <p>A stylish yet comfy bar &amp; pub in Aurora serving classic American food, from appetizers and burgers to pasta, sandwiches, and salads, with a solid selection of beers, wine, and cocktails. Accessible and family-friendly, it also hosts events like karaoke, live music, and seasonal specials. Opens at 11 AM and stays open late on weekends; hours vary, so check Facebook before visiting. Perfect for date nights, group dinners, or a cozy evening out.<\/p>", "photo": "2314b23d2c014718a42a8738683002a5.jpg", "loc": [47.528625, -92.237065], "pin": "restaurants", "id": "copper-nickel-public-house-aurora"}, {"title": "The Downtown Bar – Gilbert", "html": "<p>Facebook: <a href=\"https://www.facebook.com/p/The-Downtown-Bar-100063675302458/\">The Downtown Bar<\/a><\/p> <p>Phone: (218) 741-2831<br/>Address: 209 S Broadway, Gilbert, MN<\/p> <p>A clean, cozy, and welcoming local pub offering a full bar, classic bar snacks, <strong>pool and darts<\/strong>, and TVs for game nights. Check their Facebook for live music and events. It’s a top choice for a relaxed evening outing with friends or fellow travelers; check Facebook for current hours.<\/p>", "photo": "166efdc958cf67a1dd037be88e4c11d6.jpg", "loc": [47.485433, -92.467956], "pin": "bars_and_nightlife", "id": "the-downtown-bar-gilbert"}, {"title": "Luke’s Tavern", "html": "<p>Facebook: <a href=\"https://www.facebook.com/lukesbiwabik\">Luke’s Tavern<\/a><\/p> <p>Phone: (218) 306-6009<br/>Address: 126 Main Street, Biwabik<\/p> <p>A cozy, family-owned tavern in downtown Biwabik, perfect for post-hike or ski evenings. Enjoy a full bar, bar snacks, TVs, darts/pool, and rotating live music and jam nights. Open from mid-afternoon into the evening; check Facebook for current hours and events. Great for guests seeking a fun local vibe!<\/p>", "photo": "e9e7d03f8b36e182a1c34e0ff75efde3.jpg", "loc": [47.532699, -92.346832], "pin": "bars_and_nightlife", "id": "lukes-tavern"}, {"title": "Rudy’s Bar & Grill", "html": "<p>Website: <a href=\"https://www.rudysmn.com/\">rudysmn.com<\/a><\/p> <p>Phone: (218) 229-3983<br/>Address: 116 Main Street N, Aurora, MN 55705<\/p> <p>A classic Iron Range <strong>bar &amp; grill<\/strong> in Aurora serving fresh, comforting dishes and a full bar in a cozy, sports-themed atmosphere. Try the famous Shroom Burger, broasted chicken, and rotating dinner specials. Open daily 11 AM-9 PM; bar closing time varies. Ideal for after-day adventures or a casual night out.<\/p>", "photo": "674c3e2b2ed9200268fc28cc741a870a.jpg", "loc": [47.528879, -92.236538], "pin": "bars_and_nightlife", "id": "rudys-bar-grill"}]}, {"title": "Lunch + Snack Recommendations", "items": [{"title": "Biwabik Pizza Co", "html": "<p>🌐<a href=\"https://biwabikpizza.com/\">https://biwabikpizza.com/<\/a><\/p> <p>📞(218) 750‑7040<\/p> <p>Your go‑to spot for local, inventive pizza with a wide range of specialty pies, hearty wings, burgers, and comfort‑food snacks. Casual dine‑in at the Biwabik Pub or enjoy delivery on weekends within a 15‑mile radius—perfect for a relaxed night in after a day of outdoor adventures. Open most days by 11 AM, with later evening hours on Fridays &amp; Saturdays.<\/p>", "photo": "1b2ceafc713e31dc614cd797dcf79956.jpg", "loc": [47.533204, -92.345609], "pin": "take_out", "id": "biwabik-pizza-co"}, {"title": "Burnt Onion Kitchen & Brews", "html": "<p>Website: <a href=\"https://www.giantsridge.com/burnt-onion/\">giantsridge.com/burnt-onion<\/a><\/p> <p>Phone: (218) 865-8061<br/>Location: 2nd floor of the Main Chalet at Giants Ridge, 6329 Wynne Creek Drive, Biwabik<\/p> <p>This lodge-style eatery offers creative American cuisine with local flair. Try the signature Burnt Onion Burger, enjoy fresh walleye, or savor vegetarian/gluten-free choices. After a day of skiing, biking, or hiking, unwind on the deck overlooking the slopes with a craft beer, cocktail or mocktail in hand. Wheelchair accessible via the first-floor elevator.<\/p> <p>Hours are seasonal: summer 2026 was Thursday-Sunday from 11 AM; the restaurant closes between seasons in fall and reopens for ski season (scheduled for Nov. 28). Check the website for current hours.<\/p>", "photo": "07a0b8859ccf9312acbf25f28f37f373.jpg", "loc": [47.578054, -92.304204], "pin": "restaurants", "id": "burnt-onion-kitchen-brews"}, {"title": "Dining Specials: Rotating Chophouse Menu", "html": "<p>The Chophouse Menu is a monthly rotating dinner menu served at <strong>Burnt Onion Kitchen &amp; Brews<\/strong> in the Giants Ridge Chalet, starting at 4 PM on days the restaurant is open. Enjoy succulent steaks, grilled chops, savory sides, and decadent desserts, all designed to deliver a memorable gourmet experience.<\/p> <p>Pair your meal with a curated selection of brews and wines for the perfect evening at Giants Ridge.<\/p> <p>Burnt Onion closes between seasons in late fall and reopens for ski season (scheduled for Nov. 28); check current hours before you go.<\/p> <p>Current menu and details: <a href=\"https://www.giantsridge.com/fb-specials/\">giantsridge.com/fb-specials<\/a><\/p>", "photo": "0b092f0fe09ec251e8074d62df8a8edb.jpg", "id": "dining-specials-rotating-chophouse-menu"}, {"title": "Local Dining: Neighbor’s BBQ", "html": "<p><strong>Neighbor’s BBQ<\/strong> (The Lodge at Giants Ridge)<br/>Located inside the Lodge at Giants Ridge, 6373 Wynne Creek Drive, Biwabik, Neighbor’s BBQ is renowned for Minnesota-style barbecue, offering rich flavors in a warm, family-friendly atmosphere. Enjoy great food and a full-service bar, making it a must-visit spot for barbecue lovers.<\/p> <p>Phone: (218) 865-1005<br/>Hours: Wednesday-Sunday, 12-8 PM; closed Monday and Tuesday (per the restaurant’s website; confirm before visiting).<\/p> <p>Website: <a href=\"https://www.neighborsbbq218.com/\">neighborsbbq218.com<\/a><br/>More info: <a href=\"https://www.giantsridge.com/local-dining/\">giantsridge.com/local-dining<\/a><\/p>", "photo": "004664960e57a37e7b1d0f72b8e77ced.jpg", "id": "local-dining-neighbors-bbq"}, {"title": "Vi’s Pizza & TNT Bar", "html": "<p>🌐 <a href=\"https://www.facebook.com/p/TNT-Bar-and-Vis-Pizza-100063793202936\">https://www.facebook.com/p/TNT-Bar-and-Vis-Pizza-100063793202936<\/a><\/p> <p>📞 (218) 865‑4164<\/p> <p>A beloved local hangout offering huge specialty pizzas, a full bar, and a warm, laid-back atmosphere. Try unique flavors like the Hotsy Potsy or Northern Exposure pizza, or explore burgers, wings, and wraps. Great for a casual group dinner or family night out. Open evenings from ~4 PM; check FB for daily specials and events.<\/p>", "photo": "7862b9fddddf27ba58390c38c4f4da29.jpg", "loc": [47.533176, -92.344959], "pin": "restaurants", "id": "vis-pizza-tnt-bar"}]}]}, "emergency": {"id": "emergency", "title": "Emergency and Urgent Care", "icon": "siren", "groups": [{"title": "", "items": [{"title": "Biwabik Fire & Ambulance", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p> <p>Biwabik Fire &amp; Ambulance Department<br/>Address: 105 3rd Avenue North, Biwabik, MN 55708<br/>Non-emergency phone: (218) 865-4332<br/>City of Biwabik (City Hall): (218) 865-4183<\/p> <p>Website: <a href=\"https://www.cityofbiwabik.com/public-safety\">City of Biwabik Fire &amp; Ambulance<\/a><\/p> <p>Services: Fire suppression, rescue, and ambulance/EMS for Biwabik, with mutual aid from neighboring communities.<\/p>", "photo": "62dd358af6ed4c89ba0792850b337253.jpg", "photoHidden": true, "id": "biwabik-fire-ambulance"}, {"title": "Biwabik Police Service", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p> <p>Biwabik receives 24-hour police coverage from the Gilbert Police Department, which operates a substation in town.<\/p> <p>Biwabik Substation: 105 3rd Avenue North, Biwabik, MN 55708<br/>Substation phone (non-emergency): (218) 865-4186<br/>Gilbert Police main office: 16 South Broadway, Gilbert; (218) 748-2225<\/p> <p>More info: <a href=\"https://gilbertmn.org/services/police-department/\">Gilbert Police Department<\/a><\/p>", "photo": "a2d55f5ad8b2f25b9074e8485e3c4429.jpg", "id": "biwabik-police-service"}, {"title": "Hospitals Near Biwabik", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p> <p><strong>Essentia Health-Northern Pines (Aurora)<\/strong> (closest)<br/>Address: 5211 Highway 110, Aurora, MN 55705<br/>Phone: (218) 229-2211<br/>24-hour emergency department. Enter the parking lot off Highway 110 and follow the emergency signs to the back of the building.<br/>About 12 minutes (6.6 miles) from downtown Biwabik; allow a few extra minutes from the house.<br/><a href=\"https://www.essentiahealth.org/find-facility/emergency-medicine-essentia-health-northern-pines-aurora\">Essentia Health-Northern Pines Emergency<\/a><\/p> <p><strong>Essentia Health-Virginia<\/strong><br/>Address: 901 9th Street North, Virginia, MN 55792<br/>Emergency phone: (218) 741-3340<br/>24-hour emergency room; larger regional hospital. The ER is across the lot from the Essentia Health-Virginia Clinic; look for the Hospital Entrance sign.<br/>About 22 minutes (14 miles) from downtown Biwabik.<br/><a href=\"https://www.essentiahealth.org/find-facility/emergency-medicine-essentia-health-virginia\">Essentia Health-Virginia Emergency<\/a><\/p>", "photo": "28d91d347754e47d1881b7507792dd1f.jpg", "id": "hospitals-near-biwabik"}]}]}, "golf": {"id": "golf", "title": "Golf", "icon": "flag", "groups": [{"title": "", "items": [{"title": "The Legend", "html": "<p><a href=\"https://www.giantsridge.com/the-legend/\">giantsridge.com/the-legend<\/a><\/p><p>Golf Shop: (218) 865-8030 &middot; Resort toll-free: (800) 688-7669<\/p><p>A premium 18-hole, par-72 public course set in the heart of mature red-pine forest. Designed by Jeff Brauer and Lanny Wadkins, it challenges golfers of all levels with dynamic terrain, pristine bent-grass greens, and stunning natural beauty.<\/p><p>Rated as one of Minnesota&rsquo;s best public courses, it offers full-service amenities&mdash;driving range, pro shop, club rental, lessons, and clubhouse dining. Book your tee time online via Giants Ridge or GolfNow, and browse hole maps and scorecards to prepare. Perfect for a memorable &ldquo;nine-and-dine&rdquo; or full round experience during your stay.<\/p><p><strong>Season:<\/strong> The 2026 golf season ended Oct. 11, 2026. The 2027 opening date has not been announced yet; check the course page in spring.<\/p><p><a href=\"https://www.golfnow.com/courses/1050466-giants-ridge-golf-ski-resort-legend-course-details\">The Legend Tee Times (GolfNow)<\/a><br/><a href=\"https://mnpga.bluegolf.com/bluegolf/mnpga/course/giantsridgelegend/overview.htm\">The Legend Scorecards<\/a><br/><a href=\"https://www.provisualizer.com/courses/giantsridgelegend.php\">The Legend Course Map<\/a><br/><a href=\"https://course.bluegolf.com/bluegolf/course/course/giantsridgelegend/printpick.htm\">The Legend Printable Scorecards &amp; Hole Layouts<\/a><\/p><p>On-Site Amenities<\/p><ul><li>Driving range, putting/chipping greens, and practice bunker<\/li><li>Full pro shop, club rentals, fittings, and lessons<\/li><li>Clubhouse dining, lounge area, locker rooms, carts and pull carts<\/li><\/ul>", "photo": "d2b34f2813c663d43e4ba2e9fee3d7a9.jpg", "id": "the-legend"}, {"title": "The Quarry", "html": "<p><a href=\"https://www.giantsridge.com/the-quarry/\">giantsridge.com/the-quarry<\/a><\/p><p>Golf Shop: (218) 865-8030 &middot; Main line: (218) 865-8000 &middot; Resort toll-free: (800) 688-7669<\/p><p>A premier 18-hole, par-72 public course carved from historic mine terrain, offering rugged beauty and strategic play. Designed by Jeff Brauer, it&rsquo;s challenging (7,201 yards, slope up to 146) with elevation, rock formations, and standout holes like the drivable 13th. Golf Digest (2025) ranks it the top Minnesota course on its list of America&rsquo;s 100 Greatest Public Courses (No. 58 nationally)&mdash;a must for enthusiastic golfers.<\/p><p><strong>Season:<\/strong> The 2026 golf season ended Oct. 11, 2026. The 2027 opening date has not been announced yet.<\/p><p><a href=\"https://www.giantsridge.com/the-quarry/\">The Quarry Tee Times<\/a><br/><a href=\"https://course.bluegolf.com/bluegolf/course/course/giantsridgequarry/detailedscorecard.htm\">The Quarry Scorecards<\/a><br/><a href=\"https://www.provisualizer.com/courses/giantsridgequarry.php\">The Quarry Course Map<\/a><\/p><p>Amenities:<br/>Carts, pull carts, club rentals, practice range, chipping and putting greens (<a href=\"https://www.golfpass.com/travel-advisor/courses/28836-giants-ridge-golf-ski-resort-quarry-course\">golfpass.com<\/a>)<br/>Pro shop offering apparel, gear, lessons, and club fittings<br/>Lounge and dining at the Wacootah Grille clubhouse restaurant&mdash;great for a post-round meal<\/p>", "photo": "ffe8e7144ad43944356d369a004d9b39.jpg", "id": "the-quarry"}]}]}, "grocery": {"id": "grocery", "title": "Grocery and Pharmacy", "icon": "shopping-cart", "groups": [{"title": "", "items": [{"title": "CVS Pharmacy at Target — Virginia, MN", "html": "<p>Website: <a href=\"https://www.cvs.com/store-locator/virginia-mn-pharmacies/1001-13th-st-s-virginia-mn-55792/storeid=16290\">CVS Pharmacy at Target, Virginia<\/a><br/>Phone: (218) 741-6603<br/>Address: 1001 13th St S, Virginia, MN 55792 (inside Target)<\/p> <p>Pharmacy hours: Monday-Friday 9 AM-6 PM; Saturday 10 AM-6 PM; Sunday 11 AM-5 PM (closed 1:30-2 PM for lunch). Hours can change on holidays; check the CVS page or call before you go.<\/p> <p>Distance: About 20 minutes (13 miles) west of downtown Biwabik.<\/p>", "photo": "63822b350d6a29d9a6c6308a41c433e7.jpg", "loc": [47.51112, -92.54907], "pin": "pharmacy", "photoHidden": true, "id": "cvs-pharmacy-at-target-virginia-mn"}, {"title": "Super One Foods — Biwabik", "html": "<p>Website: <a href=\"https://www.superonefoods.com/store-details/biwabik-super-one-foods\">superonefoods.com (Biwabik store)<\/a><br/>Phone: (218) 865-6702<br/>Address: 317 Main Street, Biwabik, MN 55708<br/>Hours: 7 AM-9 PM<\/p> <p>Super One Foods is the go-to local grocery store in town. Guests can find everything from fresh bakery items, deli selections, produce, meat, and ready-made trays to gift cards, floral arrangements, and propane exchange, making it a superb one-stop shop for all needs. The store also provides Wi-Fi, handicap accessibility, and modern payment options like Apple Pay and EBT.<\/p>", "photo": "d6f9981220caa925ad716042078f3e35.jpg", "loc": [47.53313, -92.34431], "pin": "grocery_shopping", "id": "super-one-foods-biwabik"}]}]}, "shopping": {"id": "shopping", "title": "Shopping", "icon": "shopping-bag", "groups": [{"title": "", "items": [{"title": "Giants Ridge Mountain Sports / Pro Shop & Gift Shop", "html": "<p>Website: <a href=\"https://www.giantsridge.com/onsite-shopping/\">giantsridge.com/onsite-shopping<\/a><br/>Phone: (218) 865-8000 (Giants Ridge main line)<\/p> <p>A one-stop spot for those planning outdoor fun (skiing, biking, or hiking) or looking for attire that embodies the resort’s adventurous spirit. The Mountain Sports Shop is on the first floor of the Giants Ridge Chalet, and each golf course has its own pro shop. Expect outdoor gear, ski apparel, and equipment for all ages, plus souvenirs and resort essentials. Shop hours follow the resort’s seasons; the golf shops are closed in winter.<\/p>", "photo": "bc28b811aed7f0d067f390c5acdf6e2b.jpg", "loc": [47.57652, -92.303169], "pin": "retail_therapy", "id": "giants-ridge-mountain-sports-pro-shop-gift-shop"}]}]}, "weather": {"id": "weather", "title": "Weather", "icon": "cloud-sun-rain", "groups": [{"title": "", "items": [{"title": "Biwabik", "html": "<p>For the most up-to-date weather forecast check <a href=\"https://weather.com/weather/today/l/8ce536ee4729bd157465dd5a7ee281640970a654891551ca18c7aa7c9b671ec9\">here<\/a>!<\/p> <p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say \"There is no such thing as bad weather, just inappropriate clothing\".<\/p>", "photo": "e0f4f48658886913f7c2ce99deedbad1.jpg", "id": "biwabik"}]}]}, "giants-ridge": {"id": "giants-ridge", "title": "Giants Ridge Recreation Area", "icon": "mountain-snow", "groups": [{"title": "Dining", "items": [{"title": "Burnt Onion Kitchen & Brews", "html": "<p>Located on the second floor of the Main Chalet, Burnt Onion Kitchen &amp; Brews offers a unique dining experience with creative twists on classic American dishes. Enjoy seasonal lunch and dinner menus featuring handhelds, steaks, vegetarian, and gluten-free options.<\/p><p>Don&rsquo;t miss the chef-curated Chophouse Menu, which rotates monthly, and a full mocktail selection. The restaurant is wheelchair accessible via the first-floor elevator.<\/p><p><strong>Hours:<\/strong> Summer 2026 hours (May 22 &ndash; Oct. 18) were Thu &amp; Sun 11 AM &ndash; 9 PM, Fri &amp; Sat 11 AM &ndash; 10 PM. Winter 2026&ndash;27 hours have not been posted yet; check the website before you go.<\/p><p>More info: <a href=\"https://www.giantsridge.com/burnt-onion/\">giantsridge.com/burnt-onion<\/a><\/p>", "photo": "2e1cdea14f201f6e310d9fee2094709a.jpg", "id": "burnt-onion-kitchen-brews"}, {"title": "Dining Specials: Rotating Chophouse Menu", "html": "<p>Served from 4 PM to close at Burnt Onion Kitchen &amp; Brews, the Chophouse Menu is a chef-curated selection that changes monthly. Expect premium cuts, grilled chops, inventive sides, and decadent desserts.<\/p><p>Pair your meal with a curated selection of brews and wines for the perfect evening at Giants Ridge.<\/p><p>Current menu and details: <a href=\"https://www.giantsridge.com/fb-specials/\">giantsridge.com/fb-specials<\/a><\/p>", "photo": "0b092f0fe09ec251e8074d62df8a8edb.jpg", "id": "dining-specials-rotating-chophouse-menu"}, {"title": "Local Dining: Neighbor’s BBQ", "html": "<p>The East Range offers dining options for every taste&mdash;from cozy cafes to full-service restaurants.<\/p><p><strong>Neighbor&rsquo;s BBQ<\/strong> (On-Site)<br/>Located inside the Lodge at Giants Ridge (6373 Wynne Creek Dr., Biwabik), Neighbor&rsquo;s BBQ serves Minnesota-style barbecue in a warm, family-friendly atmosphere, with a full-service bar.<\/p><p><strong>Hours:<\/strong> Wed&ndash;Sun 12&ndash;8 PM; closed Mon &amp; Tue.<br/>Phone: (218) 865-1005<\/p><p>More info: <a href=\"https://www.giantsridge.com/local-dining/\">giantsridge.com/local-dining<\/a><br/>Neighbor&rsquo;s BBQ website: <a href=\"https://www.neighborsbbq218.com/\">neighborsbbq218.com<\/a><\/p>", "photo": "004664960e57a37e7b1d0f72b8e77ced.jpg", "id": "local-dining-neighbors-bbq"}, {"title": "The Wacootah Grille", "html": "<p>Open daily from sunrise to sunset during golf season, The Wacootah Grille is the perfect spot for breakfast, lunch, or dinner with a view. Located at The Quarry golf course clubhouse, it overlooks the 18th green and the beautiful Lake Mine, famous for trout fishing.<\/p><p>Enjoy a full menu of clubhouse favorites and a full-service bar, with indoor and outdoor seating offering stunning panoramic views of cliffs and crystal-clear lake waters.<\/p><p><strong>Season:<\/strong> Closed for the season as of fall 2026; reopens in spring 2027 with the golf season (date not yet announced).<\/p><p>Phone: (800) 688-7669<br/>Menus (2026): <a href=\"https://www.giantsridge.com/wp-content/uploads/2026/05/Wacootah-Breakfast-Single-26-png.png\">Breakfast<\/a> &middot; <a href=\"https://www.giantsridge.com/wp-content/uploads/2026/05/2026-Wacootah-Lunch-Dinner-Menu-png_Page_1-scaled.png\">Lunch<\/a> &middot; <a href=\"https://www.giantsridge.com/wp-content/uploads/2026/05/2026-Wacootah-Lunch-Dinner-Menu-png_Page_2-scaled.png\">Dinner<\/a><br/>More info: <a href=\"https://www.giantsridge.com/wacootah-grille/\">giantsridge.com/wacootah-grille<\/a><\/p>", "photo": "a8f684c6ca992b2b19dafb47579a2b28.jpg", "id": "the-wacootah-grille"}]}, {"title": "Golf", "items": [{"title": "Golf Groups", "html": "<p><strong>Tournaments, Corporate Outings &amp; Group Play<\/strong><\/p><p>Planning a golf event? From casual group outings to full-scale tournaments, <em>Giants Ridge<\/em> offers the perfect setting with The Legend and The Quarry&mdash;two of the most celebrated courses in the country.<\/p><p>Why host your group here?<\/p><ul><li>Accommodates groups from 8 to 400<\/li><li>Custom tournament packages available<\/li><li>Indoor/outdoor meeting &amp; celebration spaces<\/li><li>Group meals, lodging &amp; entertainment options<\/li><li>Personalized merchandise (shirts, logo balls &amp; more)<\/li><\/ul><p>Whether it&rsquo;s for fun, fundraising, or team-building, Giants Ridge makes your golf event effortless and unforgettable.<\/p><p><em>Ready to plan your outing?<\/em> Call (218) 865-8030<br/>Learn more or inquire: <a href=\"https://www.giantsridge.com/golf-groups/\">giantsridge.com/golf-groups<\/a><\/p>", "photo": "5c886d98e584e601c09e03419d6afb5e.jpg", "id": "golf-groups"}, {"title": "Golf Lessons", "html": "<p><strong>Sharpen your game at Giants Ridge!<\/strong><br/>Whether you&rsquo;re a beginner or seasoned player, Giants Ridge offers private lessons and group programs during the golf season (roughly May through mid-October).<\/p><p><strong>Private Lessons<\/strong><\/p><p>One-on-one instruction tailored to your goals, based on availability.<br/><em>Pre-registration required &mdash; call the Golf Shop at (218) 865-8030<\/em><\/p><p><strong>Group Programs (2026 season)<\/strong><\/p><ul><li>Junior Clinics (ages 10+): three-day sessions at The Legend, $110 per session<\/li><li>Ladies League: Thursdays at The Legend, lesson plus 9 holes<\/li><\/ul><p>More info &amp; registration: <a href=\"https://www.giantsridge.com/golf-lessons/\">giantsridge.com/golf-lessons<\/a><\/p>", "photo": "face5d0444807a45f3ed9e8728f098c3.jpg", "id": "golf-lessons"}, {"title": "The Legend Golf Course", "html": "<p><strong>Scenic. Challenging. Legendary.<\/strong><br/>Opened in 1997, <em>The Legend<\/em> has become one of Minnesota&rsquo;s most celebrated public golf courses. Recognized by Golf Digest as one of the &ldquo;Top 10 Best New Upscale Public Courses in the Nation,&rdquo; this award-winning course offers a serene, unforgettable experience with unmatched value. More recently, Golfweek ranked it among the Best Resort Courses in the U.S. (No. 105, 2026).<\/p><p>Nestled in the scenic Iron Range, <em>The Legend<\/em> helped establish Northern Minnesota as a global golf destination.<\/p><p><strong>2026 Green Fees<\/strong> (last season; 2027 rates not yet posted; include cart &amp; range balls, plus tax/fees)<\/p><ul><li><strong>Early (opening &ndash; May 28):<\/strong> $100<\/li><li><strong>Prime (May 29 &ndash; Aug 23):<\/strong> $130 | Twilight $100 after 3 PM | Same-day replay $75<\/li><li><strong>Fall (Aug 24 &ndash; Sept 27):<\/strong> $130 | Twilight $100 after 2 PM<\/li><li><strong>Late (Sept 28 &ndash; Oct 11):<\/strong> $100 | Same-day replay $75<\/li><li><strong>Junior (17 &amp; under):<\/strong> $45 all season<\/li><li><strong>36 Holes with Lunch (prime season):<\/strong> $210 weekday | $230 weekend<\/li><\/ul><p><strong>Special Deal: 36-Hole Experience<\/strong><br/>Play both <strong>The Legend<\/strong> and <strong>The Quarry<\/strong> on the same day with lunch in between. Available during prime season only (May 29 &ndash; Aug 23 in 2026). <em>Call ahead to book both tee times.<\/em><\/p><p><strong>Season:<\/strong> The 2026 season ended Oct. 11; 2027 dates TBA.<\/p><p>Learn more or book your tee time: <a href=\"https://www.giantsridge.com/the-legend/\">giantsridge.com/the-legend<\/a><\/p>", "photo": "01d9098b5bbd5a2ede4f86a1926e4289.jpg", "id": "the-legend-golf-course"}, {"title": "The Quarry Golf Course", "html": "<p><strong>Minnesota&rsquo;s No. 1 Public Golf Course<\/strong><\/p><p>Built on the site of a former sand, gravel, and iron ore mine, <em>The Quarry<\/em> offers a rugged, dramatic, and unforgettable golfing experience. Golf Digest (2025) ranks it the top Minnesota course on its list of America&rsquo;s 100 Greatest Public Courses (No. 58 nationally), and Golfweek has rated it No. 1 among Minnesota public courses. A perfect complement to the more traditional <em>Legend<\/em> course.<\/p><p><strong>2026 Green Fees<\/strong> (last season; 2027 rates not yet posted; include cart &amp; range balls, plus tax/fees)<\/p><ul><li><strong>Early (opening &ndash; May 28):<\/strong> $100<\/li><li><strong>Prime (May 29 &ndash; Aug 23):<\/strong> $130 | Twilight $100 after 3 PM | Same-day replay $75<\/li><li><strong>Fall (Aug 24 &ndash; Sept 27):<\/strong> $130 | Twilight $100 after 2 PM<\/li><li><strong>Late (Sept 28 &ndash; Oct 11):<\/strong> $100 | Same-day replay $75<\/li><li><strong>Junior (17 &amp; under):<\/strong> $45 all season<\/li><li><strong>36 Holes with Lunch (prime season):<\/strong> $210 weekday | $230 weekend<\/li><\/ul><p><em>Juniors must be with an adult. Taxes/fees not included.<\/em><\/p><p><strong>Special Offer: 36-Hole Experience<\/strong><br/>Play both <em>The Quarry<\/em> and <em>The Legend<\/em> in one day, with lunch in between (prime season only). <em>Call in advance for both tee times.<\/em><\/p><p><strong>Season:<\/strong> The 2026 season ended Oct. 11; 2027 dates TBA.<\/p><p>Learn more or book: <a href=\"https://www.giantsridge.com/the-quarry/\">giantsridge.com/the-quarry<\/a><\/p>", "photo": "71cbcc951940dda82955b156d980d5c7.jpg", "id": "the-quarry-golf-course"}, {"title": "Virtual Tours", "html": "<p>Watch these videos from Giants Ridge to see the Legend and Quarry golf courses&mdash;and the mountain in winter&mdash;for yourself.<\/p><p><iframe src=\"https://www.youtube.com/embed/8FIZ6L4VL6U?rel=0\"><\/iframe><\/p><p><iframe src=\"https://www.youtube.com/embed/pqtb-WZHeMI?rel=0\"><\/iframe><\/p><p><iframe src=\"https://www.youtube.com/embed/JPwtcDfIxlw?rel=0\"><\/iframe><\/p><p>More from Giants Ridge: <a href=\"https://www.youtube.com/@GiantsRidgeResort\">Giants Ridge on YouTube<\/a><\/p>", "photo": "715f16940724154984ab85a2aa299ab0.jpg", "id": "virtual-tours"}]}, {"title": "Plan Your Visit", "items": [{"title": "Events Calendar", "html": "<p><strong>Adventure. Music. Family Fun. It All Happens Here.<\/strong><br/>From adrenaline-pumping races to family festivals, classic car shows, and seasonal celebrations, <strong>Giants Ridge<\/strong> is your year-round destination for unforgettable events. Whether you're into biking, beer, or just good times in the great outdoors — there’s always something exciting on the calendar.<\/p> <p><strong>View Full Events List → <a href=\"https://www.giantsridge.com/events/list/\">https://www.giantsridge.com/events/list/<\/a> <\/strong><\/p>", "photo": "63b96545dbee3833f3765ebd11fae0c2.jpg", "id": "events-calendar"}, {"title": "Pool & Sauna Haus", "html": "<p>Check out the <strong>Pool &amp; Sauna Haus at Giants Ridge!<\/strong><\/p><p><strong>Open to the public and just 5 minutes from our home,<\/strong> it offers a heated indoor pool, an expansive hot tub, and two dry saunas (add steam with the provided buckets and ladles) for year-round relaxation.<\/p><p>Conveniently located across from the main entrance, the Pool &amp; Sauna Haus offers forest views, a cozy lobby fireplace, and a warm, inviting atmosphere&mdash;an ideal spot to relax after a day of adventure. Resort guests, day visitors, and community members are welcome; anyone under 18 must be supervised by an adult.<\/p><p><strong>Hours:<\/strong> Open swim daily, 6:00 AM &ndash; 8:00 PM. Morning relaxation &amp; lap swim 6:00 &ndash; 10:00 AM.<\/p><p><strong>Rates<\/strong><\/p><ul><li>Daily passes: see the current pricing sheet on the Pool Haus page (not listed on the main page)<\/li><li>Monthly pass: $75<\/li><li>Winter alpine season pass holders: 25% off daily passes<\/li><li>Locals&rsquo; Day: 25% off admission Mondays from 10:00 AM (sold in person only)<\/li><\/ul><p><strong>Party Room Rental<\/strong><\/p><ul><li>$175 for 3 hours, includes up to 10 swim passes for the same block<\/li><li>Catering menu available; no outside food or drink except cake or cupcakes<\/li><\/ul><p>Phone: (218) 865-8002<br/>More info: <a href=\"https://www.giantsridge.com/pool-haus/\">giantsridge.com/pool-haus<\/a><\/p>", "photo": "17f00c2c2b4276780280f37610fe2742.jpg", "id": "pool-sauna-haus"}, {"title": "Private & Corporate Events", "html": "<p><strong>Host Your Event in the Northwoods<\/strong><br/>Whether you're planning a company retreat, conference, family gathering, or celebration, Giants Ridge offers the perfect mix of comfort and adventure.<\/p><ul><li>About 5,000 sq ft of flexible indoor meeting space in the Chalet, plus outdoor areas<\/li><li>Full-service catering for groups up to 300, from box lunches to formal dinners<\/li><li>Ideal setting for corporate retreats, private parties, or reunions<\/li><li>Access to year-round recreation including golf, skiing, biking, and more<\/li><\/ul><p><strong>The Chalet at Giants Ridge<\/strong><br/>A peaceful getaway with everything you need to relax or collaborate in the heart of Northern Minnesota.<\/p><p><em>Make your next event unforgettable.<\/em><\/p><p>Learn more: <a href=\"https://www.giantsridge.com/private-events/\">giantsridge.com/private-events<\/a><\/p>", "photo": "dc3a165f168fedd1ee3788a556e399bf.jpg", "id": "private-corporate-events"}, {"title": "Shopping", "html": "<p><strong>Gear Up or Grab a Gift<\/strong><br/>Whether you're hitting the slopes, the trails, or the greens &mdash; or just want a great souvenir &mdash; Giants Ridge has you covered.<\/p><p><strong>Mountain Sports Shop<\/strong><\/p><p>Located on the first floor of the Chalet, this shop features top outdoor brands like Burton, Fox, Helly Hansen, and more. Hours follow the daily chairlift schedule; the shop typically opens one hour before the lifts.<\/p><ul><li>Outdoor apparel &amp; equipment for all ages<\/li><li>Helmets, goggles, gloves, socks, sunglasses, and accessories<\/li><li>Snacks, hydration, wax, and Northern Minnesota souvenirs<\/li><\/ul><p><strong>Golf Pro Shops<\/strong><\/p><p>Each course has its own shop stocked with top golf brands (open during golf season):<\/p><ul><li>Nike, Adidas, Under Armour, FootJoy, Greg Norman, Travis Mathew, and more<\/li><li>Golf apparel, accessories, GR-branded items, and equipment<\/li><li>Cleveland club rentals available and refreshed each season<\/li><li>Special orders welcome<\/li><\/ul><p>Shop more: <a href=\"https://www.giantsridge.com/onsite-shopping/\">giantsridge.com/onsite-shopping<\/a><\/p>", "photo": "587687acadd5c6dd632ca170bc592625.jpg", "id": "shopping"}, {"title": "Weddings & Banquets", "html": "<p><strong>Plan Your Dream Wedding or Special Event at Giants Ridge<\/strong><br/>Celebrate your special day surrounded by the natural beauty of Northern Minnesota. Giants Ridge offers stunning indoor and outdoor venues, expert coordination, and full-service banquet options to ensure your event is seamless and unforgettable.<\/p><p><strong>Ceremony Locations:<\/strong><\/p><ul><li><strong>Quarry Overlook<\/strong> &ndash; on the 18th hole of The Quarry, overlooking the Embarrass Mine Pit | Seats up to 300<\/li><li><strong>Alpine Base<\/strong> &ndash; central courtyard location with access to the Gold Room and cocktail bar | Seats up to 300<\/li><li><strong>Placid Hillside<\/strong> &ndash; overlooks the Superior National Forest; ideal for small ceremonies | Seats up to 50<\/li><li><strong>Brascugli Point<\/strong> &ndash; intimate and surrounded by nature | Seats up to 100<\/li><li><strong>The Chalet<\/strong> &ndash; all-in-one indoor ceremony and reception | Seats up to 300<\/li><\/ul><p><strong>Why Choose Giants Ridge?<\/strong><\/p><ul><li>Versatile venue options for any celebration style<\/li><li>Professional event coordination from start to finish<\/li><li>Catering and banquet services<\/li><li>Recreation for your guests: golf, skiing, hiking, biking, and more<\/li><li>Photo backdrops in the Superior National Forest<\/li><\/ul><p>Weddings: (218) 865-8012<br/>Start planning: <a href=\"https://www.giantsridge.com/weddings/\">giantsridge.com/weddings<\/a><\/p>", "photo": "b856a3e44b27bd4614def3b8daa278bb.jpg", "id": "weddings-banquets"}]}, {"title": "Summer & Sun", "items": [{"title": "Children's Play Area", "html": "<p><strong>Location:<\/strong> Tucked between the Main Chalet and The Lodge at Giants Ridge, this play area is conveniently located near the heart of the resort.<\/p><p>A delightful space where children can burn off energy and enjoy fresh air in the Northwoods. Features include:<\/p><ul><li>Multiple <strong>slides<\/strong> with varying routes and heights<\/li><li>Fun <strong>climbing obstacles<\/strong> built for kids<\/li><li>Signage with <strong>regional outdoor adventure info<\/strong><\/li><\/ul><p>Ideal for families&mdash;while the kids play, you can plan your next mountain biking trail, golf round, or lakeside adventure.<\/p><p><strong>Good to know<\/strong><\/p><ul><li><strong>Unsupervised:<\/strong> The play space is not monitored. Please keep an eye on children at all times.<\/li><li><strong>Seasonal:<\/strong> Open as the seasons allow (generally the snow-free months).<\/li><li>Easy to reach from the Mountain Sports Shop, restaurants, and trailheads.<\/li><\/ul><p>More info: <a href=\"https://www.giantsridge.com/explore/\">giantsridge.com/explore<\/a><\/p>", "photo": "1c7b62066f11a8f4f6f0a8ec6edb4f93.jpg", "id": "childrens-play-area"}, {"title": "Climbing Wall", "html": "<p>Experience climbing on the A.R.T.Wall&trade;, a unique 32-foot-tall, four-sided concrete wall modeled from real rock for an incredibly realistic climb. Its solid, cool-to-the-touch surface offers an authentic and safe climbing experience, with auto-belays on most routes.<\/p><p>Climbers must be at least 5 years old, 40 lbs, and 42 inches tall. All climbers sign a waiver; minors (17 and under) need a parent or guardian to sign. Children under 14 must be supervised by an adult.<\/p><p><strong>Hours:<\/strong> Fridays through Sundays during the summer season.<br/><strong>Rates (last posted):<\/strong> Day pass $14; shoe rental $4; chalk bag $4. Passes are sold at the Main Chalet gift shop (first floor).<\/p><p>More info: <a href=\"https://www.giantsridge.com/climbing-wall/\">giantsridge.com/climbing-wall<\/a><\/p>", "photo": "13e9fa2042bc3a978f75ac1b4b584804.jpg", "id": "climbing-wall"}, {"title": "Disc Golf", "html": "<p>Play one of Minnesota’s most scenic and longest disc golf courses, spanning 80+ acres and up to 10,000 feet in fairway distance. The 18-hole mountain course features dual concrete tees, multiple pin placements, and challenging terrain with grassy hills, woods, and rocks.<\/p> <p>Average playtime: 2.5 hours.<br/>Wear sturdy footwear suitable for hiking-style terrain.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/disc-golf/\">https://www.giantsridge.com/disc-golf/<\/a><\/p>", "photo": "1c8d61eb7ef4d5e12cd480f2f49e7c9b.jpg", "id": "disc-golf"}, {"title": "Giants Ridge Bike Park Trail Map", "html": "<p><strong>Discover Northern Minnesota&rsquo;s Premier Mountain Biking Destination<\/strong><\/p><p>Welcome to <strong>Giants Ridge Bike Park<\/strong>, where rugged terrain, scenic views, and thrilling trails converge to offer one of the most diverse biking experiences in the Midwest. Whether you're a beginner, a gravity-fueled adventurer, or a cross-country explorer, there's a trail waiting for you here. Follow the &ldquo;Pre-Ride, Re-Ride, Free-Ride&rdquo; safety model to get the most out of your day.<\/p><p>Full Trail Map (PDF): <a href=\"https://www.giantsridge.com/wp-content/uploads/2024/10/2022-Mountain-Bike-Map-FINAL.pdf\">Giants Ridge Bike Park Map<\/a><br/>Current trail conditions: <a href=\"https://www.trailforks.com/region/giants-ridge/\">Trailforks &ndash; Giants Ridge<\/a><\/p><p><em>Trail lengths below are from the printed map; the resort&rsquo;s website lists some updated gravity-trail lengths.<\/em><\/p><p><strong>Gravity Freeride<\/strong> (lift-accessed jumps, berms, and flow)<\/p><ul><li><strong>Ribbit One, Two, Three<\/strong> &ndash; about 0.28 mi each | Intro trails with berms and smooth rolls<\/li><li><strong>Tadpole<\/strong> &ndash; 1.0 mi | Beginner-friendly flow<\/li><li><strong>Leapfrog<\/strong> &ndash; 1.0 mi | Great transitions and moderate features<\/li><li><strong>Featherlys<\/strong> &ndash; 0.74 mi | Smooth and flowy, intermediate<\/li><li><strong>Return to Send&rsquo;er<\/strong> &ndash; 0.85 mi | Intermediate flow<\/li><li><strong>Sector 12<\/strong> &ndash; 0.6 mi | Big features and progressive lines (black)<\/li><li><strong>Goliath<\/strong> &ndash; 0.74 mi | Advanced freeride challenge (double black)<\/li><\/ul><p><strong>Gravity Technical<\/strong> (steep, rocky, and rooty)<\/p><ul><li><strong>Kitty Cat<\/strong> &ndash; 1.0 mi (green) | Mellow intro to gravity trails<\/li><li><strong>Techonite<\/strong> &ndash; 0.45 mi (black) | Rock features and tighter turns<\/li><li><strong>Granite Gorge<\/strong> &ndash; 0.41 mi (double black) | Big drops and serious challenge<\/li><\/ul><p><strong>Cross-Country: Enchanted Flowest<\/strong><\/p><ul><li><strong>Enchanted Flowest Access<\/strong> &ndash; 0.65 mi | Entry to the XC network<\/li><li><strong>Turtle Trot<\/strong> &ndash; 0.81 mi | Ideal for beginners<\/li><li><strong>Moonshiner<\/strong> &ndash; 1.6 mi | Flow with a few technical surprises<\/li><li><strong>Ridge Runner<\/strong> &ndash; 1.0 mi | Winding through the pines<\/li><li><strong>Fine Wynne<\/strong> &ndash; 1.0 mi | Technical XC<\/li><li><strong>Ore Not<\/strong> &ndash; 0.64 mi | Most difficult<\/li><\/ul><p><strong>Cross-Country: South Trails<\/strong><\/p><ul><li><strong>Bootcamp<\/strong> &ndash; 0.51 mi | Perfect warm-up<\/li><li><strong>Norway<\/strong> &ndash; 1.4 mi | Gentle curves, fun pace<\/li><li><strong>Miners Mile<\/strong> &ndash; 1.0 mi | Fast-paced intermediate XC<\/li><li><strong>Boulder Project<\/strong> &ndash; 0.14 mi | Short, techy section<\/li><\/ul><p><strong>Little Giants Skills Park<\/strong><br/>Practice before hitting the mountain! The Skills Park is perfect for beginners and families, with progressive features designed to build rider confidence and technique.<\/p><p>Bike patrol (when the chairlift is operating): (218) 865-8019<\/p>", "photo": "301f62ceb382afaa368952b3175e9ed3.jpg", "id": "giants-ridge-bike-park-trail-map"}, {"title": "Hiking Trails", "html": "<p>Explore a variety of trails for all skill levels:<\/p><ul><li><strong>Ridgeview Overlook Trail<\/strong>: Easy, 0.3-mile loop<\/li><li><strong>Wynne Lake Vista Trail<\/strong>: Moderat
