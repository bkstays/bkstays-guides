2-mile loop<\/p> <\/li> <li> <p><strong>Sleeping Giant Trail<\/strong>: Difficult, 1.3 miles one way<\/p> <\/li> <li> <p><strong>Narrows Trail<\/strong>: Easy, 0.8-mile loop<\/p> <\/li> <li> <p><strong>Mesabi Trail<\/strong>: Multi-use trail for hiking, biking, and walking<\/p> <\/li> <\/ul> <p>Whether you want a short stroll or a challenging hike, Giants Ridge has a trail for you.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/hiking/\">https://www.giantsridge.com/hiking/<\/a><\/p>", "photo": "4283519679566f0f95cc5999f9422cc8.jpg", "id": "hiking-trails"}, {"title": "Mountain Biking", "html": "<p><strong>Mountain Biking at Giants Ridge<\/strong><\/p> <p>Giants Ridge offers over 9 miles of scenic cross-country trails through the Superior National Forest, ideal for all levels of riders. For more thrill, take the lift-served gravity trails featuring berms, jumps, and rugged terrain—from beginner-friendly to double black diamond.<\/p> <p>A valid pass and signed waiver are required. Helmets strongly recommended for gravity trails.<\/p> <p>More info and trail map: <a href=\"https://www.giantsridge.com/mountain-biking/\">giantsridge.com/mountain-biking<\/a><\/p>", "photo": "54d4d73834cd101128f300d83328ba6f.jpg", "id": "mountain-biking"}, {"title": "Scenic Chairlift Rides", "html": "<p>Take in stunning views of the Superior National Forest with a relaxing ride on the <em>Sarajevo Express<\/em>, Giants Ridge’s high-speed quad chairlift. At the top, enjoy breathtaking vistas of the Iron Range—an unforgettable way to experience the beauty of the mountain.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/scenic-chairlift-rides/\">https://www.giantsridge.com/scenic-chairlift-rides/<\/a><\/p>", "photo": "98f7d2eda98452f5ca11e24e6cf94398.jpg", "id": "scenic-chairlift-rides"}, {"title": "Summer Equipment Rentals", "html": "<p>Explore the outdoors with easy gear rentals available right at Giants Ridge.<\/p> <p><strong>Mountain Bikes (4-Hour Rental)<\/strong><\/p> <ul> <li> <p>Full Suspension Enduro: $75<\/p> <\/li> <li> <p>Kids' Mountain Bike: $45<\/p> <\/li> <li> <p>Includes full-face helmet<\/p> <\/li> <\/ul> <p><strong>Road Bikes (Available Sun–Thurs 9AM–5PM | Fri–Sat 9AM–6PM)<\/strong><\/p> <ul> <li> <p>Adult (4 hours): $28<\/p> <\/li> <li> <p>Kids (4 hours): $20<\/p> <\/li> <\/ul> <p><strong>Helmets<\/strong><\/p> <ul> <li> <p>Full-face helmet (without bike rental): $30<\/p> <\/li> <\/ul> <p><strong>Disc Golf<\/strong><\/p> <ul> <li> <p>Rental Discs: $5<\/p> <\/li> <li> <p>18 Holes Walking: $5<\/p> <\/li> <li> <p>18 Holes with Lift Ride: $12<\/p> <\/li> <\/ul> <p>Book and learn more: <a href=\"https://www.giantsridge.com/summer-equipment-rentals/\">https://www.giantsridge.com/summer-equipment-rentals/<\/a><\/p>", "photo": "961a88603c2a81abc9a8d6ba9c24512e.jpg", "id": "summer-equipment-rentals"}]}, {"title": "Winter & Snow", "items": [{"title": "Fat Tire Biking", "html": "<p>Giants Ridge is a pioneer in Minnesota’s fat tire biking scene. Ride over 60 kilometers of groomed Nordic trails or take on the thrill of downhill fat biking on select gravity-fed trails like Tadpole, Ribbits, Leapfrog, and Kitty Cat.<\/p> <p>With routes winding through the scenic Superior National Forest, this is winter biking at its best.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/fat-tire-biking/\">https://www.giantsridge.com/fat-tire-biking/<\/a><\/p>", "photo": "66e3ee47de09265e46b132b297799a73.jpg", "id": "fat-tire-biking"}, {"title": "Giants Ridge Winter Trail Map", "html": "<p>Explore Giants Ridge with ease using the interactive trail map below. It showcases 35 alpine ski trails served by five chairlifts and two conveyor lifts, plus summer hiking and biking routes. <\/p> <p>Trail &amp; Ski Map: <a href=\"https://www.giantsridge.com/wp-content/uploads/2025/03/2024-Alpine-Map-FInal-scaled.jpg\">https://www.giantsridge.com/wp-content/uploads/2025/03/2024-Alpine-Map-FInal-scaled.jpg<\/a> <\/p>", "photo": "719e70cf9b267b7fbe4d5537b0304d26.jpg", "id": "giants-ridge-winter-trail-map"}, {"title": "Nordic Skiing", "html": "<p>Giants Ridge is a premier Nordic skiing destination with a rich history—its trail system once served as a training ground for the U.S. Ski Team. Today, skiers of all ages and skill levels can explore miles of scenic trails through the Superior National Forest, with options ranging from green to black.<\/p> <p>Whether you're out for a peaceful glide or a serious workout, you’ll find the perfect trail here.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/cross-country-skiing/\">https://www.giantsridge.com/cross-country-skiing/<\/a><\/p>", "photo": "f7dab522f43da879db143a8df73adb55.jpg", "id": "nordic-skiing"}, {"title": "Skiing & Snowboarding", "html": "<p>Hit the slopes at Giants Ridge for an unforgettable winter adventure. With well-groomed runs for all skill levels, top-quality ski and snowboard rentals, and affordable daily tickets and season passes, it’s the perfect spot for beginners and seasoned pros alike.<\/p> <p>Everything you need for a great day on the mountain is right here.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/skiing-snowboarding/\">https://www.giantsridge.com/skiing-snowboarding/<\/a><\/p>", "photo": "5dd731b69f52bdf75bb768548108ce3e.jpg", "id": "skiing-snowboarding"}, {"title": "Snow Tubing", "html": "<p>Snow tubing is a must-try winter activity that's fun for all ages—no experience needed! Glide down one of three tubing lanes, then ride the tow lift back up for more. It’s an easy, exciting way to enjoy the snow with family and friends.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/snow-tubing/\">https://www.giantsridge.com/snow-tubing/<\/a><\/p>", "photo": "cfc29f4f5c02938036cfe3f79558d5f4.jpg", "id": "snow-tubing"}, {"title": "Snowshoeing", "html": "<p>Explore the quiet beauty of winter on over 3.6 miles of scenic snowshoe trails. Wander through peaceful Northwoods landscapes along the Northface, Lower &amp; Upper Sleeping Giant, and Narrows Trails—some even wrapping around Wynne Lake.<\/p> <p>A great way to enjoy the outdoors at a slower pace, surrounded by the natural beauty of the Superior National Forest.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/snowshoeing/\">https://www.giantsridge.com/snowshoeing/<\/a><\/p>", "photo": "4a693c14dced01065063a33efee2a032.jpg", "id": "snowshoeing"}, {"title": "Winter Equipment Rentals", "html": "<p>Rent everything you need for a day on the slopes—from skis and snowboards to snowshoes and fat tire bikes. All downhill packages include a helmet and are fitted by certified rental technicians.<\/p> <p><strong>Rental Options Include:<\/strong><\/p> <ul> <li> <p><strong>Alpine &amp; Snowboard Gear<\/strong><\/p> <\/li> <li> <p><strong>Nordic Ski Equipment<\/strong><\/p> <\/li> <li> <p><strong>Snowshoes<\/strong><\/p> <\/li> <li> <p><strong>Fat Tire Bikes<\/strong><\/p> <\/li> <\/ul> <p><strong>Ski &amp; Snowboard Rental Pricing:<\/strong><br/><em>Includes skis/snowboard, boots, poles, and helmet<\/em><\/p> <ul> <li> <p><strong>Adult (13+):<\/strong> $39<\/p> <\/li> <li> <p><strong>Youth (7–12):<\/strong> $29<\/p> <\/li> <li> <p><strong>Child (6 &amp; under):<\/strong> $14<\/p> <\/li> <li> <p><em>High-performance packages also available<\/em><\/p> <\/li> <\/ul> <p><strong>Add-Ons &amp; A La Carte Options:<\/strong><\/p> <ul> <li> <p>Skis/Board only: $32 (Adult), $21 (Youth)<\/p> <\/li> <li> <p>Boots: $18 (Adult), $14 (Youth), $12 (Child)<\/p> <\/li> <li> <p>Poles: $6<\/p> <\/li> <li> <p>Helmet: $8<\/p> <\/li> <li> <p>High-performance gear available (extra fees apply)<\/p> <\/li> <\/ul> <p><strong>Booking Info:<\/strong><br/>Please <strong>purchase rentals and lift tickets online<\/strong> in advance. After checkout, waivers will be sent to your email—complete them before your visit. Pick up lift tickets at the desk before heading to rentals.<\/p> <p>Note: Rentals are first come, first served and subject to availability.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/equipment-rentals/\">https://www.giantsridge.com/equipment-rentals/<\/a><br/>Questions? Call the Rental Shop at <strong>218-865-8024<\/strong><\/p>", "photo": "662017ed0eedcc7c850d145e8fdc9a7d.jpg", "id": "winter-equipment-rentals"}]}]}}, "signinUrl": "https://script.google.com/macros/s/AKfycbyH0rEgRqprQRh7Kf4lDv1QUssPA7z4Jn7Od_cEGJWa8_TH9UwK0W4EjdJCiB6EX5DlMg/exec"}</script>
