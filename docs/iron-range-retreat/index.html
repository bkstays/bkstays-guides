<script type="application/json" id="guide-data">{"slug": "iron-range-retreat", "name": "Iron Range Retreat", "shortName": "Iron Range Retreat", "welcome": "Welcome!", "hostedBy": "Hosted By Brandon & Katharina", "address": "5935 Voyageurs Trail, Biwabik, MN 55708", "location": [47.548429, -92.274243], "cover": "iron-range-retreat-view.jpg", "coverDesktop": "iron-range-retreat-view.jpg", "background": "iron-range-retreat-view.jpg", "contact": {"phone": "404-358-1552", "sms": "404-358-1552", "email": ""}, "gate": true, "oldLinks": ["/guest/bMSKv5OUNYgyb/"], "layout": [{"heading": "Your Stay", "sections": ["add-to-phone", "welcome", "check-in-arrival", "check-out-departure", "rules", "cancellation-policy", "about-us", "contact-us"]}, {"heading": "The Home", "sections": ["sauna", "bbq-grill", "outdoor-games-fun", "fireplace-firepit", "hot-tub", "indoor-games-fun", "kitchen", "laundry", "playground", "thermostat", "trash", "tv-streaming", "voyageurs-retreat", "wifi"]}, {"heading": "Explore the Area", "sections": ["dining", "emergency", "giants-ridge", "golf", "grocery", "shopping", "weather"]}], "sections": {"add-to-phone": {"id": "add-to-phone", "title": "Add This Guide To Your Phone", "icon": "smartphone", "groups": [{"title": "", "items": [{"title": "Add This Guide To Your Phone", "html": "<p>When you first access this guidebook on your phone, you'll notice a prompt to add it to your home screen. <strong>This is highly recommended<\/strong> because it makes the guide faster and easier to access. And it remains accessible offline. <\/p><p>Following the prompt will add an app icon to your phone. It's just like any other app, but without you needing to download anything or sign in! <\/p><p>Doing this means that every time you want to access the guide, you just need to tap the app instead of searching for the link in your inbox - much easier! <\/p><h2><strong>Adding the app if you’re an Apple user<\/strong><\/h2><p>If you have an Apple device, the \"Add to Home Screen\" option won’t appear for you unless you’re using Safari browser. Don’t worry, this is really simple to solve - just copy the guidebook link and paste it into Safari. From there, you can follow the prompts to add the guidebook to your home screen.<\/p><h2><strong>Always get the latest version of the guidebook <\/strong><\/h2><p>Our guidebook is regularly updated with information designed to help you get the most out of your stay. To avoid missing out on any of these updates, the app automatically updates every 24 hours. If you want to get the updates sooner, just refresh the screen every time you open the guidebook from your home screen - this way you’ll always get the latest version. To refresh the app, swipe the app closed, and tap the app icon again to fully reload. <\/p><h2><strong>Share your guide with your group<\/strong><\/h2><p>You can send the link to this guidebook to everyone who’s travelling with you. That way, everyone has access to all the information they’ll need (which means less hassle for the trip organizer!). <\/p>", "photoHidden": "eb62c72e322ed4e278d8a01199f7aad2.jpg", "id": "add-this-guide-to-your-phone"}]}]}, "welcome": {"id": "welcome", "title": "Welcome", "icon": "cloud-sun", "groups": [{"title": "", "items": [{"title": "Welcome to Iron Range Retreat!", "html": "<p><strong>Welcome to the Iron Range Retreat!<\/strong><\/p> <p>Here is everything you need for your stay with us, from planning your time prior to departure to the Giant's Ridge area, all the way through checkout. In this easy-to-navigate link, you will find information about the cabin, ideas of things to do in the area, our Wi-Fi login credentials, and so much more.<\/p> <p>In order to best enjoy your time in our home, we encourage you to add this \"app\" to your phone. All of the content will even be accessible when your phone is offline.<\/p> <p>* It's not really an \"app\", but more a tool for easy access on your home screen <\/p> <ul> <li>For iPhone: <ul> <li>Tap the square with arrow pointing up at the bottom of your screen<\/li> <li>Select \"Add to Home Screen\"<\/li> <\/ul> <\/li> <li>For Android: <ul> <li>Tap \"Add to Home Screen\" where prompted when first accessing the site<\/li> <\/ul> <\/li> <\/ul> <p><strong>Print or Save a PDF<\/strong><br/>If you would like to print certain pages ahead of traveling, or if you'd like to save a PDF to your device, just tap the print button above. It won't print right away, but will create a PDF which you can save or print.<\/p> <p><strong>Contacting Us<\/strong><br/>We pride ourselves on swiftly meeting guest needs. We can be reached as follows:<\/p> <ul> <li>Preferred: Airbnb or VRBO message<\/li> <li>Phone: 404-358-1552 (emergencies)<\/li> <li>Instagram: @<a href=\"https://www.instagram.com/bk_stays/\">Bk_stays<\/a><\/li> <li>Facebook: <a href=\"https://www.facebook.com/profile.php?id=61551815370553\">BK Stays<\/a><\/li> <\/ul> <p><strong>What Next?<\/strong><br/>Please relax, unwind, have fun, and enjoy your stay!<\/p>", "photo": "abcb847cae6e6d8d41aa65f0688e170e.jpg", "id": "welcome-to-iron-range-retreat"}, {"title": "Video Tour - Iron Range Retreat", "html": "<p>Welcome to The Iron Range Retreat! <br><br>This MASSIVE 6,000 sqft home has 6 bedrooms, 5 bathrooms, sleeps 20 guests, and is LOADED with amenities! It is centrally located near Giants Ridge Ski Resort, The Quarry &amp; Legend Golf Courses, and has public boat and lake access in Voyageurs Retreat. Enjoy a barrel sauna, jacuzzi, game room, outdoor playground, firepit, both lake and ski slope views. This is the Ultimate Minnesota Escape Up North for large groups of Family and Friends All Year Long!<\/p> <p><iframe src=\"https://www.loom.com/embed/ae9577919c37413297fc13323b112b77?sid=fb782ac9-4ff0-4e1d-b226-8c5c9c027096\"><\/iframe>\"<\/p>", "photo": "e26882150776b7f46e04cbbdb11777da.jpg", "id": "video-tour-iron-range-retreat"}, {"title": "Thank You", "html": "", "video": "https://www.loom.com/embed/b28bdc96ce854c8380b64e6ebe4f1cb7", "id": "thank-you"}]}]}, "check-in-arrival": {"id": "check-in-arrival", "title": "Check In + Arrival", "icon": "key-round", "groups": [{"title": "", "items": [{"title": "Driving Directions", "html": "<p>We could post turn-by-turn directions here.<\/p> <p>OR - you could just use <strong>Waze or Google Maps<\/strong>.<\/p> <p>Either option will get you to the home ;)<\/p> <p><strong>Address: 5935 Voyageurs Trail, Biwabik, MN 55708<\/strong><\/p>", "photo": "086591e685171217b89de3694e2b3326.jpg", "id": "driving-directions"}, {"title": "Access Codes / Instructions", "html": "<p>The Access Code for the front door is<\/p> <p>1552✔<\/p> <p>To lock the door, simply press the lock button. Please make sure all external doors are locked whenever you leave.<\/p> <p>* If for some reason the code doesn't work please call me at <a href=\"tel:404-358-1552\">404-358-1552<\/a>. I will get you the lockbox code for the spare key!<\/p>", "photo": "730742e2babb8d2cedbe0a30eac61d46.jpg", "id": "access-codes-instructions"}, {"title": "4:00 PM Check-in", "html": "<p>If you would like an early check-in, please see our <a href=\"#/info/check-in-arrival/early-check-in-half-day-stay-option\">Early Check In (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 4:00 PM is a strict check-in time. If you are arriving early, take a look at the Local Recommendation section. We've listed a few things to do around the area while we prepare the home!<\/p>", "photo": "11e339c716ed8af07a28c05e286c2caa.jpg", "id": "4-00-pm-check-in"}, {"title": "Early Check In (Half Day Stay Option)", "html": "<p>Want to get here early? Add a <strong>Half Day Stay<\/strong> and you can arrive as early as <strong>8:00 AM<\/strong> on your arrival day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer early check-in because of our tight cleaning and maintenance schedule.<\/p>", "photo": "6db9b8952aaf5792e4af093537545794.jpg", "id": "early-check-in-half-day-stay-option"}]}]}, "check-out-departure": {"id": "check-out-departure", "title": "Check Out + Departure", "icon": "hand", "groups": [{"title": "", "items": [{"title": "10:00 AM Check-out", "html": "<p>If you would like a late check-out, please see our <a href=\"#/info/check-out-departure/late-check-out-half-day-stay-option\">Late Check Out (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 10:00 AM is a strict check-out time. <\/p>", "photoHidden": "ea9c00f35f36edb8d89dcc92e7f562cc.jpg", "id": "10-00-am-check-out"}, {"title": "Late Check Out (Half Day Stay Option)", "html": "<p>Not ready to leave? Add a <strong>Half Day Stay<\/strong> and you won't need to check out until <strong>8:00 PM<\/strong> on your departure day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer late check-out because of our tight cleaning and maintenance schedule.<\/p>", "photoHidden": "6db9b8952aaf5792e4af093537545794.jpg", "id": "late-check-out-half-day-stay-option"}, {"title": "Extended Stay?", "html": "<p>Would you like to add another night? If we have availability the day before or after your reservation, we would love to offer you that extra night at a great discount. We'll even cover the taxes and fees! Just let us know if your travel plans are flexible and we will make sure to accommodate the changes!<\/p>", "photoHidden": "585cb6b5ac72b31289b8dae13c068a03.jpg", "id": "extended-stay"}, {"title": "Check-out Process", "html": "<p>Standard check-out is at 10:00 AM on your departure date (Unless you've paid for a late check-out). <\/p> <p>When you've finished your stay, technically, you can just leave no questions asked lol :) But, if you really wanted to give our cleaning team some love, we would appreciate it if you would take care of a few simple things:<\/p> <ul> <li>Dishwasher - Load and start the dishwasher<\/li> <li>Grill - Please Properly Clean If Used<\/li> <li>Jacuzzi - Close and latch the lid <\/li> <li>Sauna - Close the door.<\/li> <li>Towels - Place all used towels in the shower.<\/li> <li>Trash Is Critical! Please Review Our Trash Section <a href=\"#/info/trash\">Here<\/a>!<\/li> <li>Lock Up - Lock all doors<\/li> <\/ul> <p>We hope you guys had an amazing stay! Thank you again and safe travels back home.<\/p>", "id": "check-out-process"}, {"title": "Lost and Found", "html": "<p>Please triple-check the home before departing to ensure you have not left anything behind. Common items left behind include phone chargers, computer cords, passports/licenses, clothes, electronics, eyeglasses, toiletries/makeup, documents, and toys.<\/p><p>Please send a message the moment you realize you've left something behind. <br><br>We completely understand that things can get left behind — and we’re more than happy to help get your items back to you! We’ll gladly ship your lost item using the postal service or carrier of your choice (standard, express, or overnight). <br><br>We kindly ask for the shipping cost, plus a $20 service fee to cover the time and materials for packaging and handling. Be certain to include:<\/p><ul><li>Item description<\/li><li>Where you think you may have left the item<\/li><li>The name on the reservation<\/li><\/ul><p>Just let us know how you’d like it sent, and we’ll take care of the rest!<\/p>", "photoHidden": "8da278ec14e085d81ebe06c22b24af10.jpg", "id": "lost-and-found"}]}]}, "rules": {"id": "rules", "title": "Rules and Regulations", "icon": "book-open", "groups": [{"title": "", "items": [{"title": "Age Requirement", "html": "<p>The minimum age requirement to book is 25 years of age. The home is child friendly, but not childproof, and may not be suitable for infants or children without adult supervision.<\/p>", "id": "age-requirement"}, {"title": "Confetti / Glitter", "html": "<p><strong>No Confetti or Glitter<\/strong><br>We understand that special occasions call for celebration - and sometimes decorations! However, confetti and glitter are extremely difficult to clean and can cause damage to furniture and floors. Any evidence of confetti or glitter left behind will incur additional cleaning fees. Please celebrate responsibly and help us keep the home in great condition - no confetti or glitter, please.<\/p>", "id": "confetti-glitter"}, {"title": "Damages", "html": "<p>Guests are financially responsible for any damage, theft, missing items, or violations of house rules during their stay. You could be charged for: Property damage or theft; Unauthorized pets; Excessive cleaning or evidence of smoking; Exceeding occupancy or parking limits; Any other violations outlined in this agreement. You will be notified in writing if any damage is found. Major damage that delays the next check-in may result in additional charges for guest relocation or compensation. Please report any existing damage at check-in, and notify us right away if anything breaks or is damaged during your stay, even if it’s small. We understand accidents happen and can often replace or repair items quickly if we're informed. Guests are responsible for damage caused by misuse or negligence.<\/p>", "id": "damages"}, {"title": "Fire Safety and Prevention", "html": "<p>Guest agrees to comply with all local, county, and state fire restrictions, including any active burn bans or official fire safety regulations. Guest is responsible for helping maintain a fire-safe environment throughout their stay. This includes, but is not limited to; Ensuring that all outdoor fires (e.g., bonfires or fire pits) are fully extinguished after use, before going to bed, and before vacating the property; Never leaving open flames or burning embers unattended; Using only designated fire areas and keeping all fires small, controlled, and manageable; Ensuring fire extinguishers located in the home are accessible at all times and used in case of fire emergencies.<\/p><p>Additionally, Guest(s) acknowledges that outdoor grills must be cleaned and properly maintained after each use to prevent fire hazards. Guest agrees to: Clean the grill thoroughly after each use; Remove all grease and dispose of it safely in the trash (never on the ground or around the property); Ensure the grill is turned off, left in safe, clean, and operable condition, and covered if applicable; Keep a fire extinguisher nearby when using the grill.<\/p><p>Failure to follow fire safety guidelines may result in fines, eviction, or financial liability for any resulting damages.<\/p>", "id": "fire-safety-and-prevention"}, {"title": "Jacuzzi", "html": "<p>Never Add Any Foreign Substance To The Jacuzzi (No Bubbles or Soaps)!<\/p> <p>Always Put The Cover Back On When Not In Use!<\/p> <p>Do Not Raise The Temp Above 102*F<\/p> <p>The jacuzzi is thoroughly inspected after each guest. Failure to adhere will cause additional maintenance and cleaning measures, or worse, damage to the unit. Fines will be imposed if evidence of foreign substance or damage is found during inspection.&nbsp;<br><br><strong>Please refer to the &ldquo;Hot Tub/Jacuzzi&rdquo; section in the guide for full details and usage instructions.<br><iframe src=\"https://www.loom.com/embed/869ce97a675a4131b1d26d88691f3c89?sid=27a0c5a0-7ead-4947-8d57-641364f2c877\"><\/iframe>\"<\/strong><\/p>", "photoHidden": "864611f47f3e9d662b42f905bc72800a.jpg", "id": "jacuzzi"}, {"title": "Occupancy - Max 20 Persons (Age 2+)", "html": "<p>There are many sleeping options and plenty of square footage. But - we still want to try not to overcrowd our home. The maximum guest limit is 20 persons (age 2+) unless otherwise approved. Please reach out prior to arrival if you have any additional capacity requests. Any unapproved guest overcapacity will be charged an additional fee.&nbsp;<\/p>", "id": "occupancy-max-20-persons-age-2"}, {"title": "Parking Rules - HOA Regulated", "html": "<p>Commercial vehicles, buses and inoperative or unlicensed vehicles or recreational equipment of any type may not be kept, parked or stored anywhere on the Property except within a Dwelling&rsquo;s garage.<\/p> <p>No operable passenger vehicles, lawn tractors, trailers, motorcycles, golf carts, snowmobiles, watercraft or other recreational equipment may be parked, kept or stored on the Property (i) within 30 feet from the right of way of the common roadway or within 10 feet from the property line of any Unit, or (ii) for more than fourteen (14) consecutive days, unless parked, kept or stored within a garage or otherwise screened in a manner such that the items are not visible from another Unit, any community association common element, the lake, or the common roadway. Such vehicle/equipment shall be kept and maintained in a clean and orderly condition.<\/p> <p>Parking and storage upon the streets serving the Property is prohibited except in those areas designated by appropriate signage as permitting parking.<\/p>", "photo": "55cf97cc813b430cc35652a9ba374ff3.jpg", "id": "parking-rules-hoa-regulated"}, {"title": "Pet Policy - Max 2 Dogs (with approval)", "html": "<p>This home is pet-friendly, so you can bring your furry friend from home! <strong>MAX 2 DOGS ALLOWED<\/strong> per stay, with approval. Hypoallergenic breeds are preferred.<\/p><p>All pets must be on your reservation. Please let us know beforehand so we can take the proper cleaning measures. A <strong>$150 pet fee<\/strong> will be added to your reservation for any approved pet before arrival.<\/p><p>If you bring a pet without notifying your hosts, you will be charged <strong>double<\/strong> for any unapproved pet.<\/p>", "id": "pet-policy-max-2-dogs-with-approval"}, {"title": "Reservation Adjustments", "html": "<p>If you need to make any change in your stay, for example, regarding the number of guests, bringing a service animal or anything at all, please let us know ahead of time so we can accommodate you. However, if you do not disclose any changes, like an animal or extra guests (above max occupancy) you could be subject to a reservtion cancellation without refund. <\/p>", "id": "reservation-adjustments"}, {"title": "Security Camera", "html": "<p>Guests acknowledge and accept there are cameras located on the exterior of the property. Guests hereby acknowledge that the cameras location records video directly in front of the front entrance door and leading to the parking area, and this constitutes a public area. Guests understand that video may be captured, and no conversations located within this area may be deemed confidential. The intent of this camera is not to infringe on the privacy of Guests, but to serve as a safety and security measure.<\/p>", "id": "security-camera"}, {"title": "Septic and Plumbing", "html": "<p>Please ONLY PUT TOILET PAPER in the toilet and throw the remaining in the trash!<\/p><p>Tampons, baby wipes, paper towels, or anything other than toilet paper in the toilet will clog the drain/tank. This can result in clogged toilets, and septic damage and will result in damage fees.<\/p>", "id": "septic-and-plumbing"}, {"title": "Smoking", "html": "<p>We have a strict No Smoking Policy. Smoking is not allowed on the property in any form. This includes, but is not limited to marijuana, pipes, cigars, cigarettes, vaping, e-cigs, etc. If our cleaners or cameras report evidence of smoking you will be charged a 500$ smoke remediation fine. <\/p>", "id": "smoking"}, {"title": "Trash", "html": "<p>Please check the <a href=\"#/info/trash\">\"Trash\"<\/a> section in the guide for full instructions on where and how to dispose of your garbage.<\/p>", "photo": "7af01a3ccf3e47a8c389e6a8ad3a0564.jpg", "id": "trash"}]}]}, "cancellation-policy": {"id": "cancellation-policy", "title": "Cancellation Policy", "icon": "circle-x", "groups": [{"title": "", "items": [{"title": "Cancellation Policy", "html": "<p>Our cancellation policy varies by platform (Airbnb, VRBO, Direct, etc.) and will have been clearly stated at the time of booking under one of the following categories: strict, firm, moderate, or flexible.<\/p><p>We strongly recommend purchasing travel insurance to protect your investment. If you purchased travel insurance, please contact your provider for help with cancellations or disruptions.<\/p><p><strong>State of Emergency / Evacuations<\/strong><\/p><p>If travel insurance was not purchased, cancellations are handled per the terms of your reservation. Exceptions may be made only when <strong>both<\/strong> of the following apply:<\/p><ul><li>A <strong>Governor-issued State of Emergency<\/strong> has been declared for <strong>St. Louis County, Minnesota<\/strong> (the county where the home is located), <strong>and<\/strong><\/li><li>A <strong>mandatory evacuation order or travel restriction<\/strong> is actively in effect for the property's address during your reservation dates.<\/li><\/ul><p>General weather advisories or conditions affecting other areas do not qualify.<\/p><p><strong>If the Home Becomes Unavailable<\/strong><\/p><p>In the event the property becomes unavailable due to circumstances beyond the host's control, including but not limited to fire, flood, structural damage, utility failure, or a government-declared emergency, the host reserves the right to cancel a confirmed reservation. In such circumstances, guests will receive a full refund of all amounts paid and the host's liability shall be limited solely to that refund.<\/p>", "id": "cancellation-policy"}]}]}, "about-us": {"id": "about-us", "title": "About Us", "icon": "users", "groups": [{"title": "", "items": [{"title": "About Your Hosts", "html": "<p>Our first trip to North Georgia was way back in the summer of 2021 and we undeniably fell in love. The mountain vibes left such a good impression, that we decided as a family to find a home away from home. The surrounding area has so much to offer for families, friends, and couples during every season of the year. We have had the chance to experience so much that Blue Ridge, Ellijay, and the North Georgia Mountains have to offer, but we still have a long bucket list waiting for our next adventure. We have a 6-year-old daughter and a 3-year-old son and love traveling and spending time exploring new places as a family.<\/p>", "photo": "about-us-family-collage.jpg", "photoFit": "full", "id": "about-your-hosts"}]}]}, "contact-us": {"id": "contact-us", "title": "Contact Us / Book Again", "icon": "phone", "groups": [{"title": "", "items": [{"title": "Thank You For Staying With Us", "html": "<p><strong>Thank you for staying with us, and we hope you enjoyed your stay.<\/strong> If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time. <\/p><p><strong>We love online reviews!<\/strong><\/p><p>Vrbo and Airbnb automatically sends you a review request. All you need to do is click the \"leave a review\" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. Was it the comfy beds; the local information and recommendations; or perhaps the location and all the fun activities to do at the home?<\/p><p><br><strong>Thank you!<\/strong><\/p><p>Brandon and Katharina <\/p>", "photoHidden": "4d239b49ed0744691981d3decf88b377.jpg", "id": "thank-you-for-staying-with-us"}, {"title": "Returning Guests", "html": "<p>We would love to have you stay again! In fact, please take advantage of booking directly with us at <a href=\"https://www.bkstays.com/about-us\">bkstays.com <\/a>- please reach out to us on Instagram, Facebook, or directly to Brandon at 404 - 358 - 1552. <\/p>", "photoHidden": "5e53f078d45d701f01a19dcba10f0cc7.jpg", "id": "returning-guests"}, {"title": "Follow Us On Social Media", "html": "<p>Let's Be Social! Follow Us On Social Media Below<\/p><p>Facebook: BK Stays<\/p><p>Instagram: @bk_stays<\/p>", "photoHidden": "067e96592ab64bb41d8e0f51c9754500.jpg", "id": "follow-us-on-social-media"}, {"title": "How To Contact Us", "html": "<p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.  We can be reached at the contact info below:<\/p><ul><li>Message: through Airbnb / VRBO (simple assistance)<\/li><li>Phone: 1-404-358-1552 (emergencies)<\/li><li>Instagram or Facebook @ bk_stays<\/li><\/ul>", "photoHidden": "4f717eaaf0303b1fec1a0ee821f299a1.jpg", "id": "how-to-contact-us"}]}]}, "wifi": {"id": "wifi", "title": "WiFi / Internet Details", "icon": "wifi", "groups": [{"title": "", "items": [{"title": "WIFI / Internet Details", "html": "<p>There is free Wi-Fi for your use. The details are: <br><br>WIFI Name: Iron Range Reteat<\/p> <p>WIFI Password: IronRangeRetreat<\/p> <p>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us.<\/p>", "photo": "5ed7c444a9811d008c50a348f27c69d5.jpg", "id": "wifi-internet-details"}]}]}, "sauna": {"id": "sauna", "title": "Barrel Sauna", "icon": "heater", "groups": [{"title": "", "items": [{"title": "Barrel Sauna", "html": "<p>Please Watch and Read Before Use!<\/p>  <p>The LEFT dial is the temperature - Min to Max etc. Leave the dial just slightly under MAX- don't crank it to full MAX.<\/p> <p>The RIGHT dial is the timer. Each number is for 1 hour, 2 hours, 3 hours, 4 hours etc.<\/p> <p>Do Not Turn past 1 hour (straight to 2, or 3 or more) or the heater WILL NOT start until 2/3 hours).<\/p> <p>Simply turn the dial to ONE (1) and the heater will run on MAX for ONE (1) Hour.<\/p> <p>Put the Left Dial Just Under Max, and Select 1 Hour on the Right Dial.<\/p> <p>Keep it Simple :)<\/p>", "video": "https://www.loom.com/embed/cfff570eb09344dc8efbf9701171bf8d", "photo": "0293303cde6b68c98044f02b4fcaa56d.jpg", "id": "barrel-sauna"}]}]}, "bbq-grill": {"id": "bbq-grill", "title": "BBQ Grill + Propane", "icon": "flame", "groups": [{"title": "", "items": [{"title": "Propane Grill", "html": "<p>There is a propane grill for your personal use on the back patio. Please follow the grill instructions carefully when using propane. Do not forget to close the valve when you're done!<\/p> <p>We always try to keep a full tank on site - but sometimes they run out before we can get a replacement there. If you run out and need a replacement, we can try and get you a replacement delivered - but - depending on timing - it may be faster for you to run and exchange the empty.<\/p> <p>Of course we will reimburse you for the tank and your time!<\/p>", "photo": "42fb95ab6ed02128e28184f6c5ffa06a.jpg", "id": "propane-grill"}, {"title": "Propane Tank(s)", "html": "<p>We TRY to keep a full propane tank (and an extra one) at the home. Most of the time we can get them swapped out before check in. Unfortunately, that's not always possible. We apologize if you did not find a full propane tank upon arrival!<\/p><p>We can try and coordinate another person to deliver you a new tank, but their availability might not be immediate. If you need something quick, we recommend running to the store and exchanging the empty one(s) or a new one - and yes of course we would be happy to reimburse you for the tank and your trouble! Just let us know. Thank You.<\/p>", "photo": "05f49508259ad5443ec6e6d70501e8b4.jpg", "id": "propane-tank-s"}]}]}, "fireplace-firepit": {"id": "fireplace-firepit", "title": "Fireplace + Firepit", "icon": "flame-kindling", "groups": [{"title": "", "items": [{"title": "Firepit / Firewood", "html": "<p>Due to insurance/safety reasons, we are not able to currently provide any firewood - but you are more than welcome to drop by any local convenience store or big box store and purchase as much as you'd like.<\/p><p>Never leave the fire unattended, and make sure to extinguish it before going to bed.<\/p><p>Please Be Safe! <\/p>", "photo": "cb3e3c6d829b2b4d31be41906f650aa2.jpg", "id": "firepit-firewood"}, {"title": "Fireplace", "html": "<p>The fireplace button is on the wall to the right and it operates similarly to a \"thermostat\" - Gently slide the dial to the right to increase the heat/flame size, and back to the left to lower it, or turn it OFF. The pilot light should already bit lit upon your arrival, so you shouldn't need to touch anything on the actual fireplace itself.<\/p>", "photo": "f18cbaffb016ce26b3f724b690735ad6.jpg", "id": "fireplace"}]}]}, "hot-tub": {"id": "hot-tub", "title": "Hot Tub / Jacuzzi", "icon": "bath", "groups": [{"title": "", "items": [{"title": "Hot Tub / Jacuzzi", "html": "<p>Please Watch the Jacuzzi Video Below for Directions<\/p> <p>Shower Before Entering<\/p> <p>No Lotions, Soaps, Oils, Bubble Products (they cause damage)<\/p> <p>If a Foreign Substance is Found, a Damage Fee Will Be Assessed<\/p> <p>Do Not Add Any Outside Chemicals to the Spa<\/p> <p>No Glass In/Around the Jacuzzi (Plastic Only)<\/p> <p>Children Under 16 Require Adult Supervision At All Times<\/p> <p>Pregnant Individuals Should Consult a Physician Before Use<\/p> <p>Always Cover the Jacuzzi When Not in Use<\/p> <p>Unclip All Four Safety Clips Before Opening the Lid<\/p> <p>Connect All Four Safety Clips When Covering<\/p> <p>Turn Off All Jets When Not in Use<\/p> <p>Do Not Press the &ldquo;Menu&rdquo; Button<\/p> <p>Use Only Temp Up, Down, Jets 1/2, and Light<\/p> ", "video": "https://www.loom.com/embed/869ce97a675a4131b1d26d88691f3c89", "photo": "864611f47f3e9d662b42f905bc72800a.jpg", "id": "hot-tub-jacuzzi"}]}]}, "indoor-games-fun": {"id": "indoor-games-fun", "title": "Indoor Games + Fun", "icon": "gamepad-2", "groups": [{"title": "", "items": [{"title": "Game Room Fun!", "html": "<p>This house is packed with indoor fun, including Pool, Ping Pong, Shuffleboard, Foosball, Air Hockey, Darts, and a full set of poker chips with a playing table. If anything is missing or broken, PLEASE LET US KNOW IMMEDIATELY so we can order any replacements.<\/p>", "photo": "4ff528e7861ceb58eb83b40b13bffde0.jpg", "id": "game-room-fun"}, {"title": "Cards, Games + More", "html": "<p>We try to keep a great selection of puzzles, books, board games, and card games for the whole family.<\/p><p>If something is missing or broken, PLEASE LET US KNOW immediately so we can order a replacement. <\/p><p>Feel Free to Help Yourself, But...<\/p><p>Please keep everything neat and tidy for the next guests as well :)<\/p><p>Missing puzzle pieces or having only half the chess pieces isn't fun for anyone!<\/p>", "photo": "generic-chess-board.jpg", "id": "cards-games-more"}]}]}, "kitchen": {"id": "kitchen", "title": "Kitchen, Supplies + Appliances", "icon": "cooking-pot", "groups": [{"title": "", "items": [{"title": "Kitchen + Supplies + Appliances", "html": "<p>We have a fully stocked kitchen with a stainless steel appliance package. We try to provide everything you may need, but we're not perfect. If you have ANY suggestions for small appliances, dishware, flatware, glassware, or even dry goods that would be beneficial - let us know! We would be happy to see if it's possible to place an Amazon/Walmart/Grocery delivery order for you during your stay :)<\/p>", "id": "kitchen-supplies-appliances"}]}]}, "laundry": {"id": "laundry", "title": "Laundry", "icon": "washing-machine", "groups": [{"title": "", "items": [{"title": "Laundry", "html": "<p>We do have a private washer and dryer located in the home. There should be a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in, close the door, and hit start. <\/p>", "photo": "794607d57a2c8fc964701bb9c7a73b7a.jpg", "id": "laundry"}]}]}, "outdoor-games-fun": {"id": "outdoor-games-fun", "title": "Cornhole / Bags", "icon": "target", "groups": [{"title": "", "items": [{"title": "Cornhole / Bags", "html": "<p>Nothing beats a little friendly competition in the fresh mountain air! Grab the cornhole boards and bags, set them up outside, and enjoy the views while you play. Whether it's a quick game before dinner or a full-on family tournament, it's a great way to spend time outdoors together.<\/p><p>There should be a set of all-weather cornhole boards somewhere on the patio. If you notice anything is broken or missing, please let us know right away so we can order replacements. It would be very helpful if you would return them to a covered area after each day so they don't wander off or get ruined in the weather :)<\/p>", "photo": "9df12f8c833b036dda9b1e92c15acd40.jpg", "id": "cornhole-bags"}]}]}, "playground": {"id": "playground", "title": "Playground", "icon": "castle", "groups": [{"title": "", "items": [{"title": "Playground", "html": "<p>Children 12 and under!<\/p> <p>Probably our favorite playground in the area. No need to leave the home for the kids to burn off some energy! It&rsquo;s a safe and fun space for endless playtime. Please ensure an adult is always present and never leave children unattended.<\/p>", "photo": "8fee4c1d51fe8b474d3ac66fa1f5a52e.jpg", "id": "playground"}]}]}, "trash": {"id": "trash", "title": "Trash", "icon": "trash-2", "groups": [{"title": "", "items": [{"title": "Trash", "html": "<p>Please Remove All Trash Each Night or at Checkout<\/p> <p>HOA Dumpsters are located 1.7 miles North on Voyager&rsquo;s Trail -&nbsp;<\/p> <p>Directly Across From Sunset Road (map below)<\/p> <p>All trash must be Bagged and Secured/Tied before placing it in the HOA dumpsters.<\/p> <p>No Loose Trash Allowed In Dumpsters Cans<\/p> <p>3 Trash Cans in Garage For Temporary Storage Only.<\/p><p><img src=\"../img/d605103901fba299481901b9dffa7470.jpg\" alt=\"\"><\/p>", "photo": "7af01a3ccf3e47a8c389e6a8ad3a0564.jpg", "id": "trash"}]}]}, "tv-streaming": {"id": "tv-streaming", "title": "TV's + Streaming", "icon": "tv", "groups": [{"title": "", "items": [{"title": "TV's + Streaming", "html": "<p>We have Hi-Speed WIFI for all of your streaming needs!<\/p><p>There are Smart TV's throughout the entire home.<\/p><p>Go to the TV Home Screen<\/p><p>Search For (or Download) The Channel App You Want To Watch &amp; Login to your TV Provider.<\/p><p>Please don't hesitate to reach out if you need provider login assistance!<\/p>", "photo": "729ecb38918b0e99bc0a0ec5fa74c6d2.jpg", "id": "tvs-streaming"}]}]}, "thermostat": {"id": "thermostat", "title": "Thermostat", "icon": "thermometer", "groups": [{"title": "", "items": [{"title": "Heating / Cooling", "html": "<p>There are (3) Ecobee Thermostats on the wall. The first (1st) is on the main level in the Great Room / Hallway, the second (2nd) is upstairs in Bedroom 4, and the third (3rd) is downstairs on the wall near the stairs in the game room.&nbsp;<\/p> <p>If you're running the air conditioning or heating - PLEASE keep all windows and outside doors closed to ensure they operate at maximum efficiency. We recommend a setting of about 72*F which we find keeps the place at a comfortable temperature.<\/p>", "photo": "0e0d8f67a1daad47f9505a1e6b070b6d.jpg", "id": "heating-cooling"}]}]}, "voyageurs-retreat": {"id": "voyageurs-retreat", "title": "Voyageurs Retreat (HOA)", "icon": "trees", "groups": [{"title": "", "items": [{"title": "Hiking, Biking and Water Access", "html": "<p><strong>Location<\/strong><\/p> <p>Our home is located on the southernmost point of Wynne Lake within the HOA.<\/p> <p><strong>Biking Trails<\/strong><\/p> <p>Look for <strong>green dashed lines<\/strong> on the HOA map(s) &mdash; these indicate 8&ndash;10 ft wide aggregate bike paths that run along the entire east side of the HOA.&nbsp;These trails connect directly to the <strong>Mesabi Trail<\/strong>&nbsp;farther north (where the line turns <strong>solid red<\/strong> on the map).<\/p> <p><strong>Hiking Trails<\/strong><\/p> <p>Marked with <strong>orange dashed lines<\/strong> on the map. These tTrails begin <strong>right near our home<\/strong>, continuing north alongside both lakes and extending all the way to<strong> <\/strong>Sabin Lake near the Embarrass River.<\/p> <p><strong>Parks, Picnic Areas &amp; Lake Access<\/strong><\/p> <p>Located along the <strong>east sides of Wynne Lake and Sabin Lake<\/strong>, you&rsquo;ll find numerous HOA access points for:<\/p> <p>Picnic areas, Benches, Canoe/kayak launches, Swimming spots, Day-use docks - etc.<\/p> <p>Refer to your map for icons identifying each amenity.<\/p> <p><strong>Recommended Swimming Area<\/strong><\/p> <p>We recommend guests visit <strong>Red Pine Beach Park, <\/strong>located about 1 mile&nbsp;up the road.<\/p> <p><strong>Boat Access<\/strong><\/p> <p><strong>Wynne Lake Boat Launch<\/strong><\/p> <p>- located on the <strong>northwest side of Wynne Lake<\/strong>, near Giants Ridge ski area.<\/p> <p><strong>Sabin Lake Boat Launch<\/strong><\/p> <ul> <li>located on the <strong>west side of Sabin Lake<\/strong>, near The Legend Golf Course.<\/li> <\/ul>  <p><em>Note: Wynne Lake and Sabin Lake are not navigable between each other by motorboat.&nbsp;<\/em><\/p>", "photo": "bbdcdcddeefeaf05355e40791cb4f683.jpg", "id": "hiking-biking-and-water-access"}, {"title": "Sabin Lake Map", "html": "<p><img src=\"../img/d325e75679c05552440a615d8c0fa490.jpg\" alt=\"\"><\/p>", "photo": "602f204cb05acdb03232057891cd2670.jpg", "id": "sabin-lake-map"}, {"title": "Wynne Lake Map", "html": "<p><img src=\"../img/ee37673bf93576f8e23c475de2c41806.jpg\" alt=\"\"><\/p>", "photo": "986d39b03a3699da14519cb072d6ce80.jpg", "id": "wynne-lake-map"}]}]}, "dining": {"id": "dining", "title": "Dining Out", "icon": "utensils", "groups": [{"title": "Breakfast, Brunch, + Coffee Recommendations", "items": [{"title": "Dining Specials: Rotating Chophouse Menu", "html": "<p>Available Wednesdays through Sundays from 4 PM to close, the Chophouse Menu offers a rotating selection of expertly crafted favorites. Enjoy succulent steaks, grilled chops, savory sides, and decadent desserts—all designed to deliver a memorable gourmet experience.<\/p> <p>Pair your meal with a curated selection of brews and wines for the perfect evening at Giants Ridge.<\/p> <p>View the menu here: <a href=\"https://www.giantsridge.com/wp-content/uploads/2025/08/ChopHouse-Special-Online-Menu-August-2025.png\">Chophouse Menu (August 2025)<\/a><br/>More info: <a href=\"https://www.giantsridge.com/fb-specials/\">https://www.giantsridge.com/fb-specials/<\/a><\/p>", "photo": "0b092f0fe09ec251e8074d62df8a8edb.jpg", "id": "dining-specials-rotating-chophouse-menu"}, {"title": "Megan’s Family Restaurant", "html": "<p>Facebook Link: <a href=\"https://www.facebook.com/p/Megans-Family-Restaurant-100056595738782\">https://www.facebook.com/p/Megans-Family-Restaurant-100056595738782<\/a><\/p> <p>Phone: (218) 229‑3418<\/p> <p>A cozy, hometown diner serving American comfort classics in a low-key, family-style setting. Perfect for an early breakfast (try the Hungry Man platter or biscuits &amp; gravy) or a casual lunch—burgers, sandwiches, classic entrees. Friendly staff, affordable prices, and a true Iron Range atmosphere. Open most days from 7 AM, with extended hours on weekends and Fridays. Ideal for fueling up before exploring the parks!<\/p>", "photo": "013926368d099d9ebf3edfc8bd1687d1.jpg", "loc": [47.528751, -92.236544], "pin": "restaurants", "id": "megans-family-restaurant"}, {"title": "Wacootah Grille", "html": "<p>🌐 <a href=\"https://www.giantsridge.com/wacootah-grille\">https://www.giantsridge.com/wacootah-grille<\/a><\/p> <p>📞(218) 865‑8045<\/p> <p>A cozy clubhouse restaurant with breathtaking views of the Quarry golf course and cliff‑edged lakes. Open from sunrise to sunset, it serves full-service breakfast, lunch, dinner, and a full bar. Ideal for a scenic morning pancake/brunch, afternoon bite, or relaxed evening meal after your outdoor adventures. Reserve patio seating if visiting on weekends or summer evenings!<\/p>", "photo": "064510bc126e9a1f86a027eec7abac8c.jpg", "loc": [47.53832, -92.30727], "pin": "restaurants", "id": "wacootah-grille"}]}, {"title": "Dinner + Drinks Recommendations", "items": [{"title": "The Alibi Bar – Gilbert", "html": "<p>🌐https://www.facebook.com/gilbertalibi<\/p> <p><strong>📞&nbsp;<\/strong>(218) 741‑9633<\/p> <p>A cozy, friendly neighborhood pub in Gilbert serving a full bar, light snacks, and casual games like pool or darts. It&rsquo;s a laid-back evening spot with TVs, local patrons, and a warm vibe&mdash;open daily from noon to 1 AM. A great local experience after hiking, skiing, or biking.<\/p>", "photo": "be5215479693ba855ac5ebe29e55e049.jpg", "loc": [47.488458, -92.46505], "pin": "bars_and_nightlife", "id": "the-alibi-bar-gilbert"}, {"title": "Copper Nickel Pub – Aurora", "html": "<p>🌐https://the-copper-nickel.res-menu.com/<\/p> <p><strong>📞<\/strong>(218) 306‑6149<\/p> <p>A stylish yet comfy bar &amp; pub in Aurora serving classic American food&mdash;from appetizers and burgers to pasta, sandwiches, and salads&mdash;with a solid selection of beers, wine, and cocktails. Accessible and family-friendly, it also hosts events like karaoke, live music, and seasonal specials (e.g. Irish Reubens). Open daily from 11 AM (stays open late on weekends). Perfect for date nights, group dinners, or a cozy evening out.<\/p>", "photo": "2314b23d2c014718a42a8738683002a5.jpg", "loc": [47.528625, -92.237065], "pin": "restaurants", "id": "copper-nickel-pub-aurora"}, {"title": "The Downtown Bar – Gilbert", "html": "<p>🌐<a href=\"https://www.facebook.com/p/The-Downtown-Bar-100063675302458/\">https://www.facebook.com/p/The-Downtown-Bar-100063675302458/<\/a><\/p> <p><strong>📞<\/strong>(218) 741‑2831<\/p> <p>A clean, cozy, and welcoming local pub offering a full bar, classic bar‑snacks, <strong>pool and darts<\/strong>, and TVs for game nights. Check their Facebook for live music events like Sunday and Wednesday sets by “The McCullough Brothers.” Open daily noon to 1 AM, it’s a top choice for a relaxed evening outing with friends or fellow travelers.<\/p>", "photo": "166efdc958cf67a1dd037be88e4c11d6.jpg", "loc": [47.485433, -92.467956], "pin": "bars_and_nightlife", "id": "the-downtown-bar-gilbert"}, {"title": "Luke’s Tavern", "html": "<p>🌐https://www.facebook.com/lukesbiwabik<\/p> <p><strong>📞<\/strong>+1 (218) 306‑6009<\/p> <p>A cozy, family-owned tavern in downtown Biwabik&mdash;perfect for post-hike or ski evenings. Enjoy a full bar, bar snacks, TVs, darts/pool, and rotating live music and jam nights. Open from mid-afternoon into the early hours, with takeout and weekend delivery options available. Great for guests seeking a fun local vibe!<\/p>", "photo": "e9e7d03f8b36e182a1c34e0ff75efde3.jpg", "loc": [47.532699, -92.346832], "pin": "bars_and_nightlife", "id": "lukes-tavern"}, {"title": "Rudy’s Bar & Grill", "html": "<p>🌐<a href=\"https://rudysmn.com/\">https://rudysmn.com/<\/a><\/p> <p><strong>📞 <\/strong>(218) 229‑3983<\/p> <p>A classic Iron Range <strong>bar &amp; grill<\/strong> serving fresh, comforting dishes and a full bar in a cozy, sports-themed atmosphere. Try the famous Shroom Burger, broasted chicken, rotating dinner specials, and enjoy popular Taco Tuesdays and weekend drink specials. Open daily from 11 AM, late-night bar service Fri/Sat till 1 AM. Ideal for after‑day adventures or a casual night out.<\/p>", "photo": "674c3e2b2ed9200268fc28cc741a870a.jpg", "loc": [47.528879, -92.236538], "pin": "bars_and_nightlife", "id": "rudys-bar-grill"}]}, {"title": "Lunch + Snack Recommendations", "items": [{"title": "Biwabik Pizza Co", "html": "<p>🌐<a href=\"https://biwabikpizza.com/\">https://biwabikpizza.com/<\/a><\/p> <p>📞(218) 750‑7040<\/p> <p>Your go‑to spot for local, inventive pizza with a wide range of specialty pies, hearty wings, burgers, and comfort‑food snacks. Casual dine‑in at the Biwabik Pub or enjoy delivery on weekends within a 15‑mile radius—perfect for a relaxed night in after a day of outdoor adventures. Open most days by 11 AM, with later evening hours on Fridays &amp; Saturdays.<\/p>", "photo": "1b2ceafc713e31dc614cd797dcf79956.jpg", "loc": [47.533204, -92.345609], "pin": "take_out", "id": "biwabik-pizza-co"}, {"title": "Burnt Onion Kitchen & Brews", "html": "<p>🌐: <a href=\"https://www.giantsridge.com/burnt-onion/\">https://www.giantsridge.com/burnt-onion/<\/a><\/p> <p>📞(218) 865‑8061<\/p> <p>This lodge-style eatery offers creative American cuisine with local flair. Try the signature Burnt Onion Burger, enjoy fresh walleye, or savor vegetarian/gluten-free choices. After a day of skiing, biking, or hiking, unwind on the deck overlooking the slopes—with a craft beer, cocktail or mocktail in hand. Wheelchair accessible, open daily from 11 AM (closes at 8 PM on weekdays, 9 PM on weekends).<\/p>", "photo": "07a0b8859ccf9312acbf25f28f37f373.jpg", "loc": [47.578054, -92.304204], "pin": "restaurants", "id": "burnt-onion-kitchen-brews"}, {"title": "Dining Specials: Rotating Chophouse Menu", "html": "<p>Available Wednesdays through Sundays from 4 PM to close, the Chophouse Menu offers a rotating selection of expertly crafted favorites. Enjoy succulent steaks, grilled chops, savory sides, and decadent desserts—all designed to deliver a memorable gourmet experience.<\/p> <p>Pair your meal with a curated selection of brews and wines for the perfect evening at Giants Ridge.<\/p> <p>View the menu here: <a href=\"https://www.giantsridge.com/wp-content/uploads/2025/08/ChopHouse-Special-Online-Menu-August-2025.png\">Chophouse Menu (August 2025)<\/a><br/>More info: <a href=\"https://www.giantsridge.com/fb-specials/\">https://www.giantsridge.com/fb-specials/<\/a><\/p>", "photo": "0b092f0fe09ec251e8074d62df8a8edb.jpg", "id": "dining-specials-rotating-chophouse-menu-2"}, {"title": "Local Dining: Neighbor’s BBQ", "html": "<p>The East Range offers dining options for every taste—from cozy cafes to full-service restaurants.<\/p> <p><strong>Neighbor’s BBQ<\/strong> (On-Site)<br/>Located inside the Lodge at Giants Ridge, Neighbor’s BBQ is renowned for Minnesota-style barbecue, offering rich flavors in a warm, family-friendly atmosphere. Enjoy great food and a full-service bar, making it a must-visit spot for barbecue lovers.<\/p> <p>Discover why Neighbor’s BBQ is considered one of the best barbecue experiences in Minnesota.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/local-dining/\">https://www.giantsridge.com/local-dining/<\/a><br/><strong>Neighbor’s BBQ official website: <\/strong><a href=\"https://www.neighborsbbq218.com/?_ga-ft=aJJ2vg.AA.AA.AA.AA.rBHj_1QSTyGqj3plj6iTMw..0.grtbd.\">neighborsbbq218.com<\/a><\/p>", "photo": "004664960e57a37e7b1d0f72b8e77ced.jpg", "id": "local-dining-neighbors-bbq"}, {"title": "Vi’s Pizza & TNT Bar", "html": "<p>🌐 <a href=\"https://www.facebook.com/p/TNT-Bar-and-Vis-Pizza-100063793202936\">https://www.facebook.com/p/TNT-Bar-and-Vis-Pizza-100063793202936<\/a><\/p> <p>📞 (218) 865‑4164<\/p> <p>A beloved local hangout offering huge specialty pizzas, a full bar, and a warm, laid-back atmosphere. Try unique flavors like the Hotsy Potsy or Northern Exposure pizza, or explore burgers, wings, and wraps. Great for a casual group dinner or family night out. Open evenings from ~4 PM; check FB for daily specials and events.<\/p>", "photo": "7862b9fddddf27ba58390c38c4f4da29.jpg", "loc": [47.533176, -92.344959], "pin": "restaurants", "id": "vis-pizza-tnt-bar"}]}]}, "emergency": {"id": "emergency", "title": "Emergency and Urgent Care", "icon": "siren", "groups": [{"title": "", "items": [{"title": "Biwabik Fire Department", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p> <p>Address: 105 3rd Avenue North, Biwabik, MN 55708 <a href=\"https://www.mapquest.com/us/minnesota/biwabik-fire-department-350459364\">MapQuest<\/a><a href=\"https://usfiredept.com/biwabik-fire-department-1960.html\">US Fire Dept<\/a><\/p> <p>Emergency Contact: Dial 911 for any fire, medical, or life-threatening emergencies <a href=\"https://usfiredept.com/biwabik-fire-department-1960.html\">US Fire Dept<\/a><\/p> <p>Non-Emergency Phone: (218) 865-4332<\/p> <p>Fax: (218) 865-4580<\/p> <p>Email: <a>biwabikfire@cityofbiwabik.com<\/a> <a href=\"https://m.facebook.com/100064472273101/about\">Facebook<\/a><\/p> <p>Website: Through the City of Biwabik’s official site under the Fire &amp; Ambulance Department section <a href=\"https://www.cityofbiwabik.com/public-safety\">City of Biwabik<\/a><\/p> <p>Services: Fire suppression, rescue, and EMS. Swift response backed by mutual aid from neighboring communities.<\/p>", "photo": "62dd358af6ed4c89ba0792850b337253.jpg", "id": "biwabik-fire-department"}, {"title": "Biwabik Police Service", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p> <p>Address (Police Substation): 105 3rd Avenue North, Biwabik, MN 55708 <a href=\"https://gilbertmn.org/services/police-department\">City of Gilbert<\/a><\/p> <p>Primary Contact Number: (218) 865-4186<\/p> <p>Service Model: Biwabik receives 24/7 police coverage via a contract with the City of Gilbert Police Department, which operates a local substation in town <a href=\"https://www.cityofbiwabik.com/index.asp?SEC=B9132241-6DF2-4EFA-A030-03C875EF4E43&amp;Type=B_BASIC\">City of Biwabik<\/a><\/p>", "photo": "a2d55f5ad8b2f25b9074e8485e3c4429.jpg", "id": "biwabik-police-service"}, {"title": "Hospitals Near Biwabik", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p> <p><strong>Essentia Health Northern Pines Medical Center<\/strong><\/p> <p>Address: 5211 Highway 110, Aurora, MN (near Biwabik) <a href=\"https://carelistings.com/hospitals/biwabik-mn\">CareListings<\/a><\/p> <p>Type: General hospital offering a broad range of medical services<\/p> <p>Details: While specific contact information wasn't listed in the summary, this facility serves as the main nearby hospital for residents and visitors in the Biwabik area.<\/p> <p><strong>Essentia Health Virginia<\/strong><\/p> <p>Address: 901 9th Street North, Virginia, MN <a href=\"https://carelistings.com/hospitals/biwabik-mn\">CareListings<\/a><\/p> <p>Type: Another general hospital serving the region<\/p> <p>Details: Also listed as a hospital near Biwabik, likely offering emergency and inpatient services.<\/p>", "photo": "28d91d347754e47d1881b7507792dd1f.jpg", "id": "hospitals-near-biwabik"}]}]}, "golf": {"id": "golf", "title": "Golf", "icon": "flag", "groups": [{"title": "", "items": [{"title": "The Legend", "html": "<p>🌐<a href=\"https://www.giantsridge.com/the-legend/\">https://www.giantsridge.com/the-legend/<\/a><\/p> <p>📞Local: (218) 865‑8030 or Resort: (800) 688‑7669<\/p> <p>A premium 18-hole, par‑72 public course set in the heart of mature red-pine forest. Designed by Jeff Brauer and Lanny Wadkins, it challenges golfers of all levels with dynamic terrain, pristine bent-grass greens, and stunning natural beauty. <\/p> <p>Rated as one of Minnesota’s best public courses, it offers full-service amenities—driving range, pro shop, club rental, lessons, and clubhouse dining. Book your tee time online via Giants Ridge or GolfNow, and browse hole maps and scorecards via the official site to prepare. Perfect for a memorable “nine-and-dine” or full round experience during your stay.<\/p> <p><a href=\"https://www.golfnow.com/courses/1050466-giants-ridge-golf-ski-resort-legend-course-details\">The Legend Tee Times<\/a><br/><a href=\"https://mnpga.bluegolf.com/bluegolf/mnpga/course/giantsridgelegend/overview.htm\">The Legend Scorecards<\/a><br/><a href=\"https://www.provisualizer.com/courses/giantsridgelegend.php\">The Legend Course Map<\/a><br/><a href=\"https://course.bluegolf.com/bluegolf/course/course/giantsridgelegend/printpick.htm\">The Legend Course Printable Scorecards &amp; Hole Layouts<\/a><\/p> <p>On-Site Amenities<\/p> <ul> <li>Driving range, putting/chipping greens, and practice bunker <a href=\"https://18birdies.com/golf-courses/club/97026150-86ac-11e4-8c28-020000005b00/giants-ridge-golf-courses\">https://golf-courses/club<\/a><\/li> <li>Full pro shop, club rentals, fittings, and lessons <a href=\"https://18birdies.com/golf-courses/club/97026150-86ac-11e4-8c28-020000005b00/giants-ridge-golf-courses\">https://golf-courses/club/<\/a><\/li> <li>Clubhouse dining, lounge area, locker rooms, carts and pull carts<br/><\/li> <\/ul>", "photo": "d2b34f2813c663d43e4ba2e9fee3d7a9.jpg", "id": "the-legend"}, {"title": "The Quarry", "html": "<p>🌐<a href=\"https://www.giantsridge.com/the-quarry/\">https://www.giantsridge.com/the-quarry/<\/a> <\/p> <p>📞 Local: (218) 865‑8000 • Resort toll-free: (800) 688‑7669<\/p> <p>A premier 18-hole, par‑72 public course carved from historic mine terrain, offering rugged beauty and strategic play. Designed by Jeff Brauer, it's challenging (7,201 yards, slope up to 146) with elevation, rock formations, and standout holes like the drivable 13th. Ranked Minnesota’s #1 public course and a national top‑20, it's a must for enthusiastic golfers.<\/p> <p><a href=\"https://www.giantsridge.com/the-quarry/\">The Quarry Tee Times<\/a><br/><a href=\"https://course.bluegolf.com/bluegolf/course/course/giantsridgequarry/detailedscorecard.htm\">The Quarry Scorecards<\/a><br/><a href=\"https://www.provisualizer.com/courses/giantsridgequarry.php\">The Quarry Course Map<\/a><\/p> <p>Amenities:<br/>Carts (incl. GPS on some), pull carts, club rentals, practice range, chipping and putting greens <a href=\"https://www.golfpass.com/travel-advisor/courses/28836-giants-ridge-golf-ski-resort-quarry-course\">golfpass.com<\/a><br/>Pro shop offering apparel, gear, lessons, and club fittings<br/>Lounge and dining at Bunker’s Grill—great for a post-round meal<\/p>", "photo": "ffe8e7144ad43944356d369a004d9b39.jpg", "id": "the-quarry"}]}]}, "grocery": {"id": "grocery", "title": "Grocery and Pharmacy", "icon": "shopping-cart", "groups": [{"title": "", "items": [{"title": "CVS Pharmacy — Virginia, MN", "html": "<p>Website: <a href=\"https://www.yelp.com/biz/cvs-pharmacy-virginia?osq=Pharmacy\">https://www.yelp.com/biz/cvs-pharmacy-virginia?osq=Pharmacy<\/a><br/>Phone: (218) 741-6603<br/>Address: 1001 13th St S, Virginia, MN 55792<\/p> <p>Distance: Approximately 15 minutes south of Biwabik<\/p>", "photo": "63822b350d6a29d9a6c6308a41c433e7.jpg", "loc": [44.97605, -85.210271], "pin": "pharmacy", "id": "cvs-pharmacy-virginia-mn"}, {"title": "Super One Foods — Biwabik", "html": "<p>Website: <a href=\"https://www.superonefoods.com/store-details/biwabik-super-one-foods\">https://www.superonefoods.com/store-details/biwabik-super-one-foods<\/a> <br/>Phone: (218) 865-6702<br/>Address: 317 Main Street N, Biwabik, MN 55708<\/p> <p>Super One Foods is the go-to local grocery store in town. Guests can find everything from fresh bakery items, deli selections, produce, meat, and ready-made trays to gift cards, floral arrangements, and propane exchange—making it a superb one-stop shop for all needs. The store also provides Wi-Fi, handicap accessibility, and modern payment options like Apple Pay and EBT. <\/p>", "photo": "d6f9981220caa925ad716042078f3e35.jpg", "loc": [44.971076, -85.197754], "pin": "grocery_shopping", "id": "super-one-foods-biwabik"}]}]}, "shopping": {"id": "shopping", "title": "Shopping", "icon": "shopping-bag", "groups": [{"title": "", "items": [{"title": "Giants Ridge Mountain Sports / Pro Shop & Gift Shop", "html": "<p>Website: <a href=\"https://www.giantsridge.com/onsite-shopping/\">https://www.giantsridge.com/onsite-shopping/<\/a> <br/>Phone: (218) 865-8000 (front desk/general resort)<\/p> <p>A one-stop spot for those planning outdoor fun—skiing, biking, or hiking—or looking for attire that embodies the resort’s adventurous spirit. Located at the nearby Giants Ridge Resort, this shop offers outdoor gear, ski apparel, and equipment for all ages, plus souvenirs and resort essentials.<\/p>", "photo": "bc28b811aed7f0d067f390c5acdf6e2b.jpg", "loc": [47.57652, -92.303169], "pin": "retail_therapy", "id": "giants-ridge-mountain-sports-pro-shop-gift-shop"}, {"title": "Pine Grove Gallery", "html": "<p>Web: <a href=\"https://www.pinegrovegallery.com/Phone\">https://www.pinegrovegallery.com/<br/><\/a>Phone: 218-865-6125<\/p> <p>A charming artisan gallery offering Northwoods décor, stained glass creations, jewelry, and gifts—many items handcrafted in-house. They also offer creative stained glass classes suitable for a relaxing afternoon activity. A great place to discover local artistry, pick up a meaningful souvenir, or enjoy a fun, creative workshop.<\/p>", "photo": "91348d7380d3c9252af4f1fe4efb525e.jpg", "loc": [47.533075, -92.34016], "pin": "retail_therapy", "id": "pine-grove-gallery"}]}]}, "weather": {"id": "weather", "title": "Weather", "icon": "cloud-sun-rain", "groups": [{"title": "", "items": [{"title": "Biwabik", "html": "<p>For the most up-to-date weather forecast check <a href=\"https://weather.com/weather/today/l/8ce536ee4729bd157465dd5a7ee281640970a654891551ca18c7aa7c9b671ec9\">here<\/a>!<\/p> <p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say \"There is no such thing as bad weather, just inappropriate clothing\".<\/p>", "photo": "e0f4f48658886913f7c2ce99deedbad1.jpg", "id": "biwabik"}]}]}, "giants-ridge": {"id": "giants-ridge", "title": "Giants Ridge Recreation Area", "icon": "mountain-snow", "groups": [{"title": "Dining", "items": [{"title": "Burnt Onion Kitchen & Brews", "html": "<p>Open Wednesdays through Sundays, Burnt Onion Kitchen &amp; Brews at the Main Chalet offers a unique dining experience with creative twists on classic American dishes. Enjoy seasonal lunch and dinner menus featuring handhelds, steaks, vegetarian, and gluten-free options.<\/p> <p>Don’t miss the chef-curated, rotating Chophouse Menu and a full mocktail selection. The restaurant is wheelchair accessible via first-floor elevator, making it welcoming for all guests.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/burnt-onion/\">https://www.giantsridge.com/burnt-onion/<\/a><\/p>", "photo": "2e1cdea14f201f6e310d9fee2094709a.jpg", "id": "burnt-onion-kitchen-brews"}, {"title": "Dining Specials: Rotating Chophouse Menu", "html": "<p>Available Wednesdays through Sundays from 4 PM to close, the Chophouse Menu offers a rotating selection of expertly crafted favorites. Enjoy succulent steaks, grilled chops, savory sides, and decadent desserts—all designed to deliver a memorable gourmet experience.<\/p> <p>Pair your meal with a curated selection of brews and wines for the perfect evening at Giants Ridge.<\/p> <p>View the menu here: <a href=\"https://www.giantsridge.com/wp-content/uploads/2025/08/ChopHouse-Special-Online-Menu-August-2025.png\">Chophouse Menu (August 2025)<\/a><br/>More info: <a href=\"https://www.giantsridge.com/fb-specials/\">https://www.giantsridge.com/fb-specials/<\/a><\/p>", "photo": "0b092f0fe09ec251e8074d62df8a8edb.jpg", "id": "dining-specials-rotating-chophouse-menu"}, {"title": "Local Dining: Neighbor’s BBQ", "html": "<p>The East Range offers dining options for every taste—from cozy cafes to full-service restaurants.<\/p> <p><strong>Neighbor’s BBQ<\/strong> (On-Site)<br/>Located inside the Lodge at Giants Ridge, Neighbor’s BBQ is renowned for Minnesota-style barbecue, offering rich flavors in a warm, family-friendly atmosphere. Enjoy great food and a full-service bar, making it a must-visit spot for barbecue lovers.<\/p> <p>Discover why Neighbor’s BBQ is considered one of the best barbecue experiences in Minnesota.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/local-dining/\">https://www.giantsridge.com/local-dining/<\/a><br/><strong>Neighbor’s BBQ official website: <\/strong><a href=\"https://www.neighborsbbq218.com/?_ga-ft=aJJ2vg.AA.AA.AA.AA.rBHj_1QSTyGqj3plj6iTMw..0.grtbd.\">neighborsbbq218.com<\/a><\/p>", "photo": "004664960e57a37e7b1d0f72b8e77ced.jpg", "id": "local-dining-neighbors-bbq"}, {"title": "The Wacootah Grille", "html": "<p>Open daily from 7 AM until sunset, The Wacootah Grille is the perfect spot for breakfast, lunch, or dinner with a view. Located at The Quarry golf course clubhouse, it overlooks the 18th green and the beautiful Lake Mine, famous for trout fishing.<\/p> <p>Enjoy a full menu of clubhouse favorites and a full-service bar, with indoor and outdoor seating offering stunning panoramic views of cliffs and crystal-clear lake waters.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/wacootah-grille/\">https://www.giantsridge.com/wacootah-grille/<\/a><\/p>", "photo": "a8f684c6ca992b2b19dafb47579a2b28.jpg", "id": "the-wacootah-grille"}]}, {"title": "Golf", "items": [{"title": "Golf Groups", "html": "<p><strong>Tournaments, Corporate Outings &amp; Group Play<\/strong><\/p> <p>Planning a golf event? From casual group outings to full-scale tournaments, <em>Giants Ridge<\/em> offers the perfect setting with The Legend and The Quarry—two of the most celebrated courses in the country.<\/p> <p>Why host your group here?<\/p> <ul> <li> <p>Accommodates groups from 8 to 400<\/p> <\/li> <li> <p>Custom tournament packages available<\/p> <\/li> <li> <p>Indoor/outdoor meeting &amp; celebration spaces<\/p> <\/li> <li> <p>Group meals, lodging &amp; entertainment options<\/p> <\/li> <li> <p>Personalized merchandise (shirts, logo balls &amp; more)<\/p> <\/li> <\/ul> <p>Whether it’s for fun, fundraising, or team-building, Giants Ridge makes your golf event effortless and unforgettable.<\/p> <p><em>Ready to plan your outing?<\/em><br/>Learn More or Inquire → <a href=\"https://www.giantsridge.com/golf-groups/\">https://www.giantsridge.com/golf-groups/<\/a> <\/p>", "photo": "5c886d98e584e601c09e03419d6afb5e.jpg", "id": "golf-groups"}, {"title": "Golf Lessons", "html": "<p><strong>Sharpen your game at Giants Ridge!<\/strong><br/>Whether you’re a beginner or seasoned player, Giants Ridge offers private lessons and fun group clinics throughout the golf season.<\/p> <p><strong>Private Lessons<\/strong><\/p> <p>One-on-one instruction tailored to your goals.<br/><em>Pre-registration required — call the Golf Shop at (218) 865-8030<\/em><\/p> <p>More Info &amp; Registration → <a href=\"https://www.giantsridge.com/golf-lessons/\">https://www.giantsridge.com/golf-lessons/<\/a> <\/p>", "photo": "face5d0444807a45f3ed9e8728f098c3.jpg", "id": "golf-lessons"}, {"title": "The Legend Golf Course", "html": "<p><strong>Scenic. Challenging. Legendary.<\/strong><br/>Opened in 1997, <em>The Legend<\/em> has become one of Minnesota’s most celebrated public golf courses. Recognized by Golf Digest as one of the \"Top 10 Best New Upscale Public Courses in the Nation,\" this award-winning course offers a serene, unforgettable experience with unmatched value.<\/p> <p>Nestled in the scenic Iron Range, <em>The Legend<\/em> helped establish Northern Minnesota as a global golf destination.<\/p> <p><strong>2025 Green Fees<\/strong><\/p> <p><strong>May 2 – May 29<\/strong> | Weekday: $96 | Weekend: $96 | Twilight: –<br/><strong>May 30 – Aug 24<\/strong> | Weekday: $130 | Weekend: $130 | Twilight: $96 (after 3PM)<br/><strong>Aug 25 – Sept 28<\/strong> | Weekday: $130 | Weekend: $130 | Twilight: $96 (after 2PM)<br/><strong>Sept 29 – Closing (TBD)<\/strong> | Weekday: $96 | Weekend: $96 | Twilight:<\/p> <p><strong>Junior Rate (17 &amp; under):<\/strong> $45 (All season)<br/><strong>36 Holes with Lunch:<\/strong><\/p> <ul> <li> <p>Weekday: $205<\/p> <\/li> <li> <p>Weekend: $220<\/p> <\/li> <\/ul> <p>Special Deal: <em>36-Hole Experience<\/em><\/p> <p>Play both <strong>The Legend<\/strong> and <strong>The Quarry<\/strong> on the same day with lunch included — the ultimate Giants Ridge golf experience!<br/>Available: May 31 – Aug 25<br/><em>Call ahead to book both tee times.<\/em><\/p> <p>Learn more or book your tee time → <a href=\"https://www.giantsridge.com/the-legend/\">https://www.giantsridge.com/the-legend/<\/a> <\/p>", "photo": "01d9098b5bbd5a2ede4f86a1926e4289.jpg", "id": "the-legend-golf-course"}, {"title": "The Quarry Golf Course", "html": "<p><strong>#1 Public Golf Course in Minnesota<\/strong><\/p> <p>Built on the site of a former sand, gravel, and iron ore mine, <em>The Quarry<\/em> offers a rugged, dramatic, and unforgettable golfing experience. Ranked #1 in Minnesota by <em>Golf Digest<\/em>, this course has been listed among the Top 20 public courses in the U.S. every year it's been eligible. A perfect complement to the more traditional <em>Legend<\/em> course.<\/p> <p><strong>2025 Green Fees<\/strong><\/p> <p><strong>May 2 – May 29<\/strong> | Weekday: $96 | Weekend: $96 | Twilight: –<br/><strong>May 30 – Aug 24<\/strong> | Weekday: $130 | Weekend: $130 | Twilight: $96 (after 3PM)<br/><strong>Aug 25 – Sept 28<\/strong> | Weekday: $130 | Weekend: $130 | Twilight: $96 (after 2PM)<br/><strong>Sept 29 – Closing (TBD)<\/strong> | Weekday: $96 | Weekend: $96 | Twilight: –<\/p> <p><strong>Junior (17 &amp; under):<\/strong> $45 all season (must be with an adult)<br/><strong>36 Holes + Lunch:<\/strong> Weekday: $205 | Weekend: $220<br/><em>Replay rates available for same course/same day<\/em><br/><em>All rates include cart &amp; range balls | Taxes/fees not included<\/em><\/p> <hr/> <p>Special Offer: 36-Hole Experience<\/p> <p>Play both <em>The Quarry<\/em> and <em>The Legend<\/em> in one day, with lunch included — two unique courses, one epic day of golf.<br/><em>Advance tee times required<\/em><\/p> <p>Learn more or book now → <a href=\"https://www.giantsridge.com/the-quarry/\">https://www.giantsridge.com/the-quarry/<\/a> <\/p>", "photo": "71cbcc951940dda82955b156d980d5c7.jpg", "id": "the-quarry-golf-course"}, {"title": "Virtual Tours", "html": "<p>Watch these amazing aerial flyover videos of the Legend and the Quarry golf courses. Witness for yourself the beauty and splendor.<\/p> <p><iframe src=\"https://www.youtube.com/embed/8FIZ6L4VL6U?wmode=opaque&amp;rel=0\"><\/iframe><\/p> <p><iframe src=\"https://www.youtube.com/embed/pqtb-WZHeMI?wmode=opaque&amp;rel=0\"><\/iframe><\/p> <p><iframe src=\"https://www.youtube.com/embed/JPwtcDfIxlw?wmode=opaque&amp;rel=0\"><\/iframe><\/p> <p>Visit their official website: <a href=\"https://www.giantsridge.com/virtual-tours/\">https://www.giantsridge.com/virtual-tours/<\/a> <\/p>", "photo": "715f16940724154984ab85a2aa299ab0.jpg", "id": "virtual-tours"}]}, {"title": "Plan Your Visit", "items": [{"title": "Brand New Pool & Sauna Haus", "html": "<p>Check out the <strong>Brand New Pool &amp; Sauna Haus at Giants Ridge!<\/strong><\/p> <p><strong>Open to the public and just 5 minutes from our home,<\/strong> it offers a heated indoor pool, hot tub, and sauna for year-round relaxation.<\/p> <p>Conveniently located just across from the main entrance, the Pool &amp; Sauna Haus offers stunning views, a cozy lobby fireplace, and a warm, inviting atmosphere—an ideal spot to relax after a day of adventure.<\/p> <p><strong>Wellness &amp; Relaxation at Giants Ridge<\/strong><br/>✨ Rejuvenate in the saunas<br/>✨ Soak in the hot tub<br/>✨ Swim, play, and unwind all year long<\/p> <p><strong>🏊 Pool &amp; Facility Hours<\/strong><\/p> <ul> <li><strong>Spring, Summer, Fall:<\/strong> Thursday–Monday | 6:00 AM – 8:00 PM<\/li> <li><strong>Winter:<\/strong> Sunday–Thursday | 6:00 AM – 8:00 PM • Friday &amp; Saturday | 6:00 AM – 10:00 PM<\/li> <\/ul> <p><strong><strong>🏊 <\/strong>Rates | <\/strong><strong>All-Day Passes<\/strong><\/p> <ul> <li>Adult (13+)<\/li> <li>Child (12 &amp; under)<\/li> <\/ul> <p><strong>🏊‍♀️ Lap Swim (6:00 AM – 8:00 AM daily)<\/strong><\/p> <ul> <li>Day Pass<\/li> <li>Monthly Pass<\/li> <\/ul> <p><strong>🎉 Party Room Rental<\/strong><\/p> <ul> <li>3 Hours | Includes private room rental + facility access for 10 swimmers<\/li> <li>Must be booked at least 24 hours in advance<\/li> <li>Catering available with 60 hours’ notice<\/li> <\/ul> <p><strong>More Info → <a href=\"https://www.giantsridge.com/pool-haus/\">https://www.giantsridge.com/pool-haus/<\/a> <\/strong><\/p>", "photo": "17f00c2c2b4276780280f37610fe2742.jpg", "id": "brand-new-pool-sauna-haus"}, {"title": "Events Calendar", "html": "<p><strong>Adventure. Music. Family Fun. It All Happens Here.<\/strong><br/>From adrenaline-pumping races to family festivals, classic car shows, and seasonal celebrations, <strong>Giants Ridge<\/strong> is your year-round destination for unforgettable events. Whether you're into biking, beer, or just good times in the great outdoors — there’s always something exciting on the calendar.<\/p> <p><strong>View Full Events List → <a href=\"https://www.giantsridge.com/events/list/\">https://www.giantsridge.com/events/list/<\/a> <\/strong><\/p>", "photo": "63b96545dbee3833f3765ebd11fae0c2.jpg", "id": "events-calendar"}, {"title": "Private & Corporate Events", "html": "<p><strong>Host Your Event in the Northwoods<\/strong><br/>Whether you're planning a company retreat, conference, family gathering, or celebration, Giants Ridge offers the perfect mix of comfort and adventure.<\/p> <ul> <li> <p>Flexible indoor &amp; outdoor event spaces for small or large groups<\/p> <\/li> <li> <p>Full-service catering available<\/p> <\/li> <li> <p>Ideal setting for corporate retreats, private parties, or reunions<\/p> <\/li> <li> <p>Access to year-round recreation including golf, skiing, biking, and more<\/p> <\/li> <\/ul> <p><strong>The Chalet at Giants Ridge<\/strong><br/>A peaceful getaway with everything you need to relax or collaborate in the heart of Northern Minnesota.<\/p> <p>📍 <em>Make your next event unforgettable.<\/em><\/p> <p><br/>Learn more → <a href=\"https://www.giantsridge.com/private-events/\">https://www.giantsridge.com/private-events/<\/a> <\/p>", "photo": "dc3a165f168fedd1ee3788a556e399bf.jpg", "id": "private-corporate-events"}, {"title": "Shopping", "html": "<p><strong>Gear Up or Grab a Gift<\/strong><br/>Whether you're hitting the slopes, the trails, or the greens — or just want a great souvenir — Giants Ridge has you covered.<\/p> <strong>Mountain Sports Shop<\/strong> <p>Located in the Chalet, this shop features top outdoor brands like Burton, Fox, Helly Hansen, and more.<\/p> <ul> <li> <p>Outdoor apparel &amp; equipment for all ages<\/p> <\/li> <li> <p>Helmets, goggles, gloves, socks, sunglasses, and accessories<\/p> <\/li> <li> <p>Snacks, hydration, wax, and Northern Minnesota souvenirs<\/p> <\/li> <\/ul> <strong>Golf Pro Shops<\/strong> <p>Each course has its own shop stocked with top golf brands:<\/p> <ul> <li> <p>Nike, Adidas, Under Armour, FootJoy, Travis Mathew, and more<\/p> <\/li> <li> <p>Golf apparel, accessories, GR-branded items, and equipment<\/p> <\/li> <li> <p>Cleveland club rentals available and refreshed each season<\/p> <\/li> <li> <p>Special orders welcome<\/p> <\/li> <\/ul> <p><em>Explore both shops during your visit!<\/em><\/p> <p><br/>Shop More → <a href=\"https://www.giantsridge.com/onsite-shopping/\">https://www.giantsridge.com/onsite-shopping/<\/a> <\/p>", "photo": "587687acadd5c6dd632ca170bc592625.jpg", "id": "shopping"}, {"title": "Weddings & Banquets", "html": "<p><strong>Plan Your Dream Wedding or Special Event at Giants Ridge<\/strong><br/>Celebrate your special day surrounded by the natural beauty of Northern Minnesota. Giants Ridge offers stunning indoor and outdoor venues, expert coordination, and full-service banquet options to ensure your event is seamless and unforgettable.<\/p> <strong>Ceremony Locations:<\/strong> <ul> <li> <p><strong>Quarry Overlook<\/strong> <em>(Lakeside | Classic | Modern)<\/em><br/>Overlooks Embarrass Mine Pit | Seats up to 300 guests<\/p> <\/li> <li> <p><strong>Alpine Base Courtyard<\/strong> <em>(Scenic | Ideal | Effortless)<\/em><br/>Central courtyard location | Access to Gold Room &amp; cocktail bar | Seats up to 300<\/p> <\/li> <li> <p><strong>Placid Hillside<\/strong> <em>(Scenic | Charming | Cozy)<\/em><br/>Overlooks Superior National Forest | Ideal for small ceremonies | Seats up to 50<\/p> <\/li> <li> <p><strong>Brascugli Point<\/strong> <em>(Intimate | Rustic | Natural)<\/em><br/>Surrounded by nature | Seats up to 100 guests<\/p> <\/li> <li> <p><strong>The Chalet<\/strong> <em>(Rustic | Indoor | Beautiful)<\/em><br/>All-in-one indoor ceremony and reception | Seats up to 300<\/p> <\/li> <\/ul> <strong>Why Choose Giants Ridge?<\/strong> <ul> <li> <p>Versatile venue options for any celebration style<\/p> <\/li> <li> <p>Professional event coordination from start to finish<\/p> <\/li> <li> <p>Exceptional catering &amp; banquet services<\/p> <\/li> <li> <p>Unmatched recreational activities for your guests: golf, skiing, hiking, biking, and more<\/p> <\/li> <li> <p>Breathtaking photo backdrops in the Superior National Forest<\/p> <\/li> <\/ul> <p>📍 <em>Make memories that last a lifetime.<\/em><\/p> <p><br/>Start planning today → <a href=\"https://www.giantsridge.com/weddings/\">https://www.giantsridge.com/weddings/<\/a> <\/p>", "photo": "b856a3e44b27bd4614def3b8daa278bb.jpg", "id": "weddings-banquets"}]}, {"title": "Summer & Sun", "items": [{"title": "Children's Play Area", "html": "<p><strong>Location:<\/strong> Tucked between the Main Chalet and The Lodge at Giants Ridge, this play area is conveniently located near the heart of the resort. <a href=\"https://www.giantsridge.com/explore/#\">https://www.giantsridge.com/explore/#<\/a><\/p> <p><strong>Description:<\/strong><br/>A delightful space where children can burn off energy and enjoy fresh air amidst the Northwoods. Features include:<\/p> <ul> <li> <p>Multiple <strong>slides<\/strong> with varying lengths and heights<\/p> <\/li> <li> <p>Fun <strong>climbing obstacles<\/strong> built for kids<\/p> <\/li> <li> <p>Signage and displays with <strong>regional outdoor adventure info<\/strong><\/p> <\/li> <\/ul> <p>Ideal for families—while the kids play, you can plan your next mountain biking trail, golf hole, or lakeside adventure.<\/p> Quick Tips for Families <ul> <li> <p><strong>Supervised Area:<\/strong> The play space is not monitored. Please keep an eye on children at all times.<\/p> <\/li> <li> <p><strong>Built for Play:<\/strong> Safe, nature-inspired equipment designed to entertain young ones.<\/p> <\/li> <li> <p><strong>Multi-Season Access:<\/strong> A great spot to stop by during year‑round resort activities.<\/p> <\/li> <\/ul> Where to Find It <p>Located between the two main lodges, it's easily accessible from key resort areas like the <strong>Mountain Sports Shop<\/strong>, <strong>restaurants<\/strong>, and <strong>trailheads<\/strong>.<\/p> <p>Invite your little adventurers to explore and disappear into the fun—then come back when they’ve worn themselves out! Would you like this added as a quick info tile in your guidebook layout?<\/p>", "photo": "1c7b62066f11a8f4f6f0a8ec6edb4f93.jpg", "id": "childrens-play-area"}, {"title": "Climbing Wall", "html": "<p>Experience climbing on the A.R.T.Wall™, a unique 32-foot tall, four-sided concrete wall modeled from real rock for an incredibly realistic climb. Its solid, cool-to-the-touch surface offers an authentic and safe climbing experience.<\/p> <p>Climbers must be at least 5 years old, 40 lbs, and 42 inches tall. Minors (under 18) require a signed waiver from a parent or guardian. Children under 14 must be supervised by an adult.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/climbing-wall/\">https://www.giantsridge.com/climbing-wall/<\/a><\/p>", "photo": "13e9fa2042bc3a978f75ac1b4b584804.jpg", "id": "climbing-wall"}, {"title": "Disc Golf", "html": "<p>Play one of Minnesota’s most scenic and longest disc golf courses, spanning 80+ acres and up to 10,000 feet in fairway distance. The 18-hole mountain course features dual concrete tees, multiple pin placements, and challenging terrain with grassy hills, woods, and rocks.<\/p> <p>Average playtime: 2.5 hours.<br/>Wear sturdy footwear suitable for hiking-style terrain.<\/p> <p>More info: <a href=\"https://www.giantsridge.com/disc-golf/\">https://www.giantsridge.com/disc-golf/<\/a><\/p>", "photo": "1c8d61eb7ef4d5e12cd480f2f49e7c9b.jpg", "id": "disc-golf"}, {"title": "Giants Ridge Ridge Mountain Bike Trail Map", "html": "<p><strong>Discover Northern Minnesota’s Premier Mountain Biking Destination<\/strong><\/p> <p>Welcome to <strong>Giants Ridge Bike Park<\/strong>, where rugged terrain, scenic views, and thrilling trails converge to offer one of the most diverse biking experiences in the Midwest. Whether you're a beginner, a gravity-fueled adventurer, or a cross-country explorer, there's a trail waiting for you here. Follow our “Pre-Ride, Re-Ride, Free-Ride” safety model to get the most out of your day.<\/p> <p>Full Trail Map → <a href=\"https://www.giantsridge.com/wp-content/uploads/2024/10/2022-Mountain-Bike-Map-FINAL.pdf\">https://www.giantsridge.com/wp-content/uploads/2024/10/2022-Mountain-Bike-Map-FINAL.pdf<\/a> <\/p> <p><\/p><p><img src=\"../img/ac08d03f0d37ab546f2a8e4e303f859d.jpg\" alt=\"\"><\/p> <h2>TRAIL CATEGORIES<\/h2> Gravity Freeride (Orange) <p>For riders seeking jumps, flow lines, and heart-pumping descents. Accessed via the lift.<\/p> <ul> <li> <p><strong>Ribbit One, Two, Three<\/strong> – 0.28 mi each | Intro trails with berms and smooth rolls.<\/p> <\/li> <li> <p><strong>Tadpole<\/strong> – 0.28 mi | Short but fun and fast.<\/p> <\/li> <li> <p><strong>Leapfrog<\/strong> – 0.66 mi | Great transitions and moderate features.<\/p> <\/li> <li> <p><strong>Featherlys<\/strong> – 0.74 mi | Smooth and flowy, ideal for intermediate riders.<\/p> <\/li> <li> <p><strong>Return to Sender<\/strong> – 0.6 mi | Connects to multiple routes.<\/p> <\/li> <li> <p><strong>Sector 12<\/strong> – 0.6 mi | Big features and progressive lines.<\/p> <\/li> <li> <p><strong>Goliath<\/strong> – 0.74 mi | Advanced freeride challenge.<\/p> <\/li> <\/ul> Gravity Technical (Green, Black, Red) <p>Steep, rocky, and rooty—perfect for technical riders.<\/p> <ul> <li> <p><strong>Kitty Cat<\/strong> – 1.0 mi (Green Circle) | Mellow intro to gravity trails.<\/p> <\/li> <li> <p><strong>Techonite<\/strong> – 0.45 mi (Black Diamond) | Rock features &amp; tighter turns.<\/p> <\/li> <li> <p><strong>Granite Gorge<\/strong> – 0.41 mi (Double Black Diamond) | Big drops and serious challenge.<\/p> <\/li> <\/ul> <h2>CROSS-COUNTRY TRAILS<\/h2> Enchanted Flowest Area (Green to Black) <p>Gentle gradients to challenging forest routes.<\/p> <ul> <li> <p><strong>Enchanted Flowest Access<\/strong> – 0.65 mi | Entry to the XC trail network.<\/p> <\/li> <li> <p><strong>Turtle Trot<\/strong> – 0.81 mi | Ideal for beginners.<\/p> <\/li> <li> <p><strong>Moonshiner<\/strong> – 1.6 mi | Flow with a few technical surprises.<\/p> <\/li> <li> <p><strong>Ridge Runner<\/strong> – 1.6 mi | Winding through pines with scenic views.<\/p> <\/li> <li> <p><strong>Fine Whine<\/strong> – 1.0 mi | Technical XC trail.<\/p> <\/li> <li> <p><strong>Ore Not<\/strong> – 0.64 mi | Black diamond level effort required.<\/p> <\/li> <\/ul> South Trails (Blue to Black) <ul> <li> <p><strong>Bootcamp<\/strong> – 0.51 mi | Perfect warm-up.<\/p> <\/li> <li> <p><strong>Norway<\/strong> – 1.4 mi | Gentle curves, fun pace.<\/p> <\/li> <li> <p><strong>Miners Mile<\/strong> – 1.0 mi | Fast-paced, intermediate XC ride.<\/p> <\/li> <li> <p><strong>Boulder Project<\/strong> – 0.14 mi | Short, techy section to test your skills.<\/p> <\/li> <\/ul> <h2>LITTLE GIANTS SKILLS PARK<\/h2> <p>Practice your skills before hitting the mountain! The Skills Park is perfect for beginners and families, with progressive features designed to build rider confidence and technique.<\/p> <p>Whether you're visiting for the first time or a seasoned Giants Ridge rider, this park offers the perfect blend of adrenaline, natural beauty, and trail variety. Pick your line, drop in, and enjoy the ride!<\/p>", "photo": "301f62ceb382afaa368952b3175e9ed3.jpg", "id": "giants-ridge-ridge-mountain-bike-trail-map"}, {"title": "Hiking Trails", "html": "<p>Explore a variety of trails for all skill levels:<\/p> <ul> <li> <p><strong>Ridgeview Overlook Trail<\/strong>: Easy, 0.3-mile loop<\/p> <\/li> <li> <p><strong>Wynne Lake Vista Trail<\/strong>: Moderate, 0.8-mile loop<\/p> <\/li> <li> <p><strong>Northface Trail<\/strong>: Difficult, 1.1 miles one way<\/p> <\/li> <li> <p><strong>Birches Trail<\/strong>: Moderate, 2.
