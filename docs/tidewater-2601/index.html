<script type="application/json" id="guide-data">{"slug": "tidewater-2601", "name": "Tidewater 2601", "shortName": "Tidewater 2601", "welcome": "Welcome!", "hostedBy": "Hosted By Brandon & Katharina", "address": "16819 Front Beach Road, Unit 2601, Panama City Beach, FL 32413", "location": [30.220128, -85.886713], "cover": "tidewater-2601-view.jpg", "coverDesktop": "tidewater-2601-view.jpg", "background": "tidewater-2601-view.jpg", "contact": {"phone": "404-358-1552", "sms": "404-358-1552", "email": ""}, "gate": true, "oldLinks": ["/guest/bUWuQjDRWBDP4/"], "layout": [{"heading": "Your Stay", "sections": ["add-to-phone", "welcome", "check-in-arrival", "check-out-departure", "rules", "cancellation-policy", "about-us", "contact-us"]}, {"heading": "The Home", "sections": ["beach-service", "accessibility", "kitchen", "laundry", "pool", "thermostat", "tv-streaming", "wifi"]}, {"heading": "Explore the Area", "sections": ["beer-wine", "dining", "emergency", "fishing", "golf", "grocery", "nature-parks", "pier-park", "shopping", "spas-salons", "random-recommendations", "weather"]}], "sections": {"add-to-phone": {"id": "add-to-phone", "title": "Add This Guide To Your Phone", "icon": "smartphone", "groups": [{"title": "", "items": [{"title": "Add This Guide To Your Phone", "html": "<span><span><\/span><span><span><span><\/span><span><span><span><\/span><span><span><span><\/span><span><span><span><\/span><span><p>When you first access this guidebook on your phone, you'll notice a prompt to add it to your home screen. <strong>This is highly recommended<\/strong> because it makes the guide faster and easier to access. And it remains accessible offline. <\/p>\n<p>Following the prompt will add an app icon to your phone. It's just like any other app, but without you needing to download anything or sign in! <\/p>\n<p>Doing this means that every time you want to access the guide, you just need to tap the app instead of searching for the link in your inbox - much easier! <\/p>\n<h2><strong>Adding the app if you’re an Apple user<\/strong><\/h2>\n<p>If you have an Apple device, the \"Add to Home Screen\" option won’t appear for you unless you’re using Safari browser. Don’t worry, this is really simple to solve - just copy the guidebook link and paste it into Safari. From there, you can follow the prompts to add the guidebook to your home screen.<\/p>\n<h2><strong>Always get the latest version of the guidebook <\/strong><\/h2>\n<p>Our guidebook is regularly updated with information designed to help you get the most out of your stay. To avoid missing out on any of these updates, the app automatically updates every 24 hours. If you want to get the updates sooner, just refresh the screen every time you open the guidebook from your home screen - this way you’ll always get the latest version. To refresh the app, swipe the app closed, and tap the app icon again to fully reload. <\/p>\n<h2><strong>Share your guide with your group<\/strong><\/h2>\n<p>You can send the link to this guidebook to everyone who’s travelling with you. That way, everyone has access to all the information they’ll need (which means less hassle for the trip organizer!). <\/p><\/span><\/span><\/span><\/span><\/span><\/span><\/span><\/span><\/span><\/span>", "photoHidden": "eb62c72e322ed4e278d8a01199f7aad2.jpg", "id": "add-this-guide-to-your-phone"}]}]}, "welcome": {"id": "welcome", "title": "Welcome", "icon": "cloud-sun", "groups": [{"title": "", "items": [{"title": "Welcome to Tidewater!", "html": "<p><strong>Welcome to the Tidewater 2601!<\/strong><br/>Here at your fingertips is everything you should need for your stay with us. In this easy-to-navigate link you will find information about the condo, ideas and recommendations in the surrounding area, our Wi-Fi login credentials, and so much more.<\/p>\n<p>In order to best enjoy your time in our home, we encourage you to add this \"app\" to your phone. All of the content will even be accessible when your phone is offline.<\/p>\n<p>* It's not really an \"app\", but more a tool for easy access on your home screen <\/p>\n<ul>\n<li>For iPhone:\n<ul>\n<li>Tap the square with arrow pointing up at the bottom of your screen<\/li>\n<li>Select \"Add to Home Screen\"<\/li>\n<\/ul>\n<\/li>\n<li>For Android:\n<ul>\n<li>Tap \"Add to Home Screen\" where prompted when first accessing the site<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Print or Save a PDF<\/strong><br/>If you would like to print certain pages ahead of traveling, or if you'd like to save a PDF to your device, just tap the print button above. It won't print right away, but will create a PDF which you can save or print.<\/p>\n<p><strong>Contacting Us<\/strong><br/>We pride ourselves on swiftly meeting guest needs.  We can be reached as follows:<\/p>\n<ul>\n<li>Preferred: Airbnb or VRBO message<\/li>\n<li>Phone: 404-358-1552 (emergencies)<\/li>\n<li>Instagram: @<a href=\"https://www.instagram.com/bk_stays/\" target=\"_blank\">Bk_stays<\/a><\/li>\n<li>Facebook: <a href=\"https://www.facebook.com/profile.php?id=61551815370553\" target=\"_blank\">BK Stays<\/a><\/li>\n<\/ul>\n<p><strong>What Next?<\/strong><br/>Please relax, unwind, have fun, and enjoy your stay!<\/p>", "photo": "a8775523aaba4c0e07c5fdd0660a36a7.jpg", "id": "welcome-to-tidewater"}]}]}, "check-in-arrival": {"id": "check-in-arrival", "title": "Check In + Arrival", "icon": "key-round", "groups": [{"title": "", "items": [{"title": "Driving Directions", "html": "<p>Tidewater Beach Resort<\/p>\n<p>16819 Front Beach Road, Panama City Beach, FL 32413.<\/p>\n<p>We recommend using waze or Google Maps to get accurate directions. If you are traveling during busy season please plan accordingly.&nbsp;<\/p>", "photo": "086591e685171217b89de3694e2b3326.jpg", "id": "driving-directions"}, {"title": "Access Codes / Instructions", "html": "<p>The Access Code for the front door is:<\/p>\n<p><strong><span style=\"background-color: rgb(191, 237, 210);\">1552<\/span><\/strong><\/p>\n<p>To lock the door, simply press the lock button. Please make sure all external doors are locked whenever you leave.<\/p>\n<p>* If for some reason the code doesn't work please call me at <a href=\"tel:404-358-1552\">404-358-1552<\/a>. I will get you the lockbox code for the spare key!<\/p>", "photo": "730742e2babb8d2cedbe0a30eac61d46.jpg", "id": "access-codes-instructions"}, {"title": "4:00 PM Check-in", "html": "<p>If you would like an early check-in, please see our <a href=\"#/info/check-in-arrival/early-check-in-half-day-stay-option\">Early Check In (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 4:00 PM is a strict check-in time. If you are arriving early, take a look at the Explore the Area section. We've listed a few things to do around the area while we prepare the home!<\/p>", "photo": "11e339c716ed8af07a28c05e286c2caa.jpg", "id": "4-00-pm-check-in"}, {"title": "Early Check In (Half Day Stay Option)", "html": "<p>Want to get here early? Add a <strong>Half Day Stay<\/strong> and you can arrive as early as <strong>8:00 AM<\/strong> on your arrival day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer early check-in because of our tight cleaning and maintenance schedule.<\/p>", "photo": "6db9b8952aaf5792e4af093537545794.jpg", "id": "early-check-in-half-day-stay-option"}]}]}, "check-out-departure": {"id": "check-out-departure", "title": "Check Out + Departure", "icon": "hand", "groups": [{"title": "", "items": [{"title": "10:00 AM Check-out", "html": "<p>If you would like a late check-out, please see our <a href=\"#/info/check-out-departure/late-check-out-half-day-stay-option\">Late Check Out (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 10:00 AM is a strict check-out time. <\/p>", "photoHidden": "ea9c00f35f36edb8d89dcc92e7f562cc.jpg", "id": "10-00-am-check-out"}, {"title": "Late Check Out (Half Day Stay Option)", "html": "<p>Not ready to leave? Add a <strong>Half Day Stay<\/strong> and you won't need to check out until <strong>8:00 PM<\/strong> on your departure day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer late check-out because of our tight cleaning and maintenance schedule.<\/p>", "photoHidden": "6db9b8952aaf5792e4af093537545794.jpg", "id": "late-check-out-half-day-stay-option"}, {"title": "Extended Stay?", "html": "<p>Would you like to add another night? If we have availability the day before or after your reservation, we would love to offer you that extra night at a great discount. We'll even cover the taxes and fees! Just let us know if your travel plans are flexible and we will make sure to accommodate the changes!<\/p>", "photoHidden": "585cb6b5ac72b31289b8dae13c068a03.jpg", "id": "extended-stay"}, {"title": "Check-out Process", "html": "<p>Standard check-out is at 10:00 AM on your departure date (unless you've paid for a late check-out).<\/p>\n<p>When you've concluded your stay, technically, you can just leave no questions asked lol :) But, if you really wanted to give our cleaning team some love, we would appreciate it if you would take care of a few simple things:<\/p>\n<ul>\n<li>Trash - Please remove the trash and place it in the trash receptacles by the elevators.&nbsp;<\/li>\n<li>Dishwasher - load and start the dishwasher<\/li>\n<li>Towels - Place used towels in the shower<\/li>\n<li>Lock Up - ensure all doors are locked (both entry and patio)<\/li>\n<\/ul>\n<p>We hope you had an amazing stay!&nbsp;Thank you again and safe travels back home.<\/p>", "id": "check-out-process"}, {"title": "Lost and Found", "html": "<p>Please triple-check the home before departing to ensure you have not left anything behind. Common items left behind include phone chargers, computer cords, passports/licenses, clothes, electronics, eyeglasses, toiletries/makeup, documents, and toys.<\/p>\n<p>Please send a message the moment you realize you've left something behind.&nbsp;<br><br>We completely understand that things can get left behind &mdash; and we&rsquo;re more than happy to help get your items back to you! We&rsquo;ll gladly ship your lost item using the postal service or carrier of your choice (standard, express, or overnight). <br><br>We kindly ask for the <span style=\"text-decoration: underline;\">shipping cost, plus a $20 service fee<\/span> to cover the time and materials for packaging and handling.&nbsp;Be certain to include:<\/p>\n<ul>\n<li>Item description<\/li>\n<li>Where you think you may have left the item<\/li>\n<li>The name on the reservation<\/li>\n<\/ul>\n<p>Just let us know how you&rsquo;d like it sent, and we&rsquo;ll take care of the rest!<\/p>", "photoHidden": "8da278ec14e085d81ebe06c22b24af10.jpg", "id": "lost-and-found"}]}]}, "rules": {"id": "rules", "title": "Rules and Regulations", "icon": "book-open", "groups": [{"title": "", "items": [{"title": "Age Requirement", "html": "<p>The minimum age requirement to book is 25 years of age. The home is child friendly, but not childproof, and may not be suitable for infants or children without adult supervision.<\/p>", "id": "age-requirement"}, {"title": "Balcony Safety", "html": "<p>The unit is on the 26th floor with a wrap-around balcony. Please use it with care:<\/p><ul><li>Adults must supervise children on the balcony at all times.<\/li><li>Never sit, stand, climb or lean on the railings.<\/li><li>No one under the influence of alcohol or drugs should go on the balcony.<\/li><li>Never throw or drop anything from the balcony. It's illegal and dangerous to people below.<\/li><li>Don't hang towels, clothing or bags over the railing.<\/li><\/ul><p>If you notice anything wrong with the railing or balcony surface, stop using it and let us know right away.<\/p>", "id": "balcony-safety"}, {"title": "Confetti / Glitter", "html": "<p><strong>No Confetti or Glitter<\/strong><br>We understand that special occasions call for celebration - and sometimes decorations! However, confetti and glitter are extremely difficult to clean and can cause damage to furniture and floors. Any evidence of confetti or glitter left behind will incur additional cleaning fees. Please celebrate responsibly and help us keep the home in great condition - no confetti or glitter, please.<\/p>", "id": "confetti-glitter"}, {"title": "Damages", "html": "<p>Guests are financially responsible for any damage, theft, missing items, or violations of house rules during their stay. You could be charged for: Property damage or theft; Unauthorized pets; Excessive cleaning or evidence of smoking; Exceeding occupancy or parking limits; Any other violations outlined in this agreement. You will be notified in writing if any damage is found. Major damage that delays the next check-in may result in additional charges for guest relocation or compensation. Please report any existing damage at check-in, and notify us right away if anything breaks or is damaged during your stay, even if it&rsquo;s small. We understand accidents happen and can often replace or repair items quickly if we're informed. Guests are responsible for damage caused by misuse or negligence.<\/p>\n\n<p>&nbsp;<\/p>", "id": "damages"}, {"title": "Fire Safety and Prevention", "html": "<p>Guest agrees to comply with all local, county, and state fire restrictions, including any active burn bans or official fire safety regulations. Guest is responsible for helping maintain a fire-safe environment throughout their stay. This includes, but is not limited to; Ensuring that all outdoor fires (e.g., bonfires or fire pits) are fully extinguished after use, before going to bed, and before vacating the property; Never leaving open flames or burning embers unattended; Using only designated fire areas and keeping all fires small, controlled, and manageable; Ensuring fire extinguishers located in the home are accessible at all times and used in case of fire emergencies.<\/p>\n<p>Additionally, Guest(s) acknowledges that outdoor grills must be cleaned and properly maintained after each use to prevent fire hazards. Guest agrees to: Clean the grill thoroughly after each use; Remove all grease and dispose of it safely in the trash (never on the ground or around the property); Ensure the grill is turned off, left in safe, clean, and operable condition, and covered if applicable; Keep a fire extinguisher nearby when using the grill.<\/p>\n<p>Failure to follow fire safety guidelines may result in fines, eviction, or financial liability for any resulting damages.<\/p>", "id": "fire-safety-and-prevention"}, {"title": "No Commercial Use", "html": "<p>This home is for private stays only. No commercial use of any kind is allowed. That means no retreats, workshops, classes, shoots or paid events, no charging admission, no selling or renting rooms, and no using our photos or property name to promote anything.<\/p><p>Planning something special? Ask us before you arrive. Events require our written approval and a signed agreement.<\/p><p>Violations will result in <strong>immediate eviction without refund<\/strong>, <strong>loss of your security deposit<\/strong>, a report to the platform you booked through, and possible legal action to recover damages.<\/p>", "id": "no-commercial-use"}, {"title": "Occupancy - Max 10 Person(s)", "html": "<p>This home has a maximum occupancy of <strong>10 person(s)<\/strong>, and no more than 10 people may be on the property at any time. Occupancy is enforced per Bay County, Florida fire code and Tidewater Beach Resort policy.<\/p><p>Please contact us before arrival if you'd like to request additional guests. Unapproved guests or exceeding the occupancy limit <strong>will result in the loss of your security deposit<\/strong> and may lead to immediate eviction without refund.<\/p>", "id": "occupancy-max-10-person-s"}, {"title": "Parking", "html": "<p>Three (3) parking passes are included with your reservation and are issued during resort registration. Parking is in the resort's covered garage.<\/p><ul><li>Vehicles taller than 7 feet 2 inches don't fit in the garage.<\/li><li>Golf carts, rental scooters and bubble cars can't park in the garage or under the front entrance (porte-cochère).<\/li><li>Unauthorized areas and ADA spots without a permit will get you towed at your expense.<\/li><\/ul><p>Extra parking passes may be available from the resort for $25 + tax each, subject to availability.<\/p>", "id": "parking"}, {"title": "Pet Policy - No Pets", "html": "<p>We love animals but we chose to make this home pet-free due to many people being allergic. We have a strict No Pet Policy. Only registered service animals are allowed, and you must notify us beforehand so we can take proper cleaning measures. If you bring an undisclosed pet you are subject to a $500 fine.<\/p>", "id": "pet-policy-no-pets"}, {"title": "Plumbing", "html": "<p>Please only put toilet paper in the toilet and throw everything else in the trash.<\/p><p>Tampons, baby wipes (even \"flushable\" ones), paper towels or anything other than toilet paper will clog the pipes and can lead to plumbing damage fees.<\/p>", "id": "plumbing"}, {"title": "Quiet Hours", "html": "<p>Quiet hours are <strong>10:00 PM to 8:00 AM<\/strong>, per Tidewater Beach Resort rules. During this time, please keep music, loud conversations and any other disruptive noise to a minimum. Excessive noise can lead to fines from the resort or removal without refund.<\/p>", "id": "quiet-hours"}, {"title": "Reservation Adjustments", "html": "<p>If you need to make any change in your stay, for example, regarding the number of guests, bringing a service animal or anything at all, please let us know ahead of time so we can accommodate you. However, if you do not disclose any changes, like an animal or extra guests (above max occupancy) you could be subject to a reservation cancellation without refund. <\/p>", "id": "reservation-adjustments"}, {"title": "Resort Registration (Required)", "html": "<p>Every guest must pre-register with Tidewater Beach Resort <strong>at least 24 hours before check-in<\/strong>. We recommend doing it right after booking. If you don't register, the resort will deny access to the unit and resort amenities.<\/p><ul><li>The person registering must be at least 25 years old and listed on the reservation.<\/li><li>List every guest by full name and age.<\/li><li>Enter your vehicle information accurately. Incorrect or missing vehicle information can lead to towing at your expense.<\/li><li>The resort charges a <strong>$65 pre-registration fee<\/strong>, paid directly to Tidewater Beach Resort when you register.<\/li><\/ul><p>We'll email you the registration instructions after you book.<\/p>", "id": "resort-registration-required"}, {"title": "Security Camera", "html": "<p>Security cameras are located on the exterior of the unit and in resort common areas. A doorbell camera at the front door of the unit records the hallway and entry area, and the resort's cameras monitor the parking areas and common spaces. These are public areas, so video may be captured there and no conversations or activities in these areas may be considered private. The cameras are only there for the safety and security of the property and our guests.<\/p>", "id": "security-camera"}, {"title": "Smoking", "html": "<p>Smoking of any kind (cigarettes, cigars, pipes, vaping, e-cigarettes, marijuana or other drugs) is not allowed anywhere on the property, indoors or outdoors, unless you have our written permission in advance.<\/p><p>Evidence of smoking, including smoke odor, ash, butts, paraphernalia or related trash left inside or outside the unit, <strong>will result in the loss of your security deposit<\/strong>, plus the cost of odor removal and cleaning, and may result in eviction without refund.<\/p><p>Tidewater Beach Resort also enforces its own $300 smoking fine.<\/p>", "id": "smoking"}, {"title": "Wristbands + Resort Access", "html": "<p>After you register, every guest age 12 and older picks up an RFID wristband at the Tidewater Welcome Center. Wear it at all times on resort property. You'll need it for the pools, jacuzzis, gym and beach access.<\/p><p>Please return all wristbands to the registration desk at checkout. The resort charges a replacement fee for lost or unreturned wristbands.<\/p>", "id": "wristbands-resort-access"}]}]}, "cancellation-policy": {"id": "cancellation-policy", "title": "Cancellation Policy", "icon": "circle-x", "groups": [{"title": "", "items": [{"title": "Cancellation Policy", "html": "<p>Our cancellation policy varies depending on the time and platform you booked on (VRBO, Airbnb, Direct etc). Your home has a designated cancellation policy, which would have been clearly stated at the time of booking and may fall under one of the following categories: strict, firm, moderate, or flexible.&nbsp;<\/p>\n<p>We strongly recommend that you secure travel insurance to protect your investment. If you have purchased travel insurance, please consult your provider for assistance with cancellations or disruptions.<\/p>\n<p>If travel insurance was not purchased, cancellations will be handled under the cancellation terms outlined in your reservation. However, exceptions may be made under the following circumstances:<\/p>\n<ul>\n<li>A governor-issued state of emergency directly impacting the area or<\/li>\n<li>A mandatory evacuation order issued for the specific county where the property is located.<\/li>\n<\/ul>\n<p>These exceptions typically apply in cases of severe weather, such as hurricanes, significant snowstorms, or other government-declared emergencies.<\/p>", "id": "cancellation-policy"}]}]}, "about-us": {"id": "about-us", "title": "About Us", "icon": "users", "groups": [{"title": "", "items": [{"title": "About Your Hosts", "html": "<p>Our first trip to North Georgia was way back in the summer of 2021 and we undeniably fell in love. The mountain vibes left such a good impression, that we decided as a family to find a home away from home. The surrounding area has so much to offer for families, friends, and couples during every season of the year. We have had the chance to experience so much that Blue Ridge, Ellijay, and the North Georgia Mountains have to offer, but we still have a long bucket list waiting for our next adventure. We have a 6-year-old daughter and a 3-year-old son and love traveling and spending time exploring new places as a family.<\/p>", "photo": "about-us-family-collage.jpg", "photoFit": "full", "id": "about-your-hosts"}]}]}, "contact-us": {"id": "contact-us", "title": "Contact Us / Book Again", "icon": "phone", "groups": [{"title": "", "items": [{"title": "Thank You For Staying With Us", "html": "<p><strong>Thank you for staying with us, and we hope you enjoyed your stay.<\/strong> If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time.&nbsp;<\/p>\n<p><strong>We love online reviews!<\/strong><\/p>\n<p>Vrbo and Airbnb automatically sends you a review request. All you need to do is click the \"leave a review\" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. Was it the comfy beds; the local information and recommendations; or perhaps the location and all the fun activities to do at the home?<\/p>\n<p><br><strong>Thank you!<\/strong><\/p>\n<p>Brandon and Katharina&nbsp;<\/p>", "photoHidden": "4d239b49ed0744691981d3decf88b377.jpg", "id": "thank-you-for-staying-with-us"}, {"title": "Returning Guests", "html": "<p>We would love to have you stay again! In fact, please take advantage of booking directly with us at <a href=\"https://www.bkstays.com/about-us\">bkstays.com <\/a>- please reach out to us on Instagram, Facebook, or directly to Brandon at 404 - 358 - 1552. <\/p>", "photoHidden": "5e53f078d45d701f01a19dcba10f0cc7.jpg", "id": "returning-guests"}, {"title": "Follow Us On Social Media", "html": "<p>Let's Be Social! Follow Us On Social Media Below<\/p>\n<p>Facebook: BK Stays<\/p>\n<p>Instagram: @bk_stays<\/p>", "photoHidden": "067e96592ab64bb41d8e0f51c9754500.jpg", "id": "follow-us-on-social-media"}, {"title": "How To Contact Us", "html": "<p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.&nbsp; We can be reached at the contact info below:<\/p>\n<ul>\n<li>Message: through Airbnb / VRBO (simple assistance)<\/li>\n<li>Phone: 1-404-358-1552 (emergencies)<\/li>\n<li>Instagram or Facebook @ bk_stays<\/li>\n<\/ul>", "photoHidden": "4f717eaaf0303b1fec1a0ee821f299a1.jpg", "id": "how-to-contact-us"}]}]}, "wifi": {"id": "wifi", "title": "Wi-Fi / Internet Details", "icon": "wifi", "groups": [{"title": "", "items": [{"title": "Wi-Fi / Internet Details", "html": "<p>There is free Wi-Fi for your use. The details are: <br><br>Network - 2601<\/p>\n<p>Password - 8779121550<br><br>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us.<\/p>", "photo": "5ed7c444a9811d008c50a348f27c69d5.jpg", "id": "wi-fi-internet-details"}]}]}, "beach-service": {"id": "beach-service", "title": "Beach Chairs + Umbrellas", "icon": "umbrella", "groups": [{"title": "", "items": [{"title": "Beach Chairs + Equipment", "html": "<p>We try to keep a selection of folding beach chairs, umbrellas with sand anchors, a few beach toys, and plenty of beach towels stocked in the closet for guest use.<\/p>\n<p>Guests are welcome to take anything provided down to the beach&mdash;just please double-check that it's in working condition. If anything is missing or broken, please let us know and we&rsquo;ll do our best to replace it quickly. The resort offers a professional chair and umbrella rental service with setups in the prime beachfront area directly in front of the resort. Rentals include 2 chairs + 1 umbrella and typically cost $50&ndash;$70 per day, depending on the time of year and length of rental (multi-day rentals are discounted). Personal chairs are still allowed but must be set up slightly off to the side of the reserved section.&nbsp;<\/p>", "photo": "afe225dbe9edcc712775c231252fc98a.jpg", "id": "beach-chairs-equipment"}]}]}, "accessibility": {"id": "accessibility", "title": "Elevator / Accessibility", "icon": "accessibility", "groups": [{"title": "", "items": [{"title": "Elevators", "html": "<p>Tidewater is very large, and one of the tallest resorts in Panama City Beach. The elevators can be quite busy, especially during peak season. I wish there was more we could do, but for now, we can only give you a courtesy warning. You're on the 26th floor, which makes for an incredible view, but a slightly longer elevator wait :)<\/p>", "photo": "ad21d51c8ecab69e21cea30b0cf69be2.jpg", "id": "elevators"}]}]}, "kitchen": {"id": "kitchen", "title": "Kitchen, Supplies + Appliances", "icon": "cooking-pot", "groups": [{"title": "", "items": [{"title": "Kitchen + Supplies + Appliances", "html": "<p>We have a fully stocked kitchen with a stainless steel appliance package. We try to provide everything you may need, but we're not perfect. If you have any suggestions for small appliances, dishware, flatware, glassware, or even dry goods that would be beneficial - let us know! We would be happy to see if it's possible to place an Amazon/Walmart/Grocery delivery order for you during your stay :)<\/p>\n<p>&nbsp;<\/p>", "id": "kitchen-supplies-appliances"}]}]}, "laundry": {"id": "laundry", "title": "Laundry", "icon": "washing-machine", "groups": [{"title": "", "items": [{"title": "Laundry", "html": "<p>We do have a private washer and dryer located in the home. There should be a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in, close the door, and hit start. <\/p>", "photo": "794607d57a2c8fc964701bb9c7a73b7a.jpg", "id": "laundry"}]}]}, "pool": {"id": "pool", "title": "Pool", "icon": "waves", "groups": [{"title": "", "items": [{"title": "Pool Waiver", "html": "<p style=\"text-align: left;\">By reserving this home you have agreed to the following rules below.<\/p>\n<p><strong>Assumption of Risk:<\/strong><\/p>\n<p>We intend to utilize the swimming pool(s). We are aware and understand there are inherent risks associated with the use of these facilities and we recognize and fully understand the risks. We are aware and understand that our use of the swimming pool(s) is a potentially dangerous activity and involves the risk of personal injury, pain, suffering, temporary or permanent disability, death, property damage, and/or financial loss. We are aware and understand that at no time there will be a lifeguard on duty while we use such facilities. We are aware of and understand that the use of the pool facilities involve certain risks, including but not limited to:<\/p>\n<ul>\n<li>the risk of injury resulting from possible malfunction of pool equipment<\/li>\n<li>the risk of injuries resulting from tripping/falling over obstacles in the pool area.<\/li>\n<li>the risk of injuries resulting from unsupervised divers and swimmers colliding<\/li>\n<li>the risk of other injuries resulting from participating in any action in the pool<\/li>\n<\/ul>\n<p>We recognize and fully understand that the above list is not a complete or exhaustive list of all possible risks; the list only provides examples of types of risks we are assuming. <strong>NOTWITHSTANDING THESE RISKS, WE ACKNOWLEDGE THAT WE ARE VOLUNTARILY ACCESSING THE SWIMMING FACILITIES AND PARTICIPATING IN THE ACTIVITY WITH KNOWLEDGE OF THE DANGERS INVOLVED. WE HEREBY AGREE TO ACCEPT AND ASSUME ALL RISKS OF ILLNESS, PERSONAL OR PSYCHOLOGICAL INJURY, PAIN, SUFFERING, TEMPORARY OR PERMANENT DISABILITY, DEATH, PROPERTY DAMAGE, AND/OR FINANCIAL LOSS ARISING THEREFROM, WHETHER CAUSED BY THE ORDINARY NEGLIGENCE OF THE COMPANY/OWNER/HOST OR OTHERWISE.&nbsp;<\/strong><\/p>\n<p>We further agree that in exchange for being allowed to use the pool, I fully intent to and choose to give up legal rights and we agree TO WAIVE AND RELEASE ANY ANY AND ALL CLAIMS that we have or may have in the future against the resort/owner/host and representatives from any and all liability for any loss, damage, injury, expense, or other cost that we may suffer or that our next of kin may suffer in connection with our use of the Releasees pool or pool area to any cause whatsoever, INCLUDING NEGLIGENCE ON THE PART OF THE RELEASEES. We further agree TO HOLD HARMLESS AND INDEMNIFY THE RELEASEES from any and all claims, whether now known or hereafter known, and release all liability to the property, or personal injury to, any third party, resulting from the use of the pool or pool area. We further agree that this Waiver, Release, and Agreement is fully effective and shall be effective and binding upon us, and our heirs, next of kin, executors, administrators, and assigns or anyone else authorized to act on our behalf or on behalf of our estate.<strong> WE ACKNOWLEDGE THAT WE HAVE READ AND UNDERSTOOD ALL OF THE TERMS OF THIS RELEASE AND THAT WE ARE VOLUNTARILY GIVING UP SUBSTANTIAL LEGAL RIGHTS, INCLUDING THE RIGHT TO SUE THE RESORT/OWNER/HOST.<\/strong><\/p>\n<p>We further agree to abide by the posted rules listed below.&nbsp;<\/p>", "id": "pool-waiver"}]}]}, "tv-streaming": {"id": "tv-streaming", "title": "TVs + Streaming", "icon": "tv", "groups": [{"title": "", "items": [{"title": "TVs + Streaming", "html": "<p>We have high-speed Wi-Fi for all of your streaming needs!<\/p>\n<p>There are Smart TVs throughout the entire home.<\/p>\n<p>Go to the TV Home Screen<\/p>\n<p>Search For (or Download) The Channel App You Want To Watch &amp; Login to your TV Provider.<\/p>\n<p>Please don't hesitate to reach out if you need provider login assistance!<\/p>", "photo": "729ecb38918b0e99bc0a0ec5fa74c6d2.jpg", "id": "tvs-streaming"}, {"title": "Wi-Fi + TV QR Code", "html": "<p><strong>Welcome to Tidewater Beach Resort!<\/strong><\/p>\n<p>For quick and easy access to Wi-Fi, TV, and other important information, please use the QR code below.<\/p>\n<p><strong>Scan the QR code<\/strong> to connect to Wi-Fi and view TV details instantly.<\/p>\n<p>If you have trouble connecting, try turning Wi-Fi off and back on, then reconnect.<\/p>\n", "photo": "64914f9dc4e5824e02acaebd334d3f18.jpg", "id": "wi-fi-tv-qr-code"}, {"title": "TV Instructions", "html": "<p><strong>How to Use the TV<\/strong><\/p>\n<ol>\n<li>Turn on the TV using the <strong>remote control<\/strong><\/li>\n<li>Make sure the input/source is set to <strong>Cable / HDMI<\/strong> (depending on setup)<\/li>\n<li>Use the remote to:\n<ul>\n<li>Change channels<\/li>\n<li>Adjust volume<\/li>\n<li>Open smart apps (if available)<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><em>Tip: If the TV is not working, check that the correct input is selected.<\/em><\/p>\n", "photo": "24ccecbd139187e22757fd45b9938af8.jpg", "id": "tv-instructions"}, {"title": "Channel Guide & Remote Info", "html": "<p><strong>Channel Guide &amp; Remote<\/strong><\/p>\n<p><strong>Channel Guide<\/strong><\/p>\n<ul>\n<li>Please refer to the <strong>channel guide image<\/strong> below for available channels<\/li>\n<li>You may also access this via the QR code<\/li>\n<\/ul>\n<p><strong>Remote Control<\/strong><\/p>\n<ul>\n<li>Use the provided remote to control power, volume, and channels<\/li>\n<li>See the image below for button reference<\/li>\n<\/ul>\n", "photo": "06bc9331a4b36d8415eaf6cd911df015.jpg", "id": "channel-guide-remote-info"}]}]}, "thermostat": {"id": "thermostat", "title": "Thermostat", "icon": "thermometer", "groups": [{"title": "", "items": [{"title": "Heating / Cooling", "html": "<p>There is a smart thermostat on the wall that allows you to control the temperature of the home. When you arrive, the thermostat should be set to keep the temperature between 70-74°F - but you can adjust if you need. If you're running the air conditioning or heating - Please keep all windows and outside doors closed to ensure it operates at maximum efficiency. We recommend a setting of about 72°F which we find keeps the place at a comfortable temperature.<\/p>", "photo": "6dcf0c01138989074a4f45f1ba6e2775.jpg", "id": "heating-cooling"}]}]}, "beer-wine": {"id": "beer-wine", "title": "Beer and Wine", "icon": "wine", "groups": [{"title": "Beer and Breweries", "items": [{"title": "The Craft Bar at Pier Park North", "html": "<p><strong>Website:<\/strong> <a href=\"https://www.thecraftbarfl.com/panama-city-beach\">thecraftbarfl.com<\/a><\/p>\n<p><strong>Phone:<\/strong> (850) 588-7309<\/p>\n<p><strong>Address:<\/strong> 15600 Panama City Beach Pkwy, Suite 180 (Pier Park North), Panama City Beach, FL 32413<\/p>\n<p>Located in Pier Park North, this gastropub offers a great mix of craft beer, cocktails, and inventive scratch-made dishes. Whether you are craving a gourmet burger, a rare beer on tap, or just a fun evening out, this is the place.<\/p>\n<p><strong>What&#39;s great:<\/strong> a big craft beer list, creative cocktails, and a chef-driven menu, plus specials like burger night, happy hour, and Sunday brunch.<\/p>\n<p>A smart pick for both families and craft beer lovers. Hours are typically 11 AM to 9 PM Sunday through Thursday and until 10 PM Friday and Saturday; check their website for current hours and specials.<\/p>", "photo": "814af3b4882f622514c0a81ca5468235.jpg", "id": "the-craft-bar-at-pier-park-north"}, {"title": "Craft Beer EmPOURium", "html": "<p><strong>Facebook:<\/strong> <a href=\"https://www.facebook.com/CraftBeerEmPOURium\">Craft Beer EmPOURium<\/a><\/p>\n<p><strong>Instagram:<\/strong> <a href=\"https://www.instagram.com/craftbeerempourium\">@craftbeerempourium<\/a><\/p>\n<p><strong>Phone:<\/strong> (850) 785-1166<\/p>\n<p><strong>Address:<\/strong> 300 Harrison Ave, Panama City, FL 32401<\/p>\n<p>In historic downtown Panama City (about a 30-minute drive), this spot brings together billiards and craft beer under one roof. With a huge selection of brews, from IPAs to stouts, ciders, and wine, it is a great hangout whether you are flying solo or in a group.<\/p>\n<p><strong>What to expect:<\/strong> a massive beer selection, pool tables, a laid-back vibe, and late-night hours.<\/p>", "photo": "8b883b23048c33c6d939f9f0cbd83fc4.jpg", "id": "craft-beer-empourium"}, {"title": "History Class Brewing Company", "html": "<p><strong>Website:<\/strong> <a class=\"decorated-link\" href=\"https://www.historyclass.beer\">https://www.historyclass.beer<\/a><\/p>\n<p><strong>Phone:<\/strong> (850) 801-2337<\/p>\n<p><strong>Address:<\/strong> 6 E. 4th Street, Panama City, FL 32401<\/p>\n<p>Just a short drive from the beach, this cozy brewpub is part community hub, part museum—celebrating Bay County’s history one craft beer at a time. Whether you're sipping the floral <em>Singing Sisters<\/em> Saison or enjoying <em>The Hero<\/em> porter, you're part of a narrative.<\/p>\n<p>Hours: Wed–Thu: 4–10 PM | Fri–Sat: 11 AM–10 PM | Sun: 11 AM–8 PM | Closed Mon–Tue<\/p>\n<p>Why Visit: Community donations, locally inspired brews, historic décor, kid- and dog-friendly vibes<\/p>\n<p>Plan Ahead: No reservation needed unless your group is 6+; walk-ins typically welcome.<\/p>", "photo": "5881b8020e3cfd1dd8117563737cd61e.jpg", "id": "history-class-brewing-company"}, {"title": "Idyll Hounds Brewing Company", "html": "<p><strong>Website:<\/strong> <a href=\"https://www.idyllhoundsbrewingcompany.com/\">idyllhoundsbrewingcompany.com<\/a><\/p>\n<p><strong>Phone:<\/strong> (850) 231-1138<\/p>\n<p><strong>Address:<\/strong> 845 Serenoa Rd, Santa Rosa Beach, FL 32459<\/p>\n<p>About a half-hour drive west of your stay, this inviting brewery in Santa Rosa Beach focuses on creative, locally inspired beers served in a warm, warehouse-style taproom. It is perfect for a relaxed evening or a casual meet-up, whether you are curious about their rotating brews or just ready to kick back with good company.<\/p>\n<p>The taproom is generally open daily from around noon. Check their website for current hours.<\/p>", "photo": "243a289976321ff7a2f14dc14613fa61.jpg", "id": "idyll-hounds-brewing-company"}]}, {"title": "Wine and Wineries", "items": [{"title": "Duplin Winery", "html": "<p>Warm Southern hospitality greets you the minute you walk in the door. Enjoy a wine tasting with knowledgeable and friendly guides, sit on the porch with your favorite Duplin wine and listen to live music, or browse the gift shop for wine and accessories to take home.<\/p>\n<p><strong>Address:<\/strong> 10101 Panama City Beach Pkwy, Panama City Beach, FL<\/p>\n<p>Shopping is typically open daily from noon, with tastings until about an hour before closing. Check their website for current hours.<\/p>\n<p><a href=\"https://www.duplinwinery.com/visit-us#panama-city-beach\">duplinwinery.com<\/a><br/>(910) 289-3888 (Duplin main line)<\/p>", "photo": "9977c468311d5efee192fd3fdad45b13.jpg", "loc": [30.192346, -85.80155889999999], "pin": "vineyard", "id": "duplin-winery"}, {"title": "Panama City Beach Winery", "html": "<p>A local community staple, the Panama City Beach Winery offers 100% real fruit wines. Join a wine tasting to sample choices like Mango, Kiwi, and Guava, and let the Sunshine State dance on your palate.<\/p>\n<p><strong>Address:<\/strong> 8730 Thomas Drive, Suite 1103B, Panama City Beach, FL 32408<\/p>\n<p><a href=\"https://panamacitybeachwinery.com/\">panamacitybeachwinery.com<\/a><br/>(850) 233-5950<\/p>\n<p>Call ahead or check their website for tasting hours.<\/p>", "photo": "e42d7442aa9a2235c12faa5aa0037dc4.jpg", "loc": [30.1694093, -85.78930539999999], "pin": "vineyard", "id": "panama-city-beach-winery"}]}]}, "dining": {"id": "dining", "title": "Dining Out", "icon": "utensils", "groups": [{"title": "Breakfast, Brunch, + Coffee Recommendations", "items": [{"title": "Andy's Flour Power", "html": "<p>A must-try voted Best Brunch on the Best of Bay list, and featured in Southern Living Magazine! Andy's Flour Power provides breakfast and bakery delicacies, baking the freshest ingredients. A go-to while in Panama City Beach! <\/p>\n<p> <\/p>\n<p><a href=\"https://www.andysflourpower.com/\" target=\"_blank\">https://www.andysflourpower.com/<\/a><br/>(850) 230-0014<\/p>", "photo": "f5ba500cb606560a936060bdfb0b0fb2.jpg", "loc": [30.1562378, -85.7513618], "pin": "coffee_shop", "id": "andys-flour-power"}, {"title": "Sunrise Cafe & Bakery", "html": "<p>Family-owned and operated serving breakfast and lunch all day! Grab a fresh donut or croissant, or if you're stopping by to grab a cold treat, ice creams, gelatos, milkshakes are bound to cool you down on that hot summer day! <\/p>\n<p> <\/p>\n<p><a href=\"https://sunrisecafebakery.com/\" target=\"_blank\">https://sunrisecafebakery.com/<\/a><br/>850-588-6795<\/p>", "photo": "49771bcca89b9577313c858b414be27c.jpg", "loc": [30.1793131, -85.8106494], "pin": "restaurants", "id": "sunrise-cafe-bakery"}, {"title": "Thomas Donut & Snack Shop", "html": "<p>Thomas Donut &amp; Snack Shop is the perfect place to stop for a snack on vacation. Tourists and locals alike frequent Thomas Donut &amp; Snack Shop for their great atmosphere, great food, and all around great experience. Whether you’re looking for a good breakfast or something to satisfy your sweet tooth, Thomas Donut &amp; Snack shop has what you need.<\/p>\n<p> <\/p>\n<p><a href=\"http://www.thomasdonutandsnackshop.com/\" target=\"_blank\">http://www.thomasdonutandsnackshop.com/<\/a><br/>850-234-8039<\/p>", "photo": "ec3cab22811e0a069286185be2ce434e.jpg", "loc": [30.2382294, -85.9209248], "pin": "sweet_treats", "id": "thomas-donut-snack-shop"}]}, {"title": "Dinner + Drinks Recommendations", "items": [{"title": "Bayou on the Beach", "html": "<p>This New Orleans-style family restaurant is known for authentic Cajun cuisine, raw oysters, good music, and a great time! Whether you come for the oyster bar, the famous shrimp and grits, or something from the kids menu, Bayou on the Beach makes for a satisfying night out for the whole family.<\/p>\n<p><strong>Address:<\/strong> 11115 Hutchison Blvd, Panama City Beach, FL 32407<\/p>\n<p>Typically open Tuesday through Saturday, 11 AM to 9 PM (closed Sunday and Monday); seasonal hours may apply.<\/p>\n<p><a href=\"https://bayouonthebeachcafe.com/\">bayouonthebeachcafe.com<\/a><br/>(850) 249-3478<\/p>", "photo": "ed34478929953b2f36eac103d30d7feb.jpg", "loc": [30.187033, -85.8148229], "pin": "restaurants", "id": "bayou-on-the-beach"}, {"title": "Capt. Anderson's", "html": "<p>This family-owned restaurant is known as one of the best seafood restaurants in the area, with many awards to show for it, including induction into the Restaurant Hall of Fame. How often can you say you have had award-winning seafood?<\/p>\n<p><strong>Address:<\/strong> 5551 N. Lagoon Dr, Panama City Beach, FL 32408<\/p>\n<p>Dinner is served Monday through Saturday starting at 4:30 PM (closed Sunday). Check their website for current hours.<\/p>\n<p><a href=\"https://www.captandersons.com/\">captandersons.com<\/a><br/>(850) 234-2225<\/p>", "photo": "f1da027032da146162b273ed6f8c104c.jpg", "loc": [30.1494923, -85.74686950000002], "pin": "restaurants", "id": "capt-andersons"}, {"title": "Dat Cajun Place", "html": "<p>If you are looking for Cajun and Creole cooking, Dat Cajun Place belongs at the top of your list! This multiple Best of Bay award winner serves New Orleans favorites like crawfish etouffee, gator po&#39; boys, and an award-winning chicken and andouille gumbo, with live music most evenings and a Sunday jazz brunch. With food this good, one visit probably won&#39;t be enough!<\/p>\n<p>Located on Thomas Drive near Grand Lagoon.<\/p>\n<p><a href=\"https://datcajunplace.com/\">datcajunplace.com<\/a><br/>(850) 588-5314<\/p>", "photo": "8631cd071b403ca5093940b0c98a2040.jpg", "loc": [30.1555496, -85.7510827], "pin": "restaurants", "id": "dat-cajun-place"}, {"title": "Schooners", "html": "<p>A laid-back waterfront beach club that is perfect for drinks and dinner on your way back from a big day at St. Andrews State Park! Schooners offers a diverse food menu, a large craft beer list, a great wine menu, and specialty drinks, plus live music and great Gulf views. Every night they fire off a cannon to celebrate the sunset.<\/p>\n<p>Open daily from 11 AM. No reservations.<\/p>\n<p><a href=\"https://www.schooners.com/\">schooners.com<\/a><br/>(850) 235-3555<\/p>", "photo": "e08fc42ee2a8146388d97d7b3b2b516d.jpg", "loc": [30.1410678, -85.75436770000002], "pin": "restaurants", "id": "schooners"}, {"title": "Wicked Wheel", "html": "<p>A sister restaurant to Pineapple Willy&#39;s with a completely different vibe, The Wicked Wheel is a hot-rod-themed spot known for amazing Southern food. Chow down on award-winning fried chicken, snap pics of custom hot-rod cars, or sit on a motorcycle at the bar while enjoying a cold drink. It is bound to be one for the memory books!<\/p>\n<p><strong>Address:<\/strong> 10025 Hutchison Blvd, Panama City Beach, FL 32407<\/p>\n<p>Open 7 days a week, 11 AM to 9 PM. No reservations.<\/p>\n<p><a href=\"https://thewickedwheel.com/\">thewickedwheel.com<\/a><br/>(850) 588-7947<\/p>", "photo": "aa500bdfe70387b4950b47d6dc6d6eff.jpg", "loc": [30.1823261, -85.805539], "pin": "gastro_pub", "id": "wicked-wheel"}]}, {"title": "Food Tours", "items": [{"title": "Boozy Bites or Themed Food Tours", "html": "<p>Looking for a more spirited spin? <a href=\"https://atasteofpanamacityfoodtours.com/\">A Taste of Panama City Food Tours<\/a> has offered themed outings that pair local sips with bites at curated stops, perfect for combining tasting and tippling in a fun, guided format. Check their website for current themed tours and dates.<\/p>", "photoHidden": "ae9bf26fe3f2791647036ebfcb31646a.jpg", "id": "boozy-bites-or-themed-food-tours"}, {"title": "A Taste of Panama City Food Tours", "html": "<p><strong>Website:<\/strong> <a href=\"https://atasteofpanamacityfoodtours.com/\">atasteofpanamacityfoodtours.com<\/a><\/p>\n<p><strong>Phone:<\/strong> (850) 867-8552<\/p>\n<p>These guided walking tours through downtown Panama City and the historic St. Andrews neighborhood (about 25 to 35 minutes from the beach) offer bites from local favorites while weaving in stories of the area&#39;s culture and history. It is a perfect combo of savory sampling and sightseeing for food-loving explorers. Check their website for tour options and dates.<\/p>", "photo": "9e537ff30e4965551edacdaaa5177d34.jpg", "id": "a-taste-of-panama-city-food-tours"}]}, {"title": "Lunch + Snack Recommendations", "items": [{"title": "Harpoon Harry's", "html": "<p>Harpoon Harry&#39;s sits right on the beach, so you can grab some seafood and enjoy beautiful views of the Gulf. Whether it is lunch or dinner, it is a perfect spot for great food and awesome views. When you visit, ask for the World Famous Seafood Bucket!<\/p>\n<p><a href=\"https://harpoonharry.com/\">harpoonharry.com<\/a><br/>(850) 234-6060<\/p>", "photo": "b34a570af6e716a6cf6a550b31a4d020.jpg", "loc": [30.1926746, -85.8356203], "pin": "restaurants", "id": "harpoon-harrys"}, {"title": "Local Steamer Seafood Market", "html": "<p>You can&#39;t miss the Local Steamer Seafood Market. This beloved local staple has made it to the top of plenty of food lists, and for good reason: there is just nothing that compares to fresh, local seafood! Whether you order the famous tuna dip, enormous snow crab, or a steamed seafood platter, you are in for a finger-licking good time.<\/p>\n<p><strong>Address:<\/strong> 14656 Front Beach Rd, Panama City Beach, FL 32413<\/p>\n<p><a href=\"https://www.seafoodmarketpcb.com/\">seafoodmarketpcb.com<\/a><br/>(850) 866-9330<\/p>", "photo": "f3eb111817a0df0f8c87362b39dfe5b7.jpg", "loc": [30.2061573, -85.85754209999999], "pin": "restaurants", "id": "local-steamer-seafood-market"}, {"title": "Pineapple Willy's", "html": "<p>A must-try while in Panama City Beach, Pineapple Willy&#39;s is an on-the-sand local favorite known for amazing seafood and grill dishes. Lounge on the sand with a plate of their famous BBQ ribs, sip a cool daiquiri, or stay into the evening for live music. It will likely become one of your favorite stops during your trip.<\/p>\n<p><a href=\"https://pwillys.com/\">pwillys.com<\/a><br/>(850) 235-0928<\/p>", "photo": "805e5485289ff0bd5397473a6e9e33bf.jpg", "loc": [30.1752009, -85.8051388], "pin": "restaurants", "id": "pineapple-willys"}, {"title": "Sharky's Beachfront Restaurant", "html": "<p>Sharky's is the perfect place to go for a quick lunch with the entire family. This on-the-beach restaurant is complete with a pirate ship playground, so the kids can make new friends and play while you kick back, sip on a cool one, and relax! A tiki bar-themed restaurant, you'll get great seafood, live entertainment, a full bar, and amazing views! <\/p>\n<p> <\/p>\n<p><a href=\"https://sharkysbeach.com/\" target=\"_blank\">https://sharkysbeach.com/<\/a><br/>(850) 235-2420<\/p>", "photo": "7f1eb9e6641fe28182d33a09a479e28a.jpg", "loc": [30.2083345, -85.8635769], "pin": "restaurants", "id": "sharkys-beachfront-restaurant"}]}]}, "emergency": {"id": "emergency", "title": "Emergency and Urgent Care", "icon": "siren", "groups": [{"title": "", "items": [{"title": "Hospital & Emergency Care", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p>\n<p><strong>Ascension Sacred Heart Emergency Care - Panama City Beach<\/strong> (closest ER)<br/>24/7 emergency care with imaging, lab, and on-call specialists<br/>11111 Panama City Beach Pkwy, Panama City Beach, FL 32407<br/><a href=\"https://healthcare.ascension.org/locations/florida/flpen/panama-city-beach-ascension-sacred-heart-bay-emergency-room-panama-city-beach\">Ascension Sacred Heart ER - Panama City Beach<\/a><\/p>\n<p><strong>Ascension Sacred Heart Bay<\/strong><br/>Full hospital with trauma center and specialized care (cardiology, cancer, stroke, women&#39;s health)<br/>615 N Bonita Ave, Panama City, FL 32401<br/><a href=\"https://healthcare.ascension.org/locations/florida/flpen/panama-city-emergency-department-ascension-sacred-heart-bay-panama-city\">Ascension Sacred Heart Bay<\/a><\/p>\n<p><strong>HCA Florida Gulf Coast Hospital<\/strong><br/>Large acute care center with pediatric ER, NICU/PICU, surgery, cardiac, and spine services<br/>449 W 23rd St, Panama City, FL 32405<br/>(850) 769-8341<br/><a href=\"https://www.hcafloridahealthcare.com/locations/gulf-coast-hospital/about-us/contact-us\">HCA Florida Gulf Coast Hospital<\/a><\/p>", "photo": "801c57006521ec5fc1e85f9ec8fcb270.jpg", "id": "hospital-emergency-care"}, {"title": "Panama City Beach Fire Station", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p>\n<p><strong>Closest station:<\/strong> Panama City Beach Fire Rescue Station 31, 17121 Panama City Beach Pkwy, Panama City Beach, FL 32413 (next to City Hall, a few minutes from Tidewater).<\/p>\n<p>Other city stations: Station 30, 160 N Nautilus St, and Station 32, 11911 Hutchison Blvd.<\/p>\n<p><strong>Non-emergency:<\/strong> City of Panama City Beach, (850) 233-5100<\/p>\n<p><a href=\"https://www.pcbfl.gov/departments/fire-department/fire-stations\">City of Panama City Beach Fire Stations<\/a><\/p>", "photo": "b680403223f8bd74bccf8d79b3321ffc.jpg", "id": "panama-city-beach-fire-station"}, {"title": "Panama City Beach Police", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p>\n<p><strong>Panama City Beach Police Department<\/strong><br/>17115 Panama City Beach Pkwy, Panama City Beach, FL 32413<\/p>\n<p><strong>Non-emergency:<\/strong> (850) 233-5000<br/><strong>Administration:<\/strong> (850) 233-5010<\/p>\n<p><a href=\"https://www.pcbfl.gov/departments/police-department/contact-us\">Panama City Beach Police Department<\/a><\/p>", "photoHidden": "afd348f6a7c9e92f715b3063bbb0cb99.jpg", "id": "panama-city-beach-police"}]}]}, "fishing": {"id": "fishing", "title": "Fishing", "icon": "fish", "groups": [{"title": "", "items": [{"title": "Russell-Fields City Pier", "html": "<p>Just across from Pier Park, this iconic pier stretches more than 1,500 feet into the Gulf, one of the longest on the Gulf Coast. It is open daily, year-round, and is perfect for fishing at dawn, sunset walks, or spotting dolphins, rays, and other marine life from the rails.<\/p>\n<p><strong>Address:<\/strong> 16101 Front Beach Rd, Panama City Beach, FL 32413 (across from Pier Park)<\/p>\n<p><strong>Phone:<\/strong> (850) 233-5080<\/p>\n<p><strong>Fees:<\/strong> About $4 per day to walk the pier and $7 per day to fish; check for current rates.<\/p>\n<p><strong>Gear and bait:<\/strong> Rod rentals, bait, and tackle are available at the pier entrance.<\/p>\n<p>Afterward, walk across to Pier Park for shops, restaurants, and the SkyWheel. Parking fills quickly, but there is plenty more at Pier Park.<\/p>\n<p><a href=\"https://www.visitpanamacitybeach.com/listings/russell-fields-pier/172/\">Russell-Fields Pier on Visit Panama City Beach<\/a><\/p>", "photo": "d5b60151b7dce3410228843633dabe24.jpg", "id": "russell-fields-city-pier"}, {"title": "Shell Island by Boat", "html": "<p>Shell Island is a 7-mile undeveloped barrier island that is a favorite for fishing, snorkeling, and shelling. Here are the main ways to get there:<\/p>\n<ul>\n<li><strong>Shell Island Shuttle:<\/strong> Departs from Adventures at Sea on Grand Lagoon; runs about every half hour in peak summer, with reduced off-season schedules. Coolers and beach gear are allowed on board. <a href=\"https://www.shellislandshuttle.com/\">shellislandshuttle.com<\/a>, (850) 233-0504<\/li>\n<li><strong>St. Andrews State Park ferry:<\/strong> Check in at the park&#39;s Pier Store. <a href=\"https://standrewsshellisland.com/shell-island-ferry/\">St. Andrews Shell Island ferry<\/a><\/li>\n<li><strong>Boat and jet ski rentals:<\/strong> Pontoons, kayaks, paddleboards, and jet skis let you reach secluded sandbars at your own pace.<\/li>\n<li><strong>Guided tours and dolphin cruises:<\/strong> Options include dolphin snorkel trips and narrated eco-cruises from operators like Adventures at Sea and Capt. Anderson&#39;s Marina.<\/li>\n<\/ul>\n<p>Shuttle fares have been around $25 for adults and $18 for kids; check the operator&#39;s website for current prices and schedules.<\/p>\n<p>Looking for a fishing charter? Browse options at <a href=\"https://www.visitpanamacitybeach.com/things-to-do/fishing-charters/\">Visit Panama City Beach<\/a>.<\/p>", "photo": "c723efee6900d62edbe867b94e29dab0.jpg", "id": "shell-island-by-boat"}]}]}, "golf": {"id": "golf", "title": "Golf", "icon": "flag", "groups": [{"title": "", "items": [{"title": "Legacy Golf Club", "html": "<p>Hit the beach then hit the links at the Legacy Golf Club.<\/p>\n<p>A championship course with challenging greens designed to test golfers with even the sharpest short-game skills. The fairways are generously sized with lakes and white sand bunkers that fiercely guard the elevated greens. Players should be prepared to use every club in their bag! The best way to relax and spend a little me or we time while on your holiday.<\/p>\n<p> <\/p>\n<p><a href=\"https://www.legacygolfpcb.com/\" target=\"_blank\">https://www.legacygolfpcb.com/<\/a><br/>(850) 234-1800<\/p>", "photo": "7ccd1c2a61966f909c753660f6d7d255.jpg", "loc": [30.2086919, -85.84136529999999], "pin": "golfing", "id": "legacy-golf-club"}, {"title": "Nicklaus Course at Bay Point Golf Club", "html": "<p>The only Nicklaus Design course in Northwest Florida, set in a 1,100-acre nature preserve minutes from the beach, with unique water hazards and sand traps carved from natural Florida terrain. It has won the Best of Bay award for golf year after year.<\/p>\n<p><strong>Address:<\/strong> 4701 Bay Point Rd, Panama City Beach, FL 32408<\/p>\n<p><a href=\"https://www.baypointgolfclub.com/\">baypointgolfclub.com<\/a><br/>(850) 235-6950<\/p>", "loc": [30.1474195, -85.72794379999999], "pin": "golfing", "id": "nicklaus-course-at-bay-point-golf-club"}, {"title": "Signal Hill Golf Course", "html": "<p>The oldest golf course in Panama City Beach (built in 1962), offering 5,617 yards of golf from the longest tees, with challenging greens and precise fairways. A relaxed, reliable community course.<\/p>\n<p><strong>Address:<\/strong> 9615 Thomas Dr, Panama City Beach, FL 32408<\/p>\n<p><a href=\"https://signalhillgolfcourse.com/\">signalhillgolfcourse.com<\/a><\/p>", "loc": [30.175311775054244, -85.79519533195496], "pin": "golfing", "id": "signal-hill-golf-course"}]}]}, "grocery": {"id": "grocery", "title": "Grocery and Pharmacy", "icon": "shopping-cart", "groups": [{"title": "Groceries Upon Arrival", "items": [{"title": "Grocery Delivery Service", "html": "<p>Would you like a fully stocked fridge waiting for you upon arrival? Vacation is supposed to be relaxing, and the last thing you should worry about is heading to the store on a supply run, during heavy traffic. We can make sure all your groceries are delivered beforehand.<\/p>\n<p>Pre-purchase an order online at one of the local stores and our partner Denise will deliver and store the food for you prior to your arrival!&nbsp;<\/p>\n<p>Reach out to Megan with Megan Curtis Concierge at <strong>660-605-2321<\/strong> to coordinate ahead of time. &nbsp;&nbsp;<\/p>", "id": "grocery-delivery-service"}]}, {"title": "Grocery / Pharmacy", "items": [{"title": "CVS Pharmacy – Target at Pier Park", "html": "<p><strong>Website:<\/strong> <a href=\"https://www.target.com/sl/pier-park/2208\">Target Pier Park<\/a><br/><strong>Pharmacy phone:<\/strong> (850) 236-3721<br/><strong>Target main line:<\/strong> (850) 236-3720<br/><strong>Address:<\/strong> Inside Target, 15555 Starfish St, Panama City Beach, FL 32413<\/p>\n<p>This CVS pharmacy is conveniently located inside Target at Pier Park, making it a smart stop for prescriptions, toiletries, and last-minute essentials while you shop or dine. Pharmacy hours are shorter than the store&#39;s (and may close midday for lunch), so call ahead or check the Target page for current pharmacy hours.<\/p>", "photo": "a04ea17b1baee109b1287250eb451066.jpg", "id": "cvs-pharmacy-target-at-pier-park"}, {"title": "Walmart Supercenter", "html": "<p>Website: <a class=\"decorated-link\" href=\"https://www.walmart.com/store/3119-panama-city%20beach-fl\">https://www.walmart.com/store/3119-panama-city%20beach-fl<\/a><br/>Phone: (850) 708-6968<br/>Location: 15495 Panama City Beach Pkwy, Panama City Beach, FL 32413<\/p>\n<p>A convenient, all-in-one option offering groceries, beach supplies, household essentials, and more. With extended hours, it’s a smart choice for families or anyone looking to restock quickly and affordably.<\/p>", "photo": "c9f7e2812a9d1b25e6db71bebb3de8ee.jpg", "id": "walmart-supercenter"}]}]}, "nature-parks": {"id": "nature-parks", "title": "Nature + Parks", "icon": "trees", "groups": [{"title": "", "items": [{"title": "Conservation Park", "html": "<p>A favorite destination for locals and visitors alike, Conservation Park is a great place to spend time in the great outdoors. It has 12 trails totaling more than 24 miles, ranging from 0.6 to 11 miles, plus over a mile of boardwalks through cypress domes. After a long walk, enjoy a picnic among lush greenery with your loved ones; the covered pavilion can also be rented for groups.<\/p>\n<p><strong>Address:<\/strong> 100 Conservation Dr, Panama City Beach, FL 32413<\/p>\n<p><strong>Hours:<\/strong> Dawn to dusk, 7 days a week. Free to visit.<\/p>\n<p><a href=\"https://www.pcbfl.gov/departments/parks-recreation-department/parks-facilities/conservation-park\">City of Panama City Beach - Conservation Park<\/a><br/>Pavilion rentals: (850) 233-5045<\/p>", "photo": "d44878fc11004540b438535f733f6797.jpg", "loc": [30.278178, -85.91500599999999], "pin": "parks_and_nature", "id": "conservation-park"}, {"title": "Shell Island", "html": "<p>While you are at St. Andrews State Park, hop over to Shell Island, where unspoiled beaches offer a serene escape, ideal for relaxing and beachcombing.<\/p>\n<p>This 7-mile barrier island of white sand beach, coastal scrub, and pine hammocks separates St. Andrews Bay from the Gulf. It is a haven for wildlife and for beach lovers looking for a day in a pristine natural setting, away from the resorts and condos.<\/p>\n<p>You will need a boat to get there. The ferry leaves from inside St. Andrews State Park; buy tickets online in advance or at the park&#39;s Pier Store (follow signs from the entrance gate). The ferry runs on a reduced schedule in the off-season, so check times before you go.<\/p>\n<p><a href=\"https://standrewsshellisland.com/shell-island-ferry/\">Shell Island ferry info<\/a><br/>St. Andrews State Park: (850) 708-6100<\/p>", "photo": "b119e2d3e1d6b3109fd201dc9fcda6fc.jpg", "loc": [30.1353189, -85.7415671], "pin": "parks_and_nature", "id": "shell-island"}, {"title": "St. Andrews State Park", "html": "<p>Discover the ultimate outdoor paradise at St. Andrews State Park in Panama City Beach. This breathtaking spot is perfect for beach lovers and nature enthusiasts alike, with a pristine coastal landscape, calm jetty waters for swimming and snorkeling, fishing piers, trails, and diverse wildlife. It is also the jumping-off point for the Shell Island ferry.<\/p>\n<p><strong>Address:<\/strong> 4607 State Park Ln, Panama City, FL 32408<\/p>\n<p><strong>Hours:<\/strong> 8 AM to sundown, 365 days a year. Entrance is $8 per vehicle.<\/p>\n<p><a href=\"https://www.floridastateparks.org/parks-and-trails/st-andrews-state-park\">Florida State Parks - St. Andrews<\/a><br/>(850) 708-6100<\/p>", "photo": "12e07f50bb810ed0a034aabbe07a1106.jpg", "loc": [30.1329607, -85.7316591], "pin": "parks_and_nature", "id": "st-andrews-state-park"}]}]}, "pier-park": {"id": "pier-park", "title": "Pier Park", "icon": "star", "groups": [{"title": "", "items": [{"title": "Axe Throwing PCB", "html": "<p>Unless you hate fun, you will love Axe Throwing PCB!<\/p>\n<p>No need to miss out when the weather is bad. With indoor lanes, you can throw an axe rain or shine. It is a perfect activity for pairs or groups of any skill level, and beginners are guided by helpful staff who will teach you how to aim for that bullseye. Feeling extra adventurous? Try the rage room or a combo with an escape room.<\/p>\n<p>Two locations: Pier Park and the Shoppes at Edgewater (525 Richard Jackson Blvd).<\/p>\n<p><a href=\"https://axethrowingpcb.com/\">axethrowingpcb.com<\/a><br/>(850) 249-2805<\/p>", "photo": "c4671f5bfaa6c8d57b4c39f3664d98f3.jpg", "loc": [30.18732370000001, -85.8170833], "pin": "entertainment_and_activities", "id": "axe-throwing-pcb"}, {"title": "Dave & Buster's", "html": "<p>Dave &amp; Buster&#39;s is the place to eat, drink, play, and watch sports all under one roof! Great for kids and kids at heart: spend the day playing games, watching sports, enjoying great food, and making memories.<\/p>\n<p><strong>Address:<\/strong> 15701 LC Hilton Jr Dr (Pier Park), Panama City Beach, FL 32413<\/p>\n<p><a href=\"https://www.daveandbusters.com/us/en/about/locations/panama-city-beach\">daveandbusters.com<\/a><br/>(850) 238-3501<\/p>", "photo": "89b24c4e410a8bd93e5c1eab189eab5c.jpg", "loc": [30.2177835, -85.8735301], "pin": "entertainment_and_activities", "id": "dave-busters"}, {"title": "Royal Escape Rooms", "html": "<p>Immerse yourself in a thrilling escape room story and take on the challenge of discovering clues and unlocking puzzles to try to escape. The fate of your team is in your hands! A fun outing for family and friends.<\/p>\n<p>Locations at the Shoppes at Edgewater (477 Richard Jackson Blvd) and Pier Park.<\/p>\n<p><a href=\"https://www.royalescaperooms.com/\">royalescaperooms.com<\/a><br/>(850) 249-2805<\/p>", "photo": "8e357f75d2a47ee6319ce463d8e25ed0.jpg", "loc": [30.18650169999999, -85.81633509999999], "pin": "entertainment_and_activities", "id": "royal-escape-rooms"}, {"title": "SkyWheel", "html": "<p>SkyWheel Panama City Beach at Pier Park features an observation wheel that stands nearly 200 feet tall plus an 18-hole mini golf course. Enjoy sweeping views of the Gulf and the beach, day or night, for a unique experience for all ages.<\/p>\n<p><strong>Address:<\/strong> 15700 LC Hilton Jr Dr, Panama City Beach, FL 32413<\/p>\n<p>Hours change by season (fall hours are about 11 AM to 10 PM); check their website before you go.<\/p>\n<p><a href=\"https://skywheelpcb.com/\">skywheelpcb.com<\/a><br/>(850) 888-0020<\/p>", "photo": "62d55271294e2eb3bab64d9809af684f.jpg", "loc": [30.2181866, -85.8727507], "pin": "sightseeing", "id": "skywheel"}]}]}, "random-recommendations": {"id": "random-recommendations", "title": "Things To Do", "icon": "map-pin", "groups": [{"title": "Family Fun Time", "items": [{"title": "Coconut Creek Family Fun Park", "html": "<p>Fun and adventure for the whole family! Play Coconut Creek&#39;s two tropical 18-hole mini golf courses and the sea-themed Washed Ashore course, then get lost in the Gran Maze, a giant human maze.<\/p>\n<p><strong>Address:<\/strong> 9807 Front Beach Rd, Panama City Beach, FL<\/p>\n<p><strong>Hours:<\/strong> Generally 10 AM to 10:30 PM Sunday through Thursday and until 11 PM Friday and Saturday; check their website for current hours.<\/p>\n<p><a href=\"https://coconutcreekfun.com/\">coconutcreekfun.com<\/a><br/>(850) 234-2625<\/p>", "photo": "8aa2813a49d5f39e6bfa5ec0a0a97257.jpg", "loc": [30.1779986, -85.7982947], "pin": "theme_park", "id": "coconut-creek-family-fun-park"}, {"title": "Rock'it Lanes", "html": "<p>Wholesome family fun for everyone!<\/p>\n<p>A family fun center with everything you need for a fun day or night out: bowling, roller skating, a mega arcade, a sports bar, and a grill for a bite to eat. Watch for weekly specials like discounted bowling nights and half-price arcade days.<\/p>\n<p><strong>Address:<\/strong> 513 Richard Jackson Blvd, Panama City Beach, FL 32407<\/p>\n<p><a href=\"https://rockitlanes.com/\">rockitlanes.com<\/a><br/>(850) 249-2695<\/p>", "photo": "56616fa3e9710d10726830221df16c17.jpg", "loc": [30.185716, -85.8163003], "pin": "entertainment_and_activities", "id": "rockit-lanes"}, {"title": "Slingshot & Vomatron", "html": "<p>A mini thrill park on Thomas Drive with the SlingShot, the Vomatron, and go-karts!<\/p>\n<p>On the SlingShot, get catapulted up to 300 feet into the air before free-falling back toward the ground. There is no age limit, just a minimum height of 50 inches, so you and your little adrenaline junkie can ride together.<\/p>\n<p>The Vomatron is a 200-foot giant propeller that spins riders forward and backward, similar to the trainers NASA used for astronauts. The same 50-inch height minimum applies.<\/p>\n<p>Want something closer to the ground but still fast? Zip around the go-kart track, with 2-seat karts for little ones riding with a parent.<\/p>\n<p>Hours vary by season; check their website before you go.<\/p>\n<p><a href=\"https://slingshotpcb.com/\">slingshotpcb.com<\/a><br/>(850) 234-1121<\/p>", "photo": "ab1d1d166be373fd6d1776cfb8cbe24e.jpg", "loc": [30.1696317, -85.79179839999999], "pin": "entertainment_and_activities", "id": "slingshot-vomatron"}]}, {"title": "For The Adults!", "items": [{"title": "Crushed Glass Art Studio", "html": "<p>Try something new while you are in town! Join a glass art or resin art class with friends or loved ones and bring home a one-of-a-kind souvenir. You will be guided through the entire process, so all skill levels are welcome. Create resin charcuterie boards or crushed glass canvases while making beautiful memories.<\/p>\n<p><strong>Address:<\/strong> 10310 Hutchison Blvd, Suite 100, Panama City Beach, FL 32407<\/p>\n<p>Classes are by booking. Kids 6 and up can join some classes; resin classes are 14 and up.<\/p>\n<p><a href=\"https://www.crushedpcb.com/\">crushedpcb.com<\/a><br/>(850) 238-2526<\/p>", "photo": "fd23fabac45af99a60983fa13ddf1a39.jpg", "loc": [30.182302, -85.80407819999999], "pin": "arts_and_culture", "id": "crushed-glass-art-studio"}]}, {"title": "For The Kids!", "items": [{"title": "Ripley's Believe It or Not!", "html": "<p>Ripley&#39;s Believe It or Not! is one of the Gulf Coast&#39;s favorite indoor attractions, housed in a building shaped like a shipwrecked ocean liner. Explore hundreds of unbelievable-but-true artifacts and exhibits, including Titanic artifacts and celebrity portraits made in the most unusual ways. Add on the Marvelous Mirror Maze or buckle up for the 7D Moving Theater, with motion seats and digital effects that make you feel like you are in the movie!<\/p>\n<p><strong>Address:<\/strong> 9907 Front Beach Rd, Panama City Beach, FL 32407<\/p>\n<p><a href=\"https://www.ripleys.com/attractions/ripleys-believe-it-or-not-panama-city-beach\">ripleys.com<\/a><br/>(850) 230-6113<\/p>", "photo": "ab875fcab421d3e28117c19537ec4f98.jpg", "loc": [30.17825819999999, -85.7993754], "pin": "museums", "id": "ripleys-believe-it-or-not"}, {"title": "Sea Dragon Pirate Cruise", "html": "<p>Enjoy an exciting, scenic 2-hour family pirate cruise with dolphin sightings, great music, and non-stop pirate activities for the kids, from sword fighting to a water gun battle. Cold beer, soda, snacks, t-shirts, and pirate souvenirs are available on board, along with clean restrooms.<\/p>\n<p><strong>Departs:<\/strong> Lighthouse Marina, 5325 N Lagoon Dr, on Grand Lagoon next to the Grand Marlin Restaurant.<\/p>\n<p>Cruises are seasonal (typically spring through fall); check their website for the current schedule.<\/p>\n<p><a href=\"https://www.piratecruise.net/\">piratecruise.net<\/a><br/>(850) 234-7400<\/p>", "photo": "66c5564e0eb0074d81a93e75d39bbe56.jpg", "loc": [30.1480297, -85.7446472], "pin": "entertainment_and_activities", "id": "sea-dragon-pirate-cruise"}, {"title": "Shipwreck Island Waterpark", "html": "<p>Plunge, ride, whirl, dunk, swim! Spend the day on the slides, ride a zipline from a shipwreck into the water, bob around in the wave pool, relax in the lazy river, and grab an ice cream or slushie in the middle of it all. With over 15 acres of fun, you are guaranteed a great full day!<\/p>\n<p><strong>Address:<\/strong> 12201 Hutchison Blvd, Panama City Beach, FL 32407<\/p>\n<p>The park is seasonal (generally late spring through summer) and closed in the off-season; check their website for the operating calendar.<\/p>\n<p><a href=\"https://www.shipwreckisland.com/\">shipwreckisland.com<\/a><br/>(850) 234-3333<\/p>", "photo": "67491412219a257c0ded04e992b01e5e.jpg", "loc": [30.1933949, -85.82657689999999], "pin": "theme_park", "id": "shipwreck-island-waterpark"}, {"title": "Swampy Jack's Wongo Adventure", "html": "<p>Go-karts, mini golf, and much more!<\/p>\n<p>Swampy Jack&#39;s Wongo Adventure is a small but heavily themed amusement park and family entertainment center inspired by Swampy Jack&#39;s world travels. Try the interactive Marrakesh Road Rally go-karts (think a video game meets electric go-karts), play mini golf that is scenic by day and neon-lit at night, then hit the rides, from bumper cars to a spin coaster and a dark ride.<\/p>\n<p><strong>Address:<\/strong> 284 Powell Adams Rd, Panama City Beach, FL 32413 (near Pier Park)<\/p>\n<p>The park is seasonal and currently closed for the season; check their website for hours.<\/p>\n<p><a href=\"https://wongoadventure.com/\">wongoadventure.com<\/a><br/>(850) 234-9973<\/p>", "photo": "4f6969173119ec7729956c6720775593.jpg", "loc": [30.215544, -85.871059], "pin": "theme_park", "id": "swampy-jacks-wongo-adventure"}, {"title": "WonderWorks", "html": "<p>WonderWorks is an indoor amusement park, recognizable by its upside-down building, that combines education and entertainment in more than 100 hands-on exhibits. Feel hurricane-force winds, lie on a bed of nails, and explore themed zones for space, weather, light and sound, and more. Then take on the glow-in-the-dark indoor ropes course three stories up, battle it out in laser tag, or try the Space Fury 360. Interactive and fun for all ages!<\/p>\n<p><strong>Address:<\/strong> 9910 Front Beach Rd, Panama City Beach, FL 32407<\/p>\n<p><a href=\"https://www.wonderworksonline.com/panama-city-beach/\">wonderworksonline.com<\/a><br/>(850) 249-7000<\/p>", "photo": "b654189999a7c2ba9ea827d0dda9fdbd.jpg", "loc": [30.1789861, -85.7996156], "pin": "theme_park", "id": "wonderworks"}, {"title": "ZooWorld Zoological Park", "html": "<p>Take a break from the beach and create lasting family memories at ZooWorld! It is home to exotic animals from all over the world. Pet a sloth, meet a kangaroo, feed a giraffe, or snuggle a lemur (animal encounters are an extra charge).<\/p>\n<p>This place is wilder than the beach at spring break!<\/p>\n<p><strong>Address:<\/strong> 9008 Front Beach Rd, Panama City Beach, FL 32407<\/p>\n<p><strong>Hours:<\/strong> 9:30 AM to 4 PM daily, rain or shine (last admission 3 PM; closed Thanksgiving and Christmas).<\/p>\n<p><a href=\"https://www.zooworldpcb.com/\">zooworldpcb.com<\/a><br/>(850) 818-3823<\/p>", "photo": "1a4fc61afd380d84e6634a1704c00a9d.jpg", "loc": [30.182227, -85.787261], "pin": "safari_park", "id": "zooworld-zoological-park"}]}]}, "shopping": {"id": "shopping", "title": "Shopping", "icon": "shopping-bag", "groups": [{"title": "", "items": [{"title": "30Avenue", "html": "<p><strong>Website:<\/strong> <a href=\"https://www.30avenue.com/\">30avenue.com<\/a><br/><strong>Phone:<\/strong> (850) 231-1127<br/><strong>Address:<\/strong> 12805 US Hwy 98 East, Inlet Beach, FL 32461<\/p>\n<p>A stylish, upscale shopping destination at the gateway to 30A, about a 25-minute drive west. Browse trendy boutiques and galleries and enjoy gourmet dining. Some favorites include Willow + Mercer for trendy clothing and accessories, and Amici for delicious Italian cuisine and wine.<\/p>", "photo": "ca665c35702651ed66f9fbb7cda438a9.jpg", "id": "30avenue"}, {"title": "Pier Park", "html": "<p><strong>Website:<\/strong> <a href=\"https://www.simon.com/mall/pier-park\">simon.com/mall/pier-park<\/a><br/><strong>Phone:<\/strong> (850) 236-9979<br/><strong>Address:<\/strong> 600 Pier Park Dr, Panama City Beach, FL 32413<\/p>\n<p>The area&#39;s premier open-air lifestyle center, with more than 120 stores including anchors Target, Dillard&#39;s, and JCPenney, plus favorites like Old Navy and American Eagle. You will also find plenty of dining, a movie theater, live entertainment, Dave &amp; Buster&#39;s, and the SkyWheel, all just across from the Russell-Fields City Pier.<\/p>", "photo": "2bce690e431a86558d0c18a021d5a0ac.jpg", "loc": [30.2197, -85.8741], "pin": "retail_therapy", "id": "pier-park"}, {"title": "Shoppes at Edgewater", "html": "<p><strong>Location:<\/strong> Richard Jackson Blvd, next to the Edgewater Beach &amp; Golf Resort, Panama City Beach, FL 32407<\/p>\n<p>A small shopping and entertainment center near the Edgewater resort, home to family favorites like Rock&#39;it Lanes, Axe Throwing PCB, and Royal Escape Rooms. Handy for resort guests who want a quick outing close by.<\/p>", "photoHidden": "8feb68ca1ea362c55f502903c2bb42dd.jpg", "id": "shoppes-at-edgewater"}]}]}, "spas-salons": {"id": "spas-salons", "title": "Spas + Salons", "icon": "sparkles", "groups": [{"title": "", "items": [{"title": "Salon Baliage & Spa", "html": "<p><strong>Website:<\/strong> <a href=\"https://salonbaliage.com/\">salonbaliage.com<\/a><\/p>\n<p><strong>Spa:<\/strong> 100 Carillon Market St, Suite 202, Panama City Beach, FL 32413 &middot; (850) 235-1985<\/p>\n<p><strong>Salon:<\/strong> 104 Carillon Market St, Suite 1 &middot; (850) 235-1980<\/p>\n<p>A combined salon and spa with more than 25 years in the area, offering haircuts, coloring, waxing, massages, body treatments, skin care, and packages. It is located in the charming Carillon Beach resort village, a quick drive west of your stay, and perfect for guests seeking convenient, comprehensive services.<\/p>\n<p>Spa hours are typically Tuesday to Friday 10 AM to 5 PM and Saturday 10 AM to 4 PM. Book ahead; cancellations require 48 hours notice for spa services.<\/p>", "photo": "1185a4a0df300e87a7fdd38b1a11288e.jpg", "loc": [30.2653485, -85.9788415], "pin": "spa_beauty", "id": "salon-baliage-spa"}, {"title": "Serenity Spa at Bluegreen Bayside Resort", "html": "<p><strong>Website:<\/strong> <a href=\"https://www.bluegreenbaysideresort.com/Experiences/serenity-spa.html\">Serenity Spa<\/a><\/p>\n<p><strong>Phone:<\/strong> (850) 236-6000<\/p>\n<p><strong>Address:<\/strong> Bluegreen&#39;s Bayside Resort &amp; Spa, 4114 Jan Cooley Dr, Panama City Beach, FL 32408 (on the bay side, about 25 minutes east)<\/p>\n<p>An award-winning, full-service spa offering massages, revitalizing facials, pedicures, and salon services in a relaxing resort setting. Amenities include a sauna, steam room, whirlpool, and a quiet relaxation lounge, available before and after your treatment; day passes can be added for all-day use. Perfect after a beach day or as part of a romantic getaway.<\/p>", "photo": "6e74210717a0f4834d7de69fb1117779.jpg", "loc": [30.1391, -85.7226], "pin": "spa_beauty", "id": "serenity-spa-at-bluegreen-bayside-resort"}]}]}, "weather": {"id": "weather", "title": "Weather", "icon": "cloud-sun-rain", "groups": [{"title": "", "items": [{"title": "Panama City Beach", "html": "<p>For the most up-to-date weather forecast check <a href=\"https://weather.com/weather/today/l/1dfdcaafe28351e58c0e4b5506d29206fc9fabaa9e8976c737247bec85bddff4\" target=\"_blank\">here<\/a>!<\/p>\n<p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say \"There is no such thing as bad weather, just inappropriate clothing\".<\/p>", "photo": "de97f9f60bbe88efa21f12f50ede943f.jpg", "id": "panama-city-beach"}]}]}}, "signinUrl": "https://script.google.com/macros/s/AKfycbyH0rEgRqprQRh7Kf4lDv1QUssPA7z4Jn7Od_cEGJWa8_TH9UwK0W4EjdJCiB6EX5DlMg/exec"}</script>
