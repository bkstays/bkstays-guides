 the beautiful waterfall.<\/p><p>Read More <a href=\"https://www.atlantatrails.com/hiking-trails/fall-branch-falls-benton-mackaye-trail/\">Here<\/a><\/p>", "photo": "5665d620b45abc279f7f6e1baff69615.jpg", "loc": [34.786649, -84.305805], "pin": "hiking", "id": "fall-branch-falls-trail"}, {"title": "Hemp Top Trail", "html": "<p><strong>(Most Difficult)<\/strong><\/p><p>Hemp Top Trail is a 11.8 mile moderately trafficked out and back trail located near Epworth, Georgia that features beautiful wild flowers and is rated as moderate. The trail offers a number of activity options and is best used from March until October.<\/p><p>Read More <a href=\"https://www.cohuttawildernesshiking.com/hemp-top-trail-ga/\">Here<\/a><\/p>", "photo": "05176ea8d148ce34cd02323bcde8a806.jpg", "loc": [34.971746, -84.519929], "pin": "hiking", "id": "hemp-top-trail"}, {"title": "Jacks River Trail", "html": "<p><strong>(Most Difficult)<\/strong><\/p><p>The Jacks River Trail stretches over 16 miles through the beautifully rugged and remote Cohutta Wilderness in North Georgia, following its namesake river through a lushly green, waterfall-filled river valley. Nine miles downstream from the Dally Gap trailhead, Jacks River tumbles from a rugged, rocky outcrop, forming the stunning waterfall at Jacks River Falls.<\/p><p>Read More <a href=\"https://www.atlantatrails.com/hiking-trails/hiking-jacks-river-falls-trail-splashing-through-the-cohutta-wilderness/\">Here<\/a><\/p>", "photo": "dbe1e72a4631dd629180d03d6a880e36.jpg", "loc": [34.988387, -84.633324], "pin": "hiking", "id": "jacks-river-trail"}, {"title": "Ocoee Whitewater Creek Trails", "html": "<p><strong>(More Difficult)<\/strong><\/p><p>In addition to whitewater sports, the center has a one-mile hiking trail which crosses a 330 foot suspension bridge and circles the center. The trail is entirely accessible for those who are physically challenged. There are an additional 30 miles of trails for hikers and mountain bikers.<\/p><p>Read More <a href=\"https://www.fs.usda.gov/visit/destination/ocoee-whitewater-center\">Here<\/a><\/p>", "photo": "4cbc6cb19d4a664058b6733154146d00.jpg", "loc": [35.067183, -84.46157], "pin": "hiking", "id": "ocoee-whitewater-creek-trails"}, {"title": "Pinhoti Trail Access – Cohutta Wilderness", "html": "<p>Website: <a href=\"https://www.fs.usda.gov/r08/chattahoochee-oconee/recreation\">https://www.fs.usda.gov/r08/chattahoochee-oconee/recreation<\/a> <\/p><p><a href=\"https://www.cohuttawildernesshiking.com/pinhoti-trail/index.html\">https://www.cohuttawildernesshiking.com/pinhoti-trail/index.html<\/a> <br>Trail Access Points Near Ellijay<br>Phone: (706) 695-6736 (US Forest Service – Cohutta Ranger District)<\/p><p>The legendary Pinhoti Trail stretches 335 miles across Georgia and Alabama, with several trailheads near Ellijay. It’s ideal for serious hikers seeking challenging backcountry treks and connections to the Appalachian Trail.<\/p>", "photo": "a806101569416792079a3e649410aea0.jpg", "id": "pinhoti-trail-access-cohutta-wilderness"}, {"title": "Toccoa River Swinging Bridge", "html": "<p><strong>(Easiest)<\/strong><\/p><p>The hike crosses the swinging bridge and explores a small waterfall on the Toccoa River’s opposite bank, set in a shady grove of fragrant hemlock, before making an optional climb to a nearby mountain summit. Spanning only .5 mile (to the Toccoa River swinging bridge and back), or 2 miles (with the mountain climb), the hike explores some exceptionally beautiful North Georgia wilderness, catches beautiful river views and adventures over the longest swinging bridge east of the Mississippi River. If you’re in the Blue Ridge / Ellijay area and looking for some family-friendly outdoor fun, this hike is pretty much a must.<\/p><p>Read More <a href=\"https://www.atlantatrails.com/hiking-trails/toccoa-river-swinging-bridge-benton-mackaye-trail/\">Here<\/a><\/p>", "photo": "c3ec77f74bda1277917dede2a671e995.jpg", "loc": [34.736836, -84.167237], "pin": "hiking", "id": "toccoa-river-swinging-bridge"}]}]}, "nature-parks": {"id": "nature-parks", "title": "Nature + Parks", "icon": "trees", "groups": [{"title": "", "items": [{"title": "Amicalola Falls State Park", "html": "<p>Website: <a href=\"https://amicalolafallslodge.com/\">https://amicalolafallslodge.com/<\/a> <br>Phone: 706‑276‑5615 (Visitor Center)<br>Location: Dawsonville, GA (~30 min from Ellijay)<\/p><p>Home to the Southeast’s tallest waterfall (729 ft), this park features multiple scenic hiking trails—including a paved walk to an overlook. The popular eco-friendly Hike Inn offers a backcountry lodge experience after a serene climb. Dramatic waterfalls and mountain views make it a show-stopper.<\/p><p>FAQs:<\/p><ul><li>Do I need a park pass? Yes, day-use fee and separate fee for lodging/trail inn.<\/li><li>How long is the main waterfall trail? 0.3 miles paved; full climb to lodge is ~8 miles.<\/li><li>Is it pet-friendly? Pets allowed on most trails but not inside buildings.<\/li><\/ul>", "photo": "c5f4e16d3f9fcc8c0964ee5915f97248.jpg", "loc": [34.576034, -84.236713], "pin": "sightseeing", "id": "amicalola-falls-state-park"}, {"title": "Cohutta Overlook", "html": "<p>Website: — (no official site)<br>Phone: — (Gilmer County Visitor Center: 706‑635‑7400)<br>Location: Near Ellijay, off GA Hwy 52, ~10 min from town <\/p><p>Description:<br>Soar above the Ridge-and-Valley region at Cohutta Overlook—a largely hidden gem with panoramic mountain vistas that stretch for miles. Easy access makes it perfect for sunrise watchers, photographers, or anyone who wants to drink in the skyline without breaking a sweat.<\/p><p>FAQs:<\/p><ul><li>Is there parking? Yes, a small roadside pull-off with room for several cars.<\/li><li>How long is the walk to the overlook? Under 5 minutes—mostly uphill.<\/li><li>Dog friendly? Yes, but leash required.<\/li><\/ul>", "photo": "52c1677dec2c148001b8819e8b9bef6e.jpg", "loc": [34.959521, -84.952723], "pin": "other", "id": "cohutta-overlook"}, {"title": "Ellijay River Park", "html": "<p>Website: <a href=\"https://guidetoblueridge.com/blog/a-guide-to-blue-ridge-ga-parks\">https://guidetoblueridge.com/blog/a-guide-to-blue-ridge-ga-parks<\/a><br>Phone: Typically via local tourism info (not listed)<br>Location: Near Blue Ridge, southwest of Ellijay<br>Guide Map <a href=\"https://www.google.com/maps/place/Ellijay+River/@34.6914744,-84.7474885,11z/data=!4m6!3m5!1s0x885f96ff1a3234c3:0x2da7b0040899fb93!8m2!3d34.6914744!4d-84.4838166!16s%2Fm%2F06zlylj!5m1!1e2?entry=ttu&amp;amp;g_ep=EgoyMDI1MDgyNS4wIKXMDSoASAFQAw%3D%3D\">Here<\/a><\/p><p>A charming riverside spot offering walking trails, picnic areas, a playground, and spots for fishing or tubing in a serene woodland setting.<\/p><p>Great For: Families, nature lovers, leisurely afternoons by the river.<\/p>", "photo": "c827498effccbf7e30d6d091581aa3f2.jpg", "id": "ellijay-river-park"}, {"title": "Fightingtown Creek Nature Park", "html": "<p>Website: <a href=\"https://stpal.org/our-places/fightingtowncreek/\">Southeastern Trust for Parks and Land<\/a><\/p><p>Phone: Found on STPAL site or Friends group<br>Location: ~3 miles west of Blue Ridge, Fannin County<\/p><p>190 acres offering 12 miles of free, multi-use natural-surface trails designed for hiking and mountain biking. Trails are thoughtfully built for flowy fun and long-term public enjoyment. <\/p><p>Great For: Mountain bikers, hikers, free outdoor recreation.<\/p>", "photo": "b8dbb791a32903a0941d9cb513a2b121.jpg", "id": "fightingtown-creek-nature-park"}, {"title": "Fort Mountain State Park", "html": "<p>Facebook: <a href=\"https://www.facebook.com/fortmountain/\">https://www.facebook.com/fortmountain/<\/a> <br>Phone: 706‑422‑1932 (Park Office)<br>Location: 181 Fort Mountain Park Rd, Chatsworth, GA (~25 min north of Ellijay) <\/p><p><br>A 3,700-acre haven with forested trails, a historic stone wall, a firetower overlook, and a small lake with a beach. Offering hiking, biking, fishing, camping, and cabins—Fort Mountain is a full-day outdoor escape steeped in history and panoramic views.<\/p><p>FAQs:<\/p><ul><li>Is there a fee to enter? Yes, $5 daily parking fee (park pass accepted).<\/li><li>Are trails dog-friendly? Yes, leashed dogs welcome.<\/li><li>Can I swim? Yes, on a seasonal sandy beach.<\/li><\/ul>", "photo": "971f9653ff76a5b0a63730fc1e2a4f3c.jpg", "id": "fort-mountain-state-park"}, {"title": "Harrison Park (Ellijay)", "html": "<p>Facebook: <a href=\"https://www.facebook.com/harrisonparkellijay/\">https://www.facebook.com/harrisonparkellijay/<\/a> <br>Phone: Use City Hall or Friends of Harrison Park contact via website<br>Location: Within Ellijay, along the Ellijay River<\/p><p>A peaceful 26-acre park with over a mile of walking trails, a historic circa-1940 barn, corn crib, wildflower meadow, benches, picnic tables, and modern restrooms—all pet-friendly.<\/p><p>Great For: Families, dog-walking, lovely strolls, community events, sunset pauses by the river.<\/p>", "photo": "d50cb983ca51df0a9d6ca00c1f4f2a96.jpg", "id": "harrison-park-ellijay"}]}, {"title": "Parks and Playgrounds", "items": [{"title": "Downtown Blue Ridge", "html": "<p><strong>Downtown Blue Ridge Playground<\/strong><\/p>", "photo": "1cd7dfabeded899aef496d4707a828ff.jpg", "loc": [34.863811, -84.325505], "pin": "parks_and_nature", "id": "downtown-blue-ridge"}]}]}, "shopping": {"id": "shopping", "title": "Shopping", "icon": "shopping-bag", "groups": [{"title": "", "items": [{"title": "Antiques on North Main", "html": "<p>Facebook: <a href=\"https://www.facebook.com/AntiquesonNorthMainEllijayGA/\">https://www.facebook.com/AntiquesonNorthMainEllijayGA/<\/a><br>Location: 44 North Main St, Ellijay, GA 30540<br>Phone: 706-698-1950<\/p><p>A treasure trove of imported English antiques, including fine porcelain, majolica, Tiffany-style stained glass, vintage tools, estate jewelry, and more. A haven for collectors and decoration enthusiasts.<\/p>", "photo": "5f13441fff6cd9d47cb36a5ef32d8b1a.jpg", "loc": [34.694998, -84.482259], "pin": "souvenirs", "id": "antiques-on-north-main"}, {"title": "Artful Ellijay", "html": "<p>Website: <a href=\"https://www.artfulellijay.com/\">https://www.artfulellijay.com/<\/a> <\/p><p>Phone: 877-244-7755<\/p><p>A refined home provisions store featuring beautifully curated décor and works by local artisans. A great stop for artful souvenirs with a meaningful connection to the region. <\/p>", "photo": "799521e2d41f8f1049606db7bc538fa4.jpg", "loc": [34.695251, -84.482494], "pin": "retail_therapy", "id": "artful-ellijay"}, {"title": "Beds Etc., Amish Furniture", "html": "<p>Website: <a href=\"https://www.bedsetc.net/\">https://www.bedsetc.net/<\/a> <\/p><p>Phone: 706-515-3300<\/p><p>This store offers rustic, handcrafted Amish furniture—high-quality, one-of-a-kind pieces made especially for mountain homes and rentals. <\/p>", "photo": "b8d982b4b9413301261a03bebab621ca.jpg", "loc": [34.695303, -84.482537], "pin": "retail_therapy", "id": "beds-etc-amish-furniture"}, {"title": "Belle’s Boutique", "html": "<p>Facebook: <a href=\"https://www.facebook.com/profile.php?id=100036165743591#\">Belle's Boutique<\/a><\/p><p>Phone: 706-276-6699<\/p><p>A women’s clothing boutique with sizes ranging from 0 to 3X, plus shoes, handbags, accessories, and home décor items—stylish and inclusive shopping in town.<\/p>", "photo": "04ad69135cd89906e0ff8aaab636b239.jpg", "loc": [34.68726, -84.484661], "pin": "retail_therapy", "id": "belles-boutique"}]}]}, "spas-salons": {"id": "spas-salons", "title": "Spas + Salons", "icon": "sparkles", "groups": [{"title": "", "items": [{"title": "Artwork Day Spa", "html": "<p><a href=\"https://dayspaellijay.com/\">https://dayspaellijay.com/<\/a><\/p><p>An organic salon and spa with an upscale-industrial yet cozy atmosphere, that provides hot stone treatments, facials, collagen treatments, and more.<\/p>", "photo": "752588cdee08641040ab3bfdb926e98a.jpg", "loc": [34.68726, -84.484661], "pin": "spa_beauty", "id": "artwork-day-spa"}, {"title": "Heaven Sent Massage", "html": "<p><a href=\"https://heavensentmassage.today/\">https://heavensentmassage.today/<\/a><\/p><p>Provides Swedish massage, therapeutic massage, cranio-sacral therapy, electrolysis, and more with an emphasis on relaxation and healing for body, mind, and spirit.<\/p>", "photo": "d379b2707bb0b61db6bb83f2167acc62.jpg", "loc": [34.679443, -84.484291], "pin": "hairdresser", "id": "heaven-sent-massage"}, {"title": "Serenity in the Mountains", "html": "<p>Discover Blue Ridge GA’s best-kept secret… Serenity in the Mountains day spa and a hair salon. Serenity is a full-service spa located in the heart of Blue Ridge, Georgia. Our clients come from around the corner and around the country. Serenity is known for its wonderful service and relaxing atmosphere. Whether you are looking for a hot stone facial, a relaxing massage, a haircut, or just a manicure… you’ve found us.<\/p><p>Check it out <a href=\"https://www.serenityinthemountains.com/\">here<\/a>.<\/p>", "photo": "2c024a34faa2a83dd0adbc7174b66935.jpg", "loc": [34.881752, -84.293025], "pin": "spa_beauty", "id": "serenity-in-the-mountains"}]}]}, "tours": {"id": "tours", "title": "Take A Tour", "icon": "train-front", "groups": [{"title": "", "items": [{"title": "Blue Ridge Mountain Food Tours", "html": "<p>If you love eating, exploring &amp; having fun, our culinary tours offer you the flavorful experience you crave! Our 3 hour guided walking tours will take you on a tasting adventure, discovering unique restaurants, food shops, and eateries while sampling delicious foods and beverages along the way. Each tour makes 4-5 stops to various eateries offering a wide variety of food that includes artful appetizers and decadent desserts. <\/p><p>Get an insider's view from a local tour guide who provides you with fun facts and tidbits of history about the quaint mountain town of Blue Ridge, Georgia. Meet fellow foodies, local merchants, and knowledgeable store owners for an afternoon of fun laughs and great stories. Go behind the scenes and mingle with culinary chefs and restaurant owners, many of whom have pioneered the revitalization of downtown Blue Ridge, Georgia.<\/p><p><a href=\"https://blueridgemountainfoodtours.com/\">https://blueridgemountainfoodtours.com/<\/a><\/p>", "photo": "618e14d80829497b6d8f00774a51f877.jpg", "loc": [34.866514, -84.323454], "pin": "entertainment_and_activities", "id": "blue-ridge-mountain-food-tours"}, {"title": "Blue Ridge Scenic Railway", "html": "<p>Starting at the historic depot in downtown Blue Ridge, Georgia, riders take a four-hour, 26-mile roundtrip journey along the Toccoa River through the North Georgia countryside. The first leg of the adventure takes riders on a one hour trip to the quaint sister towns of McCaysville, Georgia and Copperhill, Tennessee, nestled deep in the mountains on each state’s line. Passengers enjoy all the towns have to offer during a two-hour layover before taking the one-hour return trip through the scenic forest and back to the depot in Blue Ridge, Georgia.<\/p><p>Book Tickets In Advance <a href=\"https://brscenic.com/\">Here<\/a>!<\/p>", "photo": "6688a962026b51dc0cb1c6d689b05e23.jpg", "loc": [34.865533, -84.324726], "pin": "sightseeing", "id": "blue-ridge-scenic-railway"}, {"title": "Downtown Blue Ridge Historic Walking Tour", "html": "<p>The town of Blue Ridge was once considered an elite health resort because of its pure mineral waters. Tourists would ride the train to town, eat dinner at the Blue Ridge Hotel, and take a leisurely walk to the mineral springs after dinner. Today, tourists can still ride the train and take a leisurely walk along Main Street and the other quaint streets of downtown, enjoying the antique and specialty shops, galleries, restaurants and small-town atmosphere of Blue Ridge. Blue Ridge was founded in 1886 as a result of the arrival of the Marietta and North Georgia Railroad. Because of the railroad, Blue Ridge developed as a center of business and in 1895 the county seat was moved from Morganton to Blue<br>Ridge. In the early years, at different times, there were five hotels and several boarding houses in downtown Blue Ridge. Download the walking tour map <a href=\"http://s3.amazonaws.com/blueridge-2018/documents/13HistoricBlueRidgeWalking-2021web.pdf\">here<\/a>.<\/p>", "photo": "897d4822c8c2e324dc4190068999a745.jpg", "loc": [34.867004, -84.324938], "pin": "museums", "id": "downtown-blue-ridge-historic-walking-tour"}, {"title": "Ellijay Excursions", "html": "<p><a href=\"https://ellijayexcursions.com/\">https://ellijayexcursions.com/<\/a><\/p><p>They invite you to indulge in the picturesque charm and exquisite flavors of North Georgia’s wine country. Nestled among the rolling hills and vineyard-laden landscapes of Ellijay, our wine tours offer a delightful blend of relaxation, adventure, and culinary delight. Whether you’re a wine enthusiast or simply seeking a memorable getaway, our expertly curated tours promise an immersive experience like no other. Join us as we uncork the region’s finest wines, explore award-winning wineries, and create unforgettable moments in the heart of Georgia’s wine country. Embark on a journey with Ellijay Excursions and discover why every sip tells a story.<\/p>", "photo": "168477214a4ac589760c1727d0684bc8.jpg", "id": "ellijay-excursions"}, {"title": "Grape Escape Adventures - Wine Tour", "html": "<p>Located In Blue Ridge, Georgia. We Invite You To Hop Aboard Our Shuttle And Experience A Wine Adventure Like No Other. From Lush Grapevines , Breath Taking Mountains, To Historical Downtown. You Are Sure To Get The Most Out Of What North Georgia Has To  Offer. Come Join Us On North Georgia's Most Popular and #1 Rated Blue Ridge Wine Tasting Tour.<\/p><p>Take A Tour <a href=\"https://grapeescapeadventures.com/\">Here<\/a>!<\/p>", "photo": "268cdeebea74384fad4b803cbe6047bc.jpg", "loc": [34.87265, -84.32754], "pin": "vineyard", "id": "grape-escape-adventures-wine-tour"}, {"title": "Mountains & Countryside - Driving", "html": "<p>Blue Ridge is the perfect place to experience the brilliant colors of fall or to enjoy the holidays with family and friends.<\/p><p><a href=\"http://s3.amazonaws.com/blueridge-2018/documents/1DrivingMtnCountry-2021web.pdf\">Download a Self-Guided Scenic Driving Tour Here<\/a><\/p><p>Starting Point - Aska Road - (Pin)<\/p>", "photo": "4db463ffd968f31df692d51ed18a6a26.jpg", "loc": [34.871939, -84.307772], "pin": "sightseeing", "id": "mountains-countryside-driving"}, {"title": "North Georgia Wine Tours", "html": "<p><a href=\"https://www.northgawinetours.com/\">https://www.northgawinetours.com/<\/a><\/p><p>Experience the ease of our wine tours! Simply let us know your preferred pick-up and drop-off location, and we'll take care of the rest. We will build a day out of visiting 3 wineries, handling all of the reservations for you. Let us take the stress of planning/driving off your shoulders! <\/p>", "photo": "bc482e476882a0652d85469edbf86015.jpg", "id": "north-georgia-wine-tours"}]}]}, "random-recommendations": {"id": "random-recommendations", "title": "Things To Do", "icon": "map-pin", "groups": [{"title": "Events and Festivals", "items": [{"title": "Annual Festivals", "html": "<p>Visit the link below to see a list of annual festivals.<\/p><p><a href=\"https://www.blueridgemountains.com/things-to-do/festivals/\">https://www.blueridgemountains.com/things-to-do/festivals/<\/a><\/p>", "photo": "8f90ec21812bf8691d955bcc83bbfe81.jpg", "id": "annual-festivals"}, {"title": "Upcoming Events", "html": "<p>Visit the link below to view some upcoming local events. <\/p><p><a href=\"https://www.blueridgemountains.com/events/\">https://www.blueridgemountains.com/events/<\/a><\/p>", "photo": "ae27c3c1ed084cfb248a3b571f66d25b.jpg", "id": "upcoming-events"}]}, {"title": "For The Adults!", "items": [{"title": "Escape Room - Blue Ridge", "html": "<p>DO YOU HAVE WHAT IT TAKES TO ESCAPE? It is 1925 and prohibition is in full swing. You and your team of investigators are leading the crackdown on illegal liquor sales. The evidence you need to identify the kingpin of this criminal organization is contained within the infamous Lucky Duck Speakeasy. A bomb has been set to destroy the building and its secrets. You have 60 minutes.<\/p><p><a href=\"https://www.escaperoomblueridge.com/\">https://www.escaperoomblueridge.com/<\/a><\/p>", "photo": "aab7ff1a721f094b8781b8f0e95dfacb.jpg", "loc": [34.86736, -84.324663], "pin": "entertainment_and_activities", "id": "escape-room-blue-ridge"}, {"title": "Horseback Riding", "html": "<p>Every mountain vacation should include horseback riding. Fannin County is blessed with riding stables, experienced guides, and beautiful terrain, whether rolling hills or mountain trails. Our riding stables offer rides tailored for every age. They offer carriage rides, hayrides, moonlight rides, overnight rides with camping, wilderness rides...there's something for everyone, even the most inexperienced rider.<\/p><p>Check Out:<\/p><p>CowGirl Up Stables: <a href=\"https://www.cowgirlupstables.com/\">https://www.cowgirlupstables.com/<\/a> <\/p><p>Blue Ridge Mountain Trail Rides: <a href=\"https://www.blueridgemountaintrailrides.com/\">https://www.blueridgemountaintrailrides.com/<\/a>  <\/p>", "photo": "d9a0476f16782d0f0e73836cd644b9c8.jpg", "loc": [34.888305, -84.421047], "pin": "horse_riding", "id": "horseback-riding"}, {"title": "Tank Town USA", "html": "<p>At Tank Town USA, you can drive tanks, crush cars, operate an excavator and more. Great activity for corporate excursions, special birthdays, guys and girls’ getaways.<\/p><p>Drive Tanks &amp; Crush Cars! We have plenty of bumps, dips and humps (and if it's rained recently...mud!) to keep it fun the whole way through! Plus, you can take along 3 passengers for the Tank ride at no extra charge. Want even more adventure? Why just drive a tank when you can crush a car with one? Get your heart pumping with 25+ minutes of driving excitement which starts with our exciting tank driving course and finishes with smashing a car. Nothing is more thrilling than hearing the hood crumple and the glass shatter as you flatten a car with 17 tons of military steel. Don't just stop with one pass though. We will make sure you hit the car from every angle to ensure that nothing is left untouched. A once in a lifetime experience!<\/p><p>Check it out <a href=\"https://tanktownusa.com/\">Here<\/a>!<\/p>", "photo": "a2bd3a295c66741e727425423dfb5624.jpg", "loc": [34.88838, -84.221459], "pin": "entertainment_and_activities", "id": "tank-town-usa"}, {"title": "Zipline Canopy Tours of Blue Ridge", "html": "<p>Zipline Canopy Tours of Blue Ridge is set on 165 acres of beautiful North Georgia mountain property. We are located at 891 Old Cashes Valley Road, only 6 miles from downtown Blue Ridge. We offer a one-hour tour with seven multiple zip lines ranging from 150 to 550 feet in length for a total of half a mile of cable. We also offer a two-hour zipline tour that features one mile of cable with 13 multiple ziplines, ranging from 150 to 1,000-feet in length and ranging from 25 - 75 feet in height. All our zipline tours are guided and require no experience.<\/p><p><a href=\"https://www.zipblueridge.com/\">https://www.zipblueridge.com/<\/a> <\/p>", "photo": "c8d78b7bb7e8de58e1f132e07e699c95.jpg", "loc": [34.855611, -84.400513], "pin": "adventure_activities", "id": "zipline-canopy-tours-of-blue-ridge"}]}, {"title": "For The Kids!", "items": [{"title": "Expedition Bigfoot: The Sasquatch Museum", "html": "<p>We at Expedition Bigfoot believe in the existence of Bigfoot/Sasquatch either from personal experience and encounters or from witness testimony and evidence. Our museum provides a lot of that evidence, and leaves the question of Bigfoot's existence up to you. So whether you’re a skeptic, believer or “knower”, all are welcome.<\/p><p>Check It Out <a href=\"https://www.expeditionbigfoot.com/\">Here<\/a>!<\/p>", "photo": "179db0ca7caebd3711fba506969420ed.jpg", "loc": [34.802257, -84.376186], "pin": "museums", "id": "expedition-bigfoot-the-sasquatch-museum"}, {"title": "Lily Pad Village", "html": "<p>Lilly Pad Village offers safe and fun entertainment for all ages in their natural scenic setting. Enjoy fishing on the stocked 1/3 acre pond; Go gem mining in a serene mountain setting; and play a round of mini-golf on one of the countries few mountain mini-golf courses. Take a break and visit the shop where you can enjoy a novelty ice cream or a refreshing hot or cold drink.<\/p><p>Check Out <a href=\"https://www.lillypadvillage.com/\">https://www.lillypadvillage.com/ <\/a><\/p>", "photo": "b64f4204538b760d75326cbf33840b96.jpg", "loc": [34.790655, -84.270916], "pin": "entertainment_and_activities", "id": "lily-pad-village"}]}]}, "water-activities": {"id": "water-activities", "title": "Water Activities", "icon": "sailboat", "groups": [{"title": "Beaches", "items": [{"title": "Harris Branch Beach and Campground", "html": "<p>1300 Harris Branch Rd, Ellijay, GA 30540<\/p><p>Located on Carters Lake, this public beach is open daily from May to mid-September. It's an excellent spot for swimming, picnicking, and relaxation<\/p>", "photo": "2e9dbf58ab804b6986beb7bb56754690.jpg", "loc": [34.59717, -84.621399], "pin": "beaches", "id": "harris-branch-beach-and-campground"}, {"title": "Morganton Point Recreation Area", "html": "<p>Morganton Point Recreation Area sits on the shores of Lake Blue Ridge. The day-use area offers secluded swimming, hiking trails, picnicking, boating, and fishing. <\/p><p><a href=\"https://gofindoutdoors.org/morganton-point/\">https://gofindoutdoors.org/morganton-point/<\/a> <\/p>", "photo": "f6734813453f6a53201daa079bf0d3b7.jpg", "loc": [34.868485, -84.249033], "pin": "swimming", "id": "morganton-point-recreation-area"}]}, {"title": "Boat Rentals", "items": [{"title": "Lake Blue Ridge Marina", "html": "<p>Full-service marina with restaurant, full bar, and general store. You can rent pontoon boats, kayaks, canoes, stand-up paddleboards, and paddleboats. Boat ramp available to launch your own. Fishing guide services are available.<\/p><p>Check out <a href=\"https://lakeblueridgemarina.com/\">https://lakeblueridgemarina.com/<\/a><\/p>", "photo": "527d940eb0a6c2ff226591cedcb35b5a.jpg", "loc": [34.870569, -84.279811], "pin": "watersports", "id": "lake-blue-ridge-marina"}]}, {"title": "Boat Tours", "items": [{"title": "Capt. Joe's Lake Adventures", "html": "<p>Come take the 2 hour Lake Tour on our charter boat. See the breathtaking views from the lake and the panoramic Mountain Views.  See some spectacular homes on the shores, some of which belong to rich and famous people. There is always a very good chance to see wildlife around the shoreline including deer, bear, turkey, and many different bird species. Your guide will take you to key points of interest around the lake and unveil the history and lore of the area. <em>Bring your Camera<\/em>... We might even see Bigfoot!<\/p><p>Check Out <a href=\"https://captnjoeslakeadventures.com/\">https://captnjoeslakeadventures.com/ <\/a><\/p>", "photo": "735814dc5f8e1a0897d00499b60834da.jpg", "loc": [34.870734, -84.277708], "pin": "boating", "id": "capt-joes-lake-adventures"}, {"title": "Rolling Thunder River Rafting", "html": "<p><strong>(Kid Friendly) <\/strong><\/p><p>Rolling Thunder River Company has entertained over one million guests on the most popular and scenic rivers in the country: the Ocoee River, the Nantahala River, and the Toccoa River. Join us for a whitewater rafting trip down a rushing mountain river or a gentle float trip and you’ll see why Rolling Thunder has become THE preferred rafting company for over 40 years. These river trips become magical moments in your vacation and you’ll find yourself rejuvenated and eagerly anticipating your next trip.<\/p><p>Check Out <a href=\"https://www.rollingthunderriverco.com/\">https://www.rollingthunderriverco.com/<\/a> <\/p>", "photo": "d3ee67b5b2b80a5454e56ec973fa7cf9.jpg", "loc": [34.986862, -84.362006], "pin": "watersports", "id": "rolling-thunder-river-rafting"}]}, {"title": "Kayaks / Tubes / Paddleboard Rentals", "items": [{"title": "Blue Ridge Mountain Kayaking", "html": "<p>Located on the lower Toccoa River at the base of the dam at Lake Blue Ridge. They provide full-service kayak rentals on the Toccoa River as well as Lake Blue Ridge. Shuttle Service is available if you have your equipment.<\/p><p>Check Out <a href=\"https://blueridgemountainkayaking.com/\">https://blueridgemountainkayaking.com/<\/a><\/p>", "photo": "84a9cbabeef0bf9ca0f412bc5a1cec79.jpg", "loc": [34.888554, -84.285812], "pin": "watersports", "id": "blue-ridge-mountain-kayaking"}, {"title": "Cartecay River Experience", "html": "<p>https://www.cartecayriverexperience.com/<\/p><p>706 - 531 - 4746<\/p><p>For a more relaxed water adventure, Cartecay River Experience in Ellijay offers tube and kayak rentals for floating down the Cartecay River. They provide shuttle services and have options for both one and three-mile routes<\/p>", "photo": "64e8b655dc664a135f07781ed3a12bea.jpg", "loc": [34.68874, -84.467205], "pin": "boating", "id": "cartecay-river-experience"}]}]}, "waterfalls": {"id": "waterfalls", "title": "Waterfalls", "icon": "droplets", "groups": [{"title": "", "items": [{"title": "Amicalola Falls", "html": "<p>It’s one of our state’s most popular hikes – and for an excellent reason. It’s filled with scenic beauty, and a great workout, too. Follow a loop to the top of our state’s tallest cascade at Amicalola Falls State Park near Dawsonville, and catch beautiful views of the distant, rolling peaks of the Blue Ridge Mountains. From the crest of the falls, the adventure descends along a series of stairs and platforms, catching an up-close view of Amicalola and the tumbling mist from the falls.<\/p>", "photo": "858a4236fb378daeabda14660440e85f.jpg", "loc": [34.567131, -84.244541], "pin": "hiking", "id": "amicalola-falls"}, {"title": "Emery Creek Falls", "html": "<p>Nestled in northwest Georgia, this trail follows lushly forested creek banks to a pair of stunning, beautiful, remote waterfalls. The trail is a refreshing, water-filled adventure, and especially fun in Georgia’s sweltering summer months: along its scenic length, the trail splashes through 20 creek crossings to the tumbling cascades of Emery Creek Falls.<\/p>", "photo": "66ecfc2876d40ae65d2b8c98e3851777.jpg", "loc": [34.834201, -84.630153], "pin": "hiking", "id": "emery-creek-falls"}, {"title": "Fall Branch Falls", "html": "<p>This short, beginner-friendly adventure on the Benton MacKaye Trail explores a scenic, lush forest and visits one of Georgia’s most beautiful waterfalls. While the hike to Fall Branch Falls is nearly all uphill, and mildly challenging, it’s well worth the effort: the waterfall’s double cascades are simply beautiful, framed in gnarly-branched rhododendron and mossy, blocky rocks. It’s one of the top easy hikes near Blue Ridge, thanks to its relatively short distance and wonderfully scenic beauty. Mossy forest, a clear mountain trout stream, and abundant sweet-smelling Georgia forest air are all highlights on this great hike, not to mention the beautiful waterfall.<\/p>", "photo": "eb15a337c76141bbf74b269c47381aaf.jpg", "loc": [34.786649, -84.305805], "pin": "hiking", "id": "fall-branch-falls"}, {"title": "Jack River Falls", "html": "<p>Enormous, thundering, and rugged, Jacks River Falls is exceptionally beautiful, and it’s easily one of the South’s most beautiful waterfalls. It’s also one of Georgia’s top hiking destinations, nestled in the wild, remote Cohutta Wilderness, where the Jacks River tumbles nearly crystal-clear over a rocky, grassy riverbed shaded by towering hardwoods and lined with green, lush river banks. Jacks River Falls is one of Georgia’s most remote waterfalls, crashing and tumbling over an enormous, rough-hewn rock outcrop into deep pools of water below.<\/p>", "photo": "1e1e9b4a153fb91f0fc7680e59941bb2.jpg", "loc": [34.971911, -84.572442], "pin": "hiking", "id": "jack-river-falls"}, {"title": "Long Creek Falls", "html": "<p>Follow a short stretch of the Appalachian Trail in Georgia from the lush creek valley at Three Forks in Fannin County, climbing to a series of tumbling cascades on Long Creek. This hike ends at the base of a fifty-foot cascade shaded by fragrant, towering hemlock trees. Scattered boulders offer the perfect spot to relax mid-hike below the falls.<\/p>", "photo": "de8679e3eb6baf233c4ca58292782233.jpg", "loc": [34.66766, -84.170855], "pin": "hiking", "id": "long-creek-falls"}, {"title": "Noontootla Falls", "html": "<p>Noontootla Creek is a 2.5 mile lightly trafficked out and back trail located near Cherry Log, Georgia that features a river and is good for all skill levels. The trail is primarily used for hiking, walking, and fishing and is accessible year-round. Dogs are also able to use this trail but must be kept on a leash. <\/p>", "photo": "7bc83ea728168147241c4f04873ca5c9.jpg", "loc": [34.685921, -84.193804], "pin": "hiking", "id": "noontootla-falls"}]}]}, "weather": {"id": "weather", "title": "Weather", "icon": "cloud-sun-rain", "groups": [{"title": "", "items": [{"title": "Blue Ridge", "html": "<p>For the most up-to-date weather forecast check <a href=\"https://weather.com/weather/today/l/Blue+Ridge+GA?canonicalCityId=9ee53e8164b6a6aa133496ea64d29e0b7474aeaba2ff6f973ed497a685cec5b7\">here<\/a>!<\/p><p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say \"there is no such thing as bad weather, just inappropriate clothing\".<\/p>", "photo": "de97f9f60bbe88efa21f12f50ede943f.jpg", "id": "blue-ridge"}]}]}}, "signinUrl": "https://script.google.com/macros/s/AKfycbyH0rEgRqprQRh7Kf4lDv1QUssPA7z4Jn7Od_cEGJWa8_TH9UwK0W4EjdJCiB6EX5DlMg/exec"}</script>
