<script type="application/json" id="guide-data">{"slug": "birdie-blue", "name": "Birdie Blue", "shortName": "Birdie Blue", "welcome": "Welcome!", "hostedBy": "Hosted By Brandon & Katharina", "address": "77 Watson Rd, Epworth, GA 30541", "location": [34.894564, -84.477254], "cover": "birdie-blue-view.jpg", "coverDesktop": "birdie-blue-view.jpg", "background": "birdie-blue-view.jpg", "contact": {"phone": "404-358-1552", "sms": "404-358-1552", "email": ""}, "gate": true, "oldLinks": ["/guest/byOsTtxW1Dg4m/"], "layout": [{"heading": "Your Stay", "sections": ["add-to-phone", "welcome", "check-in-arrival", "check-out-departure", "rules", "cancellation-policy", "about-us", "contact-us"]}, {"heading": "The Home", "sections": ["bbq-grill", "outdoor-games-fun", "fireplace-firepit", "hot-tub", "indoor-games-fun", "kitchen", "laundry", "thermostat", "trash", "tv-streaming", "wifi"]}, {"heading": "Explore the Area", "sections": ["beer-wine", "dining", "emergency", "fishing", "golf", "grocery", "hiking-biking", "nature-parks", "shopping", "spas-salons", "tours", "random-recommendations", "water-activities", "waterfalls", "weather"]}], "sections": {"add-to-phone": {"id": "add-to-phone", "title": "Add This Guide To Your Phone", "icon": "smartphone", "groups": [{"title": "", "items": [{"title": "Add This Guide To Your Phone", "html": "<p>When you first access this guidebook on your phone, you'll notice a prompt to add it to your home screen. <strong>This is highly recommended<\/strong> because it makes the guide faster and easier to access. And it remains accessible offline. <\/p><p>Following the prompt will add an app icon to your phone. It's just like any other app, but without you needing to download anything or sign in! <\/p><p>Doing this means that every time you want to access the guide, you just need to tap the app instead of searching for the link in your inbox - much easier! <\/p><h2><strong>Adding the app if you’re an Apple user<\/strong><\/h2><p>If you have an Apple device, the \"Add to Home Screen\" option won’t appear for you unless you’re using Safari browser. Don’t worry, this is really simple to solve - just copy the guidebook link and paste it into Safari. From there, you can follow the prompts to add the guidebook to your home screen.<\/p><h2><strong>Always get the latest version of the guidebook <\/strong><\/h2><p>Our guidebook is regularly updated with information designed to help you get the most out of your stay. To avoid missing out on any of these updates, the app automatically updates every 24 hours. If you want to get the updates sooner, just refresh the screen every time you open the guidebook from your home screen - this way you’ll always get the latest version. To refresh the app, swipe the app closed, and tap the app icon again to fully reload. <\/p><h2><strong>Share your guide with your group<\/strong><\/h2><p>You can send the link to this guidebook to everyone who’s travelling with you. That way, everyone has access to all the information they’ll need (which means less hassle for the trip organizer!). <\/p>", "photoHidden": "eb62c72e322ed4e278d8a01199f7aad2.jpg", "id": "add-this-guide-to-your-phone"}]}]}, "welcome": {"id": "welcome", "title": "Welcome", "icon": "cloud-sun", "groups": [{"title": "", "items": [{"title": "Welcome to Birdie Blue!", "html": "<p><strong>Welcome to Birdie Blue Cabin!<\/strong><br>Here at your fingertips is everything you should need for your stay with us, from planning your time before departure straight through checkout. In this easy-to-navigate link, you will find information about the cabin, ideas of things to do in the area, our Wi-Fi login credentials, and so much more.<\/p><p>In order to best enjoy your time in our home, we encourage you to add this \"app\" to your phone. All of the content will even be accessible when your phone is offline.<\/p><p>* It's not really an \"app\", but more a tool for easy access on your home screen <\/p><ul><li>For iPhone:<ul><li>Tap the square with arrow pointing up at the bottom of your screen<\/li><li>Select \"Add to Home Screen\"<\/li><\/ul><\/li><li>For Android:<ul><li>Tap \"Add to Home Screen\" where prompted when first accessing the site<\/li><\/ul><\/li><\/ul><p><strong>Print or Save a PDF<\/strong><br>If you would like to print certain pages ahead of traveling, or if you'd like to save a PDF to your device, just tap the print button above. It won't print right away, but will create a PDF which you can save or print.<\/p><p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.  We can be reached as follows:<\/p><ul><li>Preferred: Airbnb or VRBO message<\/li><li>Phone: 404-358-1552 (emergencies)<\/li><li>Instagram: @<a href=\"https://www.instagram.com/bk_stays/\">Bk_stays<\/a><\/li><li>Facebook: <a href=\"https://www.facebook.com/profile.php?id=61551815370553\">BK Stays<\/a><\/li><\/ul><p><strong>What Next?<\/strong><br>Please relax, unwind, have fun, and enjoy your stay!<\/p>", "photo": "73f605e0a205df95f92fbfda083f6a16.jpg", "id": "welcome-to-birdie-blue"}]}]}, "check-in-arrival": {"id": "check-in-arrival", "title": "Check In + Arrival", "icon": "key-round", "groups": [{"title": "", "items": [{"title": "Driving Directions", "html": "<p>Use Waze and/or Google Maps. <\/p><p>Use: <strong>77 Watson Road, Epworth, GA 30541<\/strong><\/p><p>Technically the home address is 107 Peppermint Lane, BUT, that address will not show up. <\/p><p>For the final stretch, you'll be heading west on HWY 2.<\/p><p>Look for <strong>Hipps Chapel Church<\/strong>! <\/p><p>We're right across the gravel road from Hipps Chapel Church. <\/p><p>Turn <strong>RIGHT<\/strong>/<strong>NORTH <\/strong>onto Watson Rd, and then turn immediately <strong>LEFT/WEST<\/strong>. <\/p><p><strong>Birdie Blue<\/strong> is the first house on the <strong>LEFT<\/strong>!<\/p>", "photo": "086591e685171217b89de3694e2b3326.jpg", "id": "driving-directions"}, {"title": "Access Codes / Instructions", "html": "<p>The Access Code for the front door is<\/p><p>1552<\/p><p>To lock the door, simply press the lock button. Please make sure all external doors are locked whenever you leave.<\/p><p>* If for some reason the code doesn't work please call me at <a href=\"tel:404-358-1552\">404-358-1552<\/a>. I will get you the lockbox code for the spare key!<\/p>", "photo": "730742e2babb8d2cedbe0a30eac61d46.jpg", "id": "access-codes-instructions"}, {"title": "4:00 PM Check-in", "html": "<p>If you would like an early check-in, please see our <a href=\"#/info/check-in-arrival/early-check-in-half-day-stay-option\">Early Check In (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 4:00 PM is a strict check-in time. If you are arriving early, take a look at the Local Recommendation section. We've listed a few things to do around the area while we prepare the home!<\/p>", "photo": "11e339c716ed8af07a28c05e286c2caa.jpg", "id": "4-00-pm-check-in"}, {"title": "Early Check In (Half Day Stay Option)", "html": "<p>Want to get here early? Add a <strong>Half Day Stay<\/strong> and you can arrive as early as <strong>8:00 AM<\/strong> on your arrival day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer early check-in because of our tight cleaning and maintenance schedule.<\/p>", "photo": "6db9b8952aaf5792e4af093537545794.jpg", "id": "early-check-in-half-day-stay-option"}]}]}, "check-out-departure": {"id": "check-out-departure", "title": "Check Out + Departure", "icon": "hand", "groups": [{"title": "", "items": [{"title": "10:00 AM Check-out", "html": "<p>If you would like a late check-out, please see our <a href=\"#/info/check-out-departure/late-check-out-half-day-stay-option\">Late Check Out (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 10:00 AM is a strict check-out time. <\/p>", "photoHidden": "ea9c00f35f36edb8d89dcc92e7f562cc.jpg", "id": "10-00-am-check-out"}, {"title": "Late Check Out (Half Day Stay Option)", "html": "<p>Not ready to leave? Add a <strong>Half Day Stay<\/strong> and you won't need to check out until <strong>8:00 PM<\/strong> on your departure day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer late check-out because of our tight cleaning and maintenance schedule.<\/p>", "photoHidden": "6db9b8952aaf5792e4af093537545794.jpg", "id": "late-check-out-half-day-stay-option"}, {"title": "Extended Stay?", "html": "<p>Would you like to add another night? If we have availability the day before or after your reservation, we would love to offer you that extra night at a great discount. We'll even cover the taxes and fees! Just let us know if your travel plans are flexible and we will make sure to accommodate the changes!<\/p>", "photoHidden": "585cb6b5ac72b31289b8dae13c068a03.jpg", "id": "extended-stay"}, {"title": "Check-out Process", "html": "<p>Standard check-out is at 10:00 AM on your departure date (Unless you've paid for a late check-out).<\/p><p>When you've concluded your stay, technically, you can just leave no questions asked lol :) But, if you really wanted to give our cleaning team some love - we would appreciate it if you would take care of a few simple things:<\/p><ul><li>Dishwasher - load and start the dishwasher<\/li><li>Trash - No Loose Trash Please - remove the trash, place it in the black can(s)<\/li><li>Towels - place used towels in the shower<\/li><li>Lock-Up - ensure both doors are locked<\/li><\/ul><p>We hope you had a wonderful stay and wish you safe travels back home!<\/p>", "id": "check-out-process"}, {"title": "Lost and Found", "html": "<p>Please triple-check the home before departing to ensure you have not left anything behind. Common items left behind include phone chargers, computer cords, passports/licenses, clothes, electronics, eyeglasses, toiletries/makeup, documents, and toys.<\/p><p>Please send a message the moment you realize you've left something behind. <br><br>We completely understand that things can get left behind — and we’re more than happy to help get your items back to you! We’ll gladly ship your lost item using the postal service or carrier of your choice (standard, express, or overnight). <br><br>We kindly ask for the shipping cost, plus a $20 service fee to cover the time and materials for packaging and handling. Be certain to include:<\/p><ul><li>Item description<\/li><li>Where you think you may have left the item<\/li><li>The name on the reservation<\/li><\/ul><p>Just let us know how you’d like it sent, and we’ll take care of the rest!<\/p>", "photoHidden": "8da278ec14e085d81ebe06c22b24af10.jpg", "id": "lost-and-found"}]}]}, "rules": {"id": "rules", "title": "Rules and Regulations", "icon": "book-open", "groups": [{"title": "", "items": [{"title": "Age Requirement", "html": "<p>The minimum age requirement to book is 25 years of age. The home is child friendly, but not childproof, and may not be suitable for infants or children without adult supervision.<\/p>", "id": "age-requirement"}, {"title": "Confetti / Glitter", "html": "<p><strong>No Confetti or Glitter<\/strong><br>We understand that special occasions call for celebration - and sometimes decorations! However, confetti and glitter are extremely difficult to clean and can cause damage to furniture and floors. Any evidence of confetti or glitter left behind will incur additional cleaning fees. Please celebrate responsibly and help us keep the home in great condition - no confetti or glitter, please.<\/p>", "id": "confetti-glitter"}, {"title": "Damages", "html": "<p>Guests are financially responsible for any damage, theft, missing items, or violations of house rules during their stay. You could be charged for: Property damage or theft; Unauthorized pets; Excessive cleaning or evidence of smoking; Exceeding occupancy or parking limits; Any other violations outlined in this agreement. You will be notified in writing if any damage is found. Major damage that delays the next check-in may result in additional charges for guest relocation or compensation. Please report any existing damage at check-in, and notify us right away if anything breaks or is damaged during your stay, even if it’s small. We understand accidents happen and can often replace or repair items quickly if we're informed. Guests are responsible for damage caused by misuse or negligence.<\/p>", "id": "damages"}, {"title": "Fire Safety and Prevention", "html": "<p>Guest agrees to comply with all local, county, and state fire restrictions, including any active burn bans or official fire safety regulations. Guest is responsible for helping maintain a fire-safe environment throughout their stay. This includes, but is not limited to; Ensuring that all outdoor fires (e.g., bonfires or fire pits) are fully extinguished after use, before going to bed, and before vacating the property; Never leaving open flames or burning embers unattended; Using only designated fire areas and keeping all fires small, controlled, and manageable; Ensuring fire extinguishers located in the home are accessible at all times and used in case of fire emergencies.<\/p><p>Additionally, Guest(s) acknowledges that outdoor grills must be cleaned and properly maintained after each use to prevent fire hazards. Guest agrees to: Clean the grill thoroughly after each use; Remove all grease and dispose of it safely in the trash (never on the ground or around the property); Ensure the grill is turned off, left in safe, clean, and operable condition, and covered if applicable; Keep a fire extinguisher nearby when using the grill.<\/p><p>Failure to follow fire safety guidelines may result in fines, eviction, or financial liability for any resulting damages.<\/p>", "id": "fire-safety-and-prevention"}, {"title": "Garbage Disposal", "html": "<p>Liquids Only Please! There Is Not A Garbage Disposal In This Home!<\/p><p>Please do not place any debris, cooking oils, grease, coffee, egg shells, food scraps, or anything solid down the kitchen sink drain. <\/p>", "id": "garbage-disposal"}, {"title": "Jacuzzi", "html": "<p>Never Add Any Foreign Substance To The Jacuzzi (No Bubbles or Soaps)!<\/p><p>Always Put The Cover Back On When Not In Use!<\/p><p>Do Not Raise The Temp Above 102*F<\/p><p>The jacuzzi is thoroughly inspected after each guest. Failure to adhere will cause additional maintenance and cleaning measures, or worse, damage to the unit. Fines will be imposed if evidence of foreign substance or damage is found during inspection. <\/p>", "photoHidden": "82b1c77e6b9c0fb2ae16a23183633f77.jpg", "id": "jacuzzi"}, {"title": "Occupancy - Max 8 persons (Age 2+)", "html": "<p>We try not to overcrowd our home. The maximum guest limit is 8 (persons age 2+) unless otherwise approved. Please reach out prior to arrival if you have any additional capacity requests. Any unapproved guests over capacity will be charged 100$/night per person.<\/p>", "id": "occupancy-max-8-persons-age-2"}, {"title": "Pet Policy - Max 2 Dogs (with approval)", "html": "<p>This home is pet-friendly, so you can bring your furry friend from home! <strong>MAX 2 DOGS ALLOWED<\/strong> per stay, with approval.<\/p><p>All pets must be on your reservation. Please let us know beforehand so we can take the proper cleaning measures. A <strong>$115 pet fee<\/strong> will be added to your reservation for any approved pet before arrival.<\/p><p>If you bring a pet without notifying your hosts, you will be charged <strong>double<\/strong> for any unapproved pet.<\/p>", "id": "pet-policy-max-2-dogs-with-approval"}, {"title": "Reservation Adjustments", "html": "<p>If you need to make any change in your stay, for example, regarding the number of guests, bringing a service animal or anything at all, please let us know ahead of time so we can accommodate you. However, if you do not disclose any changes, like an animal or extra guests (above max occupancy) you could be subject to a reservtion cancellation without refund. <\/p>", "id": "reservation-adjustments"}, {"title": "Security Camera", "html": "<p>Guests acknowledge and accept there are cameras located on the exterior of the property. Guests hereby acknowledge that the cameras location records video directly in front of the front entrance door and leading to the parking area, and this constitutes a public area. Guests understand that video may be captured, and no conversations located within this area may be deemed confidential. The intent of this camera is not to infringe on the privacy of Guests, but to serve as a safety and security measure.<\/p>", "id": "security-camera"}, {"title": "Septic and Plumbing", "html": "<p>Please ONLY PUT TOILET PAPER in the toilet and throw the remaining in the trash!<\/p><p>Tampons, baby wipes, paper towels, or anything other than toilet paper in the toilet will clog the drain/tank. This can result in clogged toilets, and septic damage and will result in damage fees.<\/p>", "id": "septic-and-plumbing"}, {"title": "Smoking", "html": "<p>We have a strict No Smoking Policy. Smoking is not allowed on the property in any form. This includes, but is not limited to marijuana, pipes, cigars, cigarettes, vaping, e-cigs, etc. If our cleaners or cameras report evidence of smoking you will be charged a 500$ smoke remediation fine. <\/p>", "id": "smoking"}, {"title": "Trash", "html": "<p>Trash is collected after each guest checks out.<\/p><p>Do Not Leave Trash Out In The Open. Secure your trash in the kitchen trash bags, place them within the black trash cans, and ensure the trash receptacle is locked.<\/p><p>There have been plenty of bears visiting the mountain in the past, and unsecured trash can cause a huge problem for the cleaning team later.<\/p><p>The Trash Must Be Broken Down - In A Bag - And In The Receptacle. Do Not Leave Un-Bagged Trash Anywhere Or You Could Be Charged An Additional Cleaning Fee.<\/p>", "id": "trash"}]}]}, "cancellation-policy": {"id": "cancellation-policy", "title": "Cancellation Policy", "icon": "circle-x", "groups": [{"title": "", "items": [{"title": "Cancellation Policy", "html": "<p>Our cancellation policy varies by platform (Airbnb, VRBO, Direct, etc.) and will have been clearly stated at the time of booking under one of the following categories: strict, firm, moderate, or flexible.<\/p><p>We strongly recommend purchasing travel insurance to protect your investment. If you purchased travel insurance, please contact your provider for help with cancellations or disruptions.<\/p><p><strong>State of Emergency / Evacuations<\/strong><\/p><p>If travel insurance was not purchased, cancellations are handled per the terms of your reservation. Exceptions may be made only when <strong>both<\/strong> of the following apply:<\/p><ul><li>A <strong>Governor-issued State of Emergency<\/strong> has been declared for <strong>Fannin County, Georgia<\/strong> (the county where the home is located), <strong>and<\/strong><\/li><li>A <strong>mandatory evacuation order or travel restriction<\/strong> is actively in effect for the property's address during your reservation dates.<\/li><\/ul><p>General weather advisories or conditions affecting other areas do not qualify.<\/p><p><strong>If the Home Becomes Unavailable<\/strong><\/p><p>In the event the property becomes unavailable due to circumstances beyond the host's control, including but not limited to fire, flood, structural damage, utility failure, or a government-declared emergency, the host reserves the right to cancel a confirmed reservation. In such circumstances, guests will receive a full refund of all amounts paid and the host's liability shall be limited solely to that refund.<\/p>", "id": "cancellation-policy"}]}]}, "about-us": {"id": "about-us", "title": "About Us", "icon": "users", "groups": [{"title": "", "items": [{"title": "About Your Hosts", "html": "<p>Our first trip to North Georgia was way back in the summer of 2021 and we undeniably fell in love. The mountain vibes left such a good impression, that we decided as a family to find a home away from home. The surrounding area has so much to offer for families, friends, and couples during every season of the year. We have had the chance to experience so much that Blue Ridge, Ellijay, and the North Georgia Mountains have to offer, but we still have a long bucket list waiting for our next adventure. We have a 6-year-old daughter and a 3-year-old son and love traveling and spending time exploring new places as a family.<\/p>", "photo": "about-us-family-collage.jpg", "photoFit": "full", "id": "about-your-hosts"}]}]}, "contact-us": {"id": "contact-us", "title": "Contact Us / Book Again", "icon": "phone", "groups": [{"title": "", "items": [{"title": "Thank You For Staying With Us", "html": "<p><strong>Thank you for staying with us, and we hope you enjoyed your stay.<\/strong> If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time. <\/p><p><strong>We love online reviews!<\/strong><\/p><p>Vrbo and Airbnb automatically sends you a review request. All you need to do is click the \"leave a review\" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. Was it the comfy beds; the local information and recommendations; or perhaps the location and all the fun activities to do at the home?<\/p><p><br><strong>Thank you!<\/strong><\/p><p>Brandon and Katharina <\/p>", "photoHidden": "4d239b49ed0744691981d3decf88b377.jpg", "id": "thank-you-for-staying-with-us"}, {"title": "Returning Guests", "html": "<p>We would love to have you stay again! In fact, please take advantage of booking directly with us at <a href=\"https://www.bkstays.com/about-us\">bkstays.com <\/a>- please reach out to us on Instagram, Facebook, or directly to Brandon at 404 - 358 - 1552. <\/p>", "photoHidden": "5e53f078d45d701f01a19dcba10f0cc7.jpg", "id": "returning-guests"}, {"title": "Follow Us On Social Media", "html": "<p>Let's Be Social! Follow Us On Social Media Below<\/p><p>Facebook: BK Stays<\/p><p>Instagram: @bk_stays<\/p>", "photoHidden": "067e96592ab64bb41d8e0f51c9754500.jpg", "id": "follow-us-on-social-media"}, {"title": "How To Contact Us", "html": "<p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.  We can be reached at the contact info below:<\/p><ul><li>Message: through Airbnb / VRBO (simple assistance)<\/li><li>Phone: 1-404-358-1552 (emergencies)<\/li><li>Instagram or Facebook @ bk_stays<\/li><\/ul>", "photoHidden": "4f717eaaf0303b1fec1a0ee821f299a1.jpg", "id": "how-to-contact-us"}]}]}, "wifi": {"id": "wifi", "title": "WiFi / Internet Details", "icon": "wifi", "groups": [{"title": "", "items": [{"title": "WIFI / Internet Details", "html": "<p>There is free Wi-Fi for your use. The details are: <br><br>WIFI Name: bk stays<\/p><p>Do Not Use \"network\" - this network is only for the Smart TV's<br><br>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us.<\/p>", "photo": "5ed7c444a9811d008c50a348f27c69d5.jpg", "id": "wifi-internet-details"}]}]}, "bbq-grill": {"id": "bbq-grill", "title": "BBQ Grill + Propane", "icon": "flame", "groups": [{"title": "", "items": [{"title": "Propane Grill", "html": "<p>There is a propane grill for your personal use on the back patio. Please follow the grill instructions carefully when using propane. Do not forget to close the valve when you're done!<\/p><p>We always try to keep a full tank on site - but sometimes they run out before we can get a replacement there. If you run out and need a replacement, we can try and get you a replacement delivered - but - depending on timing - it may be faster for you to run and exchange the empty.<\/p><p>Of course we will reimburse you for the tank and your time!<\/p>", "photo": "48c3d75066ca04f74afe8fa02fbae356.jpg", "id": "propane-grill"}, {"title": "Propane Tank(s)", "html": "<p>We TRY to keep a full propane tank (and an extra one) at the home. Most of the time we can get them swapped out before check in. Unfortunately, that's not always possible. We apologize if you did not find a full propane tank upon arrival!<\/p><p>We can try and coordinate another person to deliver you a new tank, but their availability might not be immediate. If you need something quick, we recommend running to the store and exchanging the empty one(s) or a new one - and yes of course we would be happy to reimburse you for the tank and your trouble! Just let us know. Thank You.<\/p>", "photo": "05f49508259ad5443ec6e6d70501e8b4.jpg", "id": "propane-tank-s"}]}]}, "fireplace-firepit": {"id": "fireplace-firepit", "title": "Fireplace + Firepit", "icon": "flame-kindling", "groups": [{"title": "", "items": [{"title": "Firepit / Firewood", "html": "<p>Due to insurance/safety reasons, we are not able to currently provide any firewood - but you are more than welcome to drop by any local convenience store or big box store and purchase as much as you'd like.<\/p><p>Never leave the fire unattended, and make sure to extinguish it before going to bed.<\/p><p>Please Be Safe! <\/p>", "photo": "51571a26d3d63c956113279a414c01c4.jpg", "id": "firepit-firewood"}, {"title": "Indoor Fireplace", "html": "<p><strong>Fireplace Instructions<\/strong><\/p><p>The fireplace remote control is on the wall next to the TV. Please only use the wall remote to operate it, and please do not adjust any settings on the actual fireplace - it is already programmed! There is a 30-60-120 minute timer on the remote to control your desired usage. The pilot light will always stay lit, even when it's not in use. Please do not move or make any adjustments to the logs otherwise additional charges could apply for a technician to come fix and re-adjust everything. Stay Warm &amp; Enjoy! <\/p><p>If you are having difficulty - please check out this <a href=\"https://www.loom.com/share/56f37658cb144d0194e9797a8f53b0dd?sid=ce8b777e-ac26-4662-9b9e-3c658cc15853\">troubleshooting video<\/a>.<\/p>", "video": "https://www.loom.com/embed/56f37658cb144d0194e9797a8f53b0dd", "photo": "77788f1b3182f439cecb407ae5c60c7b.jpg", "id": "indoor-fireplace"}, {"title": "Outdoor Fireplace", "html": "<p>Due to insurance/safety reasons, we are not able to currently provide any firewood - but you are more than welcome to drop by any local convenience store or big box store and purchase as much as you'd like.<\/p><p>Never leave the fire unattended, and make sure to extinguish it before going to bed.<\/p><p>Please Be Safe! <\/p>", "photo": "d67e26c31ba3c4d98bc76e01052af085.jpg", "id": "outdoor-fireplace"}]}]}, "trash": {"id": "trash", "title": "Trash + Garbage Disposal", "icon": "trash-2", "groups": [{"title": "", "items": [{"title": "Garbage Disposal", "html": "<p>Liquids Only Please! There Is Not A Garbage Disposal In This Home!<\/p><p>Please do not place any debris, cooking oils, grease, coffee, egg shells, food scraps, or anything solid down the kitchen sink drain. <\/p>", "id": "garbage-disposal"}, {"title": "Trash", "html": "<p>Trash is collected after each guest checks out.<\/p><p>Do Not Leave Trash Out In The Open. Secure your trash in the kitchen trash bags, place them within the black trash cans, and ensure the trash receptacle is locked.<\/p><p>There have been plenty of bears visiting the mountain in the past, and unsecured trash can cause a huge problem for the cleaning team later.<\/p><p>The Trash Must Be Broken Down - In A Bag - And In The Receptacle. Do Not Leave Un-Bagged Trash Anywhere Or You Could Be Charged An Additional Cleaning Fee.<\/p>", "id": "trash"}]}]}, "hot-tub": {"id": "hot-tub", "title": "Hot Tub / Jacuzzi", "icon": "bath", "groups": [{"title": "", "items": [{"title": "Hot Tub / Jacuzzi", "html": "<p>Please Be Patient and Conscious When Using Jacuzzi Controls.<\/p><p>Do not push too many buttons at once or too often - this will put the Jacuzzi into Sleep Mode and It Will Not Heat! <\/p><p>Upon your arrival, the jacuzzi might* have a slightly lowered temperature and it may take a moment to heat up.<\/p><p>Simply raise the temperature by using the arrow up buttons until the screen shows a different temperature.<\/p><p>We recommend an ideal temperature of 101*F. <\/p>", "photo": "82b837f0d71534128cb8ffb7de3bcf1a.jpg", "id": "hot-tub-jacuzzi"}]}]}, "indoor-games-fun": {"id": "indoor-games-fun", "title": "Indoor Games + Fun", "icon": "gamepad-2", "groups": [{"title": "", "items": [{"title": "Cards, Games + More", "html": "<p>We try to keep a great selection of puzzles, books, board games, and card games for the whole family.<\/p><p>If something is missing or broken, PLEASE LET US KNOW immediately so we can order a replacement. <\/p><p>Feel Free to Help Yourself, But...<\/p><p>Please keep everything neat and tidy for the next guests as well :)<\/p><p>Missing puzzle pieces or having only half the chess pieces isn't fun for anyone!<\/p>", "photo": "generic-chess-board.jpg", "id": "cards-games-more"}, {"title": "Game Room Fun!", "html": "<p>In the game room, you’ll find a small selection of board games, card games, and arcades for endless fun. If anything is missing or broken, please let us know immediately so we can order a replacement right away!<\/p>", "photo": "e899819757354062480ee4dd14b8ba7d.jpg", "id": "game-room-fun"}]}]}, "kitchen": {"id": "kitchen", "title": "Kitchen, Supplies + Appliances", "icon": "cooking-pot", "groups": [{"title": "", "items": [{"title": "Kitchen + Supplies + Appliances", "html": "<p>We have a fully stocked kitchen with a stainless steel appliance package. We try to provide everything you may need, but we're not perfect. If you have ANY suggestions for small appliances, dishware, flatware, glassware, or even dry goods that would be beneficial - let us know! We would be happy to see if it's possible to place an Amazon/Walmart/Grocery delivery order for you during your stay :)<\/p>", "id": "kitchen-supplies-appliances"}]}]}, "laundry": {"id": "laundry", "title": "Laundry", "icon": "washing-machine", "groups": [{"title": "", "items": [{"title": "Laundry", "html": "<p>We do have a private washer and dryer located in the home. There should be a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in, close the door, and hit start. <\/p>", "photo": "794607d57a2c8fc964701bb9c7a73b7a.jpg", "id": "laundry"}]}]}, "outdoor-games-fun": {"id": "outdoor-games-fun", "title": "Cornhole / Bags", "icon": "target", "groups": [{"title": "", "items": [{"title": "Cornhole / Bags", "html": "<p>Nothing beats a little friendly competition in the fresh mountain air! Grab the cornhole boards and bags, set them up outside, and enjoy the views while you play. Whether it's a quick game before dinner or a full-on family tournament, it's a great way to spend time outdoors together.<\/p><p>There should be a set of all-weather cornhole boards somewhere on the patio. If you notice anything is broken or missing, please let us know right away so we can order replacements. It would be very helpful if you would return them to a covered area after each day so they don't wander off or get ruined in the weather :)<\/p>", "photo": "9df12f8c833b036dda9b1e92c15acd40.jpg", "id": "cornhole-bags"}]}]}, "tv-streaming": {"id": "tv-streaming", "title": "TV's + Streaming", "icon": "tv", "groups": [{"title": "", "items": [{"title": "TV's + Streaming", "html": "<p>We have Hi-Speed WIFI for all of your streaming needs!<\/p><p>There are Smart TV's throughout the entire home.<\/p><p>Go to the TV Home Screen<\/p><p>Search For (or Download) The Channel App You Want To Watch &amp; Login to your TV Provider.<\/p><p>Please don't hesitate to reach out if you need provider login assistance!<\/p>", "photo": "729ecb38918b0e99bc0a0ec5fa74c6d2.jpg", "id": "tvs-streaming"}]}]}, "thermostat": {"id": "thermostat", "title": "Thermostat", "icon": "thermometer", "groups": [{"title": "", "items": [{"title": "Heating / Cooling", "html": "<p>There is a smart thermostat on the wall that allows you to control the temperature of the home. When you arrive, the thermostat should be set to keep the temperature between 70-74*F - but you can adjust if you need. If you're running the air conditioning or heating - PLEASE keep all windows and outside doors closed to ensure it operates at maximum efficiency. We recommend a setting of about 72*F which we find keeps the place at a comfortable temperature.<\/p>", "photo": "6dcf0c01138989074a4f45f1ba6e2775.jpg", "id": "heating-cooling"}]}]}, "beer-wine": {"id": "beer-wine", "title": "Beer and Wine", "icon": "wine", "groups": [{"title": "Beer and Breweries", "items": [{"title": "Angry Hops Brewery", "html": "<p>For a laid-back afternoon or evening, <strong>Angry Hops Brewing<\/strong> is a great local spot to grab a craft beer and enjoy the mountain-town atmosphere. They offer a rotating selection of beers ranging from IPAs and lagers to stouts and creative sours, with plenty of outdoor seating. It’s also <strong>dog-friendly<\/strong> and often hosts live music, food trucks, and other events, making it a fun stop while exploring Blue Ridge.<\/p><p><strong>📍 341 E. Main St., Blue Ridge, GA<\/strong><br><strong>📞 828-361-6950<\/strong><br><strong>🌐<\/strong> <a href=\"https://angryhopsbrewing.com/\">angryhopsbrewing.com<\/a><\/p>", "photo": "90405d0031118f95198cb5f18949a87e.jpg", "loc": [34.869628, -84.320314], "pin": "brewery_pub", "id": "angry-hops-brewery"}, {"title": "Cartecay River Brewing Co.", "html": "<p>Website: <a href=\"https://www.cartecayriverbrewing.com/the-brewery\">https://www.cartecayriverbrewing.com/the-brewery<\/a><br>Phone Number: (706) 273-2728<\/p><p>A charming microbrewery inspired by the Appalachian Mountains and Cartecay River. Features up to 15 rotating taps (IPAs, sours, stouts, lagers) in a pet- and family-friendly setting, complete with riverside covered patios and live music on select nights.<\/p>", "photo": "a550203107031262ab7da231556e0f3f.jpg", "loc": [34.682175, -84.491733], "pin": "brewery_pub", "id": "cartecay-river-brewing-co"}, {"title": "Copperhill Brewing Company", "html": "<p><a href=\"https://www.copperhillbrewery.com/\">https://www.copperhillbrewery.com/<\/a><\/p><p>Craft Beer You'll Dig! Copperhill Brewing has a passion to brew high quality, diverse, and exceptional tasting craft beer. Brewing craft beer is truly an art form, and their goal is to brew an exceptional selection of craft beers that will set Copperhill Brewery apart from all others. Enjoy the variety of craft beers offered in the tap room!<\/p>", "photo": "f599fd135d49e5f3e747bdc601f3bf7d.jpg", "loc": [34.988081, -84.370346], "pin": "brewery_pub", "id": "copperhill-brewing-company"}, {"title": "Fannin Brewing Company", "html": "<p><a href=\"https://www.fanninbrewingcompany.com/\">https://www.fanninbrewingcompany.com/<\/a><\/p><p>Fannin Brewing is a hometown brewery in a real place - beautiful Blue Ridge, GA. We're a micro-brewery producing beers influenced by the German style. We've combined our love for German beer, our experience making wine, and our passion for the mountains to create world-class beer with a local focus. Local isn't just a word - we use local ingredients, name our beers for the beauty around us, and support our local community.<\/p>", "photo": "d95d46c9f2f2c7edd834ef661c849a83.jpg", "loc": [34.87066, -84.317573], "pin": "brewery_pub", "id": "fannin-brewing-company"}, {"title": "Grumpy Old Men Brewery", "html": "<p><a href=\"https://grumpyoldmenbrewing.com/\">https://grumpyoldmenbrewing.com/<\/a><\/p><p>Grumpy Old Men Brewing was founded by a couple of retired beer enthusiasts that went from brewing in an outdoor shower to opening their own Micro-Brewery located in Blue Ridge, Georgia. In 2018, the guys decided it was becoming too much work so they passed over their tap handles to another Grumpy Old Man &amp; his Crabby Old Lady. The original grumpy old men are now enjoying their retirement from the other side of the bar, drinking the awesome beer they created and hanging out with everyone.<\/p>", "photo": "914a1acef6dd8ceb2c596e0a05d99675.jpg", "loc": [34.858237, -84.329923], "pin": "brewery_pub", "id": "grumpy-old-men-brewery"}, {"title": "Reece’s Cider Company", "html": "<p>Website: <a href=\"https://reecescidercompany.com\">https://reecescidercompany.com<\/a><\/p><p>Phone: (706) 635-2775<\/p><p>Address: 9110 GA Hwy 52 E, Ellijay, GA 30536<\/p><p>Looking for a taste of local Ellijay apples in a glass? Reece’s Cider Company is the place! With locally crafted hard ciders, live music on weekends, and a friendly community vibe, it’s a must-visit during your stay. Great for a casual afternoon, outdoor hangout, or as part of your own “Ellijay tasting tour.”<\/p>", "photo": "9ef6382170568a711324a70c7aa4dc30.jpg", "id": "reeces-cider-company"}, {"title": "Talking Rock Brewery", "html": "<p>Website: <a href=\"https://talkingrockbrewery.com\">https://talkingrockbrewery.com<\/a><\/p><p>Phone Number: 706-253-2337<\/p><p>Just outside Ellijay, this charming brewery is nestled in a restored 1920s railcar and offers an unforgettable setting for a relaxed evening. Whether you’re after a flight of craft beers or a seat on the pavilion with cornhole or live music, this place checks every box. Dog- and family-friendly with a rotating tap list and cozy community vibes.<\/p><p>Schedule: Open Wed–Thu: 4–8pm; Fri–Sat: 12–9pm; Sun: 12–7pm; Closed Mon–Tue<\/p>", "photo": "da9354e383dbeb59c31cb42392b39f42.jpg", "id": "talking-rock-brewery"}, {"title": "Tipping Point Brewery", "html": "<p><a href=\"https://www.tippingpointbrewing.com/\">https://www.tippingpointbrewing.com/<\/a><\/p><p>Monday – Thursday - 12:00 PM - 7:00 PM<\/p><p>Friday - Saturday - 12:00 PM - 8:00 PM<\/p><p>Sunday - 12:30 PM – 7:00 PM<\/p>", "photo": "bc30223fef213e08cfbcc0bd28171bc7.jpg", "loc": [34.865023, -84.326173], "pin": "brewery_pub", "id": "tipping-point-brewery"}]}, {"title": "Wine and Wineries", "items": [{"title": "34th Degree", "html": "", "photo": "6d802d2629908cc982c8998080f0f46d.jpg", "loc": [34.865897, -84.326471], "pin": "grocery_shopping", "id": "34th-degree"}, {"title": "Bear Claw Vineyards", "html": "<p><a href=\"https://bearclawvineyards.com/\">https://bearclawvineyards.com/<\/a><\/p><p>Bear Claw is a real Vineyard with a fully functioning Winery on site. Bear Claw produces and bottles it’s own wine on site and it is 100% female owned! After extensively researching the land it was discovered that this location was prime to grow grapes based not only on geography but based on the rich \"alluvial plain soil\" this location is blessed with. At 1832 feet above sea level, with a cool mountain breeze, and rich and unique soils, it was decided the land was the perfect place to produce the highest quality wine.<\/p>", "photo": "b557bcb35e4cbfa4515a218d03a5359a.jpg", "loc": [34.879677, -84.369689], "pin": "vineyard", "id": "bear-claw-vineyards"}, {"title": "Cartecay Vineyards", "html": "<p><a href=\"https://www.cartecayvineyards.com/\">https://www.cartecayvineyards.com/<\/a><\/p><p>Georgia Fine Wines available for tasting and enjoyment at Cartecay Vineyards' Tasting Barn. Weekly events, including live music on our Chimney Wine Patio and Tasting Barn. Event facilities available for weddings and private events.<\/p>", "photo": "bd1eec40c86c3d1413a470812fb10304.jpg", "loc": [34.613974, -84.39299], "pin": "vineyard", "id": "cartecay-vineyards"}, {"title": "Ellijay Excursions", "html": "<p><a href=\"https://ellijayexcursions.com/\">https://ellijayexcursions.com/<\/a><\/p><p>They invite you to indulge in the picturesque charm and exquisite flavors of North Georgia’s wine country. Nestled among the rolling hills and vineyard-laden landscapes of Ellijay, our wine tours offer a delightful blend of relaxation, adventure, and culinary delight. Whether you’re a wine enthusiast or simply seeking a memorable getaway, our expertly curated tours promise an immersive experience like no other. Join us as we uncork the region’s finest wines, explore award-winning wineries, and create unforgettable moments in the heart of Georgia’s wine country. Embark on a journey with Ellijay Excursions and discover why every sip tells a story.<\/p>", "photo": "168477214a4ac589760c1727d0684bc8.jpg", "id": "ellijay-excursions"}, {"title": "Fainting Goats Vineyard", "html": "<p><a href=\"https://www.faintinggoatvineyardsandwinery.com/\">https://www.faintinggoatvineyardsandwinery.com/<\/a><\/p><p>We certainly do have goats! Ronnie and Reagan are our two mature goats. We also have two baby goats, Dolley, and Mamie. Our fainting goats welcome visitors to pet and play with them. Our boutique vineyard is nestled up against the southeast side of Burnt Mountain in picturesque Pickens County, Georgia. Fainting Goat is a family owned Vineyard and Winery created by a passion for great wine and a love for the earth. We offer live music every weekend day and have Friday Night Concert Series during the season. We also have award winning wines, a view that only God could create, and a deep love for our business. We welcome you to visit us and would be honored to have you as our guest!<\/p>", "photo": "a32e7ee9e792f8b9187464561565ab99.jpg", "loc": [34.531985, -84.395371], "pin": "vineyard", "id": "fainting-goats-vineyard"}, {"title": "Mercier Orchards", "html": "<p><a href=\"https://mercier-orchards.com/\">https://mercier-orchards.com/<\/a><\/p><p>Mercier Orchards is the largest apple orchard in the southeast and is known as Southern Living Magazine's \"favorite roadside apple market,\" but it is much, much more. For over 75 years, the Mercier family has been welcoming visitors to taste the fruits of the mountains, and the yummy fried pies, apple cider, apple butter and fritters that come from the fruit!<\/p>", "photo": "d1d71f6ca79be715506dd89150a69d67.jpg", "loc": [34.886286, -84.340812], "pin": "vineyard", "id": "mercier-orchards"}, {"title": "North Georgia Wine Tours", "html": "<p><a href=\"https://www.northgawinetours.com/\">https://www.northgawinetours.com/<\/a><\/p><p>Experience the ease of our wine tours! Simply let us know your preferred pick-up and drop-off location, and we'll take care of the rest. We will build a day out of visiting 3 wineries, handling all of the reservations for you. Let us take the stress of planning/driving off your shoulders! <\/p>", "photo": "bc482e476882a0652d85469edbf86015.jpg", "id": "north-georgia-wine-tours"}, {"title": "Out of the Blue Bottle Shop", "html": "<p>For wine lovers, <strong>Out of the Blue<\/strong> is a fantastic stop in downtown Blue Ridge. This locally owned shop has an impressive selection of wines, craft beers, artisan cheeses, and gourmet foods. The staff is incredibly knowledgeable and happy to help you find the perfect bottle or put together a great cheese and wine pairing to enjoy back at the cabin. It’s also a fun spot to browse for unique gifts and entertaining items.<\/p><p><strong>📍 647 E. Main St., Blue Ridge, GA<\/strong><br><strong>📞 706-258-2750<\/strong><br><strong>🌐<\/strong> <a href=\"https://outofzbleu.com/\">outofzbleu.com<\/a><\/p>", "photo": "025ced46914d0c00c11670b667599351.jpg", "id": "out-of-the-blue-bottle-shop"}, {"title": "Serenberry Vineyards", "html": "<p><a href=\"https://www.serenberryvineyards.com/\">https://www.serenberryvineyards.com/<\/a><\/p><p>Serenberry invites you to visit their grapevines, each with its own personality, taste their wines, and experience the simple and serene pleasures that the North Georgia Mountains have waiting for you. Give yourself a moment to pause and celebrate nature's down-to-earth gifts of life, people, and wine. Just a few country miles outside of Blue Ridge, the vineyard and winery is open Thursday through Sunday for tastings and tours. <\/p>", "photo": "2d1e8fa1ef5a333e87eeb65b31636fb0.jpg", "loc": [34.850558, -84.19473], "pin": "vineyard", "id": "serenberry-vineyards"}, {"title": "Wine Tour - The Grape Escape", "html": "<p>Located In Blue Ridge, Georgia. We Invite You To Hop Aboard Our Shuttle And Experience A Wine Adventure Like No Other. From Lush Grapevines , Breath Taking Mountains, To Historical Downtown. You Are Sure To Get The Most Out Of What North Georgia Has To  Offer. Come Join Us On North Georgia's Most Popular and #1 Rated Blue Ridge Wine Tasting Tour.<\/p><p>Take A Tour <a href=\"https://grapeescapeadventures.com/\">Here<\/a>!<\/p>", "photo": "6ca2a12a036e1e4a43103f7534f597a2.jpg", "loc": [34.87265, -84.32754], "pin": "entertainment_and_activities", "id": "wine-tour-the-grape-escape"}]}]}, "dining": {"id": "dining", "title": "Dining Out", "icon": "utensils", "groups": [{"title": "Breakfast, Brunch, + Coffee Recommendations", "items": [{"title": "Back Porch Bistro", "html": "<p>Website: <a href=\"https://back-porch-bistro.res-menu.com/\">https://back-porch-bistro.res-menu.com/<\/a> <br>Phone: (706) 636-1111<br>Address: 10 North Side Square, Ellijay, GA 30540<\/p><p>A charming bistro with a relaxed atmosphere, Back Porch Bistro offers freshly prepared breakfast items and brunch specials. Guests can enjoy pressed panini sandwiches, omelets, and homemade pastries on the inviting back porch. Perfect for a leisurely meal and people-watching in the heart of Ellijay.<\/p>", "photo": "8908eb8728b77e8c09f5788bf46b0141.jpg", "id": "back-porch-bistro"}, {"title": "Blend Superfood Cafe", "html": "<p><a href=\"https://www.blendsuperfoodcafe.com/\">https://www.blendsuperfoodcafe.com/<\/a><\/p><p>Looking for some quick energy before hitting the trails? Offering lots of organic items, grab a smoothie, power balls, or one of their Acai bowls. The Super Bowl is packed with bananas, strawberries, blackberries, almond butter, hemp hearts, and goji berries. Be sure to grab a cup of their coffee. <\/p>", "photo": "cabf709999012f14e3e9d74c90a37642.jpg", "loc": [34.869255, -84.319237], "pin": "coffee_shop", "id": "blend-superfood-cafe"}, {"title": "Bumblebee's Cafe Blue Ridge", "html": "<p><a href=\"https://www.facebook.com/bumblebeescafeblueridgega/\">https://www.facebook.com/bumblebeescafeblueridgega/<\/a><\/p><p>BumbleBee's Cafe in Blue Ridge serves breakfast and lunch with a southern country flair.<\/p>", "photo": "9415e048abe4f8595cdfe74226b9104a.jpg", "loc": [34.879942, -84.295045], "pin": "restaurants", "id": "bumblebees-cafe-blue-ridge"}, {"title": "The Corner Stone Café", "html": "<p>Website: <a href=\"https://thecornerstonecafeellijay.com\">https://thecornerstonecafeellijay.com<\/a> <br>Phone: (706) 342-8777<br>Address: 76 N Main St, Ellijay, GA 30540<\/p><p>A local favorite, The Corner Stone Café serves hearty, homestyle breakfast classics with a welcoming, cozy atmosphere. From fluffy pancakes to country fried steak and biscuits and gravy, every dish is prepared with care. The friendly staff and warm decor make it the perfect spot to start your day in Ellijay.<\/p>", "photo": "10772c7e448819b40764db468b296622.jpg", "id": "the-corner-stone-caf"}, {"title": "Country Corner Kitchen", "html": "<p>Facebook: <a href=\"https://www.facebook.com/CountryCornerKitchen\">https://www.facebook.com/CountryCornerKitchen<\/a><br>Phone: (706) 276-1111<br>Address: 2020 Old Hwy 5 S, Ellijay, GA 30540<\/p><p>Known for its Southern hospitality, Country Corner Kitchen serves fresh, home-cooked breakfasts daily. Guests love the fluffy biscuits, hearty omelets, and made-to-order specialties. The welcoming staff and charming atmosphere make it a favorite for locals and visitors alike.<\/p>", "photo": "544f70500904470b28c374fda53f3f3d.jpg", "id": "country-corner-kitchen"}, {"title": "Das Kaffee Haus", "html": "<p>Our #1 Choice - Katharina is German after all!<\/p><p><a href=\"https://www.facebook.com/kaffeehausblueridge/\">https://www.facebook.com/kaffeehausblueridge/<\/a><\/p><p>Das Kaffee Haus, owned by a Bavarian guy, is a traditional European Coffee Shop where you can find Espresso, Cappuccino, Latte, Frappe, etc. Next to the great treats of Germany, Italy, France, etc. in the Coffee / Tea / Dessert world they keep up with the demands and requests of customers. They offer Soy Milk, Coconut Milk, Almond Milk, even Gluten Free options are available (call ahead for GF availability). While focusing on good coffee, they want to create a great Cafe experience, where their outdoor seating area invites you to look over the famous Railway Train of Blue Ridge and its downtown. <\/p>", "photo": "4502cbaca3d626e51487905f965728f9.jpg", "loc": [34.866727, -84.323442], "pin": "coffee_shop", "id": "das-kaffee-haus"}, {"title": "Mike’s Ellijay Restaurant", "html": "<p>Facebook: <a href=\"https://www.facebook.com/MikesEllijayRestaurant\">https://www.facebook.com/MikesEllijayRestaurant<\/a><br>Phone: (706) 276-0009<br>Address: 351 Tails Creek Rd, Ellijay, GA 30540<\/p><p>Mike’s is a hidden gem for locals and visitors alike, known for generous portions and hearty breakfasts. From omelets and biscuits with gravy to daily specials, every meal is made fresh. This cash-only spot offers a nostalgic, small-town diner experience that makes you feel right at home.<\/p>", "photo": "ee200a18fa2b84b195dd9f1ef3b4b170.jpg", "id": "mikes-ellijay-restaurant"}, {"title": "Mountain Mama Coffee Lounge", "html": "<p><a href=\"https://www.mountainmamaslounge.com/\">https://www.mountainmamaslounge.com/<\/a><\/p><p>Exceptionally trained baristas, homemade flavors, creative combinations, and space to sip, bite, meet, work, or play.<\/p>", "photo": "f445bf1986027e5d8213145d9080999f.jpg", "loc": [34.864692, -84.32478], "pin": "coffee_shop", "id": "mountain-mama-coffee-lounge"}, {"title": "The Pullman", "html": "<p>For a great breakfast, brunch, or lunch, <strong>The Pullman<\/strong> is a newer favorite in downtown Blue Ridge. It’s an elevated all-day eatery with a warm, stylish atmosphere and a menu featuring fresh, creative takes on classic favorites. Their coffee, cocktails, and brunch offerings are especially popular, making it a great spot for a relaxed morning or leisurely meal. (<a href=\"https://www.thepullmanblueridge.com/\">thepullmanblueridge.com<\/a>)<\/p><p><strong>📍 657 E. Main St., Blue Ridge, GA<\/strong><br><strong>📞 706-455-3364<\/strong><br><strong>🌐<\/strong> <a href=\"https://www.thepullmanblueridge.com/\">thepullmanblueridge.com<\/a><\/p>", "photo": "a0914d28901f1c524a415b72fceab0f1.jpg", "loc": [34.866004, -84.323697], "pin": "restaurants", "id": "the-pullman"}, {"title": "Serenity Garden Cafe", "html": "<p><a href=\"https://www.serenitygardencafe.net/\">https://www.serenitygardencafe.net/<\/a><\/p><p>A locals’ favorite, breakfast is served in this quiet, relaxing setting every day except Tuesday. Pick from eggs, omelets, pancakes and waffles. The hash browns paired with bacon and a waffle will hold you over while exploring the mountains before lunch.<\/p>", "photo": "fab0f10a9ba91b926291832d7138ab92.jpg", "loc": [34.866142, -84.323695], "pin": "restaurants", "id": "serenity-garden-cafe"}, {"title": "The Shack of Ellijay", "html": "<p>Website: <a href=\"https://ordertheshack.com/\">https://ordertheshack.com/<\/a> <br>Phone: (706) 698-3000<br>Address: 118 N Main St, Ellijay, GA 30540<\/p><p>The Shack combines casual dining with diverse menu options, including breakfast classics and unique dishes like Asian-inspired breakfast bowls. Its laid-back vibe and creative offerings make it a fun spot to start your day. Guests love the friendly staff and welcoming environment.<\/p>", "photo": "ae506a6696d87e6da52457de0fe3f621.jpg", "id": "the-shack-of-ellijay"}]}, {"title": "Dinner + Drinks Recommendations", "items": [{"title": "The Black Sheep Restaurant Bar and Patio", "html": "<p><a href=\"http://www.blacksheepblueridge.com\">www.blacksheepblueridge.com<\/a> <\/p><p>The Black Sheep Restaurant Located in the Historic Butt House, Circa 1914, in downtown Blue Ridge Georgia, is a progressive, locally sourced, chef-inspired New Americana menu, a “Wine Spectator” recognized wine list, and exceptional service all set inside this historically inspired architectural masterpiece makes the Black Sheep one of the most recognizable restaurants anywhere in Georgia.<\/p>", "photo": "6e6e1569dd6ff7f93499e31e40d4d18c.jpg", "loc": [34.863216, -84.32795], "pin": "restaurants", "id": "the-black-sheep-restaurant-bar-and-patio"}, {"title": "The Butcher and the Bottle", "html": "<p>https://thebutcherandbottle.com/<\/p><p>\"The Butcher and Bottle is an upscale seafood and steak restaurant in the picturesque mountains of Ellijay, GA. Our family-owned establishment offers exceptional quality, delightful cuisine, and impeccable hospitality. Join us for a romantic date night, a celebration with loved ones, or a sophisticated dining experience. Explore our private and semi-private event spaces, perfect for hosting memorable gatherings. Choose The Butcher and Bottle, the premier seafood and steak restaurant in Ellijay, GA, for an extraordinary culinary adventure in a breathtaking setting.\"<\/p>", "photo": "08c92c0d50eeeb7072e0a243927fff9f.jpg", "loc": [34.694441, -84.482187], "pin": "restaurants", "id": "the-butcher-and-the-bottle"}, {"title": "Cajun Depot Grill", "html": "<p>Facebook: <a href=\"https://www.facebook.com/CajunDepotGrill\">https://www.facebook.com/CajunDepotGrill<\/a><br>Phone: (706) 276-1676<br>Address: 67 Depot St, Ellijay, GA 30540<\/p><p>Bringing Louisiana flavors to the North Georgia mountains, Cajun Depot Grill serves gumbo, shrimp and grits, and po’boys in a warm, family-friendly setting. The portions are generous, and the food is authentically seasoned. A flavorful dinner option that feels like a trip to New Orleans.<\/p>", "photo": "6bf270ac435d762e0ff3d3f53d4a38ab.jpg", "id": "cajun-depot-grill"}, {"title": "Charlie’s Italian Restaurant & Pizzeria", "html": "<p>Website: <a href=\"https://www.charlies-italian.com/\">https://www.charlies-italian.com/<\/a> <br>Phone: (706) 635-2205<br>Address: 15 West Cross St, East Ellijay, GA 30540<\/p><p>A cozy Italian spot offering homestyle pasta, pizza, and classic Italian entrées. The warm, family-run atmosphere makes guests feel at home, while the menu caters to both kids and adults. A go-to for comfort food and casual dining in East Ellijay.<\/p>", "photo": "b76f506415bceed7829bc1965dda970b.jpg", "id": "charlies-italian-restaurant-pizzeria"}, {"title": "Cucina Rustica", "html": "<p><a href=\"https://www.cucinarusticaga.com/\">https://www.cucinarusticaga.com/<\/a><\/p><p>Located in Morganton, Georgia, only a few minutes from Blue Ridge Georgia, Cucina Rustica serves country style Italian dishes in an Old-World atmosphere. Cucina Rustica is a restaurant focused on a fine dining experience with Chef Danny Mellman’s interpretation of Old-World Italian foods from Sicilian fish dishes to Northern Italian pastas and everything in between. <\/p><p>Hours: Wednesday–Thursday 5–8 PM, Friday–Saturday 5–9 PM (closed Sunday–Tuesday). Reservations through Resy.<\/p>", "photo": "4e5b6097222dbd97e96603bdc181f1eb.jpg", "loc": [34.891933, -84.24781], "pin": "restaurants", "id": "cucina-rustica"}, {"title": "General Ledger", "html": "<p><a href=\"https://www.generalledgerblueridge.com/\">https://www.generalledgerblueridge.com/<\/a><\/p><p>General Ledger is located in a beautiful historic bank building in Blue Ridge. They use the best ingredients and provide a great atmosphere. <\/p>", "photo": "d4f6e4fcd08c975f93e16a50af4a9930.jpg", "loc": [34.865696, -84.325382], "pin": "restaurants", "id": "general-ledger"}, {"title": "Grace Prime Steakhouse", "html": "<p>For a special night out, Grace Prime Steakhouse is one of our favorite recommendations in downtown Blue Ridge. They offer an elevated steakhouse experience featuring expertly prepared 45+ day dry-aged steaks, fresh seafood, craft cocktails, and an impressive wine selection. The atmosphere is upscale yet welcoming, making it a great choice for date nights, anniversaries, or a memorable dinner during your stay. Reservations are recommended.<\/p><p><strong>📍 55 Mountain St., Suite 6, Blue Ridge, GA<\/strong><br><strong>📞 706-946-2555<\/strong><br><strong>🌐<\/strong> <a href=\"https://graceprime.com/\">graceprime.com<\/a><\/p>", "photo": "816932f479c7b89e3b323c0cbd8d8354.jpg", "loc": [34.869073, -84.32269], "pin": "restaurants", "id": "grace-prime-steakhouse"}, {"title": "Rose's Smashburgers", "html": "<p>Looking for a great burger? <strong>Rose’s Smash House<\/strong> is a newer local favorite in Blue Ridge serving up seriously good smash burgers made with 100% local Georgia Wagyu beef. Their burgers are smashed to order for that crispy, caramelized crust, and their fries are cooked in grass-fed beef tallow for an extra level of flavor. It’s casual, fun, and a great option for families or a laid-back lunch or dinner.<\/p><p><strong>📍 588 E Main St., Blue Ridge, GA<\/strong><br><strong>📞 762-270-0417<\/strong><br><strong>🌐<\/strong> <a href=\"https://www.rosessmashhouse.com/\">rosessmashhouse.com<\/a><\/p>", "photo": "aa6201f2a2faeeabc127754e0c5e214d.jpg", "loc": [34.867102, -84.323286], "pin": "restaurants", "id": "roses-smashburgers"}, {"title": "Tapas and Tequila", "html": "<p>For a fun night out, <strong>Tapas &amp; Tequila<\/strong> is a great choice in downtown Blue Ridge. This lively Mexican restaurant specializes in flavorful shareable plates, fresh guacamole, and handcrafted margaritas and tequila cocktails. It’s a great spot for groups, date nights, or enjoying a few drinks and small plates while exploring downtown.<\/p><p><strong>📍 257 E Main St., Suite A, Blue Ridge, GA<\/strong><br><strong>📞 706-946-0080<\/strong><br><strong>🌐<\/strong> <a href=\"https://www.tapasandtequila.net/\">tapasandtequila.net<\/a><\/p>", "photo": "ab5e52ca9c3492f3da669a87eff0554f.jpg", "loc": [34.870362, -84.319159], "pin": "bars_and_nightlife", "id": "tapas-and-tequila"}, {"title": "Whiskey & Water", "html": "<p><a href=\"https://www.whiskeywaterbr.com/\">https://www.whiskeywaterbr.com/<\/a><\/p><p>Whiskey &amp; Water - Seafood and Bourbon Bar is a local spot serving high-quality, sustainable seafood, cocktails, whiskeys, and bourbons from all over the world. Whiskey &amp; Water’s Seafood and Bourbon Bar is bringing the best of America's Coasts to the North Georgia Mountains. Set inside a tastefully renovated, historic 1937 Post Office, guests will enjoy the most original cocktails, great wine, a wide selection of whiskeys and bourbons from around the globe, and only the best quality, sustainable seafood from the nations top providers. With an emphasis on freshest ingredients and classically salty vibes, Whiskey &amp; Water will transport you back to the golden ages of Americas’ Coastlines.<\/p>", "photo": "deedd9b21d95c4229a3a9ac2b339716f.jpg", "loc": [34.865878, -84.325587], "pin": "restaurants", "id": "whiskey-water"}]}, {"title": "Food Tours", "items": [{"title": "Blue Ridge Mountain Food Tours", "html": "<p>Website: <a href=\"https://blueridgemountainfoodtours.com/\">https://blueridgemountainfoodtours.com/<\/a> <br>Phone: (678) 697-1120<br>Address (Tour Meetup): Downtown Blue Ridge, GA<\/p><p>One of the most popular food experiences in North Georgia, this walking tour takes guests through downtown Blue Ridge to sample everything from Southern comfort food to locally made sweets. Each tour includes 5–6 stops at restaurants, breweries, and specialty shops. Perfect for first-time visitors who want a guided “taste” of the town.<\/p>", "photo": "927583b7709bdeb54aeea0f8dbee8be8.jpg", "id": "blue-ridge-mountain-food-tours"}, {"title": "Ellijay Excursions – Wine & Agritourism Tours", "html": "<p>Website: <a href=\"https://ellijayexcursions.com/\">https://ellijayexcursions.com/<\/a> <br>Phone / Email: +1 (706) 972-7401<br>Tour Area: Door-to-door service across Ellijay, Blue Ridge, Cherry Log, Jasper, and other Gilmer County locales<\/p><p>Let someone else handle the planning, driving, and scheduling—so you can relax and savor your tasting adventure. Ellijay Excursions offers private, customizable wine (and cider or beer) tours through the region’s top vineyards. Whether you’re visiting popular wineries or adding a whimsical stop at a farm loaded with friendly farm animals, they take care of it all with local charm and ease.<\/p><p>Book: Call (706) 972-7401 or email via their website at ellijayexcursions.com<br>Custom Options: Wine tours, cider/beer stops, farm visits, or tailored itineraries for any size group—couples, families, celebrations.<\/p>", "photo": "52c72de9ad16444651bcc338e31415f6.jpg", "id": "ellijay-excursions-wine-agritourism-tours"}, {"title": "North Georgia Wine Tours – Ellijay & Blue Ridge", "html": "<p>Website: <a href=\"https://www.northgawinetours.com/ellijay\">https://www.northgawinetours.com/ellijay<\/a> <br>Phone / Text: (706) 725-0049<br>Location / Service Area: Door-to-door pickup available in Ellijay, Blue Ridge, and Atlanta area<\/p><p>This veteran-owned company specializes in private wine tours—they handle planning, reservations, and transportation for a personalized tasting experience. Tours typically visit three award-winning wineries in Ellijay or Blue Ridge, complete with a knowledgeable, dedicated driver who makes the journey effortless and enjoyable North GA Wine Tours. <\/p>", "photo": "f02e629e3ac3366a715d3464260f4a81.jpg", "id": "north-georgia-wine-tours-ellijay-blue-ridge"}]}, {"title": "Lunch + Snack Recommendations", "items": [{"title": "Boat Dock Bar and Grill", "html": "<p><a href=\"https://lakeblueridgemarina.com/boat-dock-bar-grill/\">https://lakeblueridgemarina.com/boat-dock-bar-grill/<\/a><\/p><p>Boat Dock Bar and Grill is located on the shores of Lake Blue Ridge at the Lake Blue Ridge Marina. Great atmosphere and a view of the lake. They offer a variety of entrees and salads as well as specialty cocktails and other drink creations. Live music, Friday through Sunday.<\/p>", "photo": "0ffab574a0ffb7ca06adf2f96a90e03c.jpg", "loc": [34.870521, -84.280042], "pin": "restaurants", "id": "boat-dock-bar-and-grill"}, {"title": "Cantaberry Restaurant", "html": "<p>Website: <a href=\"http://cantaberry.com/\">http://cantaberry.com/<\/a><br>Address: 5 S Side Square, Ellijay, GA 30540<br>Phone: (706) 636-6166<\/p><p>Known for its homemade soups and signature chicken salad, Cantaberry has been a local favorite for years. The café’s warm, inviting atmosphere pairs perfectly with fresh sandwiches and gourmet lunch options. A great choice for guests wanting a mix of comfort food and healthy eats.<\/p>", "photo": "4ea1df85f25ec4b6a6532622fcbf6515.jpg", "id": "cantaberry-restaurant"}, {"title": "Ellijay Wood Fired Pizza", "html": "<p>Website: <a href=\"https://www.ellijaywoodfired.com/\">https://www.ellijaywoodfired.com/<\/a> <br>Address: 2 River St, Ellijay, GA 30540<br>Phone: (706) 276-1515<\/p><p>For artisan pizza lovers, this wood-fired gem serves hand-tossed pies with fresh ingredients and inventive toppings. Their rustic oven adds the perfect char to every slice. A great option for groups or families looking for a shared lunch experience.<\/p>", "photo": "cdfec4bc7b1db209742e8a81c1a3ed25.jpg", "id": "ellijay-wood-fired-pizza"}, {"title": "Ferraro's Kitchen", "html": "<p>For an elevated Italian dinner, Ferraro’s Kitchen is one of our favorite spots in downtown Blue Ridge. Chef Igor Ferraro brings authentic Italian cuisine to the area with beautifully prepared pastas, seafood, steaks, and an impressive wine list. It’s an intimate, upscale setting that’s perfect for a date night, anniversary, or special dinner during your stay. <strong>Reservations are highly recommended<\/strong>, as seating is limited.<\/p><p><strong>📍 322 West Main St., Suite 2A, Blue Ridge, GA<\/strong><br><strong>📞 706-785-9150<\/strong><br><strong>🌐<\/strong> <a href=\"https://www.ferraroskitchen.com/blueridge\">ferraroskitchen.com<\/a><\/p>", "photo": "571eb1a3c0ea7d729b39316fc563d25e.jpg", "loc": [34.865023, -84.326173], "pin": "restaurants", "id": "ferraros-kitchen"}, {"title": "Harvest On Main", "html": "<p><a href=\"https://harvestonmain.com/\">https://harvestonmain.com/<\/a><\/p><p>Harvest on Main specializes in fresh ingredients to create fun, inviting cuisine in a relaxing atmosphere. Enjoy a beautiful lodge setting, relax by the fire, and let Harvest's chef treat you to anything from a snack, to lunch or dinner. <\/p>", "photo": "85287095d6ba6571fddf5f9698e49a82.jpg", "loc": [34.867216, -84.323102], "pin": "restaurants", "id": "harvest-on-main"}, {"title": "Mystic Mountain Pizza", "html": "<p>For a fun, casual meal,<strong> <\/strong>Mystic Mountain Pizza is a local favorite and a great option for families and groups. They serve wood-fired pizzas with tons of creative specialty options, along with salads, sandwiches, wings, and more. The quirky, laid-back atmosphere makes it a particularly fun spot for families, and they also offer takeout if you’d rather enjoy pizza back at the cabin.<\/p><p><strong>📍 4118 E 1st St., Blue Ridge, GA<\/strong><br><strong>📞 706-946-0378<\/strong><br><strong>🌐<\/strong> <a href=\"https://mysticmountainpizzaco.com/\">mysticmountainpizzaco.com<\/a><\/p>", "photo": "1b0398887bd4bf901f7727482987444c.jpg", "loc": [34.872793, -84.31234], "pin": "restaurants", "id": "mystic-mountain-pizza"}, {"title": "River Street Tavern", "html": "<p>Website: <a href=\"https://riverstreettavern.com\">https://riverstreettavern.com<\/a><br>Phone: (706) 635-6166<br>Address: 40 River St, Ellijay, GA 30540<\/p><p>This lively tavern serves a mix of creative bar food and Southern comfort staples. Popular items include their blackened Mahi Caesar wrap and house burgers, all best enjoyed with a cold local brew. The casual vibe makes it a fun lunch stop right in downtown Ellijay.<\/p>", "photo": "ae84ef613c93e0f5355c2650cf4fa8b9.jpg", "id": "river-street-tavern"}, {"title": "The Roof Ellijay", "html": "<p>Website: <a href=\"https://www.theroofellijay.com/\">https://www.theroofellijay.com/<\/a> <br>Address: 16 River St, Ellijay, GA 30540<br>Phone: (706) 636-1111<\/p><p>Located downtown, The Roof combines Southern-inspired lunch dishes with panoramic mountain views from its rooftop deck. Guests love the stylish atmosphere and creative menu, from gourmet flatbreads to fresh salads. A perfect pick for lunch with a view and a touch of sophistication.<\/p>", "photo": "a3a86d048b5c337e1ffa208783e627f9.jpg", "id": "the-roof-ellijay"}, {"title": "Sue's Burgers", "html": "<p><a href=\"https://www.facebook.com/Sues-Burgers-Best-Burgers-in-Town-157525214284690/\">https://www.facebook.com/Sues-Burgers-Best-Burgers-in-Town-157525214284690/<\/a><\/p><p>A Local Favorite - \"We have the best burgers in town! Come and see our family owned business proudly serving since 1976.\"<\/p>", "photo": "053871452186eb29e0c91f734f3838de.jpg", "loc": [34.872085, -84.316681], "pin": "restaurants", "id": "sues-burgers"}]}]}, "emergency": {"id": "emergency", "title": "Emergency and Urgent Care", "icon": "siren", "groups": [{"title": "", "items": [{"title": "Ellijay Fire Station", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p><p>Location: 197 North Main Street, Ellijay, GA 30540 <\/p><p>Non-Emergency Phone: (706) 636-4711<\/p><p>Fax: (706) 635-4712<\/p><p>The Ellijay Fire Department provides vital 24/7 emergency response services—including fire suppression, rescue, and basic life support (BLS). Staffed by a mix of career and volunteer firefighters, the department stands ready to protect your safety and property with professionalism and care.<\/p>", "photo": "27ca313e76c156fd2107ce72c5c677f4.jpg", "id": "ellijay-fire-station"}, {"title": "Ellijay Police Department", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p><p>Address: 197 North Main Street, Ellijay, GA 30540 <\/p><p>Non–Emergency Phone: (706) 635-7430 <\/p><p>General Dispatch (Gilmer County): (706) 635-8911 <\/p><p>Website: City of Ellijay official police page <\/p><p>The Ellijay Police Department operates 24/7 to ensure public safety, enforce the law, and maintain peace in the community. <\/p>", "photo": "fa1636daeccb3153de0e400f29c6852c.jpg", "id": "ellijay-police-department"}, {"title": "Fire Station", "html": "<p>IN CASE OF AN EMERGENCY - DIAL 911<\/p><p>Fire Station # 1<\/p><p>Address - 342 W Main St. Blue Ridge, GA 30513<\/p>", "loc": [34.864749, -84.32627], "pin": "police", "id": "fire-station"}, {"title": "Hospital", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p><p>Fannin Regional Hospital - Blue Ridge<\/p><p>Address - 2855 Old Hwy 5 - Blue Ridge, GA 30513<\/p><p>Phone - 706 - 632 - 3711<\/p>", "loc": [34.917735, -84.37433], "pin": "medical_facilities", "id": "hospital"}, {"title": "Piedmont Mountainside Emergency Services", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p><p>Location: 370 West Highlands Drive, Suite 150, East Ellijay, GA 30540<\/p><p>Phone (Emergency Department): (706) 515-4000<\/p><p>Website: Part of the Piedmont Healthcare system—same emergency-level care as the Jasper hospital <\/p>", "photo": "d49e811b54e9573e816c6b5494fb3ba9.jpg", "id": "piedmont-mountainside-emergency-services"}, {"title": "Police", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p><p>Fannin County Sheriff's Office<\/p><p>Address: 645 W First Street Blue Ridge, GA 30513<\/p><p>Phone - 706 - 632 - 6022<\/p>", "loc": [34.864471, -84.327211], "pin": "police", "id": "police"}]}]}, "fishing": {"id": "fishing", "title": "Fishing", "icon": "fish", "groups": [{"title": "", "items": [{"title": "Bowman Fly Fishing Service", "html": "<p><a href=\"https://www.bowmanflyfishing.com/\">https://www.bowmanflyfishing.com/<\/a><\/p><p>706 - 963 - 0435<\/p><p>Specializing in fly fishing trips around Ellijay, Bowman Fly Fishing offers half and full-day trips, as well as lessons for those new to the sport. They focus on local rivers and streams such as the Cartecay River, Coosawattee River, and Mountaintown Creek<\/p>", "photo": "4bceccd5ebf5f223e7ffd258161cc9da.jpg", "id": "bowman-fly-fishing-service"}, {"title": "Cap'n Hoek Fishing Adventures", "html": "<p><a href=\"https://www.ellijayfishingtrips.com/\">https://www.ellijayfishingtrips.com/<\/a><\/p><p>706-889-3298<\/p><p>Operating in North Georgia, including Ellijay, Cap’n Hoek offers expert-guided fishing trips targeting walleye, striped bass, yellow perch, and spotted bass. They provide various trip lengths, including 4-hour, 6-hour, and 10-hour options, as well as night fishing trips<\/p>", "photo": "0077537530af2992d38a0e313558dc2e.jpg", "id": "capn-hoek-fishing-adventures"}, {"title": "Lake and Stream Guide Service", "html": "<p>https://ellijayfishing.com/<\/p><p>(706) 669 - 4973<\/p><p>Based in Ellijay, this year-round professional fishing guide service offers personally tailored trips on Carters Lake, Lake Blue Ridge, Lake Nottely, and several private trout streams. They specialize in catching walleye, striped bass, trout, and more using light tackle.<\/p>", "photo": "48aed831f86adc502a9b9cb91be514b7.jpg", "id": "lake-and-stream-guide-service"}, {"title": "Reel 'Em In Guide Service", "html": "<p><a href=\"https://reeleminguideservice.com/index.html\">https://reeleminguideservice.com/index.html<\/a><\/p><p>(706) 273-0764<\/p><p>This professional fly fishing guide service offers wade and drift boat trips in North Georgia, including the Ellijay area. They cater to both beginners and experienced anglers, providing access to public and private trophy trout waters.<\/p>", "photo": "80c783a39e6a8595a4263447932cffed.jpg", "id": "reel-em-in-guide-service"}]}]}, "golf": {"id": "golf", "title": "Golf", "icon": "flag", "groups": [{"title": "", "items": [{"title": "Copper Basin", "html": "<p>A 9-hole course known for its friendly atmosphere and beautiful surroundings, suitable for golfers of all skill levels. <\/p>", "loc": [35.023996, -84.32532], "pin": "golfing", "id": "copper-basin"}, {"title": "Old Toccoa Farm", "html": "<p><a href=\"http://www.oldtoccoafarm.com/\">http://www.oldtoccoafarm.com/<\/a><\/p><p>A SEMI-PRIVATE course welcoming public play six days a week, featuring a meticulously designed layout along the Toccoa River.<\/p>", "loc": [34.925818, -84.332214], "pin": "golfing", "id": "old-toccoa-farm"}, {"title": "Whitepath", "html": "<p>http://golfwhitepath.com/<\/p><p>An 18-hole course with a challenging yet enjoyable experience, scenic mountain views and well-maintained greens<\/p>", "loc": [34.755447, -84.439113], "pin": "golfing", "id": "whitepath"}]}]}, "grocery": {"id": "grocery", "title": "Grocery and Pharmacy", "icon": "shopping-cart", "groups": [{"title": "Groceries Upon Arrival", "items": [{"title": "Grocery Delivery Service", "html": "<p>Would you like a fully stocked fridge waiting for you upon arrival? Vacation is supposed to be relaxing, and the last thing you should worry about is heading to the store on a supply run. We can make sure all your groceries are delivered beforehand.<\/p><p>If you're looking to have groceries stocked upon arrival—or want to elevate your stay with holiday décor, birthday surprises, balloons, signage, or special equipment—we’ve partnered with Cabin Concierge to take care of it all.<\/p><p>Simply reach out to Jessica using the link below or via her direct cell, and she’ll handle the rest.<\/p><p><a href=\"http://www.brcabinconcierge.com\">http://www.brcabinconcierge.com<\/a><\/p><p>Jessica - 706 - 455 - 3280<\/p>", "photo": "0b63de10e92ff000000e2452531ad49c.jpg", "id": "grocery-delivery-service"}, {"title": "Mountainside Market", "html": "<p><strong>Phone<\/strong>: +1 - 706 - 946 - 5505<\/p><p><a href=\"https://mountainsidemarket.net/\">https://mountainsidemarket.net/<\/a><\/p><p>Just Down the Street! <\/p><p>Truly a unique - back country Blue Ridge Experience ;)<\/p>", "photo": "8327cdf511e6a77de93216f8106d1f3f.jpg", "loc": [34.8968496, -84.4546591], "pin": "grocery_shopping", "id": "mountainside-market"}]}, {"title": "Grocery / Pharmacy", "items": [{"title": "CVS Pharmacy", "html": "<p><strong>CVS Pharmacy - Blue Ridge<\/strong><\/p><p>Phone: +1 (706) - 632 - 8097<\/p>", "photo": "bd637c3e96aa3b09d786560df40e48bb.jpg", "loc": [34.875477, -84.299752], "pin": "pharmacy", "id": "cvs-pharmacy"}, {"title": "Huff’s Drug Store", "html": "<p>Website: <a href=\"https://northgeorgiapharmacies.com/huffs-drug-store/\">https://northgeorgiapharmacies.com/huffs-drug-store/<\/a><br>Phone: (706) 635-7931<br>Address: 136 Industrial Boulevard, Ellijay, GA 30540<\/p><p>A family-owned staple since 1949, Huff’s welcomes you with personalized service you can trust. Their pharmacy offers prescription refills, vaccinations (walk-ins welcome), compounding services, medication packaging solutions, and a loyalty rewards program. A quintessential local experience with homey charms and modern conveniences. <\/p>", "photo": "1edeeefa4c31f03d8f9eae4023a0350b.jpg", "id": "huffs-drug-store"}, {"title": "Ingles Markets", "html": "<p>Website: <a href=\"https://www.ingles-markets.com/\">https://www.ingles-markets.com/<\/a> <\/p><p>Phone: (706) 635-2585<\/p><p>Address: 100 Old Orchard Square, Ellijay, GA 30540<\/p><p>Ingles is Ellijay’s full-service supermarket, offering fresh produce, meats, bakery items, deli, household goods, and even a pharmacy. It’s a convenient one-stop shop for families, with a wide range of local and organic products. Open daily from 7 AM – 11 PM.<\/p>", "photo": "63935ffef88b224144053eac8092d1c1.jpg", "id": "ingles-markets"}, {"title": "Walmart Supercenter", "html": "<p>Website: <a href=\"https://www.walmart.com/store/1073/ellijay-ga\">https://www.walmart.com/store/1073/ellijay-ga<\/a> <\/p><p>Phone: (706) 276-1170<\/p><p>Address: 88 Highland Crossing S, Ellijay, GA 30540<\/p><p>For convenience and variety, Walmart Supercenter carries everything from groceries and household goods to clothing and electronics. With extended hours and grocery pickup available, it’s perfect for quick and easy shopping. Open daily from 6 AM – 11 PM.<\/p>", "photo": "76aa2a8432801f0be219b677fdefc57d.jpg", "loc": [34.877121, -84.325159], "pin": "grocery_shopping", "id": "walmart-supercenter"}]}]}, "hiking-biking": {"id": "hiking-biking", "title": "Hiking and Biking", "icon": "mountain", "groups": [{"title": "", "items": [{"title": "Aska Adventure Area", "html": "<p><strong>(More Difficult)<\/strong><\/p><p>The Aska Adventure Area is a hiking-mountain bicycling trail system 17.0 miles in length developed on National Forest lands near Deep Gap on the Aska Road in south central Fannin County. Go to the link below for a trail map guide.<\/p><p><a href=\"http://s3.amazonaws.com/blueridge-2018/documents/7OutdoorAskaTrailSystem-2020.pdf\">http://s3.amazonaws.com/blueridge-2018/documents/7OutdoorAskaTrailSystem-2020.pdf<\/a><\/p>", "photo": "8a4f54a70684ccb8544674dc0c1ecded.jpg", "loc": [34.816556, -84.29956], "pin": "hiking", "id": "aska-adventure-area"}, {"title": "Bear Creek Trail (Mountain Biking & Hiking)", "html": "<p>Website: <a href=\"https://www.atlantatrails.com/hiking-trails/bear-creek-trail/\">https://www.atlantatrails.com/hiking-trails/bear-creek-trail/<\/a> <br>Trailhead: FS 241, Ellijay, GA 30540<br>Phone: (706) 635-7400 (Chattahoochee-Oconee National Forest)<\/p><p>A favorite among mountain bikers, this 6-mile trail winds through forests, streams, and the historic Gennett Poplar (a 300-year-old tree). It’s moderate in difficulty and perfect for adventurous guests who love biking or trail running.<\/p>", "photo": "67dc7943207c41a42289f0816de7ecff.jpg", "id": "bear-creek-trail-mountain-biking-hiking"}, {"title": "Biking Routes & Access Points", "html": "<p>The biking trails of Fannin County include some of the most varied and exciting routes in all of North Georgia. Two-lane paved roads, Forest Service all-weather gravel roads, and single track, wind throughout our area. This <a href=\"http://s3.amazonaws.com/blueridge-2018/documents/6OutdoorBiking-2021web.pdf\">guide<\/a> shows access points. <\/p><p>Pedego Electric Bikes at 257 E. Main St. in Blue Ridge offers e-bike rentals and guided tours. Start with good maps and great advice from locals. Their website is <a href=\"https://pedegoelectricbikes.com/dealers/blue-ridge/\">here<\/a>.<\/p>", "photo": "b72be423c7e7a44b72d20d904d34b1ef.jpg", "loc": [34.870291, -84.319379], "pin": "sightseeing", "id": "biking-routes-access-points"}, {"title": "Carters Lake Trails", "html": "<p>Website: <a href=\"https://www.sam.usace.army.mil/Missions/Civil-Works/Recreation/Carters-Lake/\">https://www.sam.usace.army.mil/Missions/Civil-Works/Recreation/Carters-Lake/<\/a> <br>Phone: (706) 334-2248<br>Location: Carters Lake Visitor Center, 975 Powerhouse Rd, Chatsworth, GA 30705<\/p><p>Just 20 minutes from Ellijay, Carters Lake features peaceful lakeside hiking and biking trails. The Big Acorn Trail and Hidden Pond Songbird Trail are family-friendly, while experienced hikers can explore rugged paths along the shoreline.<\/p>", "photo": "e587a371039250d20db0ef5e5371e59c.jpg", "id": "carters-lake-trails"}, {"title": "Fall Branch Falls Trail", "html": "<p><strong>(Least Difficult)<\/strong><\/p><p>This short, beginner-friendly adventure on the Benton MacKaye Trail explores a scenic, lush forest and visits one of Georgia’s most beautiful waterfalls. While the hike to Fall Branch Falls is nearly all uphill, and mildly challenging, it’s well worth the effort: the waterfall’s double cascades are simply beautiful, framed in gnarly-branched rhododendron and mossy, blocky rocks. It’s one of the top easy hikes near <a href=\"https://www.atlantatrails.com/blue-ridge-georgia/\">Blue Ridge<\/a>, thanks to its relatively short distance and wonderfully scenic beauty. Mossy forest, a clear mountain trout stream, and abundant sweet-smelling Georgia forest air are all highlights on this great hike, not to mention
