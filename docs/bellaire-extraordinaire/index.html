<script type="application/json" id="guide-data">{"slug": "bellaire-extraordinaire", "name": "Bellaire Extraordinaire", "shortName": "Bellaire Extraordinaire", "welcome": "Welcome!", "hostedBy": "Hosted By Brandon & Katharina", "address": "4872 Valley View Road, Bellaire, MI 49615", "location": [44.956418, -85.191845], "cover": "bellaire-extraordinaire-view.jpg", "coverDesktop": "bellaire-extraordinaire-view.jpg", "background": "bellaire-extraordinaire-view.jpg", "contact": {"phone": "404-358-1552", "sms": "404-358-1552", "email": ""}, "gate": true, "oldLinks": ["/guest/bjvNNoADYXaMF/"], "layout": [{"heading": "Your Stay", "sections": ["add-to-phone", "welcome", "check-in-arrival", "check-out-departure", "rules", "cancellation-policy", "about-us", "contact-us"]}, {"heading": "The Home", "sections": ["sauna", "bbq-grill", "fireplace-firepit", "hot-tub", "indoor-games-fun", "kitchen", "laundry", "outdoor-games-fun", "playground", "pool", "thermostat", "trash", "tv-streaming", "wifi"]}, {"heading": "Explore the Area", "sections": ["beer-wine", "dining", "emergency", "fishing", "golf", "grocery", "hiking-biking", "nature-parks", "schuss-mountain", "shanty-creek", "shopping", "shorts-brewing", "spas-salons", "tours", "water-activities", "weather"]}], "sections": {"add-to-phone": {"id": "add-to-phone", "title": "Add This Guide To Your Phone", "icon": "smartphone", "groups": [{"title": "", "items": [{"title": "Add This Guide To Your Phone", "html": "<p>When you first access this guidebook on your phone, you'll notice a prompt to add it to your home screen. <strong>This is highly recommended<\/strong> because it makes the guide faster and easier to access. And it remains accessible offline. <\/p><p>Following the prompt will add an app icon to your phone. It's just like any other app, but without you needing to download anything or sign in! <\/p><p>Doing this means that every time you want to access the guide, you just need to tap the app instead of searching for the link in your inbox - much easier! <\/p><h2><strong>Adding the app if you’re an Apple user<\/strong><\/h2><p>If you have an Apple device, the \"Add to Home Screen\" option won’t appear for you unless you’re using Safari browser. Don’t worry, this is really simple to solve - just copy the guidebook link and paste it into Safari. From there, you can follow the prompts to add the guidebook to your home screen.<\/p><h2><strong>Always get the latest version of the guidebook <\/strong><\/h2><p>Our guidebook is regularly updated with information designed to help you get the most out of your stay. To avoid missing out on any of these updates, the app automatically updates every 24 hours. If you want to get the updates sooner, just refresh the screen every time you open the guidebook from your home screen - this way you’ll always get the latest version. To refresh the app, swipe the app closed, and tap the app icon again to fully reload. <\/p><h2><strong>Share your guide with your group<\/strong><\/h2><p>You can send the link to this guidebook to everyone who’s travelling with you. That way, everyone has access to all the information they’ll need (which means less hassle for the trip organizer!). <\/p>", "photoHidden": "eb62c72e322ed4e278d8a01199f7aad2.jpg", "id": "add-this-guide-to-your-phone"}]}]}, "welcome": {"id": "welcome", "title": "Welcome", "icon": "cloud-sun", "groups": [{"title": "", "items": [{"title": "Welcome to Bellaire Extraordinaire!", "html": "<p><strong>Welcome to the Bellaire Extraordinaire!<\/strong><\/p> <p>Here is everything you need for your stay with us, from planning your time prior to departure to the Shanty Creek area, all the way through checkout. In this easy-to-navigate link, you will find information about the cabin, ideas of things to do in the area, our Wi-Fi login credentials, and so much more.<\/p> <p>In order to best enjoy your time in our home, we encourage you to add this \"app\" to your phone. All of the content will even be accessible when your phone is offline.<\/p> <p>* It's not really an \"app\", but more a tool for easy access on your home screen <\/p> <ul> <li>For iPhone: <ul> <li>Tap the square with arrow pointing up at the bottom of your screen<\/li> <li>Select \"Add to Home Screen\"<\/li> <\/ul> <\/li> <li>For Android: <ul> <li>Tap \"Add to Home Screen\" where prompted when first accessing the site<\/li> <\/ul> <\/li> <\/ul> <p><strong>Print or Save a PDF<\/strong><br/>If you would like to print certain pages ahead of traveling, or if you'd like to save a PDF to your device, just tap the print button above. It won't print right away, but will create a PDF which you can save or print.<\/p> <p><strong>Contacting Us<\/strong><br/>We pride ourselves on swiftly meeting guest needs. We can be reached as follows:<\/p> <ul> <li>Preferred: Airbnb or VRBO message<\/li> <li>Phone: 404-358-1552 (emergencies)<\/li> <li>Instagram: @<a href=\"https://www.instagram.com/bk_stays/\">Bk_stays<\/a><\/li> <li>Facebook: <a href=\"https://www.facebook.com/profile.php?id=61551815370553\">BK Stays<\/a><\/li> <\/ul> <p><strong>What Next?<\/strong><br/>Please relax, unwind, have fun, and enjoy your stay!<\/p>", "photo": "7bcc0652563713a3e3bcac72e762528a.jpg", "id": "welcome-to-bellaire-extraordinaire"}, {"title": "Thank You", "html": "", "video": "https://www.loom.com/embed/6e28b513a12d4fa58ae2634d716df0c4", "id": "thank-you"}]}]}, "check-in-arrival": {"id": "check-in-arrival", "title": "Check In + Arrival", "icon": "key-round", "groups": [{"title": "", "items": [{"title": "Driving Directions", "html": "<p>We could post turn-by-turn directions here.<\/p> <p>OR - you could just use <strong>Waze or Google Maps<\/strong>.<\/p> <p>Either option will get you to the home ;)<\/p> <p><strong>Address: 4872 Valley View Road - Bellaire Michigan, 49615<\/strong><\/p>", "photo": "086591e685171217b89de3694e2b3326.jpg", "id": "driving-directions"}, {"title": "Access Codes / Instructions", "html": "<p>IMPORTANT! - Sometimes you need to pull the front door tighter/closed more for the door lock to slide open to unlock smoothly. <\/p> <p>The Access Code for the front door is<\/p> <p>1552<\/p> <p>To lock the door, simply press the lock button. Please make sure all external doors are locked whenever you leave.<\/p> <p>* If for some reason the code doesn't work please call me at <a href=\"tel:404-358-1552\">404-358-1552<\/a>. I will get you the lockbox code for the spare key!<\/p>", "photo": "730742e2babb8d2cedbe0a30eac61d46.jpg", "id": "access-codes-instructions"}, {"title": "4:00 PM Check-in", "html": "<p>If you would like an early check-in, please see our <a href=\"#/info/check-in-arrival/early-check-in-half-day-stay-option\">Early Check In (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 4:00 PM is a strict check-in time. If you are arriving early, take a look at the Local Recommendation section. We've listed a few things to do around the area while we prepare the home!<\/p>", "photo": "11e339c716ed8af07a28c05e286c2caa.jpg", "id": "4-00-pm-check-in"}, {"title": "Early Check In (Half Day Stay Option)", "html": "<p>Want to get here early? Add a <strong>Half Day Stay<\/strong> and you can arrive as early as <strong>8:00 AM<\/strong> on your arrival day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer early check-in because of our tight cleaning and maintenance schedule.<\/p>", "photo": "6db9b8952aaf5792e4af093537545794.jpg", "id": "early-check-in-half-day-stay-option"}]}]}, "check-out-departure": {"id": "check-out-departure", "title": "Check Out + Departure", "icon": "hand", "groups": [{"title": "", "items": [{"title": "10:00 AM Check-out", "html": "<p>If you would like a late check-out, please see our <a href=\"#/info/check-out-departure/late-check-out-half-day-stay-option\">Late Check Out (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 10:00 AM is a strict check-out time. <\/p>", "photoHidden": "ea9c00f35f36edb8d89dcc92e7f562cc.jpg", "id": "10-00-am-check-out"}, {"title": "Late Check Out (Half Day Stay Option)", "html": "<p>Not ready to leave? Add a <strong>Half Day Stay<\/strong> and you won't need to check out until <strong>8:00 PM<\/strong> on your departure day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer late check-out because of our tight cleaning and maintenance schedule.<\/p>", "photoHidden": "6db9b8952aaf5792e4af093537545794.jpg", "id": "late-check-out-half-day-stay-option"}, {"title": "Extended Stay?", "html": "<p>Would you like to add another night? If we have availability the day before or after your reservation, we would love to offer you that extra night at a great discount. We'll even cover the taxes and fees! Just let us know if your travel plans are flexible and we will make sure to accommodate the changes!<\/p>", "photoHidden": "585cb6b5ac72b31289b8dae13c068a03.jpg", "id": "extended-stay"}, {"title": "Check-out Process", "html": "<p>Standard check-out is at 10:00 AM on your departure date (Unless you've paid for a late check-out). <\/p> <p>When you've finished your stay, technically, you can just leave no questions asked lol :) But, if you really wanted to give our cleaning team some love, we would appreciate it if you would take care of a few simple things:<\/p> <ul> <li>Dishwasher - Load and start the dishwasher<\/li> <li>Grill - Please Properly Clean It After Use (<a href=\"#/info/bbq-grill\">Grill Safety<\/a>)<\/li> <li>Jacuzzi - Close and lock the lid <\/li> <li>Sauna - Close the door.<\/li> <li>Towels - Place all used towels in the shower.<\/li> <li>Trash - Bag and secure any loose trash and place in the blue bins next to the garage.<\/li> <li>Lock Up - Lock all doors<\/li> <\/ul> <p>We hope you guys had an amazing stay! Thank you again and safe travels back home.<\/p>", "id": "check-out-process"}, {"title": "Lost and Found", "html": "<p>Please triple-check the home before departing to ensure you have not left anything behind. Common items left behind include phone chargers, computer cords, passports/licenses, clothes, electronics, eyeglasses, toiletries/makeup, documents, and toys.<\/p><p>Please send a message the moment you realize you've left something behind. <br><br>We completely understand that things can get left behind — and we’re more than happy to help get your items back to you! We’ll gladly ship your lost item using the postal service or carrier of your choice (standard, express, or overnight). <br><br>We kindly ask for the shipping cost, plus a $20 service fee to cover the time and materials for packaging and handling. Be certain to include:<\/p><ul><li>Item description<\/li><li>Where you think you may have left the item<\/li><li>The name on the reservation<\/li><\/ul><p>Just let us know how you’d like it sent, and we’ll take care of the rest!<\/p>", "photoHidden": "8da278ec14e085d81ebe06c22b24af10.jpg", "id": "lost-and-found"}]}]}, "rules": {"id": "rules", "title": "Rules and Regulations", "icon": "book-open", "groups": [{"title": "", "items": [{"title": "Age Requirement", "html": "<p>The minimum age requirement to book is 25 years of age. The home is child friendly, but not childproof, and may not be suitable for infants or children without adult supervision.<\/p>", "id": "age-requirement"}, {"title": "Blackstone Care and Maintenance", "html": "<p>* Please Review - Blackstone Grills Require Proper Clean Up. <\/p> <p>If you use the Blackstone - you are required to clean up after yourselves. A Blackstone requires more care than a usual grill, so I have posted a YouTube video below on how to properly clean the Blackstone After Each Use. Please refer to it for assistance. <\/p> <p><a href=\"https://youtube.com/shorts/01xbSZUQimw?feature=shared\">https://youtube.com/shorts/01xbSZUQimw?feature=shared<\/a><\/p> <p>Please Dump All Grease In a Sealed/Tied Trash Bag &amp; Dispose of it Properly. Do Not Pour Grease Down the Drain or Anywhere On The Property.<\/p> <p>Extra Cleaning Measure Fines Could Be Assessed if Blackstone is Not Properly Maintained.<\/p>", "id": "blackstone-care-and-maintenance"}, {"title": "Confetti / Glitter", "html": "<p><strong>No Confetti or Glitter<\/strong><br>We understand that special occasions call for celebration - and sometimes decorations! However, confetti and glitter are extremely difficult to clean and can cause damage to furniture and floors. Any evidence of confetti or glitter left behind will incur additional cleaning fees. Please celebrate responsibly and help us keep the home in great condition - no confetti or glitter, please.<\/p>", "id": "confetti-glitter"}, {"title": "Damages", "html": "<p>Guests are financially responsible for any damage, theft, missing items, or violations of house rules during their stay. You could be charged for: Property damage or theft; Unauthorized pets; Excessive cleaning or evidence of smoking; Exceeding occupancy or parking limits; Any other violations outlined in this agreement. You will be notified in writing if any damage is found. Major damage that delays the next check-in may result in additional charges for guest relocation or compensation. Please report any existing damage at check-in, and notify us right away if anything breaks or is damaged during your stay, even if it’s small. We understand accidents happen and can often replace or repair items quickly if we're informed. Guests are responsible for damage caused by misuse or negligence.<\/p>", "id": "damages"}, {"title": "Fire Safety and Prevention", "html": "<p>Guest agrees to comply with all local, county, and state fire restrictions, including any active burn bans or official fire safety regulations. Guest is responsible for helping maintain a fire-safe environment throughout their stay. This includes, but is not limited to; Ensuring that all outdoor fires (e.g., bonfires or fire pits) are fully extinguished after use, before going to bed, and before vacating the property; Never leaving open flames or burning embers unattended; Using only designated fire areas and keeping all fires small, controlled, and manageable; Ensuring fire extinguishers located in the home are accessible at all times and used in case of fire emergencies.<\/p><p>Additionally, Guest(s) acknowledges that outdoor grills must be cleaned and properly maintained after each use to prevent fire hazards. Guest agrees to: Clean the grill thoroughly after each use; Remove all grease and dispose of it safely in the trash (never on the ground or around the property); Ensure the grill is turned off, left in safe, clean, and operable condition, and covered if applicable; Keep a fire extinguisher nearby when using the grill.<\/p><p>Failure to follow fire safety guidelines may result in fines, eviction, or financial liability for any resulting damages.<\/p>", "id": "fire-safety-and-prevention"}, {"title": "Jacuzzi", "html": "<p>Never Add Any Foreign Substance To The Jacuzzi (No Bubbles or Soaps)!<\/p><p>Always Put The Cover Back On When Not In Use!<\/p><p>Do Not Raise The Temp Above 102*F<\/p><p>The jacuzzi is thoroughly inspected after each guest. Failure to adhere will cause additional maintenance and cleaning measures, or worse, damage to the unit. Fines will be imposed if evidence of foreign substance or damage is found during inspection. <\/p>", "photoHidden": "48bb72faa971ea5dfe16fe828d5fc5ee.jpg", "id": "jacuzzi"}, {"title": "Noise Monitoring", "html": "<p>We ask that you please be respectful of our neighbors. The City and HOA have certain noise regulations for residential areas.<\/p> <p>This property is equipped with devices that monitor noise levels (but do not record sound) and alert the host if it gets too loud.<\/p> <p>If there are multiple noise issues you could be charged or even removed from the home.<\/p>", "id": "noise-monitoring"}, {"title": "Occupancy - Max 14 Persons (Age 2+)", "html": "<p>There are many sleeping options, but still limited square footage. Therefore - we try not to overcrowd our home. The maximum guest limit is 14 persons (age 2+) unless otherwise approved. Please reach out prior to arrival if you have any additional capacity requests. Any unapproved guest overcapacity will be charged an additional fee.&nbsp;<\/p>", "id": "occupancy-max-14-persons-age-2"}, {"title": "Parking Rules - HOA Regulated", "html": "", "id": "parking-rules-hoa-regulated"}, {"title": "Pet Policy - Max 2 Dogs (with approval)", "html": "<p>This home is pet-friendly, so you can bring your furry friend from home! <strong>MAX 2 DOGS ALLOWED<\/strong> per stay, with approval. Hypoallergenic breeds are preferred.<\/p><p>All pets must be on your reservation. Please let us know beforehand so we can take the proper cleaning measures. A <strong>$150 pet fee<\/strong> will be added to your reservation for any approved pet before arrival.<\/p><p>If you bring a pet without notifying your hosts, you will be charged <strong>double<\/strong> for any unapproved pet.<\/p>", "id": "pet-policy-max-2-dogs-with-approval"}, {"title": "Reservation Adjustments", "html": "<p>If you need to make any change in your stay, for example, regarding the number of guests, bringing a service animal or anything at all, please let us know ahead of time so we can accommodate you. However, if you do not disclose any changes, like an animal or extra guests (above max occupancy) you could be subject to a reservtion cancellation without refund. <\/p>", "id": "reservation-adjustments"}, {"title": "Security Camera", "html": "<p>Guests acknowledge and accept there are cameras located on the exterior of the property. Guests hereby acknowledge that the cameras location records video directly in front of the front entrance door and leading to the parking area, and this constitutes a public area. Guests understand that video may be captured, and no conversations located within this area may be deemed confidential. The intent of this camera is not to infringe on the privacy of Guests, but to serve as a safety and security measure.<\/p>", "id": "security-camera"}, {"title": "Septic and Plumbing", "html": "<p>Please ONLY PUT TOILET PAPER in the toilet and throw the remaining in the trash!<\/p><p>Tampons, baby wipes, paper towels, or anything other than toilet paper in the toilet will clog the drain/tank. This can result in clogged toilets, and septic damage and will result in damage fees.<\/p>", "id": "septic-and-plumbing"}, {"title": "Smoking", "html": "<p>We have a strict No Smoking Policy. Smoking is not allowed on the property in any form. This includes, but is not limited to marijuana, pipes, cigars, cigarettes, vaping, e-cigs, etc. If our cleaners or cameras report evidence of smoking you will be charged a 500$ smoke remediation fine. <\/p>", "id": "smoking"}, {"title": "Trash", "html": "<p>Trash bins are located outside on the (south) side of the garage. Trash pick-up is on Tuesday mornings. Revolution Waste will come up to the house and empty the cans.&nbsp;<\/p> <p>PLEASE BAG ALL OF YOUR TRASH!<\/p> <p>NO LOOSE TRASH THROWN STRAIGHT IN THE CAN!<\/p> <p>Thank You!<\/p>", "id": "trash"}]}]}, "cancellation-policy": {"id": "cancellation-policy", "title": "Cancellation Policy", "icon": "circle-x", "groups": [{"title": "", "items": [{"title": "Cancellation Policy", "html": "<p>Our cancellation policy varies by platform (Airbnb, VRBO, Direct, etc.) and will have been clearly stated at the time of booking under one of the following categories: strict, firm, moderate, or flexible.<\/p><p>We strongly recommend purchasing travel insurance to protect your investment. If you purchased travel insurance, please contact your provider for help with cancellations or disruptions.<\/p><p><strong>State of Emergency / Evacuations<\/strong><\/p><p>If travel insurance was not purchased, cancellations are handled per the terms of your reservation. Exceptions may be made only when <strong>both<\/strong> of the following apply:<\/p><ul><li>A <strong>Governor-issued State of Emergency<\/strong> has been declared for <strong>Antrim County, Michigan<\/strong> (the county where the home is located), <strong>and<\/strong><\/li><li>A <strong>mandatory evacuation order or travel restriction<\/strong> is actively in effect for the property's address during your reservation dates.<\/li><\/ul><p>General weather advisories or conditions affecting other areas do not qualify.<\/p><p><strong>If the Home Becomes Unavailable<\/strong><\/p><p>In the event the property becomes unavailable due to circumstances beyond the host's control, including but not limited to fire, flood, structural damage, utility failure, or a government-declared emergency, the host reserves the right to cancel a confirmed reservation. In such circumstances, guests will receive a full refund of all amounts paid and the host's liability shall be limited solely to that refund.<\/p>", "id": "cancellation-policy"}]}]}, "about-us": {"id": "about-us", "title": "About Us", "icon": "users", "groups": [{"title": "", "items": [{"title": "About Your Hosts", "html": "<p>Our first trip to North Georgia was way back in the summer of 2021 and we undeniably fell in love. The mountain vibes left such a good impression, that we decided as a family to find a home away from home. The surrounding area has so much to offer for families, friends, and couples during every season of the year. We have had the chance to experience so much that Blue Ridge, Ellijay, and the North Georgia Mountains have to offer, but we still have a long bucket list waiting for our next adventure. We have a 6-year-old daughter and a 3-year-old son and love traveling and spending time exploring new places as a family.<\/p>", "photo": "about-us-family-collage.jpg", "photoFit": "full", "id": "about-your-hosts"}]}]}, "contact-us": {"id": "contact-us", "title": "Contact Us / Book Again", "icon": "phone", "groups": [{"title": "", "items": [{"title": "Thank You For Staying With Us", "html": "<p><strong>Thank you for staying with us, and we hope you enjoyed your stay.<\/strong> If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time. <\/p><p><strong>We love online reviews!<\/strong><\/p><p>Vrbo and Airbnb automatically sends you a review request. All you need to do is click the \"leave a review\" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. Was it the comfy beds; the local information and recommendations; or perhaps the location and all the fun activities to do at the home?<\/p><p><br><strong>Thank you!<\/strong><\/p><p>Brandon and Katharina <\/p>", "photoHidden": "4d239b49ed0744691981d3decf88b377.jpg", "id": "thank-you-for-staying-with-us"}, {"title": "Returning Guests", "html": "<p>We would love to have you stay again! In fact, please take advantage of booking directly with us at <a href=\"https://www.bkstays.com/about-us\">bkstays.com <\/a>- please reach out to us on Instagram, Facebook, or directly to Brandon at 404 - 358 - 1552. <\/p>", "photoHidden": "5e53f078d45d701f01a19dcba10f0cc7.jpg", "id": "returning-guests"}, {"title": "Follow Us On Social Media", "html": "<p>Let's Be Social! Follow Us On Social Media Below<\/p><p>Facebook: BK Stays<\/p><p>Instagram: @bk_stays<\/p>", "photoHidden": "067e96592ab64bb41d8e0f51c9754500.jpg", "id": "follow-us-on-social-media"}, {"title": "How To Contact Us", "html": "<p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.  We can be reached at the contact info below:<\/p><ul><li>Message: through Airbnb / VRBO (simple assistance)<\/li><li>Phone: 1-404-358-1552 (emergencies)<\/li><li>Instagram or Facebook @ bk_stays<\/li><\/ul>", "photoHidden": "4f717eaaf0303b1fec1a0ee821f299a1.jpg", "id": "how-to-contact-us"}]}]}, "wifi": {"id": "wifi", "title": "WiFi / Internet Details", "icon": "wifi", "groups": [{"title": "", "items": [{"title": "WIFI / Internet Details", "html": "<p>There is free Wi-Fi for your use. The details are: <br><br>WIFI Name: bk stays<\/p> <p>Do Not Use \"4872 Valley View Road\" - this network is only for the Smart TV's<br><br>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us.<\/p>", "photo": "5ed7c444a9811d008c50a348f27c69d5.jpg", "id": "wifi-internet-details"}]}]}, "sauna": {"id": "sauna", "title": "Barrel Sauna", "icon": "heater", "groups": [{"title": "", "items": [{"title": "Barrel Sauna", "html": "<p><strong>Please Read Before Use - See Photos Below.<\/strong><\/p> <p>The LEFT dial is the temperature - Min to Max etc. Leave the dial just slightly under MAX- don't crank it to full MAX.<\/p> <p>The RIGHT dial is the timer. Each number is for 1 hour, 2 hours, 3 hours, 4 hours etc.<\/p> <p><strong>Do Not Turn Past The \"First\" 1<\/strong><\/p> <ul> <li>If you go straight to the \"second 1\", 2, or 3 or more) or the heater WILL NOT start until 2/3 hours).<\/li> <li>That is a Delayed Start Setting ie. 1-2-3 hours later etc.&nbsp;<\/li> <\/ul> <p>Simply turn the dial to the first (1) and the heater will run on MAX for (1) Hour.<\/p> <p>Put the Left Dial Just Under Max, and Select 1 Hour on the Right Dial.<\/p> <p>Keep it Simple :)<\/p><p><img src=\"../img/0f4fb600698b3e46cd8da801e9f424c9.jpg\" alt=\"\"><\/p><p><img src=\"../img/9fa13818dfec6364b2badf43ae34e16b.jpg\" alt=\"\"><\/p>", "photo": "c5f4b10fff862a8a88552180e5737222.jpg", "id": "barrel-sauna"}]}]}, "bbq-grill": {"id": "bbq-grill", "title": "BBQ Grill + Propane", "icon": "flame", "groups": [{"title": "", "items": [{"title": "Propane Grill", "html": "<p>* Please Review - Blackstone Grills Require Proper Clean Up. <\/p> <p>If you use the Blackstone - you are required to clean up after yourselves. A Blackstone requires more care than a usual grill, so I have posted a YouTube video below on how to properly clean the Blackstone After Each Use. Please refer to it for assistance. <\/p> <p><a href=\"https://youtube.com/shorts/01xbSZUQimw?feature=shared\">https://youtube.com/shorts/01xbSZUQimw?feature=shared<\/a><\/p> <p>Please Dump All Grease In a Sealed/Tied Trash Bag &amp; Dispose of it Properly. Do Not Pour Grease Down the Drain or Anywhere On The Property.<\/p> <p>Extra Cleaning Measure Fines Could Be Assessed if Blackstone is Not Properly Maintained.<\/p>", "photo": "ac61be1f65ab53ff42e1974266b710a9.jpg", "id": "propane-grill"}, {"title": "Propane Tank(s)", "html": "<p>We TRY to keep a full propane tank (and an extra one) at the home. Most of the time we can get them swapped out before check in. Unfortunately, that's not always possible. We apologize if you did not find a full propane tank upon arrival!<\/p><p>We can try and coordinate another person to deliver you a new tank, but their availability might not be immediate. If you need something quick, we recommend running to the store and exchanging the empty one(s) or a new one - and yes of course we would be happy to reimburse you for the tank and your trouble! Just let us know. Thank You.<\/p>", "photo": "05f49508259ad5443ec6e6d70501e8b4.jpg", "id": "propane-tank-s"}]}]}, "fireplace-firepit": {"id": "fireplace-firepit", "title": "Fireplace + Firepit", "icon": "flame-kindling", "groups": [{"title": "", "items": [{"title": "Firepit / Firewood", "html": "<p>Due to insurance/safety reasons, we are not able to currently provide any firewood - but you are more than welcome to drop by any local convenience store or big box store and purchase as much as you'd like.<\/p><p>Never leave the fire unattended, and make sure to extinguish it before going to bed.<\/p><p>Please Be Safe! <\/p>", "photo": "bf621b035602d4c80205809ec482b264.jpg", "id": "firepit-firewood"}, {"title": "Fireplace", "html": "<p>Each unit is a 750/1500W electric fireplace. There is a remote for each room/unit. Please see photo below for how to operate the fireplace. If the remote isn't available there are manual directions on the unit itself.&nbsp;<\/p><p><img src=\"../img/aafff90909c933a811b916b52f867aeb.jpg\" alt=\"\"><\/p>", "photo": "8dc2d8e518bbf7185a8a2f3ec63c539c.jpg", "id": "fireplace"}]}]}, "hot-tub": {"id": "hot-tub", "title": "Hot Tub / Jacuzzi", "icon": "bath", "groups": [{"title": "", "items": [{"title": "Hot Tub / Jacuzzi", "html": "<p><strong>PLEASE READ BEFORE USING!&nbsp;<\/strong><\/p> <p><strong>Jacuzzi Quick Start Guide<\/strong><\/p> <p><strong>Jets (Pump 1)<\/strong><br>&bull; Press 1x for low. 2x for high.&nbsp;3x to turn off<\/p> <p><strong>Light<\/strong><br>&bull; Press Light to turn On or Off<br><strong>&bull; Do Not Hold the Light Button (enters programming mode)<\/strong><\/p> <p><strong>Temperature<\/strong><br>&bull; Press ▲ or ▼ to adjust temperature<br>&bull; Setting saves automatically after a moment<\/p> <p><strong>Air Bubbles<\/strong><br>&bull; Turn air knobs on the tub rim to adjust bubbles<br>&bull; Open = more bubbles<br>&bull; Closed = fewer bubbles<\/p> <p><strong>Important Notes<\/strong><br>&bull; Do not hold the Light button or attempt to access programming menus<br>&bull; Do not press buttons repeatedly or rapidly<br>&bull; Do not lean, sit, or push on the control panel<br>&bull; Do not force air knobs or diverters past their stopping point<\/p>", "photo": "48bb72faa971ea5dfe16fe828d5fc5ee.jpg", "id": "hot-tub-jacuzzi"}]}]}, "indoor-games-fun": {"id": "indoor-games-fun", "title": "Indoor Games + Fun", "icon": "gamepad-2", "groups": [{"title": "", "items": [{"title": "Cards, Games + More", "html": "<p>Located in the game room cabinet.<\/p><p>We try to keep a great selection of puzzles, books, board games, and card games for the whole family. Feel free to help yourself!<\/p><p>If something is missing or broken, please let us know so we can order a replacement.<\/p><p>Please keep everything neat and tidy for the next guests. Missing puzzle pieces or half a set of chess pieces isn't fun for anyone :)<\/p>", "photo": "b5ca8b0626d45f4d318ac82bf89da36b.jpg", "id": "cards-games-more"}, {"title": "Game Room Fun!", "html": "<p>This house is packed with indoor fun, including Shuffleboard, Foosball, Air Hockey, Darts, and a full set of poker chips with a playing table. Don't forget about the Arcade Games including Ms. Pacman, NBA Jam, Mortal Kombat, Golf, and Big Game Buck Hunter. If anything is missing or broken, PLEASE LET US KNOW IMMEDIATELY so we can order any replacements.&nbsp;<\/p>", "photo": "64f30dba2838c63a6607e0eb61a72896.jpg", "id": "game-room-fun"}]}]}, "kitchen": {"id": "kitchen", "title": "Kitchen, Supplies + Appliances", "icon": "cooking-pot", "groups": [{"title": "", "items": [{"title": "Kitchen + Supplies + Appliances", "html": "<p>We have a fully stocked kitchen with a stainless steel appliance package. We try to provide everything you may need, but we're not perfect. If you have ANY suggestions for small appliances, dishware, flatware, glassware, or even dry goods that would be beneficial - let us know! We would be happy to see if it's possible to place an Amazon/Walmart/Grocery delivery order for you during your stay :)<\/p>", "id": "kitchen-supplies-appliances"}]}]}, "laundry": {"id": "laundry", "title": "Laundry", "icon": "washing-machine", "groups": [{"title": "", "items": [{"title": "Laundry", "html": "<p>We do have a private washer and dryer located in the home. There should be a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in, close the door, and hit start. <\/p>", "photo": "794607d57a2c8fc964701bb9c7a73b7a.jpg", "id": "laundry"}]}]}, "outdoor-games-fun": {"id": "outdoor-games-fun", "title": "Outdoor Games", "icon": "target", "groups": [{"title": "", "items": [{"title": "Private Par 3 Course", "html": "<p>Feel free to enjoy our outdoor putting green! You can chip or hit from the \"tee box\" up near the playground. It's about a 50-yard par 3 hole.<\/p><p>Please be careful and always look out for everyone's safety, especially little ones near the playground.<\/p><p>We provide a small selection of balls and clubs. If anything is broken or missing, please let us know. When you're done, please return everything to its spot up near the house.<\/p>", "photo": "bellaire-putting-green.jpg", "id": "private-par-3-course"}, {"title": "Frisbee Golf", "photo": "746b9f26c3fd806efad2a79e3e952259.jpg", "html": "<p>Grab a disc and see who can make it into the basket in the fewest throws! We have a disc golf set on hand, and we provide a few discs.<\/p><p>If anything is broken or missing, please let us know. When you're done, please return the discs to their spot up near the house.<\/p>", "id": "frisbee-golf"}, {"title": "Cornhole / Bags", "html": "<p>Nothing beats a little friendly competition in the fresh mountain air! Grab the cornhole boards and bags, set them up outside, and enjoy the views while you play. Whether it's a quick game before dinner or a full-on family tournament, it's a great way to spend time outdoors together.<\/p><p>There should be a set of all-weather cornhole boards somewhere on the patio. If you notice anything is broken or missing, please let us know right away so we can order replacements. It would be very helpful if you would return them to a covered area after each day so they don't wander off or get ruined in the weather :)<\/p>", "photo": "9df12f8c833b036dda9b1e92c15acd40.jpg", "id": "cornhole-bags"}]}]}, "playground": {"id": "playground", "title": "Playground", "icon": "castle", "groups": [{"title": "", "items": [{"title": "Playground", "html": "<p>Children 12 and under!<\/p> <p>Probably our favorite playground in the area. No need to leave the home for the kids to burn off some energy! It&rsquo;s a safe and fun space for endless playtime. Please ensure an adult is always present and never leave children unattended.<\/p>", "photo": "89978b861bcdd0bf21ab4e8181b651e5.jpg", "id": "playground"}]}]}, "pool": {"id": "pool", "title": "Pool", "icon": "waves", "groups": [{"title": "", "items": [{"title": "Indoor Pool - at The Lakeview Hotel", "html": "<p>Located inside The Lakeview Hotel (Summit Village).<br>Open daily, year-round: 9:00 AM - 11:00 PM<\/p> <p><strong>*Pool Pass Required*<\/strong><\/p> <p>The Pool Pass is connected to a towel basket, and towels are provided by your host(s). You'll need to bring this pool pass and your own towels to the indoor pool. There are no towels provided by the resort.&nbsp;<\/p> <p><strong>Please return the pool pass, or you will be charged the $1,000 replacement charge.<\/strong><\/p>", "photo": "2cce4a84eac076d0d4f6425e73d7c174.jpg", "loc": [44.948575, -85.185078], "pin": "swimming", "id": "indoor-pool-at-the-lakeview-hotel"}, {"title": "Outdoor Pool - at The Lakeview Hotel", "html": "<p>Located outside The Lakeview Hotel (Summit Village).<br>Open daily during the summer season: 10:00 AM - 10:00 PM<\/p><p>The outdoor pool closes for the off-season. If you are visiting in spring or fall, please check with the Lakeview Hotel front desk to see if it is open.<\/p> <p><strong>*Pool Pass Required*<\/strong><\/p> <p>The Pool Pass is connected to a towel basket, and towels are provided by your host(s). You'll need to bring this pool pass and your own towels to the outdoor pool. There are no towels provided by the resort.&nbsp;<\/p> <p><strong>Please return the pool pass, or you will be charged the $1,000 replacement charge.<\/strong><\/p>", "photo": "6bf533891c3e89434a70168190bf8bf2.jpg", "loc": [44.948622, -85.18507], "pin": "swimming", "id": "outdoor-pool-at-the-lakeview-hotel"}, {"title": "Pool Waiver", "html": "<p>By reserving this home you have agreed to the following rules below.<\/p> <p><strong>Assumption of Risk:<\/strong><\/p> <p>We intend to utilize the swimming pool(s). We are aware and understand there are inherent risks associated with the use of these facilities and we recognize and fully understand the risks. We are aware and understand that our use of the swimming pool(s) is a potentially dangerous activity and involves the risk of personal injury, pain, suffering, temporary or permanent disability, death, property damage, and/or financial loss. We are aware and understand that at no time there will be a lifeguard on duty while we use such facilities. We are aware of and understand that the use of the pool facilities involve certain risks, including but not limited to:<\/p> <ul> <li>the risk of injury resulting from possible malfunction of pool equipment<\/li> <li>the risk of injuries resulting from tripping/falling over obstacles in the pool area.<\/li> <li>the risk of injuries resulting from unsupervised divers and swimmers colliding<\/li> <li>the risk of other injuries resulting from participating in any action in the pool<\/li> <\/ul> <p>We recognize and fully understand that the above list is not a complete or exhaustive list of all possible risks; the list only provides examples of types of risks we are assuming. <strong>NOTWITHSTANDING THESE RISKS, WE ACKNOWLEDGE THAT WE ARE VOLUNTARILY ACCESSING THE SWIMMING FACILITIES AND PARTICIPATING IN THE ACTIVITY WITH KNOWLEDGE OF THE DANGERS INVOLVED. WE HEREBY AGREE TO ACCEPT AND ASSUME ALL RISKS OF ILLNESS, PERSONAL OR PSYCHOLOGICAL INJURY, PAIN, SUFFERING, TEMPORARY OR PERMANENT DISABILITY, DEATH, PROPERTY DAMAGE, AND/OR FINANCIAL LOSS ARISING THEREFROM, WHETHER CAUSED BY THE ORDINARY NEGLIGENCE OF THE COMPANY/OWNER/HOST OR OTHERWISE.&nbsp;<\/strong><\/p> <p>We further agree that in exchange for being allowed to use the pool, I fully intent to and choose to give up legal rights and we agree TO WAIVE AND RELEASE ANY ANY AND ALL CLAIMS that we have or may have in the future against the resort/owner/host and representatives from any and all liability for any loss, damage, injury, expense, or other cost that we may suffer or that our next of kin may suffer in connection with our use of the Releasees pool or pool area to any cause whatsoever, INCLUDING NEGLIGENCE ON THE PART OF THE RELEASEES. We further agree TO HOLD HARMLESS AND INDEMNIFY THE RELEASEES from any and all claims, whether now known or hereafter known, and release all liability to the property, or personal injury to, any third party, resulting from the use of the pool or pool area. We further agree that this Waiver, Release, and Agreement is fully effective and shall be effective and binding upon us, and our heirs, next of kin, executors, administrators, and assigns or anyone else authorized to act on our behalf or on behalf of our estate.<strong> WE ACKNOWLEDGE THAT WE HAVE READ AND UNDERSTOOD ALL OF THE TERMS OF THIS RELEASE AND THAT WE ARE VOLUNTARILY GIVING UP SUBSTANTIAL LEGAL RIGHTS, INCLUDING THE RIGHT TO SUE THE RESORT/OWNER/HOST.<\/strong><\/p> <p>We further agree to abide by the posted rules listed below.&nbsp;<\/p>", "id": "pool-waiver"}, {"title": "Pool Rules", "html": "<p><strong>Pool Rules<\/strong><\/p> <ul> <li>No lifeguard on duty. Use at your own risk.<\/li> <li>The Owner/Host does not assume responsibility for any accidents or injuries.<\/li> <li>Absolutely no glass containers allowed.<\/li> <li>No food allowed<\/li> <li>No animals allowed<\/li> <li>No diving allowed<\/li> <li>No running, pushing, or other dangerous horseplay<\/li> <li>Please be considerate of other guests<\/li> <li>POOL TOWELS ARE NOT PROVIDED BY THE RESORT<\/li> <\/ul> <p>The resort management and/or owner/host reserves the right to deny use of the pool to anyone at any time. Please be considerate of others and help us maintain a safe and enjoyable environment.&nbsp;<\/p>", "id": "pool-rules"}]}]}, "trash": {"id": "trash", "title": "Trash", "icon": "trash-2", "groups": [{"title": "", "items": [{"title": "Trash", "html": "<p>Trash bins are located outside on the (south) side of the garage. Trash pick-up is on Tuesday mornings. Revolution Waste will come up to the house and empty the cans.&nbsp;<\/p> <p>PLEASE BAG ALL OF YOUR TRASH!<\/p> <p>NO LOOSE TRASH THROWN STRAIGHT IN THE CAN!<\/p> <p>Thank You!<\/p>", "id": "trash"}]}]}, "tv-streaming": {"id": "tv-streaming", "title": "TV's + Streaming", "icon": "tv", "groups": [{"title": "", "items": [{"title": "TV's + Streaming", "html": "<p>We have Hi-Speed WIFI for all of your streaming needs!<\/p><p>There are Smart TV's throughout the entire home.<\/p><p>Go to the TV Home Screen<\/p><p>Search For (or Download) The Channel App You Want To Watch &amp; Login to your TV Provider.<\/p><p>Please don't hesitate to reach out if you need provider login assistance!<\/p>", "photo": "729ecb38918b0e99bc0a0ec5fa74c6d2.jpg", "id": "tvs-streaming"}]}]}, "thermostat": {"id": "thermostat", "title": "Thermostat", "icon": "thermometer", "groups": [{"title": "", "items": [{"title": "Heating / Cooling", "html": "<p>There are (2) Ecobee Thermostats on the wall. The first is next to the main level bathroom and the other in the living/game room.&nbsp;<\/p> <p>If you're running the air conditioning or heating - PLEASE keep all windows and outside doors closed to ensure they operate at maximum efficiency. We recommend a setting of about 72*F which we find keeps the place at a comfortable temperature.<\/p>", "photo": "0e0d8f67a1daad47f9505a1e6b070b6d.jpg", "id": "heating-cooling"}]}]}, "beer-wine": {"id": "beer-wine", "title": "Beer and Wine", "icon": "wine", "groups": [{"title": "Beer and Breweries", "items": [{"title": "Bee Well Mead & Cider", "html": "<p>Website: <a href=\"https://www.beewellmeadery.com/\">https://www.beewellmeadery.com/<\/a><\/p> <p>Phone: +1 231-350-7116<\/p> <p>Check out Bee Well for a taste of Northern Michigan in a glass—this family-run spot serves house-made meads and hard ciders using local honey and fruit in a cozy, come-as-you-are tasting room. With 20 rotating taps, kids-friendly options like cold brew and soda, and a laid-back local vibe, it’s the perfect place to chill out after exploring Bellaire.<\/p>", "photo": "ec3eddb548596a874f230eeb397f80cd.jpg", "loc": [44.976046, -85.209802], "pin": "bars_and_nightlife", "id": "bee-well-mead-cider"}, {"title": "Short’s Brewing Company – Bellaire Pub", "html": "<p>Website: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub\">https://www.shortsbrewing.com/locations/bellaire-pub<\/a><\/p> <p>Phone: +1 231-498-2300<\/p> <p>Kick back in the heart of downtown at Short’s, where local life meets craft beer—20 house-brewed beers on tap, wood‑fired pizzas, hearty mac ‘n’ cheese, and their can't-miss White Pepper sandwich. With live music in the beer garden on weekends and that laid-back Northern Michigan vibe, it's the perfect spot to unwind after a day on the lake or trails.<\/p>", "photo": "3ea307192488bbe56261401f62de453b.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "shorts-brewing-company-bellaire-pub"}, {"title": "Torch Lake Cellars", "html": "<p>Website: <a href=\"https://torchlakecellars.com/\">https://torchlakecellars.com/<\/a><\/p> <p>Phone: +1 231-377-9109<\/p> <p>Sip and relax at this cozy, family-run winery perched above Bellaire, where you can toast with fruit-forward wines or crisp hard ciders while soaking in vineyard and Torch Lake views. Casual tasting flights and friendly service make this a great stop for a laid-back afternoon treat.<\/p>", "photo": "6401ce8667136d42f5a4606f1b0bb838.jpg", "loc": [44.957504, -85.247866], "pin": "sightseeing", "id": "torch-lake-cellars"}]}, {"title": "Wine and Wineries", "items": [{"title": "BOS Wine Garden", "html": "<p>Website: <a href=\"https://www.boswine.com\">boswine.com<\/a><\/p> <p>Phone: 231) 498-2073<\/p> <p>Discover a hidden gem at BOS Wine Garden, where biodynamic farming meets exceptional winemaking. Nestled in a charming restored farmhouse, this boutique winery offers curated tasting experiences featuring wines from Michigan and California, complemented by artisanal pairings. Whether you're enjoying a glass in the intimate tasting room or relaxing in the serene garden, BOS Wine Garden provides a welcoming atmosphere to savor every sip.<\/p>", "photo": "f0c76073698ca4ea46d136b1febce8bf.jpg", "loc": [44.899945, -85.40283], "pin": "brewery_pub", "id": "bos-wine-garden"}, {"title": "Cellar 1914", "html": "<p>Website: <a href=\"https://www.cellar1914.com/\">https://www.cellar1914.com/<\/a><\/p> <p>Phone: +1 231-676-8743<\/p> <p>Step back in time and savor the flavor at Cellar 1914. This historic spot pairs charming ambiance with a variety of delicious wines, perfect for slowing down and soaking up Bellaire’s laid-back spirit.<\/p>", "photo": "3463b847bc2f21c4fbf1f1c9ee2a04db.jpg", "loc": [45.119003, -85.305611], "pin": "brewery_pub", "id": "cellar-1914"}, {"title": "Petoskey Brewing Company", "html": "<p>Website: <a href=\"https://www.petoskeybrewing.com/\">https://www.petoskeybrewing.com/<\/a><\/p> <p>Phone: +1 231-753-2057<\/p> <p>Step into history — this renovated 1898 “Old Brewery” serves up hand-crafted ales and hearty pub fare in a rustic taproom. Whether you're sipping a tart Raspberry Waffle Cone Cream Ale or diving into their smash burger, it’s the perfect destination for a chilled-out afternoon halfway between Bellaire and Petoskey.<\/p>", "photo": "9407cdeaeb1dcbc27eaec0dae89d2a86.jpg", "loc": [45.396886, -84.903046], "pin": "bars_and_nightlife", "id": "petoskey-brewing-company"}, {"title": "Royal Farms, Inc.", "html": "<p>Website: <a href=\"https://www.royalfarmsinc.com\">royalfarmsinc.com<\/a><\/p> <div> <div> <div>Phone: +1 231-599-3222<\/div> <div> <\/div> <\/div> <\/div> <p>Just a short drive from Bellaire, Royal Farms offers a delightful mix of farm-fresh produce, homemade baked goods, and a cozy winery. Whether you're picking your own cherries in season, enjoying a glass of wine in their tasting room, or exploring their charming gift shop, it's a perfect stop for a taste of local Northern Michigan charm.<\/p>", "photo": "c62ae743c8cd711e4aa8cdd8fd79c1cc.jpg", "loc": [45.185162, -85.345752], "pin": "grocery_shopping", "id": "royal-farms-inc"}, {"title": "Tasting Rooms Tour", "html": "<p><strong>🍺 Short’s Brewing Company – The Pub<\/strong><br/>Website: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/\">https://www.shortsbrewing.com/locations/bellaire-pub/<\/a> <br/>Phone: (231) 498-2300<br/>Location: 121 N Bridge St, Bellaire, MI 49615<\/p> <p>A true Bellaire staple, Short’s offers more than 20 craft beers on tap, creative pub food, and live music in a welcoming downtown atmosphere. Perfect for a casual night out with friends or to sample Michigan’s most iconic brewery.<\/p> <p><strong>🍷 Torch Lake Cellars<\/strong><br/>Website: <a href=\"https://torchlakecellars.com/\">https://torchlakecellars.com/<\/a> <br/>Phone: (231) 377-9109<br/>Location: 5245 Clam Lake Rd, Bellaire, MI 49615<\/p> <p>Nestled near Torch Lake, this boutique winery pairs stunning views with handcrafted wines. Guests can relax on the patio with a glass in hand while soaking up one of Michigan’s most beautiful lakeside settings.<\/p> <p><strong>🥃 Mammoth Distilling – Bellaire Tasting Room<\/strong><br/>Website: <a href=\"https://mammothdistilling.com/\">https://mammothdistilling.com/<\/a> <br/>Phone: (231) 350-7102<br/>Location: 109 N Bridge St, Bellaire, MI 49615<\/p> <p>Located right downtown, Mammoth offers small-batch spirits crafted with Northern Michigan ingredients. Sip artisan cocktails in a rustic-chic lounge just steps away from your stay.<\/p> <p><strong>🍇 Vista Ridge Vineyard<\/strong><br/>Website: <a href=\"https://vistaridgevineyards.com/\">https://vistaridgevineyards.com/<\/a> <br/>Phone: (231) 331-5511<br/>Location: 9104 Helena Rd, Alden, MI 49612<\/p> <p>A cozy, family-run vineyard offering tastings of red, white, and fruit wines paired with charcuterie. Known for warm hospitality and scenic vineyard views just minutes from Torch Lake.<\/p> <p><strong>🌿 WaterFire Vineyards<\/strong><br/>Website: <a href=\"https://www.waterfirewine.com/\">https://www.waterfirewine.com/<\/a> <br/>Phone: (231) 498-2753<br/>Location: 12180 S Elk Run, Kewadin, MI 49648<\/p> <p>Michigan’s first SIP-certified sustainable vineyard, WaterFire is perfect for eco-minded wine lovers. Enjoy crisp whites and unique blends in a peaceful vineyard setting.<\/p> <p><strong>🥂 Ethanology Distillation<\/strong><br/>Website: <a href=\"https://www.ethanologydistillation.com/\">https://www.ethanologydistillation.com/<\/a> <br/>Phone: (231) 498-2800<br/>Location: 127 Ames St, Elk Rapids, MI 49629<\/p> <p>A grain-to-glass distillery offering premium spirits and seasonal cocktails. The modern tasting room and intimate tours make it a unique stop on your Northern Michigan beverage trail.<\/p> <p><strong>🍏 Royal Farms Winery &amp; Market<\/strong><br/>Website: <a href=\"https://www.royalfarmsinc.com/\">https://www.royalfarmsinc.com/<\/a> <br/>Phone: (231) 599-3222<br/>Location: 10445 N US Highway 31, Ellsworth, MI 49729<\/p> <p>A family-friendly winery and farm market offering wines, hard ciders, and homemade baked goods. Seasonal U-Pick fruit makes this a fun stop for both kids and adults.<\/p> <p><strong>🍎 Townline Ciderworks<\/strong><br/>Website: <a href=\"https://www.townlineciderworks.com/\">https://www.townlineciderworks.com/<\/a> <br/>Phone: (231) 498-2275<br/>Location: 11595 US-31, Elk Rapids, MI 49629<\/p> <p>Specializing in small-batch hard cider, Townline uses apples grown on its own family farm. The relaxed tasting room offers scenic countryside views and refreshing ciders perfect for summer.<\/p> <p><strong>🍷 Hello Vino<\/strong><br/>Website: <a href=\"https://www.hellovinobellaire.com/\">https://www.hellovinobellaire.com/<\/a> <br/>Phone: (231) 350-7136<br/>Location: 225 N Bridge St, Bellaire, MI 49615<\/p> <p>A boutique wine shop and tasting bar right in downtown Bellaire. Guests can sample curated wines, shop local bottles, or enjoy a glass in a cozy setting just steps from Short’s Brewery.<\/p> <p><strong>🍻 Torch Lake Beer Company<\/strong><br/>Website: <a href=\"https://torchlakebeerco.com/\">https://torchlakebeerco.com/<\/a> <br/>Phone: (231) 544-1186<br/>Location: 4990 N West Torch Lake Dr, Central Lake, MI 49622<\/p> <p>A lively lakeside brewery with a rotating tap list, hearty food, and regular live music. Known for its fun atmosphere and great Torch Lake views, it’s a favorite hangout for locals and visitors alike.<\/p>", "photo": "2096826a6c51e372d1bdcb0f8e18c072.jpg", "id": "tasting-rooms-tour"}, {"title": "Torch Lake Tour — Road Runner Tours", "html": "<p>Website: <a href=\"https://www.roadrunnermi.com\">https://www.roadrunnermi.com<\/a> <\/p> <p>Phone: (231) 392-3114 MapQuestYelp<\/p> <p>Location: 5245 Clam Lake Rd, Bellaire, MI 49615 (same as Torch Lake Cellars) <a href=\"https://www.mapquest.com/us/michigan/road-runner-tours-llc-719786922\">MapQuest+1<\/a><\/p> <p><strong>Host: Road Runner Tours – Bellaire, MI<\/strong><\/p> <p>Enjoy a stress-free, curated day visiting the finest local tasting rooms with a scenic ride aboard Road Runner’s passenger bus. The Torch Lake Tour typically includes stops at Torch Lake Cellars, Cellar 1914, and Mammoth Distilling—each offering craft wine, cider, and spirits in beautiful settings. <\/p> <p>Let someone else drive while you indulge in a curated tasting experience. With a comfortable 14-passenger shuttle, scenic surroundings, and hassle-free pickup and drop-off, this tour is perfect for sipping your way through Bellaire’s beverage scene.<\/p> <p><strong>How to Book: Visit <a href=\"https://www.roadrunnermi.com\">https://www.roadrunnermi.com<\/a>, or call (231) 392-3114<\/strong><\/p>", "photo": "b7008613d20fbc28aeb85983c381aaa2.jpg", "id": "torch-lake-tour-road-runner-tours"}, {"title": "U-Pick Orchards", "html": "<p>1. Kalchik Farms<br/>Website: <a href=\"https://upickfarmsusa.com/mi/antrim-county/kalchik-farms\">https://upickfarmsusa.com/mi/antrim-county/kalchik-farms<\/a> <br/>Phone: (231) 377-7519 <br/>Location: 8659 Bellaire Highway, Bellaire, MI 49615<br/>Family-run and beloved for u-pick strawberries in June. A sweet summer staple just minutes away. <\/p> <p>2. King Orchards<br/>Website: <a href=\"https://kingorchards.com/\">https://kingorchards.com/<\/a> <br/>Phone: (231) 544-6479 <br/>Location: 4620 N M-88, Central Lake (approx. 10 minutes away)<br/>Offers a wide seasonal roster—u-pick strawberries, cherries, raspberries, peaches, and apples, plus a farm market with baked goods, flowers, and picnic areas. Open mid-June through mid-October. <\/p> <p>3. Shooks Farms / Cellar 1914<br/>Websites: <a href=\"https://shooksfarms.weebly.com/\">https://shooksfarms.weebly.com/<\/a> <br/><a href=\"https://www.michigan.org/property/shooks-farms\">https://www.michigan.org/property/shooks-farms<\/a> <br/>Phone: (231) 544-6418 <br/>Location: 5833 Shooks Road, Central Lake, MI 49622<br/>A multi-generation family farm known for U-Pick cherries in July (sweet, tart, and pie varieties). On the same property is Cellar 1914, their winery and tasting room, where you can enjoy wines and hard ciders crafted from the farm’s own fruit. It’s a perfect “pick-and-sip” stop that combines orchard fun with local flavors.<\/p> <p>4. Rocky Top Farms<br/>Website: <a href=\"https://rockytopfarms.com/\">https://rockytopfarms.com/<\/a> <br/>Phone: (231) 599-2251 <br/>Location: 11486 Essex Rd, Ellsworth, MI (about 15–20 minutes away)<br/>Famous for cherries, fruit preserves, buttery delights, and products like gourmet preserves, gift baskets, and cedar kitchen items. A charming stop for picking and shopping local culinary treats. <\/p> <p>5. Clam Lake Orchards<br/>Website: <a href=\"https://upickfarmsusa.com/mi/antrim-county\">https://upickfarmsusa.com/mi/antrim-county<\/a> <br/>Phone: (231) 533-6497 <br/>Location: 6662 Clam Lake Road, Bellaire, MI 49615<br/>Offers about 30 apple varieties—including Fuji, Gala, Honeycrisp, and McIntosh—on accessible dwarf trees. A charming spot for sinking your teeth into fresh apples.<\/p>", "photo": "0903196452b72270ae7593ad8d907991.jpg", "id": "u-pick-orchards"}, {"title": "Vista Ridge Vineyards", "html": "<p>Website: <a href=\"https://vistaridgevineyards.com\">vistaridgevineyards.com<\/a><\/p> <p>Phone: +1 231-331-5511<\/p> <p>Just a short stroll from Torch Lake, Vista Ridge Vineyards offers a cozy tasting room and sunny deck where you can sip handcrafted wines and enjoy charcuterie boards with friends. Whether you arrive by boat or car, it’s a perfect spot to unwind and savor local flavors in a laid-back, lakeside setting.<\/p>", "photo": "8e0a28b0d1e8df9e7ceaa6b386648a67.jpg", "loc": [44.881428, -85.275192], "pin": "grocery_shopping", "id": "vista-ridge-vineyards"}]}]}, "dining": {"id": "dining", "title": "Dining Out", "icon": "utensils", "groups": [{"title": "Breakfast, Brunch, + Coffee Recommendations", "items": [{"title": "M88 Morning Grind Coffee", "html": "<p><a href=\"https://www.facebook.com/m88awesomecoffee/\">https://www.facebook.com/m88awesomecoffee/<\/a><\/p> <p>(231) 350-7011<\/p> <p>A cozy café known for its excellent coffee and breakfast options. Guests appreciate the friendly atmosphere and quality offerings.<\/p>", "photo": "33dff1523ab80d3f3a3d90996ad5faba.jpg", "loc": [44.975095, -85.198754], "pin": "coffee_shop", "id": "m88-morning-grind-coffee"}, {"title": "RuthAnn's Gourmet Bakery and Coffeehouse", "html": "<p>https://www.ruthannsgourmetbakery.com/<\/p> <p><a href=\"https://www.google.com/search?sca_esv=5ed3572dacaed608&amp;rlz=1C1YTUH_enUS1025US1027&amp;sxsrf=AE3TifNfg2BALMQUa3ZURDF-7gRG1nX-Fw:1749046197707&amp;q=ruthann%27s+gourmet+bakery&amp;source=lnms&amp;fbs=AIIjpHxU7SXXniUZfeShr2fp4giZtkvKcq2WwR8cISugIcvZLh7z8ePpkNctGJ_05bt_kDYkkCW7qhfSBT6v8l8OKmkbndM1wOgl4dylOBxmaxb4Vq1QbrneLVQ3WdLz61J6CJktMGoTE68_rsOKBpqAUNyRvK4lBps5Mg2fsAICd4IKzl4y-eL1gRWgx5MJMwqJi34oAK9byt2sgdLXHOZvr-iigtZk0gyMI44B6_3GcBRqJQxivmY&amp;sa=X&amp;ved=2ahUKEwiorb3q-NeNAxUHRTABHctCAqgQ0pQJegQIFRAB&amp;biw=1664&amp;bih=941&amp;dpr=1.5#\">(231) 350-7010<\/a><\/p> <p>A delightful bakery and coffeehouse offering made-from-scratch baked goods, including cupcakes, muffins, and pastries. Their specialty coffee drinks, such as the frozen latte or mocha, are local favorites<\/p>", "photo": "44da75e54112b105430ea486f73b384f.jpg", "loc": [44.975781, -85.210343], "pin": "coffee_shop", "id": "ruthanns-gourmet-bakery-and-coffeehouse"}, {"title": "Shanty Creek CoffeeBAR", "html": "<p>Website: <a href=\"https://www.shantycreek.com/stay/dining/#coffeebar\">https://www.shantycreek.com/stay/dining/#coffeebar<\/a><\/p> <p>Phone: 231‑533‑3000<\/p> <div> <div> <div> <div> <div> <div> <div> <div> <p>Enjoy Starbucks drinks in a cozy resort lobby, plus house-made breakfast burritos, bagels, parfaits, and pastries. Open daily from 7 AM to 2 PM, it’s the perfect grab-and-go spot before hitting the slopes, trails, or golf course. Don’t miss Thursday’s buy‑one‑get‑one coffee special from noon to 5 PM!<\/p> <\/div> <\/div> <\/div> <\/div> <\/div> <\/div> <\/div> <\/div>", "photo": "5d629d00f82517ba5e286c27dbdbe8b5.jpg", "loc": [44.948477, -85.185208], "pin": "coffee_shop", "id": "shanty-creek-coffeebar"}]}, {"title": "Dinner + Drinks Recommendations", "items": [{"title": "Chloe’s Chop House", "html": "<p>Website: <a href=\"https://www.chloeschophouse.com/\">chloeschophouse.com<\/a><\/p> <p>Phone: 231-350-8986<\/p> <p>Located right downtown, Chloe’s feels upscale but never stuffy—ideal for splurge-worthy steaks and smooth cocktails in a cozy, laid-back atmosphere. Whether you're celebrating a special night or just craving a premium meal, it’s the spot for relaxed fine-dining with local flair.<\/p>", "photo": "20401bf4d2adfb6bc2cd204ef14d8d8f.jpg", "loc": [44.977265, -85.21019], "pin": "restaurants", "id": "chloes-chop-house"}, {"title": "Corner Bistro", "html": "<p>Website: <a href=\"https://www.cornerbistrobellaire.com/\">cornerbistrobellaire.com<\/a><\/p> <p>Phone: +1 231-409-7088<\/p> <p>Tucked into downtown Bellaire, Corner Bistro is your go-to for cozy evenings—think shareable plates, a laid‑back bar vibe, and porch seating perfect for people‑watching. Friendly and intimate, it’s the kind of spot that feels like a local secret, whether you’re winding down or celebrating something special.<\/p>", "photo": "5574ca855a691a16f711f7e3831cfbb0.jpg", "loc": [44.975554, -85.209707], "pin": "restaurants", "id": "corner-bistro"}, {"title": "Fireside Lounge", "html": "<p>Website: <a href=\"https://www.hellovinobellaire.com/\">https://www.hellovinobellaire.com/<\/a><\/p> <p>Phone: +1 231-350-7138<\/p> <p>Looking for a laid-back drink with a local twist? Fireside Lounge brings cozy lodge vibes with a patio, live music, bocce ball, and a curated selection of boutique cocktails, wines, and small bites — perfect for a mellow evening with new friends.<\/p>", "photo": "714e942c55b22e6ed7604cb6916159a8.jpg", "loc": [44.97667, -85.208626], "pin": "bars_and_nightlife", "id": "fireside-lounge"}, {"title": "Lakeview Restaurant & Grill", "html": "<p>Website: <a href=\"http://www.shantycreek.com/dining\">shantycreek.com/dining<\/a><\/p> <p>Phone: +1 231-533-8621<\/p> <p>Perched overlooking Lake Bellaire, The Lakeview offers relaxed, grill-style dinners and a hearty breakfast buffet in a resort-chic setting. With daily happy hour and stunning sunset views, it’s a great spot to unwind after a day on the water or trails.<\/p>", "photo": "1e34ff03dddd6c0587b8af1fb3a9ed68.jpg", "loc": [44.948556, -85.185222], "pin": "restaurants", "id": "lakeview-restaurant-grill"}, {"title": "The Nest at The Chief", "html": "<p>Website: <a href=\"https://thepelicansnest.com/\">thepelicansnest.com<\/a><\/p> <p>Phone: +1 231-533-9000<\/p> <p>Kick back in resort-style comfort at The Nest—a laid-back bar &amp; grill right on the golf course. From juicy BYO burgers and brick-oven pizzas to loaded wings and craft cocktails, it's the perfect casual spot to unwind after a day on the lake or trails.<\/p>", "photo": "3e7835481d9a06153e48dae479a80577.jpg", "loc": [44.958548, -85.188831], "pin": "bars_and_nightlife", "id": "the-nest-at-the-chief"}, {"title": "The Shanty Bar & Grill", "html": "<p>Facebook: <a href=\"https://www.facebook.com/shantytownmi/\">https://www.facebook.com/shantytownmi/<\/a><\/p> <p>Phone: +231 5 337 025<\/p> <p>This cozy, lodge-style bar tucked into Shanty Creek Resort is your go-to for cold beers, wood-fired pizza, and rustic comfort food in a relaxed, fireside setting. With friendly service and a local vibe, it's the perfect spot to unwind after a day of hiking, skiing, or playing on the lake.<\/p>", "photo": "7fe152596016230aca7a99a1316d3c37.jpg", "loc": [44.948595, -85.183889], "pin": "bars_and_nightlife", "id": "the-shanty-bar-grill"}, {"title": "Short’s Brewing Company Bellaire Pub", "html": "<p>Website<strong>:<\/strong> <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub\">shortsbrewing.com/locations/bellaire-pub<\/a><\/p> <p>Phone: +1 231-498-2300<\/p> <p>Kick off your evening at Short’s, where local life meets craft beer—20 house-brews and ciders await alongside pub favorites like the iconic White Pepper sandwich or fresh gourmet pizzas. With live music on weekends and a laid-back beer garden out back, it's the perfect spot to relax after a day on the lake.<\/p>", "photo": "f00b872a0eb30c1d3fe89eedcac219f6.jpg", "loc": [44.976269, -85.210357], "pin": "brewery_pub", "id": "shorts-brewing-company-bellaire-pub"}]}, {"title": "Lunch + Snack Recommendations", "items": [{"title": "B.C. Pizza (Bellaire)", "html": "<p>Website: <a href=\"https://bc.pizza/locations/bellaire/\">https://bc.pizza/locations/bellaire/<\/a> <\/p> <p>231-350-7500<\/p> <p>Think of B.C. Pizza as your go-to local slice spot — handmade, hometown-style pies fresh from Bellaire, plus signature subs, pastas, and a lunchtime buffet to satisfy every craving. Friendly, down-to-earth, and perfect for grabbing a relaxed bite after a morning exploring the lakes or trails.<\/p>", "photo": "149186469021418bd9dd4c4cd6813dc3.jpg", "loc": [44.97517, -85.199522], "pin": "restaurants", "id": "b-c-pizza-bellaire"}, {"title": "Dockside Torch Lake", "html": "<p>Website: <a href=\"https://docksidetorchlake.com/\">docksidetorchlake.com<\/a><\/p> <p>(231) 377-7777<\/p> <p>Dockside Torch Lake offers a laid-back, lakeside dining experience where you can enjoy fresh salads, zesty Mexican dishes, and classic American fare like burgers and deli sandwiches—all while soaking in the stunning views of Torch Lake from their spacious outdoor deck. Whether arriving by boat or car, it's the perfect spot to relax and savor a meal with a view.<\/p>", "photo": "399d41d675ceffce8d0878412f4b8180.jpg", "loc": [44.942694, -85.283719], "pin": "restaurants", "id": "dockside-torch-lake"}, {"title": "Lunch Box", "html": "<p><a href=\"https://www.lunchboxbellaire.com/\">lunchboxbellaire.com<\/a><\/p> <p>Phone: (231) 533‑6678<\/p> <p>A cozy, family-owned café serving home‑cooked breakfast and lunch with hearty portions and homemade bread, pies, muffins, and classic diner-style eats. Open daily from around 8 AM to 2 PM, it's a beloved Bellaire staple since 1992.<\/p>", "photo": "ed364331e33dd3eb259e35fc85c90da9.jpg", "loc": [44.97531, -85.209553], "pin": "coffee_shop", "id": "lunch-box"}, {"title": "Papa K’s Pizza", "html": "<p>Website: <a href=\"https://papaksofbellaire.net/\">https://papaksofbellaire.net/<\/a> <\/p> <p>Phone: (231) 533‑6844<\/p> <p>A cozy, local pizza joint where the crust is seasoned just right and the cheese never skimped—perfect for nights when you want hot, fresh pizza without fuss. Casual, family-friendly vibes and delivery available within 8 miles (so go ahead—fire up Netflix and let Papa K’s bring dinner to you!).<\/p>", "photo": "b8720cdbce4caaa60ad763bee0a8a0fe.jpg", "loc": [44.971061, -85.19894], "pin": "restaurants", "id": "papa-ks-pizza"}, {"title": "Toonie's Fish & Steak House", "html": "<p>Website: <a href=\"https://tooniesfishandsteakhouse.com/\">tooniesfishandsteakhouse.com<\/a><\/p> <p>Phone: (231) 533‑8513<\/p> <p>Toonie’s is the go-to spot for hearty, comforting meals with a local twist. Whether you’re craving fresh seafood or a juicy steak, their famous “Holy Cow” breakfast and “Smothered Bull” burger will keep you fueled for your adventures. Perfect for a satisfying lunch or relaxed dinner after exploring the town!<\/p>", "photo": "7b5b5758f9599597050e4fff817a1b34.jpg", "loc": [44.977492, -85.209777], "pin": "restaurants", "id": "toonies-fish-steak-house"}]}]}, "emergency": {"id": "emergency", "title": "Emergency and Urgent Care", "icon": "siren", "groups": [{"title": "", "items": [{"title": "Bellaire District Fire Department", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p> <p>Address: 735 E Broad St, Bellaire, MI 49615<br/>Phone: (231) 533-8708 | Fax: (231) 533-5259 | Email: <a>bellairefire@gmail.com<\/a><br/>Services include firefighting, advanced ambulance care, rescue response, and community safety programs.<\/p> <p>This section is here to ensure you feel safe and supported—should anything arise, you’re never far from assistance.<\/p>", "photo": "cc3c5594cbe6a6fc0de6f64d75dd1a6a.jpg", "id": "bellaire-district-fire-department"}, {"title": "Bellaire Police Department", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p> <p><strong>Bellaire Police Department<\/strong><br/>Non-Emergency Phone: (231) 533-5678<br/>Address: 202 N. Bridge St., Bellaire, MI 49615 (inside Community Hall)<br/>Fax: (231) 533-8753<br/>Chief of Police: Bill Drollinger; community-trained officers provide First Aid, AED, and CPR services.<\/p> <p>This full-service department operates from within the Community Hall. Staff—trained in Basic First Aid, CPR, and the use of AEDs—offers patrol, law enforcement, community watch (including vacation property checks), and peace-of-mind services to ensure guest security. <a href=\"https://bellairemichigan.com/police\">Village of Bellaire<\/a><\/p> <p><a href=\"https://www.mapquest.com/us/michigan/bellaire-police-department-352967851\">MapQuest<\/a><\/p>", "photo": "07eb56575e162d330b2d7c601e0d8640.jpg", "id": "bellaire-police-department"}, {"title": "Local Medical Services", "html": "<p>IN CASE OF EMERGENCY - DIAL 911<\/p> <p>• <strong><a href=\"https://ejfhc.org/our-locations/health-center/bellaire-family-health-center/\">Bellaire Family Health Center<\/a><\/strong><br/>4955 S M-88 Hwy, Bellaire, MI – (231) 533-8649<br/>Offers walk-in and appointment-based primary care—all ages, lab testing (<em>LabCorp<\/em>), pharmacy, immunizations, and behavioral health support.<br/>Hours: Mon–Fri (8 am–6 pm), Sat (9 am–1 pm).<\/p> <p>• <strong><a href=\"https://www.munsonhealthcare.org/kalkaska-memorial-health-center/about-us\">Kalkaska Memorial Health Center<\/a><\/strong> (Kalkaska, MI)<br/>Full-service regional hospital with 24-hour emergency care, diagnostics, surgery, rehab services, and more—approximately 15–20 min away.<\/p> <p>• <strong>Emergency:<\/strong> Always dial <strong>911<\/strong> for urgent or life-threatening situations.<br/>• <strong>After-Hours:<\/strong> Call <strong>Spectrum Health nurse hotline at 616-391-9932<\/strong> for assistance and provider access when the clinic is closed.<\/p>", "photo": "d0654c1a7810148c70777bc1503cadc0.jpg", "id": "local-medical-services"}]}]}, "fishing": {"id": "fishing", "title": "Fishing", "icon": "fish", "groups": [{"title": "", "items": [{"title": "Captain Ron’s Fishing Charters", "html": "<p>Facebook: <a href=\"https://www.facebook.com/CaptainRonCharters\">https://www.facebook.com/CaptainRonCharters<\/a> <\/p> <p>Phone: (231) 322-0016<\/p> <p>Location: Elk Rapids Marina, Elk Rapids, MI (about 25 minutes from Bellaire)<\/p> <p>Looking for a true northern Michigan fishing adventure? Captain Ron’s Fishing Charters offers guided trips on the stunning waters of Grand Traverse Bay and Torch Lake, specializing in salmon, lake trout, and smallmouth bass. With over 40 years of experience, Captain Ron provides expert guidance for beginners and seasoned anglers alike, ensuring everyone has a memorable day on the water.<\/p> <p>The charter provides all the gear, bait, and licenses you’ll need—so guests can just show up, climb aboard, and enjoy the thrill of catching big fish in some of the clearest waters in the Midwest. Families, groups, and solo adventurers are all welcome, making this a perfect outing for your Bellaire getaway.<\/p>", "photo": "f0ef9494491d5edf0b8f427576386713.jpg", "id": "captain-rons-fishing-charters"}, {"title": "Clam Lake", "html": "<p>Website: <a href=\"https://watershedcouncil.org/waterbody/clam-lake/\">https://watershedcouncil.org/waterbody/clam-lake/<\/a> <br/>Location: Between Torch Lake and Lake Bellaire<\/p> <p>A connecting lake that flows between Torch and Bellaire, Clam Lake offers excellent fishing for <strong>panfish, perch, and bass<\/strong>. Guests enjoy fishing from the shores of <strong>Clam River<\/strong>, which feeds the lake and is a hotspot for casting. Because it’s smaller and calmer than the big lakes, it’s ideal for kayaks and smaller boats.<\/p>", "photo": "d2d7b84aae0528cb79e938ddeff3db97.jpg", "id": "clam-lake"}, {"title": "Fish With Jim Outfitters", "html": "<p>Located just a short drive away in Mancelona, Captain Jim—an established local guide since 1998—offers top-tier fishing trips across Northern Michigan waters. Whether your guests want to chase lake trout, salmon, steelhead, or perch in Torch Lake, Grand Traverse Bay, Elk Lake, or even experience ice fishing in winter, Jim’s expertise ensures a memorable outing.<\/p> <p>• Wide variety of destinations and species — including Torch &amp; Elk lakes, Grand Traverse Bay, Manistee River, and more<br/>• All equipment and fish cleaning provided — stress-free and easy<br/>• Seasonal options—ice fishing in winter, river salmon in fall<\/p> <p>Booking Details:<br/>• 24' boat holds up to 6 anglers — starting at $510 for 3 people (4 hours) on Torch/Elk Lake; extra people or time available<br/>• Email: <a>fishwithjim@gmail.com<\/a> | Call/Text: (248) 252-1277 | <a href=\"https://www.fishwithjimoutfitters.com\">Website &amp; Booking Info<\/a><\/p>", "photo": "80bb1a6a8dc7469c7b0dade34f870b6a.jpg", "id": "fish-with-jim-outfitters"}, {"title": "Fisherman’s Paradise (Public Fishing Access)", "html": "<p>More Info Here: <a href=\"https://www.michiganwatertrails.org/location.asp?ait=av&amp;aid=1997\">https://www.michiganwatertrails.org/location.asp?ait=av&amp;aid=1997<\/a><\/p> <p>As the name suggests, this public fishing spot is a longtime local favorite. Anglers can catch bass, pike, and panfish, with plenty of shoreline access. It’s easy to reach and makes for a perfect quick trip if you don’t want to head out on the bigger lakes.<\/p>", "photo": "c7fa091638299b93586d696d2eb70e96.jpg", "loc": [44.952429, -85.201889], "pin": "fishing", "id": "fishermans-paradise-public-fishing-access"}, {"title": "Grass River", "html": "<p>Website: <a href=\"https://www.grassriver.org/\">Grass River Natural Area<\/a><br/>Phone: (231) 533-8314<\/p> <p>Known for its serene waters, Grass River is perfect for fishing trout and panfish. The river winds through the Grass River Natural Area, which also has scenic boardwalk trails, so it’s a great spot for mixing fishing with nature walks. Birdwatchers and photographers especially love this area, making it a great all-around outing for families.<\/p>", "photo": "1381ee234cdad5f51fd0596a359e0614.jpg", "loc": [0, 0], "pin": "fishing", "id": "grass-river"}, {"title": "Lake Bellaire", "html": "<p>Just 1.5 Miles to Lake Bellaire<\/p> <p>Discover this local treasure—a peaceful, scenic lake perfect for fishing, paddling, wildlife viewing, or a lakeside picnic.<\/p> <p>Getting There &amp; Amenities:<br/>• <em>Fisherman’s Paradise (DNR Access):<\/em> Developed boat ramp, dock, parking, restrooms. Fee: ~$11–12. Recreational passport required. <\/p> <p><a href=\"https://www.michiganwatertrails.org/location.asp?aid=1997&amp;ait=av\">Michigan Water Trails<\/a><br/>• <em>Willow Day Park (Carry-in Launch):<\/em> Offers parking, restrooms, a picnic area, and easy paddle access. <a href=\"https://foresthometwp.com/parks-recreation\">Forest Home Township<\/a><\/p> <p><a href=\"https://www.michiganwatertrails.org/location.asp?aid=1992&amp;ait=av\">Michigan Water Trails<\/a><\/p> <p>What You Might Catch: Trout, bass, walleye, pike, lake trout—plus birdwatching and peaceful water views. <a href=\"https://watershedcouncil.org/waterbody/lake-bellaire\">Watershed Council<\/a><\/p> <p>Local Stewardship: The Three Lakes Association supports and conserves Lake Bellaire’s natural beauty—great for those interested in eco-friendly tourism. <a href=\"https://www.3lakes.com\">3 Lakes<\/a><\/p> <p><em>Feel free to ask for help with maps, kayak or boat rental options, or the best times to fish!<\/em><\/p>", "photo": "c13fbc6ca2526f643d629640a015638d.jpg", "id": "lake-bellaire"}, {"title": "Torch Lake", "html": "<p><strong>📍 <a href=\"https://www.laketorch.com/fishing-guides\">Torch Lake Township Info<\/a><\/strong><\/p> <p>Just a short drive from your stay, Torch Lake offers legendary turquoise waters and world-class fishing opportunities. From casting for bass and perch in shallow bays to trolling deep for lake trout or salmon, this lake is an angler’s dream.<\/p> <p>• <strong>What You Can Catch:<\/strong> Trout, bass, pike, salmon, perch &amp; more<br/>• <strong>Best Spots:<\/strong> Northern drop-offs, rocky points, and deeper waters<br/>• <strong>Access Points:<\/strong> Torch Lake Township Day Park, Torch River Bridge DNR Launch<br/>• <strong>Need Help?<\/strong> Local fishing charters are available for guided adventures<\/p> Fishing Highlights <p>Torch Lake is a premier destination for fishing enthusiasts of all levels:<\/p> <ul> <li><strong>Lake Trout<\/strong> – thrive in the cold, deep waters.<\/li> <li><strong>Smallmouth &amp; Largemouth Bass<\/strong> – plentiful along rocky points and weed beds.<\/li> <li><strong>Northern Pike &amp; Muskellunge<\/strong> – trophy-sized catches possible near drop-offs.<\/li> <li><strong>Yellow Perch &amp; Rock Bass<\/strong> – perfect for family-friendly fishing.<\/li> <li><strong>Salmon &amp; Whitefish<\/strong> – migrate seasonally from connected waters.<\/li> <\/ul> <p>For guided fishing trips, check out local charters such as:<\/p> <ul> <li>Marty’s Torch Lake Guide Service (Bellaire, MI)<\/li> <li>Captain Ron’s Fishing Charters (Elk Rapids, MI)<\/li> <\/ul>", "photo": "5c5ac2f97ba4d4d0254cf43ddf075143.jpg", "id": "torch-lake"}]}]}, "golf": {"id": "golf", "title": "Golf", "icon": "flag", "groups": [{"title": "", "items": [{"title": "Cedar River", "html": "<p>“...a pleasure to play and a beauty to experience.” Cedar River’s glacial-carved canvas was perfect for famed course architect Tom Weiskopf to design this masterpiece.<\/p> <p>Among \"America’s Top 100 Resort Courses\" in <em>Golf Week<\/em> and the “Top 1,000 Courses in the World” by Rolex. Along with The Legend, Cedar River is listed among Michigan’s Top 20 Public Courses according to <em>Golf Magazine<\/em>.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-Cedar-River.pdf\">Cedar River Score Card<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Cedar River Tee Times<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "3a65057f0704d2a7c580ae28871d9bcb.jpg", "loc": [44.946402, -85.139625], "pin": "golfing", "id": "cedar-river"}, {"title": "Foot Golf!", "html": "<p>Introducing FootGolf. Mix the skills of soccer with the scoring golf, and you get a fun new way to bring the whole family to the links. This Dutch hybrid game uses a soccer ball, the fairways of Shanty Creek Resort's Summit golf course, and 21-inch holes. The goal, like golf, is the fewest strokes/shots from tee to the hole.<\/p> <p>Ready to play? $12 includes ball. To make a kickoff time, call 231-533-2020.<\/p>", "photo": "957a11a6d0fad7fba9161e7ecdfb9228.jpg", "id": "foot-golf"}, {"title": "Hawk's Eye", "html": "<p>“...the perfect complement to Cedar River and The Legend.”<\/p> <p>Adding to Shanty Creek's golf reputation, this John Robinson design features incredible vistas, water hazards on 9 of 18 holes, and putting greens to challenge golfers of all levels. Named among \"Michigan's Top Courses\" from <em>Golf Advisor<\/em> and the “Top 25 Course Layouts in the US.\"<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-Hawks-Eye.pdf\">Hawk's Eye Scorecard<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Hawk's Eye Tee Times<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "afe1376f7f54d0a9766458a5a618ee80.jpg", "loc": [44.957608, -85.149122], "pin": "golfing", "id": "hawks-eye"}, {"title": "The Legend", "html": "by Arnold Palmer <p>The Legend's reputation has been built on multiple elevation changes, doglegs, water hazards, and well-placed traps. Its setting includes views of Lake Bellaire and the actual Shanty Creek trickles through your round.<\/p> <p>Arnold Palmer helped introduce northern Michigan golf to the world when <em>Golf Magazine<\/em> named it among the “Top Resort Courses” in the US. 4½ stars from <em>Golf Digest<\/em>.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-The-Legend.pdf\">The Legend Scorecard<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">The Legend Tee Times<\/a><\/p> <p><strong>Closed Wednesdays and Thursdays<\/strong><\/p>", "photo": "001fbace61907319986cd00cfc4f155e.jpg", "loc": [44.948824, -85.185338], "pin": "golfing", "id": "the-legend"}, {"title": "Schuss Mountain", "html": "<p>Schuss Mtn delivers a challenge for even the most accomplished golfers. Par eludes many throughout 7,013 yards of pine-dotted forests, wetlands, and rolling hills.<\/p> <p>Playing like two distinct 9-hole courses, the front doglegs through pine forests on a flat pitch. Then on the back, play jumps up and down the rolling hills of Antrim County delivering an overall exciting golf experience made only better by our crew's tremendous care to its course conditions.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-Schuss.pdf\">Schuss Mountain Scorecard<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Schuss Mountain Tee Times<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "602ddd329452c93d226c374e898538ce.jpg", "loc": [44.940355, -85.133287], "pin": "golfing", "id": "schuss-mountain"}, {"title": "Summit", "html": "<p>...an under-appreciated gem.” While length is not a factor, Summit forces accomplished golfers to test their short game. Precise landings and fast, challenging greens will make you earn your score.<\/p> <p>A Par Three tee box on every hole gives junior golfers a fun (and less intimidating!) way to develop their game.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-Summit.pdf\">Summit Scorecard<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Summit Tee Times<\/a><\/p> <p><strong>Closed Wednesdays and Thursdays<\/strong><\/p>", "photo": "2f2ca69030981a6a08f7a2f863d01393.jpg", "loc": [44.948824, -85.185338], "pin": "golfing", "id": "summit"}]}]}, "grocery": {"id": "grocery", "title": "Grocery and Pharmacy", "icon": "shopping-cart", "groups": [{"title": "Groceries Upon Arrival", "items": [{"title": "Grocery Delivery Service", "html": "<p>Would you like a fully stocked fridge waiting for you upon arrival? Vacation is supposed to be relaxing, and the last thing you should worry about is heading to the store on a supply run. We can make sure all your groceries are delivered beforehand.<\/p> <p>Pre-purchase an order online at one of the
