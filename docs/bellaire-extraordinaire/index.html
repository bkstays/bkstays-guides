 local stores (Family Fare) and they will deliver the food for you prior to your arrival! <\/p> <p>MAKE SURE YOU HAVE THE BELLAIRE LOCATION SELECTED<\/p> <p><a href=\"https://www.shopfamilyfare.com/shop#!/\">https://www.shopfamilyfare.com/shop#!/<\/a><\/p> <p><strong>Family Fare<\/strong><\/p> <div> <div> <div><strong>Address<\/strong>: 211 S Division St, Bellaire, MI 49615<\/div> <div><strong>Hours<\/strong>: 7:00 AM - 10:00 PM<\/div> <\/div> <\/div> <div> <\/div>", "photo": "da8909661490c6d57b506c663ccdb3e7.jpg", "loc": [44.971798, -85.197367], "pin": "grocery_shopping", "id": "grocery-delivery-service"}]}, {"title": "Grocery / Pharmacy", "items": [{"title": "Bellaire Downtown Pharmacy", "html": "<p>Bellaire Downtown Pharmacy<\/p> <p>120 N Bridge St,&nbsp;Bellaire, MI 49615<\/p> <table> <tbody> <tr> <td> <div>Sunday&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- Closed<\/div> <div>Monday&nbsp; &nbsp; &nbsp; &nbsp;- 9:00 AM - 5:00 PM<\/div> <div>Tuesday&nbsp; &nbsp; &nbsp; &nbsp;- 9:00 AM - 5:00 PM<\/div> <div>Wednesday - 9:00 AM - 5:00 PM<\/div> <div>Thursday&nbsp; &nbsp; &nbsp;- 9:00 AM - 5:00 PM<\/div> <div>Friday&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; - 9:00 AM - 5:00 PM<\/div> <div>Saturday&nbsp; &nbsp; &nbsp; - 9:00 AM - 5:00 PM<\/div> <\/td> <\/tr> <\/tbody> <\/table>", "photo": "bd637c3e96aa3b09d786560df40e48bb.jpg", "loc": [44.97605, -85.210271], "pin": "pharmacy", "id": "bellaire-downtown-pharmacy"}, {"title": "Groceries", "html": "<p>Family Fare - Bellaire<\/p> <div>Everyday: 7:00 AM - 10:00 PM<\/div> <div>&nbsp;<\/div> <div>211 S Division St<\/div> <p>Bellaire, MI 49615<\/p>", "photo": "4f3e895b729a968e1cf1c5c127c6c099.jpg", "loc": [44.971076, -85.197754], "pin": "grocery_shopping", "id": "groceries"}]}]}, "hiking-biking": {"id": "hiking-biking", "title": "Hiking and Biking", "icon": "mountain", "groups": [{"title": "", "items": [{"title": "Fat Tire Biking", "html": "<p>Website: <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/#fattirebiking\">https://www.shantycreek.com/ski/more-on-the-snow/#fattirebiking<\/a><br/><a href=\"https://www.shantycreek.com/important-information/#contactus\">Contact Here<\/a><\/p> <p>Looking for a fun winter adventure? Try <strong>fat tire biking on snow<\/strong> at Shanty Creek Resorts! The <strong>3km multipurpose trail at Schuss Village<\/strong> is groomed for fat tire biking, snowshoeing, or even a peaceful winter walk with your dog. Bikes are available for rent just minutes away at <strong>Paddles &amp; Pedals in downtown Bellaire<\/strong>, making it easy for guests to hit the trails and enjoy Michigan’s snowy outdoors.<\/p>", "photo": "fca2ac1ba3f4a7f260f3a476cd3bb7a7.jpg", "id": "fat-tire-biking"}, {"title": "Glacial Hills Pathway and Natural Area", "html": "<p>Website: <a href=\"https://glacialhillstrails.org/\">https://glacialhillstrails.org/<\/a> <a><br/>Phone: (231) 533-6023 (Friends of Glacial Hills)<br/>Location: Trailheads on Orchard Hill Rd &amp; Vandermark Rd, Bellaire, MI 49615<br/><\/a><\/p> <p>Just minutes from downtown Bellaire, this 800-acre trail system offers 31+ miles of multi-use trails for hiking, biking, and winter fat-tire riding. Trails wind through hardwood forests, wildflowers, and rolling terrain—perfect for both casual nature walks and advanced mountain biking.<\/p>", "photo": "c7256293ea1b1edd6e2c5f7fa0a7e27d.jpg", "id": "glacial-hills-pathway-and-natural-area"}, {"title": "Grass River Natural Area", "html": "<p>Website: <a href=\"https://www.grassriver.org/\">https://www.grassriver.org/<\/a> <br/>Phone: (231) 533-8314<br/>Address: 6500 Alden Hwy, Bellaire, MI 49615<\/p> <p>Only 10 minutes from Bellaire, this 1,492-acre preserve features 7 miles of boardwalk and natural trails through wetlands, meadows, and forests. Guests love the peaceful setting, birdwatching opportunities, and guided nature programs. A great family-friendly stop for an easy stroll in nature.<\/p>", "photo": "b725b94811adc3c0460c20e1514ebea3.jpg", "id": "grass-river-natural-area"}, {"title": "Jordan River Pathway (East Jordan)", "html": "<p>Website: <a href=\"https://www.alltrails.com/trail/us/michigan/jordan-valley-pathway--3\">https://www.alltrails.com/trail/us/michigan/jordan-valley-pathway--3<\/a><br/>Phone: (231) 582-9191 (MDNR)<br/>Trailhead: Deadman’s Hill Scenic Overlook, Deadman’s Hill Rd, Elmira, MI 49730 (20 min from Bellaire)<\/p> <p>More Info <a href=\"https://truenorthtrout.com/2024/08/the-jordan-river-a-natural-treasure-in-northern-michigan/\">Here <\/a><\/p> <p>A popular 18-mile loop trail through the Jordan River Valley, with shorter day-hike options available. Guests rave about the stunning river views, wildlife, and forest landscapes. Perfect for experienced hikers looking for a half-day or overnight backpacking trip.<\/p>", "photo": "e953f85457bb95d29c47793922e69fe4.jpg", "id": "jordan-river-pathway-east-jordan"}, {"title": "Schuss Mountain & Shanty Creek Resorts Trails", "html": "<p>Website: <a href=\"https://www.shantycreek.com/stay/antrim-county/#glacialhills\">https://www.shantycreek.com/stay/antrim-county/#glacialhills<\/a> <br/>Phone: (866) 695-5010<br/>Address: 5780 Shanty Creek Rd, Bellaire, MI 49615<\/p> <p>Located just outside Bellaire, Shanty Creek offers scenic mountain biking trails, hiking paths, and winter cross-country skiing. Trails range from beginner loops to challenging terrain across Schuss and Summit Mountains, with beautiful views of northern Michigan landscapes.<\/p>", "photo": "af76e0c3ca0dd3871a3c39c149c9deb3.jpg", "id": "schuss-mountain-shanty-creek-resorts-trails"}]}]}, "nature-parks": {"id": "nature-parks", "title": "Nature + Parks", "icon": "trees", "groups": [{"title": "", "items": [{"title": "Craven Park & Campground", "html": "<p>Website: Craven Park page on Bellaire’s official site <a href=\"https://bellairemichigan.com/craven\">https://bellairemichigan.com/craven<\/a><br/>Phone: Available through Bellaire Village contacts (not listed directly but accessible via site)<br/>Location: Just a mile east of downtown Bellaire<br/><br/>Offers a campground with electric/water sites and primitive options, scenic Craven Pond with fishing, and walking loops leading into Cedar River Natural Area trails. Perfect for those who enjoy a rustic, immersive experience. Nature right at their doorstep—but also close to town.<\/p>", "photo": "a993304e194c04872d8a0145a151511e.jpg", "id": "craven-park-campground"}, {"title": "Glacial Hills Pathway & Natural Area", "html": "<p>Website: Glacial Hills Trails site <a href=\"https://glacialhillstrails.org/\">https://glacialhillstrails.org/<\/a><br/>Phone: Accessible via Antrim County Parks &amp; Rec. info<br/>Location: West of Bellaire via Eckhardt Rd or Vandermark Rd trailheads<\/p> <p>Over 814 acres and 31.5 miles of trails for hiking, mountain biking, and winter sports. Diverse habitats with woodland and wetland species, and rich birdlife. Great for active travelers—excellent for biking, exploration, or skimming through varied terrain. Stunning scenery and great trail variety.<\/p>", "photo": "4fa126321fa3e0a03a963c137a0903f5.jpg", "id": "glacial-hills-pathway-natural-area"}, {"title": "Grass River Natural Area", "html": "<p>Website: Grass River Natural Area website <a href=\"https://www.grassriver.org/\">https://www.grassriver.org/<\/a><\/p> <p>Phone: Office: 231-533-8314 • Center: 231-533-8576<\/p> <p>Location: 6500 Alden Hwy, Bellaire, MI 49615<\/p> <p>A 1,502-acre preserve featuring seven miles of trails, including 1.5 miles of floating boardwalks through fens and cedar wetlands. Ideal for hiking, birdwatching, observing wildlife, and educational programs at the nature center. Immerse in wetlands teeming with otters, birds, and native plants—an excellent spot for families and nature lovers seeking peaceful walks and wildlife encounters.<\/p>", "photo": "4a78e97d0474b838c754a082531f2c5d.jpg", "id": "grass-river-natural-area"}, {"title": "Richardi Park (Intermediate River)", "html": "<p>Website: <a href=\"https://bellairemichigan.com/richardi/\">https://bellairemichigan.com/richardi/<\/a> <br/>Phone: Provided via Water Trails access (generally 231-533-6265 for site info)<br/>Location: 100 E. Antrim St., Bellaire, MI 49615<\/p> <p>Description: Featuring a carry-in launch for kayaks/canoes, restrooms, potable water, swimming beach, pavilion, playground, basketball courts, and picnic tables—all within walking distance of downtown Bellaire. Open May–September, 8 AM–10 PM.<\/p> <p>Why Guests Will Love It: Ideal for a fun family day—swim, paddle, picnic, or enjoy the playground. Great access to town amenities if guests want a snack or cold drink.<\/p>", "photo": "ee2ae70400fe14a23e835a7a2dcdfd0e.jpg", "id": "richardi-park-intermediate-river"}]}, {"title": "Parks and Playgrounds", "items": [{"title": "Lakeview Hotel", "html": "<p>Check out the quaint little playground just outside the Lakeview Hotel! It&rsquo;s the perfect spot for kids to blow off some steam before or after a swim in the resort pools.&nbsp;<\/p>", "photo": "55477cfc0180af46de5a4637308d3fb0.jpg", "loc": [44.948575, -85.185078], "pin": "parks_and_nature", "id": "lakeview-hotel"}, {"title": "Summit Village Beach Club", "html": "<p>Check out the playground at the Bellaire Beach Club! If the kids need a break from swimming or relaxing on the beach, they can enjoy some fun time on the playground while you soak in the beautiful lakeside atmosphere.<\/p>", "photo": "f376f4b87d3709e04990df61953f81f7.jpg", "loc": [44.952901, -85.203728], "pin": "parks_and_nature", "id": "summit-village-beach-club"}]}]}, "schuss-mountain": {"id": "schuss-mountain", "title": "Schuss Mountain", "icon": "mountain-snow", "groups": [{"title": "", "items": [{"title": "Alpine Tubing", "html": "<p>If skiing and snowboarding aren’t your thing—don’t worry! There’s still a fast and fun way to enjoy the snow. <strong>Alpine Tubing<\/strong> at <strong>Summit Mountain<\/strong> is a must-try winter activity, delivering all the thrills of sledding without the uphill climb.<\/p> <p>You’ll hear laughter echoing across the slopes as guests of all ages race down the tubing lanes and ride the surface lift right back to the top. No skills required—just hold on and enjoy the ride!<\/p> <p>🎯 <strong>What to Know:<\/strong><\/p> <ul> <li> <p>Available <strong>Friday evenings, Saturdays, Sundays &amp; holidays<\/strong><\/p> <\/li> <li> <p><strong>Sessions start at the top of every hour<\/strong><\/p> <\/li> <li> <p><strong>$25/hour<\/strong> on weekends and holidays, <strong>$23/hour<\/strong> on non-weekend days<\/p> <\/li> <li> <p><strong>Online booking only<\/strong><\/p> <\/li> <li> <p>Participants must be <strong>36″ tall<\/strong><\/p> <\/li> <\/ul> <p>💡 <strong>Parents Note:<\/strong><br/>The <strong>last two hours<\/strong> on <strong>Friday and Saturday nights<\/strong> are recommended for <strong>Adults Only<\/strong>—ideal for grown-ups looking to enjoy some child-free fun.<\/p> <p>Whether you're with friends, family, or flying solo, Alpine Tubing offers a unique and laughter-filled way to enjoy Shanty Creek’s winter wonderland.<\/p> <p><strong>More info &amp; booking:<\/strong> <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/#tubing\">https://www.shantycreek.com/ski/more-on-the-snow/#tubing<\/a><\/p>", "photo": "d85f4f59827bb40aa6b6ac461d66783d.jpg", "id": "alpine-tubing"}, {"title": "Cross Country Skiing", "html": "<section> <p>Few activities showcase the beauty of northern Michigan quite like cross country skiing. Shanty Creek’s 18km of groomed, track-set trails crisscross the four villages of the resort to create a “village-to-village” experience whose benefits include staying warm in winter, a heart-healthy cardio workout, and a beautiful setting. If Nordic skiing isn’t your thing, there is a 3km groomed multi-purpose trail at Schuss Village designated for fat tire biking and snowshoeing. This trail helps ensure skiers and bikers avoid accidents and unforeseen trail damage.<\/p> <\/section> <section> <div> <div> Schuss Village Nordic Center <p>Shanty Creek's Nordic Center is located in Schuss Village adjacent to the Pine Cone trail head.<\/p> <p>• Current trail conditions: 231-533-3000;3300<br/>• Ski package and snowshoe rentals<br/>• Private lessons available<br/>• Monday-Thursdays: 9am-4pm <strong>Closed Wednesday<\/strong><br/>• Saturdays-Sundays: 9am-5pm<br/>• Additional Hours during holiday dates<\/p> <p>Details for cross-country ski lessons:<br/>- Recommend 48 hours' notice to schedule a lesson.<br/>- Cancellations must be 48 hours in advance for a refund.<br/>- Requests for a specific instructor at least 3 days in advance.<\/p> <\/div> <\/div> <div> <div><strong><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/12/Nordic-Trail-Map-2025.jpg\">Cross Country Trail Map<\/a><\/strong><\/div> <\/div> <\/section>", "photo": "72383d27f4f5158b00c45e7424032b5b.jpg", "id": "cross-country-skiing"}, {"title": "Fat Tire Biking", "html": "<p>Website: <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/#fattirebiking\">https://www.shantycreek.com/ski/more-on-the-snow/#fattirebiking<\/a><br/><a href=\"https://www.shantycreek.com/important-information/#contactus\">Contact Here<\/a><\/p> <p>Looking for a fun winter adventure? Try <strong>fat tire biking on snow<\/strong> at Shanty Creek Resorts! The <strong>3km multipurpose trail at Schuss Village<\/strong> is groomed for fat tire biking, snowshoeing, or even a peaceful winter walk with your dog. Bikes are available for rent just minutes away at <strong>Paddles &amp; Pedals in downtown Bellaire<\/strong>, making it easy for guests to hit the trails and enjoy Michigan’s snowy outdoors.<\/p>", "photo": "fca2ac1ba3f4a7f260f3a476cd3bb7a7.jpg", "id": "fat-tire-biking"}, {"title": "Nordic Skiing", "html": "<p>Few activities capture the quiet beauty of northern Michigan in winter quite like Nordic skiing. At <strong>Shanty Creek Resort<\/strong>, you’ll find <strong>18km of groomed, track-set cross-country trails<\/strong> that wind between the resort’s four villages—creating a scenic, heart-healthy, and soul-refreshing <em>village-to-village<\/em> skiing experience.<\/p> <p>Whether you're looking for a cardio workout or a serene glide through the snow-covered woods, these trails deliver.<\/p> <p>🔹 <strong>Multi-Purpose Trail:<\/strong><br/>If Nordic skiing isn’t your thing, a <strong>3km groomed trail<\/strong> in <strong>Schuss Village<\/strong> is open for <strong>fat tire biking<\/strong> and <strong>snowshoeing<\/strong>, keeping trail usage safe and enjoyable for all guests.<\/p> <p>🔹 <strong>Nordic Center at Schuss Village:<\/strong><br/>Located adjacent to the Pine Cone trailhead, the Nordic Center offers:<\/p> <ul> <li> <p><strong>Classic &amp; skating-style ski rentals<\/strong><\/p> <\/li> <li> <p><strong>Snowshoe rentals<\/strong><\/p> <\/li> <li> <p>Friendly assistance to get you trail-ready<\/p> <\/li> <\/ul> <p>🔹 <strong>Hours of Operation:<\/strong><\/p> <ul> <li> <p><strong>Thursday–Friday:<\/strong> 9AM – 4PM<\/p> <\/li> <li> <p><strong>Saturday–Sunday:<\/strong> 9AM – 5PM<\/p> <\/li> <li> <p><strong>Monday:<\/strong> 9AM – 4PM<\/p> <\/li> <li> <p><strong>Closed Tuesdays &amp; Wednesdays<\/strong><\/p> <\/li> <li> <p><strong>Extended hours during holidays<\/strong><\/p> <\/li> <\/ul> <p>🔹 <strong>Lessons Available:<\/strong><\/p> <ul> <li> <p><strong>Advance booking (48 hrs)<\/strong> is recommended<\/p> <\/li> <li> <p><strong>Cancellations require 48 hrs’ notice<\/strong> for a refund<\/p> <\/li> <li> <p><strong>Instructor requests<\/strong> must be made <strong>at least 3 days<\/strong> in advance<\/p> <\/li> <\/ul> <p>Explore over <strong>20km of tranquil, groomed Nordic trails<\/strong>, perfect for beginners and experienced skiers alike.<\/p> <p><strong>For more info:<\/strong> <a href=\"https://www.shantycreek.com/ski/nordic-trails/\">https://www.shantycreek.com/ski/nordic-trails/<\/a><\/p>", "photo": "afadf1fc5ceb077b8427fb28bcb335fe.jpg", "id": "nordic-skiing"}, {"title": "Nordic Trail Map", "html": "<p>Explore the snow-covered beauty of Shanty Creek Resort through its scenic <strong>Nordic ski and snowshoe trails<\/strong>. Whether you're a beginner or an experienced skier, these trails offer a peaceful and invigorating way to enjoy winter across Schuss Mountain.<\/p> <p><strong>Trail Overview <\/strong><br/>Trail Name | Distance (km) | Difficulty | Trail Use <br/>Mountain Creek | 2.5 km | ● Moderate | Cross-country skiing <br/>Poets Loop | 4.5 km | ● Moderate | Cross-country skiing <br/>Pine Cone | 4.5 km | ◆ Difficult | Cross-country skiing <br/>Winter Brook | 1.5 km | ● Moderate | Cross-country skiing <br/>King of the Hill | 1.5 km | ◆ Difficult | Cross-country skiing <br/>Schuss Mountain | 3.0 km | ● Easiest | Multi-purpose (snowshoe &amp; bike) <\/p> Trail Markings <ul> <li><strong>⬤ Easiest<\/strong><\/li> <li><strong>● Moderate<\/strong><\/li> <li><strong>◆ Difficult<\/strong><\/li> <li><strong>⬛ Trail Head<\/strong><\/li> <li><strong>Aa Landmarks<\/strong><\/li> <\/ul> <p>Each trail is clearly marked with signage and trailhead icons for convenience.<\/p> Village-to-Village Adventure <p>Many of these trails connect Schuss Mountain Village to surrounding areas like <strong>Cedar River Village<\/strong>, providing a <strong>“village-to-village”<\/strong> Nordic experience. You’ll pass iconic spots like <strong>Riverview<\/strong>, <strong>Red Lift Corner<\/strong>, and <strong>#3 Tee<\/strong>, making your trek both scenic and exciting.<\/p> <p><strong>Hours of Operation<\/strong><\/p> <ul> <li><strong>Mon, Thurs, Fri:<\/strong> 9am – 4pm<\/li> <li><strong>Sat–Sun:<\/strong> 9am – 5pm<\/li> <li><strong>Closed:<\/strong> Tues &amp; Wed<\/li> <li><em>Holiday hours may vary<\/em><\/li> <\/ul> <p><strong>Ready to explore the trails?<\/strong><br/>View the full trail map here: <a href=\"https://www.shantycreek.com/wp-content/uploads/2024/12/Nordic-Trail-Map-2025.jpg\">https://www.shantycreek.com/wp-content/uploads/2024/12/Nordic-Trail-Map-2025.jpg<\/a><\/p> <p>More info: <a href=\"https://www.shantycreek.com/ski/nordic-trails\">shantycreek.com/ski/nordic-trails<\/a><\/p>", "photo": "962a7f82255b70903a5737f2f8746089.jpg", "id": "nordic-trail-map"}, {"title": "Schuss Mountain Trail Map", "html": "<p><em>Welcome to one of Michigan’s top ski destinations—where terrain, trails, and fun come together at Schuss Mountain, Shanty Creek Resort.<\/em><\/p> <p>Trail Overview | Schuss Mountain offers a variety of trails for all skill levels. Whether you’re a beginner or an expert, you’ll find groomed runs, glades, terrain parks, and great views across the mountain.<\/p> <p>Trail Difficulty | Symbol | Description <br/>Easiest | ● Green Circle | Wide, gentle slopes perfect for beginners <br/>Intermediate | ♦ Blue Square | More challenging runs for developing skiers <br/>Difficult | ◆ Black Diamond | Steeper, narrower, and faster terrain <br/>Most Difficult | ⯁ Double Black Diamond | Expert terrain with steep drops and glades<\/p> <p><strong>Lifts - Schuss Mountain is equipped with a variety of lifts to help you access all areas of the resort efficiently:<\/strong><\/p> <ul> <li><strong>Purple Lift<\/strong> – Access to beginner/intermediate terrain<\/li> <li><strong>Red Lift<\/strong> – Access to terrain park and advanced runs<\/li> <li><strong>Yellow Lift<\/strong> – Connects to summit trails<\/li> <li><strong>Surface Lifts<\/strong> – Perfect for beginners and ski school zones<\/li> <\/ul> <p><strong>Terrain Parks - Test your skills or try something new:<\/strong><\/p> <ul> <li> <p><strong>Low Rider Terrain Park<\/strong> – Features jumps, rails, and boxes for freestyle riders<\/p> <\/li> <li> <p><strong>Progression Zones<\/strong> – Great for learning tricks safely<\/p> <\/li> <\/ul> <p><strong>Key Areas<\/strong><\/p> <ul> <li><strong>Schuss Village<\/strong> – Base area with day lodge, rentals, tickets, ski school, and food<\/li> <li><strong>The Pink Lift Corner<\/strong> – Connects with multiple trail zones for diverse runs<\/li> <li><strong>Cedar River Village<\/strong> – Offers ski-in/ski-out access and lodging<\/li> <li><strong>Ski Patrol<\/strong> – Located near key intersections for safety and assistance<\/li> <\/ul> <p><strong>Tips for Visitors<\/strong><\/p> <ul> <li>Start your day early for fresh corduroy runs<\/li> <li>Green trails near the base are best for families and beginners<\/li> <li>Use lift maps and signage to plan your route across the mountain<\/li> <li>Helmets are recommended for all riders<\/li> <\/ul> <p><strong>Download full trail map<\/strong>: <a href=\"https://www.shantycreek.com/wp-content/uploads/2021/12/Schuss-Mountain-and-Nordic-Trails-Online.pdf\">Schuss Mountain Trail Map PDF<\/a><\/p>", "photo": "7448326df61a45446d2ccc03cc09cf2e.jpg", "id": "schuss-mountain-trail-map"}, {"title": "Skiing / Snowboarding", "html": "<p><strong>Website:<\/strong> <a href=\"https://www.shantycreek.com/ski/\">https://www.shantycreek.com/ski/<\/a><br/><br/>Shanty Creek Resort offers one of Michigan’s most beloved ski destinations with over <strong>50 downhill slopes<\/strong> spread across <strong>Schuss Mountain<\/strong> and <strong>Summit Mountain<\/strong>, making it ideal for skiers and snowboarders of all skill levels.<\/p> <p>Whether you’re a beginner looking for gentle runs or a seasoned skier chasing fresh powder and steeps, the variety of terrain, well-maintained conditions, and laid-back vibe deliver exactly what you need.<\/p> <p>With breathtaking northern Michigan scenery and a full-service resort experience, <strong>Schuss Mountain<\/strong> simply delivers <em>A Better Value<\/em>.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2021/12/Schuss-Mountain-and-Nordic-Trails-Online.pdf\">Schuss Mountain Trail Map<\/a><\/p> <p><a href=\"https://www.shantycreek.com/ski/?keyword=LiftTickets\">Lift Tickets<\/a><\/p> <p><a href=\"https://www.shantycreek.com/ski/rental-equipment/\">Rental Equipment<\/a><\/p> <p><a href=\"https://www.shantycreek.com/ski/ski-school/\">Ski School<\/a><\/p> <p><a href=\"https://www.shantycreek.com/ski/on-the-snow/#terrainparks\">Terrain Park(s)<\/a><\/p>", "photo": "ecdeea7f506281ea3a23b75cb0cccbf0.jpg", "id": "skiing-snowboarding"}, {"title": "Snow Glide Tours", "html": "<p>Experience winter like never before with Shanty Creek’s <strong>Snow Glide Tours<\/strong> — a scenic, cozy, and memorable ride for all ages.<\/p> <p>Departing from The Lakeview Hotel's front circle, this 45-minute guided tour winds through the snow-blanketed landscapes of <strong>Summit Village<\/strong>, offering sweeping views and a peaceful winter retreat without breaking a sweat. Whether you're snapping photos or simply soaking in the scenery, it’s the perfect way to appreciate the magic of northern Michigan in winter.<\/p> <p>Each tour accommodates up to <strong>9 passengers<\/strong> and is safely pulled behind “<strong>Big Blue<\/strong>,” a powerful double-track snowmobile. The Snow Glide is equipped with seatbelts for a secure and comfortable ride.<\/p> <p><strong>Tour Schedule<\/strong>:<\/p> <ul> <li> <p>Fridays, Saturdays, Sundays, and select holiday dates<\/p> <\/li> <li> <p>Departures on the hour from <strong>9:00 AM to 3:00 PM<\/strong><\/p> <\/li> <\/ul> <p><strong>Price<\/strong>: $25 per seat<br/><em>Limited availability – early booking is highly recommended!<\/em><\/p> <p>More Info &amp; Booking: <a href=\"https://www.shantycreek.com/snow-glide-tours/\">https://www.shantycreek.com/snow-glide-tours/<\/a> <\/p>", "photo": "945e35a66551654ffb82c6f681fcb243.jpg", "id": "snow-glide-tours"}, {"title": "Snow Tubing!", "html": "<p>Experience the thrill of sledding without having to climb back up!<\/p> <p>• <strong>Friday<\/strong> <strong>Evenings<\/strong>, <strong>Saturdays<\/strong>, <strong>Sundays<\/strong>, <strong>and<\/strong> <strong>holidays<\/strong><br/>• Each session begins at the top of the hour<br/>• Tickets are $25/hour (Weekend &amp; Holidays), $23/hour (Non-Weekends)<br/>• Must be 36″ tall to participate<\/p> <p>For Guests with Young Children: While alpine tubing is certainly fun for all ages, please be aware the final two hours on Friday and Saturday nights are recommended for Adults Only.<\/p> <p><a href=\"https://www.shantycreek.com/ski/more-on-the-snow/?keyword=Alpine%20Tubing\">BOOK NOW<\/a><\/p>", "photo": "39fb3299ed24dd32b33f0fc9cf955516.jpg", "id": "snow-tubing"}, {"title": "Snowshoeing", "html": "<p><strong>Forge Your Own Trail – Adventure Awaits<\/strong><\/p> <p>Whether you're a seasoned snowshoer or trying it for the first time, snowshoeing at Shanty Creek offers a peaceful and scenic way to explore the winter woods of northern Michigan.<\/p> <p>Slip on a pair and start walking—no special skills required. You can blaze your own path through the snowy landscape or follow the <strong>groomed 3km multi-purpose trail<\/strong> located at <strong>Schuss Village<\/strong>, shared with fat tire bikers and designed to minimize trail damage while keeping everyone safe.<\/p> <p><strong>Rental Equipment<\/strong> is available at the <strong>Nordic Center<\/strong> in Schuss Village, including snowshoes and poles.<\/p> <p>This is a perfect winter activity for those seeking quiet beauty, fresh air, and an easy-going workout.<\/p> <p>More Info: <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/\">https://www.shantycreek.com/ski/more-on-the-snow/<\/a><\/p>", "photo": "4f4d2e709de1bc62ff4df4377b6b2ea1.jpg", "id": "snowshoeing"}]}]}, "shopping": {"id": "shopping", "title": "Shopping", "icon": "shopping-bag", "groups": [{"title": "", "items": [{"title": "Little Treasures Toy & Gift", "html": "<p>Website: <a href=\"https://www.bellairechamber.org/shop/\">https://www.bellairechamber.org/shop/<\/a><\/p> <p>Phone: (231) 533-6559<\/p> <p>Delightful shop brimming with classic toys and fun gifts—perfect for kids and memorable souvenirs.<\/p>", "photo": "ca4bd12145e263e5155c1a208bcb8544.jpg", "loc": [44.975421, -85.211307], "pin": "retail_therapy", "id": "little-treasures-toy-gift"}, {"title": "Paddles & Pedals", "html": "<p>Website: <a href=\"https://www.bellairepaddlesandpedals.com/\">https://www.bellairepaddlesandpedals.com/<\/a><br/>Phone: (231) 533-4449<\/p> <p>A multi-purpose shop offering both fashion (men’s &amp; women’s), accessories, bike sales &amp; service, <em>and<\/em> kayak rentals—great for browsing before or after an outdoor adventure.<\/p>", "photo": "9eeeb43b3de319fb1d3ec056225b600d.jpg", "loc": [44.977086, -85.209695], "pin": "retail_therapy", "id": "paddles-pedals"}, {"title": "Uniquely North", "html": "<p>Website: <a href=\"https://www.uniquelynorth.com/\">https://www.uniquelynorth.com/<\/a><br/>Phone: (231) 533-4630<\/p> <p>A warm, family-run boutique featuring stylish Up-North apparel, home décor, art, and gifts—“tons of cute clothes, jewelry, décor, and some kids’ stuff too.” <\/p>", "photo": "3eda5e320f2b7e32d356a720f7bfee75.jpg", "loc": [44.977679, -85.210296], "pin": "retail_therapy", "id": "uniquely-north"}]}]}, "shorts-brewing": {"id": "shorts-brewing", "title": "Short's Brewing Company", "icon": "beer", "groups": [{"title": "Brewery Tours & Tastings", "items": [{"title": "The Bellaire Pub - Guided Brewery Tour", "html": "<p>Ever wondered what goes into crafting your favorite Short’s brew? Now's your chance to find out! Short’s Brewing Company offers behind-the-scenes tours at their Bellaire Pub, giving you an insider’s look at the brewing process from start to finish.<\/p> <p>Website: <a href=\"https://www.shortsbrewing.com/tours/\">https://www.shortsbrewing.com/tours/<\/a><\/p> <p>Youtube: <a href=\"https://www.youtube.com/watch?v=hB_pr3V0KfA\">https://www.youtube.com/watch?v=hB_pr3V0KfA<\/a><\/p> <p>Tour Highlights:<\/p> <ul> <li> <p>When: Fridays and Saturdays, from 12:00 PM to 4:00 PM. No reservations are required; simply check in at the host stand upon arrival. <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/\">shortsbrewing.com<\/a><\/p> <\/li> <li> <p>What to Expect: A guided walk through the innovation brewery where you'll learn about the brewing process, the history of Short’s, and the artistry behind their unique beers.<\/p> <\/li> <li> <p>Duration: Approximately 30–45 minutes.<\/p> <\/li> <li> <p>Cost: Complimentary with your pub visit.<\/p> <\/li> <\/ul> <p>Pro Tips:<\/p> <ul> <li> <p>Arrive Early: Tours are popular and spots fill up quickly. Arriving a bit early ensures you don't miss out.<\/p> <\/li> <li> <p>Stay for a Pint: After the tour, enjoy a freshly poured pint of your favorite Short’s brew in the cozy pub or the lively beer garden.<\/p> <\/li> <li> <p>Ask Questions: The staff are passionate about their craft and love sharing their knowledge. Don’t hesitate to ask about the brewing process, ingredients, or the inspiration behind their beers.<\/p> <\/li> <\/ul> <p>Contact Information:<\/p> <ul> <li> <p>Phone: (231) 498-2300<\/p> <\/li> <\/ul>", "photo": "675241620cdd5ea6c4b9b66d9e7d4631.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "the-bellaire-pub-guided-brewery-tour"}, {"title": "Bellaire Pub Beers", "html": "<em>Subject to change (y’all are thirsty!)<\/em> <p><strong>On Tap<\/strong><\/p> <div> <div> Bellaire Brown Bello Birra Black and Tan <table> <thead> <tr><\/tr> <\/thead> <tbody> <tr> <td>Dock Sitting<\/td> <td>Huma Lupa Licious<\/td> <td>Jabroni And Lime<\/td> <\/tr> <tr> <td>LITRO Stout<\/td> <td>Local’s Light<\/td> <td>Local’s Shandy<\/td> <\/tr> <tr> <td>Lord Of The Manor<\/td> <td>Nicie<\/td> <td>Only Tourists<\/td> <\/tr> <tr> <td>Pistachio Cream Ale<\/td> <td>Pure Michigan Porter<\/td> <td>Rocktoberfest<\/td> <\/tr> <tr> <td>Soft Parade<\/td> <td>Soft Parade Shandy<\/td> <td>Spicy Queen<\/td> <\/tr> <tr> <td>Spruce Pilsner<\/td> <td>Summer Heat<\/td> <td>The Village Reserve<\/td> <\/tr> <tr> <td>Total Consciousness<\/td> <td>Squishy<\/td> <td> <\/td> <\/tr> <\/tbody> <\/table> <div> <div> <\/div> <\/div> <\/div> <\/div> <p><strong>Packaged<\/strong><\/p> <div> <div> Anni Ale Bellaire Brown Citra Local’s <table> <thead> <tr><\/tr> <\/thead> <tbody> <tr> <td>Huma Lupa Licious<\/td> <td>Local’s Amber<\/td> <td>Local’s Light<\/td> <\/tr> <tr> <td>Local’s Shandy<\/td> <td>Nicie<\/td> <td>Nitro Super Delicious Stout<\/td> <\/tr> <tr> <td>Only Tourists<\/td> <td>Porta Party<\/td> <td>Power of Love<\/td> <\/tr> <tr> <td>Psychedelic Cat Grass<\/td> <td>Pure Michigan Hazy<\/td> <td>Pure Michigan Winter Pils<\/td> <\/tr> <tr> <td>Soft Parade<\/td> <td>Soft Parade Shandy<\/td> <td>Summer Heat<\/td> <\/tr> <tr> <td>The Magician<\/td> <td>Thirst Mutilator Grape<\/td> <td>Thirst Mutilator Lemon Lime<\/td> <\/tr> <tr> <td>Octorock<\/td> <td>Pulsar<\/td> <td>Squishy<\/td> <\/tr> <tr> <td>Toucana<\/td> <td> <\/td> <td> <\/td> <\/tr> <\/tbody> <\/table> <div> <div> <\/div> <\/div> <\/div> <\/div> <p>Find the full list at Bellaire Pub Beer List: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/beer-list/\">https://www.shortsbrewing.com/locations/bellaire-pub/beer-list/<\/a> <\/p>", "photo": "e520e6443d2f1fe57dad2c142122274f.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "bellaire-pub-beers"}, {"title": "Bellaire Pub Menu", "html": "<p>Welcome to the Mothership — the original Shorts Brewing spot where great food, great beer, and Good Humans come together. What started as a hardware store in 2004 has transformed into a local favorite filled with love, good vibes, and delicious eats.<\/p> <p><strong>Popular Appetizers<\/strong><\/p> <ul> <li>Buffalo Chicken Dip with blue cheese crumbles<\/li> <li>Nachos piled high with black bean corn salsa and cheese<\/li> <li>House-made Mac n’ Cheese topped with toasted panko<\/li> <li>Soft Pretzels served with mustard, jam, and cheese spread<\/li> <\/ul> <p><strong>Fresh Salads<\/strong><\/p> <ul> <li>Caesar with shaved Parmigiano and croutons<\/li> <li>Chipotle BBQ Chicken with avocado and black bean salsa<\/li> <li>Mixed greens with feta, falafel, and Greek dressing<\/li> <\/ul> <p><strong>Sammies &amp; Sandwiches<\/strong><\/p> <ul> <li>Pulled Pork Sammie with Carolina BBQ and coleslaw<\/li> <li>Adult Grilled Cheese with multiple cheeses and avocado<\/li> <li>Classic grinders and corned beef on rye<\/li> <\/ul> <p><strong>Build Your Own Pizza &amp; Specialty Pies<\/strong><br/>Handcrafted dough made with Local’s Light Lager — customize toppings or try favorites like house-made sausage, pulled pork, or mushroom festival.<\/p> <p>Explore the full menu here: <a href=\"https://www.shortsbrewing.com/wp-content/uploads/2025/05/2025_Greatest_Hits_FINAL_June_WEB.pdf\">2025 Bellaire Pub Greatest Hits Menu (PDF)<\/a><\/p>", "photo": "3455b3d107564febc10408585ec9f48d.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "bellaire-pub-menu"}, {"title": "Beverages", "html": "<p><em>Explore Short’s core brews, from year-round favorites to unique Pub exclusives.<\/em><\/p> <p><strong>Always Available<\/strong><br/>These beloved beers and ciders are brewed year-round and widely available:<\/p> <p>| Thirst Mutilator Grape (Cans) | Pulsar (Cans | Kegs) | Octorock (Cans | Kegs) | Thirst Mutilator Lemon Lime (Cans) | Local’s Amber (Cans | Kegs) | Bellaire Brown (Cans | Kegs) | Huma Lupa Licious (Cans | Kegs) | Local’s Light (Cans | Kegs) | Psychedelic Cat Grass (Cans | Kegs) | Soft Parade | | |<\/p> <p>Find these and more on Short’s flagship beers page: <a href=\"https://www.shortsbrewing.com/beer-category/flagship/\">https://www.shortsbrewing.com/beer-category/flagship/<\/a> <\/p>", "photo": "aab7f420bb05ac4dd9d625ddc9303bdb.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "beverages"}, {"title": "Elk Rapids Pull Barn Beers", "html": "<p><strong>Subject to change — because y’all are thirsty!<\/strong><\/p> <p>At the Elk Rapids Pull Barn, you’ll find a rotating selection of Short’s Brewing favorites both on tap and in packaged form. Whether you’re craving a crisp, refreshing pint or want to take home your favorite brew, the lineup offers something for every palate.<\/p> <p><strong>On Tap<\/strong><br/>Anni Ale | Bellaire Brown | Dock Sitting | Huma Lupa Licious | Irish Red | Lemon-Hop Stand | LITRO Stout | Local’s Amber | Local’s Light | Local’s Light Lime | Nicie | Only Tourists | Power of Love | Professor Puckerstein | Pure Michigan Hazy | Soft Parade | Summer Heat | Total Consciousness | Toucana<\/p> <p><strong>Packaged<\/strong><br/>Anni Ale | Bellaire Brown | Citra Local’s | Huma Lupa Licious | Local’s Light | Psychedelic Cat Grass | Soft Parade | Thirst Mutilator Lemon Lime | Pulsar<\/p> <p>Come by and enjoy the freshest brews that Short’s has to offer — from classic staples to exciting new creations!<br/><br/>Check Here: <a href=\"https://www.shortsbrewing.com/locations/elk-rapids/beer-list/\">https://www.shortsbrewing.com/locations/elk-rapids/beer-list/<\/a> <\/p>", "photo": "e07b47bceebd2e483cdb4d80dce4ee68.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "elk-rapids-pull-barn-beers"}, {"title": "Food Truck Takeout", "html": "<p>The food trucks are back, and we couldn’t be more excited. Stop in for packaged beer, join us for game night, and get ready for an awesome summer of food trucks and sunsets.<\/p> <p><strong>Osorio Tacos y Salsas:<\/strong> Miguel and team are serving up delicious eats during Pull Barn hours.<\/p> <p><strong>Flannigan’s Goat:<\/strong> Garth and family are smoking meats Wednesday–Thursday from 2–7 PM, Friday &amp; Saturday from noon–8 PM, and Sunday from noon–7 PM.<\/p> <p>Takeout, crockpots, and picnics are all welcome—so bring your appetite and enjoy!<\/p> <p>Explore more options: <a href=\"https://business.elkrapidschamber.org/list/ql/restaurants-food-beverages-21\">https://business.elkrapidschamber.org/list/ql/restaurants-food-beverages-21<\/a> <\/p>", "photo": "b7a7e990b266c4506764bb4689dac719.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "food-truck-takeout"}, {"title": "Limited Releases", "html": "<p><strong>Limited Releases<\/strong><\/p> <p>Welcome to the treasure trove of Short’s Brewing — the Willy Wonka vault of rare and one-time-only brews. When you spot these limited releases, grab them fast! Chances are, they won’t be around for long, making each sip a special experience.<\/p> <p>Here’s a sampling of some current and recent gems:<\/p> <div> <div> Anni Ale Holiday Battle Plan Apple Cider Donut Cider <table> <thead> <tr><\/tr> <\/thead> <tbody> <tr> <td>IPA 24 Pack Club Variety Pack<\/td> <td>Junk and Rubbish<\/td> <td>Dan’s Pink Skirt<\/td> <\/tr> <tr> <td>Mule Beer<\/td> <td>Oh-Kay<\/td> <td>Kind Ale<\/td> <\/tr> <tr> <td>Silver Tuna<\/td> <td>Thirsty For More<\/td> <td>Citra Local’s Variety Pack<\/td> <\/tr> <\/tbody> <\/table> <div> <\/div> <\/div> <\/div> <p>Explore more limited releases here: <a href=\"https://www.shortsbrewing.com/beer-category/speciality/\">https://www.shortsbrewing.com/beer-category/speciality/<\/a><\/p> <p>Available in cans, kegs, and variety packs, these limited editions showcase the creative spirit and adventurous flavors that keep Short’s fans coming back for more. Don’t miss your chance — these rare finds won’t last!<\/p>", "photo": "5133bbec17018a7651f2737cf622f2c8.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "limited-releases"}, {"title": "Online Order - Bellaire Pub Food Menu", "html": "<p><strong>Order Bellaire Pub Favorites Online<\/strong><br/>Craving your Short’s Brewing Bellaire Pub favorites? Now you can enjoy all the great food and drinks from the comfort of home or wherever you are. Just browse the menu, customize your order, and have it ready for pickup or delivery. Easy, fast, and delicious.<\/p> <p>Short’s Brewing Bellaire Pub Online Ordering: <\/p> <p><a href=\"https://order.toasttab.com/online/shortsbrewing\">https://order.toasttab.com/online/shortsbrewing<\/a><\/p> <p><a href=\"https://www.toasttab.com/local/order/shortsbrewing/r-90d138c1-6857-42ae-9b38-9f6ba89d5f17\">https://www.toasttab.com/local/order/shortsbrewing/r-90d138c1-6857-42ae-9b38-9f6ba89d5f17<\/a> <\/p>", "photo": "2f44291c435448507c332ff57c90753b.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "online-order-bellaire-pub-food-menu"}, {"title": "Seasonal Beers", "html": "<p>At Short’s Brewing, every season brings a fresh lineup of exciting beers crafted to celebrate the flavors and moods of the time of year. Whether it’s a crisp winter pilsner, a bright spring hazy IPA, or a refreshing summer shandy, these limited seasonal brews are only available for a short time — so stock up while you can!<\/p> <p>Here’s a taste of what you’ll find rotating through the taps and cans:<\/p> <div> <div> Local's Light Honeycrisp Pure Michigan Winter Pils Star Parade <table> <thead> <tr><\/tr> <\/thead> <tbody> <tr> <td>Pure Michigan Hazy<\/td> <td>Rhuby<\/td> <td>Magpie<\/td> <\/tr> <tr> <td>Pure Michigan Porter<\/td> <td>Only Tourists<\/td> <td>Local’s Shandy<\/td> <\/tr> <tr> <td>Squishy<\/td> <td>Pure Michigan Spring Hazy IPA<\/td> <td>Pure Michigan Summer IPA<\/td> <\/tr> <\/tbody> <\/table> <div> <\/div> <\/div> <\/div> <p>Discover more seasonal offerings here: <a href=\"https://www.shortsbrewing.com/beer-category/seasonal/\">https://www.shortsbrewing.com/beer-category/seasonal/<\/a> <\/p> <p>Available in cans and kegs, these seasonals showcase Short’s creativity and dedication to bold, flavorful beer all year round. Stay tuned and sip with the seasons!<\/p>", "photo": "30fe859259917ba17972b42762c0103c.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "seasonal-beers"}]}, {"title": "Community Events & Festivals", "items": [{"title": "Community Partnerships", "html": "<p><em>We’re about more than beer — a lot more.<\/em><\/p> <p>Short’s Brewing Company proudly supports a diverse range of community-driven projects. From protecting natural resources and promoting outdoor recreation to advancing equity initiatives, we’re dedicated to making the planet a more awesomer place for everyone. Dive in to discover how we’re partnering with local organizations and causes to create meaningful, positive change.<\/p> <p>For more details, visit the Community Partnerships page: <a href=\"https://www.shortsbrewing.com/community-partnerships/\">https://www.shortsbrewing.com/community-partnerships/<\/a> <\/p>", "photo": "c9d5e5df701c1a72da138e93271c7bbc.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "community-partnerships"}, {"title": "Elk Rapids Pull Barn Events Schedule", "html": "<p>Looking for something to do near Bellaire? The Elk Rapids Pull Barn hosts a fun mix of community events—from trivia nights to live music and craft workshops. Check the calendar below and be sure to subscribe so you never miss a beat<\/p> <p>Check out all upcoming events and explore the full schedule here:<\/p> <p><a href=\"https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1181\">https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1181<\/a> <\/p> <p>Cheers to good times and great beer — enjoy your stay and the local flavor!<\/p>", "photo": "f9b123b7726b448e966f7f58f7cb6671.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "elk-rapids-pull-barn-events-schedule"}, {"title": "Host Your Private Event at Short’s Pub", "html": "<p>Make your next gathering unforgettable with private dining at Short’s Bellaire Pub. Perfectly located near Traverse City, Charlevoix, and Petoskey—and just a quick drive from Grand Rapids, Chicago, and Detroit—our space is ideal for rehearsal dinners, business retreats, and community celebrations. Plus, there’s an Airbnb upstairs if you want to extend the fun overnight.<\/p> <p>Ready to plan your personalized event?<\/p> <p>Book Your Event Here: <a href=\"https://www.shortsbrewing.com/book-an-event/\">https://www.shortsbrewing.com/book-an-event/<\/a> <\/p>", "photo": "f4f295a58649c52750f10d3aa8b8ff78.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "host-your-private-event-at-shorts-pub"}, {"title": "Short’s Brewing Fest & Events Schedule", "html": "<p>Short’s Brewing keeps the good times flowing all year with a mix of beer festivals, charity fundraisers, live music parties, and seasonal celebrations. Whether you’re here for a chill evening or a full-day bash, these events are the perfect chance to connect with locals, savor delicious brews, and dive into the lively Bellaire spirit.<\/p> <p>Check out all upcoming pub events and explore the full schedule here:<\/p> <p><a href=\"https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1178\">https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1178<\/a> <\/p> <p>Cheers to good times and great beer — enjoy your stay and the local flavor!<\/p>", "photo": "473866324d3ec80355f70997b0268be7.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "shorts-brewing-fest-events-schedule"}]}, {"title": "Concerts & Shows", "items": [{"title": "Live Music Every Weekend At Bellaire Beer Garden", "html": "<p>Short’s Brewing Company Bellaire Pub transforms into a lively music venue every Friday and Saturday evening, offering live performances in their scenic Beer Garden. These events are free, family-friendly, and open to guests of all ages—grab a cold brew and let the good times roll!<\/p> <p>Website: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/\">https://www.shortsbrewing.com/locations/bellaire-pub/<\/a><\/p> <p>Whether you’re in the mood to chill with friends or dance the night away, there’s always a great show happening here.<\/p> <p><strong>Summer Hours:<\/strong><\/p> <ul> <li> <p>Thursday: 5 PM – 10 PM<\/p> <\/li> <li> <p>Friday: 5 PM – 10 PM<\/p> <\/li> <li> <p>Saturday: 12 PM – 10 PM<\/p> <\/li> <li> <p>Sunday: 12 PM – 6 PM (or later if the party’s still going!)<\/p> <\/li> <\/ul> <p>Check their schedule for local bands, special guests, and fun events that keep Bellaire buzzing all summer long.<\/p>", "photo": "60831062bcb4be4dfd637abf4a460302.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "live-music-every-weekend-at-bellaire-beer-garden"}, {"title": "Summer Music Series At The Elk Rapids Pull Barn", "html": "<p><strong>Live Music &amp; Great Brews by the Bay<\/strong><br/>Just 20 minutes from the Bellaire Pub, The Pull Barn in Elk Rapids is where laid-back vibes meet great live music and fresh beer on tap. It’s an open-air venue that feels like your favorite backyard party—only with better drinks and a killer stage lineup.<\/p> <p>Expect <strong>live performances all summer long<\/strong>, a rotating draft list of Short’s brews, local food trucks, and that classic Northern Michigan sunset. Whether you're dancing in the grass or sipping a tasting flight under the stars, The Pull Barn is a must-stop.<\/p> <p>Calendar of Events: <a href=\"https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1181\">https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1181<\/a> <\/p>", "photo": "6cc152bf499438d7344506e14e294907.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "summer-music-series-at-the-elk-rapids-pull-barn"}]}, {"title": "Hours & Spots", "items": [{"title": "The Bellaire Pub & Beer Garden", "html": "<p>Short’s Brewing Company’s Bellaire Pub is a vibrant brewpub located in the heart of downtown Bellaire, Michigan. Housed in a historic building, the pub offers a warm and inviting atmosphere where guests can enjoy a wide selection of craft beers brewed on-site, including classics like Local’s Light and Huma Lupa Licious. The menu features a variety of house-made dishes, from pretzels to pizzas, complemented by a curated list of ciders and seltzers.<\/p> <p><strong>Just across the street, you’ll find the lively Beer Garden<\/strong> (118 N Bridge St., Bellaire, MI 49615)<strong>,<\/strong><strong> <\/strong>perfect for soaking up Bellaire’s charming vibe. It's an outdoor venue that hosts live music on Friday and Saturday evenings during the summer months.<\/p> <p><strong>Pub Hours:<\/strong><\/p> <p>Tuesday–Thursday: 11:00 AM – 10:00 PM<\/p> <p>Friday–Saturday: 11:00 AM – 11:00 PM<\/p> <p>Sunday: 11:00 AM – 10:00 PM<\/p> <p><strong>Kitchen Hours:<\/strong><\/p> <p>Tuesday–Thursday: 11:00 AM – 9:00 PM<\/p> <p>Friday–Saturday: 11:00 AM – 10:00 PM<\/p> <p>Sunday: 11:00 AM – 9:00 PM<\/p> <p>For more information, visit the official Bellaire Pub page: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/\">https://www.shortsbrewing.com/locations/bellaire-pub/<\/a> <\/p>", "photo": "9414935094b3f07eedc4de2c085c03b9.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "the-bellaire-pub-beer-garden"}, {"title": "The Elk Rapids Pull Barn", "html": "<p>Elk Rapids was thirsty, so in 2017 we set up draft lines on a pole building at our production campus—thus, the summer beer garden was born. By 2021, The Pull Barn transformed into an indoor, year-round destination. <em>(Psst: Dogs are welcome outside only. Please don’t bring your furry friends inside—not even Kevin!)<\/em><\/p> <p><em>Visit Here: <a href=\"https://www.shortsbrewing.com/locations/elk-rapids/\">https://www.shortsbrewing.com/locations/elk-rapids/<\/a><\/em><\/p> <p><strong>Pull Barn Hours<\/strong><br/>Mon–Thurs: 2:00 PM – 8:00 PM<br/>Fri–Sat: 12:00 PM – 9:00 PM<br/>Sun: 12:00 PM – 8:00 PM<\/p>", "photo": "a1cf764ef96b548bde4cca86b5a3ecaa.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "the-elk-rapids-pull-barn"}, {"title": "Short’s Mart", "html": "<p><em>Your one-stop shop for all things Short’s — beer, gear, and goodies galore.<\/em><\/p> <p>Whether you're looking to rep Short’s in style, stock up on fun gifts, or gear up for summer adventures, Short’s Mart has you covered. From cozy hoodies and caps to glassware, puzzle sets, and camp chairs, these products are made for Good Humans and perfect for any occasion—whether you're at the pub, Pull Barn, or around the campfire.<\/p> <p><strong>Featured Items<\/strong><\/p> <div> <div> <strong>For Drinking<\/strong><strong>For Wearing<\/strong><strong>For Living &amp; Camping<\/strong><table> <thead> <tr> <\/tr> <\/thead> <tbody> <tr> <td>16 oz SiliPint Cup<\/td> <td>Puffy‑print Trucker Hats<\/td> <td>Hammocks (25% off)<\/td> <\/tr> <tr> <td>16 oz Can Glass<\/td> <td>Logo &amp; beverage tees &amp; sweatshirts<\/td> <td>Camp Chairs (25% off)<\/td> <\/tr> <tr> <td>Stubby Tap Handle<\/td> <td>Rad Sweatpants<\/td> <td>1,000‑piece puzzles &amp; decor<\/td> <\/tr> <\/tbody> <\/table> <div> <div> <\/div> <\/div> <\/div> <\/div> <p><strong>Plus…<\/strong> Beer-label onesies, puzzle art prints, insulated tumblers, copper mugs, tap handles, and more—over a hundred playful, practical items to choose from.<\/p> <p>Explore every product here: <a href=\"https://store.shortsbrewing.com/\">https://store.shortsbrewing.com/<\/a> <\/p>", "photo": "e118e6130a30ed25bff4b9ef143b8f22.jpg", "loc": [44.976252, -85.210421], "pin": "retail_therapy", "id": "shorts-mart"}]}]}, "spas-salons": {"id": "spas-salons", "title": "Spas + Salons", "icon": "sparkles", "groups": [{"title": "", "items": [{"title": "AfterEffect – Restorative Body Therapy", "html": "<p>Website: <a href=\"https://www.tryaftereffect.com/\">https://www.tryaftereffect.com/<\/a><\/p> <p>Phone: (231) 709-3489<\/p> <p>A top-rated therapeutic massage service offering a wide variety of modalities—including Deep Tissue, Swedish, Cranial Sacral Therapy, Trigger Point, HydroTherapy, Reflexology, Shiatsu, and Manual Lymphatic Drainage—designed for pain relief and deep relaxation. Ideal for guests seeking serious stress relief or targeted work on aches—especially helpful after outdoor adventures or long drives. Ryan comes highly recommended for both professionalism and healing expertise.<\/p>", "photo": "9288c889833e897af3be35f22685e74d.jpg", "loc": [44.975155, -85.211254], "pin": "spa_beauty", "id": "aftereffect-restorative-body-therapy"}, {"title": "Revive Salon & Spa", "html": "<p>Facebook: <a href=\"https://www.facebook.com/p/Revive-Salon-and-Spa-100063958816813/\">https://www.facebook.com/p/Revive-Salon-and-Spa-100063958816813/<\/a> <\/p> <p>Phone: (use call-to-book via their listings) <a href=\"https://www.fresha.com/lvp/revive-salon-spa-east-broad-street-bellaire-k9wezb\">Fresha<\/a><\/p> <p>Opening Hours: Monday–Friday: 9 AM–5 PM; Saturday &amp; Sunday: Closed<\/p> <p>A full-service salon offering hair styling, coloring, treatments, extensions, keratin straightening, highlights, blowouts, and more <a href=\"https://www.fresha.com/lvp/revive-salon-spa-east-broad-street-bellaire-k9wezb\">Fresha<\/a>. Perfect for guests wanting a quick refresh, stylish haircut, or a beauty touch-up before an evening event or lakeside outing.<\/p>", "photo": "c56d7249315700a58bd467fb55dc6a32.jpg", "loc": [44.976169, -85.197767], "pin": "spa_beauty", "id": "revive-salon-spa"}]}]}, "tours": {"id": "tours", "title": "Take A Tour", "icon": "train-front", "groups": [{"title": "", "items": [{"title": "The Bellaire Pub - Guided Brewery Tour", "html": "<p>Ever wondered what goes into crafting your favorite Short’s brew? Now's your chance to find out! Short’s Brewing Company offers behind-the-scenes tours at their Bellaire Pub, giving you an insider’s look at the brewing process from start to finish.<\/p> <p>Website: <a href=\"https://www.shortsbrewing.com/tours/\">https://www.shortsbrewing.com/tours/<\/a><\/p> <p>Youtube: <a href=\"https://www.youtube.com/watch?v=hB_pr3V0KfA\">https://www.youtube.com/watch?v=hB_pr3V0KfA<\/a><\/p> <p>Tour Highlights:<\/p> <ul> <li> <p>When: Fridays and Saturdays, from 12:00 PM to 4:00 PM. No reservations are required; simply check in at the host stand upon arrival. <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/\">shortsbrewing.com<\/a><\/p> <\/li> <li> <p>What to Expect: A guided walk through the innovation brewery where you'll learn about the brewing process, the history of Short’s, and the artistry behind their unique beers.<\/p> <\/li> <li> <p>Duration: Approximately 30–45 minutes.<\/p> <\/li> <li> <p>Cost: Complimentary with your pub visit.<\/p> <\/li> <\/ul> <p>Pro Tips:<\/p> <ul> <li> <p>Arrive Early: Tours are popular and spots fill up quickly. Arriving a bit early ensures you don't miss out.<\/p> <\/li> <li> <p>Stay for a Pint: After the tour, enjoy a freshly poured pint of your favorite Short’s brew in the cozy pub or the lively beer garden.<\/p> <\/li> <li> <p>Ask Questions: The staff are passionate about their craft and love sharing their knowledge. Don’t hesitate to ask about the brewing process, ingredients, or the inspiration behind their beers.<\/p> <\/li> <\/ul> <p>Contact Information:<\/p> <ul> <li> <p>Phone: (231) 498-2300<\/p> <\/li> <\/ul>", "photo": "675241620cdd5ea6c4b9b66d9e7d4631.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "the-bellaire-pub-guided-brewery-tour"}, {"title": "Charters North – Captain Shaun’s Custom Cruises", "html": "<p>Website: <a href=\"https://chartersnorth.com\">https://chartersnorth.com<\/a> <br/>Phone: (231) 590‑1949<br/>Location: 7939 Brooks St, Central Lake, MI 49622 - Torch Lake area (pickup from Bellaire docks)<br/>Distance: ~15 minutes from Bellaire<\/p> <p>Take your vacation to the next level with fully captained boat adventures by Captain Shaun — a local pro who knows every corner of Torch Lake. From thrilling fishing excursions to relaxing sandbar cruises, you’re in for a custom-tailored experience that’s fun, safe, and unforgettable.<\/p> <p><strong>FAQ Highlights:<\/strong><br/>Captain included | BYOB welcome | Custom cruise options | Pickup arranged at local docks | No license needed<\/p> <p><em><strong>Trip Options:<\/strong><\/em><\/p> <ul> <li>Salmon &amp; Trout Troll: Cruise deep waters in search of lake trout and salmon—great for anglers craving action and big catches.<\/li> <li>Night Walleye Troll: Experience the magic of the lake under the stars while chasing elusive walleye by moonlight.<\/li> <li>Smallmouth Bass Casting: Cast, reel, and laugh your way through a high-energy bass fishing trip with expert guidance.<\/li> <li>Fall Perch Fishing: Seasonal and rewarding—perfect for casual anglers who want to catch plenty and relax.<\/li> <li>Custom Cruises: Whether you want a romantic sunset ride or a sandbar party with friends, Captain Shaun creates your perfect day on the water.<\/li> <li>Fish &amp; Sandbar Package: The ultimate combo—start the day reeling in fish, then unwind with drinks and music at Torch Lake’s famous sandbar.<\/li> <\/ul> <p><strong><em>More Details:<\/em><\/strong><\/p> <ul> <li>Captain Provided: Yes — all trips are fully captained and guided.<\/li> <li>Bring Your Own Drinks: BYOB is welcome—coolers and ice provided.<\/li> <li>Bachelor/Sandbar Parties: Custom Cruises and Fish &amp; Sandbar packs are ideal for bachelor parties, relaxed group trips, or sunset gatherings.<\/li> <li>Docking Info: Departure points are confirmed at booking—most trips start from Bellaire-area docks or private resort marinas.<\/li> <li>Boating License: Not required—Captain Shaun handles all operations.<\/li> <li>What to Bring: Comfortable clothes, sun protection, water, snacks, and your tunes! Charters North provides bottled water, and fish cleaning/packaging is included for fishing trips.<\/li> <\/ul>", "photo": "118f8502b91c601b91d5b4d950d441aa.jpg", "loc": [45.069248, -85.262974], "pin": "boating", "id": "charters-north-captain-shauns-custom-cruises"}, {"title": "Foxy’s Custom Cruises – “Ahoy Matey!”", "html": "<p>Website: <a href=\"https://www.foxyscustomcruises.com\">https://www.foxyscustomcruises.com<\/a> <br/>Phone: (231) 944-6823<br/>Location: Bellaire, MI (Dock info provided upon booking)<\/p> <p>Celebrate in style aboard The Refugee, a luxury tritoon captained by Captain Rob, offering fully guided, private cruises perfect for bachelor parties. Enjoy music, drinks, and a lively atmosphere while cruising Torch Lake’s crystal-clear waters. Bring your own beverages and toast to unforgettable memories!<\/p> <p>FAQs:<\/p> <ul> <li>Captain provided? Yes, Captain Rob pilots every cruise.<\/li> <li>Alcohol allowed? Yes, guests can bring their own drinks aboard.<\/li> <li>Bachelor parties? Absolutely, this is their specialty!<\/li> <li>Docking? Guests board at a private dock arranged by Foxy’s.<\/li> <li>Boating license needed? No, captain included.<\/li> <\/ul>", "photo": "50275bb5744630c646f599567c2b1314.jpg", "loc": [44.942928, -85.281867], "pin": "boating", "id": "foxys-custom-cruises-ahoy-matey"}, {"title": "Grass River Nature Area Tours", "html": "<p><strong>Kayak Tours<\/strong><\/p> <p>There is no better way to experience Grass River than by paddling its calm waters and enjoying its unique wildlife! On these guided tours, visitors explore Grass River by kayak and find out about GRNA’s conservation efforts, wetland plants, and wildlife. Adults and Teens only.<\/p> <p><br/><strong>Guided River Walks<\/strong><\/p> <p>Have a group that would like a private 2-hour tour led by one of our knowledgeable naturalists? Experience the wetlands of Grass River by traversing over the wetlands on boardwalks to the river as a guide leads you in learning about our history, conservation efforts, and the local flora and fauna of GRNA. r.<br/><br/><strong>Private Tours<\/strong>: If you have a group interested in a private guided walking tour, contact <strong>james@grassriver.org<\/strong> to schedule in advance.<\/p> <p><a href=\"https://www.grassriver.org/river-tours.html\">https://www.grassriver.org/river-tours.html<\/a><\/p>", "photo": "deddf2b75c252ba832467a3ea7a0e23d.jpg", "id": "grass-river-nature-area-tours"}, {"title": "Northaire Resort & Pontoon Rentals (Captained Options Available)", "html": "<p>Website: <a href=\"https://www.northaireresort.com\">https://www.northaireresort.com<\/a> <\/p> <p>Phone: (231) 377‑7764<\/p> <p>Primary Dock: South shore of Clam Lake / Torch Lake at 7067 Crystal Springs Rd, Bellaire, MI (~15 minutes drive from downtown Bellaire)<\/p> <p>Alternate Pick-Up: Guests may also launch from dock in Bellaire (near town) depending on availability <\/p> <hr/> <p>Experience northern Michigan’s shimmering Chain of Lakes with ease and comfort. Northaire’s expansive pontoon fleet features spacious, well-maintained boats—available with or without a licensed captain. Enjoy Bluetooth stereo, ladders, bimini tops, and coolers. Begin your journey on Clam Lake, cruise to the turquoise sandbar on Torch Lake, and explore scenic coves and the grass river. Ideal for bridal showers, bachelor parties, family escapades, or sunset soirees!<\/p> <hr/> <p>FAQs<\/p> <ul> <li>Captain Provided? Optional—just request when booking.<\/li> <li>Is alcohol allowed? Yes! BYOB welcome (please enjoy responsibly).<\/li> <li>Are small parties allowed? Absolutely—great for celebrations and group outings.<\/li> <li>Where do guests board? Launch from the private dock at 7067 Crystal Springs Rd, or Bellaire’s dock (confirmation provided before trip) <\/li> <li>Boating license needed? Not required if you book the captain-included option; otherwise, Michigan boating certificate may be needed.<\/li> <\/ul> <p>What important tips? <\/p> <ul> <li>Arrive 15 minutes early for check-in and orientation.<\/li> <li>Bring sunscreen, snacks, and a favorite playlist.<\/li> <li>Consider renting an onboard porta-potty for larger groups.<\/li> <li>Practice no-wake speed in shallow zones like Grass River.<\/li> <\/ul>", "photo": "5c7a4a2ccccdf70e29d2fdf49d698fc1.jpg", "loc": [44.931543, -85.260213], "pin": "places_to_stay", "id": "northaire-resort-pontoon-rentals-captained-options-available"}, {"title": "Sailo Private Yacht & Party Boat Charters", "html": "<p>Website: <a href=\"https://www.sailo.com/boats/Traverse_City_MI/Motor/rental_boat_8000/?duration=fullDay\">https://www.sailo.com/boats/Traverse_City_MI/Motor/rental_boat_8000/?duration=fullDay<\/a> <br/>Phone: +1 910‑447‑2456 (Sailo support) <\/p> <p>Pick-up Location: Varies by boat — docks near Bellaire or Torch Lake (selected based on your booking)<\/p> <p>Rent a luxury party yacht or large tritoon (capacity 13+) with captain included. Choose from full-day, half-day, or sunset experiences. Many include amenities like seating/lounge areas, onboard restrooms, and optional catering.<\/p> <p>FAQs:<\/p> <ul> <li><em>Captain provided?<\/em> Yes—crew included.<\/li> <li><em>Alcohol allowed?<\/em> Yes—BYOB and catered drinks available.<\/li> <li><em>Bachelor parties?<\/em> Definitely—large groups welcome.<\/li> <li><em>Docking?<\/em> Pick-up organized through Sailo at local docks.<\/li> <li><em>License needed?<\/em> No—captain included.<\/li> <\/ul>", "photo": "bf4c8ffe092c75c781166e372dcd0292.jpg", "id": "sailo-private-yacht-party-boat-charters"}, {"title": "Torch Lake Sunset Cruises", "html": "<div> <p>Website: <a href=\"https://www.northaireresort.com/sunset-cruises\">https://www.northaireresort.com/sunset-cruises<\/a> <br/>Phone: (231) 377‑7764<br/>Location: Launches from Dockside Restaurant – 6326 Old Torch Lake Dr, Bellaire, MI<br/>Tour Duration: 2 hours<br/>Captain Provided: Yes – US Coast Guard licensed captain included<\/p> <hr/> <p>Treat yourself to a magical evening on Torch Lake with a <strong>2-hour, captained sunset cruise<\/strong>. Your certified captain will guide you across the calm waters of Clam Lake and out to Torch Lake’s stunning blue expanse as the sun dips into the horizon. You can bring your own beverages, and an onboard cooler is provided.<\/p> <p>Perfect for couples, families, or small groups, this stress-free experience is all about unwinding and soaking in one of the most beautiful sunsets in the Midwest. No boating experience needed—just show up and enjoy!<\/p> <\/div>", "photo": "b5489bed10331fccbc806b3d004b87a0.jpg", "loc": [44.942899, -85.283568], "pin": "boating", "id": "torch-lake-sunset-cruises"}]}]}, "water-activities": {"id": "water-activities", "title": "Water Activities", "icon": "sailboat", "groups": [{"title": "Beaches", "items": [{"title": "Antrim Creek Natural Area & Rex Beach", "html": "<p><em>Explore, Relax, and Rejuvenate by the Lake<\/em><\/p> <p><strong>Website: <\/strong><a href=\"https://www.antrimcountymi.gov/departments___services_/parks___recreation/natural_areas/antrim_creek_natural_area/index.php\">https://www.antrimcountymi.gov/departments___services_/parks___recreation/natural_areas/antrim_creek_natural_area/index.php<\/a> <br/><strong>Phone:<\/strong> (231) 533-6265 — Antrim County Parks &amp; Recreation<br/><strong>Location:<\/strong> 9890 Old Dixie Hwy, Ellsworth, MI 49615 (Approx. 30 minutes from Bellaire)<\/p> <p>Discover the serene beauty of <strong>Antrim Creek Natural Area &amp; Rex Beach<\/strong>, a 156-acre sanctuary nestled along the pristine shores of Grand Traverse Bay. This protected area offers nearly a mile of undeveloped coastline, providing a tranquil retreat for nature enthusiasts and beach lovers alike.<\/p> <p>Embark on scenic hikes through diverse landscapes, including hardwood forests, wetlands, and coastal dunes. The sandy beach at Rex Beach invites you to relax, swim, or enjoy a peaceful picnic with breathtaking lake views.<\/p> <p>Whether you're seeking a quiet escape or an adventure in nature, Antrim Creek Natural Area &amp; Rex Beach offers a perfect blend of outdoor recreation and natural beauty, just a short drive from Bellaire.<\/p> <p>Find out for more: <a href=\"https://www.visitcharlevoix.com/AntrimCreekNatureArea/\">https://www.visitcharlevoix.com/AntrimCreekNatureArea/<\/a> <br/><\/p> <p>FAQs<\/p> <ul> <li>Free parking is available near trailheads and beach access.<\/li> <li>Trails are easy to moderate and suitable for most ages.<\/li> <li>Picnic areas are available; bring your own blanket or chairs.<\/li> <li>Swimming is allowed at Rex Beach (no lifeguards on duty).<\/li> <li>Leashed dogs are welcome; please clean up after pets.<\/li> <\/ul>", "photo": "8bd2336d826b8524b77b6d270cf9be2f.jpg", "loc": [45.179074, -85.378659], "pin": "beaches", "id": "antrim-creek-natural-area-rex-beach"}, {"title": "The Beach Club – Public Beach on Lake Bellaire", "html": "<p>View on MapQuest – The Beach Club, Bellaire MI: <a href=\"https://www.mapquest.com/us/michigan/the-beach-club-437526895\">https://www.mapquest.com/us/michigan/the-beach-club-437526895<\/a> <\/p> <p>Location Guide: The Beach Club, Bellaire, MI 49615 <em>(near Forest Home Township)<\/em><br/><em>Phone: N/A (public managed area)<\/em><\/p> <p>Access: Open to the public, no fees or passes required - minutes away from the cabin<\/p> <p>The Beach Club on Lake Bellaire is a charming, low-key public beach that’s perfect for families and laid-back travelers. Enjoy soft sand under your feet, crystal-clear waters for swimming, and plenty of open space to lay down a towel or set up a picnic. Tucked among trees and greenery, it’s a peaceful, uncrowded alternative to busier lakefronts—ideal for sunbathing, swimming, or simply enjoying the lake’s natural beauty.<\/p> <p>FAQs – What Guests Should Know:<\/p> <ul> <li>Do I need a pass or pay an entrance fee?<br/>Nope! It’s completely free and open to the public—just show up and enjoy.<\/li> <li>Are there picnic areas or tables?<br/>While there are no formal tables, the beach offers grassy spots and open sand perfect for beach blankets or lawn chairs.<\/li> <li>Is it suitable for swimming?<br/>Yes! The water is clean and shallow enough for safe swimming and wading.<\/li> <li>Is there parking available?<br/>Yes, but it’s limited—arrive early on weekends to grab a spot, especially in summer.<\/li> <li>Any tips for first-timers?<br/>Bring sunscreen, towels, snacks, and your beach chairs. There are no lifeguards or concessions, so pack accordingly.<\/li> <\/ul>", "photo": "a8274109429ec06487fbc8afc556f169.jpg", "loc": [44.95253, -85.203743], "pin": "beaches", "id": "the-beach-club-public-beach-on-lake-bellaire"}, {"title": "Craven Park (Lakeside Leisure in Bellaire)", "html": "<p>Website: <a href=\"https://bellairemichigan.com/parks\">https://bellairemichigan.com/parks<\/a> <br/>Phone: (231) 264-9274<br/>Distance from Bellaire: Located within the village<\/p> <hr/> <p>Nestled in the heart of Bellaire, <strong>Craven Park<\/strong> offers a serene lakeside escape with a sandy beach along Lake Bellaire. This charming park features picnic tables, a playground, and ample green space, making it an ideal spot for families and nature enthusiasts. Whether you're looking to swim, picnic, or simply relax by the water, Craven Park provides a peaceful setting to enjoy the outdoors.<br/><\/p> <p>FAQs<\/p> <ul> <li>Is parking available at Craven Park?<br/>Yes, there is convenient parking nearby.<\/li> <li>Is the beach suitable for swimming?<br/>Yes, the sandy beach is perfect for swimming and wading.<\/li> <li>Are there facilities for picnics?<br/>Yes, picnic tables are available throughout the park.<\/li> <li>Is there a playground for children?<br/>Yes, the park features a safe and fun playground area.<\/li> <li>Are pets allowed in the park?<br/>Pets are welcome but must be kept on a leash and cleaned up after.<br/><\/li> <\/ul>", "photo": "bef12c543bbb9a65ba8202ee1fe80efe.jpg", "loc": [44.97672, -85.209675], "pin": "beaches", "id": "craven-park-lakeside-leisure-in-bellaire"}, {"title": "Summit Village Private Beach (HOA) Bellaire Beach Club", "html": "<p>Website: <a href=\"https://www.shantycreek.com/venue/summit-village/\">https://www.shantycreek.com/venue/summit-village/<\/a> <\/p> <p>Phone: 231‑533‑8621<\/p> <p><em>Lake Bellaire – minutes away<br/><\/em><em>Private access included with your stay (Summit Village HOA guest pass required)<\/em><\/p> <p>This exclusive beach is nestled within the <strong>Summit Village community of Shanty Creek Resort<\/strong> and is available only to Summit Village HOA members and their guests. With 350 feet of sandy shoreline, lounge chairs, shaded grassy areas, grills, a playground, and clean restroom facilities, it’s a perfect place to relax or play all day.<\/p> <p>Enjoy sunrise views over the lake, a family-friendly environment, and a quiet, resort-style atmosphere just minutes from the property.<br/><br/><\/p> <p>FAQs:<\/p> <ul> <li>Is this beach open to the public?<br/>No, it’s only accessible to Summit Village HOA members and their registered guests—your Airbnb stay includes access!<\/li> <li>Do I need a pass to enter?<br/>Yes—a guest pass is required and will be provided upon check-in or through the host.<\/li> <li>Are there facilities on-site?<br/>Yes! You’ll find restrooms, BBQ grills, lounge chairs, grassy picnic areas, and even a playground.<\/li> <li>Is it good for kids?<br/>Absolutely—it’s family-friendly, quiet, and well-maintained, with plenty of space to play safely.<\/li> <li>Can we bring food or drinks?<br/>Yes! Pack a cooler, fire up the grill, and enjoy a lakeside picnic. Just please clean up after use.<\/li> <\/ul>", "photo": "73504cef162d8f178592b48e0131f16e.jpg", "loc": [44.95253, -85.203743], "pin": "beaches", "id": "summit-village-private-beach-hoa-bellaire-beach-club"}, {"title": "Torch Lake Sandbar", "html": "<p>A Must-Visit Gem Near Bellaire, MI<\/p> <p>Website: <a href=\"https://torchlake.com\">https://torchlake.com<\/a> <br/>Phone: (231) 533-8818<br/>Location: Torch Lake, about 20 minutes by boat from Bellaire, MI <\/p> <p><em>Access: Best reached by boat, kayak, or jet ski; rentals available nearby<\/em><\/p> <p>Just 20 minutes by boat from Bellaire, Torch Lake Sandbar is famous for its stunning, crystal-clear turquoise waters and soft sandy bottom. Perfect for swimming, sunbathing, and boating, it’s a must-visit spot for a relaxing day on the water. Bring your snacks and sunscreen, and enjoy this beautiful natural gem!<\/p> <p>FAQs – What Guests Should Know<\/p> <ul> <li>How do I get there?<br/>You’ll need a boat or watercraft—rent from a nearby marina or charter a cruise with a captain for a no-hassle trip.<\/li> <li>Can we swim at the sandbar?<br/>Yes! The water is shallow, warm, and perfect for swimming and wading.<\/li> <li>Can we bring drinks and snacks?<br/>Absolutely! BYOB and picnic-friendly—just be respectful and take your trash with you.<\/li> <li>Is it a party spot or family-friendly?<br/>It can be both! Weekends often bring a lively crowd, while weekdays are more relaxed.<\/li> <li>When’s the best time to go?<br/>Arrive early in the day for calmer waters and easy anchoring—especially on weekends and holidays.<\/li> <\/ul>", "photo": "eb90813ab4f1a0afa0eb47a08e35b29f.jpg", "loc": [45.075281, -85.358684], "pin": "beaches", "id": "torch-lake-sandbar"}]}, {"title": "Boat Rentals", "items": [{"title": "Bellaire Pontoon Boat Rental", "html": "<p>Website: <a href=\"https://bellairepontoonrental.com/\">https://bellairepontoonrental.com/<\/a> <br/>Phone: (231) 377‑7764<br/>Location: 204 W Cayuga St, Bellaire, MI (right across Intermediate River from downtown)<\/p> <p>Cruise the beautiful Torch, Clam, and Lake Bellaire aboard a brand-new pontoon or tritoon boat. Whether you want a half-day adventure or a full-day getaway, Bellaire Pontoon Boat Rental offers flexible options with private docks and a safety boat on call for peace of mind. Elevate your experience with a licensed captain for unforgettable sunset cruises to the famous Torch Lake sandbar. Enjoy a luxurious, stress-free day on the water, perfect for families, friends, or special occasions.<\/p> <p>FAQs<\/p> <ul> <li>Are captains provided for rentals?<br/>Yes, licensed captains are available, especially for sunset and sandbar cruises.<\/li> <li>What rental durations are available?<br/>Flexible half-day and full-day rentals to fit your schedule.<\/li> <li>Where can I dock my own boat?<br/>Private docks are available for rental customers.<\/li> <li>Is there a safety boat on standby?<br/>Yes, a safety boat is always on call for added security.<\/li> <li>Can the rental accommodate special occasions like parties?<br/>Absolutely! Perfect for family outings, celebrations, or bachelor parties.<\/li> <\/ul>", "photo": "3cf903e99cb0c0d26f0a40787b74577d.jpg", "loc": [44.975788, -85.213203], "pin": "boating", "id": "bellaire-pontoon-boat-rental"}, {"title": "DeWitt Marine — Boat Rentals on Torch Lake", "html": "<p>Website: <a href=\"https://www.dewittmarine.com\">https://www.dewittmarine.com<\/a> <br/>Phone: (231) 377‑6611<br/>Location: 6509 Crystal Springs Rd, Bellaire, MI 49615 - Just 5 minutes from Bellaire<\/p> <p>DeWitt Marine offers modern pontoons and tritoons for an unforgettable day on Torch Lake! Located where the Clam River meets the lake, it’s the perfect spot to launch your boating adventure. Grab snacks from the Clam Shack, fuel up, and cruise out to the famous Torch Lake Sandbar.<\/p> <p>FAQs:<\/p> <ul> <li>Do boats come with a captain? No, but staff offer clear instructions before you go.<\/li> <li>Is alcohol allowed onboard? Yes — drink responsibly.<\/li> <li>Do I need a boating license? Only if you're under 26 (online certificate accepted).<\/li> <li>Do I need to reserve in advance? Yes, especially in summer!<\/li> <li>Where can I dock after? Return to their private marina or nearby public docks.<\/li> <\/ul>", "photo": "22675b5a0fa139cb95f5897953514141.jpg", "loc": [44.94002, -85.281224], "pin": "boating", "id": "dewitt-marine-boat-rentals-on-torch-lake"}, {"title": "Dockside Water Sports", "html": "<p>Website: <a href=\"https://www.dockside-watersports.com/\">https://www.dockside-watersports.com/<\/a> <br/>Phone: 231-377-7777 ext.2<\/p> <p>Ready for high-performance fun on Northern Michigan’s clearest waters? Dockside Water Sports offers top-tier tritoon rentals and thrilling Sea-Doo jet skis, perfect for both laid-back lake cruising and adrenaline-pumping rides. Guests enjoy valet docking, beach access, indoor restrooms, and comfy onboard extras for a seamless day on the water. Whether you're seeking family-friendly fun or fast-paced adventure, this is your launchpad to unforgettable lake memories.<\/p> <p>FAQs<\/p> <ul> <li>Are captains available for boat rentals?<br/>Rentals are typically self-operated, but staff can assist with guidance or suggestions for local captains.<\/li> <li>Is beach access included?<br/>Yes, guests have access to nearby beach areas from the docking site.<\/li> <li>What amenities are available on-site?<br/>Indoor restrooms, valet docking, beach access, and shaded lounging areas.<\/li> <li>Can we bring food and drinks onboard?<br/>Yes! Coolers and snacks are welcome—just pack responsibly.<\/li> <li>Is training provided for first-time jet ski or boat users?<br/>Absolutely. Staff provides safety and operating instructions before departure.<\/li> <\/ul>", "photo": "c282a4b77a01383fb801765cdcd40046.jpg", "loc": [44.942879, -85.283565], "pin": "boating", "id": "dockside-water-sports"}, {"title": "Foxy’s Custom Cruises (“Ahoy Matey!”)", "html": "<p>Website: <a href=\"https://www.foxyscustomcruises.com\">https://www.foxyscustomcruises.com<\/a><\/p> <p>Phone: (231) 944‑6823<br/>Location Guide: 6349 Old Torch Lake Dr, Bellaire, MI 49615 (Captain Rob will confirm dock location upon booking)<\/p> <p>Hop aboard <em>The Refugee<\/em>, a brand-new luxury tritoon piloted by the unforgettable Captain Rob—a retired Air Force veteran and certified Coast Guard captain. Foxy’s Custom Cruises offers the perfect mix of adventure, celebration, and lake-life luxury. Whether you're in the mood for a romantic sunset cruise, a family outing, or a themed party like “Thirsty Thursday” or “Sandbar Saturday,” every cruise is tailored just for your vibe. Covering Torch Lake, Clam Lake, Intermediate Lake, and Lake Bellaire—this is where unforgettable moments on the water begin.<\/p> <p>FAQs<\/p> <ul> <li>Can we book a captain for the entire day?<br/>Yes! Options range from half-day to full-day cruises with a captain included.<\/li> <li>Are the cruises family-friendly?<br/>Absolutely—Captain Rob customizes cruises for all ages and occasions.<\/li> <li>Can we bring drinks or food onboard?<br/>Yes, BYOB and snacks are welcome. Just let Captain Rob know in advance for cooler prep.<\/li> <li>What kind of events are best for Foxy’s?<br/>Ideal for bachelor/bachelorette parties, romantic dates, birthdays, or just relaxing with friends.<\/li> <li>Do we need boating experience?<br/>Not at all—Captain Rob handles everything so you can kick back and enjoy the ride.<\/li> <\/ul>", "photo": "0648dc92be5e7d0b4bd16252763668af.jpg", "loc": [44.942928, -85.281867], "pin": "boating", "id": "foxys-custom-cruises-ahoy-matey"}, {"title": "M‑88 Boat & Dock Rentals", "html": "<p>Website: <a href=\"https://www.m88boatrentals.com/\">https://www.m88boatrentals.com/<\/a><\/p> <p>Phone: (231) 320-0190<br/>Location: 100 Ohio St, Bellaire, MI 49615 — Right on the Intermediate River, downtown Bellaire<br/>Distance: Just minutes’ walk from the heart of Bellaire<\/p> <p>Discover the freedom to explore Bellaire’s beautiful waterways with M-88 Boat &amp; Dock Rentals. Conveniently located downtown, M-88 offers easy access to pontoons and boat docks—no trailers or ramps needed! Perfect for day trips, relaxing cruises, or exploring nearby sandbars and coves at your own pace. Whether you’re a first-timer or seasoned boater, M-88 provides a hassle-free rental experience in a stunning setting.<\/p> <p>Guest Tips:<\/p> <ul> <li>No boating license required for most rentals — ideal for beginners!<\/li> <li>Lifejackets and safety gear included for your peace of mind.<\/li> <li>Rent by the day or week — flexible options for all plans.<\/li> <li>Launch directly from the dock—walk right onto your boat!<\/li> <li>Bring your favorite snacks and drinks for a perfect day on the water.<\/li> <\/ul>", "photo": "827b4b4d126e2dab8f5dea8d425f0116.jpg", "loc": [44.978174, -85.211558], "pin": "boating", "id": "m-88-boat-dock-rentals"}, {"title": "Northaire Resort & Pontoon Rentals", "html": "<p>Website: <a href=\"https://www.northaireresort.com/\">https://www.northaireresort.com/<\/a> <br/>Phone: (231) 377‑7764<br/>Location Guide: 7067 Crystal Springs Rd, Bellaire, MI 49615 — along the south shores of Clam and Torch Lakes, just minutes from downtown Bellaire by boat or car<\/p> <p>Set sail from a classic Up North destination with the largest fleet of sleek pontoons in the region! Northaire Resort has been making lake dreams come true since 1948—just minutes from downtown Bellaire. Nestled on the southern shores of Clam and Torch Lakes, it’s the ideal launch point for everything from tranquil morning cruises to wild tubing afternoons and golden hour sunset rides.<\/p> <p>Choose your own adventure: captain-optional rentals, dockside pick-up, Bluetooth stereo, bimini tops, swim ladders, tow bars—everything you need for an unforgettable day. Whether you're celebrating something big or just living your best lake life, Northaire makes it seamless and stress-free.<\/p> <p>FAQs<\/p> <ul> <li>Are captains available?<br/>Yes! You can book a licensed captain for a completely hands-free cruise.<\/li> <li>Where do we pick up the boat?<br/>Options include Northaire’s private docks or Bellaire’s public riverfront—ask at booking.<\/li> <li>Can we bring our own food and drinks?<br/>Absolutely—coolers, snacks, and beverages are welcome on board.<\/li> <li>What are the rental hours?<br/>Standard pick-up is at 9 AM, and boats must be returned by 7 PM unless arranged otherwise.<\/li> <li>How far is it to Torch Lake Sandbar?<br/>Just 5–10 minutes by boat! You’ll cruise through Clam Lake and the channel straight to paradise.<\/li> <\/ul>", "photo": "370ebbe78cf84a296ce3187edee5b181.jpg", "loc": [44.931543, -85.260213], "pin": "boating", "id": "northaire-resort-pontoon-rentals"}, {"title": "Sun Life Marina (Torch River Marina) — Premier Pontoon & Tritoon Rentals", "html": "<p>Website: <a href=\"https://www.sunlifetorchriver.com\">https://www.sunlifetorchriver.com<\/a> <br/>Phone: (231) 322‑4
