495<br/>Location Guide: 12906 Cherry Ave, Rapid City, MI 49676 — just south of Torch Lake sandbar - approximately 12 minutes from Bellaire<\/p> <p>Nestled where the Torch River meets Torch Lake, Sun Life Marina offers exceptional pontoon and tritoon rentals in a stunning setting. With well-maintained boats, wet slips, and full marina services (fuel, repairs, storage), they cater to both casual cruisers and party groups. Launch your adventure right to the iconic turquoise waters and sandbar—the perfect backdrop for a memorable lake day!<\/p> <p>FAQs:<\/p> <ul> <li>Do boats come with a captain?<br/>Rentals are self-drive. However, friendly staff always provide thorough orientation before launch.<\/li> <li>Can I bring alcohol onboard?<br/>Yes—BYOB allowed. Please enjoy responsibly.<\/li> <li>Do I need a boating license?<br/>A Michigan boating safety certificate is required if under age 26; otherwise, no license needed.<\/li> <li>Is a reservation recommended?<br/>Absolutely—especially during the summer, their popular boats book quickly.<\/li> <li>Where can I dock after?<br/>Guests return to Sun Life’s private slips or use nearby public docks. Staff will assist with docking and docking guidance.<\/li> <\/ul>", "photo": "9bcbbe3f75c9e88708dfb94a4588464d.jpg", "loc": [44.849857, -85.329834], "pin": "boating", "id": "sun-life-marina-torch-river-marina-premier-pontoon-tritoon-rentals"}, {"title": "Torch Lake Sunset Cruises", "html": "<div> <p>Website: <a href=\"https://www.northaireresort.com/sunset-cruises\">https://www.northaireresort.com/sunset-cruises<\/a> <br/>Phone: (231) 377‑7764<br/>Location: Launches from Dockside Restaurant – 6326 Old Torch Lake Dr, Bellaire, MI<br/>Tour Duration: 2 hours<br/>Captain Provided: Yes – US Coast Guard licensed captain included<\/p> <hr/> <p>Treat yourself to a magical evening on Torch Lake with a <strong>2-hour, captained sunset cruise<\/strong>. Your certified captain will guide you across the calm waters of Clam Lake and out to Torch Lake’s stunning blue expanse as the sun dips into the horizon. You can bring your own beverages, and an onboard cooler is provided.<\/p> <p>Perfect for couples, families, or small groups, this stress-free experience is all about unwinding and soaking in one of the most beautiful sunsets in the Midwest. No boating experience needed—just show up and enjoy!<\/p> <p>FAQs<\/p> <ul> <li>Do we need boating experience?<br/>Not at all! A licensed captain does all the driving—just relax and enjoy.<\/li> <li>Can we bring drinks and snacks?<br/>Yes! You’re welcome to bring your own beverages. An onboard cooler is available.<\/li> <li>How long is the cruise?<br/>The tour lasts approximately 2 hours—just the right amount for a peaceful evening.<\/li> <li>Where do we board the boat?<br/>Departure is from Dockside Restaurant, right on Clam River near Torch Lake.<\/li> <li>Is this good for groups?<br/>Yes! It’s ideal for couples, families, or small parties looking to unwind together.<\/li> <\/ul> <\/div>", "photo": "05a702474bb89735321cdfd1e8d8f58d.jpg", "loc": [44.928547, -85.171059], "pin": "boating", "id": "torch-lake-sunset-cruises"}, {"title": "Vacation Water Sports", "html": "<p>Website: <a href=\"https://www.vacationwatersports.com/\">https://www.vacationwatersports.com/<\/a> <br/>Phone: (231) 350‑8745<\/p> <p><em>Location: 4572 Ritt Rd, Bellaire, MI 49615 — servicing Torch Lake, Clam Lake, Lake Bellaire, Intermediate Lake &amp; Elk Lake<\/em><\/p> <p>Experience ultimate lake freedom with Vacation Water Sports—your full-service rental outfitter. They’ll deliver jet skis and pontoons right to your dock, so you can start your adventure the moment you arrive. Whether you're chasing thrills on a Sea-Doo or cruising Lakes Bellaire and Torch in comfort, their flexible daily and weekly rentals make boat days effortless and fun.<\/p> <p>FAQs<\/p> <ul> <li>Do they deliver to the Airbnb dock?<br/>Yes! Dockside delivery is available—just schedule in advance.<\/li> <li>Can we rent for multiple days?<br/>Absolutely. Choose from daily or weekly rentals for maximum lake time.<\/li> <li>What lakes do they service?<br/>Torch Lake, Clam Lake, Lake Bellaire, Intermediate Lake &amp; Elk Lake.<\/li> <li>Is boating experience required?<br/>Not required, but basic familiarity helps. Safety instructions are provided.<\/li> <li>What types of equipment are available?<br/>Sea-Doo jet skis and comfortable pontoons—ideal for both speed and leisure.<\/li> <\/ul>", "photo": "2713fb6ff5ea609e86a134bd877031e4.jpg", "loc": [45.019842, -85.184155], "pin": "boating", "id": "vacation-water-sports"}]}, {"title": "Boat Tours", "items": [{"title": "Charters North – Captain Shaun’s Custom Cruises", "html": "<p>Website: <a href=\"https://chartersnorth.com\">https://chartersnorth.com<\/a> <br/>Phone: (231) 590‑1949<br/>Location: 7939 Brooks St, Central Lake, MI 49622 - Torch Lake area (pickup from Bellaire docks)<br/>Distance: ~15 minutes from Bellaire<\/p> <p>Take your vacation to the next level with fully captained boat adventures by Captain Shaun — a local pro who knows every corner of Torch Lake. From thrilling fishing excursions to relaxing sandbar cruises, you’re in for a custom-tailored experience that’s fun, safe, and unforgettable.<\/p> <p><strong>FAQ Highlights:<\/strong><br/>Captain included | BYOB welcome | Custom cruise options | Pickup arranged at local docks | No license needed<\/p> <p><em><strong>Trip Options:<\/strong><\/em><\/p> <ul> <li>Salmon &amp; Trout Troll: Cruise deep waters in search of lake trout and salmon—great for anglers craving action and big catches.<\/li> <li>Night Walleye Troll: Experience the magic of the lake under the stars while chasing elusive walleye by moonlight.<\/li> <li>Smallmouth Bass Casting: Cast, reel, and laugh your way through a high-energy bass fishing trip with expert guidance.<\/li> <li>Fall Perch Fishing: Seasonal and rewarding—perfect for casual anglers who want to catch plenty and relax.<\/li> <li>Custom Cruises: Whether you want a romantic sunset ride or a sandbar party with friends, Captain Shaun creates your perfect day on the water.<\/li> <li>Fish &amp; Sandbar Package: The ultimate combo—start the day reeling in fish, then unwind with drinks and music at Torch Lake’s famous sandbar.<\/li> <\/ul> <p><strong><em>More Details:<\/em><\/strong><\/p> <ul> <li>Captain Provided: Yes — all trips are fully captained and guided.<\/li> <li>Bring Your Own Drinks: BYOB is welcome—coolers and ice provided.<\/li> <li>Bachelor/Sandbar Parties: Custom Cruises and Fish &amp; Sandbar packs are ideal for bachelor parties, relaxed group trips, or sunset gatherings.<\/li> <li>Docking Info: Departure points are confirmed at booking—most trips start from Bellaire-area docks or private resort marinas.<\/li> <li>Boating License: Not required—Captain Shaun handles all operations.<\/li> <li>What to Bring: Comfortable clothes, sun protection, water, snacks, and your tunes! Charters North provides bottled water, and fish cleaning/packaging is included for fishing trips.<\/li> <\/ul>", "photo": "118f8502b91c601b91d5b4d950d441aa.jpg", "loc": [45.069248, -85.262974], "pin": "boating", "id": "charters-north-captain-shauns-custom-cruises"}, {"title": "Foxy’s Custom Cruises – “Ahoy Matey!”", "html": "<p>Website: <a href=\"https://www.foxyscustomcruises.com\">https://www.foxyscustomcruises.com<\/a> <br/>Phone: (231) 944-6823<br/>Location: Bellaire, MI (Dock info provided upon booking)<\/p> <p>Celebrate in style aboard The Refugee, a luxury tritoon captained by Captain Rob, offering fully guided, private cruises perfect for bachelor parties. Enjoy music, drinks, and a lively atmosphere while cruising Torch Lake’s crystal-clear waters. Bring your own beverages and toast to unforgettable memories!<\/p> <p>FAQs:<\/p> <ul> <li>Captain provided? Yes, Captain Rob pilots every cruise.<\/li> <li>Alcohol allowed? Yes, guests can bring their own drinks aboard.<\/li> <li>Bachelor parties? Absolutely, this is their specialty!<\/li> <li>Docking? Guests board at a private dock arranged by Foxy’s.<\/li> <li>Boating license needed? No, captain included.<\/li> <\/ul>", "photo": "50275bb5744630c646f599567c2b1314.jpg", "loc": [44.942928, -85.281867], "pin": "boating", "id": "foxys-custom-cruises-ahoy-matey-2"}, {"title": "Northaire Resort & Pontoon Rentals (Captained Options Available)", "html": "<p>Website: <a href=\"https://www.northaireresort.com\">https://www.northaireresort.com<\/a> <\/p> <p>Phone: (231) 377‑7764<\/p> <p>Primary Dock: South shore of Clam Lake / Torch Lake at 7067 Crystal Springs Rd, Bellaire, MI (~15 minutes drive from downtown Bellaire)<\/p> <p>Alternate Pick-Up: Guests may also launch from dock in Bellaire (near town) depending on availability <\/p> <hr/> <p>Experience northern Michigan’s shimmering Chain of Lakes with ease and comfort. Northaire’s expansive pontoon fleet features spacious, well-maintained boats—available with or without a licensed captain. Enjoy Bluetooth stereo, ladders, bimini tops, and coolers. Begin your journey on Clam Lake, cruise to the turquoise sandbar on Torch Lake, and explore scenic coves and the grass river. Ideal for bridal showers, bachelor parties, family escapades, or sunset soirees!<\/p> <hr/> <p>FAQs<\/p> <ul> <li>Captain Provided? Optional—just request when booking.<\/li> <li>Is alcohol allowed? Yes! BYOB welcome (please enjoy responsibly).<\/li> <li>Are small parties allowed? Absolutely—great for celebrations and group outings.<\/li> <li>Where do guests board? Launch from the private dock at 7067 Crystal Springs Rd, or Bellaire’s dock (confirmation provided before trip) <\/li> <li>Boating license needed? Not required if you book the captain-included option; otherwise, Michigan boating certificate may be needed.<\/li> <\/ul> <p>What important tips? <\/p> <ul> <li>Arrive 15 minutes early for check-in and orientation.<\/li> <li>Bring sunscreen, snacks, and a favorite playlist.<\/li> <li>Consider renting an onboard porta-potty for larger groups.<\/li> <li>Practice no-wake speed in shallow zones like Grass River.<\/li> <\/ul>", "photo": "5c7a4a2ccccdf70e29d2fdf49d698fc1.jpg", "loc": [44.931543, -85.260213], "pin": "places_to_stay", "id": "northaire-resort-pontoon-rentals-captained-options-available"}, {"title": "Sailo Private Yacht & Party Boat Charters", "html": "<p>Website: <a href=\"https://www.sailo.com/boats/Traverse_City_MI/Motor/rental_boat_8000/?duration=fullDay\">https://www.sailo.com/boats/Traverse_City_MI/Motor/rental_boat_8000/?duration=fullDay<\/a> <br/>Phone: +1 910‑447‑2456 (Sailo support) <\/p> <p>Pick-up Location: Varies by boat — docks near Bellaire or Torch Lake (selected based on your booking)<\/p> <p>Rent a luxury party yacht or large tritoon (capacity 13+) with captain included. Choose from full-day, half-day, or sunset experiences. Many include amenities like seating/lounge areas, onboard restrooms, and optional catering.<\/p> <p>FAQs:<\/p> <ul> <li><em>Captain provided?<\/em> Yes—crew included.<\/li> <li><em>Alcohol allowed?<\/em> Yes—BYOB and catered drinks available.<\/li> <li><em>Bachelor parties?<\/em> Definitely—large groups welcome.<\/li> <li><em>Docking?<\/em> Pick-up organized through Sailo at local docks.<\/li> <li><em>License needed?<\/em> No—captain included.<\/li> <\/ul>", "photo": "bf4c8ffe092c75c781166e372dcd0292.jpg", "id": "sailo-private-yacht-party-boat-charters"}, {"title": "Torch Lake Sunset Cruises", "html": "<div> <p>Website: <a href=\"https://www.northaireresort.com/sunset-cruises\">https://www.northaireresort.com/sunset-cruises<\/a> <br/>Phone: (231) 377‑7764<br/>Location: Launches from Dockside Restaurant – 6326 Old Torch Lake Dr, Bellaire, MI<br/>Tour Duration: 2 hours<br/>Captain Provided: Yes – US Coast Guard licensed captain included<\/p> <hr/> <p>Treat yourself to a magical evening on Torch Lake with a <strong>2-hour, captained sunset cruise<\/strong>. Your certified captain will guide you across the calm waters of Clam Lake and out to Torch Lake’s stunning blue expanse as the sun dips into the horizon. You can bring your own beverages, and an onboard cooler is provided.<\/p> <p>Perfect for couples, families, or small groups, this stress-free experience is all about unwinding and soaking in one of the most beautiful sunsets in the Midwest. No boating experience needed—just show up and enjoy!<\/p> <\/div>", "photo": "b5489bed10331fccbc806b3d004b87a0.jpg", "loc": [44.942899, -85.283568], "pin": "boating", "id": "torch-lake-sunset-cruises-2"}]}, {"title": "Kayaks / Tubes / Paddleboard Rentals", "items": [{"title": "Alden Outfitters — Kayak & Paddleboard Rentals for Torch Lake Adventures", "html": "<p>Website: <a href=\"https://aldenoutfitter.com/\">https://aldenoutfitter.com/<\/a> <br/>Phone: (231) 331-6979<br/>Location Guide: About 15 minutes’ drive from Bellaire<\/p> <p>Set off on an unforgettable adventure with Alden Outfitters, your gateway to exploring the pristine waters of Torch Lake. Offering kayaks and paddleboards for rent, Alden Outfitters caters to all skill levels — whether you’re paddling solo or sharing the fun with friends. Glide across the crystal-clear lake, take in breathtaking views, and enjoy a day of water-filled relaxation and excitement just a short drive from Bellaire.<\/p> <p>Guest Tips:<\/p> <ul> <li>Rentals available by the hour or full day for maximum flexibility.<\/li> <li>No boating license needed — just bring your spirit of adventure!<\/li> <li>Must be 18+ to rent; family-friendly options available with supervision.<\/li> <li>Be sure to bring sunscreen, water, and a hat for sunny days on the lake.<\/li> <li>Life jackets and safety gear included with every rental.<\/li> <\/ul>", "photo": "b83950e12fbf0a5016aa46d59d6c9d6d.jpg", "loc": [44.880863, -85.276816], "pin": "retail_therapy", "id": "alden-outfitters-kayak-paddleboard-rentals-for-torch-lake-adventures"}, {"title": "Butch's Tackle & Marine", "html": "<p>Website: <a href=\"https://butchstorchlake.com\">https://butchstorchlake.com<\/a> <\/p> <p>Phone: (231) 377-6787<\/p> <p>Location: Approximately 7 miles from downtown Bellaire<\/p> <p>Your launch point to Torch Lake adventure! Butch’s is a one-stop shop for everything water — from single and tandem kayaks to paddleboards and thrilling tritoons. Located right on the lake, it’s easy to rent and launch in one smooth step. Their rentals are clean, well-maintained, and perfect for making the most of a sunny Michigan day.<\/p> <p>Whether you're a laid-back paddler or looking to turn up the fun, Butch’s puts you right where you want to be — on the iconic, crystal-clear waters of Torch Lake.<\/p> <p>FAQs:<\/p> <ul> <li>Do I need a reservation? Highly recommended in peak season.<\/li> <li>Do they provide life jackets? Yes — safety gear is included.<\/li> <li>Can I rent for a full day? Absolutely, even multi-day rentals are available.<\/li> <li>Is parking available? Yes, there’s a lot nearby.<\/li> <li>Do they have waverunners too? Yes! Great for thrill-seekers.<\/li> <\/ul>", "photo": "7b20d872ecedddab73df777551d41a08.jpg", "loc": [44.941922, -85.283674], "pin": "kayaking", "id": "butchs-tackle-marine"}, {"title": "Chain O’ Lakes Campground — A Natural Launchpad for Water Fun", "html": "<p>Website: <a href=\"https://www.chainolakescamp.com\">https://www.chainolakescamp.com<\/a> <br/>Phone: (231) 533-8432<br/>Location Guide: 5 minutes from Bellaire<\/p> <p>Nestled on the famous Chain of Lakes, this campground isn’t just for tents and trailers — it's also a fantastic place to launch your own kayak or paddleboard. While they don’t rent gear on-site, the serene water access makes this a must-visit destination for paddlers bringing their own equipment or coordinating delivery from nearby shops like Paddles &amp; Pedals.<\/p> <p>Spend the afternoon paddling the interconnected lakes, spotting wildlife, and drifting beneath the sun.<\/p> <p>FAQs:<\/p> <ul> <li>Can I bring my own kayak? Absolutely — they offer public access.<\/li> <li>Are rentals available? Not onsite, but nearby options deliver!<\/li> <li>Is there a fee to launch? No, launching is free for campers and guests.<\/li> <li>Do they allow tubing? Yes — if you bring your own tubes.<\/li> <li>Are restrooms available? Yes, as part of the campground amenities.<\/li> <\/ul>", "photo": "db17908590bc7f4197ff364bb9ef130e.jpg", "loc": [44.963117, -85.19822], "pin": "kayaking", "id": "chain-o-lakes-campground-a-natural-launchpad-for-water-fun"}, {"title": "Grass River Natural Area — Kayaking & Nature Escape", "html": "<p>Website: <a href=\"https://www.grassriver.org/\">https://www.grassriver.org/<\/a> <br/>Phone: (231) 533-8576<br/>Location Guide: 6500 Alden Hwy, Bellaire, MI 49615 - About 10 minutes’ drive from downtown Bellaire<\/p> <p>Immerse yourself in nature at Grass River Natural Area, a peaceful oasis perfect for kayaking and wildlife viewing. Paddle through serene waterways framed by lush forests and spot local wildlife in their natural habitat. Kayak rentals are available seasonally, allowing you to explore this hidden gem on your own or join a guided tour to learn about the area’s rich ecology. It’s a refreshing escape from the everyday hustle, just minutes from Bellaire!<\/p> <p>Guest Tips:<\/p> <ul> <li>Kayak rentals available June through September; reservations are highly recommended.<\/li> <li>Rental hours typically from 10 AM to 4 PM.<\/li> <li>Only single kayaks available—great for solo explorers or couples.<\/li> <li>Wear comfortable, water-friendly footwear and bring insect repellent.<\/li> <li>Don’t miss the chance to enjoy the hiking trails and scenic overlooks nearby!<\/li> <\/ul>", "photo": "7bea65bee242293081d253a2d4b5a7b8.jpg", "loc": [44.902977, -85.21816], "pin": "kayaking", "id": "grass-river-natural-area-kayaking-nature-escape"}, {"title": "Paddles & Pedals", "html": "<p>Website: <a href=\"https://www.bellairepaddlesandpedals.com\">bellairepaddlesandpedals.com<\/a><br/>Phone: (231) 533-4449<br/>Location: Right in the heart of downtown Bellaire (Just minutes’ walk from your stay!)<\/p> <p>Discover the perfect way to explore Bellaire’s stunning Chain of Lakes with Paddles &amp; Pedals! Whether you're a first-time paddler or a seasoned pro, their friendly team offers top-quality kayaks, stand-up paddleboards, and fat tire bikes to rent. Glide across crystal-clear waters, enjoy peaceful coves, or pedal around charming trails. Perfect for a fun day out with friends, family, or a romantic escape!<\/p> <p>Guest Tips:<\/p> <ul> <li>Reservations are recommended, especially during summer weekends.<\/li> <li>Rentals available by the hour, half-day, or full-day.<\/li> <li>Safety gear like life jackets are included—just bring your sense of adventure!<\/li> <li>No delivery service, so plan to pick up your gear downtown.<\/li> <li>Don’t forget sunscreen, water, and a waterproof phone case!<\/li> <\/ul>", "photo": "16173d365fa91ff1b718cd6622e871b8.jpg", "loc": [44.977086, -85.209695], "pin": "kayaking", "id": "paddles-pedals"}, {"title": "PlayNorth Watersports", "html": "<p>Website: <a href=\"https://playnorthwatersports.com\">https://playnorthwatersports.com<\/a> <br/>Phone: (231) 357-3790<br/>Location: Delivery-based – they come to you! - Serves Bellaire and surrounding areas<\/p> <p>Want your paddleboard dropped off at Torch Lake or your kayak waiting at the water’s edge? PlayNorth Watersports offers full delivery service of kayaks, paddleboards, and even LED-lighted boards for magical night paddles. Their flexible rental options make it super convenient, and the gear is top-notch.<\/p> <p>Perfect for couples, groups, or families looking for a hassle-free, hands-off water adventure.<\/p> <p>FAQs:<\/p> <ul> <li>Do I have to pick it up? Nope — they deliver right to your launch spot.<\/li> <li>Are LED paddleboards really available? Yes, and they’re awesome at sunset!<\/li> <li>Can I rent for a weekend? Yes, multi-day rentals are available.<\/li> <li>Do they supply gear? Yes — paddle, board, and life vest included.<\/li> <li>Where can I use the gear? Any public launch area nearby like Torch Lake or Grass River.<\/li> <\/ul>", "photo": "d70d131df5aa5aaf5e4d45e9c1a64add.jpg", "loc": [44.977086, -85.209695], "pin": "kayaking", "id": "playnorth-watersports"}, {"title": "Riverside Marina — Paddle Through Bellaire’s Peaceful Riverways", "html": "<p>Website: <a href=\"https://riverside-marina.com\">https://riverside-marina.com<\/a> <br/>Phone: (231) 533-8559<br/>Location: Walking distance! Right in Bellaire<\/p> <p>Located in the heart of Bellaire, Riverside Marina offers effortless access to the Intermediate River — a calm and scenic paddle perfect for all ages. With kayaks, canoes, and stand-up paddleboards, you can cruise at your own pace and soak in the natural beauty around every bend. It’s peaceful, relaxing, and just a few steps away from your Airbnb.<\/p> <p>Perfect for couples, families, or solo explorers, this local gem brings you closer to nature without even leaving town.<\/p> <p>FAQs:<\/p> <ul> <li>Do I need to reserve in advance? Calling ahead is a good idea during weekends.<\/li> <li>Can I bring the kids? Yes! It’s family-friendly with supervision.<\/li> <li>Is gear included? Yes — paddle, life vest, and a short lesson if needed.<\/li> <li>Are group outings possible? Definitely — just call to coordinate.<\/li> <li>Where do I launch? Launch right behind the shop!<\/li> <\/ul>", "photo": "ccc129c5fb2fef43a93b42b222a5ad37.jpg", "loc": [44.975166, -85.212915], "pin": "kayaking", "id": "riverside-marina-paddle-through-bellaires-peaceful-riverways"}]}]}, "weather": {"id": "weather", "title": "Weather", "icon": "cloud-sun-rain", "groups": [{"title": "", "items": [{"title": "Bellaire", "html": "<p>For the most up-to-date weather forecast check <a href=\"https://weather.com/weather/today/l/9ef10070b44a80add2d04570e360045d93fc15a628d2fd437d537b3a25ad1006\">here<\/a>!<\/p> <p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say \"There is no such thing as bad weather, just inappropriate clothing\".<\/p>", "photo": "de97f9f60bbe88efa21f12f50ede943f.jpg", "id": "bellaire"}]}]}, "shanty-creek": {"id": "shanty-creek", "title": "Shanty Creek Resort", "icon": "star", "groups": [{"title": "Beach Club", "items": [{"title": "Beach Club – Lake Bellaire (Private Access)", "html": "<p><strong>Designed exclusively for resort guests<\/strong>, Shanty Creek’s <strong>private Beach Club<\/strong> sits on the shores of beautiful <strong>Lake Bellaire<\/strong>, offering around <strong>200 feet of sandy shoreline<\/strong> and a serene swim area that’s ideal for families and couples alike. <\/p> What You’ll Find <ul> <li><strong>Sandy beach &amp; loungers<\/strong> for sunbathing and relaxation<\/li> <li><strong>Designated swim zone<\/strong> for safe, shallow water play<\/li> <li><strong>Kayak and paddleboard rentals<\/strong> available nearby<\/li> <li>Easy access to <strong>restrooms and picnic facilities<\/strong>, plus <strong>grill areas<\/strong><\/li> <li>Perfect proximity to nearby resort amenities—dining, tennis, fitness &amp; entertainment are all just a short walk away <\/li> <\/ul> Location <ul> <li>Situated on <strong>Lake Bellaire<\/strong>, just a few minutes from Summit Village<\/li> <li>Close to dining and shopping options, including <strong>Short’s Brewing<\/strong> in downtown Bellaire (~3 minutes away) <\/li> <\/ul> Why You’ll Love It <ul> <li>A private, peaceful escape with <strong>crystal-clear waters and shimmering lake views<\/strong><\/li> <li>Buffer from crowds → relaxing space for unwinding<\/li> <li><strong>Splendid sunsets and water views<\/strong> — perfect for low-key evenings<\/li> <\/ul> <p><strong>Access<\/strong>: Only available to registered <strong>Shanty Creek lodging guests<\/strong>.<br/>More info: <a href=\"https://www.shantycreek.com/\">https://www.shantycreek.com/<\/a> <\/p>", "photo": "c951f9ea3d91e7078a02733bd0a68f8d.jpg", "id": "beach-club-lake-bellaire-private-access"}]}, {"title": "Golf", "items": [{"title": "Cedar River", "html": "<p>“...a pleasure to play and a beauty to experience.” Cedar River’s glacial-carved canvas was perfect for famed course architect Tom Weiskopf to design this masterpiece.<\/p> <p>Among \"America’s Top 100 Resort Courses\" in <em>Golf Week<\/em> and the “Top 1,000 Courses in the World” by Rolex. Along with The Legend, Cedar River is listed among Michigan’s Top 20 Public Courses according to <em>Golf Magazine<\/em>.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-Cedar-River.pdf\">Cedar River Score Card<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Cedar River Tee Times<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "3a65057f0704d2a7c580ae28871d9bcb.jpg", "loc": [44.946402, -85.139625], "pin": "golfing", "id": "cedar-river"}, {"title": "Foot Golf!", "html": "<p>Introducing FootGolf. Mix the skills of soccer with the scoring golf, and you get a fun new way to bring the whole family to the links. This Dutch hybrid game uses a soccer ball, the fairways of Shanty Creek Resort's Summit golf course, and 21-inch holes. The goal, like golf, is the fewest strokes/shots from tee to the hole.<\/p> <p>Ready to play? $12 includes ball. To make a kickoff time, call 231-533-2020.<\/p>", "photo": "957a11a6d0fad7fba9161e7ecdfb9228.jpg", "id": "foot-golf"}, {"title": "Hawk's Eye", "html": "<p>“...the perfect complement to Cedar River and The Legend.”<\/p> <p>Adding to Shanty Creek's golf reputation, this John Robinson design features incredible vistas, water hazards on 9 of 18 holes, and putting greens to challenge golfers of all levels. Named among \"Michigan's Top Courses\" from <em>Golf Advisor<\/em> and the “Top 25 Course Layouts in the US.\"<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-Hawks-Eye.pdf\">Hawk's Eye Scorecard<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Hawk's Eye Tee Times<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "afe1376f7f54d0a9766458a5a618ee80.jpg", "loc": [44.957608, -85.149122], "pin": "golfing", "id": "hawks-eye"}, {"title": "The Legend", "html": "by Arnold Palmer <p>The Legend's reputation has been built on multiple elevation changes, doglegs, water hazards, and well-placed traps. Its setting includes views of Lake Bellaire and the actual Shanty Creek trickles through your round.<\/p> <p>Arnold Palmer helped introduce northern Michigan golf to the world when <em>Golf Magazine<\/em> named it among the “Top Resort Courses” in the US. 4½ stars from <em>Golf Digest<\/em>.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-The-Legend.pdf\">The Legend Scorecard<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">The Legend Tee Times<\/a><\/p> <p><strong>Closed Wednesdays and Thursdays<\/strong><\/p>", "photo": "001fbace61907319986cd00cfc4f155e.jpg", "loc": [44.948824, -85.185338], "pin": "golfing", "id": "the-legend"}, {"title": "Schuss Mountain", "html": "<p>Schuss Mtn delivers a challenge for even the most accomplished golfers. Par eludes many throughout 7,013 yards of pine-dotted forests, wetlands, and rolling hills.<\/p> <p>Playing like two distinct 9-hole courses, the front doglegs through pine forests on a flat pitch. Then on the back, play jumps up and down the rolling hills of Antrim County delivering an overall exciting golf experience made only better by our crew's tremendous care to its course conditions.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-Schuss.pdf\">Schuss Mountain Scorecard<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Schuss Mountain Tee Times<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "602ddd329452c93d226c374e898538ce.jpg", "loc": [44.940355, -85.133287], "pin": "golfing", "id": "schuss-mountain"}, {"title": "Summit", "html": "<p>...an under-appreciated gem.” While length is not a factor, Summit forces accomplished golfers to test their short game. Precise landings and fast, challenging greens will make you earn your score.<\/p> <p>A Par Three tee box on every hole gives junior golfers a fun (and less intimidating!) way to develop their game.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2024/07/2024-Scorecard-Summit.pdf\">Summit Scorecard<\/a><\/p> <p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Summit Tee Times<\/a><\/p> <p><strong>Closed Wednesdays and Thursdays<\/strong><\/p>", "photo": "2f2ca69030981a6a08f7a2f863d01393.jpg", "loc": [44.948824, -85.185338], "pin": "golfing", "id": "summit"}]}, {"title": "Lakeview Hotel", "items": [{"title": "The Lakeview Hotel", "html": "<p>Enjoy the heart of <strong>Summit Village<\/strong> at the charming <strong>Lakeview Hotel<\/strong>, nestled above Lake Bellaire. With lakeside views, easy access to trails, golf, and top-tier amenities, it’s the ideal upscale base for your northern Michigan adventure.<\/p> Amenities & Features <ul> <li><strong>180 stylish rooms<\/strong> with balconies, flat-screen TVs, mini-fridges, and microwaves <\/li> <li><strong>Full-service restaurant &amp; lounge<\/strong> on-site, plus the <strong>CoffeeBAR<\/strong> serving Starbucks beverages and light fare daily <\/li> <li>Adjacent to two <strong>outdoor tennis courts<\/strong> and a basketball court <\/li> <\/ul> Pool & Fitness Access <ul> <li><strong>Indoor pool<\/strong>: Open daily 9 AM–11 PM<\/li> <li><strong>Outdoor pool<\/strong>: Open 10 AM–10 PM<\/li> <li>Free access to modern <strong>fitness center<\/strong>, sauna, steam room, and whirlpool (guests aged 14+) <\/li> <\/ul> Activities & Nearby Recreation <ul> <li>Walk to <strong>The Legend golf course<\/strong> (#10 &amp; #11 tees), and enjoy quick access to <strong>Hawk’s Eye<\/strong> and <strong>Torch Lake<\/strong> (6–15 min drive) <\/li> <li>Free <strong>ski shuttle<\/strong> to downhill and cross-country trails; ski-in/ski-out access available via shuttles and lifts <\/li> <li><strong>Boating, biking, hiking, and summer rentals<\/strong> nearby—plus golf packages and golf-centric lodging options <\/li> <\/ul> Guest Services & Perks <ul> <li><strong>Complimentary shuttle service<\/strong> across all resort villages and downtown Bellaire, plus local grocery runs <\/li> <li><strong>24/7 front desk<\/strong>, <strong>daily housekeeping<\/strong>, and nightly <strong>resort security<\/strong> included for lodging guests <\/li> <li>Access to resort-area <strong>shopping, gift cards, and concierge services<\/strong> via the Guest Service team <\/li> <\/ul> Size & Location Snapshot <ul> <li><strong>Address:<\/strong> 5780 Shanty Creek Road, Bellaire, MI 49615<\/li> <li><strong>Distance:<\/strong> 0.2 mi from The Legend GC; 3 mi to Lake Bellaire; ~6 mi to Short’s Brewery <\/li> <li><strong>Check-In:<\/strong> 5:00 PM | <strong>Check-Out:<\/strong> 12:00 PM<\/li> <li><strong>Parking:<\/strong> Free self-parking, with ADA-accessible spaces <\/li> <\/ul> Why Stay at Lakeview <ul> <li>Lakeside views, modern amenities, and easy access to Summit Village attractions<\/li> <li>Multiple pool options and a full gym for fitness or relaxation<\/li> <li>Central hub for golf, skiing, alpine tubing, biking, and nightlife<\/li> <li>Upscale comfort with resort-style service and convenience<\/li> <\/ul> <p> <strong>More Info &amp; Reservations:<\/strong><br/>Explore The Lakeview Hotel → <a href=\"https://www.shantycreek.com/venue/lakeview-hotel\">https://www.shantycreek.com/venue/lakeview-hotel<\/a> <\/p>", "photo": "833938ce33d91e10342aba3d085e7853.jpg", "id": "the-lakeview-hotel"}]}, {"title": "Summer Activities", "items": [{"title": "After Dark | Outdoor Movies + Stargazing", "html": "<p>When the sun goes down, the fun doesn’t stop at Shanty Creek.<\/p> <p><strong>Outdoor Movies on the Mountain<\/strong><br/>Select <strong>Saturday nights<\/strong>, Summit Mountain transforms into a cozy outdoor theater featuring <strong>family-friendly films<\/strong> under the stars. Bring a blanket, a chair, and settle in for a movie night with breathtaking views.<\/p> <p><strong>Stargazing in Northern Michigan<\/strong><br/>Clear skies bring out a whole new show—<strong>the stars<\/strong>. Far from city lights, Shanty Creek is a great place to spot constellations, shooting stars, and if you're lucky, the <strong>Northern Lights<\/strong>. Stargazing here is a must-do northern Michigan experience.<\/p> <p><strong>Tip:<\/strong> Dress warm and bring a thermos. Even summer nights can get cool at the top.<\/p> <p>More info: <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a> <\/p>", "photo": "72d8677d9180c4acba1ee7869602e0a2.jpg", "id": "after-dark-outdoor-movies-stargazing"}, {"title": "Biking", "html": "<div> <div> <div> <div> <div> <div> <p>Antrim County is a cyclist’s dream—whether you prefer the road or rugged trails.<\/p> <p>• <strong>Road Biking<\/strong>: Ride the quiet, rolling hills and scenic byways with minimal traffic and stunning views.<br/>• <strong>Mountain Biking<\/strong>: Explore Glacial Hills, one of Michigan’s premier trail systems with loops for all skill levels.<br/>• <strong>E-Bike Rentals<\/strong>: New to biking or want help with hills? Rent a <strong>motor-assisted e-bike<\/strong> from the Summit Fitness Center.<br/>• <strong>Traditional Bikes<\/strong> also available for cruising around the resort.<\/p> <p>More info: <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p> <\/div> <\/div> <\/div> <\/div> <div> <\/div> <\/div> <\/div>", "photo": "51457c9f6e73826b9612cfba35fb5f7e.jpg", "id": "biking"}, {"title": "Boating", "html": "<p>There’s nothing like being on the water—and Antrim County’s Chain of Lakes delivers it all.<\/p> <p>Whether you're:<br/>• <strong>Splashing on the sandbar<\/strong> with friends<br/>• <strong>Water skiing<\/strong> or wakeboarding<br/>• <strong>Kayaking or paddling<\/strong> down peaceful rivers<br/>• <strong>Fishing<\/strong> for bass and walleye<\/p> <p>This 75-mile waterway system connects lakes and rivers perfect for boating adventures, relaxation, and fun in the sun.<\/p> <p>Bring your own boat or rent locally—just get out there and enjoy northern Michigan’s freshwater paradise!<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "e6e66612a8709673d2a47b2eeb3df52b.jpg", "id": "boating"}, {"title": "Children’s Play Area – Summit Village", "html": "<p><strong>Fun for the little ones (and a peaceful break for you!)<\/strong><br>Located near <strong>The Lakeview Hotel and Summit Fitness Center<\/strong>, the <strong>Summit Village children&rsquo;s playground<\/strong> offers a welcome spot for kids to let off energy while parents relax.<\/p> <p><strong>What to Expect:<\/strong><\/p> <ul> <li>Nature-inspired play equipment including slides, climbing structures, and open space<\/li> <li>Shaded areas perfect for little explorers<\/li> <li>Close to amenities like restrooms, dining, and the fitness center<\/li> <li>Ideal for combined family time&mdash;kids can play while you plan your next adventure<\/li> <\/ul> <p>This playground is especially handy when visiting the <strong>Lodge<\/strong> or staying in <strong>Summit Village lodging<\/strong>.<\/p>", "photo": "0e0336e812ac15e5683adb819697f137.jpg", "id": "childrens-play-area-summit-village"}, {"title": "Disc Golf at Summit Mountain", "html": "<p>Get outside and enjoy a fun, casual round of disc golf on Shanty Creek’s <strong>9-hole disc golf course<\/strong>, set along the scenic slopes of <strong>Summit Mountain<\/strong>, just behind <strong>The Lakeview Hotel<\/strong>.<\/p> <p>Perfect for families, beginners, or seasoned disc golfers looking for a relaxed round with a view. It’s a great way to enjoy the outdoors while getting in some light activity.<\/p> <p>Discs, scorecards, and course maps are available at the <strong>Summit Fitness Center<\/strong>.<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "c93370054a72189d88f08304f1a115ad.jpg", "id": "disc-golf-at-summit-mountain"}, {"title": "Go Outside and Play", "html": "<p>Unplug, unwind, and get active with a variety of outdoor games around the resort. Whether you’re looking for a friendly match or a spontaneous showdown, there’s something for everyone.<\/p> <p>Try your hand at:<br/>• A quick game of <strong>H-O-R-S-E<\/strong> on the basketball court<br/>• <strong>Sand volleyball<\/strong> under the summer sun<br/>• A match of <strong>badminton<\/strong> or <strong>shuffleboard<\/strong><br/>• Laid-back fun with <strong>bocce ball<\/strong>, <strong>tetherball<\/strong>, or <strong>wiffle ball<\/strong><br/>• Or hit the <strong>tennis courts<\/strong> for something more competitive<\/p> <p>Most equipment is available on-site—just show up and play!<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "d28e869a3ad34736db5aec01d192ab41.jpg", "id": "go-outside-and-play"}, {"title": "Hiking", "html": "<div> <div> <div> <div> <div> <div> <p>Looking for a scenic workout? Shanty Creek offers hiking experiences for every pace and preference:<\/p> <p>• <strong>Schuss Mountain Trails<\/strong> – Tackle a summertime climb for a rewarding hike with panoramic views of northern Michigan.<br/>• <strong>Grass River Natural Area<\/strong> – Just a short drive away, this network of trails winds through forests, wetlands, and along the water’s edge—perfect for peaceful nature walks and wildlife spotting.<\/p> <p>Whether you're in it for fitness or fresh air, these trails highlight the natural beauty of the region.<\/p> <p>More info: <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p> <\/div> <\/div> <\/div> <\/div> <div> <\/div> <\/div> <\/div>", "photo": "c3e5927406029dcd1ca81fb675555753.jpg", "id": "hiking"}, {"title": "Lawn Games", "html": "<p>Let’s Play! Summer days at Shanty Creek are perfect for some classic fun on the lawn.<\/p> <p>Challenge friends and family with traditional favorites and supersized fun:<\/p> <p>• <strong>Horseshoes<\/strong><br/>• <strong>Croquet<\/strong><br/>• <strong>Bean Bag Toss<\/strong><br/>• <strong>Ladder Ball<\/strong><br/>• <strong>Washer Toss<\/strong><br/>• <strong>Giant Checkers<\/strong><br/>• <strong>Giant Jenga<\/strong><br/>• <strong>Giant Dominos<\/strong><br/>• <strong>Lawn Yahtzee<\/strong><\/p> <p>For game info and equipment, stop by the <strong>Summit Fitness Center<\/strong> in Summit Village. Let the games begin!<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "3272866f3a3280487101a93a2059e095.jpg", "id": "lawn-games"}, {"title": "Swimming Pools at Shanty Creek", "html": "<p>Whether you're cooling off in summer or relaxing after a day on the slopes, Shanty Creek offers <strong>multiple pools across its villages<\/strong> for guests to enjoy.<\/p> <p>• <strong>The Lakeview Hotel (Summit Village)<\/strong> – Features both <strong>indoor and outdoor pools<\/strong>, perfect for year-round fun.<br/>• <strong>Schuss Village<\/strong> – Offers a <strong>heated indoor pool<\/strong>, ideal for post-ski relaxation or rainy-day swims.<br/>• <strong>Cedar River Village<\/strong> – Home to a <strong>seasonal outdoor pool<\/strong> and <strong>two outdoor hot tubs<\/strong>, making it a great spot to unwind with a view.<\/p> <p><strong>Your pool pass covers the Lakeview Hotel indoor and outdoor pools only.<\/strong> The other village pools are not included with your stay.<\/p> <p>From splashing around with kids to soaking in a hot tub under the stars, each village provides a unique poolside experience.<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "d8c6ab749ee7df07780b8d1c6e11dba1.jpg", "id": "swimming-pools-at-shanty-creek"}, {"title": "Tennis at Summit Village", "html": "<p>Serve up summer fun with a game of tennis at Shanty Creek! Located in Summit Village, the tennis courts offer scenic views overlooking the golf course—making each match both competitive and picturesque.<\/p> <p>Racquets and tennis balls are available for use from the <strong>Summit Fitness Center<\/strong>, so you can hit the court without packing gear.<\/p> <p>Whether you're a seasoned player or just looking for a friendly rally, the courts at Shanty Creek are a great way to stay active and soak up the northern Michigan sunshine.<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "d223c07d481d247ce9014d85f94b79ec.jpg", "id": "tennis-at-summit-village"}]}, {"title": "Winter Activities", "items": [{"title": "Alpine Tubing", "html": "<p>If skiing and snowboarding aren’t your thing—don’t worry! There’s still a fast and fun way to enjoy the snow. <strong>Alpine Tubing<\/strong> at <strong>Summit Mountain<\/strong> is a must-try winter activity, delivering all the thrills of sledding without the uphill climb.<\/p> <p>You’ll hear laughter echoing across the slopes as guests of all ages race down the tubing lanes and ride the surface lift right back to the top. No skills required—just hold on and enjoy the ride!<\/p> <p>🎯 <strong>What to Know:<\/strong><\/p> <ul> <li> <p>Available <strong>Friday evenings, Saturdays, Sundays &amp; holidays<\/strong><\/p> <\/li> <li> <p><strong>Sessions start at the top of every hour<\/strong><\/p> <\/li> <li> <p><strong>$25/hour<\/strong> on weekends and holidays, <strong>$23/hour<\/strong> on non-weekend days<\/p> <\/li> <li> <p><strong>Online booking only<\/strong><\/p> <\/li> <li> <p>Participants must be <strong>36″ tall<\/strong><\/p> <\/li> <\/ul> <p>💡 <strong>Parents Note:<\/strong><br/>The <strong>last two hours<\/strong> on <strong>Friday and Saturday nights<\/strong> are recommended for <strong>Adults Only<\/strong>—ideal for grown-ups looking to enjoy some child-free fun.<\/p> <p>Whether you're with friends, family, or flying solo, Alpine Tubing offers a unique and laughter-filled way to enjoy Shanty Creek’s winter wonderland.<\/p> <p><strong>More info &amp; booking:<\/strong> <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/#tubing\">https://www.shantycreek.com/ski/more-on-the-snow/#tubing<\/a><\/p>", "photo": "d85f4f59827bb40aa6b6ac461d66783d.jpg", "id": "alpine-tubing"}, {"title": "Fat Tire Biking", "html": "<p><strong>Ride On—Even in the Snow<\/strong><\/p> <p>Experience winter like never before with <strong>fat tire biking<\/strong> on our <strong>3km multi-purpose trail<\/strong> at Schuss Village. Whether you're an experienced rider or just looking to try something new, this packed trail offers a smooth and scenic ride through snow-covered landscapes. It’s also shared with snowshoers and walkers—yes, even leashed pups are welcome!<\/p> <p>Don’t have your own bike? No problem. <strong>Fat tire bike rentals<\/strong> are available through <a>Paddles &amp; Pedals<\/a> in downtown Bellaire. Call them at <strong>231-533-4449<\/strong> to reserve your ride.<\/p> <p>For more details, visit: <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/\">https://www.shantycreek.com/ski/more-on-the-snow/<\/a><\/p>", "photo": "4a2ceac3d48e71346d57651aaa1f5a56.jpg", "id": "fat-tire-biking"}, {"title": "Nordic Skiing", "html": "<p>Few activities capture the quiet beauty of northern Michigan in winter quite like Nordic skiing. At <strong>Shanty Creek Resort<\/strong>, you’ll find <strong>18km of groomed, track-set cross-country trails<\/strong> that wind between the resort’s four villages—creating a scenic, heart-healthy, and soul-refreshing <em>village-to-village<\/em> skiing experience.<\/p> <p>Whether you're looking for a cardio workout or a serene glide through the snow-covered woods, these trails deliver.<\/p> <p>🔹 <strong>Multi-Purpose Trail:<\/strong><br/>If Nordic skiing isn’t your thing, a <strong>3km groomed trail<\/strong> in <strong>Schuss Village<\/strong> is open for <strong>fat tire biking<\/strong> and <strong>snowshoeing<\/strong>, keeping trail usage safe and enjoyable for all guests.<\/p> <p>🔹 <strong>Nordic Center at Schuss Village:<\/strong><br/>Located adjacent to the Pine Cone trailhead, the Nordic Center offers:<\/p> <ul> <li> <p><strong>Classic &amp; skating-style ski rentals<\/strong><\/p> <\/li> <li> <p><strong>Snowshoe rentals<\/strong><\/p> <\/li> <li> <p>Friendly assistance to get you trail-ready<\/p> <\/li> <\/ul> <p>🔹 <strong>Hours of Operation:<\/strong><\/p> <ul> <li> <p><strong>Thursday–Friday:<\/strong> 9AM – 4PM<\/p> <\/li> <li> <p><strong>Saturday–Sunday:<\/strong> 9AM – 5PM<\/p> <\/li> <li> <p><strong>Monday:<\/strong> 9AM – 4PM<\/p> <\/li> <li> <p><strong>Closed Tuesdays &amp; Wednesdays<\/strong><\/p> <\/li> <li> <p><strong>Extended hours during holidays<\/strong><\/p> <\/li> <\/ul> <p>🔹 <strong>Lessons Available:<\/strong><\/p> <ul> <li> <p><strong>Advance booking (48 hrs)<\/strong> is recommended<\/p> <\/li> <li> <p><strong>Cancellations require 48 hrs’ notice<\/strong> for a refund<\/p> <\/li> <li> <p><strong>Instructor requests<\/strong> must be made <strong>at least 3 days<\/strong> in advance<\/p> <\/li> <\/ul> <p>Explore over <strong>20km of tranquil, groomed Nordic trails<\/strong>, perfect for beginners and experienced skiers alike.<\/p> <p><strong>For more info:<\/strong> <a href=\"https://www.shantycreek.com/ski/nordic-trails/\">https://www.shantycreek.com/ski/nordic-trails/<\/a><\/p>", "photo": "afadf1fc5ceb077b8427fb28bcb335fe.jpg", "id": "nordic-skiing"}, {"title": "Nordic Trail Map", "html": "<p>Explore the snow-covered beauty of Shanty Creek Resort through its scenic <strong>Nordic ski and snowshoe trails<\/strong>. Whether you're a beginner or an experienced skier, these trails offer a peaceful and invigorating way to enjoy winter across Schuss Mountain.<\/p> <p><strong>Trail Overview <\/strong><br/>Trail Name | Distance (km) | Difficulty | Trail Use <br/>Mountain Creek | 2.5 km | ● Moderate | Cross-country skiing <br/>Poets Loop | 4.5 km | ● Moderate | Cross-country skiing <br/>Pine Cone | 4.5 km | ◆ Difficult | Cross-country skiing <br/>Winter Brook | 1.5 km | ● Moderate | Cross-country skiing <br/>King of the Hill | 1.5 km | ◆ Difficult | Cross-country skiing <br/>Schuss Mountain | 3.0 km | ● Easiest | Multi-purpose (snowshoe &amp; bike) <\/p> Trail Markings <ul> <li><strong>⬤ Easiest<\/strong><\/li> <li><strong>● Moderate<\/strong><\/li> <li><strong>◆ Difficult<\/strong><\/li> <li><strong>⬛ Trail Head<\/strong><\/li> <li><strong>Aa Landmarks<\/strong><\/li> <\/ul> <p>Each trail is clearly marked with signage and trailhead icons for convenience.<\/p> Village-to-Village Adventure <p>Many of these trails connect Schuss Mountain Village to surrounding areas like <strong>Cedar River Village<\/strong>, providing a <strong>“village-to-village”<\/strong> Nordic experience. You’ll pass iconic spots like <strong>Riverview<\/strong>, <strong>Red Lift Corner<\/strong>, and <strong>#3 Tee<\/strong>, making your trek both scenic and exciting.<\/p> <p><strong>Hours of Operation<\/strong><\/p> <ul> <li><strong>Mon, Thurs, Fri:<\/strong> 9am – 4pm<\/li> <li><strong>Sat–Sun:<\/strong> 9am – 5pm<\/li> <li><strong>Closed:<\/strong> Tues &amp; Wed<\/li> <li><em>Holiday hours may vary<\/em><\/li> <\/ul> <p><strong>Ready to explore the trails?<\/strong><br/>View the full trail map here: <a href=\"https://www.shantycreek.com/wp-content/uploads/2024/12/Nordic-Trail-Map-2025.jpg\">https://www.shantycreek.com/wp-content/uploads/2024/12/Nordic-Trail-Map-2025.jpg<\/a><\/p> <p>More info: <a href=\"https://www.shantycreek.com/ski/nordic-trails\">shantycreek.com/ski/nordic-trails<\/a><\/p>", "photo": "962a7f82255b70903a5737f2f8746089.jpg", "id": "nordic-trail-map"}, {"title": "Schuss Mountain Trail Map", "html": "<p><em>Welcome to one of Michigan’s top ski destinations—where terrain, trails, and fun come together at Schuss Mountain, Shanty Creek Resort.<\/em><\/p> <p>Trail Overview | Schuss Mountain offers a variety of trails for all skill levels. Whether you’re a beginner or an expert, you’ll find groomed runs, glades, terrain parks, and great views across the mountain.<\/p> <p>Trail Difficulty | Symbol | Description <br/>Easiest | ● Green Circle | Wide, gentle slopes perfect for beginners <br/>Intermediate | ♦ Blue Square | More challenging runs for developing skiers <br/>Difficult | ◆ Black Diamond | Steeper, narrower, and faster terrain <br/>Most Difficult | ⯁ Double Black Diamond | Expert terrain with steep drops and glades<\/p> <p><strong>Lifts - Schuss Mountain is equipped with a variety of lifts to help you access all areas of the resort efficiently:<\/strong><\/p> <ul> <li><strong>Purple Lift<\/strong> – Access to beginner/intermediate terrain<\/li> <li><strong>Red Lift<\/strong> – Access to terrain park and advanced runs<\/li> <li><strong>Yellow Lift<\/strong> – Connects to summit trails<\/li> <li><strong>Surface Lifts<\/strong> – Perfect for beginners and ski school zones<\/li> <\/ul> <p><strong>Terrain Parks - Test your skills or try something new:<\/strong><\/p> <ul> <li> <p><strong>Low Rider Terrain Park<\/strong> – Features jumps, rails, and boxes for freestyle riders<\/p> <\/li> <li> <p><strong>Progression Zones<\/strong> – Great for learning tricks safely<\/p> <\/li> <\/ul> <p><strong>Key Areas<\/strong><\/p> <ul> <li><strong>Schuss Village<\/strong> – Base area with day lodge, rentals, tickets, ski school, and food<\/li> <li><strong>The Pink Lift Corner<\/strong> – Connects with multiple trail zones for diverse runs<\/li> <li><strong>Cedar River Village<\/strong> – Offers ski-in/ski-out access and lodging<\/li> <li><strong>Ski Patrol<\/strong> – Located near key intersections for safety and assistance<\/li> <\/ul> <p><strong>Tips for Visitors<\/strong><\/p> <ul> <li>Start your day early for fresh corduroy runs<\/li> <li>Green trails near the base are best for families and beginners<\/li> <li>Use lift maps and signage to plan your route across the mountain<\/li> <li>Helmets are recommended for all riders<\/li> <\/ul> <p><strong>Download full trail map<\/strong>: <a href=\"https://www.shantycreek.com/wp-content/uploads/2021/12/Schuss-Mountain-and-Nordic-Trails-Online.pdf\">Schuss Mountain Trail Map PDF<\/a><\/p>", "photo": "7448326df61a45446d2ccc03cc09cf2e.jpg", "id": "schuss-mountain-trail-map"}, {"title": "Skiing & Snowboarding", "html": "<p>Shanty Creek Resort offers one of Michigan’s most beloved ski destinations with over <strong>50 downhill slopes<\/strong> spread across <strong>Schuss Mountain<\/strong> and <strong>Summit Mountain<\/strong>, making it ideal for skiers and snowboarders of all skill levels.<\/p> <p>Whether you’re a beginner looking for gentle runs or a seasoned skier chasing fresh powder and steeps, the variety of terrain, well-maintained conditions, and laid-back vibe deliver exactly what you need.<\/p> <p>With breathtaking northern Michigan scenery and a full-service resort experience, <strong>Schuss Mountain<\/strong> simply delivers <em>A Better Value<\/em>.<\/p> <p><strong>For more info:<\/strong> <a href=\"https://www.shantycreek.com/ski/\">https://www.shantycreek.com/ski/<\/a><\/p>", "photo": "fe7656219e2cdf06747400423c56851a.jpg", "id": "skiing-snowboarding"}, {"title": "Snow Glide Tours", "html": "<p>Experience winter like never before with Shanty Creek’s <strong>Snow Glide Tours<\/strong> — a scenic, cozy, and memorable ride for all ages.<\/p> <p>Departing from The Lakeview Hotel's front circle, this 45-minute guided tour winds through the snow-blanketed landscapes of <strong>Summit Village<\/strong>, offering sweeping views and a peaceful winter retreat without breaking a sweat. Whether you're snapping photos or simply soaking in the scenery, it’s the perfect way to appreciate the magic of northern Michigan in winter.<\/p> <p>Each tour accommodates up to <strong>9 passengers<\/strong> and is safely pulled behind “<strong>Big Blue<\/strong>,” a powerful double-track snowmobile. The Snow Glide is equipped with seatbelts for a secure and comfortable ride.<\/p> <p><strong>Tour Schedule<\/strong>:<\/p> <ul> <li> <p>Fridays, Saturdays, Sundays, and select holiday dates<\/p> <\/li> <li> <p>Departures on the hour from <strong>9:00 AM to 3:00 PM<\/strong><\/p> <\/li> <\/ul> <p><strong>Price<\/strong>: $25 per seat<br/><em>Limited availability – early booking is highly recommended!<\/em><\/p> <p>More Info &amp; Booking: <a href=\"https://www.shantycreek.com/snow-glide-tours/\">https://www.shantycreek.com/snow-glide-tours/<\/a> <\/p>", "photo": "945e35a66551654ffb82c6f681fcb243.jpg", "id": "snow-glide-tours"}, {"title": "Snowshoeing", "html": "<p><strong>Forge Your Own Trail – Adventure Awaits<\/strong><\/p> <p>Whether you're a seasoned snowshoer or trying it for the first time, snowshoeing at Shanty Creek offers a peaceful and scenic way to explore the winter woods of northern Michigan.<\/p> <p>Slip on a pair and start walking—no special skills required. You can blaze your own path through the snowy landscape or follow the <strong>groomed 3km multi-purpose trail<\/strong> located at <strong>Schuss Village<\/strong>, shared with fat tire bikers and designed to minimize trail damage while keeping everyone safe.<\/p> <p><strong>Rental Equipment<\/strong> is available at the <strong>Nordic Center<\/strong> in Schuss Village, including snowshoes and poles.<\/p> <p>This is a perfect winter activity for those seeking quiet beauty, fresh air, and an easy-going workout.<\/p> <p>More Info: <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/\">https://www.shantycreek.com/ski/more-on-the-snow/<\/a><\/p>", "photo": "c556df4dfb41e44d4d4fc76d3d73873f.jpg", "id": "snowshoeing"}]}]}}, "signinUrl": "https://script.google.com/macros/s/AKfycbyH0rEgRqprQRh7Kf4lDv1QUssPA7z4Jn7Od_cEGJWa8_TH9UwK0W4EjdJCiB6EX5DlMg/exec"}</script>
