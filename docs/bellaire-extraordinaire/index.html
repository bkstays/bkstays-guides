 about is heading to the store on a supply run.<\/p> <p>Order online from Family Fare in Bellaire and choose delivery (or pickup) for a time that matches your arrival.<\/p> <p>Make sure you have the <strong>Bellaire<\/strong> store selected.<\/p> <p><a href=\"https://www.shopfamilyfare.com/shop\">https://www.shopfamilyfare.com/shop<\/a><\/p> <p><strong>Family Fare<\/strong><\/p> <p><strong>Address<\/strong>: 211 S Division St, Bellaire, MI 49615<\/p> <p><strong>Hours<\/strong>: 7:00 AM - 10:00 PM daily<\/p> <p><strong>Phone<\/strong>: (231) 533-8724<\/p>", "photo": "da8909661490c6d57b506c663ccdb3e7.jpg", "loc": [44.971798, -85.197367], "pin": "grocery_shopping", "id": "grocery-delivery-service"}]}, {"title": "Grocery / Pharmacy", "items": [{"title": "Groceries", "html": "<p>Family Fare - Bellaire<\/p> <p>Everyday: 7:00 AM - 10:00 PM<\/p> <p>Phone: (231) 533-8724<\/p> <p>Pharmacy: (231) 533-5534 (Mon–Fri 9am–6pm, Sat 10am–2pm)<\/p> <p>211 S Division St<\/p> <p>Bellaire, MI 49615<\/p> <p><a href=\"https://www.shopfamilyfare.com/stores/family-fare-bellaire\">Store info<\/a><\/p>", "photo": "4f3e895b729a968e1cf1c5c127c6c099.jpg", "loc": [44.971076, -85.197754], "pin": "grocery_shopping", "id": "groceries"}, {"title": "Pharmacies in Bellaire", "html": "<p>Family Fare Pharmacy (inside Family Fare)<\/p> <p>211 S Division St, Bellaire, MI 49615<br/>Phone: (231) 533-5534<\/p> <p>Monday–Friday: 9:00 AM – 6:00 PM<\/p> <p>Saturday: 10:00 AM – 2:00 PM<\/p> <p>Sunday: Closed<\/p> <p>Also nearby: Bellaire Family Health Center Pharmacy, 4955 S M-88 Hwy, Bellaire – (231) 533-6655.<\/p>", "photo": "bd637c3e96aa3b09d786560df40e48bb.jpg", "loc": [44.971076, -85.197754], "pin": "pharmacy", "id": "pharmacies-in-bellaire"}]}]}, "hiking-biking": {"id": "hiking-biking", "title": "Hiking and Biking", "icon": "mountain", "groups": [{"title": "", "items": [{"title": "Fat Tire Biking", "html": "<p>Website: <a href=\"https://www.shantycreek.com/ski/nordic/\">https://www.shantycreek.com/ski/nordic/<\/a><br/><a href=\"https://www.shantycreek.com/important-information/#contactus\">Contact Here<\/a><\/p> <p>Looking for a fun winter adventure? Try <strong>fat tire biking on snow<\/strong> at Shanty Creek Resorts! The <strong>3km groomed multi-purpose trail at Schuss Village<\/strong> is designated for fat tire biking and snowshoeing, or simply a peaceful winter walk. Fat bikes are available for rent just minutes away at <strong>Paddles &amp; Pedals in downtown Bellaire<\/strong> (206 N Bridge St, (231) 533-4449), making it easy for guests to hit the trails and enjoy Michigan’s snowy outdoors.<\/p>", "photo": "fca2ac1ba3f4a7f260f3a476cd3bb7a7.jpg", "id": "fat-tire-biking"}, {"title": "Glacial Hills Pathway and Natural Area", "html": "<p>Website: <a href=\"https://glacialhillstrails.org/\">https://glacialhillstrails.org/<\/a><br/>Email: glacialhillspathway@gmail.com (Friends of Glacial Hills)<br/>Trailheads: Orchard Hill Rd, Vandermark Rd, and Eckhardt Rd, Bellaire, MI 49615<\/p> <p>Just minutes from downtown Bellaire, this roughly 800-acre trail system offers 31+ miles of multi-use trails for hiking, biking, and winter fat-tire riding. Trails wind through hardwood forests, wildflowers, and rolling terrain—perfect for both casual nature walks and advanced mountain biking.<\/p>", "photo": "c7256293ea1b1edd6e2c5f7fa0a7e27d.jpg", "loc": [44.99583, -85.24501], "pin": "outdoors", "id": "glacial-hills-pathway-and-natural-area"}, {"title": "Grass River Natural Area", "html": "<p>Website: <a href=\"https://www.grassriver.org/\">https://www.grassriver.org/<\/a><br/>Phone: (231) 533-8314<br/>Address: 6500 Alden Hwy, Bellaire, MI 49615<\/p> <p>Hours: Trails open daily, dawn to dusk. Grass River Center open 10 AM – 4 PM daily May–October, and weekends only November–April.<\/p> <p>Only 10 minutes from Bellaire, this 1,500-acre preserve features 7 miles of trails, including 1.5 miles of accessible trails and boardwalk through wetlands, meadows, and forests. Guests love the peaceful setting, birdwatching opportunities, and guided nature programs. A great family-friendly stop for an easy stroll in nature.<\/p>", "photo": "b725b94811adc3c0460c20e1514ebea3.jpg", "id": "grass-river-natural-area"}, {"title": "Jordan River Pathway", "html": "<p>Website: <a href=\"https://www.michigan.org/property/jordan-valley-pathway\">https://www.michigan.org/property/jordan-valley-pathway<\/a><br/>Trailhead: Deadman’s Hill Scenic Overlook, Deadman’s Hill Rd, Elmira, MI 49730 (about 2 miles west of US-131, roughly 40 minutes from Bellaire)<\/p> <p>A popular 18-mile loop trail through the Jordan River Valley in the Mackinaw State Forest, with a 3-mile loop and other shorter day-hike options available. Guests rave about the stunning river views, wildlife, and forest landscapes. Perfect for experienced hikers looking for a half-day hike or an overnight backpacking trip (camp at Pinney Bridge State Forest Campground near the halfway point). Hiking only—no bikes on the pathway.<\/p>", "photo": "e953f85457bb95d29c47793922e69fe4.jpg", "id": "jordan-river-pathway"}, {"title": "Schuss Mountain & Shanty Creek Resorts Trails", "html": "<p>Website: <a href=\"https://www.shantycreek.com/more-fun-in-the-sun/\">https://www.shantycreek.com/more-fun-in-the-sun/<\/a><br/>Phone: (866) 695-5010<br/>Address: 5780 Shanty Creek Rd, Bellaire, MI 49615<\/p> <p>Located just outside Bellaire, Shanty Creek offers year-round ways to get outside. In summer, a climb up Schuss Mountain makes a great hike, and bikes and e-bikes are available from the Summit Fitness Center for exploring the area, with the Glacial Hills mountain bike trails just down the road. In winter, 9.5 km of groomed, track-set cross-country ski trails crisscross the resort’s villages, with ski and snowshoe rentals at the Nordic Center at Schuss Village.<\/p>", "photo": "af76e0c3ca0dd3871a3c39c149c9deb3.jpg", "id": "schuss-mountain-shanty-creek-resorts-trails"}]}]}, "nature-parks": {"id": "nature-parks", "title": "Nature + Parks", "icon": "trees", "groups": [{"title": "", "items": [{"title": "Craven Park & Campground", "html": "<p>Website: <a href=\"https://bellairemichigan.com/craven/\">https://bellairemichigan.com/craven/<\/a><br/>Phone: Village of Bellaire offices, 231-533-8213<br/>Location: 3907 S Derenzy Rd, about a mile east of downtown Bellaire (enter at the end of E. Broad St where it meets S. Derenzy/Fairground Rd; map apps may give wrong directions)<\/p> <p>Season: Campground open April 1 (weather permitting) through October 31.<\/p> <p>Offers a campground with full-hookup, water/electric and rustic sites, scenic Craven Pond with fishing, and a walking loop into the Cedar River Natural Area trails. Perfect for those who enjoy a rustic, immersive experience—nature right at your doorstep, but also close to town.<\/p>", "photo": "a993304e194c04872d8a0145a151511e.jpg", "loc": [44.9772, -85.1873], "pin": "outdoors", "id": "craven-park-campground"}, {"title": "Glacial Hills Pathway & Natural Area", "html": "<p>Website: <a href=\"https://glacialhillstrails.org/\">https://glacialhillstrails.org/<\/a><br/>Contact: <a href=\"mailto:glacialhillspathway@gmail.com\">glacialhillspathway@gmail.com<\/a><br/>Location: Just outside Bellaire; trailheads include Eckhardt and Vandermark (3 trailheads in all)<\/p> <p>About 765 acres and 31.5 miles of trails for hiking, mountain biking, running, and winter sports, among old-growth forest and glacial hills. Routes range from the flat 1.5-mile Pine Tree novice trail to the 20.3-mile Outer Loop. Dogs are welcome on leash; no motorized vehicles or horses. Great for active travelers—stunning scenery and great trail variety.<\/p>", "photo": "4fa126321fa3e0a03a963c137a0903f5.jpg", "id": "glacial-hills-pathway-natural-area"}, {"title": "Grass River Natural Area", "html": "<p>Website: <a href=\"https://www.grassriver.org/\">https://www.grassriver.org/<\/a><\/p> <p>Phone: Office: 231-533-8314 • Center: 231-533-8576<\/p> <p>Location: 6500 Alden Hwy, Bellaire, MI 49615<\/p> <p>Hours: Trails open daily, dawn to dusk. Grass River Center: May–October daily 10am–4pm; November–April Sat–Sun 10am–4pm.<\/p> <p>A 1,502-acre preserve featuring seven miles of trails, including 1.5 miles of accessible trails and boardwalk over fens and cedar wetlands. Ideal for hiking, birdwatching, observing wildlife, and educational programs at the nature center. Immerse yourself in wetlands teeming with otters, birds, and native plants—an excellent spot for families and nature lovers. Note: dogs are allowed on-leash only on the Rail Trail and Algonquin Trail, not on the boardwalks.<\/p>", "photo": "4a78e97d0474b838c754a082531f2c5d.jpg", "loc": [44.9228, -85.2113], "pin": "outdoors", "id": "grass-river-natural-area"}, {"title": "Richardi Park (Intermediate River)", "html": "<p>Website: <a href=\"https://bellairemichigan.com/richardi/\">https://bellairemichigan.com/richardi/<\/a> <br/>Phone: Village of Bellaire offices, 231-533-8213<br/>Location: On the Intermediate River just north of downtown; parking off E. Antrim St., Bellaire, MI 49615<\/p> <p>Description: Features a swimming beach, carry-in access for kayaks and canoes, a large pavilion and gazebo (rentable), new playground equipment, tennis and basketball courts, and picnic space—all within walking distance of downtown Bellaire. In winter, the village builds ice rinks when conditions permit.<\/p> <p>Why Guests Will Love It: Ideal for a fun family day—swim, paddle, picnic, or enjoy the playground. Great access to town amenities if guests want a snack or cold drink.<\/p>", "photo": "ee2ae70400fe14a23e835a7a2dcdfd0e.jpg", "loc": [44.9792, -85.2096], "pin": "outdoors", "id": "richardi-park-intermediate-river"}]}, {"title": "Parks and Playgrounds", "items": [{"title": "Lakeview Hotel", "html": "<p>Check out the quaint little playground just outside the Lakeview Hotel! It’s the perfect spot for kids to blow off some steam before or after a swim. Your guest pool passes are good for the Lakeview Hotel indoor pool (open daily 9am–11pm) and the seasonal outdoor pool.<\/p>", "photo": "55477cfc0180af46de5a4637308d3fb0.jpg", "loc": [44.948575, -85.185078], "pin": "parks_and_nature", "id": "lakeview-hotel"}, {"title": "Summit Village Beach Club", "html": "<p>Check out the playground at the Bellaire Beach Club! If the kids need a break from swimming or relaxing on the beach, they can enjoy some fun time on the playground while you soak in the beautiful lakeside atmosphere.<\/p>", "photo": "f376f4b87d3709e04990df61953f81f7.jpg", "loc": [44.952901, -85.203728], "pin": "parks_and_nature", "id": "summit-village-beach-club"}]}]}, "schuss-mountain": {"id": "schuss-mountain", "title": "Schuss Mountain", "icon": "mountain-snow", "groups": [{"title": "", "items": [{"title": "Alpine Tubing", "html": "<p>If skiing and snowboarding aren’t your thing—don’t worry! There’s still a fast and fun way to enjoy the snow. <strong>Alpine Tubing<\/strong> at <strong>Summit Mountain<\/strong> is a must-try winter activity, delivering all the thrills of sledding without the uphill climb.<\/p> <p>You’ll hear laughter echoing across the slopes as guests of all ages race down the tubing lanes and ride the surface lift right back to the top. No skills required—just hold on and enjoy the ride!<\/p> <p>🎯 <strong>What to Know:<\/strong><\/p> <ul> <li>Available <strong>Friday evenings, Saturdays, Sundays &amp; holidays<\/strong><\/li> <li><strong>Sessions start at the top of every hour<\/strong><\/li> <li><strong>$30/hour<\/strong><\/li> <li><strong>Online booking only<\/strong><\/li> <li>Participants must be <strong>36″ tall<\/strong><\/li> <\/ul> <p>💡 <strong>Parents Note:<\/strong><br/>The <strong>last two hours<\/strong> on <strong>Friday and Saturday nights<\/strong> are recommended for <strong>Adults Only<\/strong>—ideal for grown-ups looking to enjoy some child-free fun.<\/p> <p>Whether you're with friends, family, or flying solo, Alpine Tubing offers a unique and laughter-filled way to enjoy Shanty Creek’s winter wonderland.<\/p> <p><strong>More info &amp; booking:<\/strong> <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/\">https://www.shantycreek.com/ski/more-on-the-snow/<\/a><\/p>", "photo": "d85f4f59827bb40aa6b6ac461d66783d.jpg", "id": "alpine-tubing"}, {"title": "Cross Country Skiing", "html": "<p>Few activities showcase the beauty of northern Michigan quite like cross country skiing. Shanty Creek’s 9.5 km of groomed, track-set trails crisscross the resort’s villages to create a “village-to-village” experience whose benefits include staying warm in winter, a heart-healthy cardio workout, and a beautiful setting. If Nordic skiing isn’t your thing, there is a 3 km groomed multi-purpose trail at Schuss Village designated for fat tire biking and snowshoeing. This trail helps ensure skiers and bikers avoid accidents and unforeseen trail damage.<\/p> <p><strong>Nordic Center<\/strong><\/p> <p>Shanty Creek's Nordic Center (located at Schuss Village in the Pro Shop, per the resort) offers classic and skate ski rentals and snowshoe rentals.<\/p> <p>• Trail conditions and info: 231-533-3000<br/>• Ski package and snowshoe rentals<br/>• Private lessons available<br/>• Mon, Thu, Fri: 9am–4pm<br/>• Sat–Sun: 9am–5pm<br/>• Closed Tuesdays &amp; Wednesdays<br/>• Additional hours during holiday dates<\/p> <p>Details for cross-country ski lessons:<br/>- Recommend 48 hours' notice to schedule a lesson.<br/>- Cancellations must be 48 hours in advance for a refund.<br/>- Requests for a specific instructor at least 3 days in advance.<\/p> <p><strong><a href=\"https://www.shantycreek.com/wp-content/uploads/2026/01/NORDIC-TRAILS-Cross-Country-2026-11x17-1-scaled.jpg\">Cross Country Trail Map<\/a><\/strong><\/p>", "photo": "72383d27f4f5158b00c45e7424032b5b.jpg", "id": "cross-country-skiing"}, {"title": "Fat Tire Biking", "html": "<p>Website: <a href=\"https://www.shantycreek.com/ski/nordic-trails/\">https://www.shantycreek.com/ski/nordic-trails/<\/a><br/><a href=\"https://www.shantycreek.com/important-information/#contactus\">Contact Here<\/a><\/p> <p>Looking for a fun winter adventure? Try <strong>fat tire biking on snow<\/strong> at Shanty Creek Resort! The <strong>3 km groomed multi-purpose trail at Schuss Village<\/strong> is designated for fat tire biking and snowshoeing, keeping bikers and Nordic skiers safely apart. Bring your own fat bike, or call ahead to local bike shops about winter rentals.<\/p>", "photo": "fca2ac1ba3f4a7f260f3a476cd3bb7a7.jpg", "id": "fat-tire-biking"}, {"title": "Nordic Skiing", "html": "<p>Few activities capture the quiet beauty of northern Michigan in winter quite like Nordic skiing. At <strong>Shanty Creek Resort<\/strong>, you’ll find <strong>9.5 km of groomed, track-set cross-country trails<\/strong> that wind between the resort’s villages—creating a scenic, heart-healthy, and soul-refreshing <em>village-to-village<\/em> skiing experience.<\/p> <p>Whether you're looking for a cardio workout or a serene glide through the snow-covered woods, these trails deliver.<\/p> <p>🔹 <strong>Multi-Purpose Trail:<\/strong><br/>If Nordic skiing isn’t your thing, a <strong>3 km groomed trail<\/strong> in <strong>Schuss Village<\/strong> is open for <strong>fat tire biking<\/strong> and <strong>snowshoeing<\/strong>, keeping trail usage safe and enjoyable for all guests.<\/p> <p>🔹 <strong>Nordic Center:<\/strong><br/>Located at Schuss Village, the Nordic Center offers:<\/p> <ul> <li><strong>Classic &amp; skating-style ski rentals<\/strong><\/li> <li><strong>Snowshoe rentals<\/strong><\/li> <li>Friendly assistance to get you trail-ready<\/li> <\/ul> <p>🔹 <strong>Hours of Operation:<\/strong><\/p> <ul> <li><strong>Thursday–Friday:<\/strong> 9AM – 4PM<\/li> <li><strong>Saturday–Sunday:<\/strong> 9AM – 5PM<\/li> <li><strong>Monday:<\/strong> 9AM – 4PM<\/li> <li><strong>Closed Tuesdays &amp; Wednesdays<\/strong><\/li> <li><strong>Additional hours during holidays<\/strong><\/li> <\/ul> <p>🔹 <strong>Lessons Available:<\/strong><\/p> <ul> <li><strong>Advance booking (48 hrs)<\/strong> is recommended<\/li> <li><strong>Cancellations require 48 hrs’ notice<\/strong> for a refund<\/li> <li><strong>Instructor requests<\/strong> must be made <strong>at least 3 days<\/strong> in advance<\/li> <\/ul> <p><strong>For more info:<\/strong> <a href=\"https://www.shantycreek.com/ski/nordic-trails/\">https://www.shantycreek.com/ski/nordic-trails/<\/a><\/p>", "photo": "afadf1fc5ceb077b8427fb28bcb335fe.jpg", "id": "nordic-skiing"}, {"title": "Nordic Trail Map", "html": "<p>Explore the snow-covered beauty of Shanty Creek Resort through its scenic <strong>Nordic ski and snowshoe trails<\/strong>—about 9.5 km of groomed, track-set trails. Whether you're a beginner or an experienced skier, these trails offer a peaceful and invigorating way to enjoy winter.<\/p> <p><strong>Trail Overview (2026 trail map)<\/strong><br/>Pine Cone – 4.5 km (Schuss Mountain Village)<br/>Winter Brook – 1.5 km (Schuss Mountain Village)<br/>Arnie’s Way – 1 km (Summit Village)<br/>Summit Loop – 1 km (Summit Village)<br/>Plus a 3 km groomed multi-purpose trail at Schuss Village for snowshoeing and fat tire biking.<\/p> <p>Each trail is marked with difficulty symbols and trailhead signage. You’ll pass landmarks like <strong>Riverview<\/strong>, <strong>Red Lift Corner<\/strong>, and <strong>#3 Tee<\/strong>.<\/p> <p><strong>Nordic Center Hours<\/strong><\/p> <ul> <li><strong>Mon, Thu, Fri:<\/strong> 9am – 4pm<\/li> <li><strong>Sat–Sun:<\/strong> 9am – 5pm<\/li> <li><strong>Closed:<\/strong> Tue &amp; Wed<\/li> <li><em>Additional hours on holiday dates<\/em><\/li> <\/ul> <p><strong>Ready to explore the trails?<\/strong><br/>View the full trail map here: <a href=\"https://www.shantycreek.com/wp-content/uploads/2026/01/NORDIC-TRAILS-Cross-Country-2026-11x17-1-scaled.jpg\">Nordic Trail Map (2026)<\/a><\/p> <p>More info: <a href=\"https://www.shantycreek.com/ski/nordic-trails/\">shantycreek.com/ski/nordic-trails<\/a><\/p>", "photoHidden": "962a7f82255b70903a5737f2f8746089.jpg", "id": "nordic-trail-map"}, {"title": "Schuss Mountain Trail Map", "html": "<p><em>Welcome to one of Michigan’s top ski destinations—where terrain, trails, and fun come together at Schuss Mountain, Shanty Creek Resort.<\/em><\/p> <p><strong>Trail Overview<\/strong><br/>Schuss Mountain has about 42 trails for every skill level, plus 2 terrain parks and 7 lifts. All downhill skiing at Shanty Creek is at Schuss Mountain (Summit Mountain is home to Alpine Tubing).<\/p> <p><strong>Trail Difficulty<\/strong><br/>● Green Circle – Easiest: wide, gentle slopes for beginners<br/>■ Blue Square – More Difficult: for developing skiers<br/>◆ Black Diamond – Most Difficult: steeper, faster terrain<\/p> <p><strong>Lifts<\/strong><\/p> <ul> <li><strong>Quad chairlifts<\/strong> – color-named (Red, Yellow, Purple and more) serving the front face and north side<\/li> <li><strong>Magic carpet and handle tow<\/strong> – for beginners, ski school and the Low Rider park<\/li> <\/ul> <p><strong>Terrain Parks<\/strong><\/p> <ul> <li><strong>Mellow Yellow<\/strong> – the main park, with big boxes, rails and jumps<\/li> <li><strong>Low Rider<\/strong> – smaller features near the Yellow Lift, served by a handle tow; great for building confidence<\/li> <\/ul> <p><strong>Key Areas<\/strong><\/p> <ul> <li><strong>Schuss Village<\/strong> – Base area with day lodge, rentals, tickets, ski school, and food<\/li> <li><strong>Cedar River Village<\/strong> – Lodging at the top of the mountain<\/li> <li><strong>Ski Patrol<\/strong> – On the mountain for safety and assistance<\/li> <\/ul> <p><strong>2026–27 Season<\/strong> (projected): Dec 5, 2026 – Mar 22, 2027<br/>Hours: Sun 9am–4:30pm; Mon–Tue 10am–4:30pm; Wed–Sat and holidays 9am–9pm once night skiing begins.<\/p> <p><strong>Tips for Visitors<\/strong><\/p> <ul> <li>Start your day early for fresh corduroy runs<\/li> <li>Green trails near the base are best for families and beginners<\/li> <li>Use lift maps and signage to plan your route across the mountain<\/li> <li>Helmets are recommended for all riders<\/li> <\/ul> <p><strong>Download full trail map<\/strong>: <a href=\"https://www.shantycreek.com/wp-content/uploads/2021/12/Schuss-Mountain-and-Nordic-Trails-Online.pdf\">Schuss Mountain Trail Map PDF<\/a><\/p>", "photo": "7448326df61a45446d2ccc03cc09cf2e.jpg", "id": "schuss-mountain-trail-map"}, {"title": "Skiing / Snowboarding", "html": "<p><strong>Website:<\/strong> <a href=\"https://www.shantycreek.com/ski/\">https://www.shantycreek.com/ski/<\/a><br/><br/>Shanty Creek Resort offers one of Michigan’s most beloved ski destinations with about <strong>42 downhill trails<\/strong>, all at <strong>Schuss Mountain<\/strong>, making it ideal for skiers and snowboarders of all skill levels. (Summit Mountain is home to Alpine Tubing.)<\/p> <p>Whether you’re a beginner looking for gentle runs or a seasoned skier chasing fresh powder and steeps, the variety of terrain, well-maintained conditions, and laid-back vibe deliver exactly what you need.<\/p> <p><strong>2026–27 Season<\/strong> (projected): Dec 5, 2026 – Mar 22, 2027<br/>Hours: Sun 9am–4:30pm; Mon–Tue 10am–4:30pm; Wed–Sat and holidays 9am–9pm once night skiing begins.<\/p> <p>With breathtaking northern Michigan scenery and a full-service resort experience, <strong>Schuss Mountain<\/strong> simply delivers <em>A Better Value<\/em>.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2021/12/Schuss-Mountain-and-Nordic-Trails-Online.pdf\">Schuss Mountain Trail Map<\/a><\/p> <p><a href=\"https://www.shantycreek.com/ski/?keyword=LiftTickets\">Lift Tickets<\/a><\/p> <p><a href=\"https://www.shantycreek.com/ski/rental-equipment/\">Rental Equipment<\/a><\/p> <p><a href=\"https://www.shantycreek.com/ski/ski-school/\">Ski School<\/a><\/p> <p><a href=\"https://www.shantycreek.com/ski/on-the-snow/#terrainparks\">Terrain Park(s)<\/a><\/p>", "photo": "ecdeea7f506281ea3a23b75cb0cccbf0.jpg", "id": "skiing-snowboarding"}, {"title": "Snow Glide Tours", "html": "<p>Experience winter like never before with Shanty Creek’s <strong>Snow Glide Tours<\/strong> — a scenic, cozy, and memorable ride for all ages.<\/p> <p>Departing from The Lakeview Hotel's front circle, this 45-minute guided tour winds through the snow-blanketed landscapes of <strong>Summit Village<\/strong>, offering sweeping views and a peaceful winter retreat without breaking a sweat. Whether you're snapping photos or simply soaking in the scenery, it’s the perfect way to appreciate the magic of northern Michigan in winter.<\/p> <p>Each tour accommodates up to <strong>9 passengers<\/strong> and is pulled behind “<strong>Big Blue<\/strong>,” a powerful double-track snowmobile. The Snow Glide is equipped with seatbelts; passengers must be able to sit independently with a fastened seatbelt.<\/p> <p><strong>Tour Schedule<\/strong> (last season; check the website for 2026–27 dates):<\/p> <ul> <li>Saturdays, Sundays, and select holiday dates (including the week after Christmas)<\/li> <li>Rides on the hour from <strong>10:00 AM to 3:00 PM<\/strong><\/li> <\/ul> <p><strong>Price<\/strong>: $29 per seat<br/><em>Limited availability – early booking is highly recommended! Questions: 231-533-3000<\/em><\/p> <p>More Info &amp; Booking: <a href=\"https://www.shantycreek.com/snow-glide-tours/\">https://www.shantycreek.com/snow-glide-tours/<\/a><\/p>", "photo": "945e35a66551654ffb82c6f681fcb243.jpg", "id": "snow-glide-tours"}, {"title": "Snow Tubing!", "html": "<p>Experience the thrill of sledding without having to climb back up at Summit Mountain’s Alpine Tubing Park!<\/p> <p>• <strong>Friday evenings, Saturdays, Sundays and holidays<\/strong><br/>• Each session begins at the top of the hour<br/>• Tickets are $30/hour<br/>• Tubing may only be booked online<br/>• Must be 36″ tall to participate<\/p> <p>For Guests with Young Children: While alpine tubing is certainly fun for all ages, please be aware the final two hours on Friday and Saturday nights are recommended for Adults Only.<\/p> <p><a href=\"https://www.shantycreek.com/ski/more-on-the-snow/?keyword=Alpine%20Tubing\">Book now<\/a><\/p>", "photo": "39fb3299ed24dd32b33f0fc9cf955516.jpg", "id": "snow-tubing"}, {"title": "Snowshoeing", "html": "<p><strong>Forge Your Own Trail – Adventure Awaits<\/strong><\/p> <p>Whether you're a seasoned snowshoer or trying it for the first time, snowshoeing at Shanty Creek offers a peaceful and scenic way to explore the winter woods of northern Michigan.<\/p> <p>Slip on a pair and start walking—no special skills required. You can blaze your own path through the snowy landscape or follow the <strong>groomed 3km multi-purpose trail<\/strong> located at <strong>Schuss Village<\/strong>, shared with fat tire bikers and designed to minimize trail damage while keeping everyone safe.<\/p> <p><strong>Rental Equipment<\/strong> is available at the <strong>Nordic Center<\/strong> in Schuss Village, including snowshoes and poles.<\/p> <p>This is a perfect winter activity for those seeking quiet beauty, fresh air, and an easy-going workout.<\/p> <p>More Info: <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/\">https://www.shantycreek.com/ski/more-on-the-snow/<\/a><\/p>", "photo": "4f4d2e709de1bc62ff4df4377b6b2ea1.jpg", "id": "snowshoeing"}]}]}, "shopping": {"id": "shopping", "title": "Shopping", "icon": "shopping-bag", "groups": [{"title": "", "items": [{"title": "Little Treasures Toy & Gift", "html": "<p>Website: <a href=\"https://www.bellairetoys.com/\">https://www.bellairetoys.com/<\/a><\/p> <p>Phone: (231) 533-6559<\/p> <p>Delightful downtown Bellaire shop brimming with classic toys, games, puzzles, crafts and fun gifts—perfect for kids and memorable souvenirs.<\/p>", "photo": "ca4bd12145e263e5155c1a208bcb8544.jpg", "loc": [44.975421, -85.211307], "pin": "retail_therapy", "id": "little-treasures-toy-gift"}]}]}, "shorts-brewing": {"id": "shorts-brewing", "title": "Short's Brewing Company", "icon": "beer", "groups": [{"title": "Brewery Tours & Tastings", "items": [{"title": "The Bellaire Pub - Guided Brewery Tour", "html": "<p>Ever wondered what goes into crafting your favorite Short’s brew? Now’s your chance to find out! Short’s Brewing Company offers behind-the-scenes tours of the innovation brewery at their Bellaire Pub, giving you an insider’s look at the brewing process from start to finish.<\/p> <p>Website: <a href=\"https://www.shortsbrewing.com/tours/\">https://www.shortsbrewing.com/tours/<\/a><\/p> <p>YouTube: <a href=\"https://www.youtube.com/watch?v=hB_pr3V0KfA\">https://www.youtube.com/watch?v=hB_pr3V0KfA<\/a><\/p> <p>Tour Highlights:<\/p> <ul> <li>When: Fridays and Saturdays, from 12:00 PM to 4:00 PM. No reservations or call-aheads—simply check in at the host stand when you arrive.<\/li> <li>What to Expect: A guided walk through the innovation brewery where you’ll learn about the brewing process, the history of Short’s, and the artistry behind their unique beers.<\/li> <li>Note: Tours are only offered at the Bellaire Pub. The Elk Rapids production campus no longer runs tours.<\/li> <\/ul> <p>Pro Tips:<\/p> <ul> <li>Arrive Early: Tours are popular, so arriving a bit early ensures you don’t miss out.<\/li> <li>Stay for a Pint: After the tour, enjoy a freshly poured pint of your favorite Short’s brew in the cozy pub or, in summer, the lively beer garden.<\/li> <li>Ask Questions: The staff are passionate about their craft and love sharing their knowledge. Don’t hesitate to ask about the brewing process, ingredients, or the inspiration behind their beers.<\/li> <\/ul> <p>Contact Information:<\/p> <ul> <li>Phone: (231) 498-2300<\/li> <\/ul>", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "photoHidden": "675241620cdd5ea6c4b9b66d9e7d4631.jpg", "id": "the-bellaire-pub-guided-brewery-tour"}, {"title": "Bellaire Pub Beers", "html": "<p><em>Subject to change (y’all are thirsty!)<\/em><\/p> <p>The Bellaire Pub pours a rotating lineup of Short’s staples alongside small-batch experimental beers you’ll only find at the Mothership. Expect favorites like Local’s Light, Bellaire Brown, Huma Lupa Licious, Soft Parade, and Pure Michigan Porter, plus seasonal releases and ciders like Octorock and Pulsar. Grab packaged beer to go, too—including Local’s Light, Soft Parade, Only Tourists, and Thirst Mutilator.<\/p> <p>Find the current list at Bellaire Pub Beer List: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/beer-list/\">https://www.shortsbrewing.com/locations/bellaire-pub/beer-list/<\/a><\/p>", "photo": "e520e6443d2f1fe57dad2c142122274f.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "bellaire-pub-beers"}, {"title": "Bellaire Pub Menu", "html": "<p>Welcome to the Mothership — the original Short’s Brewing spot where great food, great beer, and Good Humans come together. What started as a hardware store in 2004 has transformed into a local favorite filled with love, good vibes, and delicious eats.<\/p> <p><strong>Popular Appetizers<\/strong><\/p> <ul> <li>Buffalo Chicken Dip with blue cheese crumbles<\/li> <li>Nachos piled high with black bean corn salsa and cheese<\/li> <li>House-made Mac n’ Cheese topped with toasted panko<\/li> <li>Soft Pretzels served with mustard, jam, and cheese spread<\/li> <\/ul> <p><strong>Fresh Salads<\/strong><\/p> <ul> <li>Caesar with shaved Parmigiano and croutons<\/li> <li>Chipotle BBQ Chicken with avocado and black bean salsa<\/li> <li>Mixed greens with feta, falafel, and Greek dressing<\/li> <\/ul> <p><strong>Sammies &amp; Sandwiches<\/strong><\/p> <ul> <li>Pulled Pork Sammie with Carolina BBQ and coleslaw<\/li> <li>Adult Grilled Cheese with multiple cheeses and avocado<\/li> <li>Classic grinders and corned beef on rye<\/li> <\/ul> <p><strong>Build Your Own Pizza &amp; Specialty Pies<\/strong><br/>Handcrafted dough made with Local’s Light Lager — customize toppings or try favorites like house-made sausage, pulled pork, or mushroom festival.<\/p> <p><em>Menu items change seasonally.<\/em> Explore the full menu here: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/pub-dining-menu/\">Bellaire Pub Food Menu<\/a><\/p>", "photo": "3455b3d107564febc10408585ec9f48d.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "bellaire-pub-menu"}, {"title": "Beverages", "html": "<p><em>Explore Short’s core brews, from year-round favorites to unique Pub exclusives.<\/em><\/p> <p><strong>Always Available<\/strong><br/>These beloved beers and ciders are brewed year-round and widely available (lineup subject to change):<\/p> <ul> <li>Local’s Light<\/li> <li>Local’s Amber<\/li> <li>Bellaire Brown<\/li> <li>Huma Lupa Licious<\/li> <li>Soft Parade<\/li> <li>Psychedelic Cat Grass<\/li> <li>Thirst Mutilator (Grape and Lemon Lime)<\/li> <li>Pulsar and Octorock ciders<\/li> <\/ul> <p>Find these and more on Short’s flagship beers page: <a href=\"https://www.shortsbrewing.com/beer-category/flagship/\">https://www.shortsbrewing.com/beer-category/flagship/<\/a><\/p>", "photo": "aab7f420bb05ac4dd9d625ddc9303bdb.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "beverages"}, {"title": "Elk Rapids Pull Barn Beers", "html": "<p><strong>Subject to change — because y’all are thirsty!<\/strong><\/p> <p>At the Elk Rapids Pull Barn, you’ll find a rotating selection of Short’s Brewing favorites both on tap and in packaged form. Whether you’re craving a crisp, refreshing pint or want to take home your favorite brew, the lineup offers something for every palate.<\/p> <p>Expect staples like Local’s Light, Local’s Amber, Bellaire Brown, Huma Lupa Licious, Soft Parade, and LITRO Stout on tap, plus seasonal pours that change throughout the year. Packaged favorites to go include Local’s Light, Huma Lupa Licious, Bellaire Brown, Soft Parade, and Thirst Mutilator.<\/p> <p>Come by and enjoy the freshest brews that Short’s has to offer — from classic staples to exciting new creations!<br/><br/>Check the current list here: <a href=\"https://www.shortsbrewing.com/locations/elk-rapids/beer-list/\">https://www.shortsbrewing.com/locations/elk-rapids/beer-list/<\/a><\/p>", "photo": "e07b47bceebd2e483cdb4d80dce4ee68.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "elk-rapids-pull-barn-beers"}, {"title": "Food Truck Takeout", "html": "<p>The food trucks are back at the Elk Rapids Pull Barn, and we couldn’t be more excited. Stop in for packaged beer, join us for game night, and get ready for an awesome summer of food trucks and sunsets.<\/p> <p><strong>Osorio Tacos y Salsas:<\/strong> Miguel and team are serving up delicious eats during Pull Barn hours.<\/p> <p><strong>Flannigan’s Goat:<\/strong> Garth and family smoke meats on site during the summer season (typically Thursday–Monday). The season usually ends in mid-September, so check the Pull Barn page for current days and hours.<\/p> <p>Takeout, crockpots, and picnics are all welcome—so bring your appetite and enjoy!<\/p> <p>Explore more options: <a href=\"https://business.elkrapidschamber.org/list/ql/restaurants-food-beverages-21\">https://business.elkrapidschamber.org/list/ql/restaurants-food-beverages-21<\/a><\/p>", "photo": "b7a7e990b266c4506764bb4689dac719.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "food-truck-takeout"}, {"title": "Limited Releases", "html": "<p><strong>Limited Releases<\/strong><\/p> <p>Welcome to the treasure trove of Short’s Brewing — the Willy Wonka vault of rare and one-time-only brews. When you spot these limited releases, grab them fast! Chances are, they won’t be around for long, making each sip a special experience.<\/p> <p>Look for small-batch experimental beers, holiday and anniversary releases, ciders, and variety packs—many of them first poured at the Bellaire Pub.<\/p> <p>See what’s out now: <a href=\"https://www.shortsbrewing.com/beer-category/speciality/\">https://www.shortsbrewing.com/beer-category/speciality/<\/a><\/p> <p>Available in cans, kegs, and variety packs, these limited editions showcase the creative spirit and adventurous flavors that keep Short’s fans coming back for more. Don’t miss your chance — these rare finds won’t last!<\/p>", "photo": "5133bbec17018a7651f2737cf622f2c8.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "limited-releases"}, {"title": "Online Order - Bellaire Pub Food Menu", "html": "<p><strong>Order Bellaire Pub Favorites Online<\/strong><br/>Craving your Short’s Brewing Bellaire Pub favorites? Order ahead online: just browse the menu, customize your order, and have it ready to pick up. Easy, fast, and delicious.<\/p> <p>Short’s Brewing Bellaire Pub Online Ordering:<\/p> <p><a href=\"https://www.toasttab.com/local/order/shortsbrewing\">https://www.toasttab.com/local/order/shortsbrewing<\/a><\/p>", "photo": "2f44291c435448507c332ff57c90753b.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "online-order-bellaire-pub-food-menu"}, {"title": "Seasonal Beers", "html": "<p>At Short’s Brewing, every season brings a fresh lineup of exciting beers crafted to celebrate the flavors and moods of the time of year. Whether it’s a crisp winter pilsner, a bright spring hazy IPA, or a refreshing summer shandy, these limited seasonal brews are only available for a short time — so stock up while you can!<\/p> <p>Here’s a taste of what you might find rotating through the taps and cans:<\/p> <ul> <li>The Pure Michigan series (Winter Pils plus Spring, Summer, and Fall IPAs)<\/li> <li>Pure Michigan Porter<\/li> <li>Only Tourists<\/li> <li>Local’s Shandy<\/li> <li>Rhuby<\/li> <\/ul> <p>Discover current seasonal offerings here: <a href=\"https://www.shortsbrewing.com/beer-category/seasonal/\">https://www.shortsbrewing.com/beer-category/seasonal/<\/a><\/p> <p>Available in cans and kegs, these seasonals showcase Short’s creativity and dedication to bold, flavorful beer all year round. Stay tuned and sip with the seasons!<\/p>", "photo": "30fe859259917ba17972b42762c0103c.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "seasonal-beers"}]}, {"title": "Community Events & Festivals", "items": [{"title": "Community Partnerships", "html": "<p><em>We’re about more than beer — a lot more.<\/em><\/p> <p>Short’s Brewing Company proudly supports a diverse range of community-driven projects. From protecting natural resources and promoting outdoor recreation to advancing equity initiatives, we’re dedicated to making the planet a more awesomer place for everyone. Dive in to discover how we’re partnering with local organizations and causes to create meaningful, positive change.<\/p> <p>For more details, visit the Community Partnerships page: <a href=\"https://www.shortsbrewing.com/community-partnerships/\">https://www.shortsbrewing.com/community-partnerships/<\/a> <\/p>", "photo": "c9d5e5df701c1a72da138e93271c7bbc.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "community-partnerships"}, {"title": "Elk Rapids Pull Barn Events Schedule", "html": "<p>Looking for something to do near Bellaire? The Elk Rapids Pull Barn hosts a fun mix of community events—from live music and Mug Club Mondays to paint nights, cornhole tournaments, and the annual Short’s Fest summer kickoff. Check the calendar below so you never miss a beat.<\/p> <p>Check out all upcoming events and explore the full schedule here:<\/p> <p><a href=\"https://www.shortsbrewing.com/events/?type=prod\">Pull Barn events calendar<\/a><\/p> <p>Cheers to good times and great beer — enjoy your stay and the local flavor!<\/p>", "loc": [44.895558, -85.41646], "pin": "other", "photoHidden": "f9b123b7726b448e966f7f58f7cb6671.jpg", "id": "elk-rapids-pull-barn-events-schedule"}, {"title": "Host Your Private Event at Short’s Pub", "html": "<p>Make your next gathering unforgettable with private dining at Short’s Bellaire Pub. Perfectly located near Traverse City, Charlevoix, and Petoskey—and just a quick drive from Grand Rapids, Chicago, and Detroit—our space is ideal for rehearsal dinners, business retreats, and community celebrations. Plus, there’s an Airbnb upstairs if you want to extend the fun overnight.<\/p> <p>Ready to plan your personalized event?<\/p> <p>Book Your Event Here: <a href=\"https://www.shortsbrewing.com/book-an-event/\">https://www.shortsbrewing.com/book-an-event/<\/a> <\/p>", "photo": "f4f295a58649c52750f10d3aa8b8ff78.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "host-your-private-event-at-shorts-pub"}, {"title": "Short’s Brewing Fest & Events Schedule", "html": "<p>Short’s Brewing keeps the good times flowing all year with a mix of beer festivals, charity fundraisers, live music parties, and seasonal celebrations. Whether you’re here for a chill evening or a full-day bash, these events are the perfect chance to connect with locals, savor delicious brews, and dive into the lively Bellaire spirit.<\/p> <p>Check out all upcoming pub events and explore the full schedule here:<\/p> <p><a href=\"https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1178\">https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1178<\/a> <\/p> <p>Cheers to good times and great beer — enjoy your stay and the local flavor!<\/p>", "photo": "473866324d3ec80355f70997b0268be7.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "shorts-brewing-fest-events-schedule"}]}, {"title": "Concerts & Shows", "items": [{"title": "Summer Live Music at the Bellaire Beer Garden", "html": "<p>In summer, Short’s Brewing Company’s Beer Garden (118 N Bridge St., across from the Bellaire Pub) turns into a lively music venue, with live performances in the open air. Shows are typically free, family-friendly, and open to guests of all ages—grab a cold brew and let the good times roll!<\/p> <p>Website: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/\">https://www.shortsbrewing.com/locations/bellaire-pub/<\/a><\/p> <p>Whether you’re in the mood to chill with friends or dance the night away, there’s always a great show happening here.<\/p> <p><strong>Season:<\/strong> The Beer Garden is open seasonally, roughly late spring through early fall. Days and times vary, so check the events calendar for the current lineup: <a href=\"https://www.shortsbrewing.com/events/list/?tribe_eventcategory%5B0%5D=1178\">Short’s Pub Events<\/a><\/p> <p>Check their schedule for local bands, special guests, and fun events that keep Bellaire buzzing all summer long.<\/p>", "photo": "60831062bcb4be4dfd637abf4a460302.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "summer-live-music-at-the-bellaire-beer-garden"}, {"title": "Summer Music Series At The Elk Rapids Pull Barn", "html": "<p><strong>Live Music &amp; Great Brews by the Bay<\/strong><br/>Just 20 minutes from the Bellaire Pub, The Pull Barn in Elk Rapids is where laid-back vibes meet great live music and fresh beer on tap. With its indoor taproom and big outdoor patio, it feels like your favorite backyard party—only with better drinks and a killer stage lineup.<\/p> <p>Expect <strong>live performances all summer long<\/strong>, a rotating draft list of Short’s brews, local food trucks, and that classic Northern Michigan sunset. Whether you’re dancing in the grass or sipping a tasting flight under the stars, The Pull Barn is a must-stop.<\/p> <p>Calendar of Events: <a href=\"https://www.shortsbrewing.com/events/?type=prod\">Pull Barn events<\/a><\/p>", "photo": "6cc152bf499438d7344506e14e294907.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "summer-music-series-at-the-elk-rapids-pull-barn"}]}, {"title": "Hours & Spots", "items": [{"title": "The Bellaire Pub & Beer Garden", "html": "<p>Short’s Brewing Company’s Bellaire Pub is a vibrant brewpub located in the heart of downtown Bellaire, Michigan, at 121 N Bridge St. Housed in a historic building, the pub offers a warm and inviting atmosphere where guests can enjoy a wide selection of craft beers brewed on-site, including classics like Local’s Light and Huma Lupa Licious. The menu features a variety of house-made dishes, from pretzels to pizzas, complemented by a curated list of ciders and seltzers.<\/p> <p><strong>Just across the street, you’ll find the lively Beer Garden<\/strong> (118 N Bridge St., Bellaire, MI 49615), perfect for soaking up Bellaire’s charming vibe. It’s a seasonal outdoor venue that hosts live music during the summer months.<\/p> <p>Phone: (231) 498-2300<\/p> <p><strong>Pub Hours:<\/strong><br/>Sunday–Tuesday: 11:00 AM – 10:00 PM<br/>Wednesday: 11:00 AM – 8:00 PM<br/>Thursday: 11:00 AM – 10:00 PM<br/>Friday–Saturday: 11:00 AM – 11:00 PM<\/p> <p><strong>Kitchen Hours:<\/strong><br/>Sunday–Tuesday: 11:00 AM – 9:00 PM<br/>Wednesday: 11:00 AM – 8:00 PM<br/>Thursday: 11:00 AM – 9:00 PM<br/>Friday–Saturday: 11:00 AM – 10:00 PM<\/p> <p><em>Hours change seasonally and on holidays, so check the website before you go.<\/em><\/p> <p>For more information, visit the official Bellaire Pub page: <a href=\"https://www.shortsbrewing.com/locations/bellaire-pub/\">https://www.shortsbrewing.com/locations/bellaire-pub/<\/a><\/p>", "photo": "9414935094b3f07eedc4de2c085c03b9.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "the-bellaire-pub-beer-garden"}, {"title": "The Elk Rapids Pull Barn", "html": "<p>Elk Rapids was thirsty, so in 2017 we set up draft lines on a pole building at our production campus—thus, the summer beer garden was born. By 2021, The Pull Barn transformed into an indoor, year-round destination. <em>(Psst: Dogs are welcome outside only. Please don’t bring your furry friends inside—not even Kevin!)<\/em><\/p> <p>Address: 211 Industrial Park Dr., Elk Rapids, MI 49629<\/p> <p><em>Visit Here: <a href=\"https://www.shortsbrewing.com/locations/elk-rapids/\">https://www.shortsbrewing.com/locations/elk-rapids/<\/a><\/em><\/p> <p><strong>Pull Barn Hours<\/strong><br/>Mon–Thurs: 2:00 PM – 8:00 PM<br/>Fri–Sun: 11:00 AM – 9:00 PM<\/p>", "photo": "a1cf764ef96b548bde4cca86b5a3ecaa.jpg", "loc": [44.895558, -85.41646], "pin": "other", "id": "the-elk-rapids-pull-barn"}, {"title": "Short’s Mart", "html": "<p><em>Your one-stop shop for all things Short’s — beer, gear, and goodies galore.<\/em><\/p> <p>Whether you’re looking to rep Short’s in style, stock up on fun gifts, or gear up for summer adventures, Short’s Mart has you covered. Shop hats, tees, sweatshirts and button-ups, glassware, mugs, water bottles, home goods, and gift cards—made for Good Humans and perfect for any occasion, whether you’re at the pub, the Pull Barn, or around the campfire.<\/p> <p>Orders over $100 ship free.<\/p> <p>Explore every product here: <a href=\"https://store.shortsbrewing.com/\">https://store.shortsbrewing.com/<\/a><\/p>", "photo": "e118e6130a30ed25bff4b9ef143b8f22.jpg", "loc": [44.976252, -85.210421], "pin": "retail_therapy", "id": "shorts-mart"}]}]}, "spas-salons": {"id": "spas-salons", "title": "Spas + Salons", "icon": "sparkles", "groups": [{"title": "", "items": [{"title": "AfterEffect – Restorative Body Therapy", "html": "<p>Website: <a href=\"https://www.tryaftereffect.com/\">https://www.tryaftereffect.com/<\/a><\/p> <p>Phone: (231) 709-3489<br/>Address: 109 W Cayuga St, Bellaire, MI 49615<\/p> <p>Hours: Monday–Friday, 10 AM – 7 PM (book online through the website)<\/p> <p>A top-rated therapeutic massage service offering a wide variety of modalities—including Deep Tissue, Swedish, Cranial Sacral Therapy, Trigger Point, HydroTherapy, Reflexology, Shiatsu, and Manual Lymphatic Drainage—designed for pain relief and deep relaxation. Ideal for guests seeking serious stress relief or targeted work on aches—especially helpful after outdoor adventures or long drives. Ryan comes highly recommended for both professionalism and healing expertise.<\/p>", "photo": "9288c889833e897af3be35f22685e74d.jpg", "loc": [44.975155, -85.211254], "pin": "spa_beauty", "id": "aftereffect-restorative-body-therapy"}, {"title": "Revive Salon & Spa", "html": "<p>Facebook: <a href=\"https://www.facebook.com/p/Revive-Salon-and-Spa-100063958816813/\">https://www.facebook.com/p/Revive-Salon-and-Spa-100063958816813/<\/a><\/p> <p>Phone: (231) 533-8212 (call to book)<br/>Address: 706 E Broad St, Bellaire, MI 49615<\/p> <p>Opening Hours: Monday–Friday: 9 AM–5 PM; Saturday &amp; Sunday: Closed<\/p> <p>A full-service salon offering hair styling, coloring, treatments, extensions, keratin straightening, highlights, blowouts, and more. Perfect for guests wanting a quick refresh, stylish haircut, or a beauty touch-up before an evening event or lakeside outing.<\/p>", "photo": "c56d7249315700a58bd467fb55dc6a32.jpg", "loc": [44.976169, -85.197767], "pin": "spa_beauty", "id": "revive-salon-spa"}]}]}, "tours": {"id": "tours", "title": "Take A Tour", "icon": "train-front", "groups": [{"title": "", "items": [{"title": "The Bellaire Pub - Guided Brewery Tour", "html": "<p>Ever wondered what goes into crafting your favorite Short’s brew? Short’s Brewing Company offers behind-the-scenes tours of the innovation brewery at their Bellaire Pub. (Tours are no longer offered at the Elk Rapids production facility.)<\/p> <p>Website: <a href=\"https://www.shortsbrewing.com/tours/\">https://www.shortsbrewing.com/tours/<\/a><\/p> <p>YouTube: <a href=\"https://www.youtube.com/watch?v=hB_pr3V0KfA\">Best Brewery Tour: Bellaire Pub<\/a><\/p> <p>Tour Highlights:<\/p> <ul> <li>When: Fridays and Saturdays, 12:00 PM to 4:00 PM. No reservations or call-aheads; simply check in at the host stand when you arrive.<\/li> <li>What to Expect: A guided walk through the innovation brewery where you'll learn about the brewing process, the history of Short’s, and the artistry behind their beers.<\/li> <\/ul> <p>Pro Tips:<\/p> <ul> <li>Arrive Early: Tours are popular, so arriving a bit early helps.<\/li> <li>Stay for a Pint: After the tour, enjoy a freshly poured pint in the pub.<\/li> <li>Ask Questions: The staff are passionate about their craft and love sharing their knowledge.<\/li> <\/ul> <p>Contact Information:<\/p> <ul> <li>Address: 121 N Bridge St, Bellaire, MI 49615<\/li> <li>Phone: (231) 498-2300<\/li> <li>Pub hours: Sun–Tue &amp; Thu 11am–10pm; Wed 11am–8pm; Fri–Sat 11am–11pm<\/li> <\/ul>", "photo": "675241620cdd5ea6c4b9b66d9e7d4631.jpg", "loc": [44.976269, -85.210357], "pin": "bars_and_nightlife", "id": "the-bellaire-pub-guided-brewery-tour"}, {"title": "Charters North – Captain Shaun’s Custom Cruises", "html": "<p>Website: <a href=\"https://chartersnorth.com\">https://chartersnorth.com<\/a> <br/>Phone (call or text): (231) 590‑1949<br/>Pick-up: Convenient Torch Lake pick-ups at Butch’s Bait and Tackle, Dockside, or Eastport<\/p> <p>Take your vacation to the next level with fully captained boat adventures by Captain Shaun — born and raised on Torch Lake with 35+ years of experience fishing it. From fishing excursions to relaxing sandbar cruises, you’re in for a custom-tailored experience that’s fun, safe, and unforgettable.<\/p> <p><em><strong>Trip Options<\/strong><\/em> (half-day trips from $495 for up to 2 people; $145 each additional person):<\/p> <ul> <li>Salmon &amp; Trout Troll: Lake trout, Atlantic salmon, steelhead and brown trout on Torch and Elk Lake.<\/li> <li>Night Walleye Troll: Chase walleye under the stars.<\/li> <li>Smallmouth Bass Casting: The most active trip, with expert guidance (trolling option available).<\/li> <li>Fall Perch Fishing: October–December, for jumbo perch.<\/li> <li>Custom Cruises: Sandbar day, sunset cruise, nature or real-estate tours.<\/li> <li>Fish &amp; Sandbar Package: A full day (8 hours) for up to 6—fish in the morning, then relax at Torch Lake’s famous sandbar.<\/li> <\/ul> <p><strong><em>More Details:<\/em><\/strong><\/p> <ul> <li>Captain Provided: Yes — all trips are fully captained and guided.<\/li> <li>Boat capacity: Up to 6 guests per boat.<\/li> <li>What to Bring: A current Michigan fishing license (for fishing trips), weather-appropriate clothing and rain gear, sunscreen, and your own food and drinks. Bottled water is provided, and fish cleaning/packaging is included.<\/li> <li>Cancellations: Peak-season (June–August) trips and trips within 14 days are non-refundable except for severe weather or mechanical issues.<\/li> <\/ul>", "photo": "118f8502b91c601b91d5b4d950d441aa.jpg", "loc": [44.942765, -85.283704], "pin": "boating", "id": "charters-north-captain-shauns-custom-cruises"}, {"title": "Foxy’s Custom Cruises – “Ahoy Matey!”", "html": "<p>Website: <a href=\"https://www.foxyscustomcruises.com\">https://www.foxyscustomcruises.com<\/a> <br/>Phone/Text: (231) 944-6823<br/>Location: Clam River Marina, dock #22 – 6349 Old Torch Lake Dr, Bellaire, MI (follow signs to Dockside restaurant, turn at the electronic sign and go through the Clam River Marina gate; do not park in the Dockside lot)<\/p> <p>Celebrate in style aboard a private, fully captained cruise on Torch Lake with Captain Foxy or Captain Rob. Choose from options like a Sandbar Splash Day, Sunday Funday, Torch Lake Tour, Fun in the Sun, or a Bachelorette Party package. Coolers and snacks are welcome—bring your own beverages and toast to unforgettable memories!<\/p> <p>FAQs:<\/p> <ul> <li>Captain provided? Yes, every cruise is captained by Captain Foxy (USCG-certified) or Captain Rob.<\/li> <li>Group size? Up to 6 guests on most cruises, with up to 4 more at $50 per person.<\/li> <li>Bachelor/bachelorette parties? Yes, a dedicated bachelorette package is offered.<\/li> <li>Kids? Bring life jackets for children 3 and under.<\/li> <li>Boating license needed? No, captain included.<\/li> <\/ul>", "photo": "50275bb5744630c646f599567c2b1314.jpg", "loc": [44.942928, -85.281867], "pin": "boating", "id": "foxys-custom-cruises-ahoy-matey"}, {"title": "Grass River Nature Area Tours", "html": "<p><strong>Kayak Tours<\/strong><\/p> <p>There is no better way to experience Grass River than by paddling its calm waters and enjoying its unique wildlife! On these guided tours, visitors explore Grass River by kayak and learn about GRNA’s conservation efforts, wetland plants, and wildlife. Adults and teens only.<\/p> <ul> <li><strong>Public tours<\/strong> run through summer and fall—see the Classes and Programs page on the website.<\/li> <li><strong>Private kayak tours<\/strong> for groups of 4–6: $50 per person including kayak rental; email <a href=\"mailto:james@grassriver.org\">james@grassriver.org<\/a>.<\/li> <li><strong>Kayak rentals<\/strong> (June–September, reserve ahead): 231-533-8576.<\/li> <\/ul> <p><strong>Guided River Walks<\/strong><\/p> <p>Have a group that would like a private 2-hour tour led by one of GRNA’s knowledgeable naturalists? Walk the boardwalks over the wetlands to the river while a guide shares the history, conservation efforts, and local flora and fauna of GRNA. $100 minimum per group; allow at least two weeks’ notice. Contact <a href=\"mailto:james@grassriver.org\">james@grassriver.org<\/a>.<\/p> <p><a href=\"https://www.grassriver.org/river-tours.html\">https://www.grassriver.org/river-tours.html<\/a><\/p>", "photo": "deddf2b75c252ba832467a3ea7a0e23d.jpg", "loc": [44.9228, -85.2113], "pin": "outdoors", "id": "grass-river-nature-area-tours"}, {"title": "Northaire Resort & Pontoon Rentals", "html": "<p>Website: <a href=\"https://www.northaireresort.com\">https://www.northaireresort.com<\/a> <\/p> <p>Phone: (231) 377‑7764<\/p> <p>Resort &amp; main dock: 7067 Crystal Springs Rd, Bellaire, MI 49615 (on Clam Lake)<\/p> <p>Dock locations: Northaire has private docks on Torch Lake, Clam Lake, and in Bellaire. Confirm your dock location before heading out.<\/p> <p>Experience northern Michigan’s shimmering Chain of Lakes with ease and comfort. Northaire has the largest pontoon rental fleet on the Chain of Lakes, with amenities like Bluetooth stereo, GPS depth finder, changing room, tow bar for tubing, ladder, and bimini top. Begin your journey on Clam Lake, cruise to the famous sandbar on Torch Lake, and explore scenic coves and the Grass River. Jet skis are also available at the Torch Lake location.<\/p> <p>FAQs<\/p> <ul> <li>Captain provided? Pontoons are self-drive. For a captained outing, book Northaire’s 2-hour Sunset Cruise.<\/li> <li>Is alcohol allowed? Bring a cooler with drinks and snacks (please enjoy responsibly).<\/li> <li>Pick-up and return? Pick-up starts at 9am and boats return by 7pm; staff contact you the night before to set your pick-up time.<\/li> <li>Boating license needed? Michigan requires a boater safety certificate for operators born after June 30, 1996.<\/li> <\/ul> <p>Tips<\/p> <ul> <li>Arrive a little early for check-in and orientation.<\/li> <li>Bring sunscreen, snacks, and a favorite playlist.<\/li> <li>Tubes, lily pads, and porta-potties can be rented at each location.<\/li> <li>The Grass River is a no-wake zone; stay toward the center to avoid shallow spots.<\/li> <\/ul>", "photo": "5c7a4a2ccccdf70e29d2fdf49d698fc1.jpg", "loc": [44.931543, -85.260213], "pin": "places_to_stay", "id": "northaire-resort-pontoon-rentals"}, {"title": "Torch Lake Sunset Cruises", "html": "<p>Website: <a href=\"https://www.northaireresort.com/sunset-cruises\">https://www.northaireresort.com/sunset-cruises<\/a> <br/>Phone: (231) 377‑7764<br/>Location: Departs from the Clam River, right by Dockside restaurant (6340 Old Torch Lake Dr, Bellaire, MI); exact meeting point and time confirmed at booking<br/>Tour Duration: 2 hours<br/>Price: $75 per person (2-person minimum)<br/>Captain Provided: Yes – licensed captain included<\/p> <p>Treat yourself to a magical evening on Torch Lake with a <strong>2-hour, captained sunset cruise<\/strong>. Your captain will take you from the Clam River out onto Torch Lake’s stunning blue expanse as the sun dips into the horizon. Bring your favorite drinks and snacks—a cooler full of ice is provided. Departure times vary with the sunset and are set when you book.<\/p> <p>Perfect for couples, families, or small groups, this stress-free experience is all about unwinding and soaking in one of the most beautiful sunsets in the Midwest. No boating experience needed—just show up and enjoy!<\/p>", "photo": "b5489bed10331fccbc806b3d004b87a0.jpg", "loc": [44.942899, -85.283568], "pin": "boating", "id": "torch-lake-sunset-cruises"}]}]}, "water-activities": {"id": "water-activities", "title": "Water Activities", "icon": "sailboat", "groups": [{"title": "Beaches", "items": [{"title": "Antrim Creek Natural Area & Rex Beach", "html": "<p><em>Explore, Relax, and Rejuvenate by the Lake<\/em><\/p> <p><strong>Website: <\/strong><a href=\"https://www.antrimcountymi.gov/departments___services_/parks___recreation/natural_areas/antrim_creek_natural_area/index.php\">Antrim County – Antrim Creek Natural Area<\/a> <br/><strong>Phone:<\/strong> (231) 599-2712 — Antrim County Parks<br/><strong>Location:<\/strong> Old Dixie Hwy at the west end of Rex Beach Rd, Atwood area (Banks Township) (Approx. 30 minutes from Bellaire)<br/><strong>Season:<\/strong> Open year-round<\/p> <p>Discover the serene beauty of <strong>Antrim Creek Natural Area &amp; Rex Beach<\/strong>, a county natural area nestled along the pristine shores of Grand Traverse Bay. This protected area offers nearly a mile of undeveloped coastline, providing a tranquil retreat for nature enthusiasts and beach lovers alike.<\/p> <p>Embark on scenic hikes through diverse landscapes, including hardwood forests, wetlands, and coastal dunes. The sandy beach at Rex Beach invites you to relax, swim, or enjoy a peaceful picnic with breathtaking lake views.<\/p> <p>Whether you're seeking a quiet escape or an adventure in nature, Antrim Creek Natural Area &amp; Rex Beach offers a perfect blend of outdoor recreation and natural beauty, just a short drive from Bellaire.<\/p> <p>Find out more: <a href=\"https://www.visitcharlevoix.com/AntrimCreekNatureArea/\">Visit Charlevoix – Antrim Creek Nature Area<\/a> <br/><\/p> <p>FAQs<\/p> <ul> <li>Free parking is available near trailheads and beach access.<\/li> <li>Trails are easy to moderate and suitable for most ages.<\/li> <li>Picnic areas are available; bring your own blanket or chairs.<\/li> <li>Swimming is allowed at Rex Beach (no lifeguards on duty).<\/li> <li>Leashed dogs are welcome; please clean up after pets.<\/li> <\/ul>", "photo": "8bd2336d826b8524b77b6d270cf9be2f.jpg", "loc": [45.179074, -85.378659], "pin": "beaches", "id": "antrim-creek-natural-area-rex-beach"}, {"title": "Miley's Beach (Cottage Drive Family Park) – Public Beach on Lake Bellaire", "html": "<p>Website: <a href=\"https://foresthometwp.com/parks\">Forest Home Township Parks<\/a><br/>Phone: (231) 533-8003 (Forest Home Township)<br/>Location: Cottage Drive, west shore of Lake Bellaire, Bellaire, MI 49615<\/p><p>Access: Free public township park<\/p><p>Miley's Beach at Cottage Drive Family Park is Lake Bellaire's public family beach. Enjoy soft sand, good swimming, and plenty of space to lay down a towel or set up a picnic. It's a peaceful, easygoing alternative to busier lakefronts—ideal for sunbathing, swimming, or simply enjoying the lake.<\/p><p>FAQs – What Guests Should Know:<\/p><ul><li>Do I need a pass or pay an entrance fee?<br/>No—it's a public township park.<\/li><li>Are there picnic areas or restrooms?<br/>Yes. The township lists picnic tables, grills, benches, and restroom facilities.<\/li><li>Is it suitable for swimming?<br/>Yes, the sandy beach is known for excellent swimming. There are no lifeguards, so supervise kids.<\/li><li>Any tips for first-timers?<br/>Bring sunscreen, towels, snacks, and beach chairs, and arrive early on summer weekends.<\/li><\/ul>", "photoHidden": "a8274109429ec06487fbc8afc556f169.jpg", "id": "mileys-beach-cottage-drive-family-park-public-beach-on-lake-bellaire"}, {"title": "Richardi Park (Riverside Beach in Bellaire)", "html": "<p>Website: <a href=\"https://bellairemichigan.com/richardi/\">https://bellairemichigan.com/richardi/<\/a> <br/>Phone: (231) 533-8213 (Village of Bellaire)<br/>Location: On the Intermediate River just north of downtown Bellaire; parking off E. Antrim St.<\/p> <hr/> <p>Right in town, <strong>Richardi Park<\/strong> offers a relaxed waterside escape with a swimming beach on the Intermediate River. The park also has tennis and basketball courts, a playground, a large rentable pavilion, and plenty of green space, making it an ideal spot for families. Whether you're looking to swim, picnic, or simply relax by the water, Richardi Park is an easy stop.<\/p> <p>FAQs<\/p> <ul> <li>Is parking available?<br/>Yes, there's a parking lot off E. Antrim Street.<\/li> <li>Is there a swimming beach?<br/>Yes, the park has a swimming beach on the river (no lifeguards).<\/li> <li>Are there facilities for picnics?<br/>Yes—bring a picnic basket; the pavilion and gazebo can be reserved through the Village offices.<\/li> <li>Is there a playground for children?<br/>Yes, with new playground equipment recently added.<\/li> <\/ul>", "loc": [44.9792, -85.2096], "pin": "beaches", "photoHidden": "bef12c543bbb9a65ba8202ee1fe80efe.jpg", "id": "richardi-park-riverside-beach-in-bellaire"}, {"title": "Summit Village Private Beach (HOA) Bellaire Beach Club", "html": "<p>Website: <a href=\"https://www.shantycreek.com/venue/summit-village/\">https://www.shantycreek.com/venue/summit-village/<\/a> <\/p> <p>Phone: 231‑533‑8621<\/p> <p><em>Lake Bellaire – minutes away<br/><\/em><em>Private access included with your stay (Summit Village HOA guest pass required)<\/em><\/p> <p>This exclusive beach is nestled within the <strong>Summit Village community of Shanty Creek Resort<\/strong> and is available only to Summit Village HOA members and their guests. With 350 feet of sandy shoreline, lounge chairs, shaded grassy areas, grills, a playground, and clean restroom facilities, it’s a perfect place to relax or play all day.<\/p> <p>Enjoy sunrise views over the lake, a family-friendly environment, and a quiet, resort-style atmosphere just minutes from the property.<br/><br/><\/p> <p>FAQs:<\/p> <ul> <li>Is this beach open to the public?<br/>No, it’s only accessible to Summit Village HOA members and their registered guests—your Airbnb stay includes access!<\/li> <li>Do I need a pass to enter?<br/>Yes—a guest pass is required and will be provided upon check-in or through the host.<\/li> <li>Are there facilities on-site?<br/>Yes! You’ll find restrooms, BBQ grills, lounge chairs, grassy picnic areas, and even a playground.<\/li> <li>Is it good for kids?<br/>Absolutely—it’s family-friendly, quiet, and well-maintained, with plenty of space to play safely.<\/li> <li>Can we bring food or drinks?<br/>Yes! Pack a cooler, fire up the grill, and enjoy a lakeside picnic. Just please clean up after use.<\/li> <\/ul>", "photo": "73504cef162d8f178592b48e0131f16e.jpg", "loc": [44.95253, -85.203743], "pin": "beaches", "id": "summit-village-private-beach-hoa-bellaire-beach-club"}, {"title": "Torch Lake Sandbar", "html": "<p>A Must-Visit Gem Near Bellaire, MI<\/p> <p>More info: <a href=\"https://torchlake.com\">torchlake.com<\/a><br/>Location: South end of Torch Lake near the Torch River (Rapid City / Alden area); reached by boat from Bellaire via Lake Bellaire, Clam Lake and Torch Lake<\/p> <p><em>Access: Best reached by boat, kayak, or jet ski; rentals available nearby<\/em><\/p> <p>Torch Lake Sandbar is famous for its stunning, crystal-clear turquoise waters and soft sandy bottom. Perfect for swimming, sunbathing, and boating, it's a must-visit spot for a relaxing day on the water. Bring your snacks and sunscreen, and enjoy this beautiful natural gem!<\/p> <p>FAQs – What Guests Should Know<\/p> <ul> <li>How do I get there?<br/>You'll need a boat or watercraft—rent from a nearby marina or charter a cruise with a captain for a no-hassle trip.<\/li> <li>Can we swim at the sandbar?<br/>Yes! The water is shallow and perfect for swimming and wading.<\/li> <li>Can we bring drinks and snacks?<br/>Absolutely! Picnic-friendly—just be respectful and take your trash with you.<\/li> <li>Is it a party spot or family-friendly?<br/>It can be both! Weekends (especially the Fourth of July) bring a lively crowd, while weekdays are more relaxed.<\/li> <li>When's the best time to go?<br/>Arrive early in the day for calmer waters and easy anchoring—especially on weekends and holidays.<\/li> <\/ul>", "photo": "eb90813ab4f1a0afa0eb47a08e35b29f.jpg", "loc": [44.8517, -85.3242], "pin": "beaches", "id": "torch-lake-sandbar"}]}, {"title": "Boat Rentals", "items": [{"title": "Bellaire Pontoon Boat Rental", "html": "<p>Website: <a href=\"https://bellairepontoonrental.com/\">https://bellairepontoonrental.com/<\/a> <br/>Phone: (231) 377-7764<br/>Location: 204 W Cayuga St, Bellaire, MI (right across the Intermediate River from downtown)<\/p> <p>Cruise the beautiful Torch, Clam, and Lake Bellaire aboard a pontoon or tritoon boat. Bellaire Pontoon Boat Rental shares its phone and fleet with Northaire Resort &amp; Pontoon Rentals, with private docks in Bellaire, on Clam Lake and on Torch Lake, and a safety boat on call for peace of mind. Want someone else to drive? Book the captained 2-hour sunset cruise on Torch Lake. Enjoy a stress-free day on the water, perfect for families, friends, or special occasions.<\/p> <p>FAQs<\/p> <ul> <li>Are captains provided for rentals?<br/>Rentals are self-drive; a licensed captain is included on the sunset cruise.<\/li> <li>What are the rental hours?<br/>Boat pick-up from 9 a.m., return by 7 p.m.<\/li> <li>Where do I pick up the boat?<br/>At the Bellaire dock (or the Clam Lake/Torch Lake docks)—your location is confirmed before your trip.<\/li> <li>Is there a safety boat on standby?<br/>Yes, a safety boat is on call.<\/li> <li>Can the rental accommodate special occasions like parties?<br/>Absolutely! Perfect for family outings and celebrations.<\/li> <\/ul>", "photo": "3cf903e99cb0c0d26f0a40787b74577d.jpg", "loc": [44.975788, -85.213203], "pin": "boating", "id": "bellaire-pontoon-boat-rental"}, {"title": "DeWitt Marine — Boat Rentals on Torch Lake", "html": "<p>Website: <a href=\"https://www.dewittmarine.com\">https://www.dewittmarine.com<\/a> <br/>Phone: (231) 377-6611<br/>Location: 6509 Crystal Springs Rd, Bellaire, MI 49615 - about 15 minutes from Bellaire<br/>Hours: Mon–Sat 9 a.m.–4:30 p.m.; Sun by appointment<\/p> <p>DeWitt Marine, a family-owned full-service marina since 1949, offers boat rentals for an unforgettable day on Torch Lake! Located on the Clam River just above Torch Lake, it's the perfect spot to launch your boating adventure. Grab snacks at the Clam Shack on the gas dock, fuel up, and cruise out to the famous Torch Lake Sandbar.<\/p> <p>FAQs:<\/p> <ul> <li>Do boats come with a captain? No, but staff offer clear instructions before you go.<\/li> <li>Is alcohol allowed onboard? Ask when booking—rental rules vary.<\/li> <li>Do I need a boating license? Michigan requires a boater safety certificate for anyone born on or after July 1, 1996 to operate a motorboat.<\/li> <li>Do I need to reserve in advance? Yes, especially in summer!<\/li> <li>Where do I return the boat? Back to DeWitt Marine's docks.<\/li> <\/ul>", "photo": "22675b5a0fa139cb95f5897953514141.jpg", "loc": [44.94002, -85.281224], "pin": "boating", "id": "dewitt-marine-boat-rentals-on-torch-lake"}, {"title": "Dockside Water Sports", "html": "<p>Website: <a href=\"https://www.dockside-watersports.com/\">https://www.dockside-watersports.com/<\/a> <br/>Phone: 231-377-7777 ext. 2<br/>Location: 6326 Old Torch Lake Dr, Bellaire, MI 49615 — right on Torch Lake next to Dockside Restaurant<br/>Season: Late May to mid-September, daily 9:30 a.m.–7:30 p.m., weather permitting (2026 dates: May 23–Sept 13)<\/p> <p>Ready for high-performance fun on Northern Michigan's clearest waters? Dockside Water Sports offers luxury pontoon/tritoon rentals and thrilling jet skis, perfect for both laid-back lake cruising and adrenaline-pumping rides. As the only rental company right on Torch Lake's open shoreline, you can head straight out—and come back anytime for restrooms, snacks, lunch at Dockside Restaurant, or a rest at the beach. Whether you're seeking family-friendly fun or fast-paced adventure, this is your launchpad to unforgettable lake memories.<\/p> <p>FAQs<\/p> <ul> <li>Are captains available for boat rentals?<br/>Rentals are self-operated; staff give a full tutorial and can take you out for a hands-on demo if needed.<\/li> <li>Is beach access included?<br/>Yes, you can return to the Dockside home base and beach during your rental.<\/li> <li>What amenities are available on-site?<br/>Valet docking, restrooms, the Dockside Restaurant, and staff who carry your gear and fill your cooler with ice.<\/li> <li>Can we bring food and drinks onboard?<br/>Yes! Coolers and snacks are welcome—just pack responsibly.<\/li> <li>Is training provided for first-time jet ski or boat users?<br/>Absolutely. Staff provide safety and operating instructions before departure.<\/li> <\/ul>", "photo": "c282a4b77a01383fb801765cdcd40046.jpg", "loc": [44.942879, -85.283565], "pin": "boating", "id": "dockside-water-sports"}, {"title": "Foxy’s Custom Cruises (“Ahoy Matey!”)", "html": "<p>Website: <a href=\"https://www.foxyscustomcruises.com\">https://www.foxyscustomcruises.com<\/a><\/p> <p>Phone: (231) 944-6823 (text Capt. Foxy for dates, times and payment)<br/>Dock: Clam River Marina, 6349 Old Torch Lake Dr, Bellaire, MI 49615 — dock #22 (follow signs to Dockside Restaurant, turn through the 'Clam River Marina' gate; don't park in Dockside's lot)<\/p> <p>Hop aboard with Foxy's Custom Cruises, captained by Capt. Foxy—a Coast Guard–certified captain with 20+ years on Torch Lake—and Capt. Rob, a retired Air Force veteran and self-described 'sandbar guy.' Foxy's offers the perfect mix of adventure, celebration, and lake-life fun on Torch Lake. Choose from the Sandbar Splash Day, Sunday Funday, Torch Lake Tour, Fun in the Sun, or a Bachelorette Party cruise, or ask about a custom cruise.<\/p> <p>FAQs<\/p> <ul> <li>How many people can come?<br/>Up to 6 passengers per cruise, with up to 4 more at an extra per-person fee (10 max).<\/li> <li>Are the cruises family-friendly?<br/>Yes—bring your own life jackets for children 3 and under.<\/li> <li>Can we bring drinks or food onboard?<br/>Yes, coolers and snacks are welcome. Tips are appreciated!<\/li> <li>What kind of events are best for Foxy's?<br/>Bachelorette parties, birthdays, family outings, or just relaxing with friends at the sandbar.<\/li> <li>Do we need boating experience?<br/>Not at all—your captain handles everything so you can kick back and enjoy the ride.<\/li> <\/ul>", "photo": "0648dc92be5e7d0b4bd16252763668af.jpg", "loc": [44.942928, -85.281867], "pin": "boating", "id": "foxys-custom-cruises-ahoy-matey"}, {"title": "M‑88 Boat & Dock Rentals", "html": "<p>Website: <a href=\"https://www.m88boatrentals.com/\">https://www.m88boatrentals.com/<\/a><\/p> <p>Phone: (231) 320-0190<br/>Location: 100 Ohio St, Bellaire, MI 49615 — Right on the Intermediate River, downtown Bellaire<br/>Hours: Mon–Fri 9 a.m.–5 p.m.; Sat–Sun 10 a.m.–4 p.m.<\/p> <p><strong>Note: No boat rentals in 2026 — dock rentals only. Pontoon rentals are expected to return in summer 2027.<\/strong><\/p> <p>M-88 Boat &amp; Dock Rentals offers daily, weekly and seasonal dock slips in downtown Bellaire on the Intermediate River, with easy access to Lake Bellaire, the Grass River, Clam Lake and Torch Lake. When pontoon rentals return, boats are docked in the water—just park in the public lot by the village boat launch, meet them at the shed at 100 Ohio Street, and step aboard. No trailers or ramps needed!<\/p> <p>Guest Tips:<\/p> <ul> <li>Bringing your own boat? Reserve a daily or weekly dock online.<\/li> <li>Pontoon rentals (when offered) run daily or multi-day; boats must be returned with a full tank.<\/li> <li>They keep a limited supply of comfortable infant, child and youth life jackets on request—Michigan law requires children under 6 to wear one while underway.<\/li> <li>Full refund for boat-rental cancellations made 48 hours in advance.<\/li> <\/ul>", "photo": "827b4b4d126e2dab8f5dea8d425f0116.jpg", "loc": [44.978174, -85.211558], "pin": "boating", "id": "m-88-boat-dock-rentals"}, {"title": "Northaire Resort & Pontoon Rentals", "html": "<p>Website: <a href=\"https://www.northaireresort.com/\">https://www.northaireresort.com/<\/a> <br/>Phone: (231) 377-7764<br/>Location Guide: 7067 Crystal Springs Rd, Bellaire, MI 49615 — on the south shore of Clam Lake, about 15 minutes' drive from downtown Bellaire (additional docks on Torch Lake and in Bellaire)<\/p> <p>Set sail from a classic Up North destination with the largest fleet of pontoons on Torch Lake, Clam Lake and Lake Bellaire! Northaire Resort has been making lake dreams come true since 1948. With private docks at the resort on Clam Lake, on Torch Lake, and in Bellaire, it's the ideal launch point for everything from tranquil morning cruises to tubing afternoons and golden-hour sunset rides.<\/p> <p>Their boats come with Bluetooth stereo, GPS depth finder, bimini top, ladder, changing room and a tow bar for tubing. Tubes, lily pads and porta-potties are available to add on, and jet skis rent from the Torch Lake location. Whether you're celebrating something big or just living your best lake life, Northaire makes it seamless and stress-free.<\/p> <p>FAQs<\/p> <ul> <li>Are captains available?<br/>Yes, on the captained 2-hour Torch Lake sunset cruise; ask about other options when booking.<\/li> <li>Where do we pick up the boat?<br/>At one of Northaire's three private docks (resort, Torch Lake, or Bellaire)—not public ramps. Confirm your dock before heading out.<\/li> <li>Can we bring our own food and drinks?<br/>Absolutely—coolers, snacks, and beverages are welcome on board.<\/li> <li>What are the rental hours?<br/>Pick-up begins at 9 AM and boats are due back by 7 PM; early pick-up is available for an hourly fee.<\/li> <li>How far is it to the Torch Lake Sandbar?<br/>The sandbar is at the south end of Torch Lake; from Clam Lake you'll head out the Clam River into Torch Lake and cruise south.<\/li> <\/ul>", "photo": "370ebbe78cf84a296ce3187edee5b181.jpg", "loc": [44.931543, -85.260213], "pin": "boating", "id": "northaire-resort-pontoon-rentals"}, {"title": "Sun Life Torch River Marina — Tritoon & Ski Boat Rentals", "html": "<p>Website: <a href=\"https://www.sunlifetorchriver.com\">https://www.sunlifetorchriver.com<\/a> <br/>Phone: (231) 322-4495<br/>Location Guide: 12906 Cherry Ave, Rapid City, MI 49676 — on the Torch River, right by the Torch Lake sandbar - about 25 minutes' drive from Bellaire<br/>Season: April 15–October 31, open daily 9 a.m.–5 p.m. (closed November–April)<\/p> <p>Nestled on the Torch River with direct access to the famous Torch Lake sandbar, Sun Life Torch River Marina offers tritoon and ski boat rentals in a stunning setting. With well-maintained boats, slips, a ship's store and full marina services, they cater to both casual cruisers and watersports fans. Launch your adventure right to the iconic turquoise waters and sandbar—the perfect backdrop for a memorable lake day!<\/p> <p>FAQs:<\/p> <ul> <li>Do boats come with a captain?<br/>Rentals are self-drive; staff provide an orientation before launch.<\/li> <li>Do I need a boating license?<br/>Michigan requires a boater safety certificate for anyone born on or after July 1, 1996 to operate a motorboat.<\/li> <li>Is a reservation recommended?<br/>Absolutely—especially during the summer, when popular boats book quickly.<\/li> <li>Where do I return the boat?<br/>Back to the marina's docks, where staff can help with docking.<\/li> <\/ul>", "loc": [44.849857, -85.329834], "pin": "boating", "photoHidden": "9bcbbe3f75c9e88708dfb94a4588464d.jpg", "id": "sun-life-torch-river-marina-tritoon-ski-boat-rentals"}, {"title": "Torch Lake Sunset Cruises", "html": "<div> <p>Website: <a href=\"https://www.northaireresort.com/sunset-cruises\">https://www.northaireresort.com/sunset-cruises<\/a> <br/>Phone: (231) 377-7764<br/>Location: Departs from the Clam River right by Dockside Restaurant, Old Torch Lake Dr, Bellaire, MI<br/>Tour Duration: 2 hours<br/>Price: $75 per person (2-person minimum)<br/>Captain Provided: Yes – licensed captain included<\/p> <hr/> <p>Treat yourself to a magical evening on Torch Lake with a <strong>2-hour, captained sunset cruise<\/strong> run by Northaire Resort. Your captain will take you from the Clam River out to Torch Lake's stunning blue expanse as the sun dips into the horizon. Bring your own beverages and snacks—a cooler full of ice is provided.<\/p> <p>Perfect for couples, families, or small groups, this stress-free experience is all about unwinding and soaking in one of the most beautiful sunsets in the Midwest. No boating experience needed—just show up and enjoy!<\/p> <p>FAQs<\/p> <ul> <li>Do we need boating experience?<br/>Not at all! A licensed captain does all the driving—just relax and enjoy.<\/li> <li>Can we bring drinks and snacks?<br/>Yes! Bring your favorites—a cooler full of ice is provided.<\/li> <li>How long is the cruise?<br/>About 2 hours; the start time depends on sunset and is set when you book.<\/li> <li>Where do we board the boat?<br/>On the Clam River right by Dockside Restaurant, near Torch Lake.<\/li> <li>Is this good for groups?<br/>Yes! It's ideal for couples, families, or small parties looking to unwind together.<\/li> <\/ul> <\/div>", "photo": "05a702474bb89735321cdfd1e8d8f58d.jpg", "loc": [44.9427, -85.2837], "pin": "boating", "id": "torch-lake-sunset-cruises"}, {"title": "Vacation Water Sports", "html": "<p>Website: <a href=\"https://www.vacationwatersports.com/\">https://www.vacationwatersports.com/<\/a> <br/>Phone: (231) 350-8745<\/p> <p><em>Delivery-based — serving Torch Lake (Alden), Clam Lake, Lake Bellaire, Intermediate Lake (Central Lake) &amp; Elk Lake (Elk Rapids)<\/em><br/>Season: Mid-May through late September (2026: May 15–Sept 27)<\/p> <p>Experience lake freedom with Vacation Water Sports—a rental outfitter that delivers jet skis and pontoons to drop-off locations around the Chain of Lakes, so you can start your adventure without towing a thing. Whether you're chasing thrills on a jet ski or cruising Lake Bellaire and Torch Lake in comfort, their daily and multi-day rentals make boat days effortless and fun.<\/p> <p>FAQs<\/p> <ul> <li>Will they deliver near our rental?<br/>They deliver to set drop-off locations on the lakes they serve; other locations may be available on request (extra charge may apply)—call to arrange.<\/li> <li>Can we rent for multiple days?<br/>Yes—1 to 10 day rentals; a 3-day minimum applies July 3–Aug 16 (holiday rates; no refunds for 4th of July week).<\/li> <li>What lakes do they service?<br/>Torch Lake, Clam Lake, Lake Bellaire, Intermediate Lake &amp; Elk Lake.<\/li> <li>How long is a one-day rental?<br/>8 hours. Tubes for pontoons are free; fuel is charged at marina rates.<\/li> <li>Any rules to know?<br/>No pets, and boat capacity limits are strictly enforced. Waivers are completed online for each driver/rider.<\/li> <\/ul>", "photo": "2713fb6ff5ea609e86a134bd877031e4.jpg", "loc": [45.019842, -85.184155], "pin": "boating", "id": "vacation-water-sports"}]}, {"title": "Boat Tours", "items": [{"title": "Charters North – Captain Shaun’s Custom Cruises", "html": "<p>Website: <a href=\"https://chartersnorth.com\">https://chartersnorth.com<\/a> <br/>Phone: (231) 590-1949 (call or text)<br/>Pick-Up: Torch Lake pickups at Butch's Bait &amp; Tackle, Dockside, or Eastport (confirmed at booking)<br/>Distance: Butch's and Dockside are ~15 minutes from Bellaire<\/p> <p>Take your vacation to the next level with fully captained boat adventures by Captain Shaun — a local pro, born and raised on Torch Lake, with 30+ years fishing its waters. From fishing excursions to relaxing sandbar cruises, you're in for a custom-tailored experience that's fun, safe, and unforgettable.<\/p> <p><strong>FAQ Highlights:<\/stro
