ng><br/>Captain included | Bring your own snacks &amp; drinks | Custom cruise options | Pickup at Torch Lake docks | No license needed<\/p> <p><em><strong>Trip Options:<\/strong><\/em><\/p> <ul> <li>Salmon &amp; Trout Troll: Cruise deep waters of Torch and Elk Lake for lake trout, Atlantic salmon, steelhead and brown trout.<\/li> <li>Night Walleye Troll: Experience the lake under the stars while chasing walleye.<\/li> <li>Smallmouth Bass Casting: Their most active trip—cast (or troll) for smallmouth, pike and musky with expert guidance.<\/li> <li>Fall Perch Fishing: Offered October–December when jumbo perch school up.<\/li> <li>Custom Cruises: A day at the sandbar, sunset cruise, nature tour—Captain Shaun creates your perfect day on the water.<\/li> <li>Fish &amp; Sandbar Package: A full 8-hour day for up to 6 people—fish in the morning, then unwind at Torch Lake's famous sandbar.<\/li> <\/ul> <p><strong><em>More Details:<\/em><\/strong><\/p> <ul> <li>Captain Provided: Yes — all trips are fully captained and guided.<\/li> <li>Bring Your Own: Snacks and beverages welcome—cooler full of ice and bottled water provided.<\/li> <li>Groups: Custom Cruises and the Fish &amp; Sandbar package are great for relaxed group trips or sunset gatherings.<\/li> <li>Boating License: Not required—Captain Shaun handles all operations. Anglers need a Michigan fishing license.<\/li> <li>What to Bring: Comfortable clothes, rain gear, sun protection, food and drinks. Fish cleaning and packaging are included free on fishing trips.<\/li> <\/ul>", "photo": "118f8502b91c601b91d5b4d950d441aa.jpg", "loc": [44.9427, -85.2837], "pin": "boating", "id": "charters-north-captain-shauns-custom-cruises"}, {"title": "Foxy’s Custom Cruises – “Ahoy Matey!”", "html": "<p>Website: <a href=\"https://www.foxyscustomcruises.com\">https://www.foxyscustomcruises.com<\/a> <br/>Phone: (231) 944-6823 (text Capt. Foxy for dates and times)<br/>Dock: Clam River Marina, 6349 Old Torch Lake Dr, Bellaire, MI — dock #22 (follow signs to Dockside Restaurant; don't park in Dockside's lot)<\/p> <p>Celebrate in style with Foxy's Custom Cruises—fully guided, private Torch Lake cruises led by Coast Guard–certified Captains Foxy and Rob. Choose from packages like the Sandbar Splash Day, Sunday Funday, Torch Lake Tour, Fun in the Sun, or a Bachelorette Party cruise. Enjoy music, drinks, and a lively atmosphere on Torch Lake's crystal-clear waters!<\/p> <p>FAQs:<\/p> <ul> <li>Captain provided? Yes, a certified captain pilots every cruise.<\/li> <li>Alcohol allowed? Coolers and snacks are welcome aboard.<\/li> <li>Group size? Up to 6 passengers, with up to 4 more added for an extra fee (10 max).<\/li> <li>Bachelor/bachelorette parties? Yes—there's a dedicated bachelorette package and custom cruises for groups.<\/li> <li>Kids? Bring your own life jackets for children 3 and under.<\/li> <li>Boating license needed? No, captain included.<\/li> <\/ul>", "photo": "50275bb5744630c646f599567c2b1314.jpg", "loc": [44.942928, -85.281867], "pin": "boating", "id": "foxys-custom-cruises-ahoy-matey-2"}, {"title": "Northaire Resort & Pontoon Rentals (Captained Options Available)", "html": "<p>Website: <a href=\"https://www.northaireresort.com\">https://www.northaireresort.com<\/a> <\/p> <p>Phone: (231) 377-7764<\/p> <p>Resort &amp; Clam Lake Dock: 7067 Crystal Springs Rd, Bellaire, MI (south shore of Clam Lake, ~15 minutes' drive from downtown Bellaire)<\/p> <p>Other Pick-Up Docks: Northaire also has private docks on Torch Lake and in Bellaire—your dock location is confirmed before your trip<\/p> <p>Hours: Boat pick-up from 9 a.m., return by 7 p.m. (early pick-up available for a fee)<\/p> <hr/> <p>Experience northern Michigan's shimmering Chain of Lakes with ease and comfort. Northaire's expansive pontoon fleet features spacious, well-maintained boats. Enjoy Bluetooth stereo, GPS depth finder, ladders, bimini tops, and a tow bar for tubing. Begin your journey on Clam Lake, cruise to the turquoise sandbar on Torch Lake, and explore scenic coves and the Grass River. Ideal for bridal showers, bachelor parties, family escapades, or sunset soirees! Jet skis (Torch Lake location), tubes, lily pads and porta-potties are also available to rent.<\/p> <hr/> <p>FAQs<\/p> <ul> <li>Captain Provided? Their 2-hour sunset cruise includes a licensed captain; ask when booking about captained options.<\/li> <li>Is alcohol allowed? Yes! BYOB welcome (please enjoy responsibly).<\/li> <li>Are small parties allowed? Absolutely—great for celebrations and group outings.<\/li> <li>Where do guests board? At one of Northaire's three private docks (resort, Torch Lake, or Bellaire)—not public boat ramps. Double-check your dock before heading out.<\/li> <li>Boating license needed? Michigan requires anyone born on or after July 1, 1996 to have a boater safety certificate to operate a motorboat; ask Northaire about requirements when booking.<\/li> <\/ul> <p>What important tips? <\/p> <ul> <li>Arrive 15 minutes early for check-in and orientation.<\/li> <li>Bring sunscreen, snacks, and a favorite playlist.<\/li> <li>Consider renting an onboard porta-potty for larger groups.<\/li> <li>Practice no-wake speed in shallow zones like the Grass River.<\/li> <\/ul>", "photo": "5c7a4a2ccccdf70e29d2fdf49d698fc1.jpg", "loc": [44.931543, -85.260213], "pin": "places_to_stay", "id": "northaire-resort-pontoon-rentals-captained-options-available"}, {"title": "Torch Lake Sunset Cruises", "html": "<div> <p>Website: <a href=\"https://www.northaireresort.com/sunset-cruises\">https://www.northaireresort.com/sunset-cruises<\/a> <br/>Phone: (231) 377-7764<br/>Location: Departs from the Clam River right by Dockside Restaurant, Old Torch Lake Dr, Bellaire, MI<br/>Tour Duration: 2 hours<br/>Price: $75 per person (2-person minimum)<br/>Captain Provided: Yes – licensed captain included<\/p> <hr/> <p>Treat yourself to a magical evening on Torch Lake with a <strong>2-hour, captained sunset cruise<\/strong> run by Northaire Resort. Your captain will take you from the Clam River out to Torch Lake's stunning blue expanse as the sun dips into the horizon. Bring your own beverages and snacks—a cooler full of ice is provided. Departure times vary with sunset and are set when you book.<\/p> <p>Perfect for couples, families, or small groups, this stress-free experience is all about unwinding and soaking in one of the most beautiful sunsets in the Midwest. No boating experience needed—just show up and enjoy!<\/p> <\/div>", "photo": "b5489bed10331fccbc806b3d004b87a0.jpg", "loc": [44.942899, -85.283568], "pin": "boating", "id": "torch-lake-sunset-cruises-2"}]}, {"title": "Kayaks / Tubes / Paddleboard Rentals", "items": [{"title": "Alden Outfitters — Kayak & Paddleboard Rentals for Torch Lake Adventures", "html": "<p>Location: 10520 Coy St, Alden, MI 49612 — on Torch Lake in downtown Alden, about 15 minutes' drive from Bellaire<br/>Phone: (231) 331-6979<\/p> <p>Set off on an adventure with Alden Outfitters, a small shop in Alden offering kayak and paddleboard rentals for exploring the pristine waters of Torch Lake. Whether you're paddling solo or sharing the fun with friends, glide across the crystal-clear lake and take in breathtaking views just a short drive from Bellaire.<\/p> <p>Guest Tips:<\/p> <ul> <li>Call ahead to confirm rentals and hours—the shop keeps limited, seasonal hours.<\/li> <li>No boating license needed for kayaks or paddleboards.<\/li> <li>Be sure to bring sunscreen, water, and a hat for sunny days on the lake.<\/li> <\/ul>", "photo": "b83950e12fbf0a5016aa46d59d6c9d6d.jpg", "loc": [44.880863, -85.276816], "pin": "retail_therapy", "id": "alden-outfitters-kayak-paddleboard-rentals-for-torch-lake-adventures"}, {"title": "Butch's Torch Lake (Tackle & Marine)", "html": "<p>Website: <a href=\"https://butchstorchlake.com\">https://butchstorchlake.com<\/a> <\/p> <p>Phone: (231) 377-6787<\/p> <p>Location: 6235 Crystal Springs Rd, Bellaire, MI 49615 — on the east shore of Torch Lake, approximately 7 miles from downtown Bellaire<\/p> <p>Hours: Summer, Sun–Fri 9 a.m.–8 p.m., Sat 9 a.m.–9 p.m.; call ahead for off-season hours<\/p> <p>Your launch point to Torch Lake adventure! Butch's is a one-stop shop for everything water — single and tandem kayaks, paddleboards, waverunners, speedboats and tritoons, plus boat fuel, a deli famous for broasted chicken, cold drinks and Up North gifts. Located right on the lake, it's easy to rent and launch in one smooth step.<\/p> <p>Whether you're a laid-back paddler or looking to turn up the fun, Butch's puts you right where you want to be — on the iconic, crystal-clear waters of Torch Lake.<\/p> <p>FAQs:<\/p> <ul> <li>Do I need a reservation? Highly recommended for waverunners and tritoons, especially June–August. Book online or call.<\/li> <li>Do they provide life jackets? Yes — life vests are included with waverunner rentals; ask about other rentals.<\/li> <li>Can I rent for a full day? Yes — tritoons rent by the day; waverunners by 2 hours, half day or full day.<\/li> <li>Is parking available? Yes, free parking on site.<\/li> <li>Do they have waverunners too? Yes! Great for thrill-seekers.<\/li> <\/ul>", "photo": "7b20d872ecedddab73df777551d41a08.jpg", "loc": [44.941922, -85.283674], "pin": "kayaking", "id": "butchs-torch-lake-tackle-marine"}, {"title": "Chain O' Lakes Campground & Cabins", "html": "<p>Website: <a href=\"https://www.chainolakescamp.com\">https://www.chainolakescamp.com<\/a> <br/>Phone: (231) 533-8432<br/>Location: 7231 S M-88, Bellaire, MI 49615 — about 8 minutes south of downtown Bellaire<\/p> <p>Chain O' Lakes Campground is a family-owned campground with RV sites, tent sites, cabins, a pool and a play area for kids, close to the Chain of Lakes. The campground itself is not on the water, but it's a convenient base for boaters and paddlers: the first boat/trailer parks free, and public launches on Lake Bellaire, Clam Lake and Torch Lake are a short drive away.<\/p> <p>FAQs:<\/p> <ul> <li>Can I launch a kayak here? No—the campground has no lake frontage. Use a nearby public launch such as Bellaire's Ohio Street or River Street launches.<\/li> <li>Are rentals available? Not onsite—see the kayak and boat rental listings in this guide.<\/li> <li>Is there boat parking? Yes—first boat/trailer free, each additional trailer $25/day.<\/li> <li>Are restrooms available? Yes, as part of the campground amenities.<\/li> <\/ul>", "photo": "db17908590bc7f4197ff364bb9ef130e.jpg", "loc": [44.9261, -85.1856], "pin": "kayaking", "id": "chain-o-lakes-campground-cabins"}, {"title": "Grass River Natural Area — Kayaking & Nature Escape", "html": "<p>Website: <a href=\"https://www.grassriver.org/\">https://www.grassriver.org/<\/a> <br/>Phone: (231) 533-8576 (Grass River Center)<br/>Location Guide: 6500 Alden Hwy, Bellaire, MI 49615 - About 10 minutes' drive from downtown Bellaire<br/>Hours: Trails open daily, dawn to dusk; Grass River Center open daily 10 a.m.–4 p.m. May–October (weekends Nov–Apr)<\/p> <p>Immerse yourself in nature at Grass River Natural Area, a 1,500-acre preserve perfect for kayaking and wildlife viewing. Paddle the calm Grass River framed by forests and wetlands and spot local wildlife in their natural habitat. Kayak rentals are available seasonally, letting you explore on your own, or join a guided kayak tour to learn about the area's rich ecology.<\/p> <p>Guest Tips:<\/p> <ul> <li>Kayak rentals are available June through September and must be reserved in advance by phone.<\/li> <li>Rentals run during Center hours (10 AM–4 PM) and leave from the Grass River Overlook; kayaks must be back by 4 PM. About $30 for 2–3 hours or $50 for 4–6 hours.<\/li> <li>Only six single kayaks (no tandems), for adults and teens only.<\/li> <li>Wear comfortable, water-friendly footwear and bring insect repellent.<\/li> <li>Don't miss the boardwalk trails—dogs are allowed on-leash only on the Rail and Algonquin trails, not the boardwalks.<\/li> <\/ul>", "photo": "7bea65bee242293081d253a2d4b5a7b8.jpg", "loc": [44.902977, -85.21816], "pin": "kayaking", "id": "grass-river-natural-area-kayaking-nature-escape"}, {"title": "PlayNorth Watersports", "html": "<p>Website: <a href=\"https://playnorthwatersports.com\">https://playnorthwatersports.com<\/a> <br/>Phone: (231) 357-3790<br/>Location: Based in Lake Leelanau, MI — delivery-based; Torch Lake, Elk Lake and Skegemog Lake are in their delivery area (location-based delivery fee)<\/p> <p>Want a boat or paddleboard dropped off on Torch Lake? PlayNorth Watersports delivers pontoons, tritoons, jet skis, ski boats and stand-up paddleboards to lakes across northwest Michigan, including Torch Lake. Bookings are by reservation only, and the delivery fee depends on your location.<\/p> <p>Perfect for groups or families who want a hassle-free day on the water without hauling gear.<\/p> <p>FAQs:<\/p> <ul> <li>Do I have to pick it up? No — they deliver to your launch spot or property on the lakes they serve.<\/li> <li>Is there a delivery fee? Yes, it varies by location and is shown when you reserve.<\/li> <li>Do they deliver to Lake Bellaire or the upper Chain of Lakes? Not listed on their site—ask when booking.<\/li> <li>How do I book? Online through their website or by phone; reservations required.<\/li> <\/ul>", "photo": "d70d131df5aa5aaf5e4d45e9c1a64add.jpg", "loc": [44.977086, -85.209695], "pin": "kayaking", "id": "playnorth-watersports"}, {"title": "Riverside Marina — Paddle Through Bellaire’s Peaceful Riverways", "html": "<p>Website: <a href=\"https://riverside-marina.com\">https://riverside-marina.com<\/a> <br/>Phone: (231) 533-8559<br/>Location: 115 W Cayuga St, Bellaire, MI 49615 — walking distance from downtown<\/p> <p>Located in the heart of Bellaire, Riverside Marina offers effortless access to the Intermediate River and the Chain of Lakes. With kayak and canoe rentals (and pontoons and fishing boats), you can cruise at your own pace and soak in the natural beauty around every bend. It's peaceful, relaxing, and just steps from downtown.<\/p> <p>Perfect for couples, families, or solo explorers, this local gem brings you closer to nature without even leaving town.<\/p> <p>FAQs:<\/p> <ul> <li>Do I need to reserve in advance? Calling ahead is a good idea, especially on weekends.<\/li> <li>Can I bring the kids? Yes! It's family-friendly with supervision.<\/li> <li>Is gear included? Life vests are provided—confirm details when you call.<\/li> <li>Are group outings possible? Definitely — just call to coordinate.<\/li> <li>Where do I launch? Right from the marina on the Intermediate River.<\/li> <\/ul>", "loc": [44.975166, -85.212915], "pin": "kayaking", "photoHidden": "ccc129c5fb2fef43a93b42b222a5ad37.jpg", "id": "riverside-marina-paddle-through-bellaires-peaceful-riverways"}]}]}, "weather": {"id": "weather", "title": "Weather", "icon": "cloud-sun-rain", "groups": [{"title": "", "items": [{"title": "Bellaire", "html": "<p>For the most up-to-date weather forecast check <a href=\"https://weather.com/weather/today/l/9ef10070b44a80add2d04570e360045d93fc15a628d2fd437d537b3a25ad1006\">here<\/a>!<\/p> <p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say \"There is no such thing as bad weather, just inappropriate clothing\".<\/p>", "photo": "de97f9f60bbe88efa21f12f50ede943f.jpg", "id": "bellaire"}]}]}, "shanty-creek": {"id": "shanty-creek", "title": "Shanty Creek Resort", "icon": "star", "groups": [{"title": "Beach Club", "items": [{"title": "Beach Club – Lake Bellaire (Private Access)", "html": "<p><strong>Designed exclusively for resort guests<\/strong>, Shanty Creek’s <strong>private Beach Club<\/strong> sits on the shores of beautiful <strong>Lake Bellaire<\/strong>, offering around <strong>200 feet of sandy shoreline<\/strong> and a serene swim area that’s ideal for families and couples alike. <\/p> What You’ll Find <ul> <li><strong>Sandy beach &amp; loungers<\/strong> for sunbathing and relaxation<\/li> <li><strong>Designated swim zone<\/strong> for safe, shallow water play<\/li> <li><strong>Kayak and paddleboard rentals<\/strong> available nearby<\/li> <li>Easy access to <strong>restrooms and picnic facilities<\/strong>, plus <strong>grill areas<\/strong><\/li> <li>Perfect proximity to nearby resort amenities—dining, tennis, fitness &amp; entertainment are all just a short walk away <\/li> <\/ul> Location <ul> <li>Situated on <strong>Lake Bellaire<\/strong>, just a few minutes from Summit Village<\/li> <li>Close to dining and shopping options, including <strong>Short’s Brewing<\/strong> in downtown Bellaire (~3 minutes away) <\/li> <\/ul> Why You’ll Love It <ul> <li>A private, peaceful escape with <strong>crystal-clear waters and shimmering lake views<\/strong><\/li> <li>Buffer from crowds → relaxing space for unwinding<\/li> <li><strong>Splendid sunsets and water views<\/strong> — perfect for low-key evenings<\/li> <\/ul> <p><strong>Access<\/strong>: Only available to registered <strong>Shanty Creek lodging guests<\/strong>.<br/>More info: <a href=\"https://www.shantycreek.com/\">https://www.shantycreek.com/<\/a> <\/p>", "photo": "c951f9ea3d91e7078a02733bd0a68f8d.jpg", "id": "beach-club-lake-bellaire-private-access"}]}, {"title": "Golf", "items": [{"title": "Cedar River", "html": "<p>“...a pleasure to play and a beauty to experience.” Cedar River’s glacial-carved canvas was perfect for famed course architect Tom Weiskopf to design this masterpiece.<\/p> <p>Among \"America’s Top 100 Resort Courses\" in <em>Golf Week<\/em> and the “Top 1,000 Courses in the World” by Rolex. Along with The Legend, Cedar River is listed among Michigan’s Top 20 Public Courses according to <em>Golf Magazine<\/em>.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2026/06/2026-Scorecard-Cedar-River.pdf\">Cedar River Scorecard<\/a><\/p><p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Cedar River Tee Times<\/a> or call <a href=\"tel:2315332020\">231-533-2020<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "3a65057f0704d2a7c580ae28871d9bcb.jpg", "loc": [44.946402, -85.139625], "pin": "golfing", "id": "cedar-river"}, {"title": "Foot & Disc Golf", "html": "<p>Mix the skills of soccer or disc golf with the scoring of golf, and you get a fun new way to bring the whole family to the links. Shanty Creek has an exclusive 9-hole Foot & Disc Golf course with hybrid basket cups. The goal, like golf, is the fewest shots from tee to hole.<\/p><p>Ready to play? $12 includes a ball or disc. To make a tee time, call <a href=\"tel:2315332020\">231-533-2020<\/a>.<\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/golf/golf-2-0/#footgolf\">https://www.shantycreek.com/golf/golf-2-0/#footgolf<\/a><\/p>", "photo": "957a11a6d0fad7fba9161e7ecdfb9228.jpg", "id": "foot-disc-golf"}, {"title": "Hawk's Eye", "html": "<p>“...the perfect complement to Cedar River and The Legend.”<\/p> <p>Adding to Shanty Creek's golf reputation, this John Robinson design features incredible vistas, water hazards on 9 of 18 holes, and putting greens to challenge golfers of all levels. Named among \"Michigan's Top Courses\" from <em>Golf Advisor<\/em> and the “Top 25 Course Layouts in the US.\"<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2026/06/2026-Scorecard-Hawks-Eye.pdf\">Hawk's Eye Scorecard<\/a><\/p><p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Hawk's Eye Tee Times<\/a> or call <a href=\"tel:2315332020\">231-533-2020<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "afe1376f7f54d0a9766458a5a618ee80.jpg", "loc": [44.957608, -85.149122], "pin": "golfing", "id": "hawks-eye"}, {"title": "The Legend", "html": "<p><em>by Arnold Palmer<\/em><\/p> <p>The Legend's reputation has been built on multiple elevation changes, doglegs, water hazards, and well-placed traps. Its setting includes views of Lake Bellaire and the actual Shanty Creek trickles through your round.<\/p> <p>Arnold Palmer helped introduce northern Michigan golf to the world when <em>Golf Magazine<\/em> named it among the “Top Resort Courses” in the US. 4½ stars from <em>Golf Digest<\/em>.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2026/06/2026-Scorecard-The-Legend.pdf\">The Legend Scorecard<\/a><\/p><p><a href=\"https://www.shantycreek.com/golf/tee-times/\">The Legend Tee Times<\/a> or call <a href=\"tel:2315332020\">231-533-2020<\/a><\/p> <p><strong>Closed Wednesdays and Thursdays<\/strong><\/p>", "photo": "001fbace61907319986cd00cfc4f155e.jpg", "loc": [44.948824, -85.185338], "pin": "golfing", "id": "the-legend"}, {"title": "Schuss Mountain", "html": "<p>Schuss Mtn delivers a challenge for even the most accomplished golfers. Par eludes many throughout 7,013 yards of pine-dotted forests, wetlands, and rolling hills.<\/p> <p>Playing like two distinct 9-hole courses, the front doglegs through pine forests on a flat pitch. Then on the back, play jumps up and down the rolling hills of Antrim County delivering an overall exciting golf experience made only better by our crew's tremendous care to its course conditions.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2026/06/2026-Scorecard-Schuss.pdf\">Schuss Mountain Scorecard<\/a><\/p><p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Schuss Mountain Tee Times<\/a> or call <a href=\"tel:2315332020\">231-533-2020<\/a><\/p> <p><strong>Closed Mondays and Tuesdays<\/strong><\/p>", "photo": "602ddd329452c93d226c374e898538ce.jpg", "loc": [44.940355, -85.133287], "pin": "golfing", "id": "schuss-mountain"}, {"title": "Summit", "html": "<p>“...an under-appreciated gem.” While length is not a factor, Summit forces accomplished golfers to test their short game. Precise landings and fast, challenging greens will make you earn your score.<\/p> <p>A Par Three tee box on every hole gives junior golfers a fun (and less intimidating!) way to develop their game.<\/p> <p><a href=\"https://www.shantycreek.com/wp-content/uploads/2026/06/2026-Scorecard-Summit.pdf\">Summit Scorecard<\/a><\/p><p><a href=\"https://www.shantycreek.com/golf/tee-times/\">Summit Tee Times<\/a> or call <a href=\"tel:2315332020\">231-533-2020<\/a><\/p> <p><strong>Closed Wednesdays and Thursdays<\/strong><\/p>", "photo": "2f2ca69030981a6a08f7a2f863d01393.jpg", "loc": [44.948824, -85.185338], "pin": "golfing", "id": "summit"}]}, {"title": "Lakeview Hotel", "items": [{"title": "The Lakeview Hotel", "html": "<p>Enjoy the heart of <strong>Summit Village<\/strong> at the <strong>Lakeview Hotel<\/strong>, perched above Lake Bellaire with views for miles. Even if you're not staying at the hotel, it's the resort's hub for dining, pools, and events.<\/p><p><strong>Dining<\/strong><\/p><ul><li><strong>The Lakeview<\/strong> – bar and grill fare with sunset views over Lake Bellaire. Breakfast daily 7–11am; lunch daily 11:30am–4pm; dinner Sun–Thu 5–9pm, Fri–Sat 5–10pm; bar opens daily at 11:30am; happy hour daily 5–6:30pm.<\/li><li><strong>CoffeeBAR<\/strong> (proudly serving Starbucks) – in the Great Room lobby. Sun–Thu 7am–2pm, Fri–Sat 7am–6pm.<\/li><\/ul><p><strong>Pools<\/strong><\/p><ul><li>Your pool pass covers the Lakeview <strong>indoor pool<\/strong> (open daily 9am–11pm) and the seasonal <strong>outdoor pool<\/strong>. Bring the towels we provide with your pool pass (the resort does not supply them).<\/li><\/ul><p><strong>Nearby in Summit Village<\/strong><\/p><ul><li>Tennis courts, the children's playground, and The Legend and Summit golf courses<\/li><li>Alpine tubing and Snow Glide Tours in winter<\/li><\/ul><p><strong>Address:<\/strong> 5780 Shanty Creek Road, Bellaire, MI 49615<br><strong>Phone:<\/strong> <a href=\"tel:2315333000\">231-533-3000<\/a><\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/dining/\">https://www.shantycreek.com/stay/dining/<\/a><\/p>", "photo": "833938ce33d91e10342aba3d085e7853.jpg", "id": "the-lakeview-hotel"}]}, {"title": "Summer Activities", "items": [{"title": "After Dark | Outdoor Movies + Stargazing", "html": "<p>When the sun goes down, the fun doesn’t stop at Shanty Creek.<\/p><p><strong>Outdoor Movies on the Mountain<\/strong><br>On select summer <strong>Saturday nights<\/strong>, the resort has hosted <strong>family-friendly outdoor movies<\/strong> atop Summit Mountain. Check the <a href=\"https://www.shantycreek.com/events/\">events calendar<\/a> or ask the front desk for upcoming dates.<\/p><p><strong>Stargazing in Northern Michigan<\/strong><br>Clear skies bring out a whole new show: <strong>the stars<\/strong>. Far from city lights, Shanty Creek is a great place to spot constellations, shooting stars, and if you're lucky, the <strong>Northern Lights<\/strong>.<\/p><p><strong>Tip:<\/strong> Dress warm and bring a thermos. Even summer nights can get cool at the top.<\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "72d8677d9180c4acba1ee7869602e0a2.jpg", "id": "after-dark-outdoor-movies-stargazing"}, {"title": "Biking", "html": "<p>Antrim County is a cyclist’s dream, whether you prefer the road or rugged trails.<\/p><ul><li><strong>Road Biking<\/strong>: Ride the quiet, rolling hills and scenic byways with minimal traffic and stunning views.<\/li><li><strong>Mountain Biking<\/strong>: Explore Glacial Hills, one of Michigan’s premier trail systems with loops for all skill levels.<\/li><li><strong>E-Bike Rentals<\/strong> (summer season): New to biking or want help with the hills? Rent a <strong>motor-assisted e-bike<\/strong> from the Summit Fitness Center: 6 hours $65, 12 hours $132. Pick-up 9am–5pm; call <a href=\"tel:2315337060\">231-533-7060<\/a>.<\/li><li><strong>Traditional Bikes<\/strong> are also available for cruising around the resort.<\/li><\/ul><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/fitness-center/\">https://www.shantycreek.com/stay/fitness-center/<\/a><\/p>", "photo": "51457c9f6e73826b9612cfba35fb5f7e.jpg", "id": "biking"}, {"title": "Boating", "html": "<p>There’s nothing like being on the water—and Antrim County’s Chain of Lakes delivers it all.<\/p> <p>Whether you're:<br/>• <strong>Splashing on the sandbar<\/strong> with friends<br/>• <strong>Water skiing<\/strong> or wakeboarding<br/>• <strong>Kayaking or paddling<\/strong> down peaceful rivers<br/>• <strong>Fishing<\/strong> for bass and walleye<\/p> <p>This 75-mile waterway system connects lakes and rivers perfect for boating adventures, relaxation, and fun in the sun.<\/p> <p>Bring your own boat or rent locally—just get out there and enjoy northern Michigan’s freshwater paradise!<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "e6e66612a8709673d2a47b2eeb3df52b.jpg", "id": "boating"}, {"title": "Children’s Play Area – Summit Village", "html": "<p><strong>Fun for the little ones (and a peaceful break for you!)<\/strong><br>Located near <strong>The Lakeview Hotel and Summit Fitness Center<\/strong>, the <strong>Summit Village children&rsquo;s playground<\/strong> offers a welcome spot for kids to let off energy while parents relax.<\/p> <p><strong>What to Expect:<\/strong><\/p> <ul> <li>Nature-inspired play equipment including slides, climbing structures, and open space<\/li> <li>Shaded areas perfect for little explorers<\/li> <li>Close to amenities like restrooms, dining, and the fitness center<\/li> <li>Ideal for combined family time&mdash;kids can play while you plan your next adventure<\/li> <\/ul> <p>This playground is especially handy when visiting the <strong>Lodge<\/strong> or staying in <strong>Summit Village lodging<\/strong>.<\/p>", "photo": "0e0336e812ac15e5683adb819697f137.jpg", "id": "childrens-play-area-summit-village"}, {"title": "Disc Golf at Summit Golf Club", "html": "<p>Get outside and enjoy a fun, casual round on Shanty Creek’s <strong>9-hole Disc Golf &amp; Foot Golf course<\/strong> at <strong>Summit Golf Club<\/strong> in Summit Village.<\/p><p>Perfect for families, beginners, or seasoned disc golfers looking for a relaxed round with a view. It’s a great way to enjoy the outdoors while getting in some light activity.<\/p><p>Discs, scorecards, and course maps are available at the <strong>Summit/Legend Pro Shop<\/strong>. $12 includes a disc. To make a tee time, call <a href=\"tel:2315332020\">231-533-2020<\/a>.<\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/golf/golf-2-0/#footgolf\">https://www.shantycreek.com/golf/golf-2-0/#footgolf<\/a><\/p>", "photo": "c93370054a72189d88f08304f1a115ad.jpg", "id": "disc-golf-at-summit-golf-club"}, {"title": "Go Outside and Play", "html": "<p>Unplug, unwind, and get active with a variety of outdoor games around the resort. Whether you’re looking for a friendly match or a spontaneous showdown, there’s something for everyone.<\/p> <p>Try your hand at:<br/>• A quick game of <strong>H-O-R-S-E<\/strong> on the basketball court<br/>• <strong>Sand volleyball<\/strong> under the summer sun<br/>• A match of <strong>badminton<\/strong> or <strong>shuffleboard<\/strong><br/>• Laid-back fun with <strong>bocce ball<\/strong>, <strong>tetherball<\/strong>, or <strong>wiffle ball<\/strong><br/>• Or hit the <strong>tennis courts<\/strong> for something more competitive<\/p> <p>Most equipment is available on-site—just show up and play!<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "d28e869a3ad34736db5aec01d192ab41.jpg", "id": "go-outside-and-play"}, {"title": "Hiking", "html": "<p>Looking for a scenic workout? Shanty Creek offers hiking experiences for every pace and preference:<\/p><ul><li><strong>Schuss Mountain Trails<\/strong> – Tackle a summertime climb for a rewarding hike with panoramic views of northern Michigan.<\/li><li><strong>Grass River Natural Area<\/strong> – Just a short drive away, this network of trails winds through forests, wetlands, and along the water’s edge. It's perfect for peaceful nature walks and wildlife spotting.<\/li><\/ul><p>Whether you're in it for fitness or fresh air, these trails highlight the natural beauty of the region.<\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "c3e5927406029dcd1ca81fb675555753.jpg", "id": "hiking"}, {"title": "Lawn Games", "html": "<p>Let’s Play! Summer days at Shanty Creek are perfect for some classic fun on the lawn.<\/p> <p>Challenge friends and family with traditional favorites and supersized fun:<\/p> <p>• <strong>Horseshoes<\/strong><br/>• <strong>Croquet<\/strong><br/>• <strong>Bean Bag Toss<\/strong><br/>• <strong>Ladder Ball<\/strong><br/>• <strong>Washer Toss<\/strong><br/>• <strong>Giant Checkers<\/strong><br/>• <strong>Giant Jenga<\/strong><br/>• <strong>Giant Dominos<\/strong><br/>• <strong>Lawn Yahtzee<\/strong><\/p> <p>For game info and equipment, stop by the <strong>Summit Fitness Center<\/strong> in Summit Village. Let the games begin!<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "3272866f3a3280487101a93a2059e095.jpg", "id": "lawn-games"}, {"title": "Swimming Pools at Shanty Creek", "html": "<p>Whether you're cooling off in summer or relaxing after a day on the slopes, Shanty Creek has pools across its villages.<\/p><ul><li><strong>The Lakeview Hotel (Summit Village)<\/strong> – <strong>indoor pool<\/strong> (open daily 9am–11pm) and a seasonal <strong>outdoor pool<\/strong> (summer only).<\/li><li><strong>The Lodge at Cedar River<\/strong> – heated outdoor pool and hot tubs, reserved for Cedar River lodging guests and property owners.<\/li><\/ul><p><strong>Your pool pass covers the Lakeview Hotel indoor and outdoor pools only.<\/strong> The other village pools are not included with your stay.<\/p><p>The resort only provides pool towels to its own lodging guests, so please bring the towel basket we provide with your pool pass.<\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/fitness-center/\">https://www.shantycreek.com/stay/fitness-center/<\/a><\/p>", "photo": "d8c6ab749ee7df07780b8d1c6e11dba1.jpg", "id": "swimming-pools-at-shanty-creek"}, {"title": "Tennis at Summit Village", "html": "<p>Serve up summer fun with a game of tennis at Shanty Creek! Located in Summit Village, the tennis courts offer scenic views overlooking the golf course—making each match both competitive and picturesque.<\/p> <p>Racquets and tennis balls are available for use from the <strong>Summit Fitness Center<\/strong>, so you can hit the court without packing gear.<\/p> <p>Whether you're a seasoned player or just looking for a friendly rally, the courts at Shanty Creek are a great way to stay active and soak up the northern Michigan sunshine.<\/p> <p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/stay/more-fun-in-the-sun/\">https://www.shantycreek.com/stay/more-fun-in-the-sun/<\/a><\/p>", "photo": "d223c07d481d247ce9014d85f94b79ec.jpg", "id": "tennis-at-summit-village"}]}, {"title": "Winter Activities", "items": [{"title": "Alpine Tubing", "html": "<p>If skiing and snowboarding aren’t your thing, there’s still a fast and fun way to enjoy the snow. <strong>Alpine Tubing<\/strong> at <strong>Summit Mountain<\/strong> is a must-try winter activity, with all the thrills of sledding and none of the uphill climb.<\/p><p>You’ll hear laughter echoing across the slopes as guests of all ages race down the tubing lanes and ride the surface lift back to the top. No skills required. Just hold on and enjoy the ride!<\/p><p><strong>What to know:<\/strong><\/p><ul><li>Sessions start at the top of every hour<\/li><li><strong>$30 per hour<\/strong><\/li><li><strong>Online booking only<\/strong><\/li><li>Participants must be <strong>36″ tall<\/strong><\/li><\/ul><p><strong>Hours (2026–27, projected Dec 19 – Mar 14):<\/strong> Fri 4pm–10pm; Sat &amp; holidays 10am–10pm; Sun &amp; holiday Mondays 10am–4pm.<\/p><p><strong>Parents note:<\/strong> The <strong>last two hours<\/strong> on <strong>Friday and Saturday nights<\/strong> are recommended for <strong>adults only<\/strong>.<\/p><p><strong>More info &amp; booking:<\/strong> <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/#tubing\">https://www.shantycreek.com/ski/more-on-the-snow/#tubing<\/a><\/p>", "photo": "d85f4f59827bb40aa6b6ac461d66783d.jpg", "id": "alpine-tubing"}, {"title": "Fat Tire Biking", "html": "<p><strong>Ride on, even in the snow<\/strong><\/p><p>Try <strong>fat tire biking<\/strong> on the groomed <strong>3 km multi-purpose trail<\/strong> at Schuss Village. Whether you're an experienced rider or just looking to try something new, this packed trail offers a smooth, scenic ride through snow-covered landscapes. It’s shared with snowshoers.<\/p><p>Don’t have your own bike? <strong>Fat tire bike rentals<\/strong> are available from <a href=\"https://webreserv.com/paddlesandpedalsmi\">Paddles &amp; Pedals<\/a>, 206 N. Bridge St. in downtown Bellaire. Call <a href=\"tel:2315334449\">231-533-4449<\/a> to reserve and confirm winter availability.<\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/ski/nordic-trails/\">https://www.shantycreek.com/ski/nordic-trails/<\/a><\/p>", "photo": "4a2ceac3d48e71346d57651aaa1f5a56.jpg", "id": "fat-tire-biking"}, {"title": "Nordic Skiing", "html": "<p>Few activities capture the quiet beauty of northern Michigan in winter quite like Nordic skiing. At <strong>Shanty Creek Resort<\/strong>, you’ll find <strong>9.5 km of groomed, track-set cross-country trails<\/strong> that wind between the resort’s villages for a scenic, heart-healthy <em>village-to-village<\/em> skiing experience.<\/p><p><strong>Multi-purpose trail:<\/strong> If Nordic skiing isn’t your thing, a <strong>3 km groomed trail<\/strong> in <strong>Schuss Village<\/strong> is set aside for <strong>fat tire biking<\/strong> and <strong>snowshoeing<\/strong>.<\/p><p><strong>Nordic Center:<\/strong> Classic and skate ski rentals and snowshoe rentals. Day trail pass $22 adult / $14 child; ski packages $34 adult; snowshoes $28.<\/p><p><strong>Hours (2026–27, projected Dec 26 – Mar 13):<\/strong> Thu &amp; Mon 9am–4pm; Fri 10am–4pm; Sat, Sun &amp; holidays 9am–5pm; closed Tue &amp; Wed.<\/p><p><strong>Lessons:<\/strong> Book 48 hours ahead. Cancellations need 48 hours’ notice for a refund. Requests for a specific instructor need at least 3 days’ notice.<\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/ski/nordic-trails/\">https://www.shantycreek.com/ski/nordic-trails/<\/a><\/p>", "photo": "afadf1fc5ceb077b8427fb28bcb335fe.jpg", "id": "nordic-skiing"}, {"title": "Nordic Trail Map", "html": "<p>Explore the snow-covered beauty of Shanty Creek Resort on its scenic <strong>Nordic ski and snowshoe trails<\/strong>. Whether you're a beginner or an experienced skier, these trails offer a peaceful and invigorating way to enjoy winter.<\/p><p><strong>Trail overview (2026 map)<\/strong><\/p><ul><li><strong>Pine Cone<\/strong> – 4.5 km, Schuss Village<\/li><li><strong>Winter Brook<\/strong> – 1.5 km, Schuss Village<\/li><li><strong>Arnie’s Way<\/strong> – 1 km, Summit Village<\/li><li><strong>Summit Loop<\/strong> – 1 km, Summit Village<\/li><li><strong>Multi-purpose trail<\/strong> – 3 km groomed trail at Schuss Village for snowshoeing and fat tire biking<\/li><\/ul><p>Trails are marked by difficulty (easiest, moderate, difficult) with trailhead signs. Landmarks along the way include <strong>Red Lift Corner<\/strong>, <strong>Riverview<\/strong>, and <strong>#3 Tee<\/strong>.<\/p><p><strong>Nordic Center hours (2026–27 season, projected Dec 26 – Mar 13):<\/strong><\/p><ul><li><strong>Thu &amp; Mon:<\/strong> 9am – 4pm<\/li><li><strong>Fri:<\/strong> 10am – 4pm<\/li><li><strong>Sat, Sun &amp; holidays:<\/strong> 9am – 5pm<\/li><li><strong>Closed:<\/strong> Tue &amp; Wed<\/li><\/ul><p><strong>View the trail map:<\/strong> <a href=\"https://www.shantycreek.com/wp-content/uploads/2026/01/NORDIC-TRAILS-Cross-Country-2026-11x17-1-scaled.jpg\">2026 Nordic Trail Map<\/a><\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/ski/nordic-trails/\">https://www.shantycreek.com/ski/nordic-trails/<\/a><\/p>", "photoHidden": "962a7f82255b70903a5737f2f8746089.jpg", "id": "nordic-trail-map"}, {"title": "Schuss Mountain Trail Map", "html": "<p><em>Welcome to Schuss Mountain at Shanty Creek Resort, where terrain, trails, and fun come together.<\/em><\/p><p>Schuss Mountain has about <strong>42 trails<\/strong> for all skill levels, with groomed runs, glades, two terrain parks, and great views across the mountain.<\/p><p><strong>Trail difficulty<\/strong><\/p><ul><li><strong>● Green circle<\/strong> – Easiest: wide, gentle slopes for beginners<\/li><li><strong>■ Blue square<\/strong> – More difficult: for developing skiers<\/li><li><strong>◆ Black diamond<\/strong> – Most difficult: steeper, faster terrain and glades<\/li><\/ul><p><strong>Lifts<\/strong><\/p><ul><li><strong>Five chairlifts<\/strong> – Pink, Blue, Yellow, Purple, and Red<\/li><li><strong>Purple Lift<\/strong> – Rises from Cedar River Village for ski-in/ski-out access<\/li><li><strong>Red Lift<\/strong> – Serves the back side of the mountain<\/li><li><strong>Surface lifts<\/strong> – Magic carpet and handle tow for beginners and the small terrain park<\/li><\/ul><p><strong>Terrain parks<\/strong><\/p><ul><li><strong>Mellow Yellow<\/strong> – The main park: big boxes, rails, and jumps<\/li><li><strong>Low Rider<\/strong> – A smaller, handle-tow park near the Yellow Lift for building confidence<\/li><\/ul><p><strong>Key areas<\/strong><\/p><ul><li><strong>Schuss Village<\/strong> – Base area with day lodge, tickets, rentals, ski school, and Ivan’s<\/li><li><strong>Cedar River Village<\/strong> – Ski-in/ski-out lodging next to the Purple Lift<\/li><\/ul><p><strong>Tips for Visitors<\/strong><\/p><ul><li>Start your day early for fresh corduroy runs<\/li><li>Green trails near the base are best for families and beginners<\/li><li>Use lift maps and signage to plan your route across the mountain<\/li><li>Helmets are recommended for all riders<\/li><\/ul><p><strong>Trail map:<\/strong> <a href=\"https://www.shantycreek.com/wp-content/uploads/2026/01/Shanty-Creek-Resort-Map-scaled.png\">Schuss Mountain Trail Map<\/a><\/p>", "photo": "7448326df61a45446d2ccc03cc09cf2e.jpg", "id": "schuss-mountain-trail-map"}, {"title": "Skiing & Snowboarding", "html": "<p>Shanty Creek Resort is one of Michigan’s most beloved ski destinations. <strong>Schuss Mountain<\/strong> has about <strong>42 downhill trails<\/strong>, five chairlifts, and two terrain parks, making it ideal for skiers and snowboarders of all skill levels. Alpine tubing is next door at <strong>Summit Mountain<\/strong>.<\/p><p>Whether you’re a beginner looking for gentle runs or a seasoned skier chasing fresh powder and steeps, the variety of terrain, well-maintained conditions, and laid-back vibe deliver exactly what you need.<\/p><p><strong>2026–27 season (projected):<\/strong> opens Dec 5, 2026; daily skiing from Dec 12; night skiing from Dec 26; closes Mar 22, 2027.<\/p><p><strong>Hours:<\/strong> Sun 9am–4:30pm; Mon–Tue 10am–4:30pm; Wed–Sat and holidays 9am–9pm (once night skiing begins).<\/p><p><strong>More info:<\/strong> <a href=\"https://www.shantycreek.com/ski/\">https://www.shantycreek.com/ski/<\/a> | <a href=\"https://www.shantycreek.com/ski/hours-of-operation/\">Hours of operation<\/a><\/p>", "photo": "fe7656219e2cdf06747400423c56851a.jpg", "id": "skiing-snowboarding"}, {"title": "Snow Glide Tours", "html": "<p>Experience winter like never before with Shanty Creek’s <strong>Snow Glide Tours<\/strong>, a scenic, cozy, and memorable ride for all ages.<\/p><p>Tours depart from The Lakeview Hotel's front circle. Each 45-minute guided ride winds through the snow-blanketed landscapes of <strong>Summit Village<\/strong>, with sweeping views and no effort required.<\/p><p>Each tour seats up to <strong>9 passengers<\/strong> and is pulled behind “<strong>Big Blue<\/strong>,” a double-track snowmobile. The Snow Glide has seatbelts, and passengers must be able to sit independently while buckled.<\/p><p><strong>Schedule (last season):<\/strong> on the hour, <strong>10am–3pm<\/strong>, on Saturdays, Sundays, and select holiday dates. The 2026–27 schedule had not been posted as of Oct 2026.<\/p><p><strong>Price:<\/strong> $29 per seat<br><em>Seating is limited, so book early.<\/em> Questions: <a href=\"tel:2315333000\">231-533-3000<\/a>.<\/p><p><strong>More info &amp; booking:<\/strong> <a href=\"https://www.shantycreek.com/snow-glide-tours/\">https://www.shantycreek.com/snow-glide-tours/<\/a><\/p>", "photo": "945e35a66551654ffb82c6f681fcb243.jpg", "id": "snow-glide-tours"}, {"title": "Snowshoeing", "html": "<p><strong>Forge Your Own Trail – Adventure Awaits<\/strong><\/p> <p>Whether you're a seasoned snowshoer or trying it for the first time, snowshoeing at Shanty Creek offers a peaceful and scenic way to explore the winter woods of northern Michigan.<\/p> <p>Slip on a pair and start walking—no special skills required. You can blaze your own path through the snowy landscape or follow the <strong>groomed 3km multi-purpose trail<\/strong> located at <strong>Schuss Village<\/strong>, shared with fat tire bikers and designed to minimize trail damage while keeping everyone safe.<\/p> <p><strong>Rental Equipment<\/strong> is available at the <strong>Nordic Center<\/strong> in Schuss Village, including snowshoes and poles.<\/p> <p>This is a perfect winter activity for those seeking quiet beauty, fresh air, and an easy-going workout.<\/p> <p>More Info: <a href=\"https://www.shantycreek.com/ski/more-on-the-snow/\">https://www.shantycreek.com/ski/more-on-the-snow/<\/a><\/p>", "photo": "c556df4dfb41e44d4d4fc76d3d73873f.jpg", "id": "snowshoeing"}]}]}}, "signinUrl": "https://script.google.com/macros/s/AKfycbyH0rEgRqprQRh7Kf4lDv1QUssPA7z4Jn7Od_cEGJWa8_TH9UwK0W4EjdJCiB6EX5DlMg/exec"}</script>
