<script type="application/json" id="guide-data">{"slug": "havana-haven", "name": "Havana Haven", "shortName": "Havana Haven", "welcome": "Welcome!", "hostedBy": "Hosted By Brandon & Katharina", "address": "3627 Northeast 19th Avenue, Fort Lauderdale, FL 33308", "location": [26.172776, -80.121529], "cover": "havana-haven-view.jpg", "coverDesktop": "havana-haven-view.jpg", "background": "havana-haven-view.jpg", "contact": {"phone": "404-358-1552", "sms": "404-358-1552", "email": ""}, "gate": true, "oldLinks": ["/guest/b0J1X8XcmzfuW/"], "layout": [{"heading": "Your Stay", "sections": ["add-to-phone", "welcome", "check-in-arrival", "check-out-departure", "rules", "cancellation-policy", "about-us", "contact-us"]}, {"heading": "The Home", "sections": ["bbq-grill", "beach-gear", "outdoor-games-fun", "indoor-games-fun", "kitchen", "laundry", "pool", "thermostat", "trash", "tv-streaming", "wifi"]}, {"heading": "Explore the Area", "sections": ["beer-wine", "dining", "emergency", "golf", "grocery", "water-activities", "weather"]}], "sections": {"add-to-phone": {"id": "add-to-phone", "title": "Add This Guide To Your Phone", "icon": "smartphone", "groups": [{"title": "", "items": [{"title": "Add This Guide To Your Phone", "html": "<p>When you first access this guidebook on your phone, you'll notice a prompt to add it to your home screen. <strong>This is highly recommended<\/strong> because it makes the guide faster and easier to access. And it remains accessible offline. <\/p><p>Following the prompt will add an app icon to your phone. It's just like any other app, but without you needing to download anything or sign in! <\/p><p>Doing this means that every time you want to access the guide, you just need to tap the app instead of searching for the link in your inbox - much easier! <\/p><h2><strong>Adding the app if you’re an Apple user<\/strong><\/h2><p>If you have an Apple device, the \"Add to Home Screen\" option won’t appear for you unless you’re using Safari browser. Don’t worry, this is really simple to solve - just copy the guidebook link and paste it into Safari. From there, you can follow the prompts to add the guidebook to your home screen.<\/p><h2><strong>Always get the latest version of the guidebook <\/strong><\/h2><p>Our guidebook is regularly updated with information designed to help you get the most out of your stay. To avoid missing out on any of these updates, the app automatically updates every 24 hours. If you want to get the updates sooner, just refresh the screen every time you open the guidebook from your home screen - this way you’ll always get the latest version. To refresh the app, swipe the app closed, and tap the app icon again to fully reload. <\/p><h2><strong>Share your guide with your group<\/strong><\/h2><p>You can send the link to this guidebook to everyone who’s travelling with you. That way, everyone has access to all the information they’ll need (which means less hassle for the trip organizer!). <\/p>", "photoHidden": "eb62c72e322ed4e278d8a01199f7aad2.jpg", "id": "add-this-guide-to-your-phone"}]}]}, "welcome": {"id": "welcome", "title": "Welcome", "icon": "cloud-sun", "groups": [{"title": "", "items": [{"title": "Welcome to Havana Haven!", "html": "<p><strong>Welcome to Havana Haven!<\/strong><br/>Here at your fingertips is everything you should need for your stay with us in Fort Lauderdale. In this easy-to-navigate link you will find information about the home, ideas and recommendations in the surrounding area, our Wi-Fi login credentials, and so much more.<\/p> <p>In order to best enjoy your time in our home, we encourage you to add this \"app\" to your phone. All of the content will even be accessible when your phone is offline.<\/p> <p>* It's not really an \"app\", but more a tool for easy access on your home screen <\/p> <ul> <li>For iPhone: <ul> <li>Tap the square with arrow pointing up at the bottom of your screen<\/li> <li>Select \"Add to Home Screen\"<\/li> <\/ul> <\/li> <li>For Android: <ul> <li>Tap \"Add to Home Screen\" where prompted when first accessing the site<\/li> <\/ul> <\/li> <\/ul> <p><strong>Print or Save a PDF<\/strong><br/>If you would like to print certain pages ahead of traveling, or if you'd like to save a PDF to your device, just tap the print button above. It won't print right away, but will create a PDF which you can save or print.<\/p> <p><strong>Contacting Us<\/strong><br/>We pride ourselves on swiftly meeting guest needs. We can be reached as follows:<\/p> <ul> <li>Preferred: Airbnb or VRBO message<\/li> <li>Phone: 404-358-1552 (emergencies)<\/li> <li>Instagram: @<a href=\"https://www.instagram.com/bk_stays/\">Bk_stays<\/a><\/li> <li>Facebook: <a href=\"https://www.facebook.com/profile.php?id=61551815370553\">BK Stays<\/a><\/li> <\/ul> <p><strong>What Next?<\/strong><br/>Please relax, unwind, have fun, and enjoy your stay!<\/p>", "photo": "116ced52187ec3878cf1bd83e69e3dcb.jpg", "id": "welcome-to-havana-haven"}, {"title": "Video Tour - Havana Haven", "html": "", "video": "https://www.youtube.com/embed/76v-qmIWxpc?wmode=opaque&rel=0", "id": "video-tour-havana-haven"}, {"title": "Thank You", "html": "", "video": "https://www.loom.com/embed/2d45f482bb7b4110aa985a45f92d48a5", "id": "thank-you"}]}]}, "check-in-arrival": {"id": "check-in-arrival", "title": "Check In + Arrival", "icon": "key-round", "groups": [{"title": "", "items": [{"title": "Driving Directions", "html": "<p><strong>Use Waze and/or Google Maps. <\/strong><\/p> <p><strong>Otherwise - if traveling on I95: <\/strong><\/p> <p>Take the exit for East/West Oakland Park Boulevard and go east.<\/p> <p>Turn north onto NE 20th Ave.<\/p> <p>Merge left onto NE 19th Ave.<\/p> <p>Drive a few blocks and the home will be on your left!<\/p>", "photo": "086591e685171217b89de3694e2b3326.jpg", "id": "driving-directions"}, {"title": "Access Codes / Instructions", "html": "<p>The Access Code for the front door is<\/p> <p>1552<\/p> <p>To lock the door, simply press the lock button. Please make sure all external doors are locked whenever you leave.<\/p> <p>* If for some reason the code doesn't work please call me at <a href=\"tel:404-358-1552\">404-358-1552<\/a>. I will get you the lockbox code for the spare key!<\/p>", "photo": "730742e2babb8d2cedbe0a30eac61d46.jpg", "id": "access-codes-instructions"}, {"title": "4:00 PM Check-in", "html": "<p>If you would like an early check-in, please see our <a href=\"#/info/check-in-arrival/early-check-in-half-day-stay-option\">Early Check In (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 4:00 PM is a strict check-in time. If you are arriving early, take a look at the Explore the Area section. We've listed a few things to do around the area while we prepare the home!<\/p>", "photo": "11e339c716ed8af07a28c05e286c2caa.jpg", "id": "4-00-pm-check-in"}, {"title": "Early Check In (Half Day Stay Option)", "html": "<p>Want to get here early? Add a <strong>Half Day Stay<\/strong> and you can arrive as early as <strong>8:00 AM<\/strong> on your arrival day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer early check-in because of our tight cleaning and maintenance schedule.<\/p>", "photo": "6db9b8952aaf5792e4af093537545794.jpg", "id": "early-check-in-half-day-stay-option"}]}]}, "check-out-departure": {"id": "check-out-departure", "title": "Check Out + Departure", "icon": "hand", "groups": [{"title": "", "items": [{"title": "10:00 AM Check-out", "html": "<p>If you would like a late check-out, please see our <a href=\"#/info/check-out-departure/late-check-out-half-day-stay-option\">Late Check Out (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 10:00 AM is a strict check-out time. <\/p>", "photoHidden": "ea9c00f35f36edb8d89dcc92e7f562cc.jpg", "id": "10-00-am-check-out"}, {"title": "Late Check Out (Half Day Stay Option)", "html": "<p>Not ready to leave? Add a <strong>Half Day Stay<\/strong> and you won't need to check out until <strong>8:00 PM<\/strong> on your departure day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer late check-out because of our tight cleaning and maintenance schedule.<\/p>", "photoHidden": "6db9b8952aaf5792e4af093537545794.jpg", "id": "late-check-out-half-day-stay-option"}, {"title": "Extended Stay?", "html": "<p>Would you like to add another night? If we have availability the day before or after your reservation, we would love to offer you that extra night at a great discount. We'll even cover the taxes and fees! Just let us know if your travel plans are flexible and we will make sure to accommodate the changes!<\/p>", "photoHidden": "585cb6b5ac72b31289b8dae13c068a03.jpg", "id": "extended-stay"}, {"title": "Check-out Process", "html": "<p>Standard check-out is at 10:00 AM on your departure date (Unless you've paid for a late check-out).&nbsp;<\/p> <p>When you've finished your stay, technically, you can just leave no questions asked lol :) But, if you really wanted to give our cleaning team some love, we would appreciate it if you would take care of a few simple things:<\/p> <ul> <li>Dishwasher - Load and start the dishwasher<\/li> <li>Towels - Place all used towels in the shower.<\/li> <li>Trash - Place trash in can(s) next to the garage. Green is trash. Blue is recycling.<\/li> <li>Lock Up - Lock all doors<\/li> <\/ul> <p>Also, for safety outdoors, please deflate the pool toys and \"wind down\" the umbrellas.<\/p> <p>We hope you guys had an amazing stay! Thank you again and safe travels back home.<\/p>", "id": "check-out-process"}, {"title": "Lost and Found", "html": "<p>Please triple-check the home before departing to ensure you have not left anything behind. Common items left behind include phone chargers, computer cords, passports/licenses, clothes, electronics, eyeglasses, toiletries/makeup, documents, and toys.<\/p><p>Please send a message the moment you realize you've left something behind. <br><br>We completely understand that things can get left behind — and we’re more than happy to help get your items back to you! We’ll gladly ship your lost item using the postal service or carrier of your choice (standard, express, or overnight). <br><br>We kindly ask for the shipping cost, plus a $20 service fee to cover the time and materials for packaging and handling. Be certain to include:<\/p><ul><li>Item description<\/li><li>Where you think you may have left the item<\/li><li>The name on the reservation<\/li><\/ul><p>Just let us know how you’d like it sent, and we’ll take care of the rest!<\/p>", "photoHidden": "8da278ec14e085d81ebe06c22b24af10.jpg", "id": "lost-and-found"}]}]}, "rules": {"id": "rules", "title": "Rules and Regulations", "icon": "book-open", "groups": [{"title": "", "items": [{"title": "Age Requirement", "html": "<p>The minimum age requirement to book is 25 years of age. The home is child friendly, but not childproof, and may not be suitable for infants or children without adult supervision.<\/p>", "id": "age-requirement"}, {"title": "Confetti / Glitter", "html": "<p><strong>No Confetti or Glitter<\/strong><br>We understand that special occasions call for celebration - and sometimes decorations! However, confetti and glitter are extremely difficult to clean and can cause damage to furniture and floors. Any evidence of confetti or glitter left behind will incur additional cleaning fees. Please celebrate responsibly and help us keep the home in great condition - no confetti or glitter, please.<\/p>", "id": "confetti-glitter"}, {"title": "Damages", "html": "<p>Guests are financially responsible for any damage, theft, missing items, or violations of house rules during their stay. You could be charged for: Property damage or theft; Unauthorized pets; Excessive cleaning or evidence of smoking; Exceeding occupancy or parking limits; Any other violations outlined in this agreement. You will be notified in writing if any damage is found. Major damage that delays the next check-in may result in additional charges for guest relocation or compensation. Please report any existing damage at check-in, and notify us right away if anything breaks or is damaged during your stay, even if it’s small. We understand accidents happen and can often replace or repair items quickly if we're informed. Guests are responsible for damage caused by misuse or negligence.<\/p>", "id": "damages"}, {"title": "Fire Safety and Prevention", "html": "<p>Guest agrees to comply with all local, county, and state fire restrictions, including any active burn bans or official fire safety regulations. Guest is responsible for helping maintain a fire-safe environment throughout their stay. This includes, but is not limited to; Ensuring that all outdoor fires (e.g., bonfires or fire pits) are fully extinguished after use, before going to bed, and before vacating the property; Never leaving open flames or burning embers unattended; Using only designated fire areas and keeping all fires small, controlled, and manageable; Ensuring fire extinguishers located in the home are accessible at all times and used in case of fire emergencies.<\/p><p>Additionally, Guest(s) acknowledges that outdoor grills must be cleaned and properly maintained after each use to prevent fire hazards. Guest agrees to: Clean the grill thoroughly after each use; Remove all grease and dispose of it safely in the trash (never on the ground or around the property); Ensure the grill is turned off, left in safe, clean, and operable condition, and covered if applicable; Keep a fire extinguisher nearby when using the grill.<\/p><p>Failure to follow fire safety guidelines may result in fines, eviction, or financial liability for any resulting damages.<\/p>", "id": "fire-safety-and-prevention"}, {"title": "No Commercial Use", "html": "<p>This home is for private stays only. No commercial use of any kind is allowed. That means no retreats, workshops, classes, shoots or paid events, no charging admission, no selling or renting rooms, and no using our photos or property name to promote anything.<\/p><p>Planning something special? Ask us before you arrive. Events require our written approval and a signed agreement.<\/p><p>Violations will result in <strong>immediate eviction without refund<\/strong>, <strong>loss of your security deposit<\/strong>, a report to the platform you booked through, and possible legal action to recover damages.<\/p>", "id": "no-commercial-use"}, {"title": "Noise Monitoring", "html": "<p>We ask that you please be respectful of our neighbors. The City and HOA have certain noise regulations for residential areas.<\/p> <p>This property is equipped with devices that monitor noise levels (but do not record sound) and alert the host if it gets too loud.<\/p> <p>If there are multiple noise issues you could be charged or even removed from the home.<\/p>", "id": "noise-monitoring"}, {"title": "Occupancy - Max 10 Person(s)", "html": "<p>This home has a maximum occupancy of <strong>10 person(s)<\/strong>, and no more than 10 people may be on the property at any time. Occupancy is set by square footage and bedroom count under Broward County and City of Oakland Park rules.<\/p><p>Please contact us before arrival if you'd like to request additional guests. Unapproved guests or exceeding the occupancy limit <strong>will result in the loss of your security deposit<\/strong> and may lead to immediate eviction without refund.<\/p>", "id": "occupancy-max-10-person-s"}, {"title": "Parking", "html": "<p>Parking is limited to <strong>four (4) vehicles in the driveway<\/strong>. Parking on the grass is strictly prohibited and may result in fines or damage charges.<\/p><p>Commercial vehicles, buses and RVs may not be parked on the property at any time. Recreational vehicles and equipment, including boats, trailers and golf carts, are allowed but must be parked at least 30 feet from the public road and kept clean and orderly.<\/p><p>Street parking is not allowed unless marked with signs.<\/p>", "id": "parking"}, {"title": "Pet Policy - Max 2 Dogs (with approval)", "html": "<p>This home is pet-friendly, so you can bring your furry friend from home! <strong>Max 2 dogs allowed<\/strong> per stay, with approval. Hypoallergenic breeds are preferred.<\/p><p>All pets must be on your reservation. Please let us know beforehand so we can take the proper cleaning measures. A <strong>$150 pet fee<\/strong> will be added to your reservation for any approved pet before arrival.<\/p><p>If you bring a pet without notifying your hosts, you will be charged <strong>double<\/strong> for any unapproved pet.<\/p>", "id": "pet-policy-max-2-dogs-with-approval"}, {"title": "Plumbing", "html": "<p>Please only put toilet paper in the toilet and throw everything else in the trash.<\/p><p>Tampons, baby wipes (even \"flushable\" ones), paper towels or anything other than toilet paper will clog the pipes and can lead to plumbing damage fees.<\/p>", "id": "plumbing"}, {"title": "Quiet Hours", "html": "<p>Quiet hours are <strong>10:00 PM to 8:00 AM<\/strong>. During this time, outdoor music, loud conversations or any other disruptive noise is not permitted. Please be mindful of our neighbors and local noise ordinances.<\/p>", "id": "quiet-hours"}, {"title": "Reservation Adjustments", "html": "<p>If you need to make any change in your stay, for example, regarding the number of guests, bringing a service animal or anything at all, please let us know ahead of time so we can accommodate you. However, if you do not disclose any changes, like an animal or extra guests (above max occupancy) you could be subject to a reservation cancellation without refund. <\/p>", "id": "reservation-adjustments"}, {"title": "Security Camera", "html": "<p>Guests acknowledge and accept there are cameras located on the exterior of the property. Guests hereby acknowledge that the cameras location records video directly in front of the front entrance door and leading to the parking area, and this constitutes a public area. Guests understand that video may be captured, and no conversations located within this area may be deemed confidential. The intent of this camera is not to infringe on the privacy of Guests, but to serve as a safety and security measure.<\/p>", "id": "security-camera"}, {"title": "Smoking", "html": "<p>Smoking of any kind (cigarettes, cigars, pipes, vaping, e-cigarettes, marijuana or other drugs) is not allowed anywhere on the property, indoors or outdoors, unless you have our written permission in advance.<\/p><p>Evidence of smoking, including smoke odor, ash, butts, paraphernalia or related trash left inside or outside the home, <strong>will result in the loss of your security deposit<\/strong>, plus the cost of odor removal and cleaning, and may result in eviction without refund.<\/p>", "id": "smoking"}, {"title": "Trash", "html": "<p>Trash bins are located outside on the side of the garage. Green is trash, and blue is recycling. Trash pick-up is on Monday and Thursday mornings. Someone has been hired to come to the home and bring the cans to the street on the nights prior (just so you're not surprised).<\/p> <p>Thank You!<\/p>", "id": "trash"}]}]}, "cancellation-policy": {"id": "cancellation-policy", "title": "Cancellation Policy", "icon": "circle-x", "groups": [{"title": "", "items": [{"title": "Cancellation Policy", "html": "<p>Our cancellation policy varies by platform (Airbnb, VRBO, Direct, etc.) and will have been clearly stated at the time of booking under one of the following categories: strict, firm, moderate, or flexible.<\/p><p>We strongly recommend purchasing travel insurance to protect your investment. If you purchased travel insurance, please contact your provider for help with cancellations or disruptions.<\/p><p><strong>State of Emergency / Evacuations<\/strong><\/p><p>If travel insurance was not purchased, cancellations are handled per the terms of your reservation. Exceptions may be made only when <strong>both<\/strong> of the following apply:<\/p><ul><li>A <strong>Governor-issued State of Emergency<\/strong> has been declared for <strong>Broward County, Florida<\/strong> (the county where the home is located), <strong>and<\/strong><\/li><li>A <strong>mandatory evacuation order or travel restriction<\/strong> is actively in effect for the property's address during your reservation dates.<\/li><\/ul><p>General weather advisories or conditions affecting other areas do not qualify.<\/p><p><strong>If the Home Becomes Unavailable<\/strong><\/p><p>In the event the property becomes unavailable due to circumstances beyond the host's control, including but not limited to fire, flood, structural damage, utility failure, or a government-declared emergency, the host reserves the right to cancel a confirmed reservation. In such circumstances, guests will receive a full refund of all amounts paid and the host's liability shall be limited solely to that refund.<\/p>", "id": "cancellation-policy"}]}]}, "about-us": {"id": "about-us", "title": "About Us", "icon": "users", "groups": [{"title": "", "items": [{"title": "About Your Hosts", "html": "<p>Our first trip to North Georgia was way back in the summer of 2021 and we undeniably fell in love. The mountain vibes left such a good impression, that we decided as a family to find a home away from home. The surrounding area has so much to offer for families, friends, and couples during every season of the year. We have had the chance to experience so much that Blue Ridge, Ellijay, and the North Georgia Mountains have to offer, but we still have a long bucket list waiting for our next adventure. We have a 6-year-old daughter and a 3-year-old son and love traveling and spending time exploring new places as a family.<\/p>", "photo": "about-us-family-collage.jpg", "photoFit": "full", "id": "about-your-hosts"}]}]}, "contact-us": {"id": "contact-us", "title": "Contact Us / Book Again", "icon": "phone", "groups": [{"title": "", "items": [{"title": "Thank You For Staying With Us", "html": "<p><strong>Thank you for staying with us, and we hope you enjoyed your stay.<\/strong> If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time. <\/p><p><strong>We love online reviews!<\/strong><\/p><p>Vrbo and Airbnb automatically sends you a review request. All you need to do is click the \"leave a review\" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. Was it the comfy beds; the local information and recommendations; or perhaps the location and all the fun activities to do at the home?<\/p><p><br><strong>Thank you!<\/strong><\/p><p>Brandon and Katharina <\/p>", "photoHidden": "4d239b49ed0744691981d3decf88b377.jpg", "id": "thank-you-for-staying-with-us"}, {"title": "Returning Guests", "html": "<p>We would love to have you stay again! In fact, please take advantage of booking directly with us at <a href=\"https://www.bkstays.com/about-us\">bkstays.com <\/a>- please reach out to us on Instagram, Facebook, or directly to Brandon at 404 - 358 - 1552. <\/p>", "photoHidden": "5e53f078d45d701f01a19dcba10f0cc7.jpg", "id": "returning-guests"}, {"title": "Follow Us On Social Media", "html": "<p>Let's Be Social! Follow Us On Social Media Below<\/p><p>Facebook: BK Stays<\/p><p>Instagram: @bk_stays<\/p>", "photoHidden": "067e96592ab64bb41d8e0f51c9754500.jpg", "id": "follow-us-on-social-media"}, {"title": "How To Contact Us", "html": "<p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.  We can be reached at the contact info below:<\/p><ul><li>Message: through Airbnb / VRBO (simple assistance)<\/li><li>Phone: 1-404-358-1552 (emergencies)<\/li><li>Instagram or Facebook @ bk_stays<\/li><\/ul>", "photoHidden": "4f717eaaf0303b1fec1a0ee821f299a1.jpg", "id": "how-to-contact-us"}]}]}, "wifi": {"id": "wifi", "title": "WiFi / Internet Details", "icon": "wifi", "groups": [{"title": "", "items": [{"title": "WIFI / Internet Details", "html": "<p>There is free Wi-Fi for your use. The details are: <br><br>WIFI Name: bk stays<\/p> <p>Do not use \"Havana Haven BnB\" - this network is only for the Smart TV's<br><br>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us.<\/p>", "photo": "5ed7c444a9811d008c50a348f27c69d5.jpg", "id": "wifi-internet-details"}]}]}, "bbq-grill": {"id": "bbq-grill", "title": "BBQ Grill + Propane", "icon": "flame", "groups": [{"title": "", "items": [{"title": "Propane Grill", "html": "<p>There is a 4-burner propane grill for your use on the back patio. Please follow the grill instructions carefully, and close the propane valve when you're done.<\/p><p><strong>Propane tanks:<\/strong> We try to keep a full propane tank (and an extra) at the home. Most of the time we swap them out before check-in, but that's not always possible. If you run low, we can try to have a new tank delivered, though it may not be immediate. If you need one quickly, feel free to exchange the empty tank at a local store and we'll happily reimburse you for the tank and your trouble. Just let us know!<\/p>", "photo": "15794bbf5b4c899f9e83c2c481ad9ca0.jpg", "id": "propane-grill"}]}]}, "indoor-games-fun": {"id": "indoor-games-fun", "title": "Indoor Games + Fun", "icon": "gamepad-2", "groups": [{"title": "", "items": [{"title": "Game Room Fun!", "html": "<p>In the game room, you&rsquo;ll find a small selection of board games, card games, foosball, darts, and arcades for endless fun. If anything is missing or broken, please let us know immediately so we can order a replacement right away!<\/p>", "photo": "f2ac18787902d445ef5d72fe124ab1bb.jpg", "id": "game-room-fun"}, {"title": "Cards, Games + More", "html": "<p>We try to keep a great selection of puzzles, books, board games, and card games for the whole family. Feel free to help yourself!<\/p><p>If something is missing or broken, please let us know so we can order a replacement.<\/p><p>Please keep everything neat and tidy for the next guests. Missing puzzle pieces or half a set of chess pieces isn't fun for anyone :)<\/p>", "photo": "generic-chess-board.jpg", "id": "cards-games-more"}]}]}, "kitchen": {"id": "kitchen", "title": "Kitchen, Supplies + Appliances", "icon": "cooking-pot", "groups": [{"title": "", "items": [{"title": "Kitchen + Supplies + Appliances", "html": "<p>We have a fully stocked kitchen with a stainless steel appliance package. We try to provide everything you may need, but we're not perfect. If you have any suggestions for small appliances, dishware, flatware, glassware, or even dry goods that would be beneficial - let us know! We would be happy to see if it's possible to place an Amazon/Walmart/Grocery delivery order for you during your stay :)<\/p>", "id": "kitchen-supplies-appliances"}]}]}, "laundry": {"id": "laundry", "title": "Laundry", "icon": "washing-machine", "groups": [{"title": "", "items": [{"title": "Laundry", "html": "<p>We do have a private washer and dryer located in the home. There should be a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in, close the door, and hit start. <\/p>", "photo": "794607d57a2c8fc964701bb9c7a73b7a.jpg", "id": "laundry"}]}]}, "outdoor-games-fun": {"id": "outdoor-games-fun", "title": "Cornhole / Bags", "icon": "target", "groups": [{"title": "", "items": [{"title": "Cornhole / Bags", "html": "<p>Nothing beats a little friendly competition in the Florida sunshine! Grab the cornhole boards and bags, set them up outside, and enjoy the views while you play. Whether it's a quick game before dinner or a full-on family tournament, it's a great way to spend time outdoors together.<\/p><p>There should be a set of all-weather white cornhole boards in the back yard. If you notice anything is broken or missing please let us know right away so we can order replacements.<\/p> <p>It would be very helpful if you would return them to the storage bin after each use so they don't wander off :)<\/p>", "photo": "a8515246a80eaf7c5c41c19f799e6b4f.jpg", "id": "cornhole-bags"}]}]}, "pool": {"id": "pool", "title": "Pool", "icon": "waves", "groups": [{"title": "", "items": [{"title": "Pool / Rules", "html": "<p>The pool is professionally serviced twice a week, on <strong>Wednesdays and Saturdays<\/strong>, so you may see the pool tech in the backyard on those days. Conditions can vary with weather and timing, and some leaves or natural debris between visits is normal.<\/p><p>The pool can be heated for an additional $50/day fee for the duration of your stay. Please let us know ahead of time if you would like to heat the pool to a comfortable 85*F for your stay! We will have it warm upon your arrival as long as your balance is up to date. The pool takes about a full day to go from cold to the \"desired temp' so please don't wait until you arrive to decide :)<\/p> <p><strong>Pool Rules<\/strong><\/p> <p><strong>Do Not Touch the Pool Equipment!<\/strong><\/p> <p>If you would like directions on how to turn on the waterfall please just ask.<strong> <\/strong>Never adjust the heater or pump equipment without consulting your hosts first. We do not want to cause any damage that requires a pool technician to come to the home for a service fee at the guest's expense.<\/p> <p>Additional Rules:<\/p> <ul> <li>No Lifeguard On Duty. Use at Your Own Risk.<\/li> <li>The Owner/Host Does Not Assume Responsibility For Any Accidents Or Injuries.<\/li> <li>No Glass Containers Allowed In The Back Yard<\/li> <li>No Animals Allowed<\/li> <li>No Diving Allowed<\/li> <li>No Running, Pushing, or&nbsp; Dangerous Horseplay<\/li> <li>Please Be Considerate of Neighbors and Posted Noise Ordinance(s)<\/li> <\/ul> <p>The owner/host reserves the right to deny use of the pool to anyone at any time. Please be considerate of others and help us maintain a safe and enjoyable environment.&nbsp;<\/p>", "photo": "feeed3944d93444f332d37e2def745c0.jpg", "id": "pool-rules"}, {"title": "Pool Waiver", "html": "<p>By reserving this home you have agreed to the following rules below.<\/p> <p><strong>Assumption of Risk:<\/strong><\/p> <p>We intend to utilize the swimming pool(s). We are aware and understand there are inherent risks associated with the use of these facilities and we recognize and fully understand the risks. We are aware and understand that our use of the swimming pool(s) is a potentially dangerous activity and involves the risk of personal injury, pain, suffering, temporary or permanent disability, death, property damage, and/or financial loss. We are aware and understand that at no time there will be a lifeguard on duty while we use such facilities. We are aware of and understand that the use of the pool facilities involve certain risks, including but not limited to:<\/p> <ul> <li>the risk of injury resulting from possible malfunction of pool equipment<\/li> <li>the risk of injuries resulting from tripping/falling over obstacles in the pool area.<\/li> <li>the risk of injuries resulting from unsupervised divers and swimmers colliding<\/li> <li>the risk of other injuries resulting from participating in any action in the pool<\/li> <\/ul> <p>We recognize and fully understand that the above list is not a complete or exhaustive list of all possible risks; the list only provides examples of types of risks we are assuming. <strong>NOTWITHSTANDING THESE RISKS, WE ACKNOWLEDGE THAT WE ARE VOLUNTARILY ACCESSING THE SWIMMING FACILITIES AND PARTICIPATING IN THE ACTIVITY WITH KNOWLEDGE OF THE DANGERS INVOLVED. WE HEREBY AGREE TO ACCEPT AND ASSUME ALL RISKS OF ILLNESS, PERSONAL OR PSYCHOLOGICAL INJURY, PAIN, SUFFERING, TEMPORARY OR PERMANENT DISABILITY, DEATH, PROPERTY DAMAGE, AND/OR FINANCIAL LOSS ARISING THEREFROM, WHETHER CAUSED BY THE ORDINARY NEGLIGENCE OF THE COMPANY/OWNER/HOST OR OTHERWISE.&nbsp;<\/strong><\/p> <p>We further agree that in exchange for being allowed to use the pool, I fully intent to and choose to give up legal rights and we agree TO WAIVE AND RELEASE ANY ANY AND ALL CLAIMS that we have or may have in the future against the resort/owner/host and representatives from any and all liability for any loss, damage, injury, expense, or other cost that we may suffer or that our next of kin may suffer in connection with our use of the Releasees pool or pool area to any cause whatsoever, INCLUDING NEGLIGENCE ON THE PART OF THE RELEASEES. We further agree TO HOLD HARMLESS AND INDEMNIFY THE RELEASEES from any and all claims, whether now known or hereafter known, and release all liability to the property, or personal injury to, any third party, resulting from the use of the pool or pool area. We further agree that this Waiver, Release, and Agreement is fully effective and shall be effective and binding upon us, and our heirs, next of kin, executors, administrators, and assigns or anyone else authorized to act on our behalf or on behalf of our estate.<strong> WE ACKNOWLEDGE THAT WE HAVE READ AND UNDERSTOOD ALL OF THE TERMS OF THIS RELEASE AND THAT WE ARE VOLUNTARILY GIVING UP SUBSTANTIAL LEGAL RIGHTS, INCLUDING THE RIGHT TO SUE THE RESORT/OWNER/HOST.<\/strong><\/p> <p>We further agree to abide by the posted rules listed below.&nbsp;<\/p>", "id": "pool-waiver"}]}]}, "trash": {"id": "trash", "title": "Trash", "icon": "trash-2", "groups": [{"title": "", "items": [{"title": "Trash", "html": "<p>Trash bins are located outside on the side of the garage. Green is trash, and blue is recycling. Trash pick-up is on Monday and Thursday mornings. Someone has been hired to come to the home and bring the cans to the street on the nights prior (just so you're not surprised).<\/p> <p>Thank You!<\/p>", "id": "trash"}]}]}, "tv-streaming": {"id": "tv-streaming", "title": "TV's + Streaming", "icon": "tv", "groups": [{"title": "", "items": [{"title": "TV's + Streaming", "html": "<p>We have Hi-Speed WIFI for all of your streaming needs!<\/p><p>There are Smart TV's throughout the entire home.<\/p><p>Go to the TV Home Screen<\/p><p>Search For (or Download) The Channel App You Want To Watch &amp; Login to your TV Provider.<\/p><p>Please don't hesitate to reach out if you need provider login assistance!<\/p>", "photo": "729ecb38918b0e99bc0a0ec5fa74c6d2.jpg", "id": "tvs-streaming"}]}]}, "thermostat": {"id": "thermostat", "title": "Thermostat", "icon": "thermometer", "groups": [{"title": "", "items": [{"title": "Heating / Cooling", "html": "<p>Please Do Not Lower The Thermostat Below 72*. Florida gets hot in the summer. But lowering the temp too much will damage the HVAC units and freeze the components. We learned that lesson the hard way :(<\/p> <p>When you arrive, the thermostat should be set somewhere between 72-74*F - but you can adjust somewhat if you need. If you're running the air conditioning or heating - please keep all windows and outside doors closed to ensure it operates at maximum efficiency.&nbsp;<\/p>", "photo": "c34864ef1cb2e390faa1de0a2397ad3b.jpg", "id": "heating-cooling"}]}]}, "beach-gear": {"id": "beach-gear", "title": "Beach Gear + Family Items", "icon": "umbrella", "groups": [{"title": "", "items": [{"title": "Beach Gear + Family Items", "photo": "havana-beach-family-gear.jpg", "photoFit": "full", "html": "<p>Heading to the beach? Fort Lauderdale Beach and Lauderdale-By-The-Sea are just a short drive away, and we've got you covered. Everything is in the <strong>storage closet next to the game room<\/strong>, so help yourself!<\/p><p><strong>Beach gear:<\/strong><\/p><ul><li>4 beach chairs<\/li><li>A large beach tent for shade<\/li><li>A big beach blanket<\/li><li>Beach coolers<\/li><li>Beach towels<\/li><\/ul><p><strong>Traveling with little ones?<\/strong> We also have:<\/p><ul><li>A Pack 'n Play<\/li><li>A high chair<\/li><li>Kid-friendly utensils, plates, cups and bowls<\/li><\/ul><p>Please shake off the sand, let everything dry, and put the gear back in the closet before check-out. If anything is broken or missing, just let us know so we can replace it.<\/p>", "id": "beach-gear-family-items"}]}]}, "beer-wine": {"id": "beer-wine", "title": "Beer and Wine", "icon": "wine", "groups": [{"title": "", "items": [{"title": "Funky Buddha Brewery", "html": "<p>Offering tours on weekends, this large craft brewery features a no-frills taproom with games.<\/p> <p>Address: 1201 NE 38th St, Oakland Park, FL 33334<\/p> <p>Phone: 954-440-0046<\/p> <p>Hours: Mon–Wed 11:30am–10pm, Thu 11:30am–11pm, Fri–Sat 11:30am–midnight, Sun 11am–9pm (no kids after 8pm)<\/p> <p><a href=\"https://funkybuddha.com/\">https://funkybuddha.com/<\/a><\/p>", "photo": "ae1532465d39125534562482530aa9c1.jpg", "loc": [26.174319, -80.131253], "pin": "brewery_pub", "id": "funky-buddha-brewery"}, {"title": "Holy Mackerel Beers", "html": "<p>Not just a brewery. Craft beer, craft cocktails, full bar and restaurant.<\/p> <p>Address: 1414 NE 26th St, Wilton Manors, FL 33305<\/p> <p>Phone: 954-306-3458<\/p> <p>Hours: Wed–Sun 11am–midnight<\/p> <p><a href=\"https://www.holymackerelbeers.com/\">https://www.holymackerelbeers.com/<\/a><\/p>", "photo": "9c240cc56ad6a4c13fdfe7c9cab43a81.jpg", "loc": [26.15913, -80.129616], "pin": "brewery_pub", "id": "holy-mackerel-beers"}]}]}, "dining": {"id": "dining", "title": "Dining Out", "icon": "utensils", "groups": [{"title": "Breakfast, Brunch, + Coffee Recommendations", "items": [{"title": "Angelo Elia - The Bakery Bar", "html": "<p>A true Italian feel - Angelo Elia's Bakery Bar is a wonderful and quaint pastry shop that is walkable from the home. Take a stroll through the neighborhood (only a couple blocks south) and come back with a delicious cappuccino and chocolate croissant.<\/p> <p>Phone: 954-566-6100<\/p> <p>Address: 2104 E Oakland Park Blvd, Fort Lauderdale, FL 33306<\/p> <p>Hours: Mon–Thu and Sun 7am–6pm, Fri–Sat 7am–7pm<\/p> <p>Website: <a href=\"https://angeloeliabakery.com/\">https://angeloeliabakery.com/<\/a><\/p>", "photo": "f843a8cb182cb2bbfb4dd505675fd1cf.jpg", "loc": [26.166805, -80.118903], "pin": "restaurants", "id": "angelo-elia-the-bakery-bar"}, {"title": "Rendez-Vous Bakery and Bistro", "html": "<p>From France to South Florida...literally; it's right around the corner. This amazing French Bakery has wonderful outdoor seating and a delicious menu from top to bottom.<\/p> <p>Phone: 954-563-2228<\/p> <p>Address: 1576 E Oakland Park Blvd, Oakland Park, FL 33334<\/p> <p>Hours: Breakfast 8–11:30am, lunch 11:30am–5pm, dinner from 5pm<\/p> <p>Website: <a href=\"https://www.rdvbakery.com/\">https://www.rdvbakery.com<\/a><\/p>", "photo": "eaa92ff519546af177bb5d627d023339.jpg", "loc": [26.166712, -80.126655], "pin": "restaurants", "id": "rendez-vous-bakery-and-bistro"}, {"title": "Tinta", "html": "<p>This wonderful place is oceanside, covered, outdoors, and one of our absolute favorites! Tinta is a Mexican breakfast down on Fort Lauderdale central beach (inside the Westin Fort Lauderdale Beach Resort). It's a bit of a drive from our home, but the breakfast quesadilla or machaca skillet is totally worth it!<\/p> <p>Phone: 954-245-3063<\/p> <p>Address: 321 N Fort Lauderdale Beach Blvd, Fort Lauderdale, FL 33304<\/p> <p>Hours: Daily 7am–11am (breakfast only)<\/p> <p>Website: <a href=\"https://www.lonarestaurant.com/waterfront-restaurants-fort-lauderdale/tinta-breakfast\">https://www.lonarestaurant.com/waterfront-restaurants-fort-lauderdale/tinta-breakfast<\/a><\/p>", "photo": "67d709370d652ba720e33c3ac10841f5.jpg", "loc": [26.127122, -80.10414], "pin": "restaurants", "id": "tinta"}]}, {"title": "Dinner + Drinks Recommendations", "items": [{"title": "Casablanca Cafe", "html": "<p>Designed in Mediterranean Revival architecture, the house is an eclectic blend of architectural elements of Spanish and Middle Eastern origins. Casablanca Cafe offers chef-inspired Mediterranean cuisine set to a charming and welcoming feel, created in part by the restaurant building itself - a nostalgic residential home built in the 1920s. Casablanca Cafe has been serving the community with unrivaled service and an unmatched dinner experience.<\/p> <p>Phone: 954-764-3500<\/p> <p>Address: 3049 Alhambra St, Fort Lauderdale, FL 33304<\/p> <p>Hours: Mon–Thu and Sun 8:30am–10pm, Fri–Sat 8:30am–11pm<\/p> <p><a href=\"https://casablancacafeonline.com/\">https://casablancacafeonline.com/<\/a><\/p>", "photo": "1dceb97491e87e577792b82231f8566f.jpg", "loc": [26.125187, -80.104056], "pin": "restaurants", "id": "casablanca-cafe"}, {"title": "Only Thai", "html": "<p>Location, authenticity, service, and quality. Only Thai is just down the street and an absolute must-get. Whether you're looking to dine in or grab something to go - this place leaves us satisfied every single time.<\/p> <p>Phone: 954-908-5578<\/p> <p>Address: 2100 E Oakland Park Blvd, Fort Lauderdale, FL 33306<\/p> <p>Hours: Open daily from 11:30am (lunch specials Mon–Fri until 3pm); call to confirm afternoon/evening hours<\/p> <p>Website: <a href=\"https://otthai.com/\">https://otthai.com/<\/a><\/p>", "photo": "66286fb10ce668f50c5db5bb539846e4.jpg", "loc": [26.1668, -80.119052], "pin": "restaurants", "id": "only-thai"}, {"title": "Tacocraft Taqueria & Tequila Bar", "html": "<p>Modern Mexican restaurant with lots of energy and good vibes. The chips and salsa are a classic delicious starter with tons of amazing taco choices. It can get a little pricey since it is located in Lauderdale By The Sea so we recommend going during Happy Hour (daily 3–6pm and 10pm–close)!<\/p> <p>Phone: 954-530-3763<\/p> <p>Address: 4400 N Ocean Dr, Lauderdale-By-The-Sea, FL 33308<\/p> <p>Hours: Mon, Wed, Thu 11:30am–11pm; Tue and Fri 11:30am–midnight; Sat 11am–midnight; Sun 11am–11pm<\/p> <p><a href=\"https://tacocraft.com/lauderdale-by-the-sea/\">https://tacocraft.com/lauderdale-by-the-sea/<\/a><\/p>", "photo": "e3aece39911337b9e20fd4dad6605b13.jpg", "loc": [26.190143, -80.096453], "pin": "restaurants", "id": "tacocraft-taqueria-tequila-bar"}]}, {"title": "Food Tours", "items": [{"title": "Craft Food Tours - Fort Lauderdale", "html": "<p>Escape the South Florida tourist traps as your local guides take you through Fort Lauderdale, Florida for an afternoon of food and drinks. Adults receive 8+ tastings and 2 alcoholic beverages, with vendor demonstrations and much more! The downtown tour runs about 3 hours (11am–2pm); beach and dinner &amp; drinks tours are also offered.<\/p> <p>Phone: 954-352-2336<\/p> <p>Website: <a href=\"https://www.craftfoodtours.com/fort-lauderdale/\">https://www.craftfoodtours.com/fort-lauderdale/<\/a><\/p>", "photo": "f24e5ba3e39204f5d05549ea0ae90eb6.jpg", "loc": [26.119492, -80.133132], "pin": "restaurants", "id": "craft-food-tours-fort-lauderdale"}]}]}, "emergency": {"id": "emergency", "title": "Emergency and Urgent Care", "icon": "siren", "groups": [{"title": "", "items": [{"title": "After Hours Pediatrics Urgent Care", "html": "<p>If there is an Emergency, please dial 911!<\/p> <p>Pediatric urgent care for children.<\/p> <p>Phone: 954-267-1621<\/p> <p>Address: 5067 N Dixie Hwy, Oakland Park, FL 33334<\/p> <p>Hours: Daily 1pm–11pm<\/p> <p><a href=\"https://www.afterhourspediatrics.com/locations/oaklandpark/\">https://www.afterhourspediatrics.com/locations/oaklandpark/<\/a><\/p>", "loc": [26.190803, -80.133438], "pin": "medical_facilities", "id": "after-hours-pediatrics-urgent-care"}, {"title": "Broward Sheriff's Office - Oakland Park District", "html": "<p>If there is an Emergency, please dial 911!<\/p> <p>Non-emergency: 954-764-4357 (HELP)<\/p> <p>District office: 954-202-3131<\/p> <p>Address: 5399 N Dixie Hwy, Suite 1, Oakland Park, FL 33334<\/p> <p>Office hours: Mon–Fri 8:30am–5pm<\/p> <p><a href=\"https://www.sheriff.org/oakland-park/\">https://www.sheriff.org/oakland-park/<\/a><\/p>", "loc": [26.194461, -80.133048], "pin": "police", "id": "broward-sheriffs-office-oakland-park-district"}, {"title": "Holy Cross Hospital (Holy Cross Health)", "html": "<p>If there is an Emergency, please dial 911!<\/p> <p>Full-service hospital with a 24/7 emergency department.<\/p> <p>Phone: 954-771-8000<\/p> <p>Address: 4725 N Federal Hwy, Fort Lauderdale, FL 33308<\/p> <p><a href=\"https://www.holy-cross.com/\">https://www.holy-cross.com/<\/a><\/p>", "loc": [26.186691, -80.119585], "pin": "medical_facilities", "id": "holy-cross-hospital-holy-cross-health"}, {"title": "Oakland Park Fire Station #9", "html": "<p>If there is an Emergency, please dial 911!<\/p> <p>Fire Administration (non-emergency): 954-630-4550<\/p> <p>Address: 599 NE 38th St, Oakland Park, FL 33334<\/p> <p><a href=\"https://oaklandparkfl.gov/184\">https://oaklandparkfl.gov/184<\/a><\/p>", "loc": [26.175799, -80.141877], "pin": "police", "id": "oakland-park-fire-station-9"}, {"title": "Pronto Urgent Care", "html": "<p>If there is an Emergency, please dial 911!<\/p> <p>Phone: 954-909-5708<\/p> <p>Address: 2500 E Commercial Blvd, Fort Lauderdale, FL 33308<\/p> <p>Hours: Mon–Fri 8am–8pm, Sat 10am–6pm, Sun closed (call ahead to confirm)<\/p> <p><a href=\"https://prontouc.com/\">https://prontouc.com/<\/a><\/p>", "loc": [26.189323, -80.111146], "pin": "medical_facilities", "id": "pronto-urgent-care"}]}]}, "golf": {"id": "golf", "title": "Golf", "icon": "flag", "groups": [{"title": "", "items": [{"title": "Palm Aire Country Club", "html": "<p><a href=\"https://palmaire.clublink.com/\">https://palmaire.clublink.com/<\/a><\/p> <p>Palm Aire Country Club in Pompano Beach, Florida, has a rich history dating back to its opening in 1959. Originally a country club featuring golf, it quickly grew into a master-planned community. Legendary golfer Sam Snead set a course record of 65 here in 1962. Today the club has three 18-hole courses (The Palms, The Oaks and The Cypress) and welcomes public golfers.<\/p> <p>Phone: 954-978-1737<\/p> <p>Address: 3701 Oaks Clubhouse Dr, Pompano Beach, FL 33069<\/p>", "loc": [26.224928, -80.157875], "pin": "golfing", "id": "palm-aire-country-club"}, {"title": "Plantation Preserve Golf Course & Club", "html": "<p>South Florida&rsquo;s finest public golf facility, which opened in February 2006, is unlike any other in the South Florida area. You will find a very challenging 18-hole championship golf course, a beautiful clubhouse with stunning panoramic views, and state of the art practice facilities.<\/p> <p>Tee times: 954-585-5020<\/p> <p>Address: 7050 W Broward Blvd, Plantation, FL 33317<\/p> <p><a href=\"https://plantation.org/government/departments/parks-recreation/plantation-preserve-golf-course-club\">Plantation Preserve website<\/a><\/p>", "loc": [26.118777, -80.242453], "pin": "golfing", "id": "plantation-preserve-golf-course-club"}, {"title": "Pompano Beach Golf Club", "html": "<p><a href=\"https://parks.pompanobeachfl.gov/golf\">https://parks.pompanobeachfl.gov/golf<\/a><\/p> <p>The recently renovated and redesigned Pines Championship Golf Course is an 18-hole course featuring over 7,100 yards and a par of 72. The adjacent Palms Course is a traditional Florida course challenging golfers of all skill levels. It is 18 holes, par 71, and over 6,280 yards. The Palms golf course caters to a loyal following of golfers who have enjoyed the layout for over a half a century.<\/p> <p>Pro shop: 954-781-0426<\/p> <p>Address: 1101 N Federal Hwy, Pompano Beach, FL 33062<\/p> <p>Hours: Daily 6:30am–6pm<\/p>", "loc": [26.245079, -80.103054], "pin": "golfing", "id": "pompano-beach-golf-club"}]}]}, "grocery": {"id": "grocery", "title": "Grocery and Pharmacy", "icon": "shopping-cart", "groups": [{"title": "", "items": [{"title": "CVS Pharmacy (inside Target)", "html": "<p>CVS Pharmacy inside Target, near Coral Ridge.<\/p> <p>Phone: 954-390-7056<\/p> <p>Address: 3200 N Federal Hwy, Fort Lauderdale, FL 33306<\/p> <p>Pharmacy hours: Mon–Fri 9am–6pm, Sat 10am–6pm, Sun 11am–5pm (may close briefly for lunch; check the store page for holiday hours)<\/p> <p><a href=\"https://www.cvs.com/store-locator/fort-lauderdale-fl-pharmacies/3200-n-federal-hwy-fort-lauderdale-fl-33306/storeid=16524\">Store page<\/a><\/p>", "photo": "bd637c3e96aa3b09d786560df40e48bb.jpg", "loc": [26.168436, -80.116185], "pin": "pharmacy", "id": "cvs-pharmacy-inside-target"}, {"title": "Groceries", "html": "<p>Publix Supermarket at Coral Ridge Shopping Center<\/p> <p>Address: 3400 N Federal Hwy, Fort Lauderdale, FL 33306<\/p> <p>Phone: 954-564-9612 (pharmacy 954-561-8771)<\/p> <p>Hours: Daily 7am–10pm. Pharmacy: Mon–Fri 9am–9pm, Sat 9am–7pm, Sun 11am–6pm<\/p> <p><a href=\"https://www.publix.com/locations/70-coral-ridge-shopping-center\">Store page<\/a><\/p>", "photo": "138b01e6e876252ecc969965619ec7df.jpg", "loc": [26.169631, -80.117646], "pin": "grocery_shopping", "id": "groceries"}]}]}, "water-activities": {"id": "water-activities", "title": "Water Activities", "icon": "sailboat", "groups": [{"title": "Beaches", "items": [{"title": "Las Olas Beach", "html": "", "photo": "0e692057040f057406c7be282c5b47a9.jpg", "loc": [26.1192, -80.104211], "pin": "beaches", "id": "las-olas-beach"}, {"title": "Lauderdale By The Sea Beach", "html": "", "photo": "dc47a8e2920a490991ffbad35647c004.jpg", "loc": [26.189458, -80.094973], "pin": "beaches", "id": "lauderdale-by-the-sea-beach"}, {"title": "Pompano Beach", "html": "", "photo": "61b939f42af931cef53ae279f76156bd.jpg", "loc": [26.242046, -80.087119], "pin": "beaches", "id": "pompano-beach"}, {"title": "South Beach (Miami)", "html": "", "photo": "fe3cdfb5a57ddbf74b18aefefd223472.jpg", "loc": [25.783347, -80.127897], "pin": "beaches", "id": "south-beach-miami"}]}, {"title": "Boat Tours", "items": [{"title": "BlueFoot Pirate Adventures", "html": "<p>An interactive pirate cruise that offers a family-friendly sail on the Intracoastal Waterway. The crew shares tips on how to talk and dress like a pirate, find hidden treasure, and fend off rival pirate attacks. Face painting, temporary tattoos, and onboard water cannons add to the fun, and kids receive a bag of loot and a pirate certificate to take home. A 21+ sunset cruise is also offered.<\/p> <p>Departs: Dania Beach Marina, Dock G28, 151 N Beach Rd, Dania Beach, FL 33004<\/p> <p>Phone: 954-530-8302<\/p> <p><a href=\"https://www.bluefootpirates.com/\">https://www.bluefootpirates.com/<\/a><\/p>", "photo": "00dd5e7eb8d75cf1f9f734bb8bce61fd.jpg", "loc": [26.0527, -80.1135], "pin": "entertainment_and_activities", "id": "bluefoot-pirate-adventures"}, {"title": "Carrie B - Venice of America Fort Lauderdale Sightseeing Tours", "html": "<p>See celebrity homes, the Fort Lauderdale skyline, and other top sights.<\/p> <p>Departs: Riverwalk / New River docks, 440 N New River Dr E, Fort Lauderdale, FL 33301<\/p> <p>Phone: 954-768-9920<\/p> <p>Tours: Daily at 11am, 1pm and 3pm<\/p> <p><a href=\"https://www.carriebcruises.com/\">https://www.carriebcruises.com/<\/a><\/p>", "photo": "597986355b525b4df413e398162bd607.jpg", "loc": [26.116989, -80.138511], "pin": "sightseeing", "id": "carrie-b-venice-of-america-fort-lauderdale-sightseeing-tours"}, {"title": "Florida Everglades Airboat Adventure and Wildlife Encounter", "html": "<p>Escape to the Florida Everglades for this airboat adventure and wildlife encounter at Sawgrass Recreation Park. This exciting airboat ride is a great way to experience the unique subtropical ecosystem of the Everglades as you skim across the grassy water.<\/p> <p>Address: 1006 N US Highway 27, Weston, FL 33327<\/p> <p>Phone: 954-389-0202<\/p> <p>Hours: Airboats run every 20–30 minutes until 3:30pm, with a final ride at 5pm (weather permitting; call ahead)<\/p> <p><a href=\"https://www.evergladestours.com/\">https://www.evergladestours.com/<\/a><\/p>", "loc": [26.176484, -80.447976], "pin": "sightseeing", "photoHidden": "1cac97df0c2f46838d8a7e432b9fe792.jpg", "id": "florida-everglades-airboat-adventure-and-wildlife-encounter"}]}]}, "weather": {"id": "weather", "title": "Weather", "icon": "cloud-sun-rain", "groups": [{"title": "", "items": [{"title": "Fort Lauderdale", "html": "<p>For the most up-to-date weather forecast check <a href=\"https://weather.com/weather/today/l/9274c6db29c1679fdfb0b2c4832183aa8145587ad4f980dfa9de74e442bdacbd\">here!<\/a><\/p> <p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say \"there is no such thing as bad weather, just inappropriate clothing\".<\/p>", "photo": "c23f2b1538c687cfdd797741fd258b63.jpg", "id": "fort-lauderdale"}]}]}}, "signinUrl": "https://script.google.com/macros/s/AKfycbyH0rEgRqprQRh7Kf4lDv1QUssPA7z4Jn7Od_cEGJWa8_TH9UwK0W4EjdJCiB6EX5DlMg/exec"}</script>
