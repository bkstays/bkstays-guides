<script type="application/json" id="guide-data">{"slug": "tails-and-trails-hideaway", "name": "Tails & Trails Hideaway", "shortName": "Tails & Trails Hideaway", "welcome": "Welcome!", "hostedBy": "Hosted By Brandon & Katharina", "address": "128 Kismet Court, Ellijay, GA 30540", "location": [34.644989, -84.52626], "cover": "tails-and-trails-hideaway-view.jpg", "coverDesktop": "tails-and-trails-hideaway-view.jpg", "background": "tails-and-trails-hideaway-view.jpg", "contact": {"phone": "404-358-1552", "sms": "404-358-1552", "email": ""}, "gate": true, "oldLinks": ["/guest/bO2wNF1FjHXm6/"], "layout": [{"heading": "Your Stay", "sections": ["add-to-phone", "welcome", "check-in-arrival", "check-out-departure", "rules", "cancellation-policy", "about-us", "contact-us"]}, {"heading": "The Home", "sections": ["bbq-grill", "resort", "fireplace-firepit", "hot-tub", "indoor-games-fun", "kitchen", "laundry", "pool", "thermostat", "trash", "tv-streaming", "wifi"]}, {"heading": "Explore the Area", "sections": ["beer-wine", "dining", "emergency", "fishing", "golf", "grocery", "hiking-biking", "nature-parks", "shopping", "spas-salons", "tours", "random-recommendations", "water-activities", "waterfalls", "weather"]}], "sections": {"add-to-phone": {"id": "add-to-phone", "title": "Add This Guide To Your Phone", "icon": "smartphone", "groups": [{"title": "", "items": [{"title": "Add This Guide To Your Phone", "html": "<p>When you first access this guidebook on your phone, you'll notice a prompt to add it to your home screen. <strong>This is highly recommended<\/strong> because it makes the guide faster and easier to access. And it remains accessible offline. <\/p><p>Following the prompt will add an app icon to your phone. It's just like any other app, but without you needing to download anything or sign in! <\/p><p>Doing this means that every time you want to access the guide, you just need to tap the app instead of searching for the link in your inbox - much easier! <\/p><h2><strong>Adding the app if you’re an Apple user<\/strong><\/h2><p>If you have an Apple device, the \"Add to Home Screen\" option won’t appear for you unless you’re using Safari browser. Don’t worry, this is really simple to solve - just copy the guidebook link and paste it into Safari. From there, you can follow the prompts to add the guidebook to your home screen.<\/p><h2><strong>Always get the latest version of the guidebook <\/strong><\/h2><p>Our guidebook is regularly updated with information designed to help you get the most out of your stay. To avoid missing out on any of these updates, the app automatically updates every 24 hours. If you want to get the updates sooner, just refresh the screen every time you open the guidebook from your home screen - this way you’ll always get the latest version. To refresh the app, swipe the app closed, and tap the app icon again to fully reload. <\/p><h2><strong>Share your guide with your group<\/strong><\/h2><p>You can send the link to this guidebook to everyone who’s travelling with you. That way, everyone has access to all the information they’ll need (which means less hassle for the trip organizer!). <\/p>", "photoHidden": "eb62c72e322ed4e278d8a01199f7aad2.jpg", "id": "add-this-guide-to-your-phone"}]}]}, "welcome": {"id": "welcome", "title": "Welcome", "icon": "cloud-sun", "groups": [{"title": "", "items": [{"title": "Welcome to Tails & Trails Hideaway!", "html": "<p><strong>Welcome to Tails &amp; Trails Hideaway!<\/strong><br>Here at your fingertips is everything you should need for your stay with us, from planning your time before departure straight through checkout. In this easy-to-navigate link, you will find information about the cabin, ideas of things to do in the area, our Wi-Fi login credentials, and so much more.<\/p><p>In order to best enjoy your time in our home, we encourage you to add this \"app\" to your phone. All of the content will even be accessible when your phone is offline.<\/p><p>* It's not really an \"app\", but more a tool for easy access on your home screen <\/p><ul><li>For iPhone:<ul><li>Tap the square with arrow pointing up at the bottom of your screen<\/li><li>Select \"Add to Home Screen\"<\/li><\/ul><\/li><li>For Android:<ul><li>Tap \"Add to Home Screen\" where prompted when first accessing the site<\/li><\/ul><\/li><\/ul><p><strong>Print or Save a PDF<\/strong><br>If you would like to print certain pages ahead of traveling, or if you'd like to save a PDF to your device, just tap the print button above. It won't print right away, but will create a PDF which you can save or print.<\/p><p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.  We can be reached as follows:<\/p><ul><li>Preferred: Airbnb or VRBO message<\/li><li>Phone: 404-358-1552 (emergencies)<\/li><li>Instagram: @<a href=\"https://www.instagram.com/bk_stays/\">Bk_stays<\/a><\/li><li>Facebook: <a href=\"https://www.facebook.com/profile.php?id=61551815370553\">BK Stays<\/a><\/li><\/ul><p><strong>What Next?<\/strong><br>Please relax, unwind, have fun, and enjoy your stay!<\/p>", "photo": "c668bf33b45b8303212f8ac24bb16da9.jpg", "id": "welcome-to-tails-trails-hideaway"}]}]}, "check-in-arrival": {"id": "check-in-arrival", "title": "Check In + Arrival", "icon": "key-round", "groups": [{"title": "", "items": [{"title": "Driving Directions", "html": "<p><strong>Use Waze and/or Google Maps. <\/strong><\/p><p><strong>Address: <\/strong>128 Kismet Court, Ellijay, GA 30540<\/p><ul><li>Turn West on GA HWY 382<\/li><li>At the traffic circle, take the 2nd exit and stay on GA-382.<\/li><li>Turn right onto Beaver Lake Dr<\/li><li>Turn left onto Creekside Trail<\/li><li>Continue onto Water Oak Dr- Turn left onto Rivoli Ct<\/li><li>Turn left onto Villa Dr<\/li><li>Turn left onto Julie Ct<\/li><li>Julie Ct turns left and becomes Kismet Ct<\/li><\/ul>", "photo": "086591e685171217b89de3694e2b3326.jpg", "id": "driving-directions"}, {"title": "Access Codes / Instructions", "html": "<p>The Access Code for the front door is<\/p><p>1552<\/p><p>To lock the door, simply press the lock button. Please make sure all external doors are locked whenever you leave.<\/p><p>* If for some reason the code doesn't work please call me at <a href=\"tel:404-358-1552\">404-358-1552<\/a>. I will get you the lockbox code for the spare key!<\/p>", "photo": "730742e2babb8d2cedbe0a30eac61d46.jpg", "id": "access-codes-instructions"}, {"title": "Coosawattee Resort Gate Access", "html": "<p>You will need to provide the following information to the Gate Security once you arrive to the resort.<\/p><p><strong>Guest Name <\/strong>- Give The Full Name of The Person Who Booked<\/p><p><strong>BF700R<\/strong> - This Is Your Lot Number<\/p><p>If you are bringing multiple vehicles, please make sure all vehicles have this info.<\/p>", "photo": "108d317d1940c820452676b7cc18696e.jpg", "id": "coosawattee-resort-gate-access"}, {"title": "4:00 PM Check-in", "html": "<p>If you would like an early check-in, please see our <a href=\"#/info/check-in-arrival/early-check-in-half-day-stay-option\">Early Check In (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 4:00 PM is a strict check-in time. If you are arriving early, take a look at the Explore the Area section. We've listed a few things to do around the area while we prepare the home!<\/p>", "photo": "11e339c716ed8af07a28c05e286c2caa.jpg", "id": "4-00-pm-check-in"}, {"title": "Early Check In (Half Day Stay Option)", "html": "<p>Want to get here early? Add a <strong>Half Day Stay<\/strong> and you can arrive as early as <strong>8:00 AM<\/strong> on your arrival day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer early check-in because of our tight cleaning and maintenance schedule.<\/p>", "photo": "6db9b8952aaf5792e4af093537545794.jpg", "id": "early-check-in-half-day-stay-option"}]}]}, "check-out-departure": {"id": "check-out-departure", "title": "Check Out + Departure", "icon": "hand", "groups": [{"title": "", "items": [{"title": "10:00 AM Check-out", "html": "<p>If you would like a late check-out, please see our <a href=\"#/info/check-out-departure/late-check-out-half-day-stay-option\">Late Check Out (Half Day Stay Option)<\/a> section<\/p><p>Otherwise - 10:00 AM is a strict check-out time. <\/p>", "photoHidden": "ea9c00f35f36edb8d89dcc92e7f562cc.jpg", "id": "10-00-am-check-out"}, {"title": "Late Check Out (Half Day Stay Option)", "html": "<p>Not ready to leave? Add a <strong>Half Day Stay<\/strong> and you won't need to check out until <strong>8:00 PM<\/strong> on your departure day.<\/p><p>We reserve the rest of that day just for you at a discounted rate, as long as the home is available. Send us a message and we'll check the calendar and send you the price.<\/p><p>Without a Half Day Stay, we usually can't offer late check-out because of our tight cleaning and maintenance schedule.<\/p>", "photoHidden": "6db9b8952aaf5792e4af093537545794.jpg", "id": "late-check-out-half-day-stay-option"}, {"title": "Extended Stay?", "html": "<p>Would you like to add another night? If we have availability the day before or after your reservation, we would love to offer you that extra night at a great discount. We'll even cover the taxes and fees! Just let us know if your travel plans are flexible and we will make sure to accommodate the changes!<\/p>", "photoHidden": "585cb6b5ac72b31289b8dae13c068a03.jpg", "id": "extended-stay"}, {"title": "Check-out Process", "html": "<p>Standard check-out is at 10:00 AM on your departure date (Unless you've paid for a late check-out).<\/p><p>When you've concluded your stay, technically, you can just leave no questions asked lol :) But, if you really wanted to give our cleaning team some love, we would appreciate it if you would take care of a few simple things:<\/p><ul><li>Dishwasher - load and start the dishwasher<\/li><li>Trash - No Loose Trash Please - remove the trash, place it in the black can(s)<\/li><li>Towels - place used towels in the shower<\/li><li>Lock-Up - ensure both doors are locked<\/li><\/ul><p>We hope you had a wonderful stay and wish you safe travels back home!<\/p>", "id": "check-out-process"}, {"title": "Lost and Found", "html": "<p>Please triple-check the home before departing to ensure you have not left anything behind. Common items left behind include phone chargers, computer cords, passports/licenses, clothes, electronics, eyeglasses, toiletries/makeup, documents, and toys.<\/p><p>Please send a message the moment you realize you've left something behind. <br><br>We completely understand that things can get left behind — and we’re more than happy to help get your items back to you! We’ll gladly ship your lost item using the postal service or carrier of your choice (standard, express, or overnight). <br><br>We kindly ask for the shipping cost, plus a $20 service fee to cover the time and materials for packaging and handling. Be certain to include:<\/p><ul><li>Item description<\/li><li>Where you think you may have left the item<\/li><li>The name on the reservation<\/li><\/ul><p>Just let us know how you’d like it sent, and we’ll take care of the rest!<\/p>", "photoHidden": "8da278ec14e085d81ebe06c22b24af10.jpg", "id": "lost-and-found"}]}]}, "rules": {"id": "rules", "title": "Rules and Regulations", "icon": "book-open", "groups": [{"title": "", "items": [{"title": "Age Requirement", "html": "<p>The minimum age requirement to book is 25 years of age. The home is child friendly, but not childproof, and may not be suitable for infants or children without adult supervision.<\/p>", "id": "age-requirement"}, {"title": "Confetti / Glitter", "html": "<p><strong>No Confetti or Glitter<\/strong><br>We understand that special occasions call for celebration - and sometimes decorations! However, confetti and glitter are extremely difficult to clean and can cause damage to furniture and floors. Any evidence of confetti or glitter left behind will incur additional cleaning fees. Please celebrate responsibly and help us keep the home in great condition - no confetti or glitter, please.<\/p>", "id": "confetti-glitter"}, {"title": "Damages", "html": "<p>Guests are financially responsible for any damage, theft, missing items, or violations of house rules during their stay. You could be charged for: Property damage or theft; Unauthorized pets; Excessive cleaning or evidence of smoking; Exceeding occupancy or parking limits; Any other violations outlined in this agreement. You will be notified in writing if any damage is found. Major damage that delays the next check-in may result in additional charges for guest relocation or compensation. Please report any existing damage at check-in, and notify us right away if anything breaks or is damaged during your stay, even if it’s small. We understand accidents happen and can often replace or repair items quickly if we're informed. Guests are responsible for damage caused by misuse or negligence.<\/p>", "id": "damages"}, {"title": "Fire Safety and Prevention", "html": "<p>Guest agrees to comply with all local, county, and state fire restrictions, including any active burn bans or official fire safety regulations. Guest is responsible for helping maintain a fire-safe environment throughout their stay. This includes, but is not limited to; Ensuring that all outdoor fires (e.g., bonfires or fire pits) are fully extinguished after use, before going to bed, and before vacating the property; Never leaving open flames or burning embers unattended; Using only designated fire areas and keeping all fires small, controlled, and manageable; Ensuring fire extinguishers located in the home are accessible at all times and used in case of fire emergencies.<\/p><p>Additionally, Guest(s) acknowledges that outdoor grills must be cleaned and properly maintained after each use to prevent fire hazards. Guest agrees to: Clean the grill thoroughly after each use; Remove all grease and dispose of it safely in the trash (never on the ground or around the property); Ensure the grill is turned off, left in safe, clean, and operable condition, and covered if applicable; Keep a fire extinguisher nearby when using the grill.<\/p><p>Failure to follow fire safety guidelines may result in fines, eviction, or financial liability for any resulting damages.<\/p>", "id": "fire-safety-and-prevention"}, {"title": "Garbage Disposal", "html": "<p>Liquids Only Please! There Is Not A Garbage Disposal In This Home!<\/p><p>Please do not place any debris, cooking oils, grease, coffee, egg shells, food scraps, or anything solid down the kitchen sink drain. <\/p>", "id": "garbage-disposal"}, {"title": "Jacuzzi", "html": "<p>Never Add Any Foreign Substance To The Jacuzzi (No Bubbles or Soaps)!<\/p><p>Always Put The Cover Back On When Not In Use!<\/p><p>Do Not Raise The Temp Above 102°F<\/p><p>The jacuzzi is thoroughly inspected after each guest. Failure to adhere will cause additional maintenance and cleaning measures, or worse, damage to the unit. Fines will be imposed if evidence of foreign substance or damage is found during inspection. <\/p>", "photoHidden": "458c55cc4f0cc49651a8bd603d8b5323.jpg", "id": "jacuzzi"}, {"title": "No Commercial Use", "html": "<p>This home is for private stays only. No commercial use of any kind is allowed. That means no retreats, workshops, classes, shoots or paid events, no charging admission, no selling or renting rooms, and no using our photos or property name to promote anything.<\/p><p>Planning something special? Ask us before you arrive. Events require our written approval and a signed agreement.<\/p><p>Violations will result in <strong>immediate eviction without refund<\/strong>, <strong>loss of your security deposit<\/strong>, a report to the platform you booked through, and possible legal action to recover damages.<\/p>", "id": "no-commercial-use"}, {"title": "Occupancy - Max 6 Person(s)", "html": "<p>This home has a maximum occupancy of <strong>6 person(s)<\/strong>, and no more than 6 people may be on the property at any time. Occupancy is set by square footage, bedroom count and septic capacity.<\/p><p>Please contact us before arrival if you'd like to request additional guests. Unapproved guests or exceeding the occupancy limit <strong>will result in the loss of your security deposit<\/strong> and may lead to immediate eviction without refund.<\/p>", "id": "occupancy-max-6-person-s"}, {"title": "Pet Policy - Max 2 Dogs (with approval)", "html": "<p>This home is pet-friendly, so you can bring your furry friend from home! <strong>Max 2 dogs allowed<\/strong> per stay, with approval.<\/p><p>All pets must be on your reservation. Please let us know beforehand so we can take the proper cleaning measures. A <strong>$115 pet fee<\/strong> will be added to your reservation for any approved pet before arrival.<\/p><p>If you bring a pet without notifying your hosts, you will be charged <strong>double<\/strong> for any unapproved pet.<\/p>", "id": "pet-policy-max-2-dogs-with-approval"}, {"title": "Reservation Adjustments", "html": "<p>If you need to make any change in your stay, for example, regarding the number of guests, bringing a service animal or anything at all, please let us know ahead of time so we can accommodate you. However, if you do not disclose any changes, like an animal or extra guests (above max occupancy) you could be subject to a reservation cancellation without refund. <\/p>", "id": "reservation-adjustments"}, {"title": "Resort Amenities Pass", "html": "<p>There is a $250 fine/charge if the Resort Passes are not returned and in place after each stay.<\/p>", "id": "resort-amenities-pass"}, {"title": "Security Camera", "html": "<p>Guests acknowledge and accept there are cameras located on the exterior of the property. Guests hereby acknowledge that the cameras location records video directly in front of the front entrance door and leading to the parking area, and this constitutes a public area. Guests understand that video may be captured, and no conversations located within this area may be deemed confidential. The intent of this camera is not to infringe on the privacy of Guests, but to serve as a safety and security measure.<\/p>", "id": "security-camera"}, {"title": "Septic and Plumbing", "html": "<p>Please <strong>only put toilet paper<\/strong> in the toilet and throw the remaining in the trash!<\/p><p>Tampons, baby wipes, paper towels, or anything other than toilet paper in the toilet will clog the drain/tank. This can result in clogged toilets, and septic damage and will result in damage fees.<\/p>", "id": "septic-and-plumbing"}, {"title": "Smoking", "html": "<p>Smoking of any kind (cigarettes, cigars, pipes, vaping, e-cigarettes, marijuana or other drugs) is not allowed anywhere on the property, indoors or outdoors, unless you have our written permission in advance.<\/p><p>Evidence of smoking, including smoke odor, ash, butts, paraphernalia or related trash left inside or outside the home, <strong>will result in the loss of your security deposit<\/strong>, plus the cost of odor removal and cleaning, and may result in eviction without refund.<\/p>", "id": "smoking"}, {"title": "Trash", "html": "<p>This is very important.<\/p><p>Trash is collected every Monday and Thursday morning (varies on holidays).<\/p><p>Do Not Leave Trash Out In The Open. Secure your trash in the kitchen trash bags, place them within the black trash cans, and ensure the trash receptacle is locked. <\/p><p>There have been plenty of bears visiting the mountain in the past, and unsecured trash can cause a huge problem for the cleaning team later. <\/p><p>The Trash Must Be Broken Down - In A Bag - And In The Receptacle. Do Not Leave Un-Bagged Trash Anywhere Or You Could Be Charged An Additional Cleaning Fee.<\/p>", "id": "trash"}]}]}, "cancellation-policy": {"id": "cancellation-policy", "title": "Cancellation Policy", "icon": "circle-x", "groups": [{"title": "", "items": [{"title": "Cancellation Policy", "html": "<p>Our cancellation policy varies by platform (Airbnb, VRBO, Direct, etc.) and will have been clearly stated at the time of booking under one of the following categories: strict, firm, moderate, or flexible.<\/p><p>We strongly recommend purchasing travel insurance to protect your investment. If you purchased travel insurance, please contact your provider for help with cancellations or disruptions.<\/p><p><strong>State of Emergency / Evacuations<\/strong><\/p><p>If travel insurance was not purchased, cancellations are handled per the terms of your reservation. Exceptions may be made only when <strong>both<\/strong> of the following apply:<\/p><ul><li>A <strong>Governor-issued State of Emergency<\/strong> has been declared for <strong>Gilmer County, Georgia<\/strong> (the county where the home is located), <strong>and<\/strong><\/li><li>A <strong>mandatory evacuation order or travel restriction<\/strong> is actively in effect for the property's address during your reservation dates.<\/li><\/ul><p>General weather advisories or conditions affecting other areas do not qualify.<\/p><p><strong>If the Home Becomes Unavailable<\/strong><\/p><p>In the event the property becomes unavailable due to circumstances beyond the host's control, including but not limited to fire, flood, structural damage, utility failure, or a government-declared emergency, the host reserves the right to cancel a confirmed reservation. In such circumstances, guests will receive a full refund of all amounts paid and the host's liability shall be limited solely to that refund.<\/p>", "id": "cancellation-policy"}]}]}, "about-us": {"id": "about-us", "title": "About Us", "icon": "users", "groups": [{"title": "", "items": [{"title": "About Your Hosts", "html": "<p>Our first trip to North Georgia was way back in the summer of 2021 and we undeniably fell in love. The mountain vibes left such a good impression, that we decided as a family to find a home away from home. The surrounding area has so much to offer for families, friends, and couples during every season of the year. We have had the chance to experience so much that Blue Ridge, Ellijay, and the North Georgia Mountains have to offer, but we still have a long bucket list waiting for our next adventure. We have a 6-year-old daughter and a 3-year-old son and love traveling and spending time exploring new places as a family.<\/p>", "photo": "about-us-family-collage.jpg", "photoFit": "full", "id": "about-your-hosts"}]}]}, "contact-us": {"id": "contact-us", "title": "Contact Us / Book Again", "icon": "phone", "groups": [{"title": "", "items": [{"title": "Thank You For Staying With Us", "html": "<p><strong>Thank you for staying with us, and we hope you enjoyed your stay.<\/strong> If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time. <\/p><p><strong>We love online reviews!<\/strong><\/p><p>Vrbo and Airbnb automatically sends you a review request. All you need to do is click the \"leave a review\" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. Was it the comfy beds; the local information and recommendations; or perhaps the location and all the fun activities to do at the home?<\/p><p><br><strong>Thank you!<\/strong><\/p><p>Brandon and Katharina <\/p>", "photoHidden": "4d239b49ed0744691981d3decf88b377.jpg", "id": "thank-you-for-staying-with-us"}, {"title": "Returning Guests", "html": "<p>We would love to have you stay again! In fact, please take advantage of booking directly with us at <a href=\"https://www.bkstays.com/about-us\">bkstays.com <\/a>- please reach out to us on Instagram, Facebook, or directly to Brandon at 404 - 358 - 1552. <\/p>", "photoHidden": "5e53f078d45d701f01a19dcba10f0cc7.jpg", "id": "returning-guests"}, {"title": "Follow Us On Social Media", "html": "<p>Let's Be Social! Follow Us On Social Media Below<\/p><p>Facebook: BK Stays<\/p><p>Instagram: @bk_stays<\/p>", "photoHidden": "067e96592ab64bb41d8e0f51c9754500.jpg", "id": "follow-us-on-social-media"}, {"title": "How To Contact Us", "html": "<p><strong>Contacting Us<\/strong><br>We pride ourselves on swiftly meeting guest needs.  We can be reached at the contact info below:<\/p><ul><li>Message: through Airbnb / VRBO (simple assistance)<\/li><li>Phone: 1-404-358-1552 (emergencies)<\/li><li>Instagram or Facebook @ bk_stays<\/li><\/ul>", "photoHidden": "4f717eaaf0303b1fec1a0ee821f299a1.jpg", "id": "how-to-contact-us"}]}]}, "wifi": {"id": "wifi", "title": "WiFi / Internet Details", "icon": "wifi", "groups": [{"title": "", "items": [{"title": "Wi-Fi / Internet Details", "html": "<p>There is free Wi-Fi for your use. The details are: <br><br>Network - Kismet<\/p><p>Password - Kismet128<br><br>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us.<\/p>", "photo": "5ed7c444a9811d008c50a348f27c69d5.jpg", "id": "wi-fi-internet-details"}]}]}, "bbq-grill": {"id": "bbq-grill", "title": "BBQ Grill + Propane", "icon": "flame", "groups": [{"title": "", "items": [{"title": "Propane Grill", "html": "<p><strong>To light the grill:<\/strong><\/p><p>*Open the blue valve on the gas line by turning it parallel with the line<\/p><p>* Set the timer above to the desired amount (for safety so we don't forget to turn it off)<\/p><p>* Turn the specific knob(s) to the ignition symbol<\/p><p>* Press the starter button<\/p><p>Don't forget to turn off all the burners, turn off the timer, and close the valve (perpendicular). <\/p><p>Please try and clean up a bit after yourself on there for the next guests ;)<\/p>", "photo": "b2b2d585beac82202c1f32552b150001.jpg", "id": "propane-grill"}]}]}, "resort": {"id": "resort", "title": "Coosawattee River Resort", "icon": "star", "groups": [{"title": "Campgrounds, Parks, and Pavillions", "items": [{"title": "Canoe Park", "html": "<p><strong>Address:<\/strong> 3919 Newport Drive<\/p><p>Canoe Park is a peaceful riverside spot in the Eagle Mountain section of the resort, surrounded by private homes. It's a nice quiet place to relax, read or picnic, with shaded picnic tables. There is no camping here. It's a favorite fishing spot, so bring your Georgia fishing license.<\/p><p>Questions or reservations: Coosawattee River Resort Reservations 706-640-4038 or Customer Service 706-640-4010 (office open Monday to Saturday, 9 AM to 5 PM).<\/p>", "loc": [34.655289, -84.542576], "pin": "parks_and_nature", "id": "canoe-park"}, {"title": "East Park", "html": "<p><strong>Address:<\/strong> 449 Cherokee Drive<\/p><p>East Park is the resort's riverside tent-camping park, with 29 sites, each with a picnic table and fire ring. It also has a pavilion that's great for family reunions, a basketball court and a one-mile walking loop. A fun spot for families right on the river.<\/p><p>Campsite and pavilion reservations: 706-640-4038 or Reservations@mycrra.com.<\/p>", "loc": [34.675542, -84.510794], "pin": "parks_and_nature", "id": "east-park"}, {"title": "Fish Trap Park", "html": "<p><strong>Address:<\/strong> 491 Zeblin Road<\/p><p>Fish Trap Park is named for the Native American \"V\" fish trap you can still see in the river. It has 26 tent sites and 6 RV sites with water and electric hookups, plus a dump station for RVs and trailers up to 30 feet. A swinging suspension bridge crosses the river to the Riverside Pool Center.<\/p><p>With a spacious pavilion, children's play areas and open space, it's well suited for family reunions, birthdays and other gatherings. Amenities include restrooms, charcoal grills and fire rings.<\/p><p>Questions or reservations: Coosawattee River Resort Reservations 706-640-4038 or Customer Service 706-640-4010 (office open Monday to Saturday, 9 AM to 5 PM).<\/p>", "loc": [34.675292, -84.527494], "pin": "parks_and_nature", "id": "fish-trap-park"}, {"title": "North Park", "html": "<p><strong>Address:<\/strong> 208 Edgewater Drive<\/p><p>North Park is the resort's smallest park, a quiet riverside spot for fishing and enjoying nature. It has a small pavilion near the bathhouse that can be reserved (Reservations@mycrra.com or 706-640-4038).<\/p>", "loc": [34.662117, -84.516611], "pin": "parks_and_nature", "id": "north-park"}]}, {"title": "Outdoor Swimming Pool(s)", "items": [{"title": "Foxhound Pool", "html": "<p><strong>Season:<\/strong> Memorial Day through Labor Day, open daily 11 AM to 7 PM (closed for the season the rest of the year)<br><strong>Address:<\/strong> 186 Foxhound Drive<\/p><p>Foxhound Pool is one of the quietest, most relaxed pools in the resort, tucked among the trees. It has a picnic area, pavilion, changing rooms and restrooms.<\/p><p>Questions or reservations: Coosawattee River Resort Reservations 706-640-4038 or Customer Service 706-640-4010 (office open Monday to Saturday, 9 AM to 5 PM).<\/p>", "photo": "febc606153e072d4092285f0d885aa05.jpg", "loc": [34.670366, -84.50925], "pin": "swimming", "id": "foxhound-pool"}, {"title": "Riverside Pool Center", "html": "<p><strong>Season:<\/strong> Memorial Day through Labor Day, open daily 9 AM to 8 PM (closed for the season the rest of the year)<br><strong>Address:<\/strong> 545 Ogden Drive<\/p><p>The Riverside Pool Center is a scenic outdoor pool for all ages. The main pool is 3 to 5 feet deep throughout, and a separate kiddie pool is perfect for toddlers. There are picnic tables and a seasonal Snack Shack (daily 12 to 6 PM in season). It's a short walk across the suspension bridge from Fish Trap Park.<\/p><p>Questions or reservations: Coosawattee River Resort Reservations 706-640-4038 or Customer Service 706-640-4010 (office open Monday to Saturday, 9 AM to 5 PM).<\/p>", "photo": "0947e665f0207559d622da155a83c402.jpg", "loc": [34.674893, -84.53038], "pin": "swimming", "id": "riverside-pool-center"}]}, {"title": "Recreation Center", "items": [{"title": "Arcades / Game Room", "html": "<p><strong>Open:<\/strong> Daily 6 AM to 8:30 PM, in the Recreation Center (126 Mango Lane)<\/p><p>The Game Room has coin-operated arcade games, pool tables and an air hockey table, a fun spot for the whole family to unwind and enjoy some friendly competition.<\/p>", "photo": "ace34ff462d4687738303850e230b70e.jpg", "loc": [34.657078, -84.576184], "pin": "resort_amenities", "id": "arcades-game-room"}, {"title": "Fitness Center", "html": "<p><strong>Open:<\/strong> Daily 6 AM to 8:30 PM, in the Recreation Center (126 Mango Lane)<\/p><p>The fitness center has treadmills, weight machines, free weights, rowing machines and exercise bikes, plus satellite TV and Wi-Fi, so you can keep up your routine during your stay.<\/p>", "photo": "5a7ca319787b1742869c115b39ad5b4f.jpg", "loc": [34.657078, -84.576184], "pin": "resort_amenities", "id": "fitness-center"}, {"title": "Indoor Swimming Pool", "html": "<p>Open Daily: 6:00 AM - 8:00 PM<\/p><p>The indoor pool at Coosawattee River Resort's Recreation Center offers a year-round aquatic experience in a comfortable, climate-controlled environment. This enclosed, heated Junior Olympic-sized pool features a large shallow end, making it ideal for swimmers of all ages and skill levels. Adjacent to the main pool is a heated kiddie pool, providing a safe and enjoyable space for young children to splash and play. Whether you're looking to swim laps, relax in the water, or enjoy family time, the indoor pool area serves as a welcoming retreat regardless of the season.<\/p>", "photo": "40346d5f3fd52ff84e80b466814de17d.jpg", "loc": [34.657078, -84.576184], "pin": "resort_amenities", "id": "indoor-swimming-pool"}, {"title": "Miniature Golf Course", "html": "<p><strong>Open:<\/strong> Daily 6 AM to 8:30 PM, next to the Recreation Center (126 Mango Lane)<\/p><p>The 18-hole miniature golf course is a fun outdoor activity for all ages. Check out putters and balls at the Recreation Center desk.<\/p>", "photo": "3e3944be2be0390773c9c4a837d32216.jpg", "loc": [34.657078, -84.576184], "pin": "golfing", "id": "miniature-golf-course"}, {"title": "Tennis, Pickleball, and Basketball Courts", "html": "<p><strong>Open:<\/strong> Daily 6 AM to 8:30 PM, next to the Recreation Center (126 Mango Lane)<\/p><p>Outdoor courts for tennis, pickleball and basketball. Bring your own equipment or check it out at the Recreation Center desk.<\/p>", "photo": "78c9d0c9ce27620dfd1c944b9a2c78ed.jpg", "loc": [34.657078, -84.576184], "pin": "fitness_exercise", "id": "tennis-pickleball-and-basketball-courts"}]}]}, "fireplace-firepit": {"id": "fireplace-firepit", "title": "Fireplace + Firepit", "icon": "flame-kindling", "groups": [{"title": "", "items": [{"title": "Indoor Fireplace", "html": "<p>Available Seasonally - September 1st - June 1st<\/p><p><strong>Fireplace Instructions<\/strong><\/p><p>The fireplace remote control is on the wall. Please only use the wall remote to operate it, and please do not adjust any settings on the actual fireplace - it is already programmed! There is a 30-60-120 minute timer on the remote to control your desired usage. The pilot light will always stay lit, even when it's not in use. Please do not move or make any adjustments to the logs otherwise additional charges could apply for a technician to come fix and re-adjust everything. Stay Warm &amp; Enjoy!<\/p>", "photo": "1e12384caebbfbef80ef99c863955129.jpg", "id": "indoor-fireplace"}, {"title": "Outdoor Fireplace", "html": "<p>There will be a small stack of wood for you to enjoy a nice fire outside. This should be sufficient for 1-2 fires. Also, there is a small tin box of starters to get the fire going strong (4-5 is typically enough). If you need any additional firewood it is the responsibility of the guest(s).<\/p>", "photo": "9d6883f025899c64efd3221fbee76a26.jpg", "id": "outdoor-fireplace"}]}]}, "trash": {"id": "trash", "title": "Trash + Garbage Disposal", "icon": "trash-2", "groups": [{"title": "", "items": [{"title": "Garbage Disposal", "html": "<p>Liquids Only Please! There Is Not A Garbage Disposal In This Home!<\/p><p>Please do not place any debris, cooking oils, grease, coffee, egg shells, food scraps, or anything solid down the kitchen sink drain. <\/p>", "id": "garbage-disposal"}, {"title": "Trash", "html": "<p>This is very important.<\/p><p>Trash is collected every Monday and Thursday morning (varies on holidays).<\/p><p>Do Not Leave Trash Out In The Open. Secure your trash in the kitchen trash bags, place them within the black trash cans, and ensure the trash receptacle is locked. <\/p><p>There have been plenty of bears visiting the mountain in the past, and unsecured trash can cause a huge problem for the cleaning team later. <\/p><p>The Trash Must Be Broken Down - In A Bag - And In The Receptacle. Do Not Leave Un-Bagged Trash Anywhere Or You Could Be Charged An Additional Cleaning Fee.<\/p>", "id": "trash"}]}]}, "hot-tub": {"id": "hot-tub", "title": "Hot Tub / Jacuzzi", "icon": "bath", "groups": [{"title": "", "items": [{"title": "Hot Tub / Jacuzzi", "html": "<p>Please Be Patient and Conscious When Using Jacuzzi Controls.<\/p><p>Do not push too many buttons at once or too often - this will put the Jacuzzi into Sleep Mode and It Will Not Heat! <\/p><p>Upon your arrival, the jacuzzi might* have a slightly lowered temperature and it may take a moment to heat up.<\/p><p>Simply raise the temperature by using the arrow up buttons until the screen shows a different temperature.<\/p><p>We recommend an ideal temperature of 101°F. <\/p>", "photo": "458c55cc4f0cc49651a8bd603d8b5323.jpg", "id": "hot-tub-jacuzzi"}]}]}, "indoor-games-fun": {"id": "indoor-games-fun", "title": "Indoor Games + Fun", "icon": "gamepad-2", "groups": [{"title": "", "items": [{"title": "Cards, Games + More", "html": "<p>We try to keep a great selection of puzzles, books, board games, and card games for the whole family. Feel free to help yourself!<\/p><p>If something is missing or broken, please let us know so we can order a replacement.<\/p><p>Please keep everything neat and tidy for the next guests. Missing puzzle pieces or half a set of chess pieces isn't fun for anyone :)<\/p>", "photo": "generic-chess-board.jpg", "id": "cards-games-more"}]}]}, "kitchen": {"id": "kitchen", "title": "Kitchen, Supplies + Appliances", "icon": "cooking-pot", "groups": [{"title": "", "items": [{"title": "Kitchen + Supplies + Appliances", "html": "<p>We have a fully stocked kitchen with a stainless steel appliance package. We try to provide everything you may need, but we're not perfect. If you have any suggestions for small appliances, dishware, flatware, glassware, or even dry goods that would be beneficial - let us know! We would be happy to see if it's possible to place an Amazon/Walmart/Grocery delivery order for you during your stay :)<\/p>", "id": "kitchen-supplies-appliances"}]}]}, "laundry": {"id": "laundry", "title": "Laundry", "icon": "washing-machine", "groups": [{"title": "", "items": [{"title": "Laundry", "html": "<p>We do have a private washer and dryer located in the home. There should be a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in, close the door, and hit start. <\/p>", "photo": "794607d57a2c8fc964701bb9c7a73b7a.jpg", "id": "laundry"}]}]}, "pool": {"id": "pool", "title": "Pool", "icon": "waves", "groups": [{"title": "", "items": [{"title": "Pool Waiver", "html": "<p>By reserving this home you have agreed to the following rules below.<\/p><p><strong>Assumption of Risk:<\/strong><\/p><p>We intend to utilize the swimming pool(s). We are aware and understand there are inherent risks associated with the use of these facilities and we recognize and fully understand the risks. We are aware and understand that our use of the swimming pool(s) is a potentially dangerous activity and involves the risk of personal injury, pain, suffering, temporary or permanent disability, death, property damage, and/or financial loss. We are aware and understand that at no time there will be a lifeguard on duty while we use such facilities. We are aware of and understand that the use of the pool facilities involve certain risks, including but not limited to:<\/p><ul><li>the risk of injury resulting from possible malfunction of pool equipment<\/li><li>the risk of injuries resulting from tripping/falling over obstacles in the pool area.<\/li><li>the risk of injuries resulting from unsupervised divers and swimmers colliding<\/li><li>the risk of other injuries resulting from participating in any action in the pool<\/li><\/ul><p>We recognize and fully understand that the above list is not a complete or exhaustive list of all possible risks; the list only provides examples of types of risks we are assuming. <strong>NOTWITHSTANDING THESE RISKS, WE ACKNOWLEDGE THAT WE ARE VOLUNTARILY ACCESSING THE SWIMMING FACILITIES AND PARTICIPATING IN THE ACTIVITY WITH KNOWLEDGE OF THE DANGERS INVOLVED. WE HEREBY AGREE TO ACCEPT AND ASSUME ALL RISKS OF ILLNESS, PERSONAL OR PSYCHOLOGICAL INJURY, PAIN, SUFFERING, TEMPORARY OR PERMANENT DISABILITY, DEATH, PROPERTY DAMAGE, AND/OR FINANCIAL LOSS ARISING THEREFROM, WHETHER CAUSED BY THE ORDINARY NEGLIGENCE OF THE COMPANY/OWNER/HOST OR OTHERWISE. <\/strong><\/p><p>We further agree that in exchange for being allowed to use the pool, I fully intent to and choose to give up legal rights and we agree TO WAIVE AND RELEASE ANY ANY AND ALL CLAIMS that we have or may have in the future against the resort/owner/host and representatives from any and all liability for any loss, damage, injury, expense, or other cost that we may suffer or that our next of kin may suffer in connection with our use of the Releasees pool or pool area to any cause whatsoever, INCLUDING NEGLIGENCE ON THE PART OF THE RELEASEES. We further agree TO HOLD HARMLESS AND INDEMNIFY THE RELEASEES from any and all claims, whether now known or hereafter known, and release all liability to the property, or personal injury to, any third party, resulting from the use of the pool or pool area. We further agree that this Waiver, Release, and Agreement is fully effective and shall be effective and binding upon us, and our heirs, next of kin, executors, administrators, and assigns or anyone else authorized to act on our behalf or on behalf of our estate.<strong> WE ACKNOWLEDGE THAT WE HAVE READ AND UNDERSTOOD ALL OF THE TERMS OF THIS RELEASE AND THAT WE ARE VOLUNTARILY GIVING UP SUBSTANTIAL LEGAL RIGHTS, INCLUDING THE RIGHT TO SUE THE RESORT/OWNER/HOST.<\/strong><\/p><p>We further agree to abide by the posted rules listed below. <\/p>", "id": "pool-waiver"}]}]}, "tv-streaming": {"id": "tv-streaming", "title": "TVs + Streaming", "icon": "tv", "groups": [{"title": "", "items": [{"title": "TVs + Streaming", "html": "<p>We have high-speed Wi-Fi for all of your streaming needs!<\/p><p>There are Smart TVs throughout the entire home.<\/p><p>Go to the TV Home Screen<\/p><p>Search For (or Download) The Channel App You Want To Watch &amp; Login to your TV Provider.<\/p><p>Please don't hesitate to reach out if you need provider login assistance!<\/p>", "photo": "729ecb38918b0e99bc0a0ec5fa74c6d2.jpg", "id": "tvs-streaming"}]}]}, "thermostat": {"id": "thermostat", "title": "Thermostat", "icon": "thermometer", "groups": [{"title": "", "items": [{"title": "Heating / Cooling", "html": "<p>There is a smart thermostat on the wall that allows you to control the temperature of the home. When you arrive, the thermostat should be set to keep the temperature between 70-74°F - but you can adjust if you need. If you're running the air conditioning or heating - Please keep all windows and outside doors closed to ensure it operates at maximum efficiency. We recommend a setting of about 72°F which we find keeps the place at a comfortable temperature.<\/p>", "photo": "6dcf0c01138989074a4f45f1ba6e2775.jpg", "id": "heating-cooling"}]}]}, "beer-wine": {"id": "beer-wine", "title": "Beer and Wine", "icon": "wine", "groups": [{"title": "Beer and Breweries", "items": [{"title": "Angry Hops Brewing", "html": "<p>For a laid-back afternoon, <strong>Angry Hops Brewing<\/strong> in downtown Blue Ridge is a great spot to grab a craft beer. The rotating tap list runs from hazy and West Coast IPAs to lagers, brown ales and seltzers, and there is indoor and patio seating. Well-behaved, leashed dogs are welcome inside and out. There is no kitchen (just packaged snacks), but outside food is allowed and food trucks stop by regularly. Tuesday bingo is a local favorite.<\/p><p><strong>Address:<\/strong> 341 E. Main St., Blue Ridge, GA 30513<br><strong>Website:<\/strong> <a href=\"https://angryhopsbrewing.com/\">angryhopsbrewing.com<\/a> (check their website or Facebook for current hours and food truck schedule)<\/p>", "photo": "90405d0031118f95198cb5f18949a87e.jpg", "loc": [34.869628, -84.320314], "pin": "brewery_pub", "id": "angry-hops-brewing"}, {"title": "Cartecay River Brewing Co.", "html": "<p>A friendly microbrewery in East Ellijay inspired by the Appalachian Mountains and the Cartecay River. Expect a rotating lineup of IPAs, sours, stouts and lagers, a pet-friendly patio, and live music and events on select nights (see their calendar).<\/p><p><strong>Address:<\/strong> 26 River Terrace, #1A, East Ellijay, GA 30540<br><strong>Phone:<\/strong> (706) 273-2728<br><strong>Website:<\/strong> <a href=\"https://www.cartecayriverbrewing.com/\">cartecayriverbrewing.com<\/a><\/p><p>Check their website for current hours.<\/p>", "photo": "a550203107031262ab7da231556e0f3f.jpg", "loc": [34.682175, -84.491733], "pin": "brewery_pub", "id": "cartecay-river-brewing-co"}, {"title": "Copperhill Brewery", "html": "<p>A women-owned craft brewery and distillery just across the state line from McCaysville. In October 2025 the taproom moved to a new riverside spot in downtown Copperhill, TN, with river views, more parking and the WattsUp Rollin' Grub food truck on site. Expect lagers, dunkels, hazy IPAs and more.<\/p><p><strong>Taproom:<\/strong> 155 Ocoee St., Copperhill, TN 37317<br><strong>Phone:<\/strong> (423) 548-3030<br><strong>Website:<\/strong> <a href=\"https://copperhillbrewery.com/\">copperhillbrewery.com<\/a><\/p><p>The taproom is open 7 days a week; check their website for current hours. Their production brewery in Ducktown, TN hosts events and has limited hours.<\/p>", "photo": "f599fd135d49e5f3e747bdc601f3bf7d.jpg", "loc": [34.98895, -84.37228], "pin": "brewery_pub", "id": "copperhill-brewery"}, {"title": "Fannin Brewing Company", "html": "<p>A hometown micro-brewery in Blue Ridge specializing in German-style beers. The owners combined a love of German beer with their winemaking experience, and they use local ingredients and name their beers after the mountain scenery around them. Their motto: \"Fresh Air, Fresh Water, Fresh Beer.\"<\/p><p><strong>Address:<\/strong> 3758 E. First St., Blue Ridge, GA 30513<br><strong>Phone:<\/strong> (706) 258-2762<br><strong>Website:<\/strong> <a href=\"https://www.fanninbrewingcompany.com/\">fanninbrewingcompany.com<\/a><\/p><p>Hours vary, so check their website or call ahead.<\/p>", "photo": "d95d46c9f2f2c7edd834ef661c849a83.jpg", "loc": [34.87066, -84.317573], "pin": "brewery_pub", "id": "fannin-brewing-company"}, {"title": "Grumpy Old Men Brewing", "html": "<p>Grumpy Old Men Brewing was founded in 2013 by a couple of retired beer enthusiasts who went from brewing in an outdoor shower to opening their own micro-brewery in Blue Ridge. A few years later they handed the tap handles to \"another grumpy old man and his crabby old lady,\" and the originals now enjoy their beer from the other side of the bar. Expect a big lineup of house-brewed beers on tap, plus karaoke Thursdays, live music Fridays and Singo Sundays.<\/p><p><strong>Address:<\/strong> 1315 E. Main St., Blue Ridge, GA 30513<br><strong>Website:<\/strong> <a href=\"https://grumpyoldmenbrewing.com/\">grumpyoldmenbrewing.com<\/a><\/p><p>The taproom is open daily; check their website for current hours.<\/p>", "photo": "914a1acef6dd8ceb2c596e0a05d99675.jpg", "loc": [34.858237, -84.329923], "pin": "brewery_pub", "id": "grumpy-old-men-brewing"}, {"title": "Reece’s Cider Company", "html": "<p>Looking for a taste of local Ellijay apples in a glass? Reece's Cider Company makes locally crafted hard ciders and hosts local musicians and food trucks almost every weekend. Great for a casual afternoon, an outdoor hangout, or as part of your own Ellijay tasting tour.<\/p><p><strong>Address:<\/strong> 9110 GA Hwy 52 E., Ellijay, GA 30536<br><strong>Phone:<\/strong> (706) 635-2775<br><strong>Website:<\/strong> <a href=\"https://reecescidercompany.com/\">reecescidercompany.com<\/a><\/p><p>Check their website for current tasting room hours and the live music calendar.<\/p>", "photo": "9ef6382170568a711324a70c7aa4dc30.jpg", "id": "reeces-cider-company"}, {"title": "Talking Rock Brewery", "html": "<p>In the tiny town of Talking Rock, south of Ellijay in Pickens County,, this brewery is built inside a renovated train car. Sit inside the car or out on the deck and covered pavilion, which is insulated for the colder months. Expect a rotating tap list, cornhole and games for the kids, and events like open mic, trivia, live music and cornhole tournaments. Dogs are welcome on the outdoor patio. No food is sold, but the Boxcar Grill is next door.<\/p><p><strong>Address:<\/strong> 4500 GA Hwy 136 W., Talking Rock, GA<br><strong>Phone:<\/strong> (706) 253-2337<br><strong>Website:<\/strong> <a href=\"https://talkingrockbrewery.com/\">talkingrockbrewery.com<\/a><\/p><p><strong>Hours:<\/strong> Thursday 4 to 8 pm; Friday and Saturday noon to 9 pm; Sunday noon to 7 pm; closed Monday to Wednesday. Check their website before you go.<\/p>", "photo": "da9354e383dbeb59c31cb42392b39f42.jpg", "loc": [34.51009, -84.50618], "pin": "outdoors", "id": "talking-rock-brewery"}, {"title": "Tipping Point Brewing Co.", "html": "<p>A downtown Blue Ridge brewery and taproom on West Main Street, an easy stop while exploring the shops.<\/p><p><strong>Address:<\/strong> 322 W. Main St., Blue Ridge, GA 30513<br><strong>Phone:<\/strong> (706) 946-2765<br><strong>Website:<\/strong> <a href=\"https://www.tippingpointbrewing.com/\">tippingpointbrewing.com<\/a><\/p><p><strong>Hours:<\/strong> Monday to Thursday noon to 7 pm; Friday and Saturday noon to 8 pm; Sunday 12:30 to 7 pm. Check their website for holiday changes.<\/p>", "photo": "bc30223fef213e08cfbcc0bd28171bc7.jpg", "loc": [34.865023, -84.326173], "pin": "brewery_pub", "id": "tipping-point-brewing-co"}]}, {"title": "Wine and Wineries", "items": [{"title": "34th Degree Wine Merchant", "html": "<p>Blue Ridge's wine-only shop, at the corner of Depot Street and West First Street downtown. Expect a large selection of wines from around the world, friendly help with food pairings and gifts, wine accessories, specialty foods, gift boxes and a monthly wine club. Free parking and curbside pickup are available.<\/p><p><strong>Address:<\/strong> 146 Depot St., Suite 101, Blue Ridge, GA 30513<br><strong>Phone:<\/strong> (706) 946-3434<br><strong>Website:<\/strong> <a href=\"https://www.34thdegreewine.com/\">34thdegreewine.com<\/a><\/p><p>Check their website for current hours and tasting events.<\/p>", "photo": "6d802d2629908cc982c8998080f0f46d.jpg", "loc": [34.865897, -84.326471], "pin": "grocery_shopping", "id": "34th-degree-wine-merchant"}, {"title": "Bear Claw Vineyards", "html": "<p>Bear Claw is a working vineyard with a fully functioning winery on site, producing and bottling its own wine, and it is 100% female owned. The owners chose the spot for its rich alluvial soil and cool mountain breezes at 1,832 feet above sea level. It is dog- and kid-friendly, close to downtown Blue Ridge, and has free live music on Fridays, Saturdays and Sundays year-round.<\/p><p><strong>Address:<\/strong> 2281 Tennis Court Rd., Blue Ridge, GA 30513<br><strong>Phone:<\/strong> (706) 223-3750<br><strong>Website:<\/strong> <a href=\"https://bearclawvineyards.com/\">bearclawvineyards.com<\/a><\/p><p>Check their website for current tasting room hours (they are closed Tuesdays).<\/p>", "photo": "b557bcb35e4cbfa4515a218d03a5359a.jpg", "loc": [34.879677, -84.369689], "pin": "vineyard", "id": "bear-claw-vineyards"}, {"title": "Cartecay Vineyards", "html": "<p>Just outside Ellijay, Cartecay Vineyards makes estate wines from grapes grown, fermented and bottled on site. Enjoy a tasting in the Tasting Barn, then relax on the Chimney Patio, by the vineyard bridge or in the hammock area. Live music from local and regional artists every Saturday and Sunday. The vineyard is also available for weddings and private events.<\/p><p><strong>Address:<\/strong> 5704 Clear Creek Rd., Ellijay, GA 30536<br><strong>Phone:<\/strong> (706) 698-9463<br><strong>Website:<\/strong> <a href=\"https://www.cartecayvineyards.com/\">cartecayvineyards.com<\/a><\/p><p>Check their website for current hours and the music calendar.<\/p>", "photo": "bd1eec40c86c3d1413a470812fb10304.jpg", "loc": [34.613974, -84.39299], "pin": "vineyard", "id": "cartecay-vineyards"}, {"title": "Ellijay Excursions", "html": "<p>Let someone else do the driving. Ellijay Excursions runs guided wine tours through the vineyards around Ellijay, with options to join a scheduled tour, book a custom weekend tour, or arrange a private group outing for birthdays, anniversaries and other celebrations. Tours generally last 4 to 6 hours.<\/p><p><strong>Phone:<\/strong> (678) 622-0302<br><strong>Website:<\/strong> <a href=\"https://ellijayexcursions.com/\">ellijayexcursions.com<\/a><\/p><p>Book ahead on their website for dates and pricing.<\/p>", "photo": "168477214a4ac589760c1727d0684bc8.jpg", "id": "ellijay-excursions"}, {"title": "Fainting Goat Vineyards & Winery", "html": "<p>A family-owned vineyard and winery on Burnt Mountain near Jasper (south of Ellijay), known for its mountain views and its friendly fainting goats, which visitors can visit. Expect award-winning wines, live music every Saturday and Sunday afternoon, and \"Hearth & Harmony\" evenings on Fridays. Dogs are welcome on the lawns and in the main tasting room (not in the winery, vineyard or special events). Note: it is a cashless business and outside drinks are not allowed.<\/p><p><strong>Address:<\/strong> 201 Vineyard Way, Jasper, GA 30143<br><strong>Phone:<\/strong> (706) 692-9463<br><strong>Website:<\/strong> <a href=\"https://www.faintinggoatvineyardsandwinery.com/\">faintinggoatvineyardsandwinery.com<\/a><\/p><p>Tastings end at 5:30 pm; check their website for current hours and events.<\/p>", "photo": "a32e7ee9e792f8b9187464561565ab99.jpg", "loc": [34.531985, -84.395371], "pin": "vineyard", "id": "fainting-goat-vineyards-winery"}, {"title": "Grape Escape Wine Adventures", "html": "<p>Hop aboard a shuttle in downtown Blue Ridge for an easy, all-inclusive wine day. Public tours run Friday and Saturday mornings: lunch at a local spot, then tastings at three North Georgia wineries around Blue Ridge and Ellijay, all for one price. Seats are limited and reservations are required. Private tours for larger groups are available on request.<\/p><p><strong>Email:<\/strong> <a href=\"mailto:hello@grapeescapeadventures.com\">hello@grapeescapeadventures.com<\/a><br><strong>Website:<\/strong> <a href=\"https://grapeescapeadventures.com/\">grapeescapeadventures.com<\/a><\/p>", "loc": [34.87265, -84.32754], "pin": "entertainment_and_activities", "photoHidden": "6ca2a12a036e1e4a43103f7534f597a2.jpg", "id": "grape-escape-wine-adventures"}, {"title": "Mercier Orchards", "html": "<p>A fourth-generation, family- and veteran-owned apple orchard founded in 1943, and one of the most popular farm stops in the North Georgia mountains. Browse the market for fresh fruit, apple butter, jams and cider, grab apple cider donuts or the famous fried pies from the bakery, and sip a flight in the tasting room. Mercier grows, presses and cans its own hard cider and also makes wine. Seasonal U-Pick events run for strawberries, blueberries, blackberries, peaches and apples.<\/p><p><strong>Address:<\/strong> 8660 Blue Ridge Dr., Blue Ridge, GA 30513<br><strong>Phone:<\/strong> (706) 632-3411<br><strong>Website:<\/strong> <a href=\"https://mercier-orchards.com/\">mercier-orchards.com<\/a><\/p><p><strong>Hours:<\/strong> Monday to Thursday 9 am to 5 pm; Friday to Sunday 9 am to 6 pm. Closed Thanksgiving, Black Friday, Christmas, New Year's Day and Easter.<\/p>", "photo": "d1d71f6ca79be715506dd89150a69d67.jpg", "loc": [34.886286, -84.340812], "pin": "vineyard", "id": "mercier-orchards"}, {"title": "North Georgia Wine Tours", "html": "<p>Private group transportation to wineries across North Georgia, including Ellijay and Dahlonega. Tell them your pick-up and drop-off spot and they will plan a day visiting three wineries and handle the reservations, so nobody has to drive. Great for groups, bachelorette parties and special occasions.<\/p><p><strong>Phone:<\/strong> (706) 725-0049<br><strong>Website:<\/strong> <a href=\"https://www.northgawinetours.com/\">northgawinetours.com<\/a><\/p><p>Request a custom quote on their website.<\/p>", "photo": "bc482e476882a0652d85469edbf86015.jpg", "id": "north-georgia-wine-tours"}, {"title": "Out of the Blue", "html": "<p>For wine lovers, <strong>Out of the Blue<\/strong> is a fun stop in downtown Blue Ridge's historic district. This gourmet shop carries fine wines, a great craft beer selection, international and local gourmet foods, plus linens, ceramics, glassware and clever wine gadgets. The staff is happy to help you pick the perfect bottle to enjoy back at the cabin or find a unique gift.<\/p><p><strong>Address:<\/strong> 647 E. Main St., Blue Ridge, GA 30513<br><strong>Phone:<\/strong> (706) 258-2750<br><strong>Website:<\/strong> <a href=\"https://outofzbleu.com/\">outofzbleu.com<\/a><\/p><p>Check their website for current hours.<\/p>", "photo": "025ced46914d0c00c11670b667599351.jpg", "loc": [34.86607, -84.32371], "pin": "outdoors", "id": "out-of-the-blue"}]}]}, "dining": {"id": "dining", "title": "Dining Out", "icon": "utensils", "groups": [{"title": "Breakfast, Brunch, + Coffee Recommendations", "items": [{"title": "BumbleBee's Cafe", "html": "<p>Facebook: <a href=\"https://www.facebook.com/bumblebeescafeblueridgega/\">BumbleBee's Cafe on Facebook<\/a><br>Phone: (706) 946-2337<br>Address: 5850 Appalachian Hwy, Blue Ridge, GA 30513<\/p><p>BumbleBee's Cafe is a family-run spot serving breakfast and lunch with a Southern country flair. Think biscuits, corned beef hash, custom omelets, banana nut pancakes and Belgian waffles. It is a breakfast-and-lunch place, so check their Facebook page for current hours.<\/p>", "photo": "9415e048abe4f8595cdfe74226b9104a.jpg", "loc": [34.879942, -84.295045], "pin": "restaurants", "id": "bumblebees-cafe"}, {"title": "The Corner Stone Café", "html": "<p>Website: <a href=\"https://thecornerstonecafeellijay.com\">thecornerstonecafeellijay.com<\/a><br>Phone: (706) 636-2230<br>Address: 76 N Main St, Ellijay, GA 30540<\/p><p>A family-owned local favorite on Main Street, The Corner Stone Café serves hearty, homestyle Southern breakfast and lunch in a cozy, welcoming setting. Regulars rave about the biscuits and gravy and country fried steak. Check their website for current hours.<\/p>", "photo": "10772c7e448819b40764db468b296622.jpg", "loc": [34.69552, -84.48152], "pin": "outdoors", "id": "the-corner-stone-caf"}, {"title": "Das Kaffee Haus", "html": "<p>Our #1 Choice - Katharina is German after all!<\/p><p>Facebook: <a href=\"https://www.facebook.com/kaffeehausblueridge/\">Das Kaffee Haus on Facebook<\/a><br>Phone: (706) 946-1111<br>Address: 612 East Main St., Blue Ridge, GA 30513<\/p><p>Das Kaffee Haus is a traditional European-style coffee shop run by a Bavarian owner, serving espresso, cappuccino, lattes and frappes alongside German, Italian and French treats. Soy, coconut and almond milk are available, and gluten-free options can be had if you call ahead. The outdoor seating overlooks the Blue Ridge Scenic Railway and downtown, and dogs are welcome outside. Check their Facebook page for current hours.<\/p>", "photo": "4502cbaca3d626e51487905f965728f9.jpg", "loc": [34.866727, -84.323442], "pin": "coffee_shop", "id": "das-kaffee-haus"}, {"title": "Mike’s Ellijay Restaurant", "html": "<p>Facebook: <a href=\"https://www.facebook.com/pages/Mikes-Ellijay-Restaurant/182751951758740\">Mike's Ellijay Restaurant on Facebook<\/a><br>Phone: (706) 635-4381<br>Address: 351 Tails Creek Rd, Ellijay, GA 30540<\/p><p>Mike's is a hidden gem for locals and visitors alike, known for generous portions and hearty breakfasts. From omelets and biscuits with gravy to daily specials, it is a nostalgic, small-town diner that makes you feel right at home. Bring cash or a check, as they do not take credit cards. Check their Facebook page for current hours.<\/p>", "photo": "ee200a18fa2b84b195dd9f1ef3b4b170.jpg", "loc": [34.68435, -84.49891], "pin": "outdoors", "id": "mikes-ellijay-restaurant"}, {"title": "Mountain Mama's Coffee", "html": "<p>Website: <a href=\"https://www.mountainmamascoffee.com/\">mountainmamascoffee.com<\/a><br>Address: 771 East Main St., Blue Ridge, GA 30513<\/p><p>A creative coffee lounge in downtown Blue Ridge with skilled baristas, homemade flavors and inventive drinks, plus local, scratch-made food like avocado toast and egg bites. A comfy space to sip, bite, meet, work or play. Check their website for current hours.<\/p>", "photo": "f445bf1986027e5d8213145d9080999f.jpg", "loc": [34.864692, -84.32478], "pin": "coffee_shop", "id": "mountain-mamas-coffee"}, {"title": "The Pullman", "html": "<p>Website: <a href=\"https://www.thepullmanblueridge.com/\">thepullmanblueridge.com<\/a><br>Phone: (706) 455-3364<br>Address: 657 East Main St., Blue Ridge, GA 30513<\/p><p>For a great breakfast, brunch or lunch, The Pullman is a newer all-day eatery in downtown Blue Ridge, inspired by the golden age of rail travel. Expect a warm, stylish atmosphere and creative takes on classics, with breakfast served all day (think eggs Benedict and short rib hash), plus coffee and cocktails. There is indoor seating and a patio. Check their website for current hours.<\/p>", "photo": "a0914d28901f1c524a415b72fceab0f1.jpg", "loc": [34.866004, -84.323697], "pin": "restaurants", "id": "the-pullman"}]}, {"title": "Dinner + Drinks Recommendations", "items": [{"title": "The Black Sheep Restaurant Bar and Patio", "html": "<p>Website: <a href=\"https://blacksheepblueridge.com/\">blacksheepblueridge.com<\/a><br>Phone: (706) 946-3663<br>Address: 480 W. Main St., Blue Ridge, GA 30513<\/p><p>The Black Sheep is set in the historic Butt House (circa 1914) in downtown Blue Ridge. Expect a progressive, locally sourced, chef-inspired New American menu, a strong wine list and craft cocktails, plus a large outdoor bar and covered patio under a 200-year-old oak. Brunch is served on weekends. Seating is limited, so reservations through Resy are recommended. Check their website for current hours.<\/p>", "photo": "6e6e1569dd6ff7f93499e31e40d4d18c.jpg", "loc": [34.863216, -84.32795], "pin": "restaurants", "id": "the-black-sheep-restaurant-bar-and-patio"}, {"title": "The Butcher and Bottle", "html": "<p>Website: <a href=\"https://ellijay.thebutcherandbottle.com/\">ellijay.thebutcherandbottle.com<\/a><br>Phone: (706) 889-7937<br>Address: 24 River St, Ellijay, GA 30540<\/p><p>The Butcher and Bottle is a family-owned, upscale steak and seafood restaurant in downtown Ellijay. Think prime steaks, fresh seafood and a good bar, in a warm historic brick storefront. It is a great pick for a date night or celebration dinner, and they serve brunch on Sundays. Reservations are recommended. Check their website for current hours.<\/p>", "photo": "08c92c0d50eeeb7072e0a243927fff9f.jpg", "loc": [34.694441, -84.482187], "pin": "restaurants", "id": "the-butcher-and-bottle"}, {"title": "Charlie’s Italian Restaurant & Pizzeria", "html": "<p>Website: <a href=\"https://www.charlies-italian.com/\">charlies-italian.com<\/a><br>Phone: (706) 635-2205<br>Address: 15 West Cross St, East Ellijay, GA 30540<\/p><p>A cozy, family-friendly Italian spot offering homestyle pasta, pizza and classic Italian entrées, made to order. The menu works for kids and adults alike, making it a go-to for comfort food and casual dining in East Ellijay. Check their website for current hours.<\/p>", "photo": "b76f506415bceed7829bc1965dda970b.jpg", "loc": [34.68131, -84.47637], "pin": "outdoors", "id": "charlies-italian-restaurant-pizzeria"}, {"title": "Cucina Rustica", "html": "<p>Website: <a href=\"https://www.cucinarusticaga.com/\">cucinarusticaga.com<\/a><br>Phone: (706) 374-7474<br>Address: 76 Forge Mill Rd, Morganton, GA 30560<\/p><p>Located in Morganton, a few minutes from Blue Ridge, Cucina Rustica serves country-style Italian dishes in an Old-World atmosphere. Chef Danny Mellman offers his take on Old-World Italian food, from Sicilian fish dishes to Northern Italian pastas and everything in between. It is a small restaurant with limited seating, so book through Resy or call.<\/p><p>Hours: Wednesday–Thursday 5–8 PM, Friday–Saturday 5–9 PM (closed Sunday–Tuesday). Hours can change, so check their website before you go.<\/p>", "photo": "4e5b6097222dbd97e96603bdc181f1eb.jpg", "loc": [34.891933, -84.24781], "pin": "restaurants", "id": "cucina-rustica"}, {"title": "Ferraro's Kitchen", "html": "<p>Website: <a href=\"https://www.ferraroskitchen.com/blueridge\">ferraroskitchen.com<\/a><br>Phone: (706) 785-9150<br>Address: 322 West Main St., Suite 2A, Blue Ridge, GA 30513<\/p><p>For an elevated Italian meal, Ferraro's Kitchen is one of our favorite spots in downtown Blue Ridge. Venice-born Chef Igor Ferraro brings authentic Italian cuisine to the area with beautifully prepared pastas, seafood, steaks and an impressive wine list. It is an intimate, upscale setting that is perfect for a date night, anniversary or special dinner during your stay. <strong>Reservations are highly recommended<\/strong>, as seating is limited. Check their website for current hours.<\/p>", "photo": "571eb1a3c0ea7d729b39316fc563d25e.jpg", "loc": [34.865023, -84.326173], "pin": "restaurants", "id": "ferraros-kitchen"}, {"title": "The General Ledger", "html": "<p>Website: <a href=\"https://www.generalledgerblueridge.com/\">generalledgerblueridge.com<\/a><br>Phone: (706) 946-0476<br>Address: 260 West Main St., Blue Ridge, GA 30513<\/p><p>The General Ledger is set in a beautiful historic bank building in downtown Blue Ridge, complete with seating in the old vault. The menu features Southern-leaning American fare like shrimp and grits, cast-iron cornbread, pecan-crusted trout and hand-cut ribeye, plus a full bar. Check their website for current hours.<\/p>", "photo": "d4f6e4fcd08c975f93e16a50af4a9930.jpg", "loc": [34.865696, -84.325382], "pin": "restaurants", "id": "the-general-ledger"}, {"title": "Grace Prime Steakhouse", "html": "<p>Website: <a href=\"https://graceprime.com/\">graceprime.com<\/a><br>Phone: (706) 946-2555<br>Address: 55 Mountain St., Suite 6, Blue Ridge, GA 30513<\/p><p>For a special night out, Grace Prime Steakhouse is one of our favorite recommendations in downtown Blue Ridge. They offer an elevated steakhouse experience featuring 45+ day aged steaks, fresh seafood, craft cocktails and an impressive wine selection. The atmosphere is upscale yet welcoming, making it a great choice for date nights, anniversaries or a memorable dinner during your stay. Reservations are recommended. Check their website for current hours.<\/p>", "photo": "816932f479c7b89e3b323c0cbd8d8354.jpg", "loc": [34.869073, -84.32269], "pin": "restaurants", "id": "grace-prime-steakhouse"}, {"title": "Rose's Smash House", "html": "<p>Website: <a href=\"https://www.rosessmashhouse.com/\">rosessmashhouse.com<\/a><br>Address: 588 E Main St., Blue Ridge, GA 30513<\/p><p>Looking for a great burger? Rose's Smash House is a newer local favorite in downtown Blue Ridge serving smash burgers made with 100% Wagyu beef, smashed to order for that crispy, caramelized crust. Their fries are cooked in grass-fed beef tallow for an extra level of flavor. It is casual, fun and a great option for families or a laid-back lunch or dinner. Check their website for current hours.<\/p>", "photo": "aa6201f2a2faeeabc127754e0c5e214d.jpg", "loc": [34.867102, -84.323286], "pin": "restaurants", "id": "roses-smash-house"}, {"title": "Tapas & Tequila", "html": "<p>Website: <a href=\"https://www.tapasandtequila.net/\">tapasandtequila.net<\/a><br>Phone: (706) 946-0080<br>Address: 257 E Main St., Suite A, Blue Ridge, GA 30513<\/p><p>For a fun night out, Tapas &amp; Tequila is a great choice in downtown Blue Ridge. This lively spot puts a fresh spin on Mexican dining with flavorful shareable plates, handcrafted cocktails and creative margaritas. It is great for groups, date nights, or enjoying a few drinks and small plates while exploring downtown. Check their website for current hours.<\/p>", "photo": "ab5e52ca9c3492f3da669a87eff0554f.jpg", "loc": [34.870362, -84.319159], "pin": "bars_and_nightlife", "id": "tapas-tequila"}, {"title": "Whiskey & Water", "html": "<p>Website: <a href=\"https://whiskeywaterbr.com/\">whiskeywaterbr.com<\/a><br>Phone: (706) 946-0551<br>Address: 187 Depot St., Blue Ridge, GA 30513<\/p><p>Whiskey &amp; Water is a seafood restaurant and bourbon bar set in a beautifully restored 1937 post office in downtown Blue Ridge. Expect coastal plates like seafood boils and fresh fish, creative cocktails, good wine and one of the area's largest selections of whiskeys and bourbons from around the world. Warm, historic and mountain casual. Check their website for current hours.<\/p>", "photo": "deedd9b21d95c4229a3a9ac2b339716f.jpg", "loc": [34.865878, -84.325587], "pin": "restaurants", "id": "whiskey-water"}]}, {"title": "Food Tours", "items": [{"title": "Blue Ridge Mountain Food Tours", "html": "<p>Website: <a href=\"https://blueridgemountainfoodtours.com/\">blueridgemountainfoodtours.com<\/a><br>Phone: (706) 455-4812<br>Tour meetup: Downtown Blue Ridge, GA<\/p><p>This guided walking tour takes guests through downtown Blue Ridge to sample food and drinks at local restaurants and shops, with fun facts and history from a local guide along the way. The Fabulous Foodie Tour and the Sugar High (dessert) Tour each run about 2.5 to 3 hours, cover roughly three-quarters of a mile and make 4–5 tasting stops, with a maximum of 12 guests. Private tours are also available. Perfect for first-time visitors who want a guided taste of the town.<\/p>", "photo": "927583b7709bdeb54aeea0f8dbee8be8.jpg", "id": "blue-ridge-mountain-food-tours"}, {"title": "Ellijay Excursions – Wine & Agritourism Tours", "html": "<p>Website: <a href=\"https://ellijayexcursions.com/\">ellijayexcursions.com<\/a><br>Phone: (678) 622-0302<br>Tour area: Ellijay, Blue Ridge, Cherry Log, Jasper and other North Georgia wine country stops<\/p><p>Let someone else handle the planning, driving and scheduling so you can relax and savor your tasting adventure. Ellijay Excursions offers join-in tours for couples plus private, customizable group tours of the region's vineyards, with options for beer, cider and apple farm stores. They also have their own \"Misfit Farm,\" where guests can pet baby goats, meet gentle horses and collect fresh eggs. Book through their website or by phone.<\/p>", "photo": "52c72de9ad16444651bcc338e31415f6.jpg", "id": "ellijay-excursions-wine-agritourism-tours"}, {"title": "North Georgia Wine Tours – Ellijay & Blue Ridge", "html": "<p>Website: <a href=\"https://www.northgawinetours.com/ellijay\">northgawinetours.com<\/a><br>Phone: (706) 725-0049<br>Service area: Pickup available in Gilmer and Fannin counties for Ellijay tours<\/p><p>This veteran-owned company specializes in private wine tours. They handle the planning, reservations and transportation for a personalized tasting experience, typically visiting three award-winning wineries in the Ellijay and Jasper area with a dedicated driver. Tours are private only, for groups of 4 to 14 guests. Check their website for current pricing and availability.<\/p>", "photo": "f02e629e3ac3366a715d3464260f4a81.jpg", "id": "north-georgia-wine-tours-ellijay-blue-ridge"}]}, {"title": "Lunch + Snack Recommendations", "items": [{"title": "Back Porch Bistro", "html": "<p>Facebook: <a href=\"https://www.facebook.com/backporchbistroellijayga/\">Back Porch Bistro on Facebook<\/a><br>Phone: (706) 636-1111<br>Address: 10 Northside Square, Ellijay, GA 30540<\/p><p>A charming, casual lunch spot on the square in downtown Ellijay. Back Porch Bistro serves handmade wraps, sandwiches, paninis, Cuban sandwiches, bowls and salads, with plenty of vegetarian, vegan and gluten-free options. Grab a seat on the pet-friendly back deck for a relaxed meal and some people-watching. It is a lunch spot, so check their Facebook page for current hours.<\/p>", "loc": [34.69526, -84.48264], "pin": "outdoors", "photoHidden": "8908eb8728b77e8c09f5788bf46b0141.jpg", "id": "back-porch-bistro"}, {"title": "Boat Dock Bar & Grill", "html": "<p>Website: <a href=\"https://lakeblueridgemarina.com/boat-dock-bar-grill/\">Boat Dock Bar &amp; Grill at Lake Blue Ridge Marina<\/a><br>Phone: (706) 632-2618<br>Address: 335 Marina Dr., Blue Ridge, GA 30513<\/p><p>Boat Dock Bar &amp; Grill sits right on the shores of Lake Blue Ridge at the Lake Blue Ridge Marina, with one of the best views in Blue Ridge. The kitchen is small but mighty and the full bar serves specialty cocktails. Takeout is available, and it is first come, first served, so arrive early.<\/p><p><strong>Seasonal:<\/strong> Open seasonally, so check their website for current hours.<\/p>", "photo": "0ffab574a0ffb7ca06adf2f96a90e03c.jpg", "loc": [34.870521, -84.280042], "pin": "restaurants", "id": "boat-dock-bar-grill"}, {"title": "Cantaberry Restaurant", "html": "<p>Website: <a href=\"https://www.cantaberryrestaurant.com/\">cantaberryrestaurant.com<\/a><br>Phone: (706) 636-4663<br>Address: 5 South Side Square, Ellijay, GA 30540<\/p><p>Known for its homemade soups, signature sandwiches and salads, and fresh-baked desserts, Cantaberry has been a local favorite on the Ellijay square for years. The warm, inviting atmosphere and pet-friendly patio make it a great lunch stop. There is also a second location in Blue Ridge at 524 East Main St. Check their website for current hours.<\/p>", "photo": "4ea1df85f25ec4b6a6532622fcbf6515.jpg", "loc": [34.6948, -84.48285], "pin": "outdoors", "id": "cantaberry-restaurant"}, {"title": "Ellijay Wood Fired Pizza", "html": "<p>Website: <a href=\"https://www.ellijaywoodfired.com/\">ellijaywoodfired.com<\/a><br>Phone: (706) 707-4992<br>Address: 2 River St, Ellijay, GA 30540<\/p><p>For pizza lovers, this downtown spot on the corner of River and Main serves authentic Neapolitan pizza from a wood-fired oven built in Naples, Italy, using imported and locally sourced ingredients. There are also wood-fired starters and salads. A great option for groups or families looking for a shared lunch. Check their website for current hours.<\/p>", "photo": "cdfec4bc7b1db209742e8a81c1a3ed25.jpg", "loc": [34.69475, -84.4825], "pin": "outdoors", "id": "ellijay-wood-fired-pizza"}, {"title": "Harvest On Main", "html": "<p>Website: <a href=\"https://harvestonmain.com/\">harvestonmain.com<\/a><br>Phone: (706) 946-6164<br>Address: 576 East Main St., Blue Ridge, GA 30513<\/p><p>Harvest on Main focuses on fresh, locally sourced ingredients, like grass-fed local beef, seasonal vegetables and Bramlett Farms trout, served in a beautiful lodge setting. Relax by the fire and enjoy anything from a snack to lunch or dinner. Reservations by phone are recommended. Check their website for current hours.<\/p>", "photo": "85287095d6ba6571fddf5f9698e49a82.jpg", "loc": [34.867216, -84.323102], "pin": "restaurants", "id": "harvest-on-main"}, {"title": "Mystic Mountain Pizza", "html": "<p>Online ordering: <a href=\"https://www.toasttab.com/mystic-mountain-pizza-4118-east-first-street\">Mystic Mountain Pizza on Toast<\/a><br>Phone: (706) 946-0378<br>Address: 4118 East First St., Blue Ridge, GA 30513<\/p><p>For a fun, casual meal, Mystic Mountain Pizza is a local favorite and a great option for families and groups. They serve thin-crust pizzas with lots of specialty options, along with pasta, salads, sandwiches and wings. The quirky, 70s-style interior with arcade games makes it a particularly fun spot for families, and they also offer takeout if you would rather enjoy pizza back at the cabin. Check their ordering page for current hours.<\/p>", "loc": [34.872793, -84.31234], "pin": "restaurants", "photoHidden": "1b0398887bd4bf901f7727482987444c.jpg", "id": "mystic-mountain-pizza"}, {"title": "River Street Tavern", "html": "<p>Website: <a href=\"https://riverstreettavern.com\">riverstreettavern.com<\/a><br>Phone: (706) 635-6166<br>Address: 40 River St., Suite B, Ellijay, GA 30540<\/p><p>This lively, locally owned tavern in downtown Ellijay serves burgers, wings, sandwiches, salads and appetizers, with 21 taps of local Georgia craft beer plus cocktails. The casual vibe makes it a fun lunch or dinner stop downtown. Check their website for current hours.<\/p>", "photo": "ae84ef613c93e0f5355c2650cf4fa8b9.jpg", "loc": [34.69432, -84.48181], "pin": "outdoors", "id": "river-street-tavern"}, {"title": "The Roof Ellijay", "html": "<p>Website: <a href=\"https://www.theroofellijay.com/\">theroofellijay.com<\/a><br>Phone: (706) 635-7663<br>Address: 16 River St, Ellijay, GA 30540<\/p><p>Located downtown, The Roof is a Southern rooftop kitchen and bar with outdoor seating overlooking downtown Ellijay. Guests love the relaxed, stylish atmosphere, creative cocktails and Southern-inspired dishes made with local ingredients when possible. A perfect pick for lunch with a view. Check their website for current hours.<\/p>", "photo": "a3a86d048b5c337e1ffa208783e627f9.jpg", "loc": [34.69464, -84.48224], "pin": "outdoors", "id": "the-roof-ellijay"}, {"title": "The Shack of Ellijay", "html": "<p>Website: <a href=\"https://ordertheshack.com/\">ordertheshack.com<\/a><br>Phone: (706) 635-3663<br>Address: 118 N Main St, Ellijay, GA 30540<\/p><p>The Shack is a laid-back Asian fusion spot in downtown Ellijay for dine-in or takeout. The menu includes poke bowls, noodle bowls, wraps and Thai-inspired and vegetarian dishes, with vegan, gluten-free and dairy-free options and bubble tea. It opens late morning, so it is best for lunch or an early dinner. Check their website for current hours.<\/p>", "photo": "ae506a6696d87e6da52457de0fe3f621.jpg", "loc": [34.69737, -84.47999], "pin": "outdoors", "id": "the-shack-of-ellijay"}]}]}, "emergency": {"id": "emergency", "title": "Emergency and Urgent Care", "icon": "siren", "groups": [{"title": "", "items": [{"title": "Blue Ridge Medical Center (Hospital & 24/7 ER)", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p><p><strong>Blue Ridge Medical Center<\/strong> (formerly Fannin Regional Hospital) is the local hospital in Blue Ridge, with a 24/7 emergency department.<\/p><p><strong>Address:<\/strong> 2855 Old Highway 5 North, Blue Ridge, GA 30513<br><strong>Phone:<\/strong> (706) 632-3711<br><strong>Website:<\/strong> <a href=\"https://www.blueridgemc.org/\">blueridgemc.org<\/a><\/p>", "loc": [34.917735, -84.37433], "pin": "medical_facilities", "id": "blue-ridge-medical-center-hospital-24-7-er"}, {"title": "Ellijay Fire Department", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p><p>The City of Ellijay Fire Department provides fire, rescue and basic life support response within the city of Ellijay. (Cabins outside city limits are served by Gilmer County Fire Rescue; 911 will route your call automatically.)<\/p><p><strong>Address:<\/strong> 201 N. Main St., Ellijay, GA 30540<br><strong>Non-emergency phone:<\/strong> (706) 635-7430<br><strong>Website:<\/strong> <a href=\"https://ellijay-ga.gov/departments/fire/\">City of Ellijay Fire Department<\/a><\/p>", "loc": [34.69717, -84.48054], "pin": "outdoors", "photoHidden": "27ca313e76c156fd2107ce72c5c677f4.jpg", "id": "ellijay-fire-department"}, {"title": "Ellijay Police Department", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p><p>The Ellijay Police Department serves the city of Ellijay. For non-emergency police help elsewhere in Gilmer County, call the Gilmer County Sheriff's Office non-emergency line below.<\/p><p><strong>Address:<\/strong> 197 N. Main St., Ellijay, GA 30540<br><strong>Ellijay Police phone:<\/strong> (706) 635-7430<br><strong>Gilmer County Sheriff non-emergency:<\/strong> (706) 635-8911<br><strong>Website:<\/strong> <a href=\"https://ellijay-ga.gov/departments/police/\">City of Ellijay Police Department<\/a><\/p>", "photo": "fa1636daeccb3153de0e400f29c6852c.jpg", "loc": [34.69672, -84.48065], "pin": "outdoors", "id": "ellijay-police-department"}, {"title": "Fannin County Fire Station 1 (Blue Ridge)", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p><p>Fannin County Fire Rescue Station 1 in downtown Blue Ridge, at West Main and Church streets.<\/p><p><strong>Address:<\/strong> 342 W. Main St., Blue Ridge, GA 30513<br><strong>Fannin County Fire Department non-emergency:<\/strong> (706) 632-4711<br><strong>Website:<\/strong> <a href=\"https://fannincountyga.com/public-safety-emergency-fire-department/\">Fannin County Fire Department<\/a><\/p>", "loc": [34.864749, -84.32627], "pin": "police", "id": "fannin-county-fire-station-1-blue-ridge"}, {"title": "Fannin County Sheriff's Office", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p><p><strong>Fannin County Sheriff's Office<\/strong> serves Blue Ridge and all of Fannin County.<\/p><p><strong>Address:<\/strong> 645 W. First St., Blue Ridge, GA 30513<br><strong>Non-emergency law
