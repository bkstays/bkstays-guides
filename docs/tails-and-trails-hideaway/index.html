 enforcement:<\/strong> (706) 632-2043<br><strong>Sheriff's Office:<\/strong> (706) 632-2044<br><strong>Website:<\/strong> <a href=\"https://fanninsheriffga.us/\">fanninsheriffga.us<\/a><\/p>", "loc": [34.864471, -84.327211], "pin": "police", "id": "fannin-county-sheriffs-office"}, {"title": "Piedmont Mountainside Emergency Room of Ellijay", "html": "<p><strong>In case of emergency, dial 911.<\/strong><\/p><p>A 24-hour freestanding emergency room operated by Piedmont Mountainside Hospital, with emergency physicians, imaging and lab on site. It is not a full hospital: patients who need to be admitted are transferred, usually to Piedmont Mountainside Hospital in Jasper.<\/p><p><strong>Address:<\/strong> 370 West Highlands Dr., East Ellijay, GA 30540<br><strong>Phone:<\/strong> (706) 515-4000<br><strong>Website:<\/strong> <a href=\"https://www.piedmont.org/locations/piedmont-mountainside\">Piedmont Mountainside<\/a><\/p>", "photo": "d49e811b54e9573e816c6b5494fb3ba9.jpg", "loc": [34.66355, -84.48956], "pin": "outdoors", "id": "piedmont-mountainside-emergency-room-of-ellijay"}]}]}, "fishing": {"id": "fishing", "title": "Fishing", "icon": "fish", "groups": [{"title": "", "items": [{"title": "Bowman Fly Fishing", "html": "<p>Bowman Fly Fishing runs guided fly fishing trips across North Georgia, with half-day and full-day wade trips on more than 10 miles of private water and drift boat float trips. All gear is provided and guides teach complete beginners as well as experienced anglers. They fish year-round on waters such as the Toccoa River, Noontootla Creek, the Soque and the Etowah.<\/p><p><strong>Phone:<\/strong> 706-963-0435<\/p><p><a href=\"https://bowmanflyfishing.com/\">bowmanflyfishing.com<\/a><\/p>", "photo": "4bceccd5ebf5f223e7ffd258161cc9da.jpg", "id": "bowman-fly-fishing"}, {"title": "Cap'n Hoek Fishing Adventures", "html": "<p>Cap'n Hoek Fishing Adventures offers guided lake fishing charters on North Georgia lakes including Carters Lake and Lake Blue Ridge, targeting walleye, striped bass, spotted bass and yellow perch. Choose a 4-hour morning trip, a 6-hour trip, a 10-hour full day, or a 5-hour night fishing trip.<\/p><p><strong>Phone:<\/strong> 706-889-3298<\/p><p><a href=\"https://www.ellijayfishingtrips.com/\">ellijayfishingtrips.com<\/a><\/p>", "photo": "0077537530af2992d38a0e313558dc2e.jpg", "id": "capn-hoek-fishing-adventures"}, {"title": "Lake and Stream Guide Service", "html": "<p>Based in Ellijay, this year-round professional guide service offers tailored trips on Carters Lake, Lake Blue Ridge and Lake Nottely, plus trophy trout fly fishing on private streams (November through April). They specialize in big fish on light tackle: walleye, striped bass, trout and more. They also run 3-hour eco tours on Carters Lake and Lake Blue Ridge.<\/p><p><strong>Phone:<\/strong> 706-669-4973<\/p><p><a href=\"https://ellijayfishing.com/\">ellijayfishing.com<\/a><\/p>", "photo": "48aed831f86adc502a9b9cb91be514b7.jpg", "id": "lake-and-stream-guide-service"}, {"title": "Reel 'Em In Guide Service", "html": "<p>An Orvis-endorsed fly fishing guide service operating since 2001, offering wade and drift boat trips across North Georgia, including trophy-managed water on the Cartecay River and Mountaintown Creek near Ellijay, and the Toccoa River near Blue Ridge. Beginners and experienced anglers welcome, with access to public waters and private trophy trout water. They fish 7 days a week year-round (closed Easter and Christmas). You'll need a Georgia fishing license with trout privileges.<\/p><p><strong>Phone:<\/strong> 706-502-8341 or 877-647-4534<\/p><p><a href=\"https://reeleminguideservice.com/\">reeleminguideservice.com<\/a><\/p>", "photo": "80c783a39e6a8595a4263447932cffed.jpg", "id": "reel-em-in-guide-service"}]}]}, "golf": {"id": "golf", "title": "Golf", "icon": "flag", "groups": [{"title": "", "items": [{"title": "Copper Basin Golf Club", "html": "<p>A family-friendly 9-hole public course with two sets of tees for 18-hole play, known for its friendly atmosphere and pretty surroundings. Suitable for golfers of all skill levels.<\/p><p><strong>Address:<\/strong> 5765 US-64, Copperhill, TN 37317 (just over the state line from McCaysville)<br><strong>Phone:<\/strong> 423-496-3579<\/p><p><a href=\"https://www.facebook.com/copperbasingolfclub\">Copper Basin Golf Club on Facebook<\/a><\/p>", "loc": [35.023996, -84.32532], "pin": "golfing", "id": "copper-basin-golf-club"}, {"title": "Old Toccoa Farm", "html": "<p>A semi-private, award-winning course along the Toccoa River that welcomes public play six days a week (closed Tuesdays). Public players must call ahead for a tee time, which can be booked up to 7 days out (further ahead if you're staying at the resort). Rental clubs are available.<\/p><p><strong>Address:<\/strong> 596 Curtis Switch Road, Mineral Bluff, GA 30559<br><strong>Phone:<\/strong> 706-946-4653<\/p><p><a href=\"https://oldtoccoafarm.com/golf/\">Old Toccoa Farm golf<\/a><\/p>", "loc": [34.925818, -84.332214], "pin": "golfing", "id": "old-toccoa-farm"}, {"title": "Whitepath Golf Club", "html": "<p>An 18-hole public course about 5 miles north of Ellijay with a challenging yet enjoyable layout, scenic mountain views and well-kept greens. Collared shirts are required and you'll need your own clubs; online tee times are prepaid.<\/p><p><strong>Address:<\/strong> 1156 Shenandoah Drive, Ellijay, GA 30540<br><strong>Phone:<\/strong> 706-276-3080<\/p><p><a href=\"https://www.golfwhitepath.com/\">golfwhitepath.com<\/a><\/p>", "loc": [34.755447, -84.439113], "pin": "golfing", "id": "whitepath-golf-club"}]}]}, "grocery": {"id": "grocery", "title": "Grocery and Pharmacy", "icon": "shopping-cart", "groups": [{"title": "Groceries Upon Arrival", "items": [{"title": "Grocery Delivery Service", "html": "<p>Would you like a fully stocked fridge waiting for you when you arrive? Vacation is supposed to be relaxing, and the last thing you should worry about is a supply run.<\/p><p>We have partnered with <strong>Cabin Concierge of North Georgia<\/strong> for pre-arrival grocery stocking, plus extras like holiday decor, birthday and celebration setups, charcuterie and grazing boards, and private chef experiences.<\/p><p>Reach out to Jessica through the website or by phone and she will handle the rest.<\/p><p><strong>Website:<\/strong> <a href=\"https://www.brcabinconcierge.com/\">brcabinconcierge.com<\/a><br><strong>Phone:<\/strong> (706) 455-3280<\/p>", "photo": "0b63de10e92ff000000e2452531ad49c.jpg", "id": "grocery-delivery-service"}]}, {"title": "Grocery / Pharmacy", "items": [{"title": "CVS Pharmacy", "html": "<p><strong>CVS Pharmacy - Blue Ridge<\/strong><\/p><p>Pharmacy with drive-thru, plus everyday essentials and over-the-counter medicine.<\/p><p><strong>Address:<\/strong> 30 Orvin Lance Connector, Blue Ridge, GA 30513<br><strong>Phone:<\/strong> (706) 632-8097<br><strong>Website:<\/strong> <a href=\"https://www.cvs.com/store-locator/blue-ridge-ga-pharmacies/30-orvin-lance-connector-blue-ridge-ga-30513/storeid=7701\">CVS Blue Ridge store page<\/a><\/p><p>Check the store page for current store and pharmacy hours (the pharmacy closes daily for a short lunch break).<\/p>", "loc": [34.875477, -84.299752], "pin": "pharmacy", "photoHidden": "bd637c3e96aa3b09d786560df40e48bb.jpg", "id": "cvs-pharmacy"}, {"title": "Huff’s Drug Store", "html": "<p>A family-owned Gilmer County staple since 1949, Huff's offers friendly, personalized service. Their pharmacy handles prescription refills (including through the RefillRx app), walk-in vaccinations, compounding and medication packaging, and the store carries medical supplies and gifts.<\/p><p><strong>Address:<\/strong> 136 Industrial Blvd., Ellijay, GA 30540<br><strong>Phone:<\/strong> (706) 635-7931<br><strong>Website:<\/strong> <a href=\"https://northgeorgiapharmacies.com/huffs-drug-store/\">Huff's Drug Store<\/a><\/p><p><strong>Hours:<\/strong> Monday to Friday 8:30 am to 6 pm; Saturday 9 am to 1 pm; closed Sunday.<\/p>", "photo": "1edeeefa4c31f03d8f9eae4023a0350b.jpg", "id": "huffs-drug-store"}, {"title": "Ingles Markets", "html": "<p>Ingles is Ellijay's full-service supermarket, with fresh produce, meats, bakery, deli, household goods and a pharmacy. Curbside pickup is available.<\/p><p><strong>Address:<\/strong> 100 Old Orchard Square, Ellijay, GA 30540<br><strong>Store phone:<\/strong> (706) 635-2585<br><strong>Pharmacy phone:<\/strong> (706) 635-7176<br><strong>Website:<\/strong> <a href=\"https://shop.ingles-markets.com/stores/ellijay-409\">Ingles Ellijay (#409)<\/a><\/p><p><strong>Store hours:<\/strong> 6 am to 11 pm daily. The pharmacy has shorter hours; check the store page.<\/p>", "photo": "63935ffef88b224144053eac8092d1c1.jpg", "loc": [34.67553, -84.47822], "pin": "outdoors", "id": "ingles-markets"}, {"title": "Walmart Supercenter", "html": "<p>For convenience and variety, Walmart Supercenter carries everything from groceries and household goods to clothing and electronics, with grocery pickup available. There are two stores nearby, both open 6 am to 11 pm daily:<\/p><ul><li><strong>Blue Ridge:<\/strong> (706) 632-9500, <a href=\"https://www.walmart.com/store/5812\">Walmart Blue Ridge store page<\/a><\/li><li><strong>East Ellijay:<\/strong> 88 Highland Crossing, East Ellijay, GA 30540, (706) 276-1170, <a href=\"https://www.walmart.com/store/1070\">Walmart East Ellijay store page<\/a><\/li><\/ul>", "photo": "76aa2a8432801f0be219b677fdefc57d.jpg", "loc": [34.877121, -84.325159], "pin": "grocery_shopping", "id": "walmart-supercenter"}]}]}, "hiking-biking": {"id": "hiking-biking", "title": "Hiking and Biking", "icon": "mountain", "groups": [{"title": "", "items": [{"title": "Aska Adventure Area", "html": "<p><strong>(More Difficult)<\/strong><\/p><p>The Aska Adventure Area is a 17-mile hiking and mountain biking trail system on National Forest land near Deep Gap on Aska Road, about 5 miles south of downtown Blue Ridge. Trails range from 1 to about 5.8 miles, climb to nearly 3,200 feet and drop down to the shores of Lake Blue Ridge. Open year-round; main parking is at the Deep Gap lot on Aska Road.<\/p><p><a href=\"https://blueridge-2022.s3.amazonaws.com/images/Maps-Self-Guided-Tours/5-Aska-Trail-System-Hiking-and-Mountain-Biking-PDF-combined.pdf\">Download the Aska Trail System map (Fannin County Chamber)<\/a><\/p>", "photo": "8a4f54a70684ccb8544674dc0c1ecded.jpg", "loc": [34.816556, -84.29956], "pin": "hiking", "id": "aska-adventure-area"}, {"title": "Bear Creek Trail (Mountain Biking & Hiking)", "html": "<p>Trailhead: end of Forest Service Road 241 off Gates Chapel Rd, west of Ellijay<br>Phone: (706) 695-6736 (Conasauga Ranger District, Chattahoochee-Oconee National Forest)<br>Info: <a href=\"https://www.fs.usda.gov/r08/chattahoochee-oconee/recreation/trails/bear-creek-trail\">USFS Bear Creek Trail page<\/a><\/p><p>A favorite with mountain bikers and hikers. The Outer Loop is about 6.7 miles and the Lower Loop about 3 miles, with stream crossings, narrow tread and some steep sections (moderate). Both pass the Gennett Poplar, a giant old-growth tulip poplar right beside the trail. Free; no water at the trailhead.<\/p>", "loc": [34.819973, -84.565002], "pin": "outdoors", "photoHidden": "67dc7943207c41a42289f0816de7ecff.jpg", "id": "bear-creek-trail-mountain-biking-hiking"}, {"title": "Biking Routes & Access Points", "html": "<p>The biking routes of Fannin County are some of the most varied in North Georgia: two-lane paved roads, all-weather Forest Service gravel roads and singletrack wind throughout the area. The Fannin County Chamber's <a href=\"https://blueridge-2022.s3.amazonaws.com/images/Maps-Self-Guided-Tours/4-Area-Biking-Routes-Access-Points-and-Rides-PDF-combined.pdf\">Biking Routes &amp; Access Points guide<\/a> shows access points and suggested rides.<\/p><p>Popular singletrack nearby includes the Aska Trails and Fightingtown Creek Nature Park (both listed in this guide).<\/p>", "loc": [34.870291, -84.319379], "pin": "sightseeing", "photoHidden": "b72be423c7e7a44b72d20d904d34b1ef.jpg", "id": "biking-routes-access-points"}, {"title": "Carters Lake Trails", "html": "<p>Info: <a href=\"https://www.recreation.gov/gateways/443\">Carters Lake (U.S. Army Corps of Engineers)<\/a><br>Phone: (706) 334-2248 (Carters Lake Project Office)<br>Location: Carters Lake, between Ellijay and Chatsworth<\/p><p>Georgia's deepest mountain lake has peaceful lakeside hiking and biking. The Hidden Pond Trail and Big Acorn Trail are family-friendly, and longer trails explore the shoreline and woods. Some Corps parks close seasonally, so call ahead in the off-season.<\/p>", "photo": "e587a371039250d20db0ef5e5371e59c.jpg", "loc": [34.613365, -84.687618], "pin": "outdoors", "id": "carters-lake-trails"}, {"title": "Fall Branch Falls Trail", "html": "<p><strong>(Least Difficult)<\/strong><\/p><p>This short, beginner-friendly adventure on the Benton MacKaye Trail explores a scenic, lush forest and visits one of Georgia’s most beautiful waterfalls. While the hike to Fall Branch Falls is nearly all uphill, and mildly challenging, it’s well worth the effort: the waterfall’s double cascades are simply beautiful, framed in gnarly-branched rhododendron and mossy, blocky rocks. It’s one of the top easy hikes near <a href=\"https://www.atlantatrails.com/blue-ridge-georgia/\">Blue Ridge<\/a>, thanks to its relatively short distance and wonderfully scenic beauty. Mossy forest, a clear mountain trout stream, and abundant sweet-smelling Georgia forest air are all highlights on this great hike, not to mention the beautiful waterfall.<\/p><p>Read More <a href=\"https://www.atlantatrails.com/hiking-trails/fall-branch-falls-benton-mackaye-trail/\">Here<\/a><\/p>", "loc": [34.786649, -84.305805], "pin": "hiking", "photoHidden": "5665d620b45abc279f7f6e1baff69615.jpg", "id": "fall-branch-falls-trail"}, {"title": "Hemp Top Trail", "html": "<p><strong>(Most Difficult)<\/strong><\/p><p>Hemp Top Trail follows an old road north from the Dally Gap trailhead (Forest Service Road 22) along a ridge through the Cohutta Wilderness toward Big Frog Mountain at the Tennessee line. Out-and-back hikes run up to about 12 miles, with spring wildflowers and connections to the Penitentiary Branch and Jacks River trails. Best from spring through fall; roads are gravel and cell service is unreliable.<\/p><p>Info: <a href=\"https://www.fs.usda.gov/r08/chattahoochee-oconee/recreation/cohutta-wilderness-trailheads\">Cohutta Wilderness trailheads (USFS)<\/a> | Conasauga Ranger District: (706) 695-6736<\/p>", "photo": "05176ea8d148ce34cd02323bcde8a806.jpg", "loc": [34.933413, -84.51854], "pin": "hiking", "id": "hemp-top-trail"}, {"title": "Jacks River Trail", "html": "<p><strong>(Most Difficult)<\/strong><\/p><p>The Jacks River Trail runs about 16.5 miles through the rugged, remote Cohutta Wilderness, following its namesake river through a lush, waterfall-filled valley with dozens of river crossings (some can be waist-deep; avoid after heavy rain). The highlight is Jacks River Falls, where the river tumbles over a huge rock outcrop into deep pools. The eastern end starts at Dally Gap (Forest Service Road 22); the shortest route to the falls is the Beech Bottom Trail from the Tennessee side.<\/p><p>Good to know: the Beech Bottom / Jacks River Falls area is day-use only from April 1 to October 31, and campfires and alcohol are banned there year-round.<\/p><p>Info: <a href=\"https://www.fs.usda.gov/r08/chattahoochee-oconee/recreation/cohutta-wilderness-trailheads\">Cohutta Wilderness trailheads (USFS)<\/a> | Read more on <a href=\"https://www.atlantatrails.com/hiking-trails/hiking-jacks-river-falls-trail-splashing-through-the-cohutta-wilderness/\">Atlanta Trails<\/a><\/p>", "loc": [34.988387, -84.633324], "pin": "hiking", "photoHidden": "dbe1e72a4631dd629180d03d6a880e36.jpg", "id": "jacks-river-trail"}, {"title": "Ocoee Whitewater Center Trails", "html": "<p><strong>(More Difficult)<\/strong><\/p><p>The 1996 Olympic whitewater venue on the Ocoee River (Highway 64, Polk County, Tennessee) has 30+ miles of hiking and mountain biking trails, including the Bear Paw and Chestnut Mountain loops, Thunder Rock Express, the Old Copper Road Historic Trail and the riverside Rhododendron Trail. The visitor center building was destroyed by fire in 2022, but the grounds, trails and parking are open daylight hours year-round. Parking in the lower lot is $3 (free with a Cherokee National Forest or America the Beautiful pass). Vault toilets only; no drinking water.<\/p><p>More info: <a href=\"https://www.fs.usda.gov/r08/cherokee/recreation/ocoee-whitewater-center\">Ocoee Whitewater Center (USFS)<\/a><\/p>", "photo": "4cbc6cb19d4a664058b6733154146d00.jpg", "loc": [35.067183, -84.46157], "pin": "hiking", "id": "ocoee-whitewater-center-trails"}, {"title": "Pinhoti Trail", "html": "<p>Website: <a href=\"https://www.pinhotitrailalliance.org/\">Pinhoti Trail Alliance<\/a><br>Phone: (706) 695-6736 (USFS Conasauga Ranger District)<\/p><p>The Pinhoti Trail runs about 335 miles from Flagg Mountain in Alabama to its northern end in Georgia, where it joins the Benton MacKaye Trail (which in turn links to the Appalachian Trail at Springer Mountain). Several access points lie west and north of Ellijay, including the Bear Creek and Mountaintown Creek areas. Great for hikers and mountain bikers looking for long, challenging backcountry days.<\/p>", "photo": "a806101569416792079a3e649410aea0.jpg", "id": "pinhoti-trail"}, {"title": "Toccoa River Swinging Bridge", "html": "<p><strong>(Easiest)<\/strong><\/p><p>This hike crosses the long cable swinging bridge over the Toccoa River on the Benton MacKaye Trail and explores a small waterfall on the opposite bank in a shady grove of hemlock, before an optional climb to a nearby summit. It's about 0.5 mile round trip to the bridge and back, or about 2 miles with the climb. The bridge is one of the longest swinging footbridges east of the Mississippi, and this is a must for families visiting Blue Ridge or Ellijay. The closest parking is at the end of Forest Service Road 816 off GA Hwy 60, about a quarter mile from the bridge; the gravel road is rough, so a higher-clearance vehicle helps.<\/p><p>Read more on <a href=\"https://www.atlantatrails.com/hiking-trails/toccoa-river-swinging-bridge-benton-mackaye-trail/\">Atlanta Trails<\/a><\/p>", "loc": [34.736836, -84.167237], "pin": "hiking", "photoHidden": "c3ec77f74bda1277917dede2a671e995.jpg", "id": "toccoa-river-swinging-bridge"}]}]}, "nature-parks": {"id": "nature-parks", "title": "Nature + Parks", "icon": "trees", "groups": [{"title": "", "items": [{"title": "Amicalola Falls State Park", "html": "<p>Website: <a href=\"https://gastateparks.org/AmicalolaFalls\">Georgia State Parks<\/a> | <a href=\"https://amicalolafallslodge.com/\">Lodge at Amicalola Falls<\/a><br>Phone: (706) 344-1500<br>Location: 418 Amicalola Falls State Park Rd, Dawsonville, GA 30534<\/p><p>Home to Georgia's tallest waterfall (729 feet), this park has several scenic trails, from an accessible path to a falls viewpoint to a long staircase up the falls. The Len Foote Hike Inn, a backcountry lodge, is about a 5-mile hike away, and the Appalachian Trail Approach Trail starts here (about 8.5 miles to Springer Mountain). Waterfalls and mountain views make it a show-stopper.<\/p><p>Good to know:<\/p><ul><li>Parking: a $10 daily Georgia State Parks ParkPass per vehicle (annual pass accepted). The Hike Inn has separate fees and reservations.<\/li><li>Trails: short accessible and staircase routes to the falls<\/li><li>Pets: leashed pets are welcome on park trails.<\/li><\/ul>", "photo": "c5f4e16d3f9fcc8c0964ee5915f97248.jpg", "loc": [34.576034, -84.236713], "pin": "sightseeing", "id": "amicalola-falls-state-park"}, {"title": "Cohutta Overlook", "html": "<p>Location: GA Hwy 52 between Ellijay and Fort Mountain State Park (Chattahoochee National Forest)<br>Phone: (706) 695-6736 (USFS Conasauga Ranger District)<\/p><p>A roadside Forest Service overlook with sweeping views across the mountains toward the Cohutta Wilderness. You can see the view from the paved pull-off, so it's perfect for sunrise watchers, photographers, or anyone who wants a skyline view without breaking a sweat. Pair it with a visit to Fort Mountain State Park just down the road.<\/p>", "photo": "52c1677dec2c148001b8819e8b9bef6e.jpg", "loc": [34.785385, -84.626931], "pin": "other", "id": "cohutta-overlook"}, {"title": "Fightingtown Creek Nature Park", "html": "<p>Website: <a href=\"https://stpal.org/our-places/fightingtowncreek/\">Southeastern Trust for Parks and Land<\/a><br>Location: 1200 Cedar Valley Rd, Blue Ridge, GA 30513 (about 3 miles west of downtown Blue Ridge)<\/p><p>About 190 acres with roughly 12 miles of free natural-surface trails for hiking and mountain biking, built for flowy fun. Loops include the Laurel Loop (3.5 mi), Creek Loop (3.3 mi), Lower Prince Loop (1.6 mi) and Upper Prince Loop (2 mi), which has a seasonal view from Prince Mountain. Some trails are directional for bikes on alternating days, so check the signs at the trailhead.<\/p><p>Great for: mountain bikers, hikers, free outdoor recreation.<\/p>", "loc": [34.869538, -84.406135], "pin": "outdoors", "photoHidden": "b8dbb791a32903a0941d9cb513a2b121.jpg", "id": "fightingtown-creek-nature-park"}, {"title": "Fort Mountain State Park", "html": "<p>Website: <a href=\"https://gastateparks.org/FortMountain\">Georgia State Parks<\/a><br>Phone: (706) 422-1932 (Park Office)<br>Location: 181 Fort Mountain Park Rd, Chatsworth, GA 30705 (on GA Hwy 52 west of Ellijay)<\/p><p>A 4,000-acre mountaintop park with forested trails, a mysterious 855-foot ancient stone wall, a stone CCC fire tower, and a 17-acre lake with a sandy beach. Hiking, mountain biking, fishing, camping and cottages make Fort Mountain a full-day outdoor escape steeped in history and big views. Park hours are 7 a.m. to 10 p.m.<\/p><p>Good to know:<\/p><ul><li>Parking: a $10 daily Georgia State Parks ParkPass per vehicle (annual pass accepted).<\/li><li>Leashed dogs are welcome on trails.<\/li><li>Swimming: the lake beach is open seasonally in summer.<\/li><\/ul>", "photo": "971f9653ff76a5b0a63730fc1e2a4f3c.jpg", "loc": [34.760699, -84.69515], "pin": "outdoors", "id": "fort-mountain-state-park"}, {"title": "Harrison Park (Ellijay)", "html": "<p>Facebook: <a href=\"https://www.facebook.com/harrisonparkellijay/\">Friends of Harrison Park<\/a><br>Location: Downtown Ellijay, along the Ellijay River (parking off McCutchen St)<\/p><p>A peaceful 26-acre city park a short walk from the downtown square, with gravel walking trails, a historic barn and corn crib, a wildflower meadow, benches, picnic tables and restrooms. Leashed dogs welcome.<\/p><p>Great for: families, dog walks, easy strolls, community events and sunsets by the river.<\/p>", "photo": "d50cb983ca51df0a9d6ca00c1f4f2a96.jpg", "loc": [34.697354, -84.474985], "pin": "outdoors", "id": "harrison-park-ellijay"}, {"title": "Ralston River Park (Ellijay)", "html": "<p>Location: S. Main St. (Old Hwy 5), Ellijay, along the Coosawattee River<br>Phone: (706) 635-7700 (Gilmer County Recreation Department)<\/p><p>Gilmer County's riverside park (formerly called River Park) has a walking path, a playground, tennis courts and ballfields, and hosts community events through the year.<\/p><p>Great for: families, an easy stroll by the river.<\/p>", "photoHidden": "c827498effccbf7e30d6d091581aa3f2.jpg", "id": "ralston-river-park-ellijay"}]}, {"title": "Parks and Playgrounds", "items": [{"title": "Downtown Blue Ridge", "html": "<p><strong>Downtown Blue Ridge Playground<\/strong><\/p><p>A fenced city playground on W. Main St, across from the Fannin County Courthouse and steps from downtown shops and the train depot.<\/p>", "photo": "1cd7dfabeded899aef496d4707a828ff.jpg", "loc": [34.863811, -84.325505], "pin": "parks_and_nature", "id": "downtown-blue-ridge"}]}]}, "shopping": {"id": "shopping", "title": "Shopping", "icon": "shopping-bag", "groups": [{"title": "", "items": [{"title": "Amish Home Furniture (formerly Beds Etc.)", "html": "<p>Handcrafted, solid-wood Amish furniture built for mountain homes: live-edge tables, rustic log bedroom sets and custom heirloom pieces, plus outdoor poly furniture. Visit the showroom on the downtown square.<\/p><p><strong>Address:<\/strong> 10 Northside Square, Ellijay, GA 30540<br><strong>Phone:<\/strong> 706-222-7252<\/p><p><a href=\"https://amishhomefurniture.com/\">amishhomefurniture.com<\/a><\/p>", "photo": "b8d982b4b9413301261a03bebab621ca.jpg", "loc": [34.695303, -84.482537], "pin": "retail_therapy", "id": "amish-home-furniture-formerly-beds-etc"}, {"title": "Antiques on North Main", "html": "<p>A treasure trove of imported English antiques, including fine porcelain, majolica, Tiffany-style stained glass, vintage tools, estate jewelry and more. A haven for collectors and decorating enthusiasts, and a stop on the Ellijay Antiques Trail.<\/p><p><strong>Address:<\/strong> 44 North Main St, Ellijay, GA 30540<br><strong>Phone:<\/strong> 706-698-1950<\/p><p><a href=\"https://www.facebook.com/AntiquesonNorthMainEllijayGA/\">Antiques on North Main on Facebook<\/a><\/p>", "photo": "5f13441fff6cd9d47cb36a5ef32d8b1a.jpg", "loc": [34.694998, -84.482259], "pin": "souvenirs", "id": "antiques-on-north-main"}, {"title": "Artful Ellijay", "html": "<p>A family- and veteran-owned home décor and design store in downtown Ellijay, with a large showroom of curated furniture, décor, local artisan goods and their own \"LIJ\" Ellijay merchandise. A great stop for artful souvenirs with a meaningful connection to the region.<\/p><p><strong>Address:<\/strong> 10 North Main Street, Ellijay, GA 30540<br><strong>Phone:<\/strong> 877-244-7755<\/p><p><a href=\"https://artfulellijay.com/\">artfulellijay.com<\/a><\/p>", "photo": "799521e2d41f8f1049606db7bc538fa4.jpg", "loc": [34.695251, -84.482494], "pin": "retail_therapy", "id": "artful-ellijay"}]}]}, "spas-salons": {"id": "spas-salons", "title": "Spas + Salons", "icon": "sparkles", "groups": [{"title": "", "items": [{"title": "Art Works Salon & Day Spa", "html": "<p>A salon and day spa in Ellijay offering facials (including organic plant-based, collagen, oxygen and HydraFacial treatments), hot stone treatments, microdermabrasion, therapeutic massage, body treatments and natural nail care.<\/p><p><strong>Phone:<\/strong> 706-635-2781<\/p><p><a href=\"https://dayspaellijay.com/\">dayspaellijay.com<\/a><\/p>", "photo": "752588cdee08641040ab3bfdb926e98a.jpg", "loc": [34.68726, -84.484661], "pin": "spa_beauty", "id": "art-works-salon-day-spa"}, {"title": "Heaven Sent Massage of Ellijay", "html": "<p>Leslie Byrd, LMT, offers Swedish and therapeutic massage, cranio-sacral therapy, manual lymphatic drainage, reflexology and spa packages, with an emphasis on relaxation and healing for body, mind and spirit.<\/p><p><strong>Address:<\/strong> Vanity Salon Suites, Clocktower Center, 772 Maddox Drive, Suite 106, East Ellijay, GA 30540<br><strong>Phone:<\/strong> 706-889-3516<\/p><p>By appointment only. Book on <a href=\"https://heavensentmassage.today/\">their website<\/a>.<\/p>", "photo": "d379b2707bb0b61db6bb83f2167acc62.jpg", "loc": [34.679443, -84.484291], "pin": "hairdresser", "id": "heaven-sent-massage-of-ellijay"}, {"title": "Serenity in the Mountains", "html": "<p>Serenity in the Mountains is a full-service day spa just off Highway 515, about five minutes from downtown Blue Ridge. Choose from massages, facials and skin care, body treatments, nails, a salt cave and med-spa services, then grab a bite at the on-site Serenity Cafe. Spa guests can also book their Luxury Suites.<\/p><p><strong>Address:<\/strong> 59 McKinney Road, Blue Ridge, GA 30513<br><strong>Phone:<\/strong> 706-258-2244<\/p><p>Closed Sundays. Book on <a href=\"https://serenityinthemountains.com/\">their website<\/a>.<\/p>", "photo": "2c024a34faa2a83dd0adbc7174b66935.jpg", "loc": [34.881752, -84.293025], "pin": "spa_beauty", "id": "serenity-in-the-mountains"}]}]}, "tours": {"id": "tours", "title": "Take A Tour", "icon": "train-front", "groups": [{"title": "", "items": [{"title": "Blue Ridge Mountain Food Tours", "html": "<p>If you love eating and exploring, these guided walking food tours of downtown Blue Ridge are a tasty way to spend an afternoon. Tours last about 2.5 to 3 hours with 4-5 stops at local restaurants, food shops and eateries, about 3/4 mile of walking, and small groups (up to 12). Choose the savory Fabulous Foodie Tour or the dessert-focused Sugar High Tour.<\/p><p>Your local guide shares fun facts and history about Blue Ridge, and you'll meet the chefs and owners who helped revive downtown.<\/p><p><a href=\"https://blueridgemountainfoodtours.com/\">blueridgemountainfoodtours.com<\/a> | 706-455-4812<\/p>", "photo": "618e14d80829497b6d8f00774a51f877.jpg", "loc": [34.866514, -84.323454], "pin": "entertainment_and_activities", "id": "blue-ridge-mountain-food-tours"}, {"title": "Blue Ridge Scenic Railway", "html": "<p>Starting at the historic depot at 241 Depot St in downtown Blue Ridge, the Extended ride is a four-hour, 26-mile round trip along the Toccoa River. The first hour takes you to the sister towns of McCaysville, Georgia and Copperhill, Tennessee, which straddle the state line. You get a two-hour layover to explore before the one-hour ride back to Blue Ridge. A 2-hour Express ride (no layover) runs on select dates, and holiday trains run in late November and December.<\/p><p>The railway runs year-round on a seasonal schedule. Book tickets in advance at <a href=\"https://brscenic.com/\">brscenic.com<\/a> or call (877) 413-8724.<\/p>", "photo": "6688a962026b51dc0cb1c6d689b05e23.jpg", "loc": [34.865533, -84.324726], "pin": "sightseeing", "id": "blue-ridge-scenic-railway"}, {"title": "Downtown Blue Ridge Historic Walking Tour", "html": "<p>Blue Ridge was founded in 1886 when the Marietta and North Georgia Railroad arrived, and it soon grew into a busy business center; in 1895 the county seat moved here from Morganton. The town was once known as a health resort thanks to its mineral springs. Visitors rode the train in, dined at the Blue Ridge Hotel and strolled to the springs after dinner. At different times downtown had five hotels and several boarding houses.<\/p><p>Today you can still ride the train and stroll Main Street and the side streets, enjoying antique and specialty shops, galleries, restaurants and small-town charm. The self-guided tour covers 20 historic stops, including the Fannin County Courthouse, the train depot and the old theatres.<\/p><p><a href=\"https://blueridge-2022.s3.amazonaws.com/images/Maps-Self-Guided-Tours/8-Heritage-Downtown-combined.pdf\">Download the walking tour map (Fannin County Chamber)<\/a><\/p>", "photo": "897d4822c8c2e324dc4190068999a745.jpg", "loc": [34.867004, -84.324938], "pin": "museums", "id": "downtown-blue-ridge-historic-walking-tour"}, {"title": "Ellijay Excursions", "html": "<p><a href=\"https://ellijayexcursions.com/\">ellijayexcursions.com<\/a> | (678) 622-0302<\/p><p>Ellijay Excursions runs guided wine tours through the rolling hills and vineyards around Ellijay, North Georgia's wine country. Join a scheduled tour for couples and small parties, or book a private custom tour for your group (weekend group tours require a deposit). Tours generally last 4 to 6 hours, and they handle the driving so you can relax and enjoy the tastings. Note: tastings are purchased at the wineries.<\/p>", "photo": "168477214a4ac589760c1727d0684bc8.jpg", "id": "ellijay-excursions"}, {"title": "Grape Escape Wine Adventures", "html": "<p>Based in Blue Ridge, Grape Escape Wine Adventures runs all-inclusive shuttle wine tours: meet in downtown Blue Ridge, enjoy lunch at a local spot, then visit three wineries in the Blue Ridge and Ellijay area, all for one price. Public tours depart Friday and Saturday mornings (reservations required); private group tours are available on request.<\/p><p>Book at <a href=\"https://grapeescapeadventures.com/\">grapeescapeadventures.com<\/a> | (706) 686-5045<\/p>", "loc": [34.863972, -84.324087], "pin": "vineyard", "photoHidden": "268cdeebea74384fad4b803cbe6047bc.jpg", "id": "grape-escape-wine-adventures"}, {"title": "Mountains & Countryside - Driving", "html": "<p>Blue Ridge is a perfect place to see brilliant fall colors, spring blooms or quiet winter ridgelines from the car. The Fannin County Chamber's self-guided Mountains &amp; Countryside driving tour winds through rolling farmland and mountain scenery, with stops at the Aska Trails, the Toccoa River and more.<\/p><p><a href=\"https://blueridge-2022.s3.amazonaws.com/images/Maps-Self-Guided-Tours/1-Mountains-and-Countryside-combined.pdf\">Download the self-guided scenic driving tour<\/a><\/p><p>Start: intersection of GA Hwy 5 and Hwy 515/US 76 in Blue Ridge; the first stop is the Aska Trails on Aska Road.<\/p>", "photo": "4db463ffd968f31df692d51ed18a6a26.jpg", "loc": [34.871939, -84.307772], "pin": "sightseeing", "id": "mountains-countryside-driving"}, {"title": "North Georgia Wine Tours", "html": "<p><a href=\"https://www.northgawinetours.com/\">northgawinetours.com<\/a> | (706) 725-0049<\/p><p>Private winery transportation for groups, bachelorette parties and special occasions, covering Ellijay, Dahlonega and other North Georgia wine areas. Tell them your pick-up and drop-off location and they build a day around three wineries and handle the reservations, so nobody has to plan or drive. Request a custom quote on their website.<\/p>", "photo": "bc482e476882a0652d85469edbf86015.jpg", "id": "north-georgia-wine-tours"}]}]}, "random-recommendations": {"id": "random-recommendations", "title": "Things To Do", "icon": "map-pin", "groups": [{"title": "Events and Festivals", "items": [{"title": "Annual Festivals", "html": "<p>The Fannin County Chamber of Commerce keeps a list of the area's annual festivals and events. Year-round favorites include the Fire &amp; Ice Chili Cookoff (Presidents' Day weekend), Arts in the Park (Memorial Day weekend and October), the Blue Ridge Blues &amp; BBQ Festival (September), and Light Up Blue Ridge &amp; the Christmas Parade (Saturday after Thanksgiving).<\/p><p><a href=\"https://www.blueridgemountains.com/events/annual-events/\">Blue Ridge annual events and festivals<\/a><\/p>", "photo": "8f90ec21812bf8691d955bcc83bbfe81.jpg", "id": "annual-festivals"}, {"title": "Upcoming Events", "html": "<p>See what's happening around Blue Ridge, McCaysville and the rest of Fannin County during your stay on the Chamber of Commerce events calendar.<\/p><p><a href=\"https://www.blueridgemountains.com/events/\">Blue Ridge events calendar<\/a><\/p>", "photo": "ae27c3c1ed084cfb248a3b571f66d25b.jpg", "id": "upcoming-events"}]}, {"title": "For The Adults!", "items": [{"title": "Escape Blue Ridge (Escape Rooms)", "html": "<p>Do you have what it takes to escape? Escape Blue Ridge has several themed rooms, including Prohibition: it's 1925, you and your team of investigators are cracking down on illegal liquor sales, and the evidence you need is locked inside the infamous Lucky Duck Speakeasy. A bomb has been set to destroy the building and its secrets. You have 60 minutes. Other rooms include Big Foot, Wizard School of Magic, Ring of the Lords and Black Beard's Brig.<\/p><p><strong>Address:<\/strong> 644 East Main Street, Blue Ridge, GA 30513 (downtown)<br><strong>Phone:<\/strong> 706-258-3803<\/p><p>Book ahead and check hours on <a href=\"https://www.escaperoomblueridge.com/\">their website<\/a>.<\/p>", "loc": [34.86736, -84.324663], "pin": "entertainment_and_activities", "photoHidden": "aab7ff1a721f094b8781b8f0e95dfacb.jpg", "id": "escape-blue-ridge-escape-rooms"}, {"title": "Horseback Riding", "html": "<p>Every mountain vacation should include a horseback ride. Fannin County has experienced guides and beautiful terrain, from creekside trails to mountain and river crossings, with rides suited to first-timers and seasoned riders alike.<\/p><p>Check out:<\/p><ul><li><strong>Cowgirl Up Stables<\/strong> &ndash; beginner-friendly guided trail rides. 327 Cashes Valley Rd, Cherry Log, GA 30522. 706-258-2276. <a href=\"https://www.cowgirlupstables.com/\">cowgirlupstables.com<\/a> (riders must be at least 6 years old).<\/li><li><strong>Blue Ridge Mountain Trail Rides at Hells Hollow<\/strong> &ndash; 1 to 2 hour rides plus sunset rides, open 7 days a week. 319 Hells Hollow Rd, Blue Ridge, GA 30513. 706-408-7433. <a href=\"https://www.blueridgemountaintrailrides.com/\">blueridgemountaintrailrides.com<\/a><\/li><\/ul><p>Reservations are recommended; call ahead if rain is in the forecast.<\/p>", "photo": "d9a0476f16782d0f0e73836cd644b9c8.jpg", "loc": [34.888305, -84.421047], "pin": "horse_riding", "id": "horseback-riding"}, {"title": "Tank Town USA", "html": "<p>At Tank Town USA you can drive a real tank, crush a car, operate a 40,000-pound excavator and even fire a machine gun. A great outing for special birthdays, group getaways and corporate events.<\/p><p>The tank course has plenty of bumps, dips and humps (and mud if it's rained recently), and a standard tank drive lets you bring along 3 passengers at no extra charge. The car-crush package gives you 25+ minutes of driving that ends with flattening a car under 17 tons of military steel.<\/p><p><strong>Address:<\/strong> 10408 Appalachian Hwy, Morganton, GA 30560<br><strong>Phone:<\/strong> 706-633-6072<\/p><p>Reservations are required; drivers must be at least 15 with a learner's permit. See packages and book on <a href=\"https://tanktownusa.com/\">their website<\/a>.<\/p>", "photo": "a2bd3a295c66741e727425423dfb5624.jpg", "loc": [34.88838, -84.221459], "pin": "entertainment_and_activities", "id": "tank-town-usa"}, {"title": "Zipline Canopy Tours of Blue Ridge", "html": "<p>Zipline Canopy Tours of Blue Ridge is set on 165 acres of North Georgia mountain property at 891 Old Cashes Valley Road, about 6 miles from downtown Blue Ridge. The one-hour tour has 7 ziplines (150 to 550 feet long, about half a mile of cable). The two-hour tour covers a full mile of cable with 13 ziplines up to 1,000 feet long and 25 to 75 feet high, plus sky bridges. All tours are guided and no experience is needed.<\/p><p><strong>Phone:<\/strong> 423-496-3388<\/p><p>Tours are limited in winter (groups of four or more can often be scheduled with a few days' notice). Note this is a different location from Blue Ridge Adventure Park. Book on <a href=\"https://www.zipblueridge.com/\">their website<\/a>.<\/p>", "photo": "c8d78b7bb7e8de58e1f132e07e699c95.jpg", "loc": [34.855611, -84.400513], "pin": "adventure_activities", "id": "zipline-canopy-tours-of-blue-ridge"}]}, {"title": "For The Kids!", "items": [{"title": "Expedition Bigfoot: The Sasquatch Museum", "html": "<p>This quirky museum is dedicated to Bigfoot/Sasquatch, with exhibits of reported encounters, witness testimony and evidence. It leaves the question of Bigfoot's existence up to you, so skeptics, believers and \"knowers\" are all welcome. A fun stop with kids.<\/p><p><strong>Address:<\/strong> 1934 Highway 515, Blue Ridge, GA 30513 (Cherry Log area)<br><strong>Hours:<\/strong> Open daily 10 AM to 5 PM (last admission 4:30 PM); closed Easter, Thanksgiving, Christmas Day and New Year's Day. No RV, trailer or bus parking.<\/p><p>Check admission and updates on <a href=\"https://www.expeditionbigfoot.com/\">their website<\/a>.<\/p>", "photo": "179db0ca7caebd3711fba506969420ed.jpg", "loc": [34.802257, -84.376186], "pin": "museums", "id": "expedition-bigfoot-the-sasquatch-museum"}, {"title": "Lilly Pad Village", "html": "<p>Lilly Pad Village offers safe, family-friendly fun in a scenic mountain setting in the Aska area, about 8 miles from downtown Blue Ridge. Go gem mining (covered), fish the fully stocked pond, and play a round of mini golf in the woods. Take a break at the shop for ice cream, snacks, and hot or cold drinks. Kids and pets are welcome.<\/p><p><strong>Address:<\/strong> 24 Adelaide Dr, Blue Ridge, GA 30513<br><strong>Phone:<\/strong> 706-534-1317<\/p><p>Hours change by season, and after-hours mini golf and fishing can be reserved. Check <a href=\"https://www.lillypadvillage.com/\">their website<\/a> before you go.<\/p>", "photo": "b64f4204538b760d75326cbf33840b96.jpg", "loc": [34.790655, -84.270916], "pin": "entertainment_and_activities", "id": "lilly-pad-village"}]}]}, "water-activities": {"id": "water-activities", "title": "Water Activities", "icon": "sailboat", "groups": [{"title": "Beaches", "items": [{"title": "Harris Branch Beach and Campground", "html": "<p>1300 Harris Branch Rd, Ellijay, GA 30540<br>Phone: (706) 334-2248 (Carters Lake Project Office, U.S. Army Corps of Engineers)<\/p><p>On the shore of Carters Lake, Harris Branch Park has a swimming beach, picnic areas and hiking trails, with a campground next door. The beach and day-use area are seasonal (summer) and closed in the off-season, so call or check <a href=\"https://www.recreation.gov/gateways/443\">Carters Lake on Recreation.gov<\/a> for this year's dates.<\/p>", "loc": [34.59717, -84.621399], "pin": "beaches", "photoHidden": "2e9dbf58ab804b6986beb7bb56754690.jpg", "id": "harris-branch-beach-and-campground"}, {"title": "Morganton Point Recreation Area", "html": "<p>Morganton Point Recreation Area sits on the shore of Lake Blue Ridge in Morganton. The Forest Service day-use area offers a designated swimming beach, picnicking, a boat ramp, fishing and short trails, plus a campground. Open year-round.<\/p><ul><li>Day-use fee: $5 per person (age 16+); boat launch $5<\/li><li>Campground: (706) 374-1645<\/li><\/ul><p><a href=\"https://www.fs.usda.gov/r08/chattahoochee-oconee/recreation/morganton-point-recreation-area\">Morganton Point Recreation Area (USFS)<\/a><\/p>", "photo": "f6734813453f6a53201daa079bf0d3b7.jpg", "loc": [34.868485, -84.249033], "pin": "swimming", "id": "morganton-point-recreation-area"}]}, {"title": "Boat Rentals", "items": [{"title": "Lake Blue Ridge Marina", "html": "<p>335 Marina Dr, Blue Ridge, GA 30513 | (706) 632-2618<\/p><p>Full-service marina on Lake Blue Ridge with boat sales, fuel and lake-day supplies. Rentals include pontoon boats, kayaks, canoes and paddleboards (summer is peak season, so reserve early). Fishing guide service is also offered. The on-site Boat Dock Bar &amp; Grill is open seasonally.<\/p><p>Off-season office hours are limited, so call ahead or check <a href=\"https://lakeblueridgemarina.com/\">lakeblueridgemarina.com<\/a>.<\/p>", "photo": "527d940eb0a6c2ff226591cedcb35b5a.jpg", "loc": [34.870569, -84.279811], "pin": "watersports", "id": "lake-blue-ridge-marina"}]}, {"title": "Boat Tours", "items": [{"title": "Rolling Thunder River Company", "html": "<p><strong>(Kid Friendly)<\/strong><\/p><p>Rolling Thunder River Company (since 1977) runs whitewater rafting on the Ocoee and Nantahala rivers and gentle tube, kayak and canoe floats on the Toccoa River. Their Ocoee/Toccoa base is at 20 Hughes St in McCaysville, about 15 minutes from Blue Ridge.<\/p><ul><li>Toccoa tubing: Memorial Day to Labor Day, weekends 10 a.m.-4 p.m., weather permitting; ages 5+<\/li><li>Ocoee rafting: ages 12+; Nantahala: ages 7+ (60 lb minimum)<\/li><li>Rafting: 1-800-408-7238 | Tubing/kayak: (706) 492-5720<\/li><\/ul><p>Seasons and trips change each year, so check <a href=\"https://www.rollingthunderriverco.com/\">rollingthunderriverco.com<\/a>.<\/p>", "photo": "d3ee67b5b2b80a5454e56ec973fa7cf9.jpg", "loc": [34.986862, -84.362006], "pin": "watersports", "id": "rolling-thunder-river-company"}]}, {"title": "Kayaks / Tubes / Paddleboard Rentals", "items": [{"title": "Blue Ridge Mountain Kayaking", "html": "<p>56 N River Rd, Mineral Bluff, GA 30559 | 706-258-2411<\/p><p>Located on the lower Toccoa River just below the Lake Blue Ridge dam. They rent kayaks, with a shuttle, for a 6-mile stretch of the lower Toccoa (launching on site and ending at Curtis Switch), an extended trip with optional fishing, and a shuttle for paddlers with their own kayaks.<\/p><p>Seasonal: summer season (the 2026 season ended in early September). Check <a href=\"https://blueridgemountainkayaking.com/\">blueridgemountainkayaking.com<\/a> for dates and booking.<\/p>", "photo": "84a9cbabeef0bf9ca0f412bc5a1cec79.jpg", "loc": [34.888554, -84.285812], "pin": "watersports", "id": "blue-ridge-mountain-kayaking"}, {"title": "Cartecay River Experience", "html": "<p>2400 Hwy 52 East, Ellijay, GA 30540 | 706-531-4746<br><a href=\"https://www.cartecayriverexperience.com/\">cartecayriverexperience.com<\/a><\/p><p>For a relaxed water day, Cartecay River Experience rents tubes and kayaks for floating the Cartecay River, with a shuttle bus included. Choose the Adventure River or the Lazy River float; shuttle-only service is available if you bring your own tube or kayak.<\/p><p>Seasonal: Memorial Day to Labor Day, weather permitting. Call ahead on holiday weekends or if the weather looks iffy.<\/p>", "photo": "64e8b655dc664a135f07781ed3a12bea.jpg", "loc": [34.68874, -84.467205], "pin": "boating", "id": "cartecay-river-experience"}]}]}, "waterfalls": {"id": "waterfalls", "title": "Waterfalls", "icon": "droplets", "groups": [{"title": "", "items": [{"title": "Amicalola Falls", "html": "<p>One of Georgia's most popular hikes, and for good reason: it's full of scenic beauty and a great workout too. Follow a loop to the top of Georgia's tallest waterfall (729 feet) at Amicalola Falls State Park near Dawsonville, and catch views of the distant, rolling Blue Ridge Mountains. From the crest of the falls, the route descends a long series of stairs and platforms with an up-close view of the falls and their tumbling mist. An accessible pathway also leads to a falls viewpoint.<\/p><p>A daily ParkPass ($10 per vehicle) is required.<\/p>", "loc": [34.567131, -84.244541], "pin": "hiking", "photoHidden": "858a4236fb378daeabda14660440e85f.jpg", "id": "amicalola-falls"}, {"title": "Emery Creek Falls", "html": "<p>Near Chatsworth in the Chattahoochee National Forest, the Emery Creek Trail follows lushly forested creek banks to a pair of beautiful, remote waterfalls. It's about 6 miles round trip with roughly 20 creek crossings (wet feet guaranteed), which makes it especially fun in summer. The trailhead is at the end of Holly Creek Road (Forest Service Road 18).<\/p>", "loc": [34.81214, -84.651977], "pin": "hiking", "photoHidden": "66ecfc2876d40ae65d2b8c98e3851777.jpg", "id": "emery-creek-falls"}, {"title": "Fall Branch Falls", "html": "<p>This short, beginner-friendly adventure on the Benton MacKaye Trail explores a scenic, lush forest and visits one of Georgia’s most beautiful waterfalls. While the hike to Fall Branch Falls is nearly all uphill, and mildly challenging, it’s well worth the effort: the waterfall’s double cascades are simply beautiful, framed in gnarly-branched rhododendron and mossy, blocky rocks. It’s one of the top easy hikes near Blue Ridge, thanks to its relatively short distance and wonderfully scenic beauty. Mossy forest, a clear mountain trout stream, and abundant sweet-smelling Georgia forest air are all highlights on this great hike, not to mention the beautiful waterfall.<\/p>", "loc": [34.786649, -84.305805], "pin": "hiking", "photoHidden": "eb15a337c76141bbf74b269c47381aaf.jpg", "id": "fall-branch-falls"}, {"title": "Jacks River Falls", "html": "<p>Enormous, thundering and rugged, Jacks River Falls is one of the most beautiful waterfalls in the South and one of Georgia's top hiking destinations. It's deep in the wild, remote Cohutta Wilderness, where the nearly crystal-clear Jacks River crashes over a huge rock outcrop into deep pools below. Getting there is a full-day hike: the shortest route is the Beech Bottom Trail from the Tennessee side; from Georgia, hikers come in from Dally Gap via the Hemp Top, Penitentiary Branch and Jacks River trails.<\/p><p>The falls area is day-use only from April 1 to October 31; campfires and alcohol are banned there year-round. Cell service is unreliable, so leave a trip plan with someone. Info: <a href=\"https://www.fs.usda.gov/r08/chattahoochee-oconee/recreation/cohutta-wilderness-trailheads\">Cohutta Wilderness trailheads (USFS)<\/a><\/p>", "loc": [34.971911, -84.572442], "pin": "hiking", "photoHidden": "1e1e9b4a153fb91f0fc7680e59941bb2.jpg", "id": "jacks-river-falls"}, {"title": "Long Creek Falls", "html": "<p>Follow a short stretch of the Appalachian Trail (shared here with the Benton MacKaye Trail) from the creek valley at Three Forks in Fannin County, climbing gently to a series of tumbling cascades on Long Creek. The hike ends at the base of a roughly 50-foot waterfall shaded by tall hemlocks, with boulders that make a perfect mid-hike rest stop. Three Forks is on Forest Service Road 58 (gravel).<\/p>", "loc": [34.66373, -84.18383], "pin": "hiking", "photoHidden": "de8679e3eb6baf233c4ca58292782233.jpg", "id": "long-creek-falls"}, {"title": "Noontootla Falls", "html": "<p>A tiered waterfall on Noontootla Creek in the Chattahoochee National Forest, reached by a short, easy walk off Forest Service Road 58 (gravel; a higher-clearance vehicle helps after heavy rain). Parking is limited roadside, so don't block the road. Rocks near the falls are slippery. Leashed dogs are welcome. Noontootla Creek is also a well-known trout stream with special fishing regulations.<\/p>", "photo": "7bc83ea728168147241c4f04873ca5c9.jpg", "loc": [34.685921, -84.193804], "pin": "hiking", "id": "noontootla-falls"}]}]}, "weather": {"id": "weather", "title": "Weather", "icon": "cloud-sun-rain", "groups": [{"title": "", "items": [{"title": "Ellijay Weather", "html": "<p>For the most up-to-date forecast, check the <a href=\"https://forecast.weather.gov/MapClick.php?lat=34.6948&amp;lon=-84.4827\">National Weather Service forecast for Ellijay<\/a>.<\/p><p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say, \"There is no such thing as bad weather, just inappropriate clothing.\"<\/p>", "photo": "c23f2b1538c687cfdd797741fd258b63.jpg", "id": "ellijay-weather"}, {"title": "Weather", "html": "<p>For the most up-to-date forecast, check <a href=\"https://weather.com/us/georgia/city/blue-ridge/today\">Blue Ridge weather<\/a> or <a href=\"https://weather.com/us/georgia/city/ellijay/today\">Ellijay weather<\/a>, or the <a href=\"https://forecast.weather.gov/MapClick.php?lat=34.8640&amp;lon=-84.3241\">National Weather Service forecast<\/a>. Mountain weather can change quickly and is often cooler at higher elevations.<\/p><p>Remember, the weather person is the only one who can be wrong and still keep their job. We like to say \"there is no such thing as bad weather, just inappropriate clothing.\"<\/p>", "photo": "de97f9f60bbe88efa21f12f50ede943f.jpg", "id": "weather"}]}]}}, "signinUrl": "https://script.google.com/macros/s/AKfycbyH0rEgRqprQRh7Kf4lDv1QUssPA7z4Jn7Od_cEGJWa8_TH9UwK0W4EjdJCiB6EX5DlMg/exec"}</script>
